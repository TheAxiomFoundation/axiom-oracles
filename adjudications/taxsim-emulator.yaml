      path: data/corpus/provisions/us/statute/2026-07-13-recovery-r2026-07-15-self-contained-r2026-07-17-dedup.jsonl
      sha256: 03ddda0b2bcd59345ec4efa1daaf1c77b423a5166852fd80bb4cf00c0bd8e461
    citation_path: us/statute/26/1411
    heading: Imposition of tax
    excerpt: (c) Net investment income For purposes of this chapter— (1) In general The term “net investment
      income” means the excess (if any) of— (A) the sum of— (i) gross income from interest, dividends,
      annuities, royalties, and rents, other than such income which is derived in the ordinary course
      of a trade or business not described in paragraph (2), (ii) other gross income derived from a trade
      or business described in paragraph (2), and (iii) net gain (to the extent taken into account in
      computing taxable income) attributable to the disposition of property other than property held in
      a trade or business not described in paragraph (2), over (B) the deductions allowed by this subtitle
      which are properly allocable to such gross income or net gain. (2) Trades and businesses to which
      tax applies A trade or business is described in this paragraph if such trade or business is— (A)
      a passive activity (within the meaning of section 469) with respect to the taxpayer, or (B) a trade
      or business of trading in financial instruments or commodities (as defined in section 475(e)(2)).
      (3) Income on investment of working capital subject to tax A rule similar to the rule of section
      469(e)(1)(B) shall apply for purposes of this subsection. (4) Exception for certain active interests
      in partnerships and S corporations In the case of a disposition of an interest in a partnership
      or S corporation— (A) gain from such disposition shall be taken into account under clause (iii)
      of paragraph (1)(A) only to the extent of the net gain which would be so taken into account by the
      transferor if all property of the partnership or S corporation were sold for fair market value immediately
      before the disposition of such interest, and (B) a rule similar to the rule of subparagraph (A)
      shall apply to a loss from such disposition. (5) Exception for distributions from qualified plans
      The term “net investment income” shall not include any distribution from a plan or arrangement described
      in section 401(a), 403(a), 403(b), 408, 408A, or 457(b). (6) Special rule Net investment income
      shall not include any item taken into account in determining self-employment income for such taxable
      year on which a tax is imposed by section 1401(b).
    applies_to: Individuals; paragraphs (a)(1), (b), (c) and (d). Estates/trusts in (a)(2) are outside
      the benchmark. Historical applicability to 2021–2025 has not been established.
