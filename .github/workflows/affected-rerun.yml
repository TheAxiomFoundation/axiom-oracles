name: Affected suite rerun

# Reruns ONLY the comparison suites whose rules have changed since their report
# was last generated, on a 6-hourly cadence (plus repository_dispatch, so a
# rulespec repo can trigger it on push). The weekly full matrix
# (comparisons.yml) is only a CI signal: it uploads reports as artifacts and
# never commits them. This workflow is what keeps the committed reports fresh,
# without paying for the whole matrix every 6 hours. Suites whose
# map entry has `name: null` (parameter suites, and suites declaring
# `ci: manual`) are reported as awaiting the manual lane, never dispatched.
# Suites declaring `ci: snap-qc-replay` (the SNAP QC replays, which these bare
# runners could only re-emit) go to the snap-qc-replay job instead: it calls
# snap-qc-replay.yml, which provisions the pinned engine, a rulespec-us
# checkout, and the pinned QC file, and snap-qc-commit commits each report
# that replay proved live and exact.
#
# Selection is deterministic and committed:
#   comparisons/affected_map.json   suite → affected rulespec repos
#   report provenance.rulespecs     the SHA each report last ran against
#   scripts/select_affected_suites  diffs current repo HEADs vs those SHAs
#
# Each matrix job commits its refreshed report via
# scripts/commit_refreshed_report.sh, which atomically regenerates every
# derived, CI-validated artifact (dispositioned reports + the EUROMOD-BE
# coverage rollup, conformance scoreboard + detail + history snapshot,
# burn-down, freshness), self-checks the tree against ci.yml's
# staleness gates, and rebuilds the commit from scratch on the current tip on
# every push attempt so concurrent sibling pushes can't leave main stale or
# conflicted. The ratchet (conformance/ratchet.yaml) is never re-pinned from
# this bot path — re-pinning after a genuine improvement stays a deliberate
# human action, and a genuine regression is MEANT to fail ci.yml's ratchet
# gate on main. A leg whose runner marks its output as a re-emission
# (provenance.reemitted_report) never replaces a committed report from a real
# run: run_comparison.py leaves that copy untouched, and the commit script
# re-checks every push attempt's tip (scripts/guard_reemitted_reports.py).
#
# See scripts/select_affected_suites.py and comparisons/README.md.

on:
  workflow_dispatch:
    inputs:
      force_all:
        description: >-
          Rerun every CI-runnable mapped suite regardless of freshness
          (suites without a CI-runnable registry name are reported, not
          dispatched)
        required: false
        default: "false"
  repository_dispatch:
    types: [rulespec-updated]
  schedule:
    # Every 6 hours, offset from the weekly Monday 06:00 full matrix.
    - cron: "30 */6 * * *"

permissions:
  contents: read

concurrency:
  group: affected-rerun
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
      snap_qc: ${{ steps.select.outputs.lane_snap_qc_replay }}
      snap_qc_count: ${{ steps.select.outputs.lane_snap_qc_replay_count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Resolve affected rulespec repo HEADs
        id: heads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Union every repo named in the affected map, then ask the GitHub API
          # for each one's default-branch HEAD. Repos the token can't read are
          # simply omitted (the selector treats a missing HEAD as "cannot prove
          # stale", so the weekly matrix still covers them).
          python3 - <<'PY' > repos.txt
          import json
          from pathlib import Path
          m = json.loads(Path("comparisons/affected_map.json").read_text())
          repos = sorted({r for e in m["suites"] for r in e.get("repos", [])})
          print("\n".join(repos))
          PY
          echo "{}" > heads.json
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          heads = {}
          for repo in Path("repos.txt").read_text().split():
              try:
                  out = subprocess.run(
                      ["gh", "api", f"repos/{repo}", "--jq", ".default_branch"],
                      capture_output=True, text=True, check=True,
                  ).stdout.strip()
                  sha = subprocess.run(
                      ["gh", "api", f"repos/{repo}/commits/{out}", "--jq", ".sha"],
                      capture_output=True, text=True, check=True,
                  ).stdout.strip()
                  if sha:
                      heads[repo] = sha
              except subprocess.CalledProcessError:
                  print(f"skip {repo}: not readable with this token")
          Path("heads.json").write_text(json.dumps(heads, indent=2))
          print(json.dumps(heads, indent=2))
          PY

      - name: Select stale-affected suites
        id: select
        # One code path for both modes: the selector validates the map's
        # dispatch names (registry name or explicit null — anything else
        # fails loudly), dedups, and emits matrix/count/manual_count/manual
        # as $GITHUB_OUTPUT lines. Dispatching dashboard suite keys or
        # parameter-lane names crashed ~50 legs/run with "unknown comparison".
        run: |
          args=(--heads-json heads.json --format github)
          if [ "${{ inputs.force_all }}" = "true" ]; then
            args+=(--force-all)
          fi
          python3 scripts/select_affected_suites.py "${args[@]}" >> "$GITHUB_OUTPUT"

      - name: Summarize selection
        run: |
          count='${{ steps.select.outputs.count }}'
          manual_count='${{ steps.select.outputs.manual_count }}'
          {
            echo "Selected $count CI-runnable suite(s) to rerun:"
            python3 -c "import json,sys; [print('-', x['name']) for x in json.loads(sys.argv[1])['include']]" \
              '${{ steps.select.outputs.matrix }}' || true
            echo ""
            echo "SNAP QC suites for the live replay lane: ${{ steps.select.outputs.lane_snap_qc_replay_count }}"
            python3 -c "import json,sys; [print('-', x) for x in json.loads(sys.argv[1] or '[]')]" \
              '${{ steps.select.outputs.lane_snap_qc_replay }}' || true
            if [ "$manual_count" != "0" ]; then
              echo ""
              echo "$manual_count stale suite(s) have no CI-runnable registry name and await the manual lane (parameter suites: scripts/run_parameter_comparisons.py; ci-manual registry suites: a supervised run_comparison.py run):"
              for s in ${{ steps.select.outputs.manual }}; do echo "- $s"; done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$manual_count" != "0" ]; then
            echo "::warning::$manual_count stale suite(s) with no CI-runnable registry name need the manual lane: ${{ steps.select.outputs.manual }}"
          fi

  rerun:
    needs: select
    if: needs.select.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select.outputs.matrix) }}
    steps:
      - name: Checkout axiom-oracles
        uses: actions/checkout@v4
        with:
          path: axiom-oracles
          # Pin the default branch explicitly so the commit step pushes to a
          # real branch (schedule/repository_dispatch would otherwise leave a
          # detached HEAD, breaking the fetch/reset/push in the commit script).
          ref: ${{ github.event.repository.default_branch }}

      - name: Checkout axiom-encode
        uses: actions/checkout@v4
        with:
          repository: TheAxiomFoundation/axiom-encode
          path: axiom-encode
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout axiom-rules
        uses: actions/checkout@v4
        with:
          repository: TheAxiomFoundation/axiom-rules
          path: axiom-rules
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axiom-rules/target
          key: cargo-${{ runner.os }}-${{ hashFiles('axiom-rules/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install orchestrator deps + axiom-oracles
        working-directory: axiom-oracles
        run: uv pip install --system -e '.[policyengine]'

      - name: Cache pinned populace-us artifact (HF hub cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: >-
            populace-hf-${{ runner.os }}-${{
              hashFiles('axiom-oracles/axiom_oracles/populations/enhanced_cps.py')
            }}
          restore-keys: |
            populace-hf-${{ runner.os }}-

      - name: Materialize supervised workspace for this suite
        # Clones the suite's mapped rulespec repos into ~/TheAxiomFoundation
        # and provides the supervised-layout conventions the harnesses resolve
        # (~/rulespec-*, ~/.axiom-oracles/roots, ~/rulespec-uk-official, the
        # axiom-compose venv) — data-driven from affected_map.json and the
        # suite YAML, skip-if-present. Without this, every leg whose suite
        # needs any of it dies before the comparison starts (#296, #300).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: axiom-oracles
        run: python3 scripts/materialize_ci_workspace.py ${{ matrix.name }}

      - name: Rerun comparison (affected)
        env:
          AXIOM_ENCODE_REPO: ${{ github.workspace }}/axiom-encode
          AXIOM_RULES_REPO: ${{ github.workspace }}/axiom-rules
          # Stamp the refreshed report as an affected-rerun (provenance.run_kind).
          AXIOM_ORACLES_RUN_KIND: affected-rerun
          # Pinned Populace artifacts: the UK one lives in a private HF repo
          # (policyengine/populace-uk-private), and the public US one is
          # rate-limited unauthenticated. Empty until the org
          # HUGGING_FACE_TOKEN is restored and shared to this repo
          # (policyengine-uk#1816) — harmless meanwhile.
          HF_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
        working-directory: axiom-oracles
        run: |
          ln -sfn "$AXIOM_ENCODE_REPO" "$HOME/axiom-encode"
          ln -sfn "$AXIOM_RULES_REPO" "$HOME/axiom-rules"
          python3 scripts/run_comparison.py ${{ matrix.name }} --summary

      - name: Commit refreshed report + derived conformance artifacts
        working-directory: axiom-oracles
        # Regenerates freshness + scoreboard/detail/history/burn-down with the
        # report, self-checks against ci.yml's staleness gates, and retries by
        # rebuilding on the current tip (never rebasing) across sibling pushes.
        # Fails loudly if the push never lands.
        run: |
          scripts/commit_refreshed_report.sh "${{ matrix.name }}" \
            "${{ github.event.repository.default_branch }}"

  # Stale SNAP QC suites (ci: snap-qc-replay) never go to the bare matrix
  # above: there run_comparison.py could only re-emit the committed report.
  # The live replay lane provisions what they need, replays them with
  # --require-live, and uploads each report its `check` accepts as live and
  # exact (snap-qc-publish-<suite>). It never commits itself.
  snap-qc-replay:
    needs: select
    if: needs.select.outputs.snap_qc_count > 0
    permissions:
      contents: read
    uses: ./.github/workflows/snap-qc-replay.yml
    with:
      suites: ${{ join(fromJson(needs.select.outputs.snap_qc), ' ') }}
      run_kind: affected-rerun
      publish: true

  # Commits each live, exact SNAP QC report through the same script as the
  # bare legs. A suite whose replay diverged, errored, or re-emitted uploaded
  # nothing: its leg only warns (the replay job already failed), and the
  # committed report stays as it is.
  snap-qc-commit:
    needs: [select, snap-qc-replay]
    if: ${{ !cancelled() && needs.select.outputs.snap_qc_count > 0 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.select.outputs.snap_qc) }}
    steps:
      - name: Download ${{ matrix.suite }}'s live report
        id: bundle
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: snap-qc-publish-${{ matrix.suite }}
          path: ${{ runner.temp }}/publish

      - name: No live, exact report for ${{ matrix.suite }}
        if: steps.bundle.outcome != 'success'
        run: |
          echo "::warning title=${{ matrix.suite }} not committed::The live replay produced no exact report for ${{ matrix.suite }} (see the snap-qc-replay job); its committed report is unchanged."

      - name: Checkout axiom-oracles
        if: steps.bundle.outcome == 'success'
        uses: actions/checkout@v4
        with:
          path: axiom-oracles
          # A real branch, not a detached HEAD: the commit script fetches,
          # resets, and pushes it.
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        if: steps.bundle.outcome == 'success'
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v5
        if: steps.bundle.outcome == 'success'
        with:
          enable-cache: true
          cache-dependency-glob: axiom-oracles/uv.lock

      - name: Install axiom-oracles
        if: steps.bundle.outcome == 'success'
        working-directory: axiom-oracles
        run: uv sync

      - name: Commit ${{ matrix.suite }}'s live report + derived artifacts
        if: steps.bundle.outcome == 'success'
        working-directory: axiom-oracles
        env:
          PYTHON: ${{ github.workspace }}/axiom-oracles/.venv/bin/python
        run: |
          tar -xf "$RUNNER_TEMP/publish/report.tar"
          git status --short -- dashboard/public/data
          scripts/commit_refreshed_report.sh "${{ matrix.suite }}" \
            "${{ github.event.repository.default_branch }}"
