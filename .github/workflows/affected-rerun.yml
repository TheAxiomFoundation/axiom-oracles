name: Affected suite rerun

# Reruns ONLY the comparison suites whose rules have changed since their report
# was last generated, on a 6-hourly cadence (plus repository_dispatch, so a
# rulespec repo can trigger it on push). The weekly full matrix
# (comparisons.yml) stays the backstop; this keeps the reports fresh between
# weekly runs without paying for the whole matrix every 6 hours.
#
# Selection is deterministic and committed:
#   comparisons/affected_map.json   suite → affected rulespec repos
#   report provenance.rulespecs     the SHA each report last ran against
#   scripts/select_affected_suites  diffs current repo HEADs vs those SHAs
#
# See scripts/select_affected_suites.py and comparisons/README.md.

on:
  workflow_dispatch:
    inputs:
      force_all:
        description: "Rerun every mapped suite regardless of freshness"
        required: false
        default: "false"
  repository_dispatch:
    types: [rulespec-updated]
  schedule:
    # Every 6 hours, offset from the weekly Monday 06:00 full matrix.
    - cron: "30 */6 * * *"

permissions:
  contents: read

concurrency:
  group: affected-rerun
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Resolve affected rulespec repo HEADs
        id: heads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Union every repo named in the affected map, then ask the GitHub API
          # for each one's default-branch HEAD. Repos the token can't read are
          # simply omitted (the selector treats a missing HEAD as "cannot prove
          # stale", so the weekly matrix still covers them).
          python3 - <<'PY' > repos.txt
          import json
          from pathlib import Path
          m = json.loads(Path("comparisons/affected_map.json").read_text())
          repos = sorted({r for e in m["suites"] for r in e.get("repos", [])})
          print("\n".join(repos))
          PY
          echo "{}" > heads.json
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          heads = {}
          for repo in Path("repos.txt").read_text().split():
              try:
                  out = subprocess.run(
                      ["gh", "api", f"repos/{repo}", "--jq", ".default_branch"],
                      capture_output=True, text=True, check=True,
                  ).stdout.strip()
                  sha = subprocess.run(
                      ["gh", "api", f"repos/{repo}/commits/{out}", "--jq", ".sha"],
                      capture_output=True, text=True, check=True,
                  ).stdout.strip()
                  if sha:
                      heads[repo] = sha
              except subprocess.CalledProcessError:
                  print(f"skip {repo}: not readable with this token")
          Path("heads.json").write_text(json.dumps(heads, indent=2))
          print(json.dumps(heads, indent=2))
          PY

      - name: Select stale-affected suites
        id: select
        run: |
          if [ "${{ inputs.force_all }}" = "true" ]; then
            matrix=$(python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("comparisons/affected_map.json").read_text())
          names = [e["suite"] for e in m["suites"] if e.get("repos")]
          print(json.dumps({"include": [{"name": n} for n in names]}))
          PY
          )
          else
            matrix=$(python3 scripts/select_affected_suites.py \
              --heads-json heads.json --format matrix)
          fi
          count=$(python3 -c "import json,sys; print(len(json.loads(sys.argv[1])['include']))" "$matrix")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Selected $count suite(s) to rerun:" >> "$GITHUB_STEP_SUMMARY"
          python3 -c "import json,sys; [print('-',x['name']) for x in json.loads(sys.argv[1])['include']]" "$matrix" >> "$GITHUB_STEP_SUMMARY" || true

  rerun:
    needs: select
    if: needs.select.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select.outputs.matrix) }}
    steps:
      - name: Checkout axiom-oracles
        uses: actions/checkout@v4
        with:
          path: axiom-oracles
          # Pin the default branch explicitly so the commit step pushes to a
          # real branch (schedule/repository_dispatch would otherwise leave a
          # detached HEAD, breaking the pull/push below).
          ref: ${{ github.event.repository.default_branch }}

      - name: Checkout axiom-encode
        uses: actions/checkout@v4
        with:
          repository: TheAxiomFoundation/axiom-encode
          path: axiom-encode
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout axiom-rules
        uses: actions/checkout@v4
        with:
          repository: TheAxiomFoundation/axiom-rules
          path: axiom-rules
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axiom-rules/target
          key: cargo-${{ runner.os }}-${{ hashFiles('axiom-rules/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install orchestrator deps + axiom-oracles
        working-directory: axiom-oracles
        run: uv pip install --system -e '.[policyengine]'

      - name: Cache pinned populace-us artifact (HF hub cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: >-
            populace-hf-${{ runner.os }}-${{
              hashFiles('axiom-oracles/axiom_oracles/populations/enhanced_cps.py')
            }}
          restore-keys: |
            populace-hf-${{ runner.os }}-

      - name: Rerun comparison (affected)
        env:
          AXIOM_ENCODE_REPO: ${{ github.workspace }}/axiom-encode
          AXIOM_RULES_REPO: ${{ github.workspace }}/axiom-rules
          # Stamp the refreshed report as an affected-rerun (provenance.run_kind).
          AXIOM_ORACLES_RUN_KIND: affected-rerun
        working-directory: axiom-oracles
        run: |
          ln -sfn "$AXIOM_ENCODE_REPO" "$HOME/axiom-encode"
          ln -sfn "$AXIOM_RULES_REPO" "$HOME/axiom-rules"
          python3 scripts/run_comparison.py ${{ matrix.name }} --summary

      - name: Refresh freshness data
        working-directory: axiom-oracles
        run: |
          python3 scripts/check_vacuous_gate.py || true

      - name: Commit refreshed report
        working-directory: axiom-oracles
        run: |
          if git diff --quiet -- dashboard/public/data/; then
            echo "no report changes for ${{ matrix.name }}"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/public/data/
          git commit -m "data: refresh ${{ matrix.name }} (affected rerun $(date +%Y-%m-%d))"
          # Serialize commits across the matrix: rebase onto any sibling push.
          branch="${{ github.event.repository.default_branch }}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$branch" && \
              git push origin "HEAD:$branch" && break || sleep $((RANDOM % 10 + 5))
          done

  # ---------------------------------------------------------------------------
  # Reconcile the report-derived aggregates ONCE, after every affected suite has
  # pushed its refreshed report.
  #
  # Why a separate job and not per-leg: the `rerun` matrix above commits raw
  # comparison reports (dashboard/public/data/<suite>.json), but the conformance
  # scoreboard + per-policy detail and the freshness registry are computed from
  # the WHOLE committed report set. A matrix leg only ever sees a partial view
  # (its own refresh plus whichever siblings happened to land first), so
  # regenerating those aggregates inside a leg would race — the last push would
  # win with a partial-view aggregate. Doing it here, once, on the post-matrix
  # tip, is the only place the full report set is visible.
  #
  # Why it matters: without this, a refreshed report leaves
  # conformance/scoreboard.json + conformance/detail/<jur>.json (and their
  # dashboard mirrors) stale, and CI's `conformance_scoreboard.py --check` gate
  # reds main for EVERY open PR until someone regenerates by hand. That is
  # exactly what happened on 2026-07-14 — the il/ky/oh/va income-tax refreshes
  # turned main red and were fixed reactively in #282. This job makes that fix
  # systemic. It mirrors the post-matrix `rule-coverage` commit job in
  # comparisons.yml.
  reconcile:
    needs: [select, rerun]
    # Run whenever the matrix ran at all: even if some legs failed (rerun is a
    # fail-fast:false matrix, so one bad leg fails the whole job), the legs that
    # succeeded may have pushed reports that now need reconciling — hence
    # always(). Still gated on select having actually selected ≥1 suite.
    if: always() && needs.select.result == 'success' && needs.select.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout axiom-oracles (default branch)
        uses: actions/checkout@v4
        with:
          # Pin the default branch so we start from the post-matrix tip and can
          # push the reconciled aggregates back to a real branch.
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install axiom-oracles (dev extras only)
        # The aggregate generators read committed JSON/YAML only — no rules
        # engine, no PolicyEngine, no populace artifact — so the same light dev
        # env CI uses for the --check gates is exactly enough here.
        run: uv sync --extra dev

      - name: Regenerate report-derived aggregates and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${{ github.event.repository.default_branch }}"
          # Every committed artifact CI derives from the reports (the euromod-be
          # rollup lives outside dashboard/public/data, so list it explicitly).
          paths=(
            conformance/
            dashboard/public/data/
            axiom_oracles/data/euromod_be_coverage.json
          )
          # The exact report-derived CI gates (same semantics main enforces):
          # check_vacuous_gate ignores only the volatile top-level freshness
          # timestamp — per-suite report timestamps still count.
          report_derived_gates() {
            uv run scripts/apply_dispositions.py --check \
              && uv run scripts/conformance_scoreboard.py --check \
              && uv run scripts/check_vacuous_gate.py --check \
              && uv run scripts/conformance_burndown.py --check
          }
          for attempt in 1 2 3 4 5; do
            # Regenerate against the freshest tip, so the aggregates we push
            # provably match the reports at the commit we push onto — no
            # rebase-stale window.
            git fetch --quiet origin "$branch"
            git reset --quiet --hard "origin/$branch"
            # If the committed aggregates already pass the gates at this tip,
            # main is green — stop without churning a no-op commit (a bare
            # top-level freshness-timestamp bump never lands here).
            if report_derived_gates; then
              echo "aggregates already consistent with the refreshed reports"
              exit 0
            fi
            # Something is stale — regenerate every report-derived aggregate.
            # Order matters: apply_dispositions rewrites the reports (idempotently
            # — run_comparison.py already merged them at generation time), so it
            # runs first; freshness + scoreboard then read the merged reports;
            # the burn-down reads the committed history. check_vacuous_gate exits
            # non-zero on config-schema problems even in write mode; tolerate it
            # here so the post-regen validation below decides what that means.
            uv run scripts/apply_dispositions.py       # reports + euromod-be coverage rollup
            uv run scripts/check_vacuous_gate.py || true  # dashboard/public/data/freshness.json
            uv run scripts/conformance_scoreboard.py   # conformance/{scoreboard,detail/*}.json (+ mirrors)
            uv run scripts/conformance_burndown.py     # dashboard/public/data/conformance_burndown.json
            # Only push a tree that actually greens the gates. If regeneration
            # did NOT fix them, the red is not derivation lag (e.g. a schema
            # error in a comparison config) — pushing would only add a noise
            # commit on top of a main that stays red for the same reason. Fail
            # here instead, loudly, with nothing pushed.
            if ! report_derived_gates; then
              echo "regenerated aggregates still fail the gates — not derivation" \
                   "lag; refusing to push (fix the underlying error on main)" >&2
              exit 1
            fi
            git add "${paths[@]}"
            git commit -m "data: reconcile conformance aggregates (affected rerun $(date +%Y-%m-%d))"
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "attempt $attempt: push rejected (sibling landed); retrying"
            sleep $((RANDOM % 10 + 5))
          done
          echo "reconcile failed to push after retries" >&2
          exit 1

      - name: Verify the derived-artifact gates are green
        # After reconcile, the artifact-consistency gates MUST pass — if they
        # don't, the reconcile didn't do its job and we want a loud failure here
        # rather than a red main for the next PR. (A genuine conformance
        # regression is caught separately by the ratchet gate in main CI, which
        # is a real signal for a human and intentionally not auto-fixed here.)
        run: |
          uv run scripts/apply_dispositions.py --check
          uv run scripts/conformance_scoreboard.py --check
          uv run scripts/check_vacuous_gate.py --check
          uv run scripts/conformance_burndown.py --check
