name: Affected suite rerun

# Reruns ONLY the comparison suites whose rules have changed since their report
# was last generated, on a 6-hourly cadence (plus repository_dispatch, so a
# rulespec repo can trigger it on push). The weekly full matrix
# (comparisons.yml) is only a CI signal: it uploads reports as artifacts and
# never commits them. This workflow is what keeps the committed reports fresh,
# without paying for the whole matrix every 6 hours. Suites whose
# map entry has `name: null` (parameter suites, and suites declaring
# `ci: manual`, such as the SNAP QC replays, the EUROMOD/UKMOD suites, the UK
# PolicyEngine case grids and the us-tariff grid, which these runners could
# only re-emit or copy) are reported as awaiting the manual lane, never
# dispatched.
#
# Selection is deterministic and committed:
#   comparisons/affected_map.json   suite → affected rulespec repos
#   report provenance.rulespecs     the SHA each report last ran against
#   scripts/select_affected_suites  diffs current repo HEADs vs those SHAs
#
# Each matrix leg runs its comparison and PACKS the result
# (scripts/commit_refreshed_report.sh --pack): it collects the run's private
# outputs, vets them once on its own checkout — the re-emission guard,
# regenerating every derived, CI-validated artifact (dispositioned reports +
# the EUROMOD-BE coverage rollup, conformance scoreboard + detail + history
# snapshot, burn-down, freshness, census, certificates) and checking the tree
# against ci.yml's staleness gates, then the unexplained ratchet — and uploads
# the bundle as the `refreshed-<suite>` artifact. Legs only read the
# repository. One `publish` job then downloads every bundle and runs
# `--publish` once: it rebuilds on the current tip, applies every bundle,
# regenerates the derived artifacts once, re-runs every gate, and pushes ONE
# commit, retrying only a rejected push (never rebasing). Until 2026-09-26 each
# leg pushed on its own, and ~47 legs regenerating and racing for main lost
# 7-11 legs a sweep to the 90-minute timeout (runs 36239293795, 35958364304).
# The ratchet (conformance/ratchet.yaml) is never re-pinned from this bot
# path — re-pinning after a genuine improvement stays a deliberate human
# action, and a genuine regression is MEANT to fail ci.yml's ratchet gate on
# main. A leg whose runner marks its output as a re-emission
# (provenance.reemitted_report) never replaces a committed report, real or
# itself re-emitted: run_comparison.py leaves that copy untouched, and the
# publisher re-checks every push attempt's tip
# (scripts/guard_reemitted_reports.py).
#
# See scripts/select_affected_suites.py and comparisons/README.md.

on:
  workflow_dispatch:
    inputs:
      force_all:
        description: >-
          Rerun every CI-runnable mapped suite regardless of freshness
          (suites without a CI-runnable registry name are reported, not
          dispatched)
        required: false
        default: "false"
  repository_dispatch:
    types: [rulespec-updated]
  schedule:
    # Every 6 hours, offset from the weekly Monday 06:00 full matrix.
    - cron: "30 */6 * * *"

permissions:
  contents: read

concurrency:
  group: affected-rerun
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Resolve affected rulespec repo HEADs
        id: heads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Union every repo named in the affected map, then ask the GitHub API
          # for each one's default-branch HEAD. Repos the token can't read are
          # simply omitted (the selector treats a missing HEAD as "cannot prove
          # stale", so the weekly matrix still covers them).
          python3 - <<'PY' > repos.txt
          import json
          from pathlib import Path
          m = json.loads(Path("comparisons/affected_map.json").read_text())
          repos = sorted({r for e in m["suites"] for r in e.get("repos", [])})
          print("\n".join(repos))
          PY
          echo "{}" > heads.json
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          heads = {}
          for repo in Path("repos.txt").read_text().split():
              try:
                  out = subprocess.run(
                      ["gh", "api", f"repos/{repo}", "--jq", ".default_branch"],
                      capture_output=True, text=True, check=True,
                  ).stdout.strip()
                  sha = subprocess.run(
                      ["gh", "api", f"repos/{repo}/commits/{out}", "--jq", ".sha"],
                      capture_output=True, text=True, check=True,
                  ).stdout.strip()
                  if sha:
                      heads[repo] = sha
              except subprocess.CalledProcessError:
                  print(f"skip {repo}: not readable with this token")
          Path("heads.json").write_text(json.dumps(heads, indent=2))
          print(json.dumps(heads, indent=2))
          PY

      - name: Select stale-affected suites
        id: select
        # One code path for both modes: the selector validates the map's
        # dispatch names (registry name or explicit null — anything else
        # fails loudly), dedups, and emits matrix/count/manual_count/manual
        # as $GITHUB_OUTPUT lines. Dispatching dashboard suite keys or
        # parameter-lane names crashed ~50 legs/run with "unknown comparison".
        run: |
          args=(--heads-json heads.json --format github)
          if [ "${{ inputs.force_all }}" = "true" ]; then
            args+=(--force-all)
          fi
          python3 scripts/select_affected_suites.py "${args[@]}" >> "$GITHUB_OUTPUT"

      - name: Summarize selection
        run: |
          count='${{ steps.select.outputs.count }}'
          manual_count='${{ steps.select.outputs.manual_count }}'
          {
            echo "Selected $count CI-runnable suite(s) to rerun:"
            python3 -c "import json,sys; [print('-', x['name']) for x in json.loads(sys.argv[1])['include']]" \
              '${{ steps.select.outputs.matrix }}' || true
            if [ "$manual_count" != "0" ]; then
              echo ""
              echo "$manual_count stale suite(s) have no CI-runnable registry name and await the manual lane (parameter suites: scripts/run_parameter_comparisons.py; ci-manual registry suites: a supervised run_comparison.py run):"
              for s in ${{ steps.select.outputs.manual }}; do echo "- $s"; done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$manual_count" != "0" ]; then
            echo "::warning::$manual_count stale suite(s) with no CI-runnable registry name need the manual lane: ${{ steps.select.outputs.manual }}"
          fi

  rerun:
    needs: select
    if: needs.select.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Read-only: legs pack and upload; only the publish job writes.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select.outputs.matrix) }}
    steps:
      - name: Checkout axiom-oracles
        uses: actions/checkout@v4
        with:
          path: axiom-oracles
          # The default branch's tip, explicitly (schedule/repository_dispatch
          # would otherwise leave a detached HEAD): pack diffs the run's
          # outputs against it and vets the refresh on it.
          ref: ${{ github.event.repository.default_branch }}

      - name: Checkout axiom-encode
        uses: actions/checkout@v4
        with:
          repository: TheAxiomFoundation/axiom-encode
          path: axiom-encode
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout axiom-rules
        uses: actions/checkout@v4
        with:
          repository: TheAxiomFoundation/axiom-rules
          path: axiom-rules
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axiom-rules/target
          key: cargo-${{ runner.os }}-${{ hashFiles('axiom-rules/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install orchestrator deps + axiom-oracles
        working-directory: axiom-oracles
        run: uv pip install --system -e '.[policyengine]'

      - name: Cache pinned populace-us artifact (HF hub cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: >-
            populace-hf-${{ runner.os }}-${{
              hashFiles('axiom-oracles/axiom_oracles/populations/enhanced_cps.py')
            }}
          restore-keys: |
            populace-hf-${{ runner.os }}-

      - name: Materialize supervised workspace for this suite
        # Clones the suite's mapped rulespec repos into ~/TheAxiomFoundation
        # and provides the supervised-layout conventions the harnesses resolve
        # (~/rulespec-*, ~/.axiom-oracles/roots, ~/rulespec-uk-official, the
        # axiom-compose venv) — data-driven from affected_map.json and the
        # suite YAML, skip-if-present. Without this, every leg whose suite
        # needs any of it dies before the comparison starts (#296, #300).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: axiom-oracles
        run: python3 scripts/materialize_ci_workspace.py ${{ matrix.name }}

      - name: Rerun comparison (affected)
        env:
          AXIOM_ENCODE_REPO: ${{ github.workspace }}/axiom-encode
          AXIOM_RULES_REPO: ${{ github.workspace }}/axiom-rules
          # Stamp the refreshed report as an affected-rerun (provenance.run_kind).
          AXIOM_ORACLES_RUN_KIND: affected-rerun
          # Pinned Populace artifacts: the UK one lives in a private HF repo
          # (policyengine/populace-uk-private), and the public US one is
          # rate-limited unauthenticated. Empty until the org
          # HUGGING_FACE_TOKEN is restored and shared to this repo
          # (policyengine-uk#1816) — harmless meanwhile.
          HF_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
        working-directory: axiom-oracles
        run: |
          ln -sfn "$AXIOM_ENCODE_REPO" "$HOME/axiom-encode"
          ln -sfn "$AXIOM_RULES_REPO" "$HOME/axiom-rules"
          python3 scripts/run_comparison.py ${{ matrix.name }} --summary

      - name: Pack refreshed report for the publish job
        id: pack
        working-directory: axiom-oracles
        # Collects this run's private outputs and vets them once here (the
        # re-emission guard, regenerate + verify every derived artifact, the
        # unexplained ratchet), then writes $RUNNER_TEMP/refreshed/<suite>/.
        # Never fetches, commits or pushes. A refresh that fails the vet fails
        # this leg and packs nothing; an unchanged run packs nothing.
        run: |
          scripts/commit_refreshed_report.sh --pack \
            "$RUNNER_TEMP/refreshed" "${{ matrix.name }}"
          if [ -d "$RUNNER_TEMP/refreshed/${{ matrix.name }}" ]; then
            echo "bundle=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload refreshed-report bundle
        if: steps.pack.outputs.bundle == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-${{ matrix.name }}
          path: ${{ runner.temp }}/refreshed/${{ matrix.name }}/
          if-no-files-found: error
          include-hidden-files: true
          # A "re-run all jobs" re-packs under the same name.
          overwrite: true
          retention-days: 7

  publish:
    # The ONLY job that writes to the default branch. It commits every bundle
    # the legs uploaded in ONE commit, so there is no sibling to race: a push
    # is retried only when another workflow or a human moved the branch.
    # Runs when some legs failed (their bundles simply are not there, and the
    # run still ends red for them), but never after a cancellation.
    needs: [select, rerun]
    if: ${{ !cancelled() && needs.select.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Download refreshed-report bundles
        uses: actions/download-artifact@v4
        with:
          pattern: refreshed-*
          # One directory per bundle (refreshed-<suite>/); publish reads each
          # bundle's suite from its bundle.json.
          merge-multiple: false
          path: ${{ runner.temp }}/refreshed

      - name: Count bundles
        id: bundles
        run: |
          count=0
          if [ -d "$RUNNER_TEMP/refreshed" ]; then
            count=$(find "$RUNNER_TEMP/refreshed" -mindepth 1 -maxdepth 1 -type d | wc -l)
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count refreshed-report bundle(s) to publish" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout axiom-oracles
        if: steps.bundles.outputs.count != '0'
        uses: actions/checkout@v4
        with:
          # The branch publish fetches, rebuilds on and pushes to.
          ref: ${{ github.event.repository.default_branch }}

      # The legs' interpreter setup. Derived regeneration needs only this
      # repository: it runs on a bare clone exactly as ci.yml's gates do (no
      # rulespec, engine or Rust checkout; the DE pair legs keep the bundled
      # record when no rulespec-de checkout is present).
      - uses: actions/setup-python@v5
        if: steps.bundles.outputs.count != '0'
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v5
        if: steps.bundles.outputs.count != '0'
        with:
          enable-cache: true

      - name: Install orchestrator deps + axiom-oracles
        if: steps.bundles.outputs.count != '0'
        run: uv pip install --system -e '.[policyengine]'

      - name: Publish every refreshed report + derived conformance artifacts
        if: steps.bundles.outputs.count != '0'
        # Rebuilds on the current tip, applies every bundle, regenerates the
        # derived artifacts once, self-checks against ci.yml's staleness gates
        # and the unexplained ratchet, and pushes one commit. Fails loudly if
        # the gates refuse (naming every suite) or the push never lands.
        run: |
          scripts/commit_refreshed_report.sh --publish \
            "$RUNNER_TEMP/refreshed" "${{ github.event.repository.default_branch }}"
