name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install package
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Validate comparison registry
        run: uv run scripts/run_comparison.py --list

      - name: Validate per-rule verification KPI data
        run: uv run scripts/check_rule_verification.py

      - name: Validate mismatch dispositions
        run: uv run scripts/apply_dispositions.py --check

      - name: Test
        run: uv run pytest -q

      - name: Build package
        run: uv build
