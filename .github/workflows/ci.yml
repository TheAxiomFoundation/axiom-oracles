name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Closure's pending-only-falls gate derives its immutable floor from
          # committed ancestor universes, so a shallow checkout is insufficient.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install package
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Validate comparison registry
        run: uv run scripts/run_comparison.py --list

      - name: Validate per-rule verification KPI data
        run: uv run scripts/check_rule_verification.py

      - name: Validate state-tax Populace projection contract
        run: uv run scripts/check_state_tax_populace_contract.py

      - name: Validate mismatch dispositions
        run: uv run scripts/apply_dispositions.py --check

      - name: Validate NZ IncomeExplorer report, traces, and bound cases
        run: uv run python scripts/nz_incomeexplorer.py --check

      - name: Validate served DE mismatch and disposition artifacts
        run: |
          uv run python scripts/emit_disposition_artifacts.py --check de-worker-dual-oracle
          uv run python scripts/emit_case_artifacts.py --check de-worker-dual-oracle

      - name: Validate pinned DE Axiom comparison legs
        run: uv run python scripts/de_axiom_legs.py --check

      - name: Validate DE unified comparison record
        run: uv run python scripts/de_unified_comparison.py --check

      - name: Validate DE exact-citation closure summary
        run: uv run python scripts/de_closure.py --check

      - name: Validate DE Kindergeld executable status
        run: uv run python scripts/de_executable.py --check

      - name: Validate DE certificate-candidate census
        run: uv run python scripts/de_certificate_census.py --check

      - name: Validate report-bound case chunk indexes
        run: uv run python scripts/generate_chunk_indexes.py --check

      - name: Exercise census is current (varied/constant/bridged per suite)
        run: uv run python scripts/exercise_census.py --check

      - name: Bridge manifests validate (strict-clean lanes enforce findings)
        run: uv run python scripts/validate_bridge_manifests.py --strict

      - name: NZ computed closure and executable evidence is current
        run: |
          uv run python scripts/nz_executable_reproduction.py --check
          uv run python scripts/nz_closure.py --check
          uv run python scripts/nz_exercise_denominator.py --check

      - name: Cache pinned NZ engine source build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/nz-engine-target
          key: nz-engine-${{ runner.os }}-d59969b53430ae2fd97eb4349d44ad23ce930d85

      - name: Checkout pinned NZ engine source
        uses: actions/checkout@v4
        with:
          repository: TheAxiomFoundation/axiom-rules-engine
          ref: d59969b53430ae2fd97eb4349d44ad23ce930d85
          path: .ci/axiom-rules-engine
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout pinned NZ RuleSpec source
        uses: actions/checkout@v4
        with:
          repository: TheAxiomFoundation/rulespec-nz
          ref: 89a7d25dc03a4d045348620283332de10b1047da
          path: .ci/rulespec-nz
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build pinned NZ engine and replay committed requests
        env:
          NZ_ENGINE_ROOT: ${{ github.workspace }}/.ci/axiom-rules-engine
          NZ_ENGINE_TARGET: ${{ runner.temp }}/nz-engine-target
          NZ_RULESPEC_ROOT: ${{ github.workspace }}/.ci/rulespec-nz
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$NZ_ENGINE_TARGET" cargo build --locked --release --manifest-path "$NZ_ENGINE_ROOT/Cargo.toml" --bin axiom-rules-engine
          uv run python scripts/nz_executable_reproduction.py --check --live --source-built-engine --engine-root "$NZ_ENGINE_ROOT" --engine-binary "$NZ_ENGINE_TARGET/release/axiom-rules-engine" --rulespec-root "$NZ_RULESPEC_ROOT"

      - name: Program certificates recompute clean
        run: uv run python scripts/certify.py --check

      - name: Tariff evidence captures match every recorded digest
        run: uv run python scripts/us_tariff_capture_integrity.py

      - name: Validate served SNAP case-explorer parity
        run: |
          uv run scripts/emit_case_artifacts.py --check al-snap-ecps ma-snap-ecps nc-snap-ecps sc-snap-ecps tn-snap-ecps
          uv run scripts/emit_disposition_artifacts.py --check al-snap-ecps ma-snap-ecps nc-snap-ecps sc-snap-ecps tn-snap-ecps

      - name: Validate canonical case grids are up to date
        run: uv run scripts/extract_grids.py --check

      - name: Validate boundary-case suggestions are up to date
        # No-op-clean when the axiom-corpus checkout is absent (the committed
        # suggestions stand alone); enforces determinism when it is present.
        run: uv run scripts/generate_boundary_cases.py --check

      - name: Validate affected-comparison map
        run: uv run scripts/generate_affected_map.py --check

      - name: Vacuous-verification gate (oracle-backed + freshness)
        run: uv run scripts/check_vacuous_gate.py --check

      - name: Dashboard overview bundle is current
        run: uv run scripts/generate_dashboard_overview.py --check

      - name: Validate conformance universes (drift vs oracle model spine)
        # No-op-clean when the model checkouts are absent (the committed
        # universes stand alone); enforces determinism when they are present.
        run: uv run scripts/generate_conformance_universe.py --all --check

      - name: Validate closure universes (pinned inventories + pending ratchet)
        run: uv run scripts/closure_universe.py --check

      - name: Validate conformance program compositions (drift vs suites)
        # Derived from the committed suites (no external checkout needed), so
        # this always bites: a covered suite whose runnable-program composition
        # changed must refresh conformance/compositions/<jur>.yaml.
        run: uv run scripts/generate_conformance_compositions.py --all --check

      - name: Validate conformance scoreboard is up to date
        run: uv run scripts/conformance_scoreboard.py --check

      - name: Conformance ratchets (covered up; unexplained/axiom-gap down)
        run: uv run scripts/conformance_ratchet.py --check

      - name: Unexplained publication gate (per-suite ceilings only fall)
        run: uv run scripts/unexplained_ratchet.py --check

      - name: Validate conformance burn-down series is up to date
        run: uv run scripts/conformance_burndown.py --check

      - name: Test
        run: uv run pytest -q

      - name: Build package
        run: uv build

  # The GETTSIM adapter's live oracle tests skip when the optional dependency
  # is absent, and the dev sync above cannot install it (the gettsim extra is
  # a declared uv conflict fork against the policyengine/taxsim extras). This
  # job syncs the locked gettsim fork so the statute-pinned live expectations
  # actually gate merges — a broken adapter must not ride in on skips.
  gettsim-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install package with the locked gettsim fork
        run: uv sync --extra gettsim --extra dev

      - name: Ensure the live tests cannot silently skip
        run: uv run python -c "import gettsim; print('gettsim', gettsim.__version__)"

      - name: GETTSIM live oracle tests
        run: uv run pytest -q tests/test_gettsim_adapter.py

  # The TAXSIM pin tests skip in the dev-only `test` job: it installs neither
  # policyengine-taxsim nor any pinned TAXSIM executable. This job syncs the
  # locked taxsim extra, fetches every profile's pinned Linux binaries into the
  # verified cache (sha256 + size checked before anything is written), and
  # runs the pin/runtime/golden-probe tests with skips turned into failures,
  # so a stale pin, a moved blob, or a changed binary cannot pass by skipping.
  taxsim-pin:
    runs-on: ubuntu-latest
    env:
      AXIOM_TAXSIM_CACHE_DIR: ${{ github.workspace }}/.ci/taxsim-binaries
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install package with the locked taxsim extra
        run: uv sync --extra taxsim --extra dev

      - name: Ensure policyengine-taxsim imports
        run: uv run python -c "import importlib.metadata as m, policyengine_taxsim; print('policyengine-taxsim', m.version('policyengine-taxsim'))"

      - name: Cache verified TAXSIM binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.AXIOM_TAXSIM_CACHE_DIR }}
          key: taxsim-binaries-${{ hashFiles('axiom_oracles/adapters/taxsim/taxsim_pins.json') }}

      - name: Ensure the gfortran runtime the pinned Linux builds link against
        # The August/September 2026 Linux builds are dynamically linked against
        # libgfortran.so.5 and libquadmath.so.0 (the 2.30.0 build needs only libc).
        run: |
          ldconfig -p | grep -q 'libgfortran.so.5' && ldconfig -p | grep -q 'libquadmath.so.0' \
            || (sudo apt-get update && sudo apt-get install -y libgfortran5)

      - name: Fetch every profile's pinned Linux TAXSIM binaries
        run: uv run axiom-oracles taxsim fetch-binaries --all-profiles --platform linux

      - name: Show pin status
        run: uv run axiom-oracles taxsim pin-status --all-profiles --platform linux

      - name: Download the pinned policyengine-taxsim wheel
        run: |
          set -euo pipefail
          url=$(uv run python -c "from axiom_oracles.adapters.taxsim import pins; print(pins.load_pins()['distribution']['wheel']['url'])")
          curl -sSfL "$url" -o "$RUNNER_TEMP/policyengine_taxsim-pinned.whl"
          echo "AXIOM_TAXSIM_WHEEL=$RUNNER_TEMP/policyengine_taxsim-pinned.whl" >> "$GITHUB_ENV"

      - name: TAXSIM pin, runtime, and golden-probe tests (skips fail)
        env:
          AXIOM_TAXSIM_REQUIRE_BINARIES: "1"
        run: uv run pytest -q -rs tests/test_taxsim_pin.py tests/test_taxsim_pin_runtime.py tests/test_taxsim_runner_pinned.py

      - name: Observe emulator and September no-fallback crash probes on Linux
        run: |
          uv run python scripts/taxsim_probes.py emulator --expected-platform linux --output .ci/taxsim-emulator-probes-linux.json
          uv run python scripts/taxsim_probes.py crash --year 2024 --expected-platform linux --output .ci/taxsim-crash-probes-2024-linux.json
          uv run python scripts/taxsim_probes.py crash --year 2025 --expected-platform linux --output .ci/taxsim-crash-probes-2025-linux.json

      - name: Preserve Linux probe observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxsim-probe-observations-linux
          path: .ci/taxsim-*-probes*-linux.json
          if-no-files-found: error
