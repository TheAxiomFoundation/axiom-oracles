name: SNAP QC live replay

# Replays the SNAP QC suites for real and fails on any mismatch or error.
#
# The weekly matrix (comparisons.yml) and the 6-hourly affected rerun
# (affected-rerun.yml) used to run the snap-qc suites on bare runners. Those
# runners have no engine binary and no QC public-use file, so
# scripts/run_comparison.py re-emitted the committed dashboard report
# (provenance.reemitted_report: true). Those legs stayed green whether or
# not the replay still worked: California's stopped compiling after
# rulespec-us#1176 (2026-07-30) and nothing failed. The suites now declare
# `ci: snap-qc-replay` (TX, still pending, `ci: manual`), which keeps them off
# both bare matrices. This lane provisions all three and runs every suite
# with --require-live:
#
#   engine    axiom-rules-engine built at the axiom_artifact_rules_engine_ref
#             pin in rulespec-us's .axiom/workflow-toolchain.toml (the recipe
#             rulespec-us's program-artifacts.yml uses), cached per ref and
#             Ubuntu release (ImageOS). The validation pin,
#             axiom_rules_engine_ref, cannot load the SNAP chain. Every job
#             selects ubuntu-24.04 rather than ubuntu-latest, so a binary
#             cached on one Ubuntu release is never restored on another.
#             The build receipt travels with the binary; every cache consumer
#             hashes its restored bytes and verifies the receipt's exact SHA.
#   rulespec  rulespec-us at one commit, resolved once from main (or from the
#             dispatch input) and shared by every leg. It is checked out into
#             a directory named rulespec-us, because the engine serves `us:`
#             imports only from a root named rulespec-us (or rulespec-us-<x>).
#   data      the PUF zip pinned in SNAP_QC_PINS
#             (axiom_oracles/populations/snap_qc.py), cached per pin and
#             re-verified against the pin's sha256 before every extraction.
#
# scripts/snap_qc_replay.py selects the suites: every REQUIRED_SUITES entry,
# plus each PENDING_SUITES entry once its composition lands on rulespec-us
# (a dispatch's `suites` input can narrow this). Its `check` then fails the
# leg unless the replay log records writing the report and the report is
# exact: zero benefit mismatches, zero error cases, and every stage
# concept the suite compares (benefit included) listed and compared on every
# case without divergence. The run must also have used the resolved
# rulespec-us SHA and the pinned engine. The live-tests job
# runs the PUF row counts, engine-backed worked example, and the six required
# suites' overlay-closure checks. Texas remains pending in PENDING_SUITES.
# These tests skip unless their inputs are provided; the job fails on any skip.
#
# Reports go up as workflow artifacts and are never committed; the point of
# this lane is a failing check. See docs/snap-qc-oracle-playbook.md.
#
# The affected rerun (affected-rerun.yml) also calls this workflow for the
# stale suites that declare `ci: snap-qc-replay`, with `publish: true`. Each
# leg then checks out main over the published data baseline (oracle_data.py
# materialize --baseline) before it replays, and a leg whose report passes
# `check` packs it (scripts/commit_refreshed_report.sh --pack) and uploads the
# bundle as `refreshed-<suite>`, the name the bare rerun legs use. The
# caller's single publish job applies it to oracle-data with the rest. This
# workflow still never commits or pushes.

on:
  schedule:
    # Mondays 07:17 UTC: after the 06:00 weekly matrix, off the hour.
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      suites:
        description: "Snap-qc suites to replay, comma/space-separated (blank = all)"
        required: false
        default: ""
      rulespec_us_ref:
        description: "rulespec-us branch, tag, or SHA to replay against"
        required: false
        default: main
  workflow_call:
    inputs:
      suites:
        description: "Snap-qc suites to replay, comma/space-separated (blank = all)"
        type: string
        required: false
        default: ""
      rulespec_us_ref:
        description: "rulespec-us branch, tag, or SHA to replay against"
        type: string
        required: false
        default: main
      run_kind:
        description: >-
          provenance.run_kind for the reports (blank: weekly on a schedule,
          else manual)
        type: string
        required: false
        default: ""
      publish:
        description: >-
          Replay over the published data baseline and upload each live,
          exact leg's packed bundle as refreshed-<suite> for the caller's
          publish job
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Keyed on github.workflow as well as the ref. In a called workflow the
# github context is the caller's, so a call from the affected rerun lands in
# its own group (and the caller's own concurrency already serializes it),
# never queued behind or replacing the weekly or dispatched run on main.
concurrency:
  group: snap-qc-replay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare engine, data, and suites
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      suites: ${{ steps.suites.outputs.suites }}
      puf_cache_key: ${{ steps.suites.outputs.puf_cache_key }}
      rulespec_sha: ${{ steps.rulespec.outputs.sha }}
      engine_ref: ${{ steps.toolchain.outputs.engine_ref }}
      engine_cache_key: ${{ steps.toolchain.outputs.engine_cache_key }}
    steps:
      - name: Checkout axiom-oracles
        uses: actions/checkout@v4
        with:
          path: axiom-oracles
          # A publishing call selects suites from the same source as its
          # replay legs, which check out main.
          ref: ${{ inputs.publish && 'main' || '' }}

      - name: Checkout rulespec-us
        uses: actions/checkout@v4
        with:
          repository: TheAxiomFoundation/rulespec-us
          ref: ${{ inputs.rulespec_us_ref || 'main' }}
          path: rulespec-us

      - name: Resolve rulespec-us commit
        id: rulespec
        run: |
          sha=$(git -C rulespec-us rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "rulespec-us: $sha"

      - name: Resolve engine pin
        id: toolchain
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib

          with open("rulespec-us/.axiom/workflow-toolchain.toml", "rb") as fh:
              pins = tomllib.load(fh)["workflow_toolchain"]
          ref = str(pins.get("axiom_artifact_rules_engine_ref", ""))
          if not re.fullmatch(r"[0-9a-f]{40}", ref):
              raise SystemExit(
                  f"axiom_artifact_rules_engine_ref is not a 40-hex SHA: {ref!r}"
              )
          image = os.environ.get("ImageOS") or os.environ["RUNNER_OS"]
          key = f"axiom-rules-engine-receipt-v1-release-{image}-{ref}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"engine_ref={ref}\nengine_cache_key={key}\n")
          print(f"axiom-rules-engine: {ref}")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: axiom-oracles/uv.lock

      - name: Install axiom-oracles
        working-directory: axiom-oracles
        run: uv sync

      - name: Select suites
        id: suites
        working-directory: axiom-oracles
        env:
          ONLY: ${{ inputs.suites }}
        run: uv run scripts/snap_qc_replay.py suites --rulespec-root ../rulespec-us --only "$ONLY"

      - name: Restore pinned PUF archive
        uses: actions/cache@v4
        with:
          path: puf-archive
          key: ${{ steps.suites.outputs.puf_cache_key }}

      - name: Fetch and verify pinned PUF
        working-directory: axiom-oracles
        run: >-
          uv run scripts/snap_qc_replay.py fetch-puf
          --archive-dir ../puf-archive --data-dir "$RUNNER_TEMP/snap-qc-data"

      - name: Restore engine binary
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: |
            engine/target/release/axiom-rules-engine
            engine/target/release/axiom-rules-engine.provenance.json
          key: ${{ steps.toolchain.outputs.engine_cache_key }}

      - name: Checkout axiom-rules-engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: TheAxiomFoundation/axiom-rules-engine
          ref: ${{ steps.toolchain.outputs.engine_ref }}
          path: engine

      - name: Install Rust toolchain
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Build axiom-rules-engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        working-directory: axiom-oracles
        run: >-
          uv run python -m axiom_oracles.engine_identity build
          --repo ../engine --binary ../engine/target/release/axiom-rules-engine
          -- cargo build --release --locked --bin axiom-rules-engine -j 4

      - name: Verify engine receipt against cached executable bytes
        working-directory: axiom-oracles
        run: >-
          uv run python -m axiom_oracles.engine_identity inspect
          ../engine/target/release/axiom-rules-engine
          --expect-commit '${{ steps.toolchain.outputs.engine_ref }}'

  replay:
    name: Replay ${{ matrix.suite }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.prepare.outputs.suites) }}
    env:
      REPORT_DIR: ${{ github.workspace }}/snap-qc-reports
      ENGINE_BIN: ${{ github.workspace }}/engine/target/release/axiom-rules-engine
    steps:
      - name: Checkout axiom-oracles
        uses: actions/checkout@v4
        with:
          path: axiom-oracles
          # A publishing call packs against main over the published data, as
          # affected-rerun.yml's bare legs do; materialize --baseline needs
          # the oracle-data history.
          ref: ${{ inputs.publish && 'main' || '' }}
          fetch-depth: ${{ inputs.publish && '0' || '1' }}

      - name: Checkout rulespec-us
        uses: actions/checkout@v4
        with:
          repository: TheAxiomFoundation/rulespec-us
          ref: ${{ needs.prepare.outputs.rulespec_sha }}
          path: rulespec-us

      - name: Restore engine binary
        uses: actions/cache/restore@v4
        with:
          path: |
            engine/target/release/axiom-rules-engine
            engine/target/release/axiom-rules-engine.provenance.json
          key: ${{ needs.prepare.outputs.engine_cache_key }}
          fail-on-cache-miss: true

      - name: Restore pinned PUF archive
        uses: actions/cache/restore@v4
        with:
          path: puf-archive
          key: ${{ needs.prepare.outputs.puf_cache_key }}
          fail-on-cache-miss: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: axiom-oracles/uv.lock

      - name: Install axiom-oracles
        working-directory: axiom-oracles
        run: uv sync

      - name: Load published data baseline
        # Only a publishing call: the replay then rewrites the published
        # report, and --pack refuses a checkout without this baseline.
        if: ${{ inputs.publish }}
        working-directory: axiom-oracles
        run: uv run python scripts/oracle_data.py materialize --baseline

      - name: Verify cached engine receipt against executable bytes
        working-directory: axiom-oracles
        run: >-
          uv run python -m axiom_oracles.engine_identity inspect
          ../engine/target/release/axiom-rules-engine
          --expect-commit '${{ needs.prepare.outputs.engine_ref }}'

      - name: Verify and extract pinned PUF
        working-directory: axiom-oracles
        run: >-
          uv run scripts/snap_qc_replay.py fetch-puf
          --archive-dir ../puf-archive --data-dir "$RUNNER_TEMP/snap-qc-data"

      - name: Replay ${{ matrix.suite }}
        id: replay
        working-directory: axiom-oracles
        env:
          AXIOM_SNAP_QC_RULESPEC_ROOT: ${{ github.workspace }}/rulespec-us
          AXIOM_SNAP_QC_AXIOM_BINARY: ${{ github.workspace }}/engine/target/release/axiom-rules-engine
          AXIOM_SNAP_QC_DATA_DIR: ${{ runner.temp }}/snap-qc-data
          AXIOM_ORACLES_RUN_KIND: ${{ inputs.run_kind || (github.event_name == 'schedule' && 'weekly' || 'manual') }}
          SUITE: ${{ matrix.suite }}
        run: |
          set -o pipefail
          mkdir -p "$REPORT_DIR"
          uv run scripts/run_comparison.py "$SUITE" --summary --require-live \
            --output-dir "$REPORT_DIR" 2>&1 | tee "$REPORT_DIR/replay.log"

      - name: Check ${{ matrix.suite }} is live and exact
        if: ${{ !cancelled() && steps.replay.outcome != 'skipped' }}
        working-directory: axiom-oracles
        env:
          SUITE: ${{ matrix.suite }}
          RULESPEC_SHA: ${{ needs.prepare.outputs.rulespec_sha }}
          REPLAY_FAILED: ${{ steps.replay.outcome == 'failure' && '--replay-failed' || '' }}
        run: >-
          uv run scripts/snap_qc_replay.py check "$SUITE"
          --report-dir "$REPORT_DIR" --log "$REPORT_DIR/replay.log"
          --expect-rulespec-sha "$RULESPEC_SHA"
          --expect-axiom-binary "$ENGINE_BIN" $REPLAY_FAILED

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: snap-qc-replay-${{ matrix.suite }}
          path: snap-qc-reports/
          if-no-files-found: warn

      # Only for a publishing call (the affected rerun), and only after
      # `check` accepted the report as live and exact. --pack collects what
      # the run wrote (the dashboard report, plus the case chunks of a suite
      # with versioned chunks), vets it once (the re-emission guard,
      # regenerate + verify every derived artifact, the unexplained ratchet)
      # and bundles it. It never fetches, commits or pushes.
      - name: Pack ${{ matrix.suite }}'s live report for the publish job
        id: pack
        if: ${{ inputs.publish && success() }}
        working-directory: axiom-oracles
        env:
          PYTHON: ${{ github.workspace }}/axiom-oracles/.venv/bin/python
          SUITE: ${{ matrix.suite }}
        run: |
          scripts/commit_refreshed_report.sh --pack "$RUNNER_TEMP/refreshed" "$SUITE"
          if [ -d "$RUNNER_TEMP/refreshed/$SUITE" ]; then
            echo "bundle=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload refreshed-report bundle
        if: steps.pack.outputs.bundle == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-${{ matrix.suite }}
          path: ${{ runner.temp }}/refreshed/${{ matrix.suite }}/
          if-no-files-found: error
          include-hidden-files: true
          # A "re-run all jobs" re-packs under the same name.
          overwrite: true
          retention-days: 7

  live-tests:
    name: Engine-gated live tests
    needs: prepare
    # The weekly and dispatched runs cover these; a publishing call from the
    # affected rerun only needs the replays.
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout axiom-oracles
        uses: actions/checkout@v4
        with:
          path: axiom-oracles

      - name: Checkout rulespec-us
        uses: actions/checkout@v4
        with:
          repository: TheAxiomFoundation/rulespec-us
          ref: ${{ needs.prepare.outputs.rulespec_sha }}
          path: rulespec-us

      - name: Restore engine binary
        uses: actions/cache/restore@v4
        with:
          path: |
            engine/target/release/axiom-rules-engine
            engine/target/release/axiom-rules-engine.provenance.json
          key: ${{ needs.prepare.outputs.engine_cache_key }}
          fail-on-cache-miss: true

      - name: Restore pinned PUF archive
        uses: actions/cache/restore@v4
        with:
          path: puf-archive
          key: ${{ needs.prepare.outputs.puf_cache_key }}
          fail-on-cache-miss: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: axiom-oracles/uv.lock

      - name: Install axiom-oracles
        working-directory: axiom-oracles
        run: uv sync --extra dev

      - name: Verify cached engine receipt against executable bytes
        working-directory: axiom-oracles
        run: >-
          uv run python -m axiom_oracles.engine_identity inspect
          ../engine/target/release/axiom-rules-engine
          --expect-commit '${{ needs.prepare.outputs.engine_ref }}'

      - name: Verify and extract pinned PUF
        working-directory: axiom-oracles
        run: >-
          uv run scripts/snap_qc_replay.py fetch-puf
          --archive-dir ../puf-archive --data-dir "$RUNNER_TEMP/snap-qc-data"

      - name: Run engine-gated tests (no skips allowed)
        working-directory: axiom-oracles
        env:
          AXIOM_SNAP_QC_DATA_DIR: ${{ runner.temp }}/snap-qc-data
          AXIOM_RULES_ENGINE_BIN: ${{ github.workspace }}/engine/target/release/axiom-rules-engine
          RULESPEC_US_SNAP_FY2024_ROOT: ${{ github.workspace }}/rulespec-us
        run: |
          uv run pytest -rs --junitxml="$RUNNER_TEMP/live-tests.xml" \
            tests/test_snap_qc_population.py::test_live_fy2024_row_counts \
            tests/test_snap_qc_compare.py::test_live_engine_reproduces_worked_example \
            tests/test_rulespec_overlay.py::test_live_overlay_closure_resolves_once_at_the_nominal_month
          # A live test that skips proves nothing: fail unless every one ran.
          uv run python - "$RUNNER_TEMP/live-tests.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          from scripts.snap_qc_replay import REQUIRED_SUITES

          suite = ET.parse(sys.argv[1]).getroot().find("testsuite")
          tests, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          expected = 2 + len(REQUIRED_SUITES)
          if tests != expected or skipped:
              raise SystemExit(f"expected {expected} live tests to run; ran {tests}, skipped {skipped}")
          print(f"{tests} live tests ran, none skipped")
          PY
