name: Oracle Comparisons

# Matrix-runs every comparison declared in comparisons/*.yaml. Adding a new
# comparison is a YAML edit — no workflow change required. Reports are
# uploaded as workflow artifacts; headline agreement numbers land in each
# job's run summary. Reports stay gitignored by repo convention.
#
# See comparisons/README.md for the registry schema and runner types.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Run only this comparison name (blank = all)"
        required: false
        default: ""
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: oracle-comparisons
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Build comparison matrix
        id: list
        env:
          ONLY: ${{ inputs.only }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          only = os.environ.get("ONLY", "").strip()
          names = sorted(p.stem for p in Path("comparisons").glob("*.yaml"))
          if only:
              names = [n for n in names if n == only]
              if not names:
                  raise SystemExit(f"unknown comparison: {only}")
          matrix = {"include": [{"name": n} for n in names]}
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"matrix={json.dumps(matrix)}\n")
          print(json.dumps(matrix, indent=2))
          PY

  compare:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout axiom-oracles
        uses: actions/checkout@v4
        with:
          path: axiom-oracles

      - name: Checkout axiom-encode
        uses: actions/checkout@v4
        with:
          repository: TheAxiomFoundation/axiom-encode
          path: axiom-encode
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout axiom-rules
        uses: actions/checkout@v4
        with:
          repository: TheAxiomFoundation/axiom-rules
          path: axiom-rules
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axiom-rules/target
          key: cargo-${{ runner.os }}-${{ hashFiles('axiom-rules/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install orchestrator deps + axiom-oracles
        working-directory: axiom-oracles
        run: |
          uv pip install --system -e '.[policyengine]'

      - name: Cache PolicyEngine ECPS dataset
        uses: actions/cache@v4
        with:
          path: ~/.cache/policyengine
          key: pe-ecps-${{ runner.os }}

      # The pinned populace-us artifact (see
      # axiom_oracles/populations/enhanced_cps.py::POPULACE_PINS) downloads to
      # the Hugging Face hub cache, not ~/.cache/policyengine. Key the cache on
      # the pinned revision so a re-pin busts it automatically; the ~349MB
      # dense .h5 is fetched once per revision instead of every weekly run.
      - name: Cache pinned populace-us artifact (HF hub cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: >-
            populace-hf-${{ runner.os }}-${{
              hashFiles('axiom-oracles/axiom_oracles/populations/enhanced_cps.py')
            }}
          restore-keys: |
            populace-hf-${{ runner.os }}-

      - name: Run comparison
        env:
          AXIOM_ENCODE_REPO: ${{ github.workspace }}/axiom-encode
          AXIOM_RULES_REPO: ${{ github.workspace }}/axiom-rules
        working-directory: axiom-oracles
        run: |
          # The runner configs reference $HOME/axiom-encode etc.; symlink the
          # checked-out siblings so config paths resolve without per-CI edits.
          ln -sfn "$AXIOM_ENCODE_REPO" "$HOME/axiom-encode"
          ln -sfn "$AXIOM_RULES_REPO" "$HOME/axiom-rules"
          python3 scripts/run_comparison.py ${{ matrix.name }} --summary

      - name: Summarize agreement
        if: always()
        working-directory: axiom-oracles
        run: |
          latest=$(ls -t reports/*${{ matrix.name }}*.json 2>/dev/null | head -1)
          if [ -z "$latest" ]; then
            echo "(no report produced)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "## ${{ matrix.name }} ($(basename "$latest"))" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 -c "
          import json
          d = json.load(open('$latest'))
          if 'compared_values' in d:
              cv, mc = d['compared_values'], d['mismatch_count']
              pct = 100*(cv-mc)/cv if cv else 0
              print(f'compared_values: {cv}')
              print(f'mismatch_count:  {mc}')
              print(f'agreement:       {pct:.4f}%')
          elif 'case_count' in d:
              cc = d.get('case_count', 0)
              mm = sum(len(c.get('mismatches', []) or []) for c in d.get('cases', []))
              print(f'cases:            {cc}')
              print(f'mismatch_entries: {mm}')
          " >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.name }}
          path: axiom-oracles/reports/*${{ matrix.name }}*.json

  # Per-rule verification KPI (Phase-A item A7). Regenerates
  # rule_verification.json + rule_verification_summary.json from the current
  # rulespec-us tree so the coverage number can't rot, and commits the refresh
  # back on the weekly schedule. Guards: only commits on schedule (not
  # workflow_dispatch dry-runs), and no-ops cleanly if the checkout is missing.
  rule-coverage:
    needs: compare
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout axiom-oracles
        uses: actions/checkout@v4

      - name: Checkout rulespec-us
        uses: actions/checkout@v4
        with:
          repository: TheAxiomFoundation/rulespec-us
          path: .rulespec-us
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history so rule_verification.py can rev-parse / cat-file the ref.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Regenerate per-rule verification data
        run: |
          if [ ! -d .rulespec-us ]; then
            echo "rulespec-us checkout missing; skipping."
            exit 0
          fi
          python3 scripts/rule_verification.py \
            --rulespec .rulespec-us --ref HEAD --no-fetch

      - name: Commit refreshed coverage KPI (scheduled runs only)
        if: github.event_name == 'schedule'
        run: |
          if git diff --quiet -- dashboard/public/data/rule_verification.json \
               dashboard/public/data/rule_verification_summary.json; then
            echo "no coverage changes"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/public/data/rule_verification.json \
                  dashboard/public/data/rule_verification_summary.json
          git commit -m "data: refresh per-rule verification KPI $(date +%Y-%m-%d)"
          git push

      - name: Summarize coverage KPI
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("dashboard/public/data/rule_verification_summary.json")
          if not p.exists():
              print("(no summary produced)"); raise SystemExit
          s = json.loads(p.read_text())
          r, surf = s["rules"], s["surfaces"]
          print("## Per-rule verification KPI")
          print("")
          print(f"- rules: **{r['total']}**")
          print(f"- grounded: **{r['grounded_pct']}%**")
          print(f"- manifest-backed: **{r['manifest_backed_pct']}%**")
          print(f"- executable oracle surfaces: **{surf['executable']}/{surf['total']}** ({surf['executable_pct']}%)")
          print(f"- rules on an oracle surface (lower bound): **{r['on_oracle_surface_pct']}%**")
          PY
