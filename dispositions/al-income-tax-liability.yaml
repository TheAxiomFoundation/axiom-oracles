entries:
- id: al-taxsim-2026-deduction-table-projection-single-30000
  concept: us-al:policies/income_tax/pilot_liability_pipeline#al_pit_pilot_income_tax_liability
  case_id: al-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: |-
      Both engines run at the 2026 law year and both deduct the filer's
      federal income tax under section 40-18-15(a)(1), so the Alabama bases
      are closely coupled. TAXSIM's 2026 module extrapolates the income-phased
      section 40-18-15 standard-deduction table to fractional projected values
      and carries its own whole-dollar 2026 federal tax into the deduction,
      leaving a cent-level base drift (implied offset 5,885.56; staxbc
      1,164.52 vs the enacted 1,174.00). Residual = 1,174.00 - 1,164.52 =
      9.48. TAXSIM 2026 deduction-table projection, not a pipeline defect; the
      pipeline matches PolicyEngine at 2026 to the cent on every grid case.
    arithmetic:
    - expression: 1174.0 - 1164.52
      equals: 9.48
      tolerance: 0.02
  expires_on_source_change: true
  pinned:
    left: 1174.0001
    right: 1164.52
