entries:
- id: al-taxsim-2024-vintage-single-30000
  concept: us-al:policies/income_tax/pilot_liability_pipeline#al_pit_pilot_income_tax_liability
  case_id: al-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: TAXSIM runs at its latest 2024 law year. Alabama's section 40-18-5
      rate schedule (2/4/5 per cent) is unchanged between 2024 and 2026; the residual
      is the section 40-18-15(a)(1) federal-income-tax-deduction vintage. Alabama
      deducts the filer's federal income tax, which fell from 2024 to 2026 as the
      OBBBA rate schedule took effect, so the 2026 Alabama taxable income and tax
      are higher than TAXSIM's 2024 computation. The pipeline reports 1174.00; TAXSIM
      2024 reports 1164.73. Pinned-2024-law-year vintage, not a pipeline defect;
      the pipeline matches PolicyEngine at 2026 to the cent.
    arithmetic:
    - expression: 1174.0001 - 1164.73
      equals: 9.2701
      tolerance: 0.01
  expires_on_source_change: true
  pinned:
    left: 1174.0001
    right: 1164.73
