entries:
  - id: qbid-floor-uses-all-qbi-instead-of-active-business-qbi
    concept: us:policies/income_tax/qualified_business_income_deduction_pipeline#federal_qualified_business_income_deduction
    case_id: qbid-above-nowages
    kind: amount_difference
    disposition: upstream_engine_gap
    evidence:
      mechanism: >-
        PE-US 1.767.3 has the correct 2026 $400-at-$1,000 deduction-floor
        parameters, but qualified_business_income_deduction.py lines 20-34
        calculates the floor from total qualified_business_income plus
        sstb_qualified_business_income. It exposes no separate aggregate of
        QBI from active qualified trades or businesses. This fixture has
        $300,000 of QBI but an active-business QBI aggregate of zero, so
        section 199A(i)'s active-business minimum is inapplicable and the
        wage/UBIA-limited lawful result is zero; PE returns its $400 floor.
      arithmetic:
        - expression: "400 - 0"
          equals: 400
      upstream_url: https://github.com/PolicyEngine/policyengine-us/issues/9150
      sources:
        - comparisons/us-qbid-grid.yaml
        - https://www.congress.gov/119/plaws/publ21/PLAW-119publ21.pdf
        - https://github.com/PolicyEngine/policyengine-us/blob/49d19b239a593dbac8920ac6fd80cfe33372343a/policyengine_us/variables/gov/irs/income/taxable_income/deductions/qualified_business_income_deduction/qualified_business_income_deduction.py#L20-L34
    expires_on_source_change: true
    pinned:
      left: 0
      right: 400
