- id: or-uprating-vintage-flat-deltas
  concept: us-or:policies/income_tax/pilot_liability_pipeline#or_pit_pilot_income_tax_liability
  kind: amount_difference
  case_selector:
    case_ids:
    - or-married-120000
    - or-married-300000
    - or-married-60000
    - or-single-150000
    - or-single-30000
    - or-single-60000
  disposition: explained_residual
  evidence:
    mechanism: "Parameter uprating vintage between the legs: the axiom program carries\n\
      FY2026-uprated OR parameters while the oracle leg's parameter set holds\n\
      the prior vintage, producing income-invariant flat deltas within each\nfiling\
      \ band (the fingerprint: identical differences across the grid's\nincome levels\
      \ \u2014 e.g. Washington's flat \\$163.92 equals the 7 percent\nrate times\
      \ the \\$2,342 capital-gains standard-deduction vintage gap, PE\n278,000 vs\
      \ axiom's uprated value). Favors the encoded 2026 truth;\nresolves when the\
      \ oracle's parameters uprate."
    arithmetic:
    - expression: '-6.0'
      equals: -6.0
      tolerance: 0.05
    - expression: '-3.5'
      equals: -3.5
      tolerance: 0.05
    - expression: '258.0'
      equals: 258.0
      tolerance: 0.05
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/315
  expires_on_source_change: true
