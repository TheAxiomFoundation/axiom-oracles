- id: or-pe-2026-uprating-single-30000
  concept: us-or:policies/income_tax/pilot_liability_pipeline#or_pit_pilot_income_tax_liability
  case_id: or-single-30000
  kind: policyengine_amount_difference
  disposition: axiom_encoding_gap
  evidence:
    mechanism: "The Axiom leg evaluates the fixtures' completed Oregon taxable income,\
      \ whose baked-in indexed deduction/bracket vintage sits one indexation step\
      \ behind PolicyEngine's 2026 projection \u2014 a constant $3.50 (single) /\
      \ $6.00 (married) residual across the whole income grid. Oregon DOR's official\
      \ 2026 indexed amounts (and the HB 3753 deduction change) are not yet reflected\
      \ by either side. Actionable upstream: regenerate the rulespec-us companion\
      \ fixtures via the encoder once official 2026 amounts publish; not fixable\
      \ in this repo."
