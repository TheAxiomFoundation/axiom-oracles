- id: tanf-zero-counterfactual-28685
  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-28685
  kind: amount_difference
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
  evidence:
    upstream_url: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
    mechanism: 'Exact-household requested-month counterfactual on PolicyEngine 4.18.9,
      PolicyEngine-US 1.767.3, and PolicyEngine-Core 3.30.3: the fixed-runner baseline
      is Axiom 546.0 versus January PolicyEngine 501.29998779296875, reproduced
      by the direct requested-period replay. PolicyEngine reports January sc_tanf
      356.5537414550781 and calendar-year aggregate TANF 4303.4267578125. Forcing
      both the state component and aggregate TANF to zero at their native periods
      keeps SNAP eligibility True and produces January SNAP 546.0; its absolute
      delta from Axiom is 0.0, within the unchanged suite tolerance 7.0. The legacy
      annual-average pin was 546.0 / 504.7347819010417 / 41.265218098958314; the
      requested-month pin is 546.0 / 501.29998779296875 / 44.70001220703125 (materially
      changed). Replay receipt SHA-256 38c0860662f48c8acc707456d5b21d79b9de2d29b2a9eb15931bdd2840f19436
      reproduces the fixed 2026-01 baseline and counterfactual; material movement=true.'
    arithmetic:
    - expression: 546.0 - 546.0
      equals: 0.0
      tolerance: 1.0e-09
    sources:
    - dashboard/public/data/axiom-policyengine-sc-snap-ecps.json
    - https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.9(b)(2)(i)
  expires_on_source_change: true
  pinned:
    left: 546.0
    right: 501.29998779296875
    difference: 44.70001220703125
