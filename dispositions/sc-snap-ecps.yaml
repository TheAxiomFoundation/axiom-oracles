- id: sc-pe-annual-eligibility-aggregation-2026-07-30
  concept: us:statutes/7/2014/o#snap_eligible
  kind: eligibility_right_only
  case_selector:
    case_ids:
    - ecps-28726
    - ecps-29647
  disposition: bridge_artifact
  evidence:
    mechanism: 'The comparison''s PolicyEngine eligibility boolean comes from the
      batch output dataset''s calendar-2026 aggregation, which reports eligible
      although the direct requested-month (2026-01) simulation is ineligible for
      January: the household fails the January income eligibility tests under the
      FY-2026 parameters while other 2026 months pass (income-limit uprating across
      the October fiscal-year boundary), and Axiom evaluates 2026-01 only. Verified
      per-row on the pinned stack (PolicyEngine 4.18.9 / PolicyEngine-US 1.767.3
      / PolicyEngine-Core 3.30.3): the committed adapter reproduces the annual-aggregated
      True while the direct January simulation returns False on every selected row
      (2 rows; sample ecps-28726 January gross-income-to-poverty ratio 1.3072).
      The January benefit is zero on both engines, so only the eligibility boolean
      diverges — a harness period-aggregation artifact, not an engine defect.'
    sources:
    - dashboard/public/data/axiom-policyengine-sc-snap-ecps.json
    - axiom_oracles/adapters/policyengine/runner.py
  expires_on_source_change: true
- id: tanf-zero-counterfactual-29194
  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-29194
  kind: amount_difference
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
  evidence:
    mechanism: Exact-household requested-month counterfactual on PolicyEngine 4.18.9
      / PolicyEngine-US 1.767.3 / PolicyEngine-Core 3.30.3. The committed comparison
      adapter replayed over the same Case projection reproduces the report pin (Axiom
      139 versus January PolicyEngine 4.39996). Forcing the aggregate and state
      TANF inputs to zero in the direct requested-month simulation produces January
      SNAP 140; its absolute delta from Axiom, 1.0, is within the unchanged suite
      tolerance 7.0. The comparison bridge zeroes TANF on the Axiom input surface
      while PolicyEngine computes state TANF endogenously and counts it as SNAP
      unearned income (axiom-oracles#397 counterfactual class).
