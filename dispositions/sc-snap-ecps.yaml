- id: sc-bbce-net-waiver-snap_eligible
  concept: us:statutes/7/2014/o#snap_eligible
  kind: eligibility_right_only
  case_selector:
    case_ids:
    - ecps-28994
    - ecps-29544
  disposition: axiom_encoding_gap
  evidence:
    mechanism: |-
      South Carolina's broad-based categorical eligibility (SNAP state option;
      PolicyEngine models gross screen x1.3 FPL, x2.0 for elderly/disabled
      households, at 2026-01 per gov/hhs/tanf/non_cash parameters) is not in
      the composed us-sc/snap/fy-2026 program, which applies only the standard
      federal tests. Every selected row is verified per-row against axiom's
      persisted output surface: the household passes axiom's gross test and
      fails only the net-income test, which the state's BBCE waives. Axiom-
      side modeling boundary, tracked for encoding in rulespec-us#1098.
  linked_issue: https://github.com/TheAxiomFoundation/rulespec-us/issues/1098
  expires_on_source_change: true
- id: tanf-zero-counterfactual-28685
  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-28685
  kind: amount_difference
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
  evidence:
    upstream_url: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
    mechanism: >-
      Exact-household live counterfactual on PolicyEngine 4.18.9, PolicyEngine-US 1.767.3,
      and PolicyEngine-Core 3.28.0: the regenerated baseline is Axiom 546.0 versus PE
      504.7347819010417. PE reports monthly sc_tanf 358.618896484375 and aggregate TANF
      358.618896484375. Forcing both to zero leaves SNAP eligibility true and produces PE
      SNAP 549.059814453125; its absolute delta from Axiom is 3.059814453125, within the
      suite tolerance 7.0. This exact counterfactual isolates endogenous TANF transport as
      the mismatch mechanism.
    arithmetic:
    - expression: "549.059814453125 - 546.0"
      equals: 3.059814453125
      tolerance: 1.0e-09
    sources:
    - dashboard/public/data/axiom-policyengine-sc-snap-ecps.json
    - https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.9(b)(2)(i)
  expires_on_source_change: true
  pinned:
    left: 546.0
    right: 504.7347819010417
    difference: 41.265218098958314
