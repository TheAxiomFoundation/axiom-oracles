- id: sc-bbce-gross-band-snap_eligible
  concept: us:statutes/7/2014/o#snap_eligible
  kind: eligibility_right_only
  case_selector:
    case_ids:
    - ecps-28700
    - ecps-28785
    - ecps-28866
    - ecps-28913
    - ecps-28928
    - ecps-29054
    - ecps-29143
    - ecps-29228
    - ecps-29255
    - ecps-29293
    - ecps-29304
    - ecps-29333
    - ecps-29348
    - ecps-29413
    - ecps-29426
    - ecps-29428
    - ecps-29475
    - ecps-29498
    - ecps-29568
    - ecps-29604
  disposition: axiom_encoding_gap
  evidence:
    mechanism: 'South Carolina''s broad-based categorical eligibility (SNAP state
      option;

      PolicyEngine models gross screen x1.3 FPL, x2.0 for elderly/disabled

      households, at 2026-01 per gov/hhs/tanf/non_cash parameters) is not in

      the composed us-sc/snap/fy-2026 program, which applies only the standard

      federal tests. Every selected row is verified per-row against axiom''s

      persisted output surface: household gross income sits inside the band

      above the federal 130 percent limit the composed program applies and at

      or below the state''s BBCE screen, verified against axiom''s own computed

      gross income and limit. Axiom-side modeling boundary, tracked for

      encoding in rulespec-us#1098. Requested-month selector audit retained 20 of
      20 rows; vanished cases: none; materially moved rows: 0.'
  linked_issue: https://github.com/TheAxiomFoundation/rulespec-us/issues/1098
  expires_on_source_change: true
- id: pe-lone-minor-child-earnings-benefit
  concept: us:statutes/7/2014/u#snap_benefit
  case_selector:
    case_ids:
    - ecps-29280
    - ecps-29677
  kind: amount_difference
  disposition: upstream_engine_gap
  linked_issue: https://github.com/PolicyEngine/policyengine-us/issues/9157
  evidence:
    upstream_url: https://github.com/PolicyEngine/policyengine-us/issues/9157
    mechanism: 'Reverified on PolicyEngine 4.18.9, PolicyEngine-US 1.767.3, and
      PolicyEngine-Core 3.30.3. The exact-household signature and explicit K-12
      counterfactual reproduce the mechanism: PolicyEngine excludes all earnings
      of an imputed K-12 member age 17 or younger without requiring the co-resident-parent
      or parental-control condition in 7 CFR 273.9(c)(7). The sole minor is a valid
      household under 273.1(a)(1), but wages count under 273.9(b)(1)(i), so Axiom
      correctly fails the income gate and returns zero benefit. Requested-month
      selector audit retained 2 of 2 rows; vanished cases: none; materially moved
      rows: 2 (ecps-29280 right 299.66998291015625 -> 298.0; ecps-29677 right 299.66998291015625
      -> 298.0).'
    sources:
    - dashboard/public/data/axiom-policyengine-sc-snap-ecps.json
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.1(a)(1)
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.9(b)(1)(i)
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.9(c)(7)
  expires_on_source_change: true
