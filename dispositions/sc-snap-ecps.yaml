- id: endogenous-income-stack-counterfactual-29298
  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-29298
  kind: amount_difference
  disposition: bridge_artifact
  evidence:
    mechanism: 'Exact-household requested-month counterfactual on PolicyEngine 4.18.9
      / PolicyEngine-US 1.767.3 / PolicyEngine-Core 3.30.3. The committed comparison
      adapter replayed over the same Case projection reproduces the report pin (Axiom
      439.0 versus January PolicyEngine 382.29998779296875), and the unmodified
      direct requested-month simulation reproduces the same January value. Forcing
      the endogenously imputed SSI, medical-expense, self-employment, and TANF inputs
      to zero in the direct requested-month simulation produces January SNAP 439.89996337890625;
      its absolute delta from Axiom, 0.89996337890625, is within the unchanged suite
      tolerance 7.0. The household carries no SSI on the projected Enhanced CPS
      input surface (the bridge projects zero SSI to Axiom), while PolicyEngine''s
      direct requested-month path imputes an endogenous SSI award into SNAP unearned
      income, so the engines price different income surfaces. Axiom receives zero
      medical-expense input while PolicyEngine imputes allowable medical expenses
      for the elderly/disabled member, feeding an excess medical deduction the bridge
      never projects to Axiom (axiom-oracles#362 class). Self-employment income
      enters the two engines on different surfaces (the projection''s flat 0.6 netting
      versus PolicyEngine''s state expense-based treatment), and zeroing it on the
      PolicyEngine side closes the residual. Replay classifier record: class=endogenous_combo.'
    arithmetic:
    - expression: 439.89996337890625 - 439.0
      equals: 0.89996337890625
