- id: nv-pregnant-2024-2025-expansions-not-encoded
  concept: us-nv:policies/cms/nevada-medicaid-chip-bhp-eligibility-levels#nevada_pregnant_women_medicaid_effective_fpl_limit
  case_id: medicaid-thresholds-states-nv-pregnant
  kind: amount_difference
  disposition: axiom_encoding_gap
  linked_issue: https://github.com/TheAxiomFoundation/rulespec-us/issues/1185
  evidence:
    mechanism: >-
      Axiom encodes 1.65 (160% + the 5-point MAGI disregard), Nevada's
      pre-2024 pregnant-women level. CMS-approved SPA NV-23-0030 raised
      pregnant-women eligibility to 185% FPL (190% effective) from January
      2024, and Nevada subsequently raised it again (SPA 25-0006 to 190%
      effective July 2025, then to a 200% income standard per Nevada
      Medicaid web announcement 3748 of 2025-10-20; KFF reports 205%
      effective as of January 2026). PolicyEngine's 1.90 matches the 2024
      level and is itself one update behind, but Axiom's 1.65 is stale
      against every post-2023 authoritative level, so the row is an Axiom
      encoding gap first. The pinned difference matches the 2024 SPA step.
    arithmetic:
    - expression: 1.90 - 1.65
      equals: 0.25
    - expression: (185 - 160) / 100
      equals: 0.25
    upstream_url: https://www.medicaid.gov/medicaid/spa/downloads/NV-23-0030.pdf
    sources:
    - dashboard/public/data/axiom-policyengine-medicaid-thresholds-states.json
    - https://medicaid.nv.gov/Downloads/provider/web_announcement_3748_20251020.pdf
    - https://www.kff.org/affordable-care-act/state-indicator/medicaid-and-chip-income-eligibility-limits-for-pregnant-women-as-a-percent-of-the-federal-poverty-level/
  expires_on_source_change: true
  pinned:
    left: 1.6500000000000001
    right: 1.9
- id: ri-pregnant-medicaid-vs-chip-scope
  concept: us-ri:policies/cms/rhode-island-medicaid-chip-bhp-eligibility-levels#rhode_island_pregnant_women_medicaid_effective_fpl_limit
  case_id: medicaid-thresholds-states-ri-pregnant
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: >-
      Scope difference between two current, defensible readings. Axiom's
      concept is the Medicaid-only effective limit for pregnant women:
      1.95 (190% Medicaid + the 5-point MAGI disregard), matching the CMS
      eligibility-levels table (RI pregnant Medicaid 190%). PolicyEngine's
      pregnant income_limit parameter stores the highest pregnancy
      coverage including Rhode Island's CHIP-funded coverage: 2.58 (253%
      CHIP + 5), matching both the CMS table's Pregnant Women CHIP column
      (253%) and KFF's January-2026 RI CHIP figure (258%). The residual is
      exactly the Medicaid-vs-CHIP column gap; neither engine misstates
      its source.
    arithmetic:
    - expression: 2.58 - 1.95
      equals: 0.63
    - expression: (253 - 190) / 100
      equals: 0.63
    upstream_url: https://www.medicaid.gov/medicaid/national-medicaid-chip-program-information/medicaid-childrens-health-insurance-program-basic-health-program-eligibility-levels/index.html
    sources:
    - dashboard/public/data/axiom-policyengine-medicaid-thresholds-states.json
    - https://www.kff.org/affordable-care-act/state-indicator/medicaid-and-chip-income-eligibility-limits-for-pregnant-women-as-a-percent-of-the-federal-poverty-level/
  expires_on_source_change: true
  pinned:
    left: 1.95
    right: 2.58
- id: tn-infant-pe-value-contradicts-cms
  concept: us-tn:policies/cms/tennessee-medicaid-chip-bhp-eligibility-levels#tennessee_children_medicaid_ages_0_to_1_effective_fpl_limit
  case_id: medicaid-thresholds-states-tn-infant
  kind: amount_difference
  disposition: upstream_engine_gap
  linked_issue: https://github.com/PolicyEngine/policyengine-us/issues/9182
  evidence:
    mechanism: >-
      Axiom's 2.00 is the CMS eligibility-levels table value for TennCare
      infants (195% Medicaid + the 5-point MAGI disregard), corroborated
      by KFF's January-2026 infant table (Tennessee 195%). PolicyEngine
      stores a flat 2.16 for all Tennessee child age bands, unchanged
      since its 2018-01-01 entry, which matches neither the Medicaid
      infant level (195%/200% effective) nor CoverKids separate CHIP
      (250%/255% effective) in any current source. No PolicyEngine issue
      tracks the Tennessee children's limits.
    arithmetic:
    - expression: 2.16 - 2.00
      equals: 0.16
    upstream_url: https://www.medicaid.gov/medicaid/national-medicaid-chip-program-information/medicaid-childrens-health-insurance-program-basic-health-program-eligibility-levels/index.html
    sources:
    - dashboard/public/data/axiom-policyengine-medicaid-thresholds-states.json
    - https://www.kff.org/medicaid/state-indicator/medicaid-income-eligibility-limits-for-infants-ages-0-1/
  expires_on_source_change: true
  pinned:
    left: 2.0
    right: 2.16
