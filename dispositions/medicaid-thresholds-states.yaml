- id: tn-pregnant-medicaid-vs-coverkids-scope
  concept: us-tn:policies/cms/tennessee-medicaid-chip-bhp-eligibility-levels#tennessee_pregnant_women_medicaid_effective_fpl_limit
  case_id: medicaid-thresholds-states-tn-pregnant
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: >-
      Scope difference between two current, defensible readings. Axiom's
      concept is the Medicaid-only effective limit: 2.00 (TennCare for
      Pregnant Women at 195% + the 5-point MAGI disregard), matching the
      CMS eligibility-levels table (Tennessee pregnant Medicaid 195%,
      Pregnant CHIP N/A because CoverKids maternity coverage runs through
      the unborn-child option). PolicyEngine's 2.55 is the highest
      pregnancy coverage including CoverKids CHIP-funded maternity
      coverage at 250% FPL (+5), the figure KFF reports for Tennessee as
      of January 2026 (255%). The residual is exactly the
      Medicaid-vs-CoverKids gap; neither engine misstates its source.
    arithmetic:
    - expression: 2.55 - 2.00
      equals: 0.55
    - expression: (250 - 195) / 100
      equals: 0.55
    upstream_url: https://www.medicaid.gov/medicaid/national-medicaid-chip-program-information/medicaid-childrens-health-insurance-program-basic-health-program-eligibility-levels/index.html
    sources:
    - dashboard/public/data/axiom-policyengine-medicaid-thresholds-states.json
    - https://www.kidcentraltn.com/health/insurance/coverkids.html
    - https://www.kff.org/affordable-care-act/state-indicator/medicaid-and-chip-income-eligibility-limits-for-pregnant-women-as-a-percent-of-the-federal-poverty-level/
  expires_on_source_change: true
  pinned:
    left: 2.0
    right: 2.55
- id: wa-pregnant-2024-expansion-not-encoded
  concept: us-wa:policies/cms/washington-medicaid-chip-bhp-eligibility-levels#washington_pregnant_women_medicaid_effective_fpl_limit
  case_id: medicaid-thresholds-states-wa-pregnant
  kind: amount_difference
  disposition: axiom_encoding_gap
  linked_issue: https://github.com/TheAxiomFoundation/rulespec-us/issues/1185
  evidence:
    mechanism: >-
      Axiom encodes 1.98 (193% + the 5-point MAGI disregard) from the CMS
      eligibility-levels table, which predates Washington's expansion. The
      Washington Health Care Authority raised the income limit for Apple
      Health for pregnant individuals (and After-Pregnancy Coverage) to
      210% FPL effective 2024-11-01, an effective 215% with the disregard.
      PolicyEngine's 2.15 matches the current authoritative level (WA HCA;
      KFF as of January 2026: Washington 215%). Axiom's cited CMS table
      snapshot is stale.
    arithmetic:
    - expression: 2.15 - 1.98
      equals: 0.17
    - expression: (210 - 193) / 100
      equals: 0.17
    upstream_url: https://www.hca.wa.gov/free-or-low-cost-health-care/i-help-others-apply-and-access-apple-health/apple-health-pregnant-individuals
    sources:
    - dashboard/public/data/axiom-policyengine-medicaid-thresholds-states.json
    - https://www.kff.org/affordable-care-act/state-indicator/medicaid-and-chip-income-eligibility-limits-for-pregnant-women-as-a-percent-of-the-federal-poverty-level/
  expires_on_source_change: true
  pinned:
    left: 1.98
    right: 2.15
