- id: ak-pregnant-2024-expansion-not-encoded
  concept: us-ak:policies/cms/alaska-medicaid-chip-bhp-eligibility-levels#alaska_pregnant_women_medicaid_effective_fpl_limit
  case_id: medicaid-thresholds-states-ak-pregnant
  kind: amount_difference
  disposition: axiom_encoding_gap
  linked_issue: https://github.com/TheAxiomFoundation/rulespec-us/issues/1185
  evidence:
    mechanism: >-
      Axiom encodes 2.05 (200% + the 5-point MAGI disregard) from the CMS
      Medicaid/CHIP eligibility-levels table, which predates Alaska's
      expansion. Alaska added an optional eligibility group for pregnant
      women with income 201%-225% FPL and 12-month postpartum coverage via
      a Medicaid state plan amendment effective February 2024, making the
      effective limit 230% (225% + 5). PolicyEngine's 2.30 matches the
      current authoritative level (KFF, as of January 2026: Alaska pregnant
      women 230%). Axiom's cited CMS table snapshot is stale; the encoding
      needs the 2024 expansion.
    arithmetic:
    - expression: 2.30 - 2.05
      equals: 0.25
    - expression: (225 - 200) / 100
      equals: 0.25
    upstream_url: https://aws.state.ak.us/OnlinePublicNotices/Notices/View.aspx?id=212944
    sources:
    - dashboard/public/data/axiom-policyengine-medicaid-thresholds-states.json
    - https://www.kff.org/affordable-care-act/state-indicator/medicaid-and-chip-income-eligibility-limits-for-pregnant-women-as-a-percent-of-the-federal-poverty-level/
    - https://alaskapublic.org/news/2024-02-06/more-women-in-alaska-will-be-covered-by-medicaid-during-pregnancy-and-for-the-year-after-giving-birth
  expires_on_source_change: true
  pinned:
    left: 2.05
    right: 2.3
- id: ia-infant-2025-reduction-not-encoded
  concept: us-ia:policies/cms/iowa-medicaid-chip-bhp-eligibility-levels#iowa_children_medicaid_ages_0_to_1_effective_fpl_limit
  case_id: medicaid-thresholds-states-ia-infant
  kind: amount_difference
  disposition: axiom_encoding_gap
  linked_issue: https://github.com/TheAxiomFoundation/rulespec-us/issues/1185
  evidence:
    mechanism: >-
      Axiom encodes 3.80 (375% + the 5-point MAGI disregard) from the CMS
      eligibility-levels table, which predates Iowa's reduction. Iowa SF
      2251 (2024) directed HHS to lower the Medicaid income limit for
      infants and pregnant women to 215% FPL (220% effective with the
      disregard); CMS approved the SPA in January 2025 and the reduction
      took effect during 2025, so Axiom's 3.80 no longer reflects Iowa law
      for 2026. PolicyEngine's 3.05 matches KFF's January-2026 infant
      figure for Iowa (305%), which reflects the highest Medicaid/CHIP-
      funded infant coverage (hawk-i CHIP), not the Medicaid-only limit
      either; neither engine currently carries the Medicaid-only 2.20.
      Classified as an Axiom encoding gap because Axiom's cited CMS
      snapshot is stale against the authoritative 2025 change.
    arithmetic:
    - expression: 3.80 - 3.05
      equals: 0.75
    upstream_url: https://www.legis.iowa.gov/docs/publications/LGi/90/SF2251.pdf
    sources:
    - dashboard/public/data/axiom-policyengine-medicaid-thresholds-states.json
    - https://www.healthinsurance.org/medicaid/iowa/
    - https://www.kff.org/medicaid/state-indicator/medicaid-income-eligibility-limits-for-infants-ages-0-1/
  expires_on_source_change: true
  pinned:
    left: 3.8
    right: 3.05
- id: nd-infant-2024-spa-not-encoded
  concept: us-nd:policies/cms/north-dakota-medicaid-chip-bhp-eligibility-levels#north_dakota_children_medicaid_ages_0_to_1_effective_fpl_limit
  case_id: medicaid-thresholds-states-nd-infant
  kind: amount_difference
  disposition: axiom_encoding_gap
  linked_issue: https://github.com/TheAxiomFoundation/rulespec-us/issues/1185
  evidence:
    mechanism: >-
      Axiom encodes 1.75 (170% + the 5-point MAGI disregard), the
      pre-2024 North Dakota children's level. CMS-approved SPAs ND-24-0007
      and companion ND-24-0101 raised the income standard for children
      (including the title XXI-funded Medicaid expansion) from 170% to
      200% FPL effective 2024-01-01, an effective 205% with the disregard.
      PolicyEngine's 2.05 matches the authoritative post-SPA level; Axiom's
      cited CMS table snapshot is stale.
    arithmetic:
    - expression: 2.05 - 1.75
      equals: 0.3
    - expression: (200 - 170) / 100
      equals: 0.3
    upstream_url: https://www.medicaid.gov/medicaid/spa/downloads/ND-24-0007.pdf
    sources:
    - dashboard/public/data/axiom-policyengine-medicaid-thresholds-states.json
    - https://www.medicaid.gov/CHIP/Downloads/ND-24-0101.pdf
  expires_on_source_change: true
  pinned:
    left: 1.75
    right: 2.05
