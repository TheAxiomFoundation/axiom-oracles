entries:
- id: whole-dollar-rounding-chain-snap-benefit
  concept: us:programs/snap#benefit
  case_id: ecps-spm-50970
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: >-
      Whole-dollar rounding-chain divergence between axiom's 7 CFR
      273.10(e)(1)(ii)/(e)(2)(ii)(A) rounding elections and PolicyEngine's
      cents-precision convention, compounding across three stages for this
      one-person all-earned-income unit (gross 774.427979, standard deduction
      209, shelter costs 594 = the CO heating/cooling SUA, maximum allotment
      298; both engines agree on all four). (1) Earned income deduction: both
      start from 20% x 774.427979 = 154.885596; axiom drops cents to 154
      (rulespec-us us/regulations/7-cfr/273/10.yaml
      snap_earned_income_deduction_for_net_income = floor(earned x rate),
      matching the FNS QC FSERNDED construction), while PE's
      snap_earned_income_deduction keeps 154.885596. (2) Excess shelter
      deduction: axiom rounds 594 - 0.5 x (774.427979 - 209 - 154) =
      388.286011 to the nearest dollar, 388 (snap_excess_shelter_cost =
      floor(x + 0.5), the 273.10(e)(1)(ii)(A) election); PE keeps 594 - 0.5 x
      (774.427979 - 209 - 154.885596) = 388.728821 in cents
      (snap_excess_shelter_expense_deduction, no rounding). Both engines'
      evidence net incomes reproduce exactly: axiom 774.427979 - 209 - 154 -
      388 = 23.427979, PE 774.427979 - 209 - 154.885596 - 388.728821 =
      21.813538. (3) Allotment: axiom applies Colorado's
      round-the-allotment-down election (rulespec-us-co
      regulations/10-ccr-2506-1/4.207.2.yaml sets
      state_agency_rounds_thirty_percent_net_income_up = false, so
      snap_calculated_monthly_allotment_before_minimums = floor(298 - 0.3 x
      23.427979) = floor(290.971606) = 290); PE instead floors net income to
      whole dollars and keeps the 30% product in cents
      (snap_expected_contribution = np.floor(snap_net_income) x 0.3 at
      policyengine-us 1.705.1, snap_normal_allotment subtracts it unrounded):
      298 - 0.3 x floor(21.813538) = 298 - 6.3 = 291.70, printed 291.700012
      in float32. Both are readings of 7 CFR 273.10(e); axiom's whole-dollar
      elections match what a state agency issues, PE's is a documented
      cents-precision modeling convention (291.70 is not an issuable
      whole-dollar allotment). The residual is exactly 290 - 291.700012 =
      -1.700012. The suite tolerance of 1.5 absorbs single-stage rounding
      differences; this case exceeds it only because the three stages
      compound in the same direction.
    arithmetic:
    - expression: 0.2 * 774.427979
      equals: 154.885596
    - expression: 594 - 0.5 * (774.427979 - 209 - 154)
      equals: 388.286011
    - expression: 594 - 0.5 * (774.427979 - 209 - 154.885596)
      equals: 388.728821
    - expression: 774.427979 - 209 - 154 - 388
      equals: 23.427979
    - expression: 774.427979 - 209 - 154.885596 - 388.728821
      equals: 21.813538
    - expression: 298 - 0.3 * 23.427979
      equals: 290.971606
    - expression: 298 - 0.3 * 21
      equals: 291.700012
    - expression: 290 - (298 - 0.3 * 21)
      equals: -1.700012
