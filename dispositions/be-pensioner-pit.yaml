  - id: pension-wage-forfait-and-work-bonus-engine-semantics
    concept: be:statutes/income_tax/individual/pensioner_pit_oracle_pipeline#belgium_pit_pensioner_federal_and_local_tax_before_withholding
    case_id: be-pensioner-pit-pension-30k-wage-15k
    kind: amount_difference
    disposition: upstream_engine_gap
    evidence:
      mechanism: >-
        Two named EUROMOD BE_2025 mechanisms close the mixed pension-and-wage
        residual. First, tintace_be calculates the Article 51 wage forfait on
        il_netYem after subtracting 1,065 EUR of pension health withholding,
        producing 124.261060873803 EUR more pre-credit tax than the statutory
        category-specific base (ec-jrc issue #26). Second, tinfe_be uses the
        uncapped 1,504.848888 EUR work-bonus credit rather than the
        1,028.28906 EUR credit on the reduction actually granted, lowering the
        EUROMOD result by 476.559828 EUR (the existing issue #12 disposition).
        Their -352.298767126197 EUR sum equals the observed EUROMOD-minus-Axiom
        residual to displayed-float precision.
      arithmetic:
        - expression: "7556.361967980724 - 7432.100907106921"
          equals: 124.261060873803
          tolerance: 0.000001
        - expression: "1028.28906 - 1504.848888"
          equals: -476.559828
          tolerance: 0.000001
        - expression: "(7556.361967980724 - 7432.100907106921) + (1028.28906 - 1504.848888)"
          equals: -352.298767126197
          tolerance: 0.000001
