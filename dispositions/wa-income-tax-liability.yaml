    case_id: wa-single-300000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        The pinned TAXSIM 2024 result uses the $270,000 standard deduction and
        predates the 2.90-percent additional tax effective in 2025, while Axiom
        and PolicyEngine use the projected $284,000 deduction and the 2026 law.
        The exact difference is therefore a law-vintage residual.
