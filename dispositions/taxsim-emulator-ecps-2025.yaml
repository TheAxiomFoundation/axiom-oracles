  disposition: upstream_engine_gap
  attribution: taxsim
  evidence:
    mechanism: 'Daniel Feenberg (@feenberg), 2026-09-25: "Agreed, corrected." He responds to #1222''s
      Louisiana 2025 standard-deduction omission. Selected rows have agreeing state AGI within $1, a taxable-income
      gap equal to PE''s reported $12,500 or $25,000 deduction within $1, and a liability gap equal to
      minus 3% of that taxable-income gap within $1. Other Louisiana rows are not attributed by this identity.'
    row_arithmetic:
    - expression: left_aux.v34
      equals:
      - 12500
      - 25000
      tolerance: 0
    - expression: left_aux.v32 - right_aux.v32
      equals: 0
      tolerance: 1
    - expression: right_aux.v36 - left_aux.v36 - left_aux.v34
      equals: 0
      tolerance: 1
    - expression: difference + 0.03 * (right_aux.v36 - left_aux.v36)
      equals: 0
      tolerance: 1
    sources:
    - https://github.com/PolicyEngine/policyengine-taxsim/issues/1222#issuecomment-5833721957
