  disposition: explained_residual
  attribution: convention
  evidence:
    mechanism: 'Daniel Feenberg (@feenberg), 2026-07-06: "The production default for 27 is zero, that
      selects the paid year." Pavel Makarchuk (@PavelMakarchuk), 2026-07-06: "PE books each rebate to
      the year whose liability determines it; TAXSIM subtracts it in the payout year." His srebate description
      is "computed as `state_income_tax` with one-time rebates zeroed minus actual". Thus rebates are
      added back to both siitax values. Every selected row is within the suite''s $15 match tolerance
      after that adjustment. This is the documented timing convention, not a finding about either engine''s
      law.'
    row_arithmetic:
    - expression: difference + left_aux.srebate - right_aux.srebate
      equals: 0
      tolerance: 15
    sources:
    - https://github.com/PolicyEngine/policyengine-taxsim/issues/1068#issuecomment-4897009628
