schema: axiom_oracles.dispositions.v1
suite: nc-income-tax-populace
updated: "2026-10-26"
# NC resident-core pipeline vs PolicyEngine nc_income_tax_before_credits on
# all 2,169 routed NC tax units in pinned Populace (campaign
# reports/state-tax-populace-nc-resident-core-campaign-2026-10-26.json).
# 2,163 match within $1. The 6 PolicyEngine mismatches share one cause:
# policyengine-us 1.752.2 counts federally non-deductible mortgage interest
# in the NC itemized deduction. Each tax difference is 3.99 percent of that
# interest. reports/state-tax-populace-nc-resident-core-mismatch-trace-2026-10-26.json
# recomputes the statute reading from PolicyEngine's own components and
# reproduces Axiom within $0.56 on every compared unit.
entries:
  - id: nc-populace-pe-non-deductible-mortgage-interest-32354
    concept: us-nc:policies/income_tax/resident_core_liability_pipeline#nc_pit_2026_income_tax_before_credits
    case_id: 32354
    kind: amount_difference
    disposition: upstream_engine_gap
    evidence:
      upstream_url: https://github.com/PolicyEngine/policyengine-us/issues/10468
      mechanism: >-
        issue: https://github.com/PolicyEngine/policyengine-us/issues/10468. Tax unit
        32354 (single) itemizes below the $20,000 mortgage-and-property-tax cap.
        policyengine-us 1.752.2 nc_itemized_deductions adds mortgage_interest
        10727.61, which is deductible_mortgage_interest 8526.28 plus
        non_deductible_mortgage_interest 2201.33. G.S. 105-153.5(a)(2)b allows only
        interest allowed under Code section 163(h), so Axiom receives the deductible
        amount as qualified residence interest. The NC itemized deduction is 17663.97
        under the statute and 19865.30 in PolicyEngine, and the tax difference is 3.99
        percent of the excluded interest. PolicyEngine main fixed this in
        PolicyEngine/policyengine-us#10274 (released in 2.60.4).
      arithmetic:
        - expression: "1421.7307725494384 - 1333.8978271484375"
          equals: 87.8329
        - expression: "2201.33 * 0.0399"
          equals: 87.8329
          tolerance: 0.01
      sources:
        - reports/state-tax-populace-nc-resident-core-campaign-2026-10-26.json
        - reports/state-tax-populace-nc-resident-core-mismatch-trace-2026-10-26.json
        - https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_105/GS_105-153.5.html
        - https://github.com/PolicyEngine/policyengine-us/pull/10274
    linked_issue: https://github.com/PolicyEngine/policyengine-us/issues/10468
    axiom_companion:
      legal_ids:
        - us-nc:policies/income_tax/resident_core_liability_pipeline#nc_pit_2026_income_tax_before_credits
        - us-nc:policies/income_tax/resident_core_liability_pipeline#nc_pit_2026_itemized_deduction
        - us-nc:policies/income_tax/resident_core_liability_pipeline#nc_pit_2026_mortgage_and_property_tax_deduction
      tests:
        - rulespec-us@56455a56d08cdeeab76818e45a33efe6ea42be6b:us-nc/policies/income_tax/resident_core_liability_pipeline.test.yaml#joint resident itemized child and modification path
    expires_on_source_change: true
    pinned:
      left: 1421.7307725494384
      right: 1333.8978271484375
      difference: 87.83294540100087
