- id: taxsim-mfs-additional-medicare-200k-threshold-and-wage-factor
  concept: us:tax/payroll#additional_medicare_tax
  kind: amount_difference
  case_selector:
    case_ids:
    - mfs-wages-150000
    - mfs-wages-250000
    - mfs-wages-450000
    - mfs-wages-750000
  disposition: upstream_engine_gap
  evidence:
    mechanism: >-
      26 USC 3101(b)(2)(B) (docs/mfs-evidence/mfs-statute-extracts.md, section
      7) taxes a married taxpayer filing a separate return at 0.9 percent of
      wages above half of the $250,000 joint amount, i.e. $125,000. The axiom
      value on each selected row is 0.009 x (wages - 125,000), the same as the
      statutory hand computation (docs/mfs-evidence/mfs-statutory-hand-computation.md).
      The pinned TAXSIM 2.30.0 binary (cdate-20260521) reports addmed =
      0.009 x max(0, 0.9235 x wages - 200,000) at mstat 6, identical to its
      mstat 1 value. It therefore applies the $200,000 "any other case"
      threshold to a separate return, and it scales W-2 wages by the 0.9235
      self-employment factor. This was observed by replaying the persisted
      rows through the binary on 2026-09-27; the cd2026081819 build drops the
      factor but keeps the $200,000 threshold. Both departures are on the
      TAXSIM side. PolicyEngine's additional_medicare_tax matches axiom on
      every row of this suite.
    arithmetic:
    - expression: 0.009 * (150000 - 125000) - 0
      equals: 225.0
      tolerance: 0.01
    - expression: 0.009 * (250000 - 125000) - 0.009 * (0.9235 * 250000 - 200000)
      equals: 847.13
      tolerance: 0.01
    - expression: 0.009 * (450000 - 125000) - 0.009 * (0.9235 * 450000 - 200000)
      equals: 984.83
      tolerance: 0.01
    - expression: 0.009 * (750000 - 125000) - 0.009 * (0.9235 * 750000 - 200000)
      equals: 1191.38
      tolerance: 0.01
    sources:
    - docs/mfs-evidence/mfs-statute-extracts.md
    - docs/mfs-evidence/mfs-statutory-hand-computation.md
  expires_on_source_change: true
- id: taxsim-mfs-salt-phasedown-not-halved-taxable-income
  concept: us:tax/federal-income-tax#taxable_income
  kind: amount_difference
  case_id: mfs-wages-450000
  disposition: upstream_engine_gap
  evidence:
    mechanism: &salt_mechanism >-
      Under 26 USC 164(b)(6)(B) and (b)(7) (mfs-statute-extracts.md section
      16), a separate filer deducts at most half of the applicable limitation
      amount ($40,400 for 2026). That amount is first reduced by 30 percent of
      MAGI above half of the $505,000 threshold, and the reduction cannot take
      it below $10,000 before the halving. At MAGI 450,000 the limit is
      therefore 5,000, which is below the 16,100 standard deduction. Axiom
      and PolicyEngine both take the standard deduction, giving taxable income
      433,900. Replaying the persisted row through the pinned TAXSIM binary
      gives siitax 20,072.30 and v17 (itemized deductions) 20,000, so TAXSIM
      itemizes Colorado income tax under a flat $20,000 separate-return cap
      with no phasedown at this MAGI. At 750,000 its v17 is 0, so its mstat 6
      phasedown starts above 450,000.
    arithmetic:
    - expression: 20000 - 16100
      equals: 3900.0
      tolerance: 0.01
    # The reduced amount is negative, so the (b)(7)(B)(iii) $10,000 floor
    # binds and the separate filer takes half of it.
    - expression: 40400 - 0.30 * (450000 - 505000 / 2)
      equals: -18850.0
      tolerance: 0.01
    - expression: 10000 / 2
      equals: 5000.0
      tolerance: 0.01
    sources:
    - docs/mfs-evidence/mfs-statute-extracts.md
    - docs/mfs-evidence/mfs-statutory-hand-computation.md
  expires_on_source_change: true
  pinned:
    left: 433900.0
    right: 430000.0
