- id: taxsim-2026-ctc-child-credit-machinery-absent
  concept: us:tax/federal-income-tax#ctc
  kind: amount_difference
  case_selector:
    case_ids:
    - mfs-child-wages-15000
    - mfs-child-wages-45000
  disposition: upstream_engine_gap
  evidence:
    mechanism: >-
      Both child cases are separate filers whose spouse lived apart all year.
      Under 26 USC 7703(b) and 2(c) they are heads of household, and TAXSIM
      mstat 6 with the child returns exactly its mstat 1 (head of household)
      output. The pinned binary's 2026 law year has no qualifying-child credit
      machinery (docs/policyengine-taxsim.md; the standing class in
      dispositions/co-tax-intersection-taxsim.yaml): v22 is the $500 other-
      dependent amount when tax before credits allows it (45,000 row) and 0
      otherwise (15,000 row, tax before credits 0). Axiom computes the enacted
      26 USC 24 credit. On the 15,000 row the concept's axiom value
      (oracle-bridge ctc_value, which PolicyEngine's ctc_value matches) is the
      24(d)(1)(B) earned-income amount 0.15 x (15,000 - 2,500) = 1,875, while
      axiom's liability applies the $1,700 refundable cap. This is an NBER
      model gap, not an Axiom defect.
    arithmetic:
    - expression: 2200 - 500 * 1
      equals: 1700.0
      tolerance: 0.01
    - expression: 0.15 * (15000 - 2500) - 0
      equals: 1875.0
      tolerance: 0.01
    sources:
    - docs/mfs-evidence/mfs-statute-extracts.md
    - docs/policyengine-taxsim.md
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/304
  expires_on_source_change: true
- id: taxsim-2026-eitc-childless-schedule-applied
  concept: us:tax/federal-income-tax#eitc
  kind: amount_difference
  case_selector:
    case_ids:
    - mfs-child-wages-15000
    - mfs-child-wages-45000
  disposition: upstream_engine_gap
  evidence:
    mechanism: >-
      TAXSIM's 2026 EITC applies the childless schedule to a head of
      household with a qualifying child, the same root as the CTC class above
      (the standing class in dispositions/co-tax-intersection-taxsim.yaml).
      Its 15,000 row sits on the childless phase-out: 664 - 0.0765 x (15,000
      - 10,860) = 347.29. Its 45,000 row is past the childless phase-out and
      is 0. Axiom applies the one-child schedule (26 USC 32(b); Rev. Proc.
      2025-32 printed maximum $4,427): 4,427 at 15,000, and
      4,427 - 0.1598 x (45,000 - 23,890) = 1,053.62 at 45,000.
    arithmetic:
    - expression: 664 - 0.0765 * (15000 - 10860)
      equals: 347.29
      tolerance: 0.01
    - expression: 4427 - (664 - 0.0765 * (15000 - 10860))
      equals: 4079.71
      tolerance: 0.01
    - expression: 4427 - 0.1598 * (45000 - 23890) - 0
      equals: 1053.62
      tolerance: 0.01
    sources:
    - docs/mfs-evidence/mfs-statute-extracts.md
    - docs/mfs-evidence/mfs-statutory-hand-computation.md
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/304
  expires_on_source_change: true
- id: taxsim-2026-child-credit-machinery-liability
  concept: us:tax/federal-income-tax#liability
  kind: amount_difference
  case_selector:
    case_ids:
    - mfs-child-wages-15000
    - mfs-child-wages-45000
  disposition: upstream_engine_gap
  evidence:
    mechanism: >-
      This is the liability face of the two TAXSIM 2026 child-credit classes
      above. Axiom's liability nets the full one-child EITC and the CTC:
      -(4,427 + 1,700) = -6,127 at 15,000, and 2,148 - 2,148 - 52 - 1,053.62
      = -1,105.62 at 45,000. TAXSIM nets only the childless EITC and the $500
      other-dependent amount: -347.29 at 15,000, and 2,148 - 500 = 1,648 at
      45,000. Each residual is the sum of the EITC and CTC residuals on its
      row.
    arithmetic:
    - expression: -(4427 - 347.29) - 1700
      equals: -5779.71
      tolerance: 0.01
    - expression: -(1053.622 - 0) - (2200 - 500)
      equals: -2753.622
      tolerance: 0.01
    sources:
    - docs/mfs-evidence/mfs-statutory-hand-computation.md
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/304
  expires_on_source_change: true
