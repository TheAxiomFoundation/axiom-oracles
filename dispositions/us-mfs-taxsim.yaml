- id: taxsim-mstat6-cannot-express-lived-apart-taxable-income
  concept: us:tax/federal-income-tax#taxable_income
  kind: amount_difference
  case_id: mfs-ss-lived-apart-wages-20000-ss-24000
  disposition: bridge_artifact
  evidence:
    mechanism: &lived_apart_mechanism >-
      Under 26 USC 86(c)(1)(C)(ii) (mfs-statute-extracts.md section 5), the
      zero base amount applies only to a separate filer who does not live
      apart from their spouse at all times during the year. This case lived
      apart all year, so the $25,000 base of 86(c)(1)(A) applies: taxable
      Social Security is 3,500, AGI 23,500 and taxable income 5,750, which
      is what axiom and PolicyEngine report. The TAXSIM input row has no
      spouse-residence column, so the harness cannot give TAXSIM the
      lived-apart fact. TAXSIM mstat 6 applies the zero base (taxable Social
      Security 20,400, AGI 40,400, the same as the cohabiting case), and its
      separate-return senior deduction (the upstream gap filed for the
      cohabiting case) removes a further 6,000. Because the engines received
      different facts, this is a harness input gap. The remaining 6,000 is
      the TAXSIM senior-deduction gap.
    arithmetic:
    - expression: (3500 - 20400) + 6000
      equals: -10900.0
      tolerance: 0.01
    - expression: 23500 - 16100 - 1650
      equals: 5750.0
      tolerance: 0.01
    sources:
    - docs/mfs-evidence/mfs-statute-extracts.md
    - docs/mfs-evidence/mfs-statutory-hand-computation.md
  expires_on_source_change: true
  pinned:
    left: 5750.0
    right: 16650.0
