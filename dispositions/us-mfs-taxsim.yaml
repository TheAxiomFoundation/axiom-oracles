- id: taxsim-mfs-senior-deduction-on-separate-return-taxable-income
  concept: us:tax/federal-income-tax#taxable_income
  kind: amount_difference
  case_id: mfs-ss-cohabiting-wages-20000-ss-24000
  disposition: upstream_engine_gap
  evidence:
    mechanism: &senior_mechanism >-
      26 USC 151(d)(5)(C)(v) (mfs-statute-extracts.md section 8) provides: "If
      the taxpayer is a married individual (within the meaning of section
      7703), this subparagraph shall apply only if the taxpayer and the
      taxpayer's spouse file a joint return for the taxable year." A separate
      filer therefore gets no $6,000 senior deduction. Axiom reports taxable
      income 22,650 = AGI 40,400 - 17,750 (the 16,100 basic amount plus the
      1,650 married 63(f) aged amount), the same as the statutory hand
      computation. The pinned TAXSIM binary subtracts the $6,000 at mstat 6
      as well (v18 = v10 - v13 - 6,000; the 2026-09-24 binary probes found
      the same on the cd2026081819 build). PolicyEngine matches axiom on this
      row.
    arithmetic:
    - expression: 22650 - 16650
      equals: 6000.0
      tolerance: 0.01
    - expression: 40400 - 16100 - 1650
      equals: 22650.0
      tolerance: 0.01
    sources:
    - docs/mfs-evidence/mfs-statute-extracts.md
    - docs/mfs-evidence/mfs-statutory-hand-computation.md
  expires_on_source_change: true
  pinned:
    left: 22650.0
    right: 16650.0
