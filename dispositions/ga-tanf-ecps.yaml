  evidence:
    mechanism: >-
      Composed GA TANF benefit vs PolicyEngine: 1 ga_tanf_benefit mismatch on a
      family of four (adults 48/48, minors 16/14) with zero earned income.
      PolicyEngine ga_tanf pays $164.970459 for 2026-01; the composed slice pays
      0 because its
      PAMMS 1605 gross-income-ceiling / standard-of-need income-eligibility test
      denies the unit where PE's full ga_tanf graph pays. Structural
      projection/definition divergence between the ECPS unearned-income projection
      feeding the composed slice and PE's tanf_gross_unearned_income handling for
      this household (composed-slice vs full-PE-model gap), not a rulespec
      statutory-encoding defect: the us-ga 1605 block-14 benefit leaf reproduces
      PE's min(max(standard_of_need - net_countable_income, 0), family_maximum) on
      every other Georgia ECPS household. The legacy annualized row was
      axiom=0 / PE=1979.645508; the requested-month fix changes it exactly to
      axiom=0 / PE=164.970459 (one twelfth), so the case-scoped mechanism was
      explicitly revalidated rather than silently retained.
