suite: ne-income-tax-liability
updated: "2026-07-08"
# Nebraska composed progressive-liability pipeline vs PolicyEngine (2026) and
# TAXSIM (2024) on the six-case grid. The pipeline matches PolicyEngine
# ne_income_tax_before_credits exactly on all six cases (the pure Neb. Rev. Stat.
# 77-2715.03 four-bracket tax on Nebraska taxable income = AGI less the
# 77-2716.01 standard deduction), so the PolicyEngine leg needs no disposition.
#
# Against TAXSIM's 2024 law year every case diverges by two composable, fully
# reconstructed differences:
#  1. Law-year vintage. TAXSIM's pinned binary runs at 2024; the pipeline is the
#     2026 schedule. L.B. 754 (2023) compresses the two top marginal rates from
#     the 2024 5.01% and 5.84% to a common 4.55% by 2026 and indexes the bracket
#     floors and the standard deduction up each year. The 2024 schedule taxes
#     more income at higher rates, so the 2024 before-credit tax exceeds the 2026
#     before-credit tax.
#  2. Credit scope. TAXSIM's siitax is the Nebraska tax AFTER the 77-2716.01
#     personal exemption credit ($166 per single filer, $332 married in 2024);
#     the axiom before-credits core excludes that post-tax credit.
# PolicyEngine reproduces TAXSIM's 2024 siitax to the cent as
# ne_income_tax_before_credits(2024) - ne_exemptions(2024) on every case (the
# second arithmetic expression per entry), so each residual is exactly the
# 2024-to-2026 vintage plus the 2024 exemption-credit scope, not a pipeline
# defect.
entries:
  - id: ne-taxsim-2024-vintage-credit-scope-single-30000
    concept: us-ne:policies/income_tax/pilot_liability_pipeline#ne_pit_pilot_income_tax_liability
    case_id: ne-single-30000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        The 2026 pipeline reports 703.56; TAXSIM 2024 reports 552.97, a
        150.59-dollar gap. TAXSIM's 2024 Nebraska siitax is the 2024 before-credit
        tax (718.97, applying the un-indexed 2024 brackets and the 2.46/3.51/5.01/
        5.84 per cent 2024 rates over the smaller 2024 standard deduction) less the
        166-dollar 2024 section 77-2716.01 personal exemption credit: 718.97 - 166
        = 552.97, reproducing TAXSIM exactly. The residual is the 2024-to-2026
        rate-compression and indexation vintage (703.56 - 718.97 = -15.41) plus the
        166-dollar exemption credit the before-credits core excludes. Not a
        pipeline defect; the pipeline matches PolicyEngine at 2026 exactly.
      arithmetic:
        - expression: "703.56 - 552.97"
          equals: 150.59
          tolerance: 0.02
        - expression: "718.97 - 166.00"
          equals: 552.97
          tolerance: 0.02
    expires_on_source_change: true
    pinned:
      left: 703.56
      right: 552.97
  - id: ne-taxsim-2024-vintage-credit-scope-single-60000
    concept: us-ne:policies/income_tax/pilot_liability_pipeline#ne_pit_pilot_income_tax_liability
    case_id: ne-single-60000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        The 2026 pipeline reports 2038.712; TAXSIM 2024 reports 2146.20. TAXSIM's
        2024 siitax is the 2024 before-credit tax (2312.20) less the 166-dollar
        2024 personal exemption credit: 2312.20 - 166 = 2146.20, reproducing TAXSIM
        exactly. The residual is the 2024-to-2026 vintage (2038.712 - 2312.20 =
        -273.488) plus the 166-dollar exemption credit the before-credits core
        excludes. Here the 2024 higher rates outweigh the credit, so the pipeline
        is below TAXSIM. Not a pipeline defect; the pipeline matches PolicyEngine
        at 2026 exactly.
      arithmetic:
        - expression: "2038.712 - 2146.20"
          equals: -107.488
          tolerance: 0.02
        - expression: "2312.20 - 166.00"
          equals: 2146.20
          tolerance: 0.02
    expires_on_source_change: true
    pinned:
      left: 2038.712
      right: 2146.20
