- id: ne-taxsim-2026-schedule-projection-and-credit-scope-single-30000
  concept: us-ne:policies/income_tax/pilot_liability_pipeline#ne_pit_pilot_income_tax_liability
  case_id: ne-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: |-
      Both engines run at the 2026 law year. TAXSIM's 2026 Nebraska module
      retains higher lower-bracket rates than the enacted section 77-2715.03
      schedule on essentially the same taxable base (its taxable income
      21,141.95 vs the pipeline's wages-less-standard-deduction base; staxbc
      698.50 vs the enacted before-credit tax 703.56), and its siitax nets a
      projected 176.13 section 77-2716.01 personal exemption credit (about
      176.13 per filer; the pipeline's before-credits core excludes that
      credit by design). Residual = (703.56 - 698.50) + 176.13 = 181.19.
      TAXSIM 2026 schedule projection plus credit scope, not a pipeline
      defect; the pipeline matches PolicyEngine at 2026 to the cent on every
      grid case.
    arithmetic:
    - expression: 698.5 - 176.13
      equals: 522.37
      tolerance: 0.02
    - expression: (703.56 - 698.5) + 176.13
      equals: 181.19
      tolerance: 0.02
  expires_on_source_change: true
  pinned:
    left: 703.56
    right: 522.37
