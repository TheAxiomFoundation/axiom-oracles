schema: axiom_oracles.dispositions.v1
suite: ssi-ecps
updated: "2026-07-28"
# True-month regeneration under PE 4.18.9 / US 1.767.3 / core 3.30.3 leaves
# 2,990 ssi_benefit mismatches. The legacy annualized report had 3,067. This is
# NOT the resource screen and NOT takeup. It is a BRIDGE artifact of this
# comparison:
# rulespec-us correctly encodes SSI eligibility (1382), income (1382a) and
# resources (1382b), but the ssi-ecps bridge feeds Axiom generic is_disabled/
# is_blind flags (not PE's SSI-specific disability determination) and runs the
# documented v1 individual slice (programs/us/ssi/fy-2026.yaml lists
# ssi_monthly_benefit under acknowledged_incomplete; couple/ineligible-spouse
# deeming is an explicit encoder-backlog divergence class). So the divergence is
# the comparison's projection + v1-slice scope, not Axiom's statutory encoding —
# classified bridge_artifact (explained), tracked in axiom-oracles#228.
#
# A fresh direct PolicyEngine eligibility join reconciles all 2,990 report rows:
# 1,746 Axiom awards/PE=0 with no PE-eligible member; 987 Axiom awards/PE=0
# with an eligible member whose benefit offsets to zero; 167 both-positive
# Axiom>PE; 17 both-positive Axiom<PE; and 73 Axiom=0/PE>0. In the 1,000 legacy
# mismatch examples that were committed, 976 persist and scale by 1/12 (maximum
# PE rounding drift $0.000204); 24 now fall within the unchanged $25 tolerance.
# The old full report was not committed, so the other net closures cannot be
# identity-audited.
entries:
  - id: ssi-v1-slice-eligibility-and-income-composition
    concept: us:statutes/42/1382#ssi_benefit
    case_selector: { case_id_prefix: "ecps-" }
    disposition: bridge_artifact
    evidence:
      mechanism: >-
        ssi-ecps bridge projection + documented v1-slice scope, not an Axiom
        statutory encoding defect. The bridge feeds generic is_disabled/is_blind
        rather than PolicyEngine's SSI-specific disability determination, while
        the v1 slice omits couple/ineligible-spouse deeming and other
        acknowledged eligibility branches. Fresh true-month characterization is
        2,990 rows. A direct PE eligibility join verifies five current classes:
        1,746 Axiom awards/PE=0 with no eligible PE member; 987 Axiom awards/PE=0
        with an eligible member whose income offsets the award; 167 both-positive
        Axiom>PE; 17 both-positive Axiom<PE; and 73 Axiom=0/PE>0. Representative
        rows are ecps-64 (axiom=994 / PE=0, no eligible member), ecps-30
        (axiom=1490 / PE=0, eligible member), ecps-831
        (836.618333 / 330.067780), ecps-5872 (843.740833 / 1361.741028), and
        ecps-1587 (0 / 994). The disposition materially changed from 3,067
        annualized rows; 976/1,000 committed legacy examples were replayable and
        scaled by 1/12, while 24 dropped below the unchanged $25 tolerance.
        Obsolete subtype counts and the now-within-tolerance ecps-588
        representative were removed.
      sources:
        - PROGRESS.md
    linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/228
    expires_on_source_change: true
