- id: me-taxsim-2026-indexation-projection-single-30000
  concept: us-me:policies/income_tax/pilot_liability_pipeline#me_pit_pilot_income_tax_liability
  case_id: me-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: |-
      Both engines run at the 2026 law year. TAXSIM's 2026 Maine module
      extrapolates the section 5111 bracket boundaries and the section 5124-C
      standard deduction to fractional projected values (implied deduction
      20,754.63), giving staxbc 536.23 against the pipeline's enacted 565.50,
      and at this income its siitax additionally nets a projected 83.92 low-
      income credit from its 2026 credit model that the enacted before-
      refundable-credits concept excludes. Residual = (565.50 - 536.23) +
      83.92 = 113.19. TAXSIM 2026 indexation projection, not a pipeline
      defect; the pipeline matches PolicyEngine at 2026 to the cent on every
      grid case.
    arithmetic:
    - expression: 536.23 - 83.92
      equals: 452.31
      tolerance: 0.02
    - expression: (565.5 - 536.23) + 83.92
      equals: 113.19
      tolerance: 0.02
  expires_on_source_change: true
  pinned:
    left: 565.5
    right: 452.31
