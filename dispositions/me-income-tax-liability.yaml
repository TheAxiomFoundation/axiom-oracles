- id: me-taxsim-2024-vintage-single-30000
  concept: us-me:policies/income_tax/pilot_liability_pipeline#me_pit_pilot_income_tax_liability
  case_id: me-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: TAXSIM runs at its latest 2024 law year. Maine indexes the section 5111 bracket boundaries and the section 5124-C standard deduction annually (section 5111 subsection 1-F); the residual is the 2024-to-2026 indexation vintage of those bracket and deduction amounts (higher 2024 tax at mid income, lower at the first bracket). The pipeline reports 565.5; TAXSIM 2024 reports 562.04. Indexation vintage, not a pipeline defect; the pipeline matches PolicyEngine me_income_tax_before_refundable_credits at 2026 to the cent.
    arithmetic:
    - expression: 565.5 - 562.04
      equals: 3.46
      tolerance: 0.01
  expires_on_source_change: true
  pinned:
    left: 565.5
    right: 562.04
