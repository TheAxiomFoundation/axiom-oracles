- id: ga-taxsim-2026-unenacted-rate-and-deduction-single-30000
  concept: us-ga:policies/income_tax/pilot_liability_pipeline#ga_pit_pilot_income_tax_liability
  case_id: ga-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: |-
      Both engines run at the 2026 law year, but TAXSIM's 2026 Georgia module
      applies the un-accelerated HB 1015 step-down rate of 5.19 per cent
      (verified from its marginal slope) instead of the enacted 2026 rate of
      4.99 per cent the pipeline applies, on an extrapolated pre-HB463
      deduction (implied offset 12,360.08 vs the enacted 15,000): 0.0519 x
      (30,000 - 12,360.08) = 915.51 reproduces TAXSIM to the cent, while the
      pipeline's enacted 0.0499 x (30,000 - 15,000) = 748.50. Un-enacted rate
      and deduction projection, not a pipeline defect; the pipeline matches
      PolicyEngine at 2026 to the cent on every grid case.
    arithmetic:
    - expression: 0.0519 * (30000.0 - 12360.08)
      equals: 915.51
      tolerance: 0.02
    - expression: 0.0499 * (30000.0 - 15000)
      equals: 748.5
      tolerance: 0.02
    - expression: 748.5 - 915.51
      equals: -167.01
      tolerance: 0.02
  expires_on_source_change: true
  pinned:
    left: 748.5
    right: 915.51
