# Georgia composed flat-liability pipeline vs PolicyEngine (2026) and TAXSIM
# (2024) on the six-case grid. The pipeline matches PolicyEngine ga_income_tax to
# the cent on all six cases (the section 48-7-20 flat 4.99% tax on Georgia taxable
# net income = Georgia AGI less the section 48-7-27 standard deduction), so the
# PolicyEngine leg needs no disposition. The TAXSIM-2024 residuals are the
# 2024-to-2026 vintage: section 48-7-20(a.1) stepped the flat rate down from 5.39
# per cent (2024, HB1015) to 4.99 per cent (2026, HB463) and section 48-7-27(a)(1)(B)
# raised the standard deduction from 12,000/24,000 (2024) to 15,000/30,000 (2026,
# HB463). TAXSIM's pinned 2024 law year computes 0.0539*(AGI - 12,000 single /
# 24,000 married) less a fixed 250 single / 500 married 2024 offset, which
# reproduces TAXSIM to the cent; at low income the 2026 pipeline exceeds TAXSIM
# (the larger deduction and the retired offset dominate), at high income TAXSIM
# exceeds the pipeline (the higher 2024 rate dominates).
entries:
  - id: ga-taxsim-2024-vintage-single-30000
    concept: us-ga:policies/income_tax/pilot_liability_pipeline#ga_pit_pilot_income_tax_liability
    case_id: ga-single-30000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        TAXSIM runs at its latest 2024 law year. Georgia's section 48-7-20(a.1)
        rate was 5.39 per cent in 2024 (HB1015) versus 4.99 per cent in 2026
        (HB463), and the section 48-7-27 standard deduction was 12,000 single in
        2024 versus 15,000 in 2026 (HB463); TAXSIM's 2024 law year also applies a
        fixed 250-dollar single offset. The 2024 schedule 0.0539*(30000-12000)-250
        reproduces TAXSIM to the cent. Here the larger 2026 deduction and the
        retired 2024 offset outweigh the 2024 rate, so the pipeline is 28.30 above
        TAXSIM. Pinned-2024-law-year vintage, not a pipeline defect; the pipeline
        matches PolicyEngine at 2026 to the cent.
      arithmetic:
        - expression: "748.5 - 720.2"
          equals: 28.3
          tolerance: 0.01
        - expression: "0.0539*(30000-12000)-250"
          equals: 720.2
          tolerance: 0.02
    expires_on_source_change: true
    pinned:
      left: 748.5
      right: 720.2
