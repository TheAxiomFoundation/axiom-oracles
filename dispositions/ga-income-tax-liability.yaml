schema: axiom_oracles.dispositions.v1
suite: ga-income-tax-liability
updated: "2026-07-13"
# GA composed flat-liability pipeline vs PolicyEngine (2026) and TAXSIM
# (2024) on the six-case grid. The pipeline matches PolicyEngine to the cent on
# all six cases, so the PolicyEngine leg needs no disposition. Every
# axiom-vs-TAXSIM-2024 residual is the 2024-to-2026 law vintage, dispositioned
# below with the pinned values.
entries:
  - id: ga-taxsim-2024-rate-and-deduction-vintage-single-30000
    concept: us-ga:policies/income_tax/pilot_liability_pipeline#ga_pit_pilot_income_tax_liability
    case_id: ga-single-30000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        TAXSIM runs Georgia at its latest 2024 law year: the flat rate was 5.39
        per cent under HB 1015 (verified by the TAXSIM marginal slope, e.g.
        (2,337.20 - 720.20) / 30,000 = 0.0539) against the enacted 2026 schedule
        rate of 4.99 per cent the pipeline applies, and TAXSIM's 2024 deduction
        treatment (implied taxable-income offset 16,639 single / 33,276 joint)
        predates the HB463 standard deduction of 15,000 single / 30,000 joint
        effective tax year 2026. For the single 30,000-dollar filer the 2026
        pipeline reports 748.5 and TAXSIM 2024 reports 720.2, a 28.3-dollar gap —
        the two-year rate-and-deduction vintage, not a pipeline defect.
      arithmetic:
        - expression: "748.5 - 720.2"
          equals: 28.3
          tolerance: 0.01
    expires_on_source_change: true
    pinned:
      left: 748.5
      right: 720.2
