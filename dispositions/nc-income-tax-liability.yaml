schema: axiom_oracles.dispositions.v1
suite: nc-income-tax-liability
updated: "2026-07-13"
# NC composed flat-liability pipeline vs PolicyEngine (2026) and TAXSIM
# (2024) on the six-case grid. The pipeline matches PolicyEngine to the cent on
# all six cases, so the PolicyEngine leg needs no disposition. Every
# axiom-vs-TAXSIM-2024 residual is the 2024-to-2026 law vintage, dispositioned
# below with the pinned values.
entries:
  - id: nc-taxsim-2024-rate-stepdown-vintage-single-30000
    concept: us-nc:policies/income_tax/pilot_liability_pipeline#nc_pit_pilot_income_tax_liability
    case_id: nc-single-30000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        North Carolina's standard deduction is unchanged between the years (12,750
        single / 25,500 joint; TAXSIM 2024 implies the same offsets), so the gap
        is entirely the section 105-153.7 scheduled rate step-down from 4.5 per
        cent in 2024 to 3.99 per cent in 2026 on the same taxable income: taxable
        * (0.0399 - 0.045). For the single 30,000-dollar filer the 2026 pipeline
        reports 688.275 and TAXSIM 2024 reports 776.25, a -87.98-dollar gap — the
        rate vintage, not a pipeline defect.
      arithmetic:
        - expression: "688.275 - 776.25"
          equals: -87.98
          tolerance: 0.01
    expires_on_source_change: true
    pinned:
      left: 688.275
      right: 776.25
