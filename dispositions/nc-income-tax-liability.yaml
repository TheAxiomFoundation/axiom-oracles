- id: nc-taxsim-2026-unenacted-rate-retention-single-30000
  concept: us-nc:policies/income_tax/pilot_liability_pipeline#nc_pit_pilot_income_tax_liability
  case_id: nc-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: |-
      Both engines run at the 2026 law year, but TAXSIM's 2026 North Carolina
      module retains the 4.25 per cent rate (the 2025 value of the section
      105-153.7 step-down; the enacted 2026 rate is 3.99 per cent) on an
      extrapolated deduction (implied offset 13,132.58 vs the enacted 12,750):
      0.0425 x (30,000 - 13,132.58) = 716.87 reproduces TAXSIM to the cent,
      while the pipeline's enacted 0.0399 x (30,000 - 12,750) = 688.27. Un-
      enacted rate retention plus deduction projection, not a pipeline defect;
      the pipeline matches PolicyEngine at 2026 to the cent on every grid
      case.
    arithmetic:
    - expression: 0.0425 * (30000.0 - 13132.58)
      equals: 716.87
      tolerance: 0.02
    - expression: 0.0399 * (30000.0 - 12750)
      equals: 688.27
      tolerance: 0.02
    - expression: 688.27 - 716.87
      equals: -28.6
      tolerance: 0.02
  expires_on_source_change: true
  pinned:
    left: 688.275
    right: 716.87
