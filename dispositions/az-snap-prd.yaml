  disposition: upstream_engine_gap
  evidence:
    mechanism: |-
      PRD's create_synthetic_families interface has no general unearned-income
      slot and the policyengine-prd emulator forwards neither
      social_security_income nor investment_income (PolicyEngine/prd-
      comparison#142), so households whose ECPS income is Social Security or
      investment project into PRD as zero-income and receive exactly the
      FY2025 maximum allotment for their household size, while the axiom leg
      sees the full income and computes zero. Every selected row has projected
      earned income under $100, positive unearned income in the embedded
      prd_household spec, and a PRD value equal to the FY2025 maximum for its
      size. Input-interface scope, not a rules disagreement.
