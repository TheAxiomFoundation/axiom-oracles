- id: tanf-zero-counterfactual-35254
  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-35254
  kind: amount_difference
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
  evidence:
    upstream_url: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
    mechanism: >-
      The old annualized-period pin expired when PE SNAP materially changed to
      558.699951171875. A fixed-runner, exact-household 2026-01 replay on
      PolicyEngine 4.18.9 / US 1.767.3 / core 3.30.3 forced both tn_ff and
      aggregate tanf to zero. SNAP stayed eligible and became 667.5999755859375,
      only 0.5999755859375 from Axiom 667.0 and within the unchanged tolerance
      7, revalidating endogenous TANF transport as the mismatch mechanism.
    arithmetic:
    - expression: "667.5999755859375 - 667.0"
      equals: 0.5999755859375
      tolerance: 1.0e-09
    sources:
    - dashboard/public/data/axiom-policyengine-tn-snap-ecps.json
    - https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.9(b)(2)(i)
  expires_on_source_change: true
  pinned:
    left: 667.0
    right: 558.699951171875
    difference: 108.300048828125
