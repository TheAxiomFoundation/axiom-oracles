- id: tn-negative-se-loss-2026-07-30-eligibility
  concept: us:statutes/7/2014/o#snap_eligible
  kind: eligibility_left_only
  case_selector:
    case_ids:
    - ecps-67898
    - ecps-70724
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
  evidence:
    mechanism: 'Self-employment loss pass-through: the projection''s flat 0.6 self-employment
      netting (axiom_oracles/data/populace_input_mapping.yaml) passes Enhanced CPS self-employment
      losses through as negative Axiom earned income (sample ecps-67898: persisted snap_gross_monthly_earned_income
      -76562.87), while PolicyEngine floors SNAP self-employment income at zero (snap_self_employment_income_after_expense_deduction
      takes max(., 0)). Axiom''s income tests pass on the loss-netted surface and it awards
      a benefit while PolicyEngine remains ineligible or lower. Verified per-row on the pinned
      stack (PolicyEngine 4.18.9 / PolicyEngine-US 1.767.3 / PolicyEngine-Core 3.30.3): the
      committed adapter reproduces the report values, and every selected row carries a negative
      Axiom earned-income input while the January PolicyEngine earned income is floored at
      or above zero (2 cases / 4 rows). A dedicated tracking issue for the self-employment-loss
      netting in the Populace bridge still needs filing; axiom-oracles#397 documents the same
      unequal-cross-program-input policy problem (same linkage as the fl-snap-ecps se-loss-netting
      class).'
    upstream_url: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
    sources:
    - dashboard/public/data/axiom-policyengine-tn-snap-ecps.json
    - axiom_oracles/data/populace_input_mapping.yaml
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.11(a)
  expires_on_source_change: true
