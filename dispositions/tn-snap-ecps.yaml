- id: tanf-zero-counterfactual-35254
  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-35254
  kind: amount_difference
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
  evidence:
    upstream_url: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
    mechanism: >-
      Exact-household live counterfactual on PolicyEngine 4.18.9, PolicyEngine-US 1.767.3,
      and PolicyEngine-Core 3.28.0: the regenerated baseline is Axiom 667.0 versus PE
      564.6453450520834. PE reports monthly tn_ff 362.0347493489583 and aggregate TANF
      362.0347493489583. Forcing both to zero leaves SNAP eligibility true and produces PE
      SNAP 673.5453694661459; its absolute delta from Axiom is 6.545369466145871, within
      the suite tolerance 7. This exact counterfactual isolates endogenous TANF transport
      as the mismatch mechanism.
    arithmetic:
    - expression: "673.5453694661459 - 667.0"
      equals: 6.545369466145871
      tolerance: 1.0e-09
    sources:
    - dashboard/public/data/axiom-policyengine-tn-snap-ecps.json
    - https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.9(b)(2)(i)
  expires_on_source_change: true
  pinned:
    left: 667.0
    right: 564.6453450520834
    difference: 102.35465494791663
