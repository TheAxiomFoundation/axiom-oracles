- id: tn-pe-annual-eligibility-aggregation-2026-07-30
  concept: us:statutes/7/2014/o#snap_eligible
  kind: eligibility_right_only
  case_selector:
    case_ids:
    - ecps-35744
    - ecps-35845
    - ecps-35971
    - ecps-36308
  disposition: bridge_artifact
  evidence:
    mechanism: "The comparison's PolicyEngine eligibility boolean comes from the batch output\
      \ dataset's calendar-2026 aggregation, which reports eligible although the direct requested-month\
      \ (2026-01) simulation is ineligible for January: the household fails the January income\
      \ eligibility tests under the FY-2026 parameters while other 2026 months pass (income-limit\
      \ uprating across the October fiscal-year boundary), and Axiom evaluates 2026-01 only.\
      \ Verified per-row on the pinned stack (PolicyEngine 4.18.9 / PolicyEngine-US 1.767.3\
      \ / PolicyEngine-Core 3.30.3): the committed adapter reproduces the annual-aggregated\
      \ True while the direct January simulation returns False on every selected row (4 rows;\
      \ sample ecps-35744 January gross-income-to-poverty ratio 1.1422). The January benefit\
      \ is zero on both engines, so only the eligibility boolean diverges \u2014 a harness\
      \ period-aggregation artifact, not an engine defect."
    sources:
    - dashboard/public/data/axiom-policyengine-tn-snap-ecps.json
    - axiom_oracles/adapters/policyengine/runner.py
  expires_on_source_change: true
- id: tn-se-flat-netting-2026-07-30-eligibility-left
  concept: us:statutes/7/2014/o#snap_eligible
  kind: eligibility_left_only
  case_selector:
    case_ids:
    - ecps-35306
    - ecps-36256
    - ecps-36374
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
  evidence:
    mechanism: 'Flat self-employment netting asymmetry: the generic populace projection feeds
      Axiom''s snap_gross_monthly_earned_income with self-employment scaled by 0.6 (axiom_oracles/data/populace_input_mapping.yaml
      documents the 0.6 scale as the oracle''s modeled netting, calibrated against states
      with the 40-percent SNAP self-employment expense deduction), but Tennessee carries gov/usda/snap/income/deductions/self_employment
      rate 0 with the expense-based method in PolicyEngine-US 1.767.3, so PolicyEngine counts
      gross self-employment while Axiom receives 60 percent of it. Verified per-row on the
      pinned stack (PolicyEngine 4.18.9 / PolicyEngine-US 1.767.3 / PolicyEngine-Core 3.30.3):
      the committed adapter reproduces the report values, and January PolicyEngine SNAP earned
      income minus Axiom''s persisted earned-income input equals 0.4x monthly self-employment
      within $1.00 on every selected row (17 cases / 20 rows; sample ecps-35304: 1623.3 -
      973.98 = 649.32 = 0.4 x 1623.3). Benefit residuals reconcile as 0.3x the resulting net-income
      gap within the 30-percent rounding; eligibility flips occur where the gross-self-employment
      surface fails PolicyEngine''s January income tests while the netted Axiom surface passes.
      A dedicated tracking issue for the flat self-employment netting in the Populace bridge
      still needs filing; axiom-oracles#397 documents the same unequal-cross-program-input
      policy problem (same linkage as the fl-snap-ecps se-expense-deduction-bridge class).'
    upstream_url: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
    arithmetic: &id001
    - expression: 1623.2974853515625 - 973.98 - 0.4 * 1623.2975260416667
      equals: -0.0015250651042606478
      tolerance: 1.0e-06
    - expression: 3072.196533203125 - 1843.32 - 0.4 * 3072.1966145833335
      equals: -0.0021126302083303017
      tolerance: 1.0e-06
    - expression: 1848.7554931640625 - 1109.25 - 0.4 * 1848.7555338541667
      equals: 0.0032796223957802795
      tolerance: 1.0e-06
    sources:
    - dashboard/public/data/axiom-policyengine-tn-snap-ecps.json
    - axiom_oracles/data/populace_input_mapping.yaml
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.11(a)
  expires_on_source_change: true
