- id: ssi-and-tanf-zero-counterfactual-27266
  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-27266
  kind: amount_difference
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
  evidence:
    mechanism: 'Exact-household requested-month counterfactual on PolicyEngine 4.18.9 / PolicyEngine-US
      1.767.3 / PolicyEngine-Core 3.30.3. The committed comparison adapter replayed over the
      same Case projection reproduces the report pin (Axiom 546.0 versus January PolicyEngine
      256.1999816894531), and the unmodified direct requested-month simulation reproduces
      the same January value. Forcing the endogenously imputed SSI input and the aggregate
      and state TANF inputs to zero in the direct requested-month simulation produces January
      SNAP 546.0; its absolute delta from Axiom, 0.0, is within the unchanged suite tolerance
      7.0. The comparison bridge zeroes TANF on the Axiom input surface while PolicyEngine
      computes state TANF endogenously and counts it as SNAP unearned income (axiom-oracles#397
      counterfactual class). The household carries no SSI on the projected Enhanced CPS input
      surface (the bridge projects zero SSI to Axiom), while PolicyEngine''s direct requested-month
      path imputes an endogenous SSI award into SNAP unearned income, so the engines price
      different income surfaces. Replay classifier record: class=ssi_tanf.'
    upstream_url: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
