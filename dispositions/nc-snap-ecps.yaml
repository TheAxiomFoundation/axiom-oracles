- id: pe-lone-minor-child-earnings-benefit
  concept: us:statutes/7/2014/u#snap_benefit
  case_selector:
    case_ids:
    - ecps-27147
    - ecps-27597
    - ecps-27962
  kind: amount_difference
  disposition: upstream_engine_gap
  linked_issue: https://github.com/PolicyEngine/policyengine-us/issues/9157
  evidence:
    upstream_url: https://github.com/PolicyEngine/policyengine-us/issues/9157
    mechanism: 'Reverified on PolicyEngine 4.18.9, PolicyEngine-US 1.767.3, and PolicyEngine-Core 3.30.3.
      The exact-household signature and explicit K-12 counterfactual reproduce the mechanism: PolicyEngine
      excludes all earnings of an imputed K-12 member age 17 or younger without requiring the co-resident-parent
      or parental-control condition in 7 CFR 273.9(c)(7). The sole minor is a valid household under 273.1(a)(1),
      but wages count under 273.9(b)(1)(i), so Axiom correctly fails the income gate and returns zero
      benefit. Requested-month selector audit retained 3 of 3 rows; vanished cases: none; materially moved
      rows: 3 (ecps-27147 right 150.64496866861978 -> 148.59999084472656; ecps-27597 right 198.19500732421875
      -> 196.0; ecps-27962 right 150.64496866861978 -> 148.59999084472656).'
    sources:
    - dashboard/public/data/axiom-policyengine-nc-snap-ecps.json
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.1(a)(1)
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.9(b)(1)(i)
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.9(c)(7)
  expires_on_source_change: true
