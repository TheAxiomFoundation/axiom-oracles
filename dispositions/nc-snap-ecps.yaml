- id: nc-bbce-gross-band-snap_eligible
  concept: us:statutes/7/2014/o#snap_eligible
  kind: eligibility_right_only
  case_selector:
    case_ids:
    - ecps-27162
    - ecps-27290
    - ecps-27449
    - ecps-27615
    - ecps-27629
    - ecps-27752
    - ecps-27876
    - ecps-28009
    - ecps-28361
  disposition: axiom_encoding_gap
  evidence:
    mechanism: |-
      North Carolina's broad-based categorical eligibility (SNAP state option;
      PolicyEngine models gross screen x2.0 FPL, x2.0 for elderly/disabled
      households, at 2026-01 per gov/hhs/tanf/non_cash parameters) is not in
      the composed us-nc/snap/fy-2026 program, which applies only the standard
      federal tests. Every selected row is verified per-row against axiom's
      persisted output surface: household gross income sits inside the band
      above the federal 130 percent limit the composed program applies and at
      or below the state's BBCE screen, verified against axiom's own computed
      gross income and limit. Axiom-side modeling boundary, tracked for
      encoding in rulespec-us#1098. Requested-month selector audit retained 9 of 9 rows; vanished cases: none; materially moved rows: 0.
  linked_issue: https://github.com/TheAxiomFoundation/rulespec-us/issues/1098
  expires_on_source_change: true
- id: tanf-zero-counterfactual-27158
  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-27158
  kind: amount_difference
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
  evidence:
    upstream_url: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
    mechanism: 'Exact-household requested-month counterfactual on PolicyEngine 4.18.9, PolicyEngine-US
      1.767.3, and PolicyEngine-Core 3.30.3: the fixed-runner baseline is Axiom 1183.0 versus January
      PolicyEngine 1161.699951171875, reproduced by the direct requested-period replay. PolicyEngine reports
      calendar-year nc_tanf 3724.00341796875 and calendar-year aggregate TANF 3724.00341796875. Forcing
      both the state component and aggregate TANF to zero at their native periods keeps SNAP eligibility
      True and produces January SNAP 1183.0; its absolute delta from Axiom is 0.0, within the unchanged
      suite tolerance 7.0. The legacy annual-average pin was 1183.0 / 1168.7794596354167 / 14.220540364583258;
      the requested-month pin is 1183.0 / 1161.699951171875 / 21.300048828125 (materially changed). Replay
      receipt SHA-256 38c0860662f48c8acc707456d5b21d79b9de2d29b2a9eb15931bdd2840f19436 reproduces the
      fixed 2026-01 baseline and counterfactual; material movement=true.'
    arithmetic:
    - expression: 1183.0 - 1183.0
      equals: 0.0
      tolerance: 1.0e-09
    sources:
    - dashboard/public/data/axiom-policyengine-nc-snap-ecps.json
    - https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.9(b)(2)(i)
  expires_on_source_change: true
  pinned:
    left: 1183.0
    right: 1161.699951171875
    difference: 21.300048828125
