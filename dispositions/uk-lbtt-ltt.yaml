schema: axiom_oracles.dispositions.v1
suite: uk-lbtt-ltt
updated: "2026-07-07"
# Scotland LBTT (SSI 2015/126 + LBTT(S)A 2013 Sch 2A) and Wales LTT (WSI
# 2018/128 + LTT(W)A 2017 s.24) vs PolicyEngine-UK 2.89.2 on the synthetic
# purchase grid. The LBTT main-home surface matches PolicyEngine to the penny.
# Every divergence is upstream PolicyEngine rate/threshold vintage staleness —
# the rulespec uses the current statutory schedule, PolicyEngine an older one —
# and is dispositioned as upstream_engine_gap against the filed PolicyEngine-UK
# issues, not absorbed by tolerance.
entries:
  - id: lbtt-ads-surcharge-stale-6pct-vs-8pct
    concept: uk:policies/govuk/lbtt#land_and_buildings_transaction_tax
    case_id: lbtt-additional-dwelling
    kind: amount_difference
    disposition: upstream_engine_gap
    evidence:
      mechanism: >-
        The additional dwelling costs 300,000 pounds. The rulespec charges the
        SSI 2015/126 residential schedule (4,600) plus the LBTT(S)A 2013
        Schedule 2A Additional Dwelling Supplement at 8% of 300,000 (24,000) =
        28,600, the 8% rate in force since 5 December 2024. PolicyEngine-UK's
        gov.revenue_scotland.lbtt.residential.additional_residence_surcharge is
        still 6% (18,000), giving 22,600. The 6,000 gap is exactly the two-point
        ADS staleness (0.02 * 300,000), filed as PolicyEngine-UK #1795.
      upstream_url: https://github.com/PolicyEngine/policyengine-uk/issues/1795
      arithmetic:
        - expression: "28600 - 22600"
          equals: 6000
          tolerance: 0.01
        - expression: "0.02 * 300000"
          equals: 6000
          tolerance: 0.01
    expires_on_source_change: true
    pinned:
      left: 28600.0
      right: 22600.0
      difference: 6000.0
  - id: lbtt-ads-surcharge-stale-on-mixed-purchase
    concept: uk:policies/govuk/lbtt#land_and_buildings_transaction_tax
    case_id: lbtt-main-plus-additional
    kind: amount_difference
    disposition: upstream_engine_gap
    evidence:
      mechanism: >-
        Main home 300,000 (4,600, matching PolicyEngine) plus an additional
        dwelling of 250,000. The rulespec additional charge is the standard
        residential schedule (2,100) plus the 8% ADS (20,000); PolicyEngine
        applies its stale 6% surcharge (15,000). The 5,000 gap is the two-point
        ADS staleness on 250,000 (0.02 * 250,000), PolicyEngine-UK #1795.
      upstream_url: https://github.com/PolicyEngine/policyengine-uk/issues/1795
      arithmetic:
        - expression: "26700 - 21700"
          equals: 5000
          tolerance: 0.01
        - expression: "0.02 * 250000"
          equals: 5000
          tolerance: 0.01
    expires_on_source_change: true
    pinned:
      left: 26700.0
      right: 21700.0
      difference: 5000.0
  - id: ltt-primary-scale-stale-2022-threshold
    concept: uk:policies/govuk/ltt#land_transaction_tax
    case_id: ltt-main-six-percent-band
    kind: amount_difference
    disposition: upstream_engine_gap
    evidence:
      mechanism: >-
        Main home 300,000. The rulespec charges the current WSI 2018/128 primary
        schedule (0% to 225,000, then 6%): 0.06 * (300,000 - 225,000) = 4,500.
        PolicyEngine-UK's gov.wra.land_transaction_tax.residential.primary scale
        is frozen at its 2021-07-01 vintage (0% to 180,000, 3.5% to 250,000, 5%
        thereafter): 0.035 * 70,000 + 0.05 * 50,000 = 4,950, missing the 10
        October 2022 rise of the starting threshold to 225,000 and the first
        band to 6%. PolicyEngine-UK #1796.
      upstream_url: https://github.com/PolicyEngine/policyengine-uk/issues/1796
      arithmetic:
        - expression: "4500 - 4950"
          equals: -450
          tolerance: 0.01
        - expression: "(0.035 * 70000 + 0.05 * 50000) - (0.06 * 75000)"
          equals: 450
          tolerance: 0.01
    expires_on_source_change: true
    pinned:
      left: 4500.0
      right: 4950.0
      difference: -450.0
  - id: ltt-primary-scale-stale-high-value
    concept: uk:policies/govuk/ltt#land_transaction_tax
    case_id: ltt-main-into-ten-percent-band
    kind: amount_difference
    disposition: upstream_engine_gap
    evidence:
      mechanism: >-
        Main home 800,000. The rulespec applies the current WSI 2018/128 primary
        schedule: 0.06 * 175,000 + 0.075 * 350,000 + 0.10 * 50,000 = 41,750.
        PolicyEngine's stale 2021-07-01 primary scale gives 0.035 * 70,000 +
        0.05 * 150,000 + 0.075 * 350,000 + 0.10 * 50,000 = 41,200. The 550 gap is
        the 10 October 2022 threshold and first-band change PolicyEngine has not
        adopted. PolicyEngine-UK #1796.
      upstream_url: https://github.com/PolicyEngine/policyengine-uk/issues/1796
      arithmetic:
        - expression: "41750 - 41200"
          equals: 550
          tolerance: 0.01
    expires_on_source_change: true
    pinned:
      left: 41750.0
      right: 41200.0
      difference: 550.0
  - id: ltt-higher-rate-scale-stale-2024-uplift
    concept: uk:policies/govuk/ltt#land_transaction_tax
    case_id: ltt-additional-higher-rates
    kind: amount_difference
    disposition: upstream_engine_gap
    evidence:
      mechanism: >-
        Additional dwelling 300,000, charged under the WSI 2018/128 higher-rate
        schedule. The rulespec uses the current rates (5% to 180,000, 8.5% to
        250,000, 10% thereafter): 0.05 * 180,000 + 0.085 * 70,000 + 0.10 *
        50,000 = 19,950. PolicyEngine's
        gov.wra.land_transaction_tax.residential.higher_rate scale is frozen at
        its 2020-12-22 vintage (4%, 7.5%, 9%): 0.04 * 180,000 + 0.075 * 70,000 +
        0.09 * 50,000 = 16,950, missing the 11 December 2024 one-point uplift.
        PolicyEngine-UK #1796.
      upstream_url: https://github.com/PolicyEngine/policyengine-uk/issues/1796
      arithmetic:
        - expression: "19950 - 16950"
          equals: 3000
          tolerance: 0.01
    expires_on_source_change: true
    pinned:
      left: 19950.0
      right: 16950.0
      difference: 3000.0
  - id: ltt-both-scales-stale-on-mixed-purchase
    concept: uk:policies/govuk/ltt#land_transaction_tax
    case_id: ltt-main-plus-additional
    kind: amount_difference
    disposition: upstream_engine_gap
    evidence:
      mechanism: >-
        Main home 400,000 plus additional dwelling 300,000. The rulespec charges
        the current primary schedule on the main home (0.06 * 175,000 = 10,500)
        and the current higher-rate schedule on the additional dwelling (19,950)
        = 30,450. PolicyEngine applies its stale primary (9,950) and higher-rate
        (16,950) scales = 26,900. The 3,550 gap combines the stale 10 October
        2022 primary change (550) and the stale 11 December 2024 higher-rate
        uplift (3,000). PolicyEngine-UK #1796.
      upstream_url: https://github.com/PolicyEngine/policyengine-uk/issues/1796
      arithmetic:
        - expression: "30450 - 26900"
          equals: 3550
          tolerance: 0.01
        - expression: "550 + 3000"
          equals: 3550
          tolerance: 0.01
    expires_on_source_change: true
    pinned:
      left: 30450.0
      right: 26900.0
      difference: 3550.0
