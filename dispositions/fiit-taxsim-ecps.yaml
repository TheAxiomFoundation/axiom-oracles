  disposition: axiom_encoding_gap
  evidence:
    mechanism: 'The encoded self-employment tax applies only the 26 USC 1401(b)

      Medicare rate: on every selected row the axiom value reproduces as

      exactly 7.65 percent of total unit wages plus 2.9 percent of 92.35

      percent of each filer''s self-employment profits (verified per-row

      to five cents on 2026-08-23) — the 1401(a) 12.4 percent OASDI

      component is absent, the sibling of the uncapped-3101 gap filed as

      axiom-encode#1214. The pinned binary computes full SECA with the

      wage-coordinated 1402(b)(1) base. Upstream issue to be filed; the

      class re-verifies (expires) on any source change.'
    arithmetic:
    - expression: 0.029 * 0.9235
      equals: 0.0267815
      tolerance: 1.0e-07
  expires_on_source_change: true
