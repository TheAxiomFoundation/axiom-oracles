  disposition: upstream_engine_gap
  evidence:
    mechanism: 'Second face of the pinned binary''s 2026 child-credit gap: on

      units with dependents whose earned income sits inside the

      childless EITC range, TAXSIM pays the CHILDLESS schedule

      instead of zero — every selected row''s TAXSIM value is

      positive and bounded by the 2026 childless maximum of $664

      (verified per-row 2026-08-23: max observed exactly 664.00,

      zero rows above it), while the axiom side computes the

      enacted with-children 26 USC 32 credit. Same NBER gap as

      taxsim-2026-eitc-child-machinery-absent; membership is

      disjoint (that class takes the rows where TAXSIM pays zero).'
    arithmetic:
    - expression: 664 - 664
      equals: 0.0
      tolerance: 0.0
  expires_on_source_change: true
