  disposition: axiom_encoding_gap
  evidence:
    mechanism: 'The encoded 26 USC 3101 employee payroll taxes apply no 3121(a)(1)

      contribution-base cap and no 3101(b)(2) additional Medicare tax:

      on every selected wage-only row the axiom value reproduces as

      exactly 7.65 percent of total unit wages (verified per-row to

      five cents on 2026-08-23), while the pinned binary caps OASDI at

      its 2026 wage base of $184,500 (probe-verified: tfica(190000) -

      0.0145*190000 = 0.062*184500) and models additional Medicare.

      Filed as axiom-encode#1214.'
    arithmetic:
    - expression: 0.062 * 184500 + 0.0145 * 190000
      equals: 14194.0
      tolerance: 0.01
  expires_on_source_change: true
  linked_issue: https://github.com/TheAxiomFoundation/axiom-encode/issues/1214
