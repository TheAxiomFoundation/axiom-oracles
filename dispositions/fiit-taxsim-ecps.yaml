    - ecps-tax-unit-99848
  disposition: explained_residual
  evidence:
    mechanism: 'Every residual is an exact whole multiple of the 2026 section 63(f)

      additional standard deduction ($2,050 unmarried / $1,650 per

      married individual). The TAXSIM input format carries no blindness

      column and its aged handling differs from the encoded 63(f)

      increments; the axiom side computes the enacted amounts from the

      projected ages. Same class as the Colorado intersection lane''s,

      verified per-row by exact multiplicity.'
    arithmetic:
    - expression: 2050 * 1
      equals: 2050.0
      tolerance: 0.0
    - expression: 1650 * 2
      equals: 3300.0
      tolerance: 0.0
