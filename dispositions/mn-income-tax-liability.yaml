- id: mn-taxsim-2024-vintage-single-30000
  concept: us-mn:policies/income_tax/pilot_liability_pipeline#mn_pit_pilot_income_tax_liability
  case_id: mn-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: TAXSIM runs at its latest 2024 law year. Minnesota indexes the section 290.06 subdivision 2c brackets and the section 290.0123 standard deduction under section 270C.22; the residual is the 2024-to-2026 law-year difference between the TAXSIM 2024 Minnesota base and the 2026 PolicyEngine base (which for the top married case also carries the section 290.091 alternative minimum tax). The pipeline reports 789.125; TAXSIM 2024 reports 475.24. Law-year vintage, not a pipeline defect; the pipeline matches PolicyEngine mn_income_tax_before_refundable_credits at 2026 to the cent.
    arithmetic:
    - expression: 789.125 - 475.24
      equals: 313.885
      tolerance: 0.01
  expires_on_source_change: true
  pinned:
    left: 789.125
    right: 475.24
