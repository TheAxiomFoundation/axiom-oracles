- id: mn-taxsim-2026-indexation-projection-single-30000
  concept: us-mn:policies/income_tax/pilot_liability_pipeline#mn_pit_pilot_income_tax_liability
  case_id: mn-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: |-
      Both engines run at the 2026 law year. TAXSIM's 2026 Minnesota module
      extrapolates the section 290.06 subdivision 2c brackets and the section
      290.0123 standard deduction to fractional projected values (implied
      deduction 15,398.59), giving staxbc 781.18 against the pipeline's
      enacted 789.12, and its siitax additionally nets a projected 390.58
      credit at this income (exactly half its own before-credit tax) from its
      2026 credit model, with no enacted analog for this childless no-rent
      case. Residual = (789.12 - 781.18) + 390.58 = 398.52. TAXSIM 2026
      projection, not a pipeline defect; the pipeline matches PolicyEngine at
      2026 to the cent on every grid case.
    arithmetic:
    - expression: 781.18 - 390.58
      equals: 390.6
      tolerance: 0.02
    - expression: (789.12 - 781.18) + 390.58
      equals: 398.52
      tolerance: 0.02
  expires_on_source_change: true
  pinned:
    left: 789.125
    right: 390.6
