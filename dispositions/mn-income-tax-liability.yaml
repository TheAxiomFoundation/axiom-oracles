      every

      selected row axiom and PolicyEngine agree to the cent, with

      `axiom_vs_policyengine.match` true on all six, while TAXSIM reports a

      lower liability. Two distinct signatures share the class: the

      mn-single-30000 row diverges by 398.53 on a 789.12 liability (TAXSIM

      returns roughly half, consistent with a refundable working-family credit

      its module applies and the encoded 2026 pilot does not), while the

      remaining rows carry modest 13.23-225.78 residuals that grow with income.

      Deltas are therefore heterogeneous by construction; the per-row proof is

      the axiom==PolicyEngine agreement.'
