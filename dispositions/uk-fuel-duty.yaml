  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: '2027: from April 2027 PolicyEngine applies forecast RPI uprating of fuel duty, which Budget
      2025 announced (''by Retail Prices Index (RPI) from April 2027''). No Finance Act or order has amended
      HODA 1979 s.6(1A) or made a reduction or surcharge for these months, so the law charges £0.5795
      a litre. PolicyEngine models announced policy by design, and its #1882 fix (PR #1883) keeps these
      forecast steps. Pinned at 2.102.0 the forecast path is also averaged by calendar year (#1882). The
      PolicyEngine value is exactly its parameter read at the month start.'
    arithmetic:
    - expression: 0.5795 - 0.0
      equals: 0.5795
      tolerance: 5.0e-05
    - expression: 0.5925 - 0.0
      equals: 0.5925
      tolerance: 5.0e-05
    - expression: (0.5795 - 0.0) - (0.5925 - 0.0)
      equals: -0.013
      tolerance: 0.0001
    sources:
    - reference/uk-fuel-duty-schedule/schedule.yaml
    - https://github.com/TheAxiomFoundation/rulespec-uk/blob/main/uk/policies/govuk/fuel-duty.yaml
    - https://github.com/TheAxiomFoundation/rulespec-uk/blob/main/uk/policies/govuk/fuel-duty.test.yaml
