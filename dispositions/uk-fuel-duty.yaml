      SI 2022/365''s 8.63% reduction (52.95p) to 31 December 2026, SI 2026/164 art. 8''s 3.45% (55.95p)
      for January and February 2027, and the HODA 1979 s.6(1A) 57.95p from 1 March 2027. The PolicyEngine
      value is exactly its parameter read at the month start (less the supplied rural relief on rural
      rows).'
