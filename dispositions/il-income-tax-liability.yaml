schema: axiom_oracles.dispositions.v1
suite: il-income-tax-liability
updated: "2026-07-06"
# Illinois composed flat-rate liability pipeline vs PolicyEngine (2026) and
# TAXSIM (2024) on the six-case grid. The pipeline matches PolicyEngine
# il_income_tax_before_refundable_credits to the cent (the exact statutory
# analog), so the PolicyEngine leg needs no disposition. Against TAXSIM's 2024
# law year every case is within tolerance; the small residual is exactly the
# personal-exemption indexation vintage (2,925 in 2026 versus 2,775 in 2024) at
# the flat 4.95 per cent rate, dispositioned below.
entries:
  - id: il-taxsim-2024-exemption-vintage-single
    concept: us-il:policies/income_tax/pilot_liability_pipeline#il_pit_pilot_income_tax_liability
    case_id: il-single-150000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        The pipeline uses the tax-year-2026 personal exemption of 2,925 dollars
        (Illinois Department of Revenue Informational Bulletin FY 2026-15); TAXSIM
        runs at its latest 2024 law year, which uses the 2024 exemption of 2,775
        dollars. The entire 7.43-dollar residual on every single-filer case is
        that 150-dollar exemption difference taxed at the flat 4.95 per cent rate,
        constant across incomes because the rate is flat.
      arithmetic:
        - expression: "(2925 - 2775) * 0.0495"
          equals: 7.425
          tolerance: 0.01
        - expression: "7280.2125 - 7287.6375"
          equals: -7.425
          tolerance: 0.02
    expires_on_source_change: true
    pinned:
      left: 7280.2125
      right: 7287.64
  - id: il-taxsim-2024-exemption-vintage-joint
    concept: us-il:policies/income_tax/pilot_liability_pipeline#il_pit_pilot_income_tax_liability
    case_id: il-married-300000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        For joint filers the 2024-to-2026 exemption vintage applies to two
        exemptions, so the residual is twice the single-filer amount: 2 * (2925 -
        2775) * 0.0495 = 14.85 dollars, constant across joint-filer incomes.
      arithmetic:
        - expression: "2 * (2925 - 2775) * 0.0495"
          equals: 14.85
          tolerance: 0.01
        - expression: "14560.425 - 14575.275"
          equals: -14.85
          tolerance: 0.02
    expires_on_source_change: true
    pinned:
      left: 14560.425
      right: 14575.27
