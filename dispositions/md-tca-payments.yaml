- id: md-tca-im-26-13-hh1
  concept: us-md:policies/dhs/fia/im-26-13/2026-tca-tdap-benefit-increase/allowable-tca-monthly-payment#allowable_tca_monthly_payment_by_household_size@1
  case_id: md-tca-payments-allowable_tca_monthly_payment_by_household_size
  kind: amount_difference
  disposition: upstream_engine_gap
  linked_issue: https://github.com/PolicyEngine/policyengine-us/issues/9181
  evidence:
    mechanism: >-
      Maryland FIA Information Memo 26-13 (released 2026-03-04, effective
      2026-01-01, supersedes IM 25-12) sets the Allowable TCA Monthly Payment
      for household size 1 at $348; the primary PDF was fetched and its FIP
      schedule table verified directly. Axiom encodes the IM 26-13 schedule
      ($348). PolicyEngine's gov/states/md/tca/maximum_benefit/main.yaml ends
      at the IM 25-12 schedule effective 2025-01-01 ($339 for size 1), so the
      2026 comparison returns the superseded 2025 value. The gap is exactly
      the IM 26-13 increase for this household size. No PolicyEngine issue
      tracks the 2026 update yet.
    arithmetic:
    - expression: 348 - 339
      equals: 9.0
    upstream_url: https://dhs.maryland.gov/documents/FIA/Action%20Transmittals-AT%20-%20Information%20Memo-IM/AT-IM2026/26-13-IM-2026-TCA-TDAP-Benefit-Increase.pdf
    sources:
    - dashboard/public/data/axiom-policyengine-md-tca-payments.json
    - https://dhs.maryland.gov/documents/FIA/Action%20Transmittals-AT%20-%20Information%20Memo-IM/AT-IM2025/25-12%20IM%202025%20TCA%20TDAP%20RCA%20Benefit%20Increase.pdf
  expires_on_source_change: true
  pinned:
    left: 348.0
    right: 339.0
