- id: mi-taxsim-2026-exemption-projection-single-30000
  concept: us-mi:policies/income_tax/pilot_liability_pipeline#mi_pit_pilot_income_tax_liability
  case_id: mi-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: |-
      Both engines run at the 2026 law year and both apply Michigan's flat
      4.25 per cent rate (MCL 206.51(1)). TAXSIM's 2026 module extrapolates
      the section 206.30 personal exemption to 5,974.04 for this case instead
      of the enacted 5,950 (1 x 5,950), so the whole residual is the flat rate
      on the projection drift: 0.0425 x 24.04 = 1.02. A projection drift of
      about a dollar per filer that sits just outside the 1-dollar structural
      band; not a pipeline defect — the pipeline matches PolicyEngine at 2026
      to the cent on every grid case.
    arithmetic:
    - expression: 0.0425 * (5974.04 - 5950)
      equals: 1.02
      tolerance: 0.02
    - expression: 1022.12 - 1021.1
      equals: 1.02
      tolerance: 0.02
  expires_on_source_change: true
  pinned:
    left: 1022.125
    right: 1021.1
