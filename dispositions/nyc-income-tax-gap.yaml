    evidence:
      mechanism: >-
        The three synthetic NYC school-tax rate-reduction mismatches are
        second-band cases. Axiom follows the IT-201 instruction table's printed
        rounded base amounts ($21 for single/separate and $25 for head of
        household), while PolicyEngine derives the carry-in from the first-band
        threshold and rate. The joint/surviving-spouse first-band controls and
        over-limit control match.
      arithmetic:
        - expression: "21 - 12000 * 0.00171"
          equals: 0.48
          tolerance: 0.000001
        - expression: "25 - 14400 * 0.00171"
          equals: 0.376
          tolerance: 0.000001
