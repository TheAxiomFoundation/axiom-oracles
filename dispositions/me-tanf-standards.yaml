# Maine TANF Rule 125A adult-included charts vs the PolicyEngine parameter
# tree at 2026-01. The encoded rule carries the FFY2022-FFY2026 vintages and
# evaluates the FFY2026 column (effective 2025-10-01, per the Rule 125A
# charts); PolicyEngine's gov.states.me.dhhs.tanf tables end at the
# 2024-10-01 (FFY2025) vintage — the October 2025 COLA has not been ingested
# upstream. Every residual is that one-vintage lag, dispositioned as an
# upstream engine gap. Entries expire on source change so a PE parameter
# update that ingests FFY2026 retires them automatically.
entries:
  - id: me-ffy2026-vintage-adult_included_standard_of_need_base-size-1
    concept: us-me:regulations/dhhs/ofi/chapter-331/tanf-rule-125a/maximum-benefit-and-standard-of-need#adult_included_standard_of_need_base@1
    case_id: me-tanf-standards-adult_included_standard_of_need_base
    kind: amount_difference
    disposition: upstream_engine_gap
    evidence:
      mechanism: >-
        The encoded Rule 125A FFY2026 value (effective 2025-10-01) is 500;
        PolicyEngine's latest vintage for the same table cell is the 2024-10-01
        (FFY2025) value 489. The 11-dollar gap is the October 2025 COLA
        PolicyEngine has not yet ingested — a PolicyEngine parameter-vintage gap,
        not an encoding defect.
      arithmetic:
        - expression: "500.0 - 489.0"
          equals: 11.0
          tolerance: 0.01
    expires_on_source_change: true
    pinned:
      left: 500.0
      right: 489.0
