  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: 'Accommodation Supplement compound difference, primary vintage: A Treasury-host-aligned
      diagnostic establishes a BEFU25-versus-enacted benefit/FTC effect. The statutory primary also retains
      smaller reg 17–18 host conventions: FTC divided by 52 and the exact JSS cutout. Named instrument(s):
      Best Start prescribed amount (Income Tax Act 2007 s MG 2); Family Tax Credit annual prescribed amount
      (Income Tax Act 2007 s MD 3); Sole Parent Support weekly rate (SSA 2018 Sch 4 pt 2 cl 1)'
