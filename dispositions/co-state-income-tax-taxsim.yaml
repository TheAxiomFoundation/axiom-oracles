  disposition: upstream_engine_gap
  evidence:
    mechanism: "Triangulated TAXSIM-side divergence: on every selected row axiom\
      \ and\nPolicyEngine agree on Colorado liability to the cent (the household\
      \ is\nabsent from the axiom-vs-PE mismatch set for the same population) while\n\
      TAXSIM reports a flat lower liability \u2014 exactly \\$30.80 for married-\n\
      joint filers and \\$20.70 for single filers, across all income levels. A\n\
      flat per-filing-status offset in TAXSIM's Colorado module (consistent\nwith\
      \ a TABOR-mechanism vintage difference), not a rules disagreement on\nthe\
      \ axiom side."
    arithmetic:
    - expression: '30.80'
      equals: 30.8
      tolerance: 0.05
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/315
  expires_on_source_change: true
