- id: id-taxsim-2024-vintage-single-30000
  concept: us-id:policies/income_tax/pilot_liability_pipeline#id_pit_pilot_income_tax_liability
  case_id: id-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: TAXSIM runs at its latest 2024 law year. Idaho's section 63-3024
      flat rate stepped down from 5.695 per cent (2024) to 5.3 per cent (2026) and
      the no-tax threshold was indexed, so the 2026 tax is lower than TAXSIM's 2024
      computation; the residual is that rate-step and indexation. The pipeline reports
      475.94; TAXSIM 2024 reports 500.90. Pinned-2024-law-year vintage, not a pipeline
      defect; the pipeline matches PolicyEngine at 2026 to the cent.
    arithmetic:
    - expression: 475.94 - 500.9
      equals: -24.96
      tolerance: 0.01
  expires_on_source_change: true
  pinned:
    left: 475.94
    right: 500.9
