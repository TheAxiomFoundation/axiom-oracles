entries:
- id: id-taxsim-2026-threshold-projection-and-credit-scope-single-30000
  concept: us-id:policies/income_tax/pilot_liability_pipeline#id_pit_pilot_income_tax_liability
  case_id: id-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: |-
      Both engines run at the 2026 law year and both apply the section 63-3024
      flat 5.3 per cent rate to federal taxable income above the no-tax
      threshold. TAXSIM's 2026 module extrapolates that threshold to a
      fractional projected value (staxbc 474.07 vs the enacted 475.94, a 1.87
      drift) and its siitax nets a projected 149.35 section 63-3024B grocery
      credit (about 149.35 per filer) that the pipeline's before-refundable-
      credits core excludes by design (the final id_income_tax nets the
      enacted credit). Residual = (475.94 - 474.07) + 149.35 = 151.22. Credit
      scope plus threshold projection, not a pipeline defect; the pipeline
      matches PolicyEngine at 2026 to the cent on every grid case.
    arithmetic:
    - expression: 474.07 - 149.35
      equals: 324.72
      tolerance: 0.02
    - expression: (475.94 - 474.07) + 149.35
      equals: 151.22
      tolerance: 0.02
  expires_on_source_change: true
  pinned:
    left: 475.94
    right: 324.72
