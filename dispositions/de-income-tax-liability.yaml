- id: de-taxsim-2026-parameter-projection-single-30000
  concept: us-de:policies/income_tax/pilot_liability_pipeline#de_pit_pilot_income_tax_liability
  case_id: de-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: |-
      Both engines run at the 2026 law year. TAXSIM's 2026 Delaware module
      extrapolates the section 1108 standard deduction to 3,347.52 (the
      enacted amount is 3,250) and the fixed 110-dollar section 1110 personal
      credit to about 113.31 per filer (netting 113.31), while the pipeline
      applies the enacted deduction and nets the enacted 110-dollar credit.
      Residual = (988.12 - 1,081.12) + 113.31 = 20.31. TAXSIM 2026-projection
      drift on fixed statutory amounts, not a pipeline defect; the pipeline
      matches PolicyEngine at 2026 to the cent on every grid case.
    arithmetic:
    - expression: 1081.12 - 113.31
      equals: 967.81
      tolerance: 0.02
    - expression: (988.12 - 1081.12) + 113.31
      equals: 20.31
      tolerance: 0.02
  expires_on_source_change: true
  pinned:
    left: 988.125
    right: 967.81
