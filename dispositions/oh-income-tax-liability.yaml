- id: oh-taxsim-2026-schedule-projection-single-30000
  concept: us-oh:policies/income_tax/pilot_liability_pipeline#oh_pit_pilot_income_tax_liability
  case_id: oh-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: |-
      Both engines run at the 2026 law year, but TAXSIM's 2026 Ohio module
      carries a projected schedule rather than the enacted one: its before-
      credit tax staxbc is 371.42 against the pipeline's enacted section
      5747.02 flat-2.75-per-cent computation of 354.63, and its siitax
      additionally nets a projected 20.60 section 5747.98 exemption credit
      (the enacted credit is a fixed 20 dollars per exemption). The projected
      schedule retains a second bracket above roughly 100,000 dollars that the
      enacted 2026 flat schedule repealed, and extrapolates the personal-
      exemption and base amounts to fractional values (implied exemption
      offset 2,472.01). The residual decomposes exactly from TAXSIM's own
      detail: (354.63 - 371.42) + 20.60 = 3.81. TAXSIM 2026 schedule
      projection, not a pipeline defect; the pipeline matches PolicyEngine at
      2026 to the cent on every grid case.
    arithmetic:
    - expression: (354.63 - 371.42) + 20.6
      equals: 3.81
      tolerance: 0.02
    - expression: 371.42 - 20.6
      equals: 350.82
      tolerance: 0.02
  expires_on_source_change: true
  pinned:
    left: 354.62704
    right: 350.82
