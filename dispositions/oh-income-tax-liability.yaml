    concept: us-oh:policies/income_tax/pilot_liability_pipeline#oh_pit_pilot_income_tax_liability
    case_id: oh-married-60000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        The 2026 pipeline reports 1147.375 and TAXSIM 2024 reports 1176.07, a
        28.70-dollar gap that is the 2024-to-2026 base-amount vintage (the 2024
        $360.69 base against the 2026 $332.00 base). This income stays below the
        $100,000 top-bracket floor; the residual is the base-amount vintage.
      arithmetic:
        - expression: "1147.375 - 1176.07"
          equals: -28.695
          tolerance: 0.01
    expires_on_source_change: true
    pinned:
      left: 1147.375
      right: 1176.07
  - id: oh-taxsim-2024-top-bracket-married-120000
    concept: us-oh:policies/income_tax/pilot_liability_pipeline#oh_pit_pilot_income_tax_liability
    case_id: oh-married-120000
    kind: amount_difference
    disposition: explained_residual
    evidence:
