schema: axiom_oracles.dispositions.v1
suite: oh-income-tax-liability
updated: "2026-07-08"
# Ohio composed two-tier-liability pipeline vs PolicyEngine (2026) and TAXSIM
# (2024) on the six-case grid. The pipeline matches PolicyEngine
# oh_income_tax_before_non_refundable_credits to the cent on all six cases:
# PolicyEngine reproduces the ORC 5747.02(A)(3)(c) $332.00 base through an
# implied first-bracket average rate (0.0127448 x 26,050 = 332.00204), so the
# only PolicyEngine gap is a constant 0.00204-dollar float residual, well inside
# tolerance. The PolicyEngine leg therefore needs no disposition.
#
# Against TAXSIM's 2024 law year every case diverges, because Ohio's nonbusiness
# schedule changed between 2024 and 2026 (H.B. 33 then H.B. 96): the 2024 base
# amount is $360.69 (the 2024 implied first-bracket rate 0.0138462 x 26,050) vs
# the 2026 $332.00, and 2024 retains a 3.5 per cent top bracket on taxable income
# above $100,000 that the 2026 flat-2.75-per-cent schedule drops. TAXSIM also
# computes its own Ohio taxable income (its exemption and deduction model), which
# differs from PolicyEngine's oh_taxable_income. All six residuals are
# schedule-vintage and state-model differences, dispositioned below.
entries:
  - id: oh-taxsim-2024-base-vintage-single-30000
    concept: us-oh:policies/income_tax/pilot_liability_pipeline#oh_pit_pilot_income_tax_liability
    case_id: oh-single-30000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        The 2026 pipeline reports 374.625 and TAXSIM 2024 reports 383.32, an
        8.70-dollar gap. TAXSIM's 2024 Ohio schedule uses the $360.69 base amount
        (the 2024 implied first-bracket rate 0.0138462 x 26,050) against the 2026
        $332.00 base, a 28.69-dollar increase, partly offset because TAXSIM
        computes a lower Ohio taxable income than PolicyEngine's 27,600 at this
        level. The residual is the 2024-to-2026 base-amount vintage plus TAXSIM's
        own taxable-income model, not a pipeline defect.
      arithmetic:
        - expression: "374.625 - 383.32"
          equals: -8.695
          tolerance: 0.01
    expires_on_source_change: true
    pinned:
      left: 374.625
      right: 383.32
  - id: oh-taxsim-2024-base-vintage-single-60000
    concept: us-oh:policies/income_tax/pilot_liability_pipeline#oh_pit_pilot_income_tax_liability
    case_id: oh-single-60000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        The 2026 pipeline reports 1206.50 and TAXSIM 2024 reports 1235.20, a
        28.70-dollar gap that is essentially the 2024-to-2026 base-amount vintage
        (the 2024 $360.69 base against the 2026 $332.00 base = 28.69). This income
        stays below the $100,000 top-bracket floor, so no rate-bracket difference
        applies; the residual is the base-amount vintage.
      arithmetic:
        - expression: "1206.5 - 1235.2"
          equals: -28.7
          tolerance: 0.01
    expires_on_source_change: true
    pinned:
      left: 1206.5
      right: 1235.2
  - id: oh-taxsim-2024-top-bracket-single-150000
    concept: us-oh:policies/income_tax/pilot_liability_pipeline#oh_pit_pilot_income_tax_liability
    case_id: oh-single-150000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        The 2026 pipeline reports 3688.375 and TAXSIM 2024 reports 4144.32, a
        455.95-dollar gap. TAXSIM's 2024 schedule adds the 28.69-dollar base
        vintage and, crucially, a 3.5 per cent top bracket on taxable income above
        $100,000 that the 2026 flat-2.75-per-cent schedule dropped (about 48,000
        dollars of income above the floor at an extra 0.75 point), plus TAXSIM's
        own taxable-income model. The residual is the 2024-to-2026 schedule
        vintage, not a pipeline defect.
      arithmetic:
        - expression: "3688.375 - 4144.32"
          equals: -455.945
          tolerance: 0.01
    expires_on_source_change: true
    pinned:
      left: 3688.375
      right: 4144.32
