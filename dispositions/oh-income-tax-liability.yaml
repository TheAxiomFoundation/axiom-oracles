schema: axiom_oracles.dispositions.v1
suite: oh-income-tax-liability
updated: "2026-07-08"
# Ohio composed liability pipeline vs PolicyEngine (2026) and TAXSIM (2024) on
# the six-case grid. The pipeline matches PolicyEngine
# oh_income_tax_before_refundable_credits to the cent on all six cases (the exact
# section 5747.02 graduated tax on Ohio taxable income less the section 5747.98
# nonrefundable exemption credit), so the PolicyEngine leg needs no disposition.
# Against TAXSIM's 2024 law year every case diverges by the Ohio 2024-to-2026
# rate-schedule vintage: House Bill 33 (2023) indexes the section 5747.02(A)(3)
# base amount down each year (from $360.69 at the 2024 first-bracket effective
# rate of 1.38462 per cent to $332.00 at the 2026 rate of 1.27448 per cent) and
# collapses the pre-2025 3.5 per cent top marginal rate on Ohio taxable income
# above $100,000 into the single 2.75 per cent rate by 2026. TAXSIM's pinned 2024
# binary applies the 2024 schedule; the pipeline is the 2026 schedule. Every
# residual is that vintage, dispositioned below.
entries:
  - id: oh-taxsim-2024-base-indexation-vintage-single-30000
    concept: us-oh:policies/income_tax/pilot_liability_pipeline#oh_pit_pilot_income_tax_liability
    case_id: oh-single-30000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        TAXSIM runs at its latest 2024 law year. For the single 30,000-dollar
        filer both years apply the same 2.75 per cent rate to Ohio taxable income
        (27,600) above the 26,050 no-tax threshold and the same 20-dollar
        exemption credit (taxable income below 30,000), so the entire 28.69-dollar
        gap is the section 5747.02(A)(3) base-amount indexation: 360.69 at the
        2024 first-bracket effective rate of 1.38462 per cent versus 332.00 at the
        2026 rate of 1.27448 per cent. The pipeline reports 354.63 and TAXSIM 2024
        reports 383.32. This is a pinned-2024-law-year vintage, not a pipeline
        defect; the pipeline matches PolicyEngine at 2026 to the cent.
      arithmetic:
        - expression: "354.62704 - 383.32"
          equals: -28.69296
          tolerance: 0.01
        - expression: "360.69 - 332.00"
          equals: 28.69
          tolerance: 0.01
    expires_on_source_change: true
    pinned:
      left: 354.62704
      right: 383.32
  - id: oh-taxsim-2024-base-indexation-vintage-single-60000
    concept: us-oh:policies/income_tax/pilot_liability_pipeline#oh_pit_pilot_income_tax_liability
    case_id: oh-single-60000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        For the single 60,000-dollar filer (taxable income 57,850, entirely below
        the 100,000-dollar threshold) both years apply the same 2.75 per cent rate
        above 26,050, so the 28.70-dollar gap is the section 5747.02(A)(3)
        base-amount indexation (360.69 in 2024 versus 332.00 in 2026). The 2024
        schedule 360.69 + 0.0275*(57850-26050) = 1235.19 reproduces TAXSIM's
        1235.20 to the cent; the pipeline reports 1206.50. Pinned-2024-law-year
        vintage; the pipeline matches PolicyEngine at 2026 to the cent.
      arithmetic:
        - expression: "1206.50204 - 1235.20"
          equals: -28.69796
          tolerance: 0.01
        - expression: "360.69 + 0.0275*(57850-26050)"
          equals: 1235.19
          tolerance: 0.02
    expires_on_source_change: true
    pinned:
      left: 1206.50204
      right: 1235.20
  - id: oh-taxsim-2024-top-bracket-vintage-single-150000
    concept: us-oh:policies/income_tax/pilot_liability_pipeline#oh_pit_pilot_income_tax_liability
    case_id: oh-single-150000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        For the single 150,000-dollar filer two 2024-to-2026 vintage changes
        drive the 455.94-dollar residual: the section 5747.02(A)(3) base amount
        (360.69 in 2024 versus 332.00 in 2026) and Ohio's 2024 law taxing Ohio
        taxable income above 100,000 at a 3.5 per cent top marginal rate that
        House Bill 33 collapsed into the single 2.75 per cent rate by 2026. The
        2024 schedule 360.69 + 0.0275*(100000-26050) + 0.035*(150000-100000) =
        4144.315 reproduces TAXSIM's 4144.32 to the cent; the pipeline reports
        3688.38. Pinned-2024-law-year vintage; the pipeline matches PolicyEngine
        at 2026 to the cent.
      arithmetic:
        - expression: "3688.37704 - 4144.32"
          equals: -455.94296
          tolerance: 0.01
        - expression: "360.69 + 0.0275*(100000-26050) + 0.035*(150000-100000)"
          equals: 4144.315
          tolerance: 0.02
    expires_on_source_change: true
    pinned:
      left: 3688.37704
      right: 4144.32
