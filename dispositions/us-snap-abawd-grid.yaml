entries:
  - id: dependent-child-exception-upstream-placement
    concept: us:regulations/7-cfr/273/24#snap_member_abawd_exception_applies
    case_id: abawd_exception_applies_to_responsible_adult_with_child_under_fourteen
    kind: judgment_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        Architectural placement, not a verdict disagreement. Axiom encodes
        the 2015(o)(3)(C) dependent-child exception (responsibility for a
        dependent child under 14, post-P.L. 119-21) directly inside
        snap_member_abawd_exception_applies, so the child-13 case holds on
        the compared concept. PolicyEngine 1.767.3 deliberately implements
        the same exception one level up: meets_snap_work_requirements_person
        is documented in-source as "the single source of truth for the
        household-child ABAWD exception", routing any member of an SPM unit
        containing a child under the post-HR1 age-14 threshold around the
        ABAWD test entirely, and meets_snap_abawd_work_requirements notes the
        in-formula duplicate "has been removed" as dead code. The ABAWD
        composite therefore stays false on the child-13 case even though
        PolicyEngine applies the exception at the person level. The
        behavioral boundary itself is still cross-checked: the child-14 row
        matches (no exception on that basis for either engine), so the
        13-to-14 flip is pinned on the Axiom side and PolicyEngine's
        dependent age-14 threshold parameter is verified by the generator's
        oracle-parameter check before any verdict is trusted.
      upstream_url: https://github.com/PolicyEngine/policyengine-us/blob/master/policyengine_us/variables/gov/usda/snap/eligibility/work_requirements/meets_snap_work_requirements_person.py
    expires_on_source_change: true
    pinned:
      left: true
      right: false
