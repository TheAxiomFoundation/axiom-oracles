schema: axiom_oracles.dispositions.v1
suite: ut-income-tax-liability
updated: "2026-07-08"
# Utah composed flat-liability pipeline vs PolicyEngine (2026) and TAXSIM (2024)
# on the six-case grid. The pipeline matches PolicyEngine ut_income_tax_before_credits
# exactly on all six cases (a single flat rate on the taxable base), so the
# PolicyEngine leg needs no disposition.
#
# Against TAXSIM's 2024 law year every case diverges for two combined reasons:
# (1) the rate vintage — Utah's flat rate was 4.55 per cent in 2024 and 4.45 per
# cent in 2026 (H.B. 106 of 2025), so TAXSIM's 2024 tax is 0.10 point of taxable
# income higher; and (2) TAXSIM's siitax nets the section 59-10-1018 taxpayer tax
# credit, which this before-credits core excludes and which phases out with
# income (large at low income, zero by ~$150,000). At the high-income cases the
# credit is fully phased out and only the rate vintage remains (a clean
# -0.001 x taxable income). All six residuals are dispositioned below.
entries:
  - id: ut-taxsim-2024-rate-and-credit-single-30000
    concept: us-ut:policies/income_tax/pilot_liability_pipeline#ut_pit_pilot_income_tax_liability
    case_id: ut-single-30000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        The 2026 pipeline reports 1335.00 (before credits) and TAXSIM 2024 reports
        649.52, a positive 685.48-dollar gap (the pipeline is higher). TAXSIM 2024
        applies the 4.55 per cent rate (raising its tax by 30 dollars on 30,000)
        but then nets the section 59-10-1018 taxpayer tax credit (about 715
        dollars at this income) that this before-credits core excludes; the credit
        dominates. The residual is the rate vintage plus the taxpayer-credit scope,
        both documented boundaries of this before-credits core.
      arithmetic:
        - expression: "1335.0 - 649.52"
          equals: 685.48
          tolerance: 0.02
    expires_on_source_change: true
    pinned:
      left: 1335.0
      right: 649.52
  - id: ut-taxsim-2024-rate-and-credit-single-60000
    concept: us-ut:policies/income_tax/pilot_liability_pipeline#ut_pit_pilot_income_tax_liability
    case_id: ut-single-60000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        The 2026 pipeline reports 2670.00 and TAXSIM 2024 reports 2404.52, a
        265.48-dollar gap: the 4.55-vs-4.45 rate vintage (+60 dollars in TAXSIM on
        60,000) net of the partially-phased-out 59-10-1018 taxpayer credit (about
        325 dollars) that this before-credits core excludes.
      arithmetic:
        - expression: "2670.0 - 2404.52"
          equals: 265.48
          tolerance: 0.02
    expires_on_source_change: true
    pinned:
      left: 2670.0
      right: 2404.52
  - id: ut-taxsim-2024-rate-vintage-single-150000
    concept: us-ut:policies/income_tax/pilot_liability_pipeline#ut_pit_pilot_income_tax_liability
    case_id: ut-single-150000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        The 2026 pipeline reports 6675.00 and TAXSIM 2024 reports 6825.00, a
        clean -150.00-dollar gap: at this income the section 59-10-1018 taxpayer
        credit is fully phased out, leaving only the 4.55-vs-4.45 rate vintage
        (150,000 x -0.001 = -150). The residual is exactly the rate vintage.
      arithmetic:
        - expression: "6675.0 - 6825.0"
          equals: -150.0
          tolerance: 0.02
    expires_on_source_change: true
    pinned:
      left: 6675.0
      right: 6825.0
  - id: ut-taxsim-2024-rate-and-credit-married-60000
    concept: us-ut:policies/income_tax/pilot_liability_pipeline#ut_pit_pilot_income_tax_liability
    case_id: ut-married-60000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        The 2026 pipeline reports 2670.00 and TAXSIM 2024 reports 1299.05, a
        1370.95-dollar gap: the rate vintage (+60 dollars in TAXSIM on 60,000) net
        of the larger married section 59-10-1018 taxpayer credit (about 1,431
        dollars) that this before-credits core excludes.
      arithmetic:
        - expression: "2670.0 - 1299.05"
          equals: 1370.95
          tolerance: 0.02
    expires_on_source_change: true
    pinned:
      left: 2670.0
      right: 1299.05
  - id: ut-taxsim-2024-rate-and-credit-married-120000
    concept: us-ut:policies/income_tax/pilot_liability_pipeline#ut_pit_pilot_income_tax_liability
