- id: ut-taxsim-2026-rate-projection-and-credit-scope-single-30000
  concept: us-ut:policies/income_tax/pilot_liability_pipeline#ut_pit_pilot_income_tax_liability
  case_id: ut-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: |-
      Both engines run at the 2026 law year. TAXSIM's 2026 Utah module applies
      a 4.50 per cent flat rate (staxbc = 0.045 x 30,000 = 1,350.00 exactly)
      instead of the enacted section 59-10-104 4.45 per cent the pipeline
      applies (0.0445 x 30,000 = 1,335.00), and its siitax nets a projected
      819.87 section 59-10-1018 taxpayer tax credit that the pipeline's
      before-credits core excludes by design. Residual = rate projection plus
      credit scope: (1,335.00 - 1,350.00) + 819.87 = 804.87. Not a pipeline
      defect; the pipeline matches PolicyEngine at 2026 to the cent on every
      grid case.
    arithmetic:
    - expression: 0.045 * 30000.0
      equals: 1350.0
      tolerance: 0.02
    - expression: 0.0445 * 30000.0
      equals: 1335.0
      tolerance: 0.02
    - expression: (1335.0 - 1350.0) + 819.87
      equals: 804.87
      tolerance: 0.02
  expires_on_source_change: true
  pinned:
    left: 1335.0
    right: 530.13
