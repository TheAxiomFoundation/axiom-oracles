    case_id: be-replacement-income-pit-bun-15k-yem-15k
    kind: amount_difference
    disposition: upstream_engine_gap
    evidence:
      mechanism: >-
        Two named EUROMOD BE_2025 mechanisms close the mixed unemployment and
        wage residual. Function 63 applies the additional Article 147 amount
        without the unemployment-income share used for the base reduction,
        lowering tax by 50.646189266114 EUR after autonomy (ec-jrc issue #25).
        EUROMOD's uncapped 1,504.848888 EUR work-bonus credit instead of the
        1,028.28906 EUR credit on the reduction actually granted lowers it by
        another 476.559828 EUR (the existing issue #12 disposition). Their
        -527.206017266114 EUR sum equals the observed EUROMOD-minus-Axiom
        residual to displayed-float precision.
      arithmetic:
        - expression: "-(163.9032131147541 - 96.41365477338476) * 0.75043"
          equals: -50.64618926611379
          tolerance: 0.000001
        - expression: "1028.28906 - 1504.848888"
          equals: -476.559828
          tolerance: 0.000001
        - expression: "(-(163.9032131147541 - 96.41365477338476) * 0.75043) + (1028.28906 - 1504.848888)"
          equals: -527.20601726611379
          tolerance: 0.000001
