schema: axiom_oracles.dispositions.v1
suite: uk-universal-credit
updated: "2026-11-16"
# Below the benefit cap the composed rulespec-uk Universal Credit award matches
# UKMOD bsauc_s to the penny (single, couple, couple+rent, single+1child, and
# the capital tariff below the limit). The committed report comes from a
# 2026-07-05 run that put every household in one batch, before the adapter ran
# each household on its own and before euromod_constant_overrides existed. Its
# 11 differences fall into four groups:
#
# - Five come from UKMOD's take-up simulation. bsauc_uk pays the award only
#   when a random draw (i_rand_tu) falls within a take-up rate ($ISTU*). This
#   suite switches off BTA_uk and random_uk, which does not stop the draw
#   (InitVars_uk sets it up), and sets no euromod_constant_overrides, so the
#   take-up rates stay below 1.0. A household that draws no claim gets 0 from
#   UKMOD where Axiom computes the entitlement. Ten identical copies of one
#   household in one run received different awards by position, so the
#   committed set of zeros is one realization: at --comparison-batch-size 1
#   (the 2026-07-05 audit) three of the five received the full award and two
#   (earn15000, earn30000) again drew no claim.
# - Four come from the benefit cap. bsauc_s is UKMOD's award before the cap;
#   UKMOD records the cap's reduction in brduc_s, which this suite does not
#   read (uk-benefit-cap-ukmod compares brduc_s and matches on households
#   without children). Axiom's award here is after its cap, so each difference
#   equals UKMOD's pre-cap award less 1,835 (22,020 / 12). All four households
#   have children: UKMOD's cap base il_bencap adds child benefit (bch_s), while
#   the composed pipeline's cap base counts only Universal Credit, so these
#   rows do not test agreement after the cap either.
# - One (earn45000) is an 11.73/month difference whose cause is open. Weekly
#   NIC rounding (about 4-6 a year in uk-worker-nic-ukmod) moves the award by
#   under 0.30/month through the 55% taper, so it does not account for it.
# - One (capital16000) is the exact-16,000 capital boundary: the pipeline ends
#   entitlement at capital >= 16,000, while UKMOD still pays at exactly 16,000.
#
# The classes, ids and pins below stay as first recorded. Changing a class, an
# id or a linked issue rewrites the committed report, whose engine identity
# sits in conformance/legacy-engine-identity.json, a record that only shrinks.
# A fresh run that records its engine identity can reclassify these rows. Until
# then each entry's `display` block words it on the dashboard by what the files
# show: cause `comparison_setup` for the take-up and cap rows, `open` for
# earn45000.
#
# Minimum income floor (added 2026-07-06): the composed pipeline now applies the
# regulation 62 minimum income floor for gainful self-employment, computing the
# floor from the now-grounded regulation 90 thresholds (regulation 4 national
# living wage rate x regulation 88 expected hours x 52 / 12). No self-employed
# MIF case is added to this suite because a deterministic per-case comparison
# against UKMOD is not achievable: a self-employed benefit unit that is entitled
# to a Universal Credit award is gated by the same stochastic bsauc_s take-up
# draw (i_rand_tu) documented above, so its reported award varies by row
# position and neither --comparison-batch-size 1 nor the exposed policy switches
# (BTA_uk, random_uk) force 100% take-up (see
# euromod_issues.json#ukmod-uc-bsauc-takeup-correction and or#170). The MIF is
# instead covered by the hand-verified companion tests in rulespec-uk
# (uk/policies/universal_credit_composed_award_pipeline.test.yaml: below-floor,
# above-floor, couple, and non-gainful cases) and by the regulation 90 module's
# own companion tests, which assert the threshold arithmetic to the penny.
# Setting the take-up rates to 1.0 through euromod_constant_overrides would make
# a self-employed row comparable; add one in that regeneration.
entries:
  # --- UKMOD's take-up simulation: the household drew no claim --------------
  - id: takeup-correction-zeroes-couple-owner
    concept: uk:policies/universal_credit_composed_award_pipeline#uc_pilot_award_amount
    case_id: uk-uc-couple-owner
    kind: amount_difference
    disposition: upstream_engine_gap
    display:
      title: "UKMOD's take-up simulation: couple, home owners"
      cause: comparison_setup
    evidence:
      mechanism: >-
        UKMOD reported £0 because this household drew no claim in UKMOD's
        take-up simulation; this comparison did not set the take-up rates to
        100%. UKMOD decides whether each household claims Universal Credit by
        comparing a random draw with a take-up rate, and switching off its
        take-up policies (BTA_uk and random_uk), as this comparison did, does
        not stop the draw. Axiom computes the entitlement: the couple standard
        allowance of £666.97 a month. The committed run put every household in
        one batch. When a check on 5 July 2026 ran this household on its own,
        UKMOD paid the full £666.97, and ten identical copies of it in one run
        received £666.97 seven times and £0 three times.
      arithmetic:
        - expression: "666.97 - 666.97"
          equals: 0.0
      sources:
        - comparisons/uk-universal-credit-ukmod.yaml
        - axiom_oracles/data/euromod_issues.json#ukmod-uc-bsauc-takeup-correction
    expires_on_source_change: true
    pinned:
      left: 0.0
      right: 666.97
