  # --- Benefit cap: UKMOD's award before the cap --------------------------
  - id: benefit-cap-not-applied-single-2child
    concept: uk:policies/universal_credit_composed_award_pipeline#uc_pilot_award_amount
    case_id: uk-uc-single-2child-renter
    kind: amount_difference
    disposition: upstream_engine_gap
    display:
      title: "UKMOD's award before the cap: single parent, two children, renting"
      cause: comparison_setup
    evidence:
      mechanism: >-
        The UKMOD output this comparison reads gives the Universal Credit award
        before the benefit cap: £1,930.72 a month here. UKMOD records the cap's
        reduction in a separate output, which this comparison does not read.
        Axiom's £1,835.00 is the award after its cap (£22,020 a year divided by
        12), so the £95.72 difference is the part of UKMOD's award above the
        cap. Axiom's cap counts only Universal Credit and leaves out the child
        benefit that UKMOD's counts, so this comparison does not show whether
        the two agree after the cap.
      arithmetic:
        - expression: "1930.72 - 1835.0"
          equals: 95.72
        - expression: "22020 / 12"
          equals: 1835.0
      sources:
