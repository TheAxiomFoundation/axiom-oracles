      right: 1835.0
  - id: benefit-cap-not-applied-couple-3child-renter
    concept: uk:policies/universal_credit_composed_award_pipeline#uc_pilot_award_amount
    case_id: uk-uc-couple-3child-renter
    kind: amount_difference
    disposition: upstream_engine_gap
    evidence:
      mechanism: >-
        The Axiom pipeline caps this couple + three children award at the
        regulation 80A cap (1,835/month). UKMOD does not apply the benefit cap
        and returns the uncapped maximum: couple standard allowance 666.97 +
        first child 351.88 + two subsequent children 2 x 303.94 + rent 1,000 =
        2,626.73/month. Both engines give every child a full element (the
        two-child limit was revoked from 6 April 2026), so the third child adds
        the subsequent-child rate.
      arithmetic:
        - expression: "666.97 + 351.88 + 303.94 + 303.94 + 1000"
          equals: 2626.73
        - expression: "2626.73 - 1835.0"
          equals: 791.73
      sources:
        - axiom_oracles/data/euromod_issues.json#ukmod-uc-benefit-cap-not-applied
    expires_on_source_change: true
    pinned:
      left: 2626.73
      right: 1835.0
  # --- UC net-earnings taper: NIC weekly-rounding residual ------------------
  - id: net-earnings-taper-nic-rounding-earn45000
    concept: uk:policies/universal_credit_composed_award_pipeline#uc_pilot_award_amount
    case_id: uk-uc-couple-2child-renter-earn45000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        Universal Credit tapers net earned income. The Axiom pipeline is
        supplied net-of-tax-and-NIC monthly earnings computed with the annual
        2026-27 formula (45,000 gross less 6,486 income tax and 2,594.40 NIC =
        35,919.60/year = 2,993.30/month), giving a couple award of
        2,222.79 - 0.55 x (2,993.30 - 427) = 811.325/month. UKMOD nets earnings
        through its own tin_uk and tscee_tscse_uk policies, which compute NIC
        week by week on weekly-rounded thresholds, so its net earnings and hence
        its award differ by the same small weekly-rounding residual the
        single-employee NIC suite shows. The residual is 11.73/month.
      arithmetic:
        - expression: "2222.79 - 0.55 * (2993.30 - 427)"
          equals: 811.325
        - expression: "811.3250000000002 - 799.5969047619046"
          equals: 11.728
          tolerance: 0.01
      sources:
        - axiom_oracles/data/euromod_issues.json#ukmod-uc-bsauc-takeup-correction
    expires_on_source_change: true
    pinned:
      left: 799.5969047619046
      right: 811.3250000000002
  # --- Capital upper-limit boundary convention -----------------------------
  - id: capital-upper-limit-boundary-16000
    concept: uk:policies/universal_credit_composed_award_pipeline#uc_pilot_award_amount
    case_id: uk-uc-single-owner-capital16000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        At exactly 16,000 of capital the two engines apply the upper-limit
        boundary differently. The Axiom pipeline ends entitlement when capital
        is greater than or equal to 16,000 (regulation 18 encoded as a
        >= gate), returning nil. UKMOD applies a strict > 16,000 limit, so at
        exactly 16,000 it still pays a tariff-reduced award: the single standard
        allowance 424.90 less tariff income of 4.35 per 250 of the 10,000 of
        capital above the 6,000 floor (40 bands x 4.35 = 174.00) gives
        250.90/month, matching UKMOD's 251.30 within the tariff-band rounding.
        Only the exact-threshold case is affected; capital of 6,000, 6,250 and
        10,000 match on both sides and 20,000 is nil on both.
      arithmetic:
        - expression: "424.90 - (16000 - 6000) / 250 * 4.35"
          equals: 250.90
          tolerance: 0.5
      sources:
        - axiom_oracles/data/euromod_issues.json#ukmod-uc-capital-upper-limit-boundary
    expires_on_source_change: true
    pinned:
      left: 251.29999999999998
      right: 0.0
