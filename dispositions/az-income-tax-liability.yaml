suite: az-income-tax-liability
updated: "2026-07-09"
# Arizona composed flat-liability pipeline vs PolicyEngine (2026) and TAXSIM
# (2024) on the six-case grid. The pipeline matches PolicyEngine az_income_tax to
# the cent on all six cases (the section 43-1011 flat 2.5% tax on Arizona taxable
# income = Arizona AGI less the section 43-1041 standard deduction), so the
# PolicyEngine leg needs no disposition. Against TAXSIM's 2024 law year every case
# diverges by exactly the flat rate times the 2024-to-2026 growth in the
# conformed federal standard deduction: single filers 0.025 * (15,750 - 14,600) =
# 28.75; married-filing-jointly filers 0.025 * (31,500 - 29,200) = 57.50. Arizona
# was already flat 2.5% in 2024, so the entire residual is the standard-deduction
# indexation vintage — no rate or bracket difference — dispositioned below.
entries:
  - id: az-taxsim-2024-standard-deduction-indexation-single-30000
    concept: us-az:policies/income_tax/pilot_liability_pipeline#az_pit_pilot_income_tax_liability
    case_id: az-single-30000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        For the single 30,000-dollar filer the 2026 pipeline reports 356.25 and
        TAXSIM 2024 reports 385.00, a -28.75-dollar gap. Arizona applies the same
        flat 2.5% rate in both years, so the gap is entirely the flat rate on the
        2024-to-2026 growth in the conformed federal standard deduction
        (14,600 single in 2024 to 15,750 in 2026): 0.025 * (15,750 - 14,600) =
        28.75. TAXSIM's narrower 2024 standard deduction leaves more taxable
        income, raising the 2024 tax above the 2026 value; the gap is the
        indexation vintage, not a pipeline defect.
      arithmetic:
        - expression: "356.25 - 385.00"
          equals: -28.75
          tolerance: 0.01
    expires_on_source_change: true
    pinned:
      left: 356.25
      right: 385.0
