- id: az-taxsim-2026-federal-deduction-projection-single-30000
  concept: us-az:policies/income_tax/pilot_liability_pipeline#az_pit_pilot_income_tax_liability
  case_id: az-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: |-
      Both engines run at the 2026 law year and both apply Arizona's flat 2.5
      per cent rate (section 43-1011) to AGI less the conformed federal
      standard deduction. TAXSIM's 2026 module extrapolates that deduction to
      16,222.60 instead of the enacted OBBBA 15,750, so the whole residual is
      the flat rate on the projection drift: 0.025 x 472.60 = -11.81 (TAXSIM
      lower). TAXSIM 2026 projection of the conformed federal deduction, not a
      pipeline defect; the pipeline matches PolicyEngine at 2026 exactly on
      every grid case.
    arithmetic:
    - expression: 0.025 * (30000.0 - 16222.6)
      equals: 344.44
      tolerance: 0.02
    - expression: 0.025 * (30000.0 - 15750)
      equals: 356.25
      tolerance: 0.02
    - expression: 356.25 - 344.44
      equals: 11.81
      tolerance: 0.02
  expires_on_source_change: true
  pinned:
    left: 356.25
    right: 344.44
