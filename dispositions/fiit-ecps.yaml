schema: axiom_oracles.dispositions.v1
suite: fiit-ecps
updated: "2026-07-08"
# Dispositions for the federal income tax comparison (Axiom RuleSpec vs
# PolicyEngine) over the certified pinned Populace artifact
# (populace-us-2024-f0af251, built_with policyengine-us 1.729.0). The oracle is
# pinned to 1.729.0 to match that build; see comparisons/fiit-ecps.yaml for why
# 1.767.3 is not used (it does not resolve EITC and drifts on capital gains).
#
# Four residual signatures, each characterized across ALL rows of the full
# 18,791-mismatch report (not a sample) with an AST-checked arithmetic predicate:
#   eitc                16,660  earned-income-input definition (PE #8614 split)
#   tax_before_credits   2,118  bracket-boundary rounding, |diff| <= $5.83
#   capital_gain             8  float noise, |diff| <= $3.25
#   ctc                      5  excess-AGI phaseout rounding, exactly +$50
# 16,660 + 2,118 + 8 + 5 = 18,791 = every mismatch.
entries:
  # --- EITC earned income (16,660): PE #8614 partnership/S-corp split ----------
  # Axiom's rulespec earned_income (us:statutes/26/32/c/2) treats partnership
  # self-employment income as net earnings from self-employment per 26 USC
  # 32(c)(2)(A)/1402(a) (gross less one-half SE tax) and excludes S-corp
  # distributive share (not SE income). PolicyEngine 1.729.0 predates PE-US #8614
  # ("Split partnership and S-corp income inputs", merged 2026-06-14), which
  # separated those two inputs in eitc_earned_income; before it, PE composed
  # partnership/S-corp income differently from Axiom. This diverges in BOTH
  # directions: 10,008 rows axiom>PE (partnership included by Axiom, omitted by
  # PE 1.729.0) and 6,652 rows axiom<PE (S-corp treated oppositely). Verified on 8
  # tax units against the pinned Populace inputs in phase 1 (PROGRESS.md); the
  # partnership arithmetic below reproduces Axiom's value to the cent. Axiom is
  # statutorily correct; this is an upstream oracle-vintage gap in PE 1.729.0.
  - id: eitc-earned-income-8614-partnership-scorp-split
    concept: us:tax/federal-income-tax#eitc
    case_selector: { case_id_prefix: "ecps-tax_unit_" }
    kind: amount_difference
    disposition: upstream_engine_gap
    evidence:
      mechanism: >-
        eitc_earned_income divergence from the partnership/S-corp earned-income
        input composition that PE-US #8614 (merged 2026-06-14) split and PE
        1.729.0 predates. Axiom includes partnership net earnings from
        self-employment (26 USC 32(c)(2)(A)/1402(a): gross less one-half SE tax)
        and excludes the S-corp distributive share. Population: 16,660 rows,
        10,008 axiom>PE (partnership) and 6,652 axiom<PE (S-corp) — both halves of
        the same #8614 split. Representative partnership unit ecps-tax_unit_154343
        ($126,692 partnership, no other earnings): Axiom eitc_earned_income
        117,741.43 vs PE 0.00.
      arithmetic:
        # Axiom's earned income = gross partnership SE income less one-half SE tax
        # on the 92.35% base: 126692 - 0.5 * (126692 * 0.9235 * 0.153) reproduces
        # 117,741.43 (matches Axiom to $0.07).
        - expression: "126692 - 0.5 * (126692 * 0.9235 * 0.153)"
          equals: 117741.43
          tolerance: 0.5
      sources:
        - PROGRESS.md
    linked_issue: https://github.com/PolicyEngine/policyengine-us/pull/8614
    expires_on_source_change: true

  # --- tax_before_credits (2,118): bracket-boundary rounding ------------------
  # Every one of the 2,118 rows has |diff| <= $5.83 on values up to $2.79M
  # (max relative diff 4.4e-4), bidirectional (1,090 axiom>PE, 1,028 axiom<PE) —
  # the signature of two engines rounding the same rate schedule at bracket
  # boundaries, not a definitional gap.
  - id: tax-before-credits-bracket-rounding
    concept: us:tax/federal-income-tax#tax_before_credits
    case_selector: { case_id_prefix: "ecps-tax_unit_" }
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        Bracket-boundary rounding between the two engines' rate applications.
        Verified across all 2,118 rows: |diff| <= $5.83, max relative diff
        4.4e-4, both signs. Representative ecps-tax_unit_154369: Axiom
        2,789,654.17 vs PE 2,789,660.00, a $5.83 difference on a $2.79M base.
      arithmetic:
        - expression: "2789654.1703 - 2789660.0"
          equals: -5.8297
          tolerance: 0.01
        - expression: "5.8297 / 2789660.0"
          equals: 0.0000020897
          tolerance: 0.0000001
    expires_on_source_change: true

  # --- capital_gain (8): float noise ------------------------------------------
  - id: capital-gain-float-noise
    concept: us:tax/federal-income-tax#capital_gain
    case_selector: { case_id_prefix: "ecps-tax_unit_" }
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        adjusted_net_capital_gain float noise. Verified across all 8 rows: |diff|
        <= $3.25 on values up to $8.37M (max relative diff 5.0e-7).
        Representative ecps-tax_unit_161790: Axiom 6,471,728.75 vs PE
        6,471,732.00.
      arithmetic:
        - expression: "6471728.7516 - 6471732.0"
          equals: -3.2484
          tolerance: 0.01
        - expression: "3.2484 / 6471732.0"
          equals: 0.000000502
          tolerance: 0.00000001
    expires_on_source_change: true

  # --- ctc (5): excess-AGI phaseout rounding ----------------------------------
  # All 5 rows are exactly +$50 = one $1,000 excess-AGI increment x 5% (26 USC
  # 24(b)); the credit is fully phased out on both engines, so the $50 is a
  # rounding difference in the excess-AGI increment count, not a credit-value gap.
  - id: ctc-excess-agi-increment-rounding
    concept: us:tax/federal-income-tax#ctc
    case_selector: { case_id_prefix: "ecps-tax_unit_" }
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        26 USC 24(b) phaseout: the credit reduces by $50 per $1,000 (or fraction)
        of AGI over the threshold. All 5 rows are exactly +$50 = one $1,000
        excess-AGI increment x 5%, a difference of one increment in how each
        engine rounds excess AGI up to the next $1,000. Representative
        ecps-tax_unit_154297: Axiom 13,929,800 vs PE 13,929,750.
      arithmetic:
        - expression: "1000 * 0.05"
          equals: 50.0
          tolerance: 0.001
        - expression: "13929800 - 13929750"
          equals: 50.0
          tolerance: 0.001
    expires_on_source_change: true
