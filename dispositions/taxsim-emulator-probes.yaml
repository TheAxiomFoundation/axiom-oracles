- id: state-zero-sales-tax
  concept: us:tax/federal-income-tax#liability
  kind: amount_difference
  case_id: taxsim-77
  disposition: upstream_engine_gap
  attribution: policyengine
  evidence:
    mechanism: 'The emulator simulated TAXSIM state 0 in Texas, taking a sales-tax deduction that TAXSIM''s
      state 0 does not take. PolicyEngine/policyengine-taxsim PR #1249 (merged 2026-09-26) states: "TAXSIM
      state 0 means ''no state tax'': `taxsimtest` runs no state calculation for the record, so its federal
      return deducts no state or local income or sales tax." It fixes the emulator to match (TAXSIM fiitax
      50165.00 on this record). This probe ran before the fix, on the observed macOS binary.'
    row_arithmetic:
    - expression: difference
      equals: -849.1484375
      tolerance: 1.0e-06
    sources:
    - https://github.com/PolicyEngine/policyengine-taxsim/pull/1249
