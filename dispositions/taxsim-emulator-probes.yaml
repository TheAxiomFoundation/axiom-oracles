- id: state-zero-sales-tax
  concept: us:tax/federal-income-tax#liability
  kind: amount_difference
  case_id: taxsim-77
  disposition: unexplained
  attribution: two_sided
  evidence:
    mechanism: 'Observed native-SALT macOS probe from PR #1204. TAXSIM fiitax is 50165.00 at state 0 and
      49618.30 at Texas, while the emulator is 49315.8515625 on both records. These observations suggest
      a sales-tax-deduction/proxy interaction, but do not establish the legally correct deduction or isolate
      the mechanism. PR #1204 describes the CE suppressed-state Texas proxy. This is bound to the observed
      macOS binary, not the Linux release, and expires on changes to either output.'
    row_arithmetic:
    - expression: difference
      equals: -849.1484375
      tolerance: 1.0e-06
