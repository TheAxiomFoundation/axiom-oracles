  disposition: explained_residual
  evidence:
    mechanism: |-
      The pinned PRD package resolves rule years through 2025 (a 2026 request
      returns the 2025 vintage unchanged; verified in
      adapters/prd/prd_pins.json), so on rows where both engines pay, PRD
      applies the FY2025 maximum allotments and deduction amounts while the
      axiom fy-2026 program applies the FY2026 COLA (for example $536 vs $546
      for a household of two). Every selected row has both engines paying and
      an axiom-minus-PRD residual of at most $30 per month, the COLA band
      across the grid's household sizes. Law-year vintage, not a rules
      disagreement.
