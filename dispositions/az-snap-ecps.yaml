  disposition: axiom_encoding_gap
  evidence:
    mechanism: |-
      The compiled us-az/snap/fy-2026 program's snap_eligible binds
      na_budgetary_unit_is_eligible as an input because its defining module
      (us-az/policies/des/faa5/na-eligibility-and-benefit-determination) is
      absent from the composition's import set. Axiom eligibility therefore
      evaluates false for every Arizona household while every selected
      PolicyEngine household is eligible. Income projection was separately
      ruled out: Arizona-vocabulary income slots map and carry correct values.
      Composition wiring bug, rulespec-us#1116.

      Revalidated after requested-month regeneration with PolicyEngine
      4.18.9 / US 1.767.3 / core 3.30.3. The compiled program still contains
      na_budgetary_unit_is_eligible only as an input, and all 306 selected
      eligibility rows retain the exact false/true signature. The selected
      case set is unchanged from the annualized-period report.
  linked_issue: https://github.com/TheAxiomFoundation/rulespec-us/issues/1116
  expires_on_source_change: true
