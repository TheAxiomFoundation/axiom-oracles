- id: tanf-zero-counterfactual-29825
  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-29825
  kind: amount_difference
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
  evidence:
    mechanism: 'Exact-household requested-month counterfactual on PolicyEngine 4.18.9 / PolicyEngine-US
      1.767.3 / PolicyEngine-Core 3.30.3. The committed comparison adapter replayed over the
      same Case projection reproduces the report pin (Axiom 1467.0 versus January PolicyEngine
      1432.699951171875), and the unmodified direct requested-month simulation reproduces
      the same January value. Forcing the aggregate and state TANF inputs to zero in the direct
      requested-month simulation produces January SNAP 1467.5; its absolute delta from Axiom,
      0.5, is within the unchanged suite tolerance 7.0. The comparison bridge zeroes TANF
      on the Axiom input surface while PolicyEngine computes state TANF endogenously and counts
      it as SNAP unearned income (axiom-oracles#397 counterfactual class). Replay classifier
      record: class=tanf.'
    upstream_url: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
    arithmetic:
    - expression: 1467.5 - 1467.0
      equals: 0.5
      tolerance: 1.0e-06
    sources:
    - dashboard/public/data/axiom-policyengine-ga-snap-ecps.json
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.9(b)(2)(i)
    - https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
    - axiom_oracles/adapters/policyengine/runner.py
  expires_on_source_change: true
  pinned:
    left: 1467.0
    right: 1432.699951171875
    difference: 34.300048828125
