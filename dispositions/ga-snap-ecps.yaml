- id: pe-medical-imputation-counterfactual-30005
  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-30005
  kind: amount_difference
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/362
  evidence:
    mechanism: 'Exact-household requested-month counterfactual on PolicyEngine 4.18.9 / PolicyEngine-US
      1.767.3 / PolicyEngine-Core 3.30.3. The committed comparison adapter replayed over the
      same Case projection reproduces the report pin (Axiom 342.0 versus January PolicyEngine
      453.79998779296875), and the unmodified direct requested-month simulation reproduces
      the same January value. Forcing the endogenously imputed allowable medical expenses
      (health insurance premiums and other medical expenses) to zero in the direct requested-month
      simulation produces January SNAP 342.5; its absolute delta from Axiom, 0.5, is within
      the unchanged suite tolerance 7.0. Axiom receives zero medical-expense input while PolicyEngine
      imputes allowable medical expenses for the elderly/disabled member, feeding an excess
      medical deduction the bridge never projects to Axiom (axiom-oracles#362 class). Replay
      classifier record: class=medical.'
    upstream_url: https://github.com/TheAxiomFoundation/axiom-oracles/issues/362
