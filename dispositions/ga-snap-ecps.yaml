  concept: us:statutes/7/2014/u#snap_benefit
  kind: amount_difference
  case_selector:
    case_ids:
    - ecps-29815
    - ecps-30779
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/435
  evidence:
    mechanism: 'Disability-surface projection asymmetry, the SNAP analogue of the
      ssi-ecps disposition (axiom-oracles#228): the populace projection maps the
      Enhanced CPS is_disabled flag into Axiom''s snap_member_is_elderly_or_disabled
      input (elderly_or_disabled transform in axiom_oracles/data/populace_input_mapping.yaml),
      while PolicyEngine''s SNAP elderly/disabled status (has_usda_elderly_disabled)
      requires receipt of a disability program, which the projected input surface
      zeroes. Axiom therefore applies the elderly/disabled treatment (gross-test
      exemption and uncapped excess-shelter deduction) while PolicyEngine does not.
      Verified per-row on the pinned stack (PolicyEngine 4.18.9 / PolicyEngine-US
      1.767.3 / PolicyEngine-Core 3.30.3): the committed adapter reproduces the
      report values; the direct January simulation shows has_usda_elderly_disabled
      false while the persisted Axiom input surface carries the elderly/disabled
      flag for an under-60 member (2 cases / 2 rows; each benefit residual reconciles
      as 0.3x the net-income gap between the two surfaces within the state''s 30-percent
      rounding).'
    sources:
    - dashboard/public/data/axiom-policyengine-ga-snap-ecps.json
    - axiom_oracles/data/populace_input_mapping.yaml
    - dispositions/ssi-ecps.yaml
    - https://github.com/TheAxiomFoundation/axiom-oracles/issues/228
  expires_on_source_change: true
- id: ga-negative-se-loss-2026-07-30-benefit
