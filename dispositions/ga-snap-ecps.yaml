      \ whose absolute delta from Axiom, 0.0, is within the unchanged suite tolerance 7.0.\
      \ The engines priced different income surfaces (axiom-oracles#397 endogenous-income\
      \ counterfactual family; a dedicated issue for the SSI imputation and for the batch-vs-fallback\
      \ path inconsistency still needs filing)."
