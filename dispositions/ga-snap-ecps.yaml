      FY-2026 parameters while other 2026 months pass (income-limit uprating across
      the October fiscal-year boundary), and Axiom evaluates 2026-01 only. Verified
      per-row on the pinned stack (PolicyEngine 4.18.9 / PolicyEngine-US 1.767.3
      / PolicyEngine-Core 3.30.3): the committed adapter reproduces the annual-aggregated
      True while the direct January simulation returns False on every selected row
      (2 rows; sample ecps-30869 January gross-income-to-poverty ratio 1.3263).
