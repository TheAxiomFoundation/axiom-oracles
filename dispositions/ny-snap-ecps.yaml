- id: se-zero-counterfactual-4830-eligibility
  concept: us:statutes/7/2014/o#snap_eligible
  case_id: ecps-4830
  kind: eligibility_left_only
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/433
  evidence:
    mechanism: 'Exact-household requested-month counterfactual on PolicyEngine 4.18.9
      / PolicyEngine-US 1.767.3 / PolicyEngine-Core 3.30.3. The committed comparison
      adapter replayed over the same Case projection reproduces the report''s eligibility
      pin (Axiom True versus PolicyEngine False). Forcing the self-employment income
      inputs to zero in the direct requested-month simulation flips January PolicyEngine
      eligibility to True, matching Axiom''s persisted verdict, with January SNAP
      89.49993896484375. The engines price different income surfaces for this endogenous
      source (see the matching amount-difference class). Replay classifier record:
      class=self_employment.'
    sources:
    - dashboard/public/data/axiom-policyengine-ny-snap-ecps.json
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.9(b)(2)(i)
    - axiom_oracles/adapters/policyengine/runner.py
  expires_on_source_change: true
  pinned:
    left: true
    right: false
