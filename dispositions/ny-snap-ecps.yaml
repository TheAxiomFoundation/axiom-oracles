    - ecps-71863
    - ecps-73831
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
  evidence:
    mechanism: 'Self-employment loss pass-through: the projection''s flat 0.6 self-employment
      netting (axiom_oracles/data/populace_input_mapping.yaml) passes Enhanced CPS
      self-employment losses through as negative Axiom earned income (sample ecps-5251:
      persisted snap_gross_monthly_earned_income -1873.56), while PolicyEngine floors
      SNAP self-employment income at zero (snap_self_employment_income_after_expense_deduction
      takes max(., 0)). Axiom''s income tests pass on the loss-netted surface and
      it awards a benefit while PolicyEngine remains ineligible or lower. Verified
      per-row on the pinned stack (PolicyEngine 4.18.9 / PolicyEngine-US 1.767.3
      / PolicyEngine-Core 3.30.3): the committed adapter reproduces the report values,
      and every selected row carries a negative Axiom earned-income input while
      the January PolicyEngine earned income is floored at or above zero (7 cases
      / 13 rows). A dedicated tracking issue for the self-employment-loss netting
      in the Populace bridge still needs filing; axiom-oracles#397 documents the
      same unequal-cross-program-input policy problem (same linkage as the fl-snap-ecps
      se-loss-netting class).'
