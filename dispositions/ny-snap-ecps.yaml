    mechanism: 'The comparison''s PolicyEngine eligibility boolean comes from the
      batch output dataset''s calendar-2026 aggregation, which reports eligible
      although the direct requested-month (2026-01) simulation is ineligible for
      January: the household fails the January income eligibility tests under the
      FY-2026 parameters while other 2026 months pass (income-limit uprating across
      the October fiscal-year boundary), and Axiom evaluates 2026-01 only. Verified
      per-row on the pinned stack (PolicyEngine 4.18.9 / PolicyEngine-US 1.767.3
      / PolicyEngine-Core 3.30.3): the committed adapter reproduces the annual-aggregated
      True while the direct January simulation returns False on every selected row
      (6 rows; sample ecps-5400 January gross-income-to-poverty ratio 1.5385). The
      January benefit is zero on both engines, so only the eligibility boolean diverges
      — a harness period-aggregation artifact, not an engine defect.'
    sources:
