- id: ny-bbce-gross-band-snap_eligible
  concept: us:statutes/7/2014/o#snap_eligible
  kind: eligibility_right_only
  case_selector:
    case_ids:
    - ecps-4856
    - ecps-5013
    - ecps-6732
    - ecps-6813
    - ecps-7262
  disposition: axiom_encoding_gap
  evidence:
    mechanism: 'New York''s broad-based categorical eligibility (SNAP 200-percent-class

      state option; PolicyEngine models gross screen x1.3 FPL, x2 for

      elderly/disabled households, at 2026-01 per gov/hhs/tanf/non_cash

      parameters) is not in the composed us-ny/snap/fy-2026 program, which

      applies only the standard federal tests. Every selected row is verified

      per-row against axiom''s persisted output surface: household gross income

      sits inside the band above the federal 130 percent limit the composed

      program applies and at or below the state''s BBCE screen, verified

      against axiom''s own computed gross income and limit. Axiom-side modeling

      boundary, tracked for encoding in rulespec-us#1098. The requested-month

      regeneration preserves all five case identities and their boolean

      left/right values exactly, so the evidence remains current.'
  linked_issue: https://github.com/TheAxiomFoundation/rulespec-us/issues/1098
  expires_on_source_change: true
- id: se-zero-counterfactual-4757
  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-4757
  kind: amount_difference
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/433
  evidence:
    mechanism: 'Exact-household requested-month counterfactual on PolicyEngine 4.18.9
      / PolicyEngine-US 1.767.3 / PolicyEngine-Core 3.30.3. The committed comparison
      adapter replayed over the same Case projection reproduces the report pin (Axiom
      546.0 versus January PolicyEngine 489.8999938964844), and the unmodified direct
      requested-month simulation reproduces the same January value. Forcing the
      self-employment income inputs to zero in the direct requested-month simulation
      produces January SNAP 546.0; its absolute delta from Axiom, 0.0, is within
      the unchanged suite tolerance 7.0. Self-employment income enters the two engines
      on different surfaces (the projection''s flat 0.6 netting versus PolicyEngine''s
      state expense-based treatment), and zeroing it on the PolicyEngine side closes
      the residual. Replay classifier record: class=self_employment.'
    arithmetic:
    - expression: 546.0 - 546.0
      equals: 0.0
      tolerance: 1.0e-06
    sources:
    - dashboard/public/data/axiom-policyengine-ny-snap-ecps.json
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.9(b)(2)(i)
    - axiom_oracles/adapters/policyengine/runner.py
  expires_on_source_change: true
  pinned:
    left: 546.0
    right: 489.8999938964844
    difference: 56.100006103515625
- id: tanf-zero-counterfactual-4814
  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-4814
  kind: amount_difference
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
  evidence:
    mechanism: 'Exact-household requested-month counterfactual on PolicyEngine 4.18.9
      / PolicyEngine-US 1.767.3 / PolicyEngine-Core 3.30.3. The committed comparison
      adapter replayed over the same Case projection reproduces the report pin (Axiom
      1571.0 versus January PolicyEngine 1476.800048828125), and the unmodified
      direct requested-month simulation reproduces the same January value. Forcing
      the aggregate and state TANF inputs to zero in the direct requested-month
      simulation produces January SNAP 1571.0; its absolute delta from Axiom, 0.0,
      is within the unchanged suite tolerance 7.0. The comparison bridge zeroes
      TANF on the Axiom input surface while PolicyEngine computes state TANF endogenously
      and counts it as SNAP unearned income (axiom-oracles#397 counterfactual class).
      Replay classifier record: class=tanf.'
