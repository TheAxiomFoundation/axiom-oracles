- id: va-taxsim-2026-parameter-projection-and-credit-single-30000
  concept: us-va:policies/income_tax/pilot_liability_pipeline#va_pit_pilot_income_tax_liability
  case_id: va-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: |-
      Both engines run at the 2026 law year. TAXSIM's 2026 Virginia module
      extrapolates the section 58.1-322.03 standard deduction to 9,012.56 (the
      enacted amount is 8,750) and the fixed 930-dollar personal exemption to
      a fractional projection (implied combined offset 9,970.46), giving
      staxbc 886.47 against the pipeline's enacted 910.90; its siitax then
      nets a flat 206.00 (206.00 per filer, identical on every grid case) from
      its projected 2026 credit model, which has no enacted analog at these
      incomes. Residual = (910.90 - 886.47) + 206.00 = 230.43. TAXSIM 2026
      parameter projection plus its modeled credit, not a pipeline defect; the
      pipeline matches PolicyEngine at 2026 to the cent on every grid case.
    arithmetic:
    - expression: 886.47 - 206.0
      equals: 680.47
      tolerance: 0.02
    - expression: (910.9 - 886.47) + 206.0
      equals: 230.43
      tolerance: 0.02
  expires_on_source_change: true
  pinned:
    left: 910.9
    right: 680.47
