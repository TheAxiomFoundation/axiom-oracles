schema: axiom_oracles.dispositions.v1
suite: va-income-tax-liability
updated: "2026-07-08"
# Virginia composed progressive-liability pipeline vs PolicyEngine (2026) and
# TAXSIM (2024) on the six-case grid. The pipeline matches PolicyEngine
# va_income_tax_before_non_refundable_credits exactly on all six cases (Virginia
# brackets are statutory fixed amounts, so there is no indexation rounding), so
# the PolicyEngine leg needs no disposition.
#
# Against TAXSIM's 2024 law year every case diverges by a constant per-filer
# amount ($14.38 single, $28.75 married): Virginia raised its section 58.1-322.03
# standard deduction between 2024 and 2026 (from $8,500 to $8,750 single, doubled
# for joint), so TAXSIM's 2024 run applies the smaller deduction, leaving $250
# more taxable income per filer taxed at the 5.75 per cent top marginal rate
# (250 x 0.0575 = 14.375). All six residuals are the 2024-to-2026 standard-
# deduction vintage, dispositioned below.
entries:
  - id: va-taxsim-2024-std-deduction-vintage-single-30000
    concept: us-va:policies/income_tax/pilot_liability_pipeline#va_pit_pilot_income_tax_liability
    case_id: va-single-30000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        The 2026 pipeline reports 910.90 and TAXSIM 2024 reports 925.28, a
        14.38-dollar gap. TAXSIM's 2024 Virginia run uses the smaller 2024 standard
        deduction, leaving 250 dollars more taxable income taxed at the 5.75 per
        cent top rate (250 x 0.0575 = 14.375). The residual is the 2024-to-2026
        standard-deduction vintage, not a pipeline defect.
      arithmetic:
        - expression: "910.9 - 925.28"
          equals: -14.38
          tolerance: 0.02
    expires_on_source_change: true
    pinned:
      left: 910.9
      right: 925.28
  - id: va-taxsim-2024-std-deduction-vintage-single-60000
    concept: us-va:policies/income_tax/pilot_liability_pipeline#va_pit_pilot_income_tax_liability
    case_id: va-single-60000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        The 2026 pipeline reports 2635.90 and TAXSIM 2024 reports 2650.28, the
        same 14.38-dollar single-filer standard-deduction vintage (250 dollars of
        additional 2024 taxable income at the 5.75 per cent top rate).
      arithmetic:
        - expression: "2635.9 - 2650.28"
          equals: -14.38
          tolerance: 0.02
    expires_on_source_change: true
    pinned:
      left: 2635.9
      right: 2650.28
