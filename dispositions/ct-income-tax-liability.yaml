- id: ct-taxsim-2026-threshold-projection-single-30000
  concept: us-ct:policies/income_tax/pilot_liability_pipeline#ct_pit_pilot_income_tax_liability
  case_id: ct-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: |-
      Both engines run at the 2026 law year. TAXSIM's 2026 Connecticut module
      extrapolates the section 12-702 personal exemption, the section
      12-700(b) recapture thresholds, and the section 12-703 personal-credit
      thresholds to projected values: its staxbc is 420.42 against the
      pipeline's enacted 361.25, and its siitax nets a 63.06 section 12-703
      personal credit (about 15 per cent of its before-credit tax) at its
      projected thresholds. Residual = (361.25 - 420.42) + 63.06 = 3.89.
      TAXSIM 2026 threshold projection, not a pipeline defect; the pipeline
      matches PolicyEngine at 2026 to the cent on every grid case.
    arithmetic:
    - expression: 420.42 - 63.06
      equals: 357.36
      tolerance: 0.02
    - expression: (361.25 - 420.42) + 63.06
      equals: 3.89
      tolerance: 0.02
  expires_on_source_change: true
  pinned:
    left: 361.25
    right: 357.36
