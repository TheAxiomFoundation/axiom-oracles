- id: ct-taxsim-2024-vintage-single-30000
  concept: us-ct:policies/income_tax/pilot_liability_pipeline#ct_pit_pilot_income_tax_liability
  case_id: ct-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: TAXSIM runs at its latest 2024 law year. Connecticut indexes the section 12-702 personal exemption and the section 12-703 personal-credit thresholds and applies the section 12-700(b) three-per-cent phase-out recapture; the residual is the 2024-to-2026 vintage of those exemption, credit, and recapture thresholds. The pipeline reports 361.25; TAXSIM 2024 reports 380.38. Vintage, not a pipeline defect; the pipeline matches PolicyEngine ct_income_tax_before_refundable_credits at 2026 to the cent.
    arithmetic:
    - expression: 361.25 - 380.38
      equals: -19.13
      tolerance: 0.01
  expires_on_source_change: true
  pinned:
    left: 361.25
    right: 380.38
