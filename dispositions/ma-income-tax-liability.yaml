- id: ma-taxsim-2026-projected-exemption-single-30000
  concept: us-ma:policies/income_tax/pilot_liability_pipeline#ma_pit_pilot_income_tax_liability
  case_id: ma-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: |-
      Both engines run at the 2026 law year, but TAXSIM's 2026 Massachusetts
      module extrapolates the exempt amount: its implied offset (wages minus
      its own state taxable income v36) is 6,592.04, a fractional CPI-
      projected figure, while the section 3(b) personal exemption is a fixed
      4,400 dollars for this filer plus the up-to-2,000-dollar per-taxpayer
      FICA deduction, giving the pipeline's enacted offset of 6,400. The whole
      residual is the flat 5 per cent rate on the extrapolation drift: 0.05 x
      (6,592.04 - 6,400) = 9.60. TAXSIM 2026-projection drift on a fixed
      statutory amount, not a pipeline defect; the pipeline matches
      PolicyEngine at 2026 to the cent on every grid case.
    arithmetic:
    - expression: 0.05 * (6592.04 - 6400)
      equals: 9.6
      tolerance: 0.02
    - expression: 1180.0 - 1170.4
      equals: 9.6
      tolerance: 0.02
  expires_on_source_change: true
  pinned:
    left: 1180.0
    right: 1170.4
