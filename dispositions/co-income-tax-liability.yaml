    concept: us-co:policies/income_tax/pilot_liability_pipeline#co_pit_pilot_income_tax_liability
    case_id: co-single-30000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        Both legs run at 2026 law. The Axiom target is the flat 4.40 percent section 39-22-104(1.7)(c) base tax on completed Colorado taxable income, scoped before section 39-22-627 temporary rate adjustments and all credits; TAXSIM's siitax models final Colorado liability including its smooth TABOR-style refund estimate and any 627 adjustment. The residual is that documented scope wedge, pinned per case.
      arithmetic:
        - expression: "591.0 - 611.6"
          equals: -20.6
          tolerance: 0.02
    expires_on_source_change: true
    pinned:
      left: 611.6
      right: 591.0
