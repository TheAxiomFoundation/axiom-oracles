# Colorado composed base-tax pipeline vs PolicyEngine and TAXSIM, both at
# 2026. PolicyEngine matches to the cent on all six cases; every TAXSIM
# residual is the documented scope wedge between the before-credit
# 39-22-104(1.7)(c) core and siitax's final-liability model (TABOR-style
# refund, 39-22-627 adjustments).
entries:
