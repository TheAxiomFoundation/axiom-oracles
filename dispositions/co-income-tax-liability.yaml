- id: co-taxsim-2026-projected-tabor-refund-scope-single-30000
  concept: us-co:policies/income_tax/pilot_liability_pipeline#co_pit_pilot_income_tax_liability
  case_id: co-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: |-
      Both engines run at the 2026 law year and TAXSIM's before-credit
      Colorado tax reproduces the pipeline exactly: staxbc = 611.60 equals the
      enacted section 39-22-104(1.7)(c) 4.40 per cent of federal taxable
      income to the cent. The entire residual is the projected 2026 TABOR
      sales-tax refund TAXSIM nets in siitax (20.60 for this case, a
      fractional model projection of the section 39-22-2003 tiered refund),
      which the before-non-refundable-credits concept excludes by design.
      staxbc - 20.60 = 591.00 reproduces TAXSIM exactly. Concept scope on
      TAXSIM's projected refund, not a pipeline defect; the pipeline matches
      PolicyEngine at 2026 to the cent on every grid case.
    arithmetic:
    - expression: 611.6 - 20.6
      equals: 591.0
      tolerance: 0.02
    - expression: 611.6 - 611.6
      equals: 0.0
      tolerance: 0.02
    - expression: 611.6 - 591.0
      equals: 20.6
      tolerance: 0.02
  expires_on_source_change: true
  pinned:
    left: 611.6
    right: 591.0
