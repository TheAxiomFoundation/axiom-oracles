- id: ri-uprating-vintage-flat-deltas
  concept: us-ri:policies/income_tax/pilot_liability_pipeline#ri_pit_pilot_income_tax_liability
  kind: amount_difference
  case_selector:
    case_ids:
    - ri-single-30000
    - ri-single-60000
  disposition: explained_residual
  evidence:
    mechanism: 'Parameter uprating vintage between the legs: the axiom program carries

      FY2026-uprated RI parameters while the oracle leg''s parameter set holds

      the prior vintage, producing income-invariant flat deltas within each

      filing band (the fingerprint: identical differences across the grid''s

      income levels — e.g. Washington''s flat \$163.92 equals the 7 percent

      rate times the \$2,342 capital-gains standard-deduction vintage gap, PE

      278,000 vs axiom''s uprated value). Favors the encoded 2026 truth;

      resolves when the oracle''s parameters uprate.'
    arithmetic:
    - expression: '-13.12'
      equals: -13.12
      tolerance: 0.05
    - expression: '-4.61'
      equals: -4.61
      tolerance: 0.05
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/315
  expires_on_source_change: true
- id: ri-open-rows-axiom-pe-divergent
  concept: us-ri:policies/income_tax/pilot_liability_pipeline#ri_pit_pilot_income_tax_liability
  kind: amount_difference
  case_selector:
    case_ids:
    - ri-married-120000
    - ri-married-300000
    - ri-married-60000
    - ri-single-150000
  disposition: unexplained
  evidence:
    mechanism: 'Documented open investigation - these four rows are exactly the
      Rhode

      Island residuals where the triangulation test FAILS. On every other lane

      in this grid family the axiom value is corroborated by PolicyEngine to the

      cent, which is what licenses attributing the residual to TAXSIM. Here axiom

      and PolicyEngine disagree by 26.25-81.02 (the same 2026 uprating gap the

      ri-pe-2026-uprating-* entries disposition on the PolicyEngine leg of these

      identical cases), so axiom''s own Rhode Island value is not independently

      confirmed and the TAXSIM residual cannot be attributed to TAXSIM. Note

      ri-married-300000 has TAXSIM BELOW axiom (+10.81) while PolicyEngine sits

      above it, so the three legs bracket each other and no two-of-three majority

      exists. These stay unexplained until the rulespec-us companion fixtures are

      regenerated against Rhode Island''s official 2026 indexed amounts, which

      closes the axiom-PolicyEngine gap and makes the triangulation decidable.'
    arithmetic:
    - expression: 5523.13 - 5561.25
      equals: -38.12
      tolerance: 0.05
    - expression: 1016.25 - 1042.50
      equals: -26.25
      tolerance: 0.05
    - expression: 3316.75 - 3371.50
      equals: -54.75
      tolerance: 0.05
    - expression: 14837.52 - 14918.54
      equals: -81.02
      tolerance: 0.05
  expires_on_source_change: true
