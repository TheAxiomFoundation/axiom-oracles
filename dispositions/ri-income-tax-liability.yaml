- id: ri-uprating-vintage-flat-deltas
  concept: us-ri:policies/income_tax/pilot_liability_pipeline#ri_pit_pilot_income_tax_liability
  kind: amount_difference
  case_selector:
    case_ids:
    - ri-single-30000
    - ri-single-60000
  disposition: explained_residual
  evidence:
    mechanism: 'Parameter uprating vintage between the legs: the axiom program carries

      FY2026-uprated RI parameters while the oracle leg''s parameter set holds

      the prior vintage, producing income-invariant flat deltas within each

      filing band (the fingerprint: identical differences across the grid''s

      income levels — e.g. Washington''s flat \$163.92 equals the 7 percent

      rate times the \$2,342 capital-gains standard-deduction vintage gap, PE

      278,000 vs axiom''s uprated value). Favors the encoded 2026 truth;

      resolves when the oracle''s parameters uprate.'
    arithmetic:
    - expression: '-13.12'
      equals: -13.12
      tolerance: 0.05
    - expression: '-4.61'
      equals: -4.61
      tolerance: 0.05
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/315
  expires_on_source_change: true
- id: ri-open-rows-axiom-pe-divergent
  concept: us-ri:policies/income_tax/pilot_liability_pipeline#ri_pit_pilot_income_tax_liability
  kind: amount_difference
  case_selector:
    case_ids:
    - ri-married-120000
    - ri-married-300000
    - ri-married-60000
    - ri-single-150000
  disposition: upstream_engine_gap
  evidence:
    mechanism: 'Resolved by direct statutory verification, replacing the

      triangulation this entry previously waited on: the pinned rulespec

      pilot''s companion fixtures carry the Division of Taxation''s November

      3, 2025 ADV inflation-adjustment advisory for Tax Year 2026 (the

      $82,050 / $186,450 bracket transitions at 3.75/4.75/5.99%, the 2026

      standard deductions, the $5,250 exemption, and the $290,800

      deduction/exemption phase-out top), and axiom reproduces the official

      schedule to the cent on all four rows: single-150000 TI 133,550 ->

      3,076.875 + 0.0475 x 51,500 = 5,523.13; married-60000 TI 27,100 ->

      0.0375 x 27,100 = 1,016.25; married-120000 TI 87,100 -> 3,076.875 +

      0.0475 x 5,050 = 3,316.75; married-300000 fully phased out, TI

      300,000 -> 3,076.875 + 0.0475 x 104,400 + 0.0599 x 113,550 =

      14,837.52. TAXSIM''s implied 2026 deduction/exemption amounts drift

      from the advisory by 65.20 / 245.90 / 188.20 and its phase-out leaves

      180.50 of deductions at 300,000, reproducing each residual exactly:

      0.0475 x 65.20 = 3.10; 0.0375 x 245.90 = 9.22; 0.0475 x 188.20 =

      8.94; 0.0599 x 180.50 = 10.81. A TAXSIM-side parameter vintage

      (its own projection of the 2026 indexed amounts); PolicyEngine''s

      separate uprating lag on the same rows remains dispositioned by the

      ri-pe-2026-uprating-* entries. Resolves when NBER re-bases.'
    arithmetic:
    - expression: 3076.875 + 0.0475 * 51500
      equals: 5523.13
      tolerance: 0.02
    - expression: 3076.875 + 0.0475 * 104400 + 0.0599 * 113550
      equals: 14837.52
      tolerance: 0.02
    - expression: 0.0375 * 245.90
      equals: 9.22
      tolerance: 0.02
    - expression: 0.0599 * 180.50
      equals: 10.81
      tolerance: 0.02
  expires_on_source_change: true
