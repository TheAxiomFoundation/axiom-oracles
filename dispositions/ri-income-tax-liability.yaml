- id: ri-pe-2026-uprating-single-30000
  concept: us-ri:policies/income_tax/pilot_liability_pipeline#ri_pit_pilot_income_tax_liability
  case_id: ri-single-30000
  kind: policyengine_amount_difference
  disposition: axiom_encoding_gap
  evidence:
    mechanism: 'The Axiom leg evaluates the fixtures'' completed Rhode Island taxable
      income, which deducts $350 (single) / $700 (married) more than PolicyEngine''s
      2026-projected standard deduction plus exemption ($10,900 + $5,200 single);
      the residual is exactly that gap at each case''s bracket rates. Rhode Island''s
      official 2026 indexed amounts are not yet reflected by either side. Actionable
      upstream: regenerate the rulespec-us companion fixtures via the encoder once
      official 2026 amounts publish; not fixable in this repo.'
    arithmetic:
    - expression: 521.25 - 508.125
      equals: 13.125
      tolerance: 0.02
  expires_on_source_change: true
  pinned:
    left: 508.125
    right: 521.25
