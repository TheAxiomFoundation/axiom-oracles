entries:
- id: md-taxsim-2024-vintage-single-30000
  concept: us-md:policies/income_tax/pilot_liability_pipeline#md_pit_pilot_income_tax_liability
  case_id: md-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: TAXSIM runs at its latest 2024 law year. Maryland's section 10-105 state rate schedule is unchanged between 2024 and 2026; the residual is the Maryland standard-deduction vintage. The maximum standard deduction is 700 dollars per filer lower in 2024, so 2024 Maryland taxable income and tax are higher by 700 times the number of filers times the case's marginal rate (700 * 0.0475 = 33.25 for a single filer in the 4.75-per-cent bracket). TAXSIM's siitax adds no Maryland county tax for this unspecified-county grid, matching the state-only target. The pipeline reports 1059.0; TAXSIM 2024 reports 1092.25. State-only 2024-law-year vintage, not a pipeline defect; the pipeline matches PolicyEngine md_income_tax_before_refundable_credits at 2026 to the cent.
    arithmetic:
    - expression: 1059.0 - 1092.25
      equals: -33.25
      tolerance: 0.01
  expires_on_source_change: true
  pinned:
    left: 1059.0
    right: 1092.25
