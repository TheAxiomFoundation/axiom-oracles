- id: md-taxsim-2026-parameter-projection-single-30000
  concept: us-md:policies/income_tax/pilot_liability_pipeline#md_pit_pilot_income_tax_liability
  case_id: md-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: |-
      Both engines run at the 2026 law year. Maryland's section 10-105 state
      rate schedule is identical in both engines; TAXSIM's 2026 module
      extrapolates the standard-deduction cap and section 10-211 exemption to
      fractional projected values (implied combined offset 6,746.54 for this
      case), so its taxable income and tax run slightly below the enacted
      computation the pipeline applies. The whole residual is the projected-
      offset drift at the case's marginal rate: 1,059.00 - 1,050.46 = 8.54.
      TAXSIM 2026 parameter projection, not a pipeline defect; the pipeline
      matches PolicyEngine at 2026 to the cent on every grid case.
    arithmetic:
    - expression: 1059.0 - 1050.46
      equals: 8.54
      tolerance: 0.02
  expires_on_source_change: true
  pinned:
    left: 1059.0
    right: 1050.46
