      own CPI-uprated 2029 values, supplied to PolicyEngine as a parameter reform and to the Axiom regulation
      100 module as its limit inputs). With profits above the upper limit, regulation 100 case 2 applies
      and the maximum is the full main-plus-additional amount, as Axiom returns. PolicyEngine''s ni_class_4_maximum
      compares step four with the main-rate Class 4 in float32. Rounding makes the two equal amounts differ,
      so it takes case 1 and returns step four (the main-band amount) alone, dropping the 2% additional
      band from ni_class_4_maximum and ni_class_4.'
