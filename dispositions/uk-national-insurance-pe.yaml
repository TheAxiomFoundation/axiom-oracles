    mechanism: '2028-29: PolicyEngine CPI-uprates the Class 1 primary threshold and upper earnings limit
      (gov.hmrc.national_insurance.class_1.thresholds) from 2028. The government has announced they stay
      at 12,570 / 50,270 until April 2031 (HMRC policy paper, 26 Nov 2025). The Axiom Class 1 pipeline
      derives them from the personal allowance and basic rate limit, frozen at 12,570 / 37,700 through
      2030-31 by FA 2021 s.5 as amended by FA 2026 s.10. Both engines charge the same earnings (PolicyEngine''s
      ni_class_1_income). The PolicyEngine value reproduces the statutory percentages at its uprated thresholds
      (weekly x 52).'
