  evidence:
    mechanism: '2026-27 dual earners (employment plus self-employment; the thresholds agree this year):
      PolicyEngine''s ni_class_4_main and ni_class_4 charge Class 4 on self_employment_income less ni_class_1_employee.
      SSCBA 1992 s.15(1) and Schedule 2 compute Class 4 on the trading profits chargeable to income tax,
      with no deduction for Class 1 contributions, so Axiom charges the full profits. The PolicyEngine
      value reproduces the s.15(3) percentages on (profits - its Class 1 total) exactly. Where the regulation
      100 maximum binds, both engines agree and no row is recorded.'
