schema: axiom_oracles.dispositions.v1
suite: ca-income-tax-liability
updated: '2026-07-13'
# California composed progressive-liability pipeline vs PolicyEngine (2026) and
# TAXSIM (2024) on the six-case grid. The pipeline matches PolicyEngine
# ca_income_tax_before_refundable_credits to the cent on all six cases (the exact
# RTC 17041 bracket tax less the RTC 17054 nonrefundable personal exemption
# credit), so the PolicyEngine leg needs no disposition. Against TAXSIM's 2024
# law year, every case diverges: California indexes its brackets, standard
# deduction, and exemption credit by the California CPI each year (TAXSIM's 2024
# run uses the 2024 schedule), and TAXSIM's siitax additionally nets the
# refundable California EITC that this statutory core excludes. Both are
# indexation-and-scope vintage differences, dispositioned below.
# Re-pinned 2026-07-13: the repo venv realignment (policyengine-taxsim 2.30.0)
# shifted the TAXSIM-2024 CA leg by the updated exemption-credit data; the
# single-30000 case now matches outright and its entry is removed.
entries:
- id: ca-taxsim-2024-bracket-indexation-vintage
  concept: us-ca:policies/income_tax/pilot_liability_pipeline#ca_pit_pilot_income_tax_liability
  case_id: ca-married-300000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: TAXSIM runs at its latest 2024 law year; the 2026 pipeline uses the California
      brackets, standard deduction, and exemption credit carried forward from the Franchise
      Tax Board 2025 published schedule under the section 17041(h) CCPI indexation. For
      the married 300,000-dollar filer the 2026 pipeline reports 19241.60 and TAXSIM 2024
      reports 19656.28, a 414.68-dollar gap. The 2024 brackets are narrower (less inflation
      indexation), so the same taxable income reaches higher marginal rates sooner, raising
      the 2024 tax above the 2026 value; the gap is the two years of bracket indexation,
      not a pipeline defect.
    arithmetic:
    - expression: 19241.6 - 19656.28
      equals: -414.68
      tolerance: 0.01
  expires_on_source_change: true
  pinned:
    left: 19241.6
    right: 19656.28
- id: ca-taxsim-2024-bracket-indexation-vintage-single-60000
  concept: us-ca:policies/income_tax/pilot_liability_pipeline#ca_pit_pilot_income_tax_liability
  case_id: ca-single-60000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: For the single 60,000-dollar filer the 2026 pipeline reports 1602.86 and
      TAXSIM 2024 reports 1696.16, a -93.30-dollar gap. TAXSIM runs at its latest 2024 law
      year with narrower (less inflation-indexed) brackets, so the same taxable income is
      taxed slightly higher in 2024; the gap is the 2024-to- 2026 bracket indexation plus,
      at lower incomes, the refundable California EITC that TAXSIM nets and this statutory
      core excludes.
    arithmetic:
    - expression: 1602.86 - 1696.16
      equals: -93.3
      tolerance: 0.01
  expires_on_source_change: true
  pinned:
    left: 1602.86
    right: 1696.16
