- id: ca-taxsim-2026-projection-and-credit-scope-single-30000
  concept: us-ca:policies/income_tax/pilot_liability_pipeline#ca_pit_pilot_income_tax_liability
  case_id: ca-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: |-
      Both engines run at the 2026 law year. The pipeline's before-refundable-
      credits target nets the enacted section 17054 exemption credit but
      excludes the refundable CalEITC; TAXSIM's siitax nets both its projected
      exemption credit (157.59) and its projected CalEITC (35.64), and its
      2026 module extrapolates the standard deduction and exemption credit to
      fractional projected values (staxbc 368.34). Residual = (216.11 -
      368.34) + 193.23 = 41.00, dominated by the CalEITC scope difference and
      the exemption-credit projection. TAXSIM 2026 projection plus refundable-
      credit scope, not a pipeline defect; the pipeline matches PolicyEngine
      at 2026 to the cent on every grid case.
    arithmetic:
    - expression: 368.34 - 193.23
      equals: 175.11
      tolerance: 0.02
    - expression: (216.11 - 368.34) + 193.23
      equals: 41.0
      tolerance: 0.02
  expires_on_source_change: true
  pinned:
    left: 216.11175341179944
    right: 175.11
