# The canonical Kentucky surface is the KRS 141.020 schedule before allowable
# credits. It matches PolicyEngine's corresponding 2026 pre-credit target on
# every grid case. TAXSIM's 2026 `siitax` results retain a 4 percent marginal
# slope across this grid, while KRS 141.020's 2026 rate is 3.5 percent, and
# `siitax` is an annual-tax surface rather than this narrow pre-credit schedule.
entries:
  - id: ky-taxsim-rate-surface-single-30000
    concept: us-ky:policies/income_tax/2026_krs_141_020_schedule_before_credits#ky_pit_2026_krs_141_020_schedule_before_credits
    case_id: ky-single-30000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        The canonical 2026 KRS 141.020 schedule uses 3.5 percent and reports
        932.956240234375 before credits. TAXSIM `siitax` reports 1065.28 on its
        broader annual-tax surface. Across the grid its result rises by 4 cents
        per additional wage dollar, retaining a 4 percent Kentucky rate vintage;
        this is a TAXSIM rate-and-surface residual, not an Axiom encoding gap.
      arithmetic:
        - expression: "932.956240234375 - 1065.28"
          equals: -132.32375976562503
          tolerance: 0.01
    expires_on_source_change: true
    pinned:
      left: 932.956240234375
      right: 1065.28
