- id: ky-taxsim-2026-unenacted-rate-retention-single-30000
  concept: us-ky:policies/income_tax/pilot_liability_pipeline#ky_pit_pilot_income_tax_liability
  case_id: ky-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: |-
      Both engines run at the 2026 law year, but TAXSIM's 2026 Kentucky module
      retains the 4.0 per cent section 141.020 rate (HB 1 (2025) set the
      enacted 2026 rate to 3.5 per cent) on an extrapolated section 141.081
      standard deduction of 3,368.12 (the enacted amount is 3,344): 0.04 x
      (30,000 - 3,368.12) = 1,065.28 reproduces TAXSIM to the cent, while the
      pipeline's enacted 0.035 x (30,000 - 3,344) = 932.96. The residual is
      the un-enacted rate retention plus deduction projection, not a pipeline
      defect; the pipeline matches PolicyEngine at 2026 to the cent on every
      grid case.
    arithmetic:
    - expression: 0.04 * (30000.0 - 3368.12)
      equals: 1065.28
      tolerance: 0.02
    - expression: 0.035 * (30000.0 - 3344)
      equals: 932.96
      tolerance: 0.02
    - expression: 932.96 - 1065.28
      equals: -132.32
      tolerance: 0.02
  expires_on_source_change: true
  pinned:
    left: 932.95615
    right: 1065.28
