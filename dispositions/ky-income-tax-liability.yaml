- id: ky-taxsim-2024-vintage-single-30000
  concept: us-ky:policies/income_tax/pilot_liability_pipeline#ky_pit_pilot_income_tax_liability
  case_id: ky-single-30000
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: TAXSIM runs at its latest 2024 law year. Kentucky's section 141.020
      flat rate stepped down from 4.0 per cent (2024) to 3.5 per cent (2026) and
      the section 141.081 standard deduction was indexed (3,160 in 2024 to 3,344
      in 2026), so the 2026 tax is lower than TAXSIM's 2024 computation. The 2024
      schedule 0.04*(AGI-3,160) reproduces TAXSIM to the cent. The pipeline reports
      932.96; TAXSIM 2024 reports 1073.60. Pinned-2024-law-year vintage, not a pipeline
      defect; the pipeline matches PolicyEngine at 2026 to the cent.
    arithmetic:
    - expression: 932.95615 - 1073.6
      equals: -140.6438
      tolerance: 0.01
    - expression: 0.04*(30000-3160)
      equals: 1073.6
      tolerance: 0.02
  expires_on_source_change: true
  pinned:
    left: 932.95615
    right: 1073.6
