      PolicyEngine models gross screen x2.0 FPL, x2.0 for elderly/disabled
      households, at 2026-01 per gov/hhs/tanf/non_cash parameters) is not in
      the composed us-ma/snap/fy-2026 program, which applies only the standard
      federal tests. Every selected row is verified per-row against axiom's
      persisted output surface: the household passes axiom's gross test and
      fails only the net-income test, which the state's BBCE waives. Axiom-
      side modeling boundary, tracked for encoding in rulespec-us#1098. The
      post-fix requested-month replay retains all four listed benefit rows and
      their paired eligibility mismatches; each PolicyEngine value moved from
      the annual-average 23.973597208658855 to the January value
      23.84000015258789, PolicyEngine's 8 percent of the January $298
      one-person maximum allotment.
