- id: ma-disability-projection-2026-07-30-benefit-amount
  concept: us:statutes/7/2014/u#snap_benefit
  kind: amount_difference
  case_selector:
    case_ids:
    - ecps-2797
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/435
  evidence:
    mechanism: 'Disability-surface projection asymmetry, the SNAP analogue of the ssi-ecps
      disposition (axiom-oracles#228): the populace projection maps the Enhanced CPS is_disabled
      flag into Axiom''s snap_member_is_elderly_or_disabled input (elderly_or_disabled transform
      in axiom_oracles/data/populace_input_mapping.yaml), while PolicyEngine''s SNAP elderly/disabled
      status (has_usda_elderly_disabled) requires receipt of a disability program, which the
      projected input surface zeroes. Axiom therefore applies the elderly/disabled treatment
      (gross-test exemption and uncapped excess-shelter deduction) while PolicyEngine does
      not. Verified per-row on the pinned stack (PolicyEngine 4.18.9 / PolicyEngine-US 1.767.3
      / PolicyEngine-Core 3.30.3): the committed adapter reproduces the report values; the
      direct January simulation shows has_usda_elderly_disabled false while the persisted
      Axiom input surface carries the elderly/disabled flag for an under-60 member (1 cases
      / 1 rows; each benefit residual reconciles as 0.3x the net-income gap between the two
      surfaces within the state''s 30-percent rounding).'
    sources:
    - dashboard/public/data/axiom-policyengine-ma-snap-ecps.json
    - axiom_oracles/data/populace_input_mapping.yaml
    - dispositions/ssi-ecps.yaml
    - https://github.com/TheAxiomFoundation/axiom-oracles/issues/228
  expires_on_source_change: true
- id: ma-pe-annual-eligibility-aggregation-2026-07-30
  concept: us:statutes/7/2014/o#snap_eligible
  kind: eligibility_right_only
  case_selector:
    case_ids:
    - ecps-2986
  disposition: bridge_artifact
  evidence:
    mechanism: "The comparison's PolicyEngine eligibility boolean comes from the batch output\
      \ dataset's calendar-2026 aggregation, which reports eligible although the direct requested-month\
      \ (2026-01) simulation is ineligible for January: the household fails the January income\
      \ eligibility tests under the FY-2026 parameters while other 2026 months pass (income-limit\
      \ uprating across the October fiscal-year boundary), and Axiom evaluates 2026-01 only.\
      \ Verified per-row on the pinned stack (PolicyEngine 4.18.9 / PolicyEngine-US 1.767.3\
      \ / PolicyEngine-Core 3.30.3): the committed adapter reproduces the annual-aggregated\
      \ True while the direct January simulation returns False on every selected row (1 rows;\
      \ sample ecps-2986 January gross-income-to-poverty ratio 2.043). The January benefit\
      \ is zero on both engines, so only the eligibility boolean diverges \u2014 a harness\
      \ period-aggregation artifact, not an engine defect."
    sources:
    - dashboard/public/data/axiom-policyengine-ma-snap-ecps.json
    - axiom_oracles/adapters/policyengine/runner.py
  expires_on_source_change: true
- id: ma-se-flat-netting-2026-07-30-benefit
  concept: us:statutes/7/2014/u#snap_benefit
  kind: amount_difference
  case_selector:
    case_ids:
    - ecps-2029
    - ecps-2085
    - ecps-2312
    - ecps-2711
    - ecps-2793
    - ecps-2874
    - ecps-2989
    - ecps-3201
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
  evidence:
    mechanism: 'Flat self-employment netting asymmetry: the generic populace projection feeds
      Axiom''s snap_gross_monthly_earned_income with self-employment scaled by 0.6 (axiom_oracles/data/populace_input_mapping.yaml
      documents the 0.6 scale as the oracle''s modeled netting, calibrated against states
      with the 40-percent SNAP self-employment expense deduction), but Massachusetts carries
      gov/usda/snap/income/deductions/self_employment rate 0 with the expense-based method
      in PolicyEngine-US 1.767.3, so PolicyEngine counts gross self-employment while Axiom
      receives 60 percent of it. Verified per-row on the pinned stack (PolicyEngine 4.18.9
      / PolicyEngine-US 1.767.3 / PolicyEngine-Core 3.30.3): the committed adapter reproduces
      the report values, and January PolicyEngine SNAP earned income minus Axiom''s persisted
      earned-income input equals 0.4x monthly self-employment within $1.00 on every selected
      row (8 cases / 8 rows; sample ecps-2029: 2166.25 - 1779.37 = 386.88 = 0.4 x 967.21).
      Benefit residuals reconcile as 0.3x the resulting net-income gap within the 30-percent
      rounding; eligibility flips occur where the gross-self-employment surface fails PolicyEngine''s
      January income tests while the netted Axiom surface passes. A dedicated tracking issue
      for the flat self-employment netting in the Populace bridge still needs filing; axiom-oracles#397
      documents the same unequal-cross-program-input policy problem (same linkage as the fl-snap-ecps
      se-expense-deduction-bridge class).'
    upstream_url: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
    arithmetic:
    - expression: 2166.2529296875 - 1779.37 - 0.4 * 967.2147623697916
      equals: -0.002975260416576475
      tolerance: 1.0e-06
    - expression: 5427.6923828125 - 3256.62 - 0.4 * 5427.6923828125
      equals: -0.004570312500163709
      tolerance: 1.0e-06
    - expression: 1670.05908203125 - 1002.04 - 0.4 * 1670.05908203125
      equals: -0.004550781250031832
      tolerance: 1.0e-06
    sources:
    - dashboard/public/data/axiom-policyengine-ma-snap-ecps.json
    - axiom_oracles/data/populace_input_mapping.yaml
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.11(a)
  expires_on_source_change: true
