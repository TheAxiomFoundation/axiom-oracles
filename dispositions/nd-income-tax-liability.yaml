- id: nd-uprating-vintage-flat-deltas
  concept: us-nd:policies/income_tax/pilot_liability_pipeline#nd_pit_pilot_income_tax_liability
  kind: amount_difference
  case_selector:
    case_ids:
    - nd-married-120000
    - nd-married-300000
  disposition: explained_residual
  evidence:
    mechanism: 'Parameter uprating vintage between the legs: the axiom program carries

      FY2026-uprated ND parameters while the oracle leg''s parameter set holds

      the prior vintage, producing income-invariant flat deltas within each

      filing band (the fingerprint: identical differences across the grid''s

      income levels — e.g. Washington''s flat \$163.92 equals the 7 percent

      rate times the \$2,342 capital-gains standard-deduction vintage gap, PE

      278,000 vs axiom''s uprated value). Favors the encoded 2026 truth;

      resolves when the oracle''s parameters uprate.'
    arithmetic:
    - expression: '-35.59'
      equals: -35.59
      tolerance: 0.05
    - expression: '12.15'
      equals: 12.15
      tolerance: 0.05
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/315
  expires_on_source_change: true
- id: nd-open-rows-axiom-pe-divergent
  concept: us-nd:policies/income_tax/pilot_liability_pipeline#nd_pit_pilot_income_tax_liability
  kind: amount_difference
  case_selector:
    case_ids:
    - nd-single-150000
  disposition: unexplained
  evidence:
    mechanism: 'Documented open investigation - this row is the single North Dakota

      residual where the triangulation test FAILS. axiom and PolicyEngine

      disagree by 21.45 on nd-single-150000 (that axiom-vs-PolicyEngine row is

      separately dispositioned upstream_engine_gap in this same report), so

      axiom''s North Dakota value is not independently corroborated and the

      6.62 TAXSIM residual cannot be attributed to TAXSIM rather than to axiom.

      The other five North Dakota grid rows reconcile or are already classified.

      Stays unexplained until the axiom-PolicyEngine divergence at this grid

      point is closed, which makes the triangulation decidable.'
    arithmetic:
    - expression: 1644.34 - 1665.79
      equals: -21.45
      tolerance: 0.05
  expires_on_source_change: true
