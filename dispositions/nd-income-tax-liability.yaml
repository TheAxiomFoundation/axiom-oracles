- id: nd-uprating-vintage-flat-deltas
  concept: us-nd:policies/income_tax/pilot_liability_pipeline#nd_pit_pilot_income_tax_liability
  kind: amount_difference
  case_selector:
    case_ids:
    - nd-married-120000
    - nd-married-300000
  disposition: explained_residual
  evidence:
    mechanism: 'Parameter uprating vintage between the legs: the axiom program carries

      FY2026-uprated ND parameters while the oracle leg''s parameter set holds

      the prior vintage, producing income-invariant flat deltas within each

      filing band (the fingerprint: identical differences across the grid''s

      income levels — e.g. Washington''s flat \$163.92 equals the 7 percent

      rate times the \$2,342 capital-gains standard-deduction vintage gap, PE

      278,000 vs axiom''s uprated value). Favors the encoded 2026 truth;

      resolves when the oracle''s parameters uprate.'
    arithmetic:
    - expression: '-35.59'
      equals: -35.59
      tolerance: 0.05
    - expression: '12.15'
      equals: 12.15
      tolerance: 0.05
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/315
  expires_on_source_change: true
- id: nd-open-rows-axiom-pe-divergent
  concept: us-nd:policies/income_tax/pilot_liability_pipeline#nd_pit_pilot_income_tax_liability
  kind: amount_difference
  case_selector:
    case_ids:
    - nd-single-150000
  disposition: upstream_engine_gap
  evidence:
    mechanism: 'Resolved by direct statutory verification, replacing the

      triangulation this entry previously waited on: the pinned rulespec

      pilot carries the Tax Commissioner''s OFFICIAL 2026 indexed schedule

      (status official_parameter_source; single 0% bracket top $49,575,

      middle rate 1.95%), and axiom reproduces it to the cent - taxable

      income 150,000 - 16,100 = 133,900, tax 0.0195 x (133,900 - 49,575) =

      1,644.34. The engines'' implied single 0%-bracket tops solve to:

      axiom 49,575 (official), PolicyEngine 48,475 (the 2025 amount, its

      uprating lag separately dispositioned upstream_engine_gap in this

      report), TAXSIM 49,914 (its own inflation projection). The 6.62

      residual is exactly the TAXSIM bracket-vintage difference: 0.0195 x

      (49,914.36 - 49,575) = 6.62. Resolves when NBER re-bases to the

      Commissioner''s published 2026 amounts.'
    arithmetic:
    - expression: 0.0195 * (133900 - 49575)
      equals: 1644.34
      tolerance: 0.02
    - expression: 0.0195 * (49914.36 - 49575)
      equals: 6.62
      tolerance: 0.02
    - expression: 1644.34 - 1665.79
      equals: -21.45
      tolerance: 0.05
  expires_on_source_change: true
