  - id: highwage-cap-binds-vs-article-111-daily-cap-3600
    concept: be:regulations/unemployment/pilot_oracle_pipeline#belgium_unemployment_ordinary_pilot_monthly_payable_amount
    case_id: be-unemployment-single-3600
    kind: amount_difference
    disposition: upstream_engine_gap
    evidence:
      mechanism: >-
        At this prior wage EUROMOD's stylised highwage cap binds: the
        post-uprating prior monthly wage 3798.08 EUR exceeds the 3432.38
        EUR/month highwage cap, so EUROMOD returns 0.65 x 3432.38 = 2231.05 EUR
        and stops rising. The RuleSpec remains at the Article 111 A1
        daily-cap-bound 92.3956 x 0.65 x 26 = 1561.49 EUR. The two engines cap
        at different thresholds (EUROMOD 3432.38 EUR/month vs statutory A1
        92.3956 EUR/day), which is the maximum residual of the sweep.
      arithmetic:
        - expression: "0.65 * 3432.38"
          equals: 2231.047
          tolerance: 0.001
        - expression: "92.3956 * 0.65 * 26"
          equals: 1561.48564
          tolerance: 0.001
        - expression: "0.65 * 3432.38 - 92.3956 * 0.65 * 26"
          equals: 669.56136
          tolerance: 0.001
      sources:
        - axiom_oracles/data/euromod_issues.json#euromod-be-2025-unemployment-simplified-bun-s
    expires_on_source_change: true
    pinned:
      left: 1561.48564
      right: 2231.047
