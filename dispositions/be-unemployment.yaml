entries:
  - id: highwage-cap-vs-article-111-daily-cap-2400
    concept: be:regulations/unemployment/pilot_oracle_pipeline#belgium_unemployment_ordinary_pilot_monthly_payable_amount
    case_id: be-unemployment-single-2400
    kind: amount_difference
    disposition: upstream_engine_gap
    evidence:
      mechanism: >-
        EUROMOD BE_2025 bun_be (PART SIMULATED, shipped off, switched on for
        this hypothetical) computes the ordinary first-month unemployment
        benefit as 0.65 times the post-uprating prior monthly wage, capped only
        by a stylised 3432.38 EUR/month highwage figure. At this prior wage the
        cap does not bind, so EUROMOD returns 0.65 x 2532.05 = 1645.83 EUR
        (bun_s stores this divided by twelve; the oracle bridge annualises it
        back). The source-backed RuleSpec applies the Royal Decree of 25
        November 1991 Article 111 limit A1, which caps the prior DAILY wage at
        92.3956 EUR/day, then the Article 114 first-period 65 percent rate over
        26 compensable days: 92.3956 x 0.65 x 26 = 1561.49 EUR. The rate is
        identical; only the cap basis (stylised monthly highwage vs statutory
        daily A1) differs.
      arithmetic:
        - expression: "0.65 * 2532.0537416666666"
          equals: 1645.834932
          tolerance: 0.001
        - expression: "92.3956 * 0.65 * 26"
          equals: 1561.48564
          tolerance: 0.001
        - expression: "0.65 * 2532.0537416666666 - 92.3956 * 0.65 * 26"
          equals: 84.349292
          tolerance: 0.001
      sources:
        - axiom_oracles/data/euromod_issues.json#euromod-be-2025-unemployment-simplified-bun-s
    expires_on_source_change: true
    pinned:
      left: 1561.48564
      right: 1645.834933

