# New York Tax Law section 601 main tax vs PolicyEngine (2026) and TAXSIM
# (2024) on the six-case grid. The Axiom and PolicyEngine legs deliberately
# exclude section 601(d-5) supplemental tax and credits. TAXSIM siitax remains
# a broader final-tax concept under 2024 law, so all six law-vintage/scope
# residuals are recorded explicitly rather than absorbed by tolerance.
entries:
  - id: ny-taxsim-2024-main-tax-scope-single-30k
    concept: us-ny:policies/income_tax/pilot_liability_pipeline#ny_pit_pilot_main_income_tax
    case_id: ny-single-30000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        The source-backed 2026 section 601 main tax is 1023.40, while TAXSIM
        siitax reports 1045.00 under broader 2024 law. The 21.60-dollar residual
        is a disclosed law-vintage and target-scope difference.
      arithmetic:
        - expression: "1023.40 - 1045.00"
          equals: -21.6
          tolerance: 0.01
    expires_on_source_change: true
    pinned:
      left: 1023.4
      right: 1045.0
