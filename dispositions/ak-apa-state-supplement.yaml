- id: ak-apa-b-individual-total-vs-supplement
  concept: us-ak:policies/dpa/apa/standards/2026/state-supplement-payment-standard#b_individual_apa_payment_standard
  case_id: ak-apa-state-supplement-b_individual_apa_payment_standard
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: >-
      Same-document quantity-definition difference. Axiom's concept is the
      total APA payment standard for code B1E ($1,031); PolicyEngine's
      ak/dpa/ssp/payment_standard stores the state supplement only ($368,
      the whole-dollar amount published in SSA's state assistance table).
      The residual ($663) is the 2026 SSI B Individual standard $662.67
      from the same document plus the $0.33 whole-dollar rounding of the
      supplement (1031 - 662.67 = 368.33, published/stored as 368). Axiom's
      derived b_individual_monthly_state_supplement equals 368.33 versus
      PolicyEngine's 368.
    arithmetic:
    - expression: 1031 - 368
      equals: 663.0
    - expression: 1031 - 662.67 - 368
      equals: 0.33
    upstream_url: http://dpaweb.hss.state.ak.us/POLICY/PDF/APA-Standards.pdf
    sources:
    - dashboard/public/data/axiom-policyengine-ak-apa-state-supplement.json
    - https://www.ssa.gov/policy/docs/progdesc/ssi_st_asst/2011/ak.pdf
  expires_on_source_change: true
  pinned:
    left: 1031.0
    right: 368.0
