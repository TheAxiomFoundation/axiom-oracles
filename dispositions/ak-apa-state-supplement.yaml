- id: ak-apa-a-individual-total-vs-supplement
  concept: us-ak:policies/dpa/apa/standards/2026/state-supplement-payment-standard#a_individual_apa_payment_standard
  case_id: ak-apa-state-supplement-a_individual_apa_payment_standard
  kind: amount_difference
  disposition: explained_residual
  evidence:
    mechanism: >-
      Quantity-definition difference over the same authoritative document
      (Alaska DPA APA Need and Maximum Payment Standards, 1/1/2026). Axiom's
      concept is the total APA payment standard for code A1E ($1,356: federal
      SSI plus state supplement); PolicyEngine's
      gov/states/ak/dpa/ssp/payment_standard stores only the monthly state
      supplementation portion ($362). The residual equals the 2026 SSI A
      Individual payment standard ($994) from the same document. Axiom's own
      derived a_individual_monthly_state_supplement (1356 - 994 = 362) equals
      PolicyEngine's value exactly, so both engines agree on the supplement.
    arithmetic:
    - expression: 1356 - 362
      equals: 994.0
    - expression: 1356 - 994
      equals: 362.0
    upstream_url: http://dpaweb.hss.state.ak.us/POLICY/PDF/APA-Standards.pdf
    sources:
    - dashboard/public/data/axiom-policyengine-ak-apa-state-supplement.json
    - https://www.ssa.gov/policy/docs/progdesc/ssi_st_asst/2011/ak.pdf
  expires_on_source_change: true
  pinned:
    left: 1356.0
    right: 362.0
