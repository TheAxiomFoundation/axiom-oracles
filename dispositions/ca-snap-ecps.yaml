- id: ca-usda-ed-surface-drift-2026-08-07-eligibility
  concept: us:statutes/7/2014/o#snap_eligible
  kind: eligibility_left_only
  case_selector:
    case_ids:
    - ecps-57912
    - ecps-58676
    - ecps-60545
    - ecps-61658
    - ecps-62891
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/435
  evidence:
    mechanism: >-
      Elderly/disabled surface drift in the population bridge: the projection maps the
      composed program's snap_member_is_elderly_or_disabled input from the populace
      demographic surface (age >= 60 OR the survey disabled flag - the elderly_or_disabled
      transform in populace_input_mapping.yaml), while PolicyEngine receives the same
      is_disabled person input but derives its SNAP elderly/disabled status
      (has_usda_elderly_disabled) from USDA-qualifying benefit receipt per 7 CFR 271.2,
      which none of these households have - verified False per-row on the pinned stack
      (PolicyEngine 4.18.9 / PolicyEngine-US 1.767.3 / PolicyEngine-Core 3.30.3).
      Axiom therefore treats each household as elderly/disabled - waiving the 130% gross
      income screen (7 CFR 273.9(a)(2)) and applying the uncapped excess-shelter deduction
      plus the $663 CalFresh heating/cooling SUA - so the net-income test passes on these
      very-high-shelter households and a benefit pays, while PolicyEngine applies the
      standard gross screen at January earned income 3,550.99-4,556.71/month and reports
      ineligible (meets_snap_gross_income_test False; committed False/0.0 reproduced
      exactly on the committed batch path: full 7,101-case CA replay, batches of 5,000,
      request list exactly [snap, is_snap_eligible]). The engines received materially
      different elderly/disabled surfaces from the harness - a population-bridge input
      artifact, not an engine or encoding defect (Axiom's arithmetic on the fed surface
      reconciles to the dollar; see the companion benefit class). A dedicated tracking
      issue for the elderly/disabled-surface netting in the Populace bridge still needs
      filing.
    sources:
    - dashboard/public/data/axiom-policyengine-ca-snap-ecps.json
    - axiom_oracles/data/populace_input_mapping.yaml
    - axiom_oracles/adapters/policyengine/runner.py
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-271
  expires_on_source_change: true
- id: ca-usda-ed-surface-drift-2026-08-07-benefit
  concept: us:statutes/7/2014/u#snap_benefit
  kind: amount_difference
  case_selector:
    case_ids:
    - ecps-57912
    - ecps-58676
    - ecps-60545
    - ecps-61658
    - ecps-62891
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/435
  evidence:
    mechanism: >-
      Companion benefit rows of ca-usda-ed-surface-drift-2026-08-07-eligibility: Axiom
      pays 24-612 while PolicyEngine reports 0.0 (ineligible under the gross screen it
      applies because has_usda_elderly_disabled is False on its benefit-receipt surface).
      Axiom's committed value reconciles to the dollar for every selected row from the
      projected surface alone: monthly earned = wages/12 (no self-employment facts on any
      selected case), 20% earned deduction, standard deduction by unit size (209/223/261),
      shelter = rent/12 + $663 CalFresh SUA with the elderly/disabled UNCAPPED excess-shelter
      deduction, benefit = max_allotment - 0.3 x net rounded down (ecps-57912 33, ecps-61658
      298 at net 0, ecps-60545 147, ecps-62891 612, ecps-58676 24 = the rounded $24 minimum
      allotment for a 1-person unit whose raw computation goes negative but whose net income
      passes the 100% FPL net test). Arithmetic below shows the ecps-57912 and ecps-62891
      chains (floor of 33.683 -> 33; floor of 612.758 -> 612) and the January gross income
      PolicyEngine screens (3,648.20 for ecps-57912). Committed PolicyEngine zeros reproduce
      exactly on the pinned stack via the committed batch path. Same bridge-input class as
      the eligibility entry; not an Axiom encoding defect.
    arithmetic:
    - expression: (3644.37 + 3.84 - 0.2*3644.37 - 209) - (30257.379/12 + 663 - (3644.37
        + 3.84 - 0.2*3644.37 - 209)/2)
      equals: 881.056
    - expression: 298 - 0.3*881.056
      equals: 33.683
    - expression: (4191.02 + 948.99 - 0.2*4191.02 - 261) - (41968.82/12 + 663 - (4191.02
        + 948.99 - 0.2*4191.02 - 261)/2)
      equals: 1900.807
    - expression: 1183 - 0.3*1900.807
      equals: 612.758
    - expression: 43732.4/12 + 46.04/12
