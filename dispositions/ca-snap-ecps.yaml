  disposition: axiom_encoding_gap
  evidence:
    mechanism: |-
      California's broad-based categorical eligibility (MPP 63-301.7, the SNAP
      200-percent state option) screens CalFresh at 200 percent FPL gross and
      waives the net-income and asset tests; the composed us-ca/snap/fy-2026
      program applies only the standard federal tests (130 percent gross, 100
      percent net, asset limit). Every selected row is verified per-row
      against axiom's own computed outputs: either household gross income sits
      inside the (130 percent, 200 percent] band axiom rejects and BBCE
      accepts, or the household passes axiom's gross test and fails only the
      net or asset test that BBCE waives. Axiom-side modeling boundary,
      tracked for encoding in rulespec-us#1098.
  linked_issue: https://github.com/TheAxiomFoundation/rulespec-us/issues/1098
  expires_on_source_change: true
