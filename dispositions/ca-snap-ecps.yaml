- id: ca-362-disability-shelter-cap-ecps-56995-benefit
  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-56995
  kind: amount_difference
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/362
  evidence:
    upstream_url: https://github.com/TheAxiomFoundation/axiom-oracles/issues/362
    mechanism: 'Exact-household bridge counterfactual. Every member is under 60 and live PE reports no
      USDA elderly/disabled member, but Axiom''s generic DISABLED projection uncaps a shelter deduction
      above $744. Applying the statutory nonelderly cap and direct January parameters gives net 319.19000000000005
      and benefit 202.0, versus January PE 202.60000610351562 (delta -0.600006103515625). Requested-month
      replay reproduces the current January result eligible=True, SNAP=202.60000610351562. The pin changed
      from {''left'': 298.0, ''right'': 205.91998291015625, ''difference'': 92.08001708984375} to {''left'':
      298.0, ''right'': 202.60000610351562, ''difference'': 95.39999389648438} (material movement). Requested-month
      audit trace SHA-256 c46af9b87c8f5ad01f1909bc45e80e00b4c4a50e5b802ea4ccbe194b5954b568; class=disability_shelter_cap;
      material pin movement=true.'
    arithmetic:
    - expression: 202.0 - 202.60000610351562
      equals: -0.600006103515625
      tolerance: 1.0e-07
    sources:
    - dashboard/public/data/axiom-policyengine-ca-snap-ecps.json
    - axiom_oracles/data/populace_input_mapping.yaml
    - scripts/trace_ca_snap_residuals.py
    - https://github.com/TheAxiomFoundation/axiom-oracles/issues/362
    - https://github.com/TheAxiomFoundation/axiom-oracles/pull/416
