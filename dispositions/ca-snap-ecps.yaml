- id: ca-362-self-employment-ecps-56910-benefit
  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-56910
  kind: amount_difference
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/362
  evidence:
    upstream_url: https://github.com/TheAxiomFoundation/axiom-oracles/issues/362
    mechanism: Exact-household live bridge counterfactual on PE 4.18.9 / PE-US 1.767.3 / Core 3.30.3.
      The live annual bridge reproduces the pinned PE amount exactly. PE carries annual self-employment
      32065.134765625 while Axiom earned input 0 monthly equals PE wages/12. Counterfactual annual_zero_self_employment
      keeps eligibility at True and gives SNAP 299.66998291015625 versus Axiom 298.0 (delta 1.66998291015625),
      within the $7 suite tolerance.
    arithmetic:
    - expression: 299.66998291015625 - 298.0
      equals: 1.66998291015625
      tolerance: 1.0e-07
    sources:
    - dashboard/public/data/axiom-policyengine-ca-snap-ecps.json
    - scripts/trace_ca_snap_residuals.py
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.9(b)
    - https://github.com/TheAxiomFoundation/axiom-oracles/commit/4b4e34c155809a8d6010545b0bb8c54a86a97d93
  expires_on_source_change: true
  pinned:
    left: 298.0
    right: 42.79496765136719
    difference: 255.2050323486328
- id: ca-362-self-employment-forward-ecps-56920-eligibility
  concept: us:statutes/7/2014/o#snap_eligible
  case_id: ecps-56920
  kind: eligibility_left_only
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/362
  evidence:
    upstream_url: https://github.com/TheAxiomFoundation/axiom-oracles/issues/362
    mechanism: Exact-household Axiom-side counterfactual. The committed bridge gave Axiom monthly earned
      income 1913.29 from wages alone while live PE-US 1.767.3 carries annual self-employment income 75153.6640625.
      Applying the landed 4b4e34c1 projection (60 percent of gross self-employment) makes Axiom net income
      4314.16, above its net limit 2680.0 by 1634.1599999999999. Corrected Axiom eligibility and benefit
      are therefore false/$0, exactly the pinned PolicyEngine result.
    arithmetic:
    - expression: 4314.16 - 2680.0
      equals: 1634.1599999999999
      tolerance: 1.0e-07
    sources:
    - dashboard/public/data/axiom-policyengine-ca-snap-ecps.json
    - scripts/trace_ca_snap_residuals.py
