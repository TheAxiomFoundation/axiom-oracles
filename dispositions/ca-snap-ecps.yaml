- id: ca-362-pe-student-earnings-ecps-57065-eligibility
  concept: us:statutes/7/2014/o#snap_eligible
  case_id: ecps-57065
  kind: eligibility_right_only
  disposition: upstream_engine_gap
  linked_issue: https://github.com/PolicyEngine/policyengine-us/issues/9157
  evidence:
    upstream_url: https://github.com/PolicyEngine/policyengine-us/issues/9157
    mechanism: 'Live minimal repro on PE 4.18.9 / PE-US 1.767.3 / Core 3.30.3. The household ages are
      [17, 16] and annual employment is 434055.03125, but PE SNAP earned income is 0.0. Axiom receives
      the same wages as 36171.25 monthly, counts them, fails the income gate, and returns false/$0. PE
      excludes K-12 earnings without the required co-resident-parent or parental-control condition; the
      exact pinned PE result remains eligible/positive. Requested-month replay reproduces the current
      January result eligible=True, SNAP=407.70001220703125. The pin changed from {''left'': False, ''right'':
      True} to {''left'': False, ''right'': True} (unchanged). Requested-month audit trace SHA-256 c46af9b87c8f5ad01f1909bc45e80e00b4c4a50e5b802ea4ccbe194b5954b568;
      class=pe_student_earnings; material pin movement=false.'
    arithmetic:
    - expression: 434055.03125 / 12 - 36171.25
      equals: 0.0026041666642413475
      tolerance: 1.0e-07
    sources:
    - dashboard/public/data/axiom-policyengine-ca-snap-ecps.json
    - scripts/trace_ca_snap_residuals.py
