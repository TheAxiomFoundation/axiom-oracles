  evidence:
    mechanism: 'The California BBCE/MCE encode is present in rulespec-us and the composed
      CalFresh eligibility route depends on calfresh_mce_status_conferred, but the populace
      projection supplies neither household_was_issued_pub_275 nor household_has_online_access_to_pub_275;
      the generic projector defaults both unmapped Judgment inputs to false, so MCE status
      and its resource and net-ceiling waivers remain false and these households stay on the
      standard income/resource route (same population-input bridge class as ca-bbce-pub275-bridge-*).
      PolicyEngine models the state option via gov/hhs/tanf/non_cash (gross screen x2.0 FPL).
      Every selected row was verified per-row on the pinned stack (PolicyEngine 4.18.9 / PolicyEngine-US
      1.767.3 / PolicyEngine-Core 3.30.3): the committed comparison adapter reproduces the
      report values, and the direct January 2026 simulation grants PolicyEngine eligibility
      only via meets_snap_categorical_eligibility while the household fails the standard gross/net
      test(s) the composed program applies. 7 cases / 14 rows in this tail selection; sample
      ecps-58497 has January gross-income-to-poverty ratio 1.471 against the federal 1.3 screen
      (elderly/disabled per PolicyEngine: False).'
