  disposition: upstream_engine_gap
  attribution: taxsim
  evidence:
    mechanism: 'Daniel Feenberg (@feenberg), 2026-09-24: "it did demonstrate an error that was present
      in 2000-2023. I believe I have corrected it corrected now." The issue concerns AddMed included in
      fiitax. The recorded emulator has no addmed output (null); we do not impute that missing output
      as zero. The checked identity uses TAXSIM''s addmed and the documented fiitax convention in #1225
      / emulator PR #1239. NIIT agrees within half a cent; the liability gap equals minus TAXSIM AddMed
      within $1 on every selected row.'
    row_arithmetic:
    - expression: right_aux.niit - left_aux.niit
      equals: 0
      tolerance: 0.005
    - expression: difference + right_aux.addmed
      equals: 0
      tolerance: 1
    sources:
    - https://github.com/PolicyEngine/policyengine-taxsim/issues/1225#issuecomment-5820033668
    - https://github.com/PolicyEngine/policyengine-taxsim/pull/1239
  linked_issue: https://github.com/PolicyEngine/policyengine-taxsim/issues/1225
  expires_on_source_change: true
  selector_binding:
    units: 478
    rows_sha256: 12ab7424523109f26f29ebc8c3912684814f69b6b00b59d0f7509951cc52b360
  oracle_binding:
    taxsim_binary_sha256:
    - 8aa880aeea33fd501f669d42125615e3b2a0ab19c17d93a76457e9de16615059
- id: niit-scorp
  concept: us:tax/federal-income-tax#liability
  kind: amount_difference
  case_selector:
    case_ids:
    - taxsim-111170
    - taxsim-111367
    - taxsim-111446
  disposition: explained_residual
  attribution: input
  evidence:
    mechanism: 'NBER taxsimtest input 25 documents "scorp Passive business income not subject to FICA,
      SSTB, SECA or QBID phaseout but subject to the passive loss limitation." NBER taxsim35 input 31
      instead documents "scorp Active S-Corp income (is SSTB)." Both pages were checked 2026-09-25. Pavel
      Makarchuk (@PavelMakarchuk), 2026-07-05, #1053: "This depends on what `taxsimtest` assumes about
      material participation for S-corp income." #1053 documents the open NIIT question; draft PR #1199
      is not a settled correction. On every selected row the liability gap lies in NIIT within $1, and
      TAXSIM''s NIIT exceeds the emulator''s by 3.8% of scorp within $1: the effect of counting scorp
      as passive net investment income under 26 U.S.C. 1411(a)(1) while neither NIIT is at the MAGI limit.
      This records the documented active/passive input ambiguity; it does not adjudicate which treatment
      is legally correct.'
    row_arithmetic:
    - &id001
      expression: difference + right_aux.niit - left_aux.niit
      equals: 0
      tolerance: 1
    - &id002
      expression: facts.scorp / facts.scorp
      equals: 1
      tolerance: 0
    - &id003
      expression: right_aux.addmed
      equals: 0
      tolerance: 0
    - expression: right_aux.niit - left_aux.niit - 0.038 * facts.scorp
      equals: 0
      tolerance: 1
    sources:
    - https://taxsim.nber.org/taxsimtest/
    - https://taxsim.nber.org/taxsim35/
    - https://www.law.cornell.edu/uscode/text/26/1411
