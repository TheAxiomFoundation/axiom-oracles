  disposition: unexplained
  attribution: two_sided
  evidence:
    mechanism: 'NBER taxsimtest input 25 documents "scorp Passive business income not subject to FICA,
      SSTB, SECA or QBID phaseout but subject to the passive loss limitation." NBER taxsim35 input 31
      instead documents "scorp Active S-Corp income (is SSTB)." Both pages were checked 2026-09-25. Pavel
      Makarchuk (@PavelMakarchuk), 2026-07-05, #1053: "This depends on what `taxsimtest` assumes about
      material participation for S-corp income." #1053 documents the open NIIT question; draft PR #1199
      is not a settled correction. Daniel Feenberg (@feenberg), 2026-09-24: "it did demonstrate an error
      that was present in 2000-2023. I believe I have corrected it corrected now." The issue concerns
      AddMed included in fiitax. The recorded emulator has no addmed output (null); we do not impute that
      missing output as zero. The checked identity uses TAXSIM''s addmed and the documented fiitax convention
      in #1225 / emulator PR #1239. Both NIIT and AddMed enter the reconciled liability identity. The
      AddMed acknowledgment does not resolve the NIIT question; this mixed class remains unexplained.
      The identity locates the difference, not legal correctness.'
    row_arithmetic:
    - expression: difference + right_aux.niit - left_aux.niit + right_aux.addmed
      equals: 0
      tolerance: 1
    - *id002
    sources:
