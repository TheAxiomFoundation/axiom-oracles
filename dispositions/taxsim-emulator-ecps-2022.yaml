  disposition: explained_residual
  attribution: input
  evidence:
    mechanism: 'NBER taxsimtest input 25 documents "scorp Passive business income not subject to FICA,
      SSTB, SECA or QBID phaseout but subject to the passive loss limitation." NBER taxsim35 input 31
      instead documents "scorp Active S-Corp income (is SSTB)." Both pages were checked 2026-09-25. Pavel
      Makarchuk (@PavelMakarchuk), 2026-07-05, #1053: "This depends on what `taxsimtest` assumes about
      material participation for S-corp income." #1053 documents the open NIIT question; draft PR #1199
      is not a settled correction. On every selected row the liability gap lies in NIIT within $1; AGI
      agrees within $1; TAXSIM''s NIIT equals 3.8% of AGI over the $200,000 threshold for mstat 1 within
      $1 (the 26 U.S.C. 1411(a)(1)(B) limit); and the emulator''s NIIT is below that limit while its implied
      net investment income plus scorp reaches it (checked by the recipe and tests/test_taxsim_emulator_dispositions.py).
      Counting scorp as passive therefore moves NIIT to the limit. This assumes the engines agree on the
      other net investment income; it records the documented input ambiguity, not which treatment is right.'
    row_arithmetic:
    - *id001
    - *id002
    - *id003
    - expression: facts.mstat
      equals: 1
      tolerance: 0
    - expression: left_aux.v10 - right_aux.v10
      equals: 0
      tolerance: 1
    - expression: right_aux.niit - 0.038 * (right_aux.v10 - 200000)
      equals: 0
      tolerance: 1
    sources:
    - https://taxsim.nber.org/taxsimtest/
    - https://taxsim.nber.org/taxsim35/
    - https://www.law.cornell.edu/uscode/text/26/1411
