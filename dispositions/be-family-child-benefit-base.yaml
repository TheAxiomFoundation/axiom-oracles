entries:
  - id: german-speaking-community-missing-bch-branch
    concept: be:statutes/family_benefits/child_benefit_base_2025#belgium_family_benefits_child_benefit_base_2025_annual_amount
    case_selector:
      case_id_prefix: be-family-child-benefit-base-german-speaking-community-
    kind: amount_difference
    disposition: upstream_engine_gap
    evidence:
      mechanism: >-
        EUROMOD BE_2025 bch_be returns zero for synthetic German-speaking
        Community rows coded drgn1=4; the BE.xml child-benefit policy has
        drgn1 branches only for Brussels (1), Flanders (2), and Wallonia (3),
        which all match exactly in the same suite. The source-backed RuleSpec
        pays the DG decree amounts: Article 8 base of 157 EUR/month plus the
        Article 117 paragraph 4 annual supplement of 62.55 EUR for 2025 under
        the 2025-2027 index freeze. Verified deterministic (2026-07-05 batch-
        size-1 audit): the DG zero persists at --comparison-batch-size 1 and is
        byte-stable across ten identical DG households in one run (all 0.0),
        while the Brussels control pays bch_s=2262.99 in isolation — so this is
        a genuine regional coverage gap, not batch-position contamination.
      arithmetic:
        - expression: "157 * 12 + 62.55"
          equals: 1946.55
      upstream_url: https://github.com/ec-jrc/JRC-EUROMOD-software-source-code/issues/8
      sources:
        - axiom_oracles/data/euromod_issues.json#euromod-be-2025-dg-child-benefit-zero
    linked_issue: https://github.com/ec-jrc/JRC-EUROMOD-software-source-code/issues/8
    expires_on_source_change: true
