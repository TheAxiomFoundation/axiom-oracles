entries:
  - id: work-bonus-credit-uncapped-ab-bases-10k
    concept: be:statutes/income_tax/individual/pilot_worker_oracle_pipeline#belgium_pit_pilot_article_289ter1_low_wage_work_bonus_credit
    case_id: be-work-bonus-credit-10k
    kind: amount_difference
    disposition: upstream_engine_gap
    evidence:
      mechanism: >-
        EUROMOD BE_2025 tinfe_be computes the refundable Article 289ter/1
        low-wage work-bonus tax credit (tintcly_s) from the pre-cap scheduled
        i_tsceerdA_s and i_tsceerdB_s amounts, while CIR 92 Article 289ter/1
        bases the credit on the work-bonus reductions actually granted, so the
        source-backed RuleSpec caps the A/B credit bases by the Article 38
        personal contribution before reductions. At the 10k low-wage case
        EUROMOD returns the uncapped 1504.85 EUR ceiling while the granted-base
        RuleSpec returns 724.48 EUR; the 780.37 EUR gap is the uncapped-versus-
        granted base difference. The 30k and 45k cases sit above the low-wage
        band where the bases coincide and match within tolerance.
      arithmetic:
        - expression: "1504.848888 - 724.481556"
          equals: 780.367332
          tolerance: 0.001
      upstream_url: https://github.com/ec-jrc/JRC-EUROMOD-software-source-code/issues/12
      sources:
        - axiom_oracles/data/euromod_issues.json#euromod-be-2025-pit-work-bonus-credit-uncapped-ab
    linked_issue: https://github.com/ec-jrc/JRC-EUROMOD-software-source-code/issues/12
    expires_on_source_change: true
    pinned:
      left: 1504.848888
      right: 724.481556
  - id: work-bonus-credit-uncapped-ab-bases-14k
    concept: be:statutes/income_tax/individual/pilot_worker_oracle_pipeline#belgium_pit_pilot_article_289ter1_low_wage_work_bonus_credit
    case_id: be-work-bonus-credit-14k
    kind: amount_difference
    disposition: upstream_engine_gap
    evidence:
      mechanism: >-
        Same ec-jrc issue #12 mechanism as the 10k case: EUROMOD BE_2025
        tinfe_be bases tintcly_s on the uncapped i_tsceerdA_s / i_tsceerdB_s
        schedule and returns the 1504.85 EUR ceiling, while the RuleSpec caps
        the A/B credit bases by the Article 38 personal contribution actually
        granted and returns 1014.27 EUR. The 490.57 EUR gap is the uncapped-
        versus-granted base difference at this still-low-wage point.
      arithmetic:
        - expression: "1504.848888 - 1014.274179"
          equals: 490.574709
          tolerance: 0.001
      upstream_url: https://github.com/ec-jrc/JRC-EUROMOD-software-source-code/issues/12
      sources:
        - axiom_oracles/data/euromod_issues.json#euromod-be-2025-pit-work-bonus-credit-uncapped-ab
    linked_issue: https://github.com/ec-jrc/JRC-EUROMOD-software-source-code/issues/12
    expires_on_source_change: true
    pinned:
      left: 1504.848888
      right: 1014.274179
