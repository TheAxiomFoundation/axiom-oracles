entries:
  - id: work-bonus-january-2025-timing
    concept: be:regulations/social_security/workers/work_bonus#belgium_worker_work_bonus_full_year_equal_monthly_total_reduction
    case_id: be-worker-ssc-30k
    kind: amount_difference
    disposition: upstream_engine_gap
    evidence:
      mechanism: >-
        EUROMOD BE_2025 applies the February-through-December 2025 ONSS
        worker work-bonus table to all 12 months of the full-year
        equal-month case, while the statutory RuleSpec applies the separate
        January 2025 table for one month and the February table for 11
        months. The gross 13.07 percent Article 38 contribution before
        reductions matches exactly; only the reduction timing differs. The
        2026-07-05 rerun (axiom-oracles#125) measures the residual at
        EUROMOD's post-uprating gross of 31,650.67 EUR, where it is
        17.11 EUR; the ledger entry records the same issue at the raw
        30,000 EUR gross, where it was 11.65 EUR.
      arithmetic:
        - expression: "3079.481497604077 - 3062.37"
          equals: 17.111498
          tolerance: 0.001
      upstream_url: https://github.com/ec-jrc/JRC-EUROMOD-software-source-code/issues/5
      sources:
        - axiom_oracles/data/euromod_issues.json#euromod-be-2025-work-bonus-january-timing
    linked_issue: https://github.com/ec-jrc/JRC-EUROMOD-software-source-code/issues/5
    expires_on_source_change: true
    pinned:
      left: 3079.481498
      right: 3062.37

  - id: net-contribution-downstream-of-work-bonus-timing
    concept: be:regulations/social_security/workers/employee_contributions#belgium_employee_social_security_ordinary_worker_contribution
    case_id: be-worker-ssc-30k
    kind: amount_difference
    disposition: upstream_engine_gap
    evidence:
      mechanism: >-
        The net employee-contribution residual is exactly the opposite side
        of the work-bonus timing residual on the same case: the gross 13.07
        percent Article 38 contribution on EUROMOD's post-uprating gross of
        31,650.67 EUR, minus the work-bonus reduction. Nothing else in the
        contribution chain differs.
      arithmetic:
        - expression: "1074.372802303263 - 1057.261304699186"
          equals: 17.111498
          tolerance: 0.001
        - expression: "31650.67178502879 * 0.1307 - 3062.37"
          equals: 1074.372802
          tolerance: 0.001
      upstream_url: https://github.com/ec-jrc/JRC-EUROMOD-software-source-code/issues/5
      sources:
        - axiom_oracles/data/euromod_issues.json#euromod-be-2025-work-bonus-january-timing
    linked_issue: https://github.com/ec-jrc/JRC-EUROMOD-software-source-code/issues/5
    expires_on_source_change: true
    pinned:
      left: 1057.261305
      right: 1074.372802

  - id: dataset-uprating-bridge-artifact-resolved
    concept: be:regulations/social_security/workers/employee_contributions#belgium_employee_social_security_article_38_contribution_before_reductions
    case_id: be-worker-ssc-30k
    kind: amount_difference
    disposition: bridge_artifact
    evidence:
      mechanism: >-
        Historical harness artifact, kept for provenance: the 2026-07-02
        be-worker-ssc run compared EUROMOD at its post-uprating gross
        (31,650.67 EUR, dataset uprating factor 1.05502) against Axiom at
        the raw 30,000 EUR input, so both engines applied the identical
        13.07 percent rate to different bases. Resolved by the feed-forward
        bridge that evaluates Axiom at EUROMOD's returned gross
        (axiom-oracles#76, closed); the gross concept now matches exactly,
        so this entry stays expired unless the bridge regresses.
      arithmetic:
        - expression: "30000 * 0.1307"
          equals: 3921
        - expression: "31650.67178502879 * 0.1307"
          equals: 4136.7428
          tolerance: 0.001
      upstream_url: https://github.com/TheAxiomFoundation/axiom-oracles/issues/76
    linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/76
    expires_on_source_change: true
    pinned:
