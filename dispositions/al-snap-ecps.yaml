- id: tanf-zero-counterfactual-36567
  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-36567
  kind: amount_difference
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
  evidence:
    mechanism: 'Exact-household requested-month counterfactual on PolicyEngine 4.18.9 / PolicyEngine-US
      1.767.3 / PolicyEngine-Core 3.30.3. The committed comparison adapter replayed over the
      same Case projection reproduces the report pin (Axiom 785.0 versus January PolicyEngine
      744.5); the January PolicyEngine value is reproduced by the direct requested-month simulation
      with the imputed SSI input forced to zero (744.5), so the committed value carries endogenous
      TANF but not SSI. Forcing the aggregate and state TANF inputs to zero in the direct
      requested-month simulation produces January SNAP 785.0; its absolute delta from Axiom,
      0.0, is within the unchanged suite tolerance 7.0. The comparison bridge zeroes TANF
      on the Axiom input surface while PolicyEngine computes state TANF endogenously and counts
      it as SNAP unearned income (axiom-oracles#397 counterfactual class). Replay classifier
      record: class=tanf_reanchored_no_ssi.'
    upstream_url: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
