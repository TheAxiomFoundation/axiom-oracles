- id: tanf-zero-counterfactual-36567
  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-36567
  kind: amount_difference
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
  evidence:
    upstream_url: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
    mechanism: >-
      Exact-household live counterfactual on PolicyEngine 4.18.9, PolicyEngine-US 1.767.3,
      and PolicyEngine-Core 3.28.0: the regenerated baseline is Axiom 785.0 versus PE
      749.274169921875. PE reports monthly al_tanf 344.0 and aggregate TANF 344.0. Forcing
      both to zero leaves SNAP eligibility true and produces PE SNAP 789.399169921875; its
      absolute delta from Axiom is 4.399169921875, within the suite tolerance 7.0. This
      exact counterfactual isolates endogenous TANF transport as the mismatch mechanism.
    arithmetic:
    - expression: "789.399169921875 - 785.0"
      equals: 4.399169921875
      tolerance: 1.0e-09
    sources:
    - dashboard/public/data/axiom-policyengine-al-snap-ecps.json
    - https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.9(b)(2)(i)
  expires_on_source_change: true
  pinned:
    left: 785.0
    right: 749.274169921875
    difference: 35.725830078125
