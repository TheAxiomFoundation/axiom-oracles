- id: pe-endogenous-ssi-counterfactual-36457
  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-36457
  kind: amount_difference
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/436
  evidence:
    mechanism: 'Exact-household requested-month counterfactual on PolicyEngine 4.18.9 / PolicyEngine-US
      1.767.3 / PolicyEngine-Core 3.30.3. The committed comparison adapter replayed over the
      same Case projection reproduces the report pin (Axiom 546.0 versus January PolicyEngine
      282.8999938964844), and the unmodified direct requested-month simulation reproduces
      the same January value. Forcing the endogenously imputed SSI input to zero in the direct
      requested-month simulation produces January SNAP 546.0; its absolute delta from Axiom,
      0.0, is within the unchanged suite tolerance 7.0. The household carries no SSI on the
      projected Enhanced CPS input surface (the bridge projects zero SSI to Axiom), while
      PolicyEngine''s direct requested-month path imputes an endogenous SSI award into SNAP
      unearned income, so the engines price different income surfaces. Replay classifier record:
      class=ssi.'
    arithmetic:
    - expression: 546.0 - 546.0
      equals: 0.0
      tolerance: 1.0e-06
    sources:
    - dashboard/public/data/axiom-policyengine-al-snap-ecps.json
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.9(b)(2)(i)
    - axiom_oracles/adapters/policyengine/runner.py
  expires_on_source_change: true
  pinned:
    left: 546.0
    right: 282.8999938964844
    difference: 263.1000061035156
