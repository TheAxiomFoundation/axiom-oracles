- id: al-bbce-gross-band-snap_eligible
  concept: us:statutes/7/2014/o#snap_eligible
  kind: eligibility_right_only
  case_selector:
    case_ids:
    - ecps-37718
  disposition: axiom_encoding_gap
  evidence:
    mechanism: |-
      Alabama's broad-based categorical eligibility (SNAP state option;
      PolicyEngine models gross screen x1.3 FPL, x2.0 for elderly/disabled
      households, at 2026-01 per gov/hhs/tanf/non_cash parameters) is not in
      the composed us-al/snap/fy-2026 program, which applies only the standard
      federal tests. Every selected row is verified per-row against axiom's
      persisted output surface: household gross income sits inside the band
      above the federal 130 percent limit the composed program applies and at
      or below the state's BBCE screen, verified against axiom's own computed
      gross income and limit. Axiom-side modeling boundary, tracked for
      encoding in rulespec-us#1098.
  linked_issue: https://github.com/TheAxiomFoundation/rulespec-us/issues/1098
  expires_on_source_change: true
- id: al-bbce-net-waiver-snap_eligible
  concept: us:statutes/7/2014/o#snap_eligible
  kind: eligibility_right_only
  case_selector:
    case_ids:
    - ecps-36948
    - ecps-37102
    - ecps-37190
    - ecps-37546
  disposition: axiom_encoding_gap
  evidence:
    mechanism: |-
      Alabama's broad-based categorical eligibility (SNAP state option;
      PolicyEngine models gross screen x1.3 FPL, x2.0 for elderly/disabled
      households, at 2026-01 per gov/hhs/tanf/non_cash parameters) is not in
      the composed us-al/snap/fy-2026 program, which applies only the standard
      federal tests. Every selected row is verified per-row against axiom's
      persisted output surface: the household passes axiom's gross test and
      fails only the net-income test, which the state's BBCE waives. Axiom-
      side modeling boundary, tracked for encoding in rulespec-us#1098.
  linked_issue: https://github.com/TheAxiomFoundation/rulespec-us/issues/1098
  expires_on_source_change: true
- id: al-bbce-net-waiver-snap_benefit
  concept: us:statutes/7/2014/u#snap_benefit
  kind: amount_difference
  case_selector:
    case_ids:
    - ecps-37102
    - ecps-37190
    - ecps-37546
  disposition: axiom_encoding_gap
  evidence:
    mechanism: |-
      Alabama's broad-based categorical eligibility (SNAP state option;
      PolicyEngine models gross screen x1.3 FPL, x2.0 for elderly/disabled
      households, at 2026-01 per gov/hhs/tanf/non_cash parameters) is not in
      the composed us-al/snap/fy-2026 program, which applies only the standard
      federal tests. Every selected row is verified per-row against axiom's
      persisted output surface: the household passes axiom's gross test and
      fails only the net-income test, which the state's BBCE waives. Axiom-
      side modeling boundary, tracked for encoding in rulespec-us#1098.

      The true-January regeneration preserves all three selected benefit rows
      and their paired eligibility-right-only rows. Their PolicyEngine benefits
      moved from 201.3240763346354, 23.973597208658855, and
      234.62408447265625 to 196.39996337890625, 23.84000015258789, and
      229.699951171875, respectively; that material amount movement does not
      change the eligibility-boundary evidence.
  linked_issue: https://github.com/TheAxiomFoundation/rulespec-us/issues/1098
  expires_on_source_change: true
- id: pe-lone-minor-child-earnings-benefit
  concept: us:statutes/7/2014/u#snap_benefit
  case_selector:
    case_ids:
    - ecps-36459
    - ecps-36559
    - ecps-37623
    - ecps-37651
  kind: amount_difference
  disposition: upstream_engine_gap
  linked_issue: https://github.com/PolicyEngine/policyengine-us/issues/9157
  evidence: &pe_lone_minor_evidence
    upstream_url: https://github.com/PolicyEngine/policyengine-us/issues/9157
    mechanism: >-
      Reverified on PolicyEngine 4.18.9, PolicyEngine-US 1.767.3, and
      PolicyEngine-Core 3.30.3. The exact-household signature and explicit
      K-12 counterfactual reproduce the mechanism:
      PolicyEngine excludes all earnings of an imputed K-12 member age 17
      or younger without requiring the co-resident-parent or parental-control
      condition in 7 CFR 273.9(c)(7). The sole minor is a valid household
      under 273.1(a)(1), but wages count under 273.9(b)(1)(i), so Axiom
      correctly fails the income gate and returns zero benefit.
      The true-January regeneration preserves the same four paired
      benefit/eligibility selectors. In case-id order, PolicyEngine benefits
      moved from 296.8949788411458, 299.66998291015625,
      150.64496866861978, and 299.66998291015625 to
      294.70001220703125, 298.0, 148.59999084472656, and 298.0; Axiom remains
      ineligible with zero benefit for all four, so the amount movement does
      not change the evidenced classification.
    sources:
    - dashboard/public/data/axiom-policyengine-al-snap-ecps.json
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.1(a)(1)
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.9(b)(1)(i)
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.9(c)(7)
  expires_on_source_change: true
