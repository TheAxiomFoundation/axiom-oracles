    concept: be:statutes/property_tax/cadastral_income_indexation#belgium_immovable_withholding_taxable_cadastral_income_from_unindexed
    case_id: be-cadastral-income-indexation-2025-rounding
    kind: amount_difference
    disposition: upstream_engine_gap
    evidence:
      mechanism: >-
        EUROMOD BE_2025 tprhm_be computes khooo_s as the raw product
        khooo * 2.2446 and returns 2,244.60 for the 1,000 EUR unindexed
        cadastral income, while CIR 92 Article 518 requires rounding the
        indexed cadastral income to the nearest euro, giving 2,245. The
        5,000 EUR exact-multiple control case matches at 11,223.
      arithmetic:
        - expression: "1000 * 2.2446"
          equals: 2244.6
        - expression: "2245 - 2244.6"
          equals: 0.4
      upstream_url: https://github.com/ec-jrc/JRC-EUROMOD-software-source-code/issues/14
