entries:
  - id: first-tier-maximum-enters-next-bracket-at-equality
    concept: us:policies/income_tax/savers_credit_pipeline#federal_savers_credit
    case_id: savers-at-first-threshold
    kind: amount_difference
    disposition: upstream_engine_gap
    evidence:
      mechanism: >-
        PE-US 1.767.3 stores Notice 2025-67's correct 2026 joint tier values
        $48,500/$52,500/$80,500 and applies the 0.5 single-filer adjustment.
        The values are represented as lower bounds of the next brackets, and
        PolicyEngine Core 3.30.3's SingleAmountTaxScale uses right=false
        digitization. Single AGI $24,250 therefore maps to adjusted AGI
        $48,500 and enters the 20% bracket at equality, although the Notice
        makes $24,250 the inclusive maximum of the 50% tier. PE returns
        20% of $2,000 ($400) instead of 50% ($1,000).
      arithmetic:
        - expression: "2000 * 0.5"
          equals: 1000
        - expression: "2000 * 0.2"
          equals: 400
        - expression: "1000 - 400"
          equals: 600
      upstream_url: https://github.com/PolicyEngine/policyengine-us/blob/49d19b239a593dbac8920ac6fd80cfe33372343a/policyengine_us/parameters/gov/irs/credits/retirement_saving/rate/joint.yaml
      sources:
        - comparisons/us-savers-credit-grid.yaml
        - https://www.irs.gov/irb/2025-49_IRB
    expires_on_source_change: true
    pinned:
      left: 1000
      right: 400
