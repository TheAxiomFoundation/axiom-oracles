      beer_section_232_aluminum_content_basis_duty_applies: 0' - the
      five-input panel carries no declared-aluminum-value input, so the
      component expressed on the full entered value is proved 0. The Yale
      statutory layer deliberately keeps the full-line literal rate (25% for
      United Kingdom origins) in statutory_rate_232 and scales by aluminum
      content downstream at the effective layer: docs/statutory_deviations.md
      F8 (beer 2203.00.00 on the note 19(k)/9903.85.08 derivative list; the
      'basis' taxonomy keeps the literal rate in statutory_rate_*) and
      docs/assumptions.md ('applies only to the aluminum content',
      aluminum_share scaling) at
