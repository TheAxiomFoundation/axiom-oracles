      statutory rate from 2026-02-20, the SCOTUS ruling date (Learning
      Resources v. Trump): config/policy_params.yaml
      ieepa_invalidation_policy_date '2026-02-20' ('overridden to 2026-02-20
      when use_policy_dates=TRUE') and docs/policy_timing.md ('IEEPA
