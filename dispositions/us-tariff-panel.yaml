  evidence:
    mechanism: >-
      Origins: 239 countries. Axiom's section_232_aluminum_component_rate is 0
      on this beer line: heading 9903.85.08 levies 'a duty of 50% upon the
      value of the aluminum content' and the aluminum-derivative annex
      enumerates 2203.00.00 with the instruction that the duty 'shall only
      apply to the declared value of the aluminum content' (corpus
      us/statute/hts/9903.85.08; us/statute/hts/chapter-99/page-256), encoded
      in rulespec-us composition.yaml as the
      beer_section_232_aluminum_content_basis_duty_applies judgment (line-d
      entries, 2026-02-15..2026-04-05) with
      section_232_aluminum_component_rate: 'if
      beer_section_232_aluminum_content_basis_duty_applies: 0' - the
      five-input panel carries no declared-aluminum-value input, so the
      component expressed on the full entered value is proved 0. The Yale
      statutory layer deliberately keeps the full-line literal rate in
      statutory_rate_232 and scales by aluminum content downstream at the
      effective layer: docs/statutory_deviations.md F8 (beer 2203.00.00 on the
      note 19(k)/9903.85.08 derivative list; the 'basis' taxonomy keeps the
      literal rate in statutory_rate_*) and docs/assumptions.md ('applies only
      to the aluminum content', aluminum_share scaling) at
      Budget-Lab-Yale/tariff-rate-tracker@c4307e514196618afcbf88cf7fd33746417eeabf.
      Mismatches are confined to 2026-02-15..2026-04-05: the 2026-04-09
      Federal Register notice terminated the beer derivative listing effective
      2026-04-06 (corpus us/rulemaking/federal-register/2026-04-09/2026-06960,
      Annex II; composition judgment v1), after which both sides are 0.
