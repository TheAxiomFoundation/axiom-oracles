  case_selector:
    case_ids:
    - "panel-7601103000-5800-2026-02-15"
    - "panel-7601103000-5800-2026-02-19"
  disposition: explained_residual
  evidence:
    mechanism: >-
      Origins: KR. Axiom's ieepa_component_rate is 0 on this 232-metal line
      for reciprocal-tariff origins (or carries only the china fentanyl 10%,
      which is not metals-excluded): the encoded reciprocal exclusions (proof
      atoms in composition.yaml ieepa_component_rate, including the
      metal-article exclusions) remove 232-covered articles from the
      reciprocal duty. Yale's statutory layer keeps the origin's
      reciprocal/floor rate in statutory_rate_ieepa_recip on these lines and
      resolves the 232 overlap downstream at the effective layer
      (docs/statutory_deviations.md: the statutory layer keeps the
      unclaimed/literal rate; EU floor entries store the 15% floor minus the
      statutory MFN base) at
      Budget-Lab-Yale/tariff-rate-tracker@c4307e514196618afcbf88cf7fd33746417eeabf.
      Axiom's mfn_ad_valorem_rate applies the column 1 Special subcolumn Free
      rate for KORUS-eligible Korean origin (proof atoms: 'Free
      (A*,AU,...,KR,...)' on the covered metal lines). Yale deliberately
      keeps the full column-1 general rate in statutory_base_rate and applies
      FTA preference only at the effective layer as a utilization share
      (docs/statutory_deviations.md U2: 'statutory_rate_* keeps the unclaimed
      (full) rate') at
      Budget-Lab-Yale/tariff-rate-tracker@c4307e514196618afcbf88cf7fd33746417eeabf.
      Layer-semantics boundary.
    arithmetic:
    - expression: "(0.0 - 0.124) + (0.0 - 0.026000000000000002)"
      equals: -0.15000000000000002
    upstream_url: "https://github.com/Budget-Lab-Yale/tariff-rate-tracker/blob/c4307e514196618afcbf88cf7fd33746417eeabf/docs/statutory_deviations.md"
    sources:
    - reference/us-tariff-panel/yale_panel_provenance.json
  expires_on_source_change: true
