- id: "7601103000-ieepa-10v0--ieepa-scotus-timing"
  concept: "us:policies/cbp/us-tariff-duty/composition#us_tariff_total_ad_valorem_rate"
  kind: total_difference
  case_selector:
    case_ids:
    - "panel-7601103000-5700-2026-02-20"
    - "panel-7601103000-5700-2026-02-23"
  disposition: explained_residual
  evidence:
    mechanism: >-
      Origins: CN. Yale's legal-date panel zeroes every IEEPA statutory rate
      from 2026-02-20, the SCOTUS ruling date (Learning Resources v. Trump):
      config/policy_params.yaml ieepa_invalidation_policy_date '2026-02-20'
      ('overridden to 2026-02-20 when use_policy_dates=TRUE') and
      docs/policy_timing.md ('IEEPA invalidation is modeled on the ruling
      date') at
      Budget-Lab-Yale/tariff-rate-tracker@c4307e514196618afcbf88cf7fd33746417eeabf.
      Axiom encodes the CBP/Federal Register termination effective 2026-02-24
      (FR 2026-03832; ieepa_component_rate switches to the terminated rate at
      02-24), so the 02-20 and 02-23 probes carry our still-active IEEPA rate
      against their zero. Timing-convention boundary between the ruling date
      and the implementation date.
    arithmetic:
    - expression: "(0.1 - 0.0)"
      equals: 0.09999999999999998
    upstream_url: "https://github.com/Budget-Lab-Yale/tariff-rate-tracker/blob/c4307e514196618afcbf88cf7fd33746417eeabf/docs/policy_timing.md"
    sources:
    - reference/us-tariff-panel/yale_panel_provenance.json
  expires_on_source_change: true
