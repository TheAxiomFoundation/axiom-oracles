      us/rulemaking/federal-register/2022-02-09/2022-02906/page-5; 5.0 GW cell
      quota at page-3) and the HTS chapter 99 subheading carries the
      compiler's note that the safeguard provisions 'have expired. See 87 Fed.
      Reg. 7357.' (us/statute/hts/9903.45.21), encoded with proof atoms in
      rulespec-us us/policies/cbp/us-tariff-duty/composition.yaml
      (section_201_component_rate returns 0 on every branch, effective
      2026-02-15). The Yale panel instead applies a flat 14.5% from
      config/policy_params.yaml (section_201: solar_rate: 0.145, comment
      '2025-02-07 -> 2026-02-07 (Year 8 of extension) ... update annually
      based on USTR notice') to every hts10 in
      resources/s201_solar_products.csv (8541420010 row) for all non-exempt
      origins: src/pipeline/05_parse_policy_params.R extract_section_201_rates
      prefers the config rate over the HTS field and models no expiry or
      quota, and src/pipeline/06_calculate_rates.R apply_section201 sets
      statutory_rate_section_201 = rate_section_201 uniformly across probe
      dates. Reference-side gap: the stale config rate is applied past the
      2026-02-06 expiry with no end-date gating at
      Budget-Lab-Yale/tariff-rate-tracker@c4307e514196618afcbf88cf7fd33746417eeabf.
