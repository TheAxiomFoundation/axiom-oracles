      including the metal-article exclusions) remove 232-covered articles
      from the reciprocal duty. Yale's statutory layer keeps the origin's
      reciprocal/floor rate in statutory_rate_ieepa_recip on these lines and
      resolves the 232 overlap downstream at the effective layer
      (docs/statutory_deviations.md: the statutory layer keeps the
      unclaimed/literal rate; EU floor entries store the 15% floor minus the
      statutory MFN base) at
