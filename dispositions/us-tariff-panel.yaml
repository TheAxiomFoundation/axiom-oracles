    - "panel-2203000030-4120-2026-04-05"
  disposition: explained_residual
  evidence:
    mechanism: >-
      Origins: GB. Axiom's section_232_aluminum_component_rate is 0 on this
      beer line: heading 9903.85.08 levies 'a duty of 50% upon the value of
      the aluminum content' and the aluminum-derivative annex enumerates
      2203.00.00 with the instruction that the duty 'shall only apply to the
      declared value of the aluminum content' (corpus
      us/statute/hts/9903.85.08; us/statute/hts/chapter-99/page-256), encoded
      in rulespec-us composition.yaml as the
