suite: ms-income-tax-liability
updated: "2026-07-27"
# The canonical RuleSpec applies section 27-7-5's 4 percent calendar-year-2026
# schedule to completed Person-grain Mississippi taxable income. It matches
# PolicyEngine's joint/default Person-grain schedule target on all six cases.
# TAXSIM independently constructs a broader filing-unit taxable-income boundary,
# and pinned policyengine-taxsim 2.30.0 returns a 4.4 percent marginal slope.
# The six external-boundary/model-vintage residuals are dispositioned below.
entries:
  - id: ms-taxsim-2-30-0-2026-model-vintage-single-30000
    concept: us-ms:policies/income_tax/2026_section_27_7_5_schedule#ms_pit_2026_section_27_7_5_schedule_tax
    case_id: ms-single-30000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        Pinned policyengine-taxsim 2.30.0 was requested at 2026, but its
        Mississippi siitax grid has a 4.4 percent marginal slope while the
        canonical section 27-7-5 schedule applies 4 percent above the 10,000
        dollar zero band. TAXSIM also independently constructs its filing-unit
        taxable-income boundary. For this case Axiom reports 468.00 and TAXSIM
        reports 490.64; the residual is external model vintage and boundary,
        not a RuleSpec computation.
      arithmetic:
        - expression: "468.0 - 490.64"
          equals: -22.64
          tolerance: 0.01
    expires_on_source_change: true
    pinned:
      left: 468.0
      right: 490.64
