      arithmetic:
        - expression: "0.047 * (21700 - 10000)"
          equals: 549.9
          tolerance: 0.02
        - expression: "468 - 549.9"
          equals: -81.9
          tolerance: 0.02
    expires_on_source_change: true
    pinned: {left: 468, right: 549.9}
