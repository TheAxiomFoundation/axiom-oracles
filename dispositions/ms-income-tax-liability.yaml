    case_id: ms-single-30000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        Axiom and PolicyEngine apply Mississippi's 2026 4-percent rate above
        $10,000; the pinned TAXSIM leg applies the official 2024 4.7-percent
        rate to the same completed-return taxable base.
