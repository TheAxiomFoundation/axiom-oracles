      - 2024-202409-34048
      - 2024-202409-34084
      - 2024-202409-34122
    disposition: axiom_encoding_gap
    evidence:
      mechanism: >-
        The encoded chain carries cents end-to-end (the 20 percent
        earned-income deduction and the half-income excess-shelter
        subtraction produce fractional dollars) while the FNS QC
        Minimodel computes with whole dollars at each step (FSERNDED is
        truncated; FSSLTDED and FSNETINC are whole dollars). When the
        fractional net crosses a dollar boundary, the round-up of 30
        percent of net income flips the final allotment by exactly one
        dollar; every intermediate stage agrees to the dollar on all 33
        rows (three of them surface at the net-income stage as a
        sub-two-dollar net difference for the same reason).
      arithmetic:
        - expression: "200.5 * 0.3"
          equals: 60.15
        - expression: "200 * 0.3"
          equals: 60
        - expression: "766 - 61"
          equals: 705
        - expression: "766 - 60"
          equals: 706
      upstream_url: https://github.com/TheAxiomFoundation/rulespec-us/issues/762
    linked_issue: https://github.com/TheAxiomFoundation/rulespec-us/issues/762
    expires_on_source_change: true
  - id: whole-dollar-rounding-convention-net-income
    concept: us:regulations/7-cfr/273/10#snap_net_monthly_income
    case_selector:
      case_ids:
        - 2024-202404-33704
        - 2024-202408-34023
        - 2024-202409-34072
    disposition: axiom_encoding_gap
    evidence:
      mechanism: >-
        Same mechanism as whole-dollar-rounding-convention: the encoded
        chain carries cents where the FNS QC Minimodel computes with whole
        dollars, and on these rows the fractional carry first exceeds the
        one-dollar stage tolerance at net income (for example 549.8 against
        the whole-dollar 551) before flipping the benefit by one dollar.
      arithmetic:
        - expression: "1414 - 198 - 282.8 - 383.4"
          equals: 549.8
        - expression: "1414 - 198 - 282 - 383"
          equals: 551
      upstream_url: https://github.com/TheAxiomFoundation/rulespec-us/issues/762
    linked_issue: https://github.com/TheAxiomFoundation/rulespec-us/issues/762
    expires_on_source_change: true
