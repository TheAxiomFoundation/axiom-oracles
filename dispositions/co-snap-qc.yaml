entries:
  - id: homeless-shelter-deduction-cap-stale-143
    concept: us:regulations/7-cfr/273/10#snap_net_monthly_income
    case_selector:
      case_ids:
        - 2024-202401-33471
        - 2024-202401-33486
        - 2024-202404-33715
        - 2024-202405-33760
        - 2024-202405-33793
        - 2024-202407-33923
        - 2024-202409-34123
    disposition: axiom_encoding_gap
    evidence:
      mechanism: >-
        Every unit claiming the standard homeless shelter deduction
        (HOMEDED = 3) nets out $143 in the engine where FNS applies the
        FY 2024 indexed maximum of $179.66 (recorded as $180 in the
        whole-dollar QC file). 7 CFR 273.10's
        snap_homeless_shelter_deduction_cap encodes the stale $143 CFR
        literal (the FY 2019 base value), and
        min(claimed, cap) clamps the correctly supplied FY 2024 amount
        back down; 7 USC 2014(e)(6)(D) indexes the deduction annually and
        the FY 2024 COLA memorandum publishes $179.66.
      arithmetic:
        - expression: "629 - 198 - 143"
          equals: 288
        - expression: "629 - 198 - 180"
          equals: 251
        - expression: "180 - 143"
          equals: 37
      upstream_url: https://github.com/TheAxiomFoundation/rulespec-us/issues/761
    linked_issue: https://github.com/TheAxiomFoundation/rulespec-us/issues/761
    expires_on_source_change: true
