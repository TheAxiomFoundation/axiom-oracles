  - id: wi-policyengine-2026-single-150000
    concept: us-wi:policies/income_tax/pilot_liability_pipeline#wi_pit_pilot_income_tax_liability
    case_id: wi-single-150000
    kind: policyengine_amount_difference
    disposition: upstream_engine_gap
    evidence:
      mechanism: >-
        Wis. Stat. 71.06(1r), (2)(k), and (2e)(bm)-(c) require the post-2024 bracket bases to be indexed by the August 2024-to-August 2025 CPI-U change and rounded to the nearest $10. The source-grounded Axiom schedule does so; PolicyEngine 2026 projects stale middle bases and unrounded floors. This exact residual is an upstream oracle gap, not an Axiom encoding gap.
      upstream_url: https://www.bls.gov/news.release/archives/cpi_09112025.htm
      arithmetic:
        - expression: "7309.36 - 7307.18701171875"
          equals: 2.17
          tolerance: 0.02
    expires_on_source_change: true
    pinned:
      left: 7309.36
      right: 7307.18701171875
