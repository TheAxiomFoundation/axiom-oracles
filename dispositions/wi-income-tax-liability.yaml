  - id: wi-taxsim-2024-single-30000
    concept: us-wi:policies/income_tax/pilot_liability_pipeline#wi_pit_pilot_income_tax_liability
    case_id: wi-single-30000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        The Axiom leg applies Wisconsin's source-grounded post-2024 bracket structure with the 2026 statutory CPI-U indexing and $10 rounding, while the pinned TAXSIM leg applies 2024 law. The exact residual is the reform and law-vintage difference.
      upstream_url: https://www.revenue.wi.gov/WisconsinTaxBulletin/230-07-31-WTB.pdf
      arithmetic:
        - expression: "595.76665234375 - 635.92"
          equals: -40.15
          tolerance: 0.02
    expires_on_source_change: true
    pinned:
      left: 595.76665234375
      right: 635.92
