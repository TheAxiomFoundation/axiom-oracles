  - id: vt-taxsim-2024-married-300000
    concept: us-vt:policies/income_tax/pilot_liability_pipeline#vt_pit_pilot_income_tax_liability
    case_id: vt-married-300000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        Both years compare the schedule against the three-percent federal-AGI
        minimum ($9,000), and the schedule wins. Pinned TAXSIM reports a
        $274,970 taxable base from $10,224 of exemptions and its $14,806 joint
        standard deduction. The printed 2024 Schedule Y-1 reconstructs
        $16,365.92; TAXSIM's internal unrounded indexed threshold/base returns
        $16,365.84, an eight-cent implementation-rounding difference. The
        remaining residual is the 2024-to-2026 indexation vintage.
      upstream_url: https://tax.vermont.gov/sites/tax/files/documents/RateSched-2024.pdf
      arithmetic:
        - expression: "300000 - 10224 - 14806"
          equals: 274970
          tolerance: 0.001
        - expression: "10159 + 0.076 * (274970 - 193300)"
          equals: 16365.92
          tolerance: 0.001
        - expression: "16365.92 - 16365.84"
          equals: 0.08
          tolerance: 0.0001
        - expression: "0.03 * 300000"
          equals: 9000
          tolerance: 0.001
        - expression: "16008.330875 - 9000"
          equals: 7008.330875
          tolerance: 0.0001
        - expression: "16008.330875 - 16365.84"
          equals: -357.509125
          tolerance: 0.0001
    expires_on_source_change: true
    pinned: {left: 16008.330875, right: 16365.84}
