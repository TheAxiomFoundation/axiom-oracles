entries:
  - id: vt-taxsim-2024-single-30000
    concept: us-vt:policies/income_tax/pilot_liability_pipeline#vt_pit_pilot_income_tax_liability
    case_id: vt-single-30000
    kind: amount_difference
    disposition: explained_residual
    evidence:
      mechanism: >-
        Axiom and PolicyEngine use the current 2026 section 5822 indexation.
        Pinned TAXSIM's detailed 2024 state calculation reports a $5,112
        exemption and $7,378 standard deduction (its internal pre-rounding
        parameters, versus the booklet's printed $5,100 and $7,400) and applies
        the official 3.35-percent first rate to the resulting $17,510 base.
      upstream_url: https://tax.vermont.gov/sites/tax/files/documents/Income%20Booklet-2024.pdf
      arithmetic:
        - expression: "0.0335 * (30000 - 5112 - 7378)"
          equals: 586.59
          tolerance: 0.01
        - expression: "562.017105 - 586.59"
          equals: -24.572895
          tolerance: 0.0001
    expires_on_source_change: true
    pinned: {left: 562.017105, right: 586.59}
