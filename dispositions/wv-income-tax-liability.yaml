    disposition: explained_residual
    evidence:
      mechanism: >-
        Axiom and PolicyEngine apply the 2026 section 11-21-4J schedule;
        pinned TAXSIM applies the official 2024 Schedule I rates to the same
        $28,000 completed-return taxable base after the $2,000 exemption.
      upstream_url: https://tax.wv.gov/Documents/PIT/2024/it140.PersonalIncomeTaxFormsAndInstructions.2024.pdf
      arithmetic:
        - expression: "708.50 + 0.0354 * (28000 - 25000)"
          equals: 814.7
          tolerance: 0.02
        - expression: "727.3 - 814.7"
          equals: -87.4
          tolerance: 0.02
    expires_on_source_change: true
    pinned: {left: 727.3, right: 814.7}
