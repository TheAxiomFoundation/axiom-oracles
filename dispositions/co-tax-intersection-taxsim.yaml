    - ecps-tax-unit-136157
    - ecps-tax-unit-136279
    - ecps-tax-unit-58412
    - ecps-tax-unit-58689
    - ecps-tax-unit-58748
    - ecps-tax-unit-58922
    - ecps-tax-unit-59089
    - ecps-tax-unit-59103
    - ecps-tax-unit-59198
  disposition: explained_residual
  attribution: input
  evidence:
    row_arithmetic:
    - expression: difference
      equals:
      - 1650
      - 2050
      - 3300
      - 4100
    mechanism: 'Every residual is an exact whole multiple of the 2026 section 63(f)

      additional standard deduction ($2,050 unmarried / $1,650 per married

      individual). The TAXSIM input format carries no blindness column and its

      aged handling differs from the ECPS leaves the axiom projection reads

      (is_blind and per-member age), so axiom counts more 63(f) increments

      than TAXSIM can see. Input-format scope difference, not a computation

      disagreement.'
    arithmetic:
    - expression: 32200.0 + 1 * 1650
      equals: 33850.0
      tolerance: 1.0
    - expression: 16100.0 + 1 * 2050
      equals: 18150.0
      tolerance: 1.0
    - expression: 33850.0 + 1 * 1650
      equals: 35500.0
      tolerance: 1.0
  expires_on_source_change: true
  selector_binding:
    units: 20
    rows_sha256: cd03348cd7bbb0976ae06d0d43c42021f9d70aec5fce194c4bbdd093a1abda42
