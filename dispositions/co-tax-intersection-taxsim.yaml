- id: taxsim-input-lacks-blindness-column-63f-increments
  concept: us:tax/federal-income-tax#standard_deduction
  kind: amount_difference
  case_selector:
    case_ids:
    - ecps-tax-unit-135487
    - ecps-tax-unit-135503
    - ecps-tax-unit-135628
    - ecps-tax-unit-135642
    - ecps-tax-unit-135669
    - ecps-tax-unit-135725
