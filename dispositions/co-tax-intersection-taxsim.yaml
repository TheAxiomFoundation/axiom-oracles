  evidence:
    mechanism: 'Axiom-side earned-income measure defect, reconciled to the cent:

      both engines apply the identical childless schedule (7.65% phase-in,

      664 maximum, phase-out from 10,860), but the bridge''s earned_income

      input feeding section 32(a)(2)(B) phase-out income does not net the

      unit''s 1,122.78 self-employment loss (pwages 16,011.53, psemp

      -1,122.78), while section 32(c)(2)(A)(ii) defines earned income

      through net earnings from self-employment - a loss nets. Axiom phases

      out on max(AGI, 16,011.53) = 16,011.53; TAXSIM on max(14,946.30,

      14,888.75) = 14,946.30. Credit difference = 0.0765 x (16,011.53 -

      14,946.30) = 81.49 = the committed residual (269.91 vs 351.40).

      Classified as our own bridge defect; visible until the projection nets

      SE losses into the section 32 earned-income input.'
