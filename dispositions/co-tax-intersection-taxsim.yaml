- id: taxsim-blindness-63f-extension-taxable_income
  concept: us:tax/federal-income-tax#taxable_income
  kind: amount_difference
  case_selector:
    case_ids:
    - ecps-tax-unit-135487
    - ecps-tax-unit-135503
    - ecps-tax-unit-135642
    - ecps-tax-unit-135725
    - ecps-tax-unit-135783
    - ecps-tax-unit-135805
    - ecps-tax-unit-136157
    - ecps-tax-unit-136279
    - ecps-tax-unit-59089
    - ecps-tax-unit-59103
  disposition: explained_residual
  evidence:
    mechanism: 'TAXSIM''s input schema has no blindness column, so the 63(f) additional

      standard deduction axiom applies from ECPS-observed blind facts ($2,050

      single / $1,650 married per blind filer or spouse, 2026) has no TAXSIM

      counterpart. Extension of the original class to newly verified rows:

      each selected row''s difference equals the case''s blind member count

      times the filing-status increment, verified against the loaded ECPS

      blind facts; taxable/tax/liability rows are the same delta propagated

      (chain rows selected only when blindness is the case''s sole leaf

      divergence and the downstream delta is bounded by the top marginal rate

      on the increment).'
    arithmetic:
    - expression: -(1 * 1650)
      equals: -1650.0
      tolerance: 1.0
    - expression: -(1 * 2050)
      equals: -2050.0
      tolerance: 1.0
    - expression: -(1 * 1650)
      equals: -1650.0
      tolerance: 1.0
  expires_on_source_change: true
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/304
