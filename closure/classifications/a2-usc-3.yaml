rows:
  - citation: "us/statute/7/2021/b/3"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "This paragraph imposes permanent disqualification and civil penalties on a “retail food store or wholesale food concern” for trafficking and other retailer violations; it supplies no household eligibility or benefit rule."
  - citation: "us/statute/7/2021/b/4"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "The provision disqualifies a retailer for knowingly submitting an authorization or reauthorization application containing “false information about a substantive matter”; it regulates retailer authorization, not household computation."
  - citation: "us/statute/7/2021/c"
    heading: "Civil penalty and review of disqualification and penalty determinations"
    status: excluded
    reason: no_household_computation
    basis: "This subsection authorizes a civil penalty “for each violation” in addition to retailer disqualification and makes that retailer sanction reviewable; neither paragraph governs a household determination."
  - citation: "us/statute/7/2021/c/1"
    heading: "Civil penalty"
    status: excluded
    reason: no_household_computation
    basis: "The Secretary may assess “a civil penalty in an amount not to exceed $100,000 for each violation” in addition to disqualification; this is a retailer sanction with no household computation."
  - citation: "us/statute/7/2021/c/2"
    heading: "Review"
    status: excluded
    reason: no_household_computation
    basis: "The paragraph makes “disqualification or the imposition of a civil penalty” subject to review under section 2023; it concerns review of retailer sanctions only."
  - citation: "us/statute/7/2021/d"
    heading: "Conditions of authorization"
    status: excluded
    reason: no_household_computation
    basis: "The subsection regulates collateral bonds, letters of credit, forfeiture, and hearings for a sanctioned “retail food store or wholesale food concern”; it contains no household eligibility or benefit-amount rule."
  - citation: "us/statute/7/2021/d/1"
    heading: "In general"
    status: excluded
    reason: no_household_computation
    basis: "This paragraph permits a collateral bond or irrevocable letter of credit as “a condition of authorization to accept and redeem benefits” for a sanctioned retailer; household computations are unaffected."
  - citation: "us/statute/7/2021/d/2"
    heading: "Collateral"
    status: excluded
    reason: no_household_computation
    basis: "The Secretary may require a previously sanctioned retail store or wholesale concern that incurs another sanction to submit collateral; the rule is entirely retailer-facing; the text states “The Secretary also may require a retail food store or wholesale food”."
  - citation: "us/statute/7/2021/d/3"
    heading: "Bond requirements"
    status: excluded
    reason: no_household_computation
    basis: "The paragraph directs the Secretary to prescribe “the amount, terms, and conditions of such bond,” an authorization safeguard for stores rather than a household calculation; the text states “The Secretary shall, by regulation, prescribe the amount, terms, and conditions of”."
  - citation: "us/statute/7/2021/d/4"
    heading: "Forfeiture"
    status: excluded
    reason: no_household_computation
    basis: "A store or concern that violates the chapter after furnishing a bond must forfeit an amount equal to improperly redeemed coupons; this computes retailer forfeiture, not household benefits; the text states “If the Secretary finds that such store or concern has accepted and”."
  - citation: "us/statute/7/2021/d/5"
    heading: "Hearing"
    status: excluded
    reason: no_household_computation
    basis: "The provision gives a store or concern a hearing on bond forfeiture under section 2023; it is retailer review procedure with no household rule; the text states “A store or concern described in paragraph (4) may obtain a hearing”."
  - citation: "us/statute/7/2021/e"
    heading: "Transfer of ownership; penalty in lieu of disqualification period; fines for acceptance of loose coupons; judicial action to recover penalty or fine"
    status: excluded
    reason: no_household_computation
    basis: "The subsection sets penalties when ownership of a disqualified store is transferred, authorizes collection litigation, and permits fines for loose coupons; all of its objects are retailers or their owners; the text states “(1) In the event any retail food store or wholesale food concern”."
  - citation: "us/statute/7/2021/e/1"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "When a disqualified retail store or wholesale concern is sold, the transferor owes a civil penalty reflecting “that portion of the disqualification period that has not yet expired”; this is retailer enforcement."
  - citation: "us/statute/7/2021/e/2"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "The Secretary may ask the Attorney General to bring a civil action to collect a final retailer-transfer penalty; this judicial collection mechanism has no household computation; the text states “At any time after a civil penalty imposed under paragraph (1) has”."
  - citation: "us/statute/7/2021/e/3"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "The Secretary may fine a store or concern that accepts coupons without the corresponding book cover and may collect that fine judicially; the paragraph regulates retailers only; the text states “The Secretary may impose a fine against any retail food store or”."
  - citation: "us/statute/7/2021/f"
    heading: "Fines for unauthorized acceptance"
    status: excluded
    reason: no_household_computation
    basis: "This provision authorizes a fine against a person “not approved by the Secretary to accept and redeem food coupons” and judicial collection of the fine; it does not determine household benefits."
  - citation: "us/statute/7/2021/g"
    heading: "Disqualification of retailers who are disqualified under WIC program"
    status: excluded
    reason: no_household_computation
    basis: "The subsection requires SNAP disqualification criteria and terms for a retail store or wholesale concern already disqualified from WIC; its subject is retailer authorization, not a household; the text states “(1) In general The Secretary shall issue regulations providing criteria for the”."
  - citation: "us/statute/7/2021/g/1"
    heading: "In general"
    status: excluded
    reason: no_household_computation
    basis: "The Secretary must issue criteria for disqualifying an approved retailer or wholesaler that is disqualified from accepting WIC benefits; no household-level rule appears; the text states “The Secretary shall issue regulations providing criteria for the disqualification under this”."
  - citation: "us/statute/7/2021/g/2"
    heading: "Terms"
    status: excluded
    reason: no_household_computation
    basis: "The paragraph sets the length, start date, and nonreviewability of a retailer’s cross-program disqualification; it does not affect household eligibility or allotment; the text states “A disqualification under paragraph (1)— (A) shall be for the same length”."
  - citation: "us/statute/7/2021/h"
    heading: "Flagrant violations"
    status: excluded
    reason: no_household_computation
    basis: "This subsection permits suspension, forfeiture, or release of unsettled redemptions when a retail store or wholesale concern commits flagrant violations; it governs retailer payments and enforcement; the text states “(1) In general The Secretary, in consultation with the Inspector General of”."
  - citation: "us/statute/7/2021/h/1"
    heading: "In general"
    status: excluded
    reason: no_household_computation
    basis: "The Secretary must establish procedures to suspend “program benefit redemptions for a retail food store or wholesale food concern” pending disqualification action; household determinations are outside its scope."
  - citation: "us/statute/7/2021/h/2"
    heading: "Requirements"
    status: excluded
    reason: no_household_computation
    basis: "For a retailer engaged in flagrant violations, unsettled redeemed benefits may be suspended, forfeited, or released depending on the disqualification outcome; this is retailer settlement administration; the text states “Under the procedures described in paragraph (1), if the Secretary, in consultation”."
  - citation: "us/statute/7/2021/h/3"
    heading: "No liability for interest"
    status: excluded
    reason: no_household_computation
    basis: "The Secretary is not liable for interest on retailer redemption funds suspended under the subsection; this fiscal rule has no household-level content; the text states “The Secretary shall not be liable for the value of any interest”."
  - citation: "us/statute/7/2021/i"
    heading: "Pilot projects to improve Federal-State cooperation in identifying and reducing fraud in the supplemental nutrition assistance program"
    status: excluded
    reason: no_household_computation
    basis: "The subsection directs Federal-State pilot projects, selection criteria, evaluations, a congressional report, and reimbursement limits to investigate retailer fraud; it creates no household decision rule; the text states “(1) Pilot projects required (A) In general The Secretary shall carry out”."
  - citation: "us/statute/7/2021/i/1"
    heading: "Pilot projects required"
    status: excluded
    reason: no_household_computation
    basis: "The Secretary must carry out pilot projects testing Federal-State partnerships “to identify, investigate, and reduce fraud by retail food stores and wholesale food concerns”; this is program administration."
  - citation: "us/statute/7/2021/i/2"
    heading: "Selection criteria"
    status: excluded
    reason: no_household_computation
    basis: "The paragraph lists criteria for selecting State fraud-investigation pilots, including law-enforcement collaboration and maintenance of State effort; it does not specify household eligibility or benefits; the text states “Pilot projects shall be selected based on criteria the Secretary establishes, which”."
  - citation: "us/statute/7/2021/i/3"
    heading: "Evaluation"
    status: excluded
    reason: no_household_computation
    basis: "The Secretary must evaluate pilot projects for fraud-reduction capacity, effectiveness, and cost effectiveness; these are program-evaluation measures, not household calculations; the text states “(A) In general The Secretary shall evaluate the pilot projects selected under”."
  - citation: "us/statute/7/2021/i/4"
    heading: "Report to Congress"
    status: excluded
    reason: no_household_computation
    basis: "This paragraph required a congressional report describing each fraud pilot’s impact and costs; it is an agency reporting duty without household-level computational content; the text states “Not later than September 30, 2017 , the Secretary shall submit to”."
  - citation: "us/statute/7/2021/i/5"
    heading: "Funding"
    status: excluded
    reason: no_household_computation
    basis: "State pilot costs above the prior fiscal year’s fraud-investigation spending are “not eligible for Federal reimbursement”; this allocates administrative funding rather than household benefits; the text states “Any costs incurred by a State to operate pilot projects under this”."
  - citation: "us/statute/7/2022"
    heading: "Disposition of claims"
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: "The section concerns settling overissuance claims and recovering already-issued benefits through allotment offsets, unemployment compensation, Federal pay, or tax refunds; these are post-determination claims processes; the text states “(a) General authority of the Secretary (1) Determination of claims Except in”."
  - citation: "us/statute/7/2022/a"
    heading: "General authority of the Secretary"
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: "The subsection gives the Secretary powers to settle or waive claims, assesses interest on State debts, and assigns liability for “the value of any overissuance”; it operates after an issuance rather than setting current eligibility or the base allotment."
  - citation: "us/statute/7/2022/a/1"
    heading: "Determination of claims"
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: "The Secretary may determine, settle, adjust, compromise, deny, or waive claims arising from fraudulent and nonfraudulent overissuances; this is post-determination claim disposition; the text states “Except in the case of an at-risk amount required under section 2025(c)(1)(D)(i)(II)”."
  - citation: "us/statute/7/2022/a/2"
    heading: "Claims established under quality control system"
    status: excluded
    reason: no_household_computation
    basis: "The paragraph imposes interest when a State agency does not pay a quality-control claim and requires repayment with interest if an appeal succeeds; the debtor and payment stream are the State agency; the text states “To the extent that a State agency does not pay a claim”."
  - citation: "us/statute/7/2022/a/3"
    heading: "Computation of interest"
    status: excluded
    reason: no_household_computation
    basis: "Interest on the preceding State-agency claim is tied to “the average of the bond equivalent of the weekly 90-day Treasury bill auction rates”; it computes government debt, not household benefits."
  - citation: "us/statute/7/2022/a/4"
    heading: "Joint and several liability of household members"
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: "The paragraph makes each adult household member jointly and severally liable for “the value of any overissuance”; it assigns liability for a past claim without changing point-in-time eligibility or the calculated allotment."
  - citation: "us/statute/7/2022/b"
    heading: "Collection of overissuances"
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: "Every paragraph addresses collection of an overissuance already issued to a household, including recovery methods, an offset cap, notices, payment schedules, and systemic-error claims; these are post-determination collection rules; the text states “(1) In general Except as otherwise provided in this subsection, a State”."
  - citation: "us/statute/7/2022/b/1"
    heading: "In general"
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: "A State agency must collect an existing overissuance by allotment reduction, unemployment withholding, Federal offset, or another means; the paragraph prescribes recovery after the benefit determination; the text states “Except as otherwise provided in this subsection, a State agency shall collect”."
  - citation: "us/statute/7/2022/b/2"
    heading: "Cost effectiveness"
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: "Collection is excused when the State demonstrates that all listed recovery means “are not cost effective”; this limits pursuit of a past claim, not current household computation."
  - citation: "us/statute/7/2022/b/3"
    heading: "Maximum reduction absent fraud"
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: "For a nonfraud overissuance, this paragraph caps a recovery offset at the greater of 10 percent of the monthly allotment or $10; the cap applies only to post-determination collection and does not calculate the underlying allotment; the text states “If a household received an overissuance of benefits without any member of”."
  - citation: "us/statute/7/2022/b/4"
    heading: "Procedures"
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: "The State’s overissuance collection must follow its requirements for “providing notice, electing a means of payment, and establishing a time schedule for payment”; these are collection procedures."
  - citation: "us/statute/7/2022/b/5"
    heading: "Overissuances caused by systemic State errors"
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: "The provision lets the Secretary prohibit household collection after a major systemic State error and prescribes State reporting, liability, appeals, and remittance; it resolves past overissuances rather than current determinations; the text states “(A) In general If the Secretary determines that a State agency overissued”."
  - citation: "us/statute/7/2022/c"
    heading: "Intercept of unemployment benefits"
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: "The subsection defines an unrecovered overissuance and permits its recovery from unemployment compensation by agreement or garnishment; it is a post-determination debt-collection mechanism; the text states “(1) As used in this subsection, the term “uncollected overissuance” means the”."
  - citation: "us/statute/7/2022/c/1"
    heading: ""
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: "The defined “uncollected overissuance” is the portion of an overissuance that has not been recovered under subsection (b)(1); the definition is confined to post-issuance collection."
  - citation: "us/statute/7/2022/c/2"
    heading: ""
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: "A State may periodically use unemployment-compensation information to determine whether an individual owes an uncollected overissuance; this identifies a debt for recovery, not SNAP eligibility or allotment; the text states “A State agency may determine on a periodic basis, from information supplied”."
  - citation: "us/statute/7/2022/c/3"
    heading: ""
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: "The paragraph recovers an uncollected overissuance through agreed withholding or a court garnishment of unemployment compensation; it is a post-determination collection procedure; the text states “A State agency may recover an uncollected overissuance— (A) by— (i) entering”."
  - citation: "us/statute/7/2022/d"
    heading: "Recovery of overissuance of benefits"
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: "An overissuance not recovered under subsection (b)(1) may be taken from Federal pay, pensions, or an income-tax refund; this is collection of a past claim, not household benefit computation; the text states “The amount of an overissuance of benefits, as determined under subsection (b)(1)”."
  - citation: "us/statute/7/2023"
    heading: "Administrative and judicial review; restoration of rights"
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: "The section prescribes notice and administrative or judicial review of retailer and State-agency actions, plus a one-year limit on retroactive restoration of wrongfully withheld allotments; all content concerns review or post-determination remedies; the text states “(a) (1) Whenever an application of a retail food store or wholesale”."
  - citation: "us/statute/7/2023/a"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "This subsection supplies notice, administrative review, hearings, and judicial review for retail stores, wholesale concerns, and State agencies; it does not govern household eligibility or benefit amounts; the text states “(1) Whenever an application of a retail food store or wholesale food”."
  - citation: "us/statute/7/2023/a/1"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "Notice must issue when a retailer application is denied, a store is sanctioned or forfeits a bond, or a retailer or State-agency claim is denied; the named parties are program entities, not households; the text states “Whenever an application of a retail food store or wholesale food concern”."
  - citation: "us/statute/7/2023/a/2"
    heading: "Delivery of notices .—"
    status: excluded
    reason: no_household_computation
    basis: "The Secretary may choose any delivery form that “will provide evidence of the delivery” of the entity notice under paragraph (1); this is notice administration."
  - citation: "us/statute/7/2023/a/3"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "An aggrieved store, concern, or State agency has ten days to request an opportunity to submit supporting information; this is entity-review procedure with no household calculation; the text states “If such store, concern, or State agency is aggrieved by such action”."
  - citation: "us/statute/7/2023/a/4"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "The administrative determination becomes final if the store, concern, or State agency does not request review or submit information; it concerns finality of entity sanctions and claims; the text states “If such a request is not made or if such store, concern”."
  - citation: "us/statute/7/2023/a/5"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "A designated reviewer considers information from a store, concern, or State agency and issues a final determination effective after notice; the paragraph regulates entity review only; the text states “If such request is made by such store, concern, or State agency”."
  - citation: "us/statute/7/2023/a/6"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "Section 2025(c) claim determinations, including good-cause findings about penalties, must be made on the record after an agency hearing before administrative law judges; this is State-agency claims procedure; the text states “Determinations regarding claims made pursuant to section 2025(c) of this title (including”."
  - citation: "us/statute/7/2023/a/7"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "Administrative law judges may issue and enforce subpoenas and appoint expert witnesses for the referenced claim proceedings; this hearing authority has no household computational content; the text states “Such judges shall have authority to issue and enforce subpoenas in the”."
  - citation: "us/statute/7/2023/a/8"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "The Secretary may not limit judges’ authority in determinations of section 2025(c) claims; this protects adjudicatory authority for State-agency claims; the text states “The Secretary may not limit the authority of such judges presiding over”."
  - citation: "us/statute/7/2023/a/9"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "The Secretary must provide a summary procedure for section 2025(c) claims “in amounts less than $50,000”; this threshold selects State-agency review procedure, not household benefits."
  - citation: "us/statute/7/2023/a/10"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "The summary procedure for small section 2025(c) claims need not include an oral hearing; this is adjudicatory procedure without household-level content; the text states “Such summary procedure need not include an oral hearing”."
  - citation: "us/statute/7/2023/a/11"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "For a claim below $50,000, the Secretary may permit full administrative review instead of summary review; the choice concerns State-agency claim procedure; the text states “On a petition by the State agency or sua sponte, the Secretary”."
  - citation: "us/statute/7/2023/a/12"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "An administrative law judge’s section 2025(c) claim determination becomes final and effective thirty days after final notice; this is finality procedure for State-agency claims; the text states “Subject to the right of judicial review hereinafter provided, a determination made”."
  - citation: "us/statute/7/2023/a/13"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "An aggrieved store, concern, or State agency may seek judicial review within thirty days in a specified court; this governs entity litigation, not household determinations; the text states “If the store, concern, or State agency feels aggrieved by such final”."
  - citation: "us/statute/7/2023/a/14"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "A copy of the summons and complaint challenging an agency order must be sent to the Secretary or a designee; this is service-of-process administration; the text states “The copy of the summons and complaint required to be delivered to”."
  - citation: "us/statute/7/2023/a/15"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "Judicial review is generally a trial de novo, while section 2025(c) claims are reviewed on the administrative record; this sets standards of entity review; the text states “The suit in the United States district court or State court shall”."
  - citation: "us/statute/7/2023/a/16"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "If an administrative action is invalid, the reviewing court enters a judgment or order consistent with law and evidence; this remedial court authority contains no household rule; the text states “If the court determines that such administrative action is invalid, it shall”."
  - citation: "us/statute/7/2023/a/17"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "An entity’s administrative action remains effective during judicial review unless a court grants a temporary stay after notice and hearing; this is litigation procedure; the text states “During the pendency of such judicial review, or any appeal therefrom, the”."
  - citation: "us/statute/7/2023/a/18"
    heading: "Suspension of stores pending review .—"
    status: excluded
    reason: no_household_computation
    basis: "A retail store’s or wholesale concern’s permanent disqualification takes effect upon receipt of notice, and the Secretary owes no lost-sales value if it is reversed; this is retailer enforcement; the text states “Notwithstanding any other provision of this subsection, any permanent disqualification of a”."
  - citation: "us/statute/7/2023/b"
    heading: ""
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: "In a judicial action, wrongfully withheld allotments may be restored only for a one-year lookback tied to filing or discovery dates; this limits a retroactive remedy and does not set point-in-time eligibility or allotment; the text states “In any judicial action arising under this chapter, any allotments found to”."
  - citation: "us/statute/7/2024"
    heading: "Violations and enforcement"
    status: pending
    note: "The section is mixed: most provisions establish criminal penalties, forfeiture, and enforcement administration, but subsections (b) and (c) let a court suspend an individual from SNAP participation for an additional period of up to 18 months, which affects household-level eligibility. The manifest-listed us/statutes/7/2015/b/1.yaml was inspected and implements the referenced mandatory section 2015(b)(1) disqualification (including the section 2024 conviction threshold), but not section 2024’s discretionary additional suspension; no section 2024 module appears in the manifest."
  - citation: "us/statute/7/2024/a"
    heading: "In general"
    status: excluded
    reason: no_household_computation
    basis: "The Secretary may arrange issuance or redemption “as necessary or appropriate to protect the interests of the United States or to ensure enforcement”; this is enforcement authority, not an ordinary household eligibility or benefit calculation; the text states “Notwithstanding any other provision of this chapter, the Secretary may provide for”."
  
  - citation: "us/statute/7/2024/b"
    heading: "Unauthorized use, transfer, acquisition, alteration, or possession of benefits"
    status: pending
    note: "This subsection mixes criminal fines, imprisonment, and restitution with a household-relevant rule allowing the court to suspend a convicted person from SNAP for up to 18 additional months. us/statutes/7/2015/b/1.yaml covers the referenced mandatory disqualification under § 2015(b)(1), but not this additional court-imposed suspension."
  - citation: "us/statute/7/2024/b/1"
    heading: ""
    status: pending
    note: "Besides criminal penalties, this paragraph permits an additional SNAP suspension of up to 18 months, which can change a person’s point-in-time participation. us/statutes/7/2015/b/1.yaml covers the separate mandatory disqualification referenced here but does not encode this discretionary additional period."
  - citation: "us/statute/7/2024/b/2"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "The paragraph lets a court assign approved work “for the purpose of providing restitution” and suspend the criminal sentence after successful completion. It supplies no SNAP household eligibility or allotment rule."
  - citation: "us/statute/7/2024/c"
    heading: "Presentation for payment or redemption of benefits that have been illegally received, transferred, or used"
    status: pending
    note: "The provision chiefly sets criminal penalties for illegal presentation or redemption, but it also lets the court suspend the convicted person from SNAP for up to 18 additional months. The encoded mandatory disqualification in us/statutes/7/2015/b/1.yaml does not cover that extra discretionary period."
  - citation: "us/statute/7/2024/d"
    heading: "Benefits as obligations of the United States"
    status: excluded
    reason: no_household_computation
    basis: "The provision only deems issued benefits to be “obligations of the United States” for purposes of title 18. It does not determine household eligibility or benefit amount."
  - citation: "us/statute/7/2024/e"
    heading: "Forfeiture of property involved in illegal benefit transactions"
    status: excluded
    reason: no_household_computation
    basis: "The provision authorizes forfeiture of “nonfood items, moneys, negotiable instruments, securities, or other things of value” exchanged for benefits and directs regulatory disposal procedures. This is enforcement against transaction property, not a household eligibility or allotment computation."
  - citation: "us/statute/7/2024/f"
    heading: "Criminal forfeiture"
    status: excluded
    reason: no_household_computation
    basis: "The subsection orders forfeiture of property used in felony benefit offenses and distributes sale proceeds to enforcement agencies and retailer-compliance investigations. It contains no household-level SNAP determination; the text states “(1) In general In imposing a sentence on a person convicted of”."
  - citation: "us/statute/7/2024/f/1"
    heading: "In general"
    status: excluded
    reason: no_household_computation
    basis: "The paragraph requires a sentencing court to order forfeiture “in addition to any other sentence” for a subsection (b) or (c) offense. It does not change household eligibility or benefits."
  - citation: "us/statute/7/2024/f/2"
