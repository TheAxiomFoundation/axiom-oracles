findings:
  - "The only directly encoded provision in this slice is § 2017(a): `us/statutes/7/2017/a.yaml` exists in the pinned inventory and its summary and rules cover the statutory allotment formula. The containing § 2017 row remains pending because subsections (b)–(f) include additional unencoded household rules."
  - "No `operationalized_by` exclusion was safe in this slice. In particular, `us/regulations/7-cfr/273/10.yaml` realizes the initial-month under-$10 nonissuance rule in § 2017(c)(1), but not that paragraph's day-proration formula or the full initial-month context, so § 2017(c) and (c)(1) remain pending."
  - "`us/regulations/7-cfr/273/3.yaml` covers the duplicate-participation bar implicated by § 2020(e)(18)(A), but no pinned module covers that row's prisoner exclusion in subparagraph (B); the mixed row therefore remains pending."
  - "Unencoded household computations include the § 2016(h)(8) card-fee allotment reduction, § 2016a stolen-benefit claim and cap rules, the § 2016(i) State-funded eligibility option, § 2017(d) sanctions, § 2017(f) facility-resident allotments, and § 2020(s) transitional benefits."
  - "Numeric expedited-service screens in § 2020(e)(9) were excluded as procedural because they control only the seven-day delivery timeline, while § 2020(e)(10) remains pending because continuation during an appeal changes the household's point-in-time benefit level."
  - "The cross-program rules in § 2017(b) and § 2020(u)(2) remain pending: the former controls treatment of SNAP benefits in other laws, and the latter directly confers free-lunch and free-breakfast eligibility; no pinned module covers either effect."
  - "Section 2016a(b)(2) contains a theft-date window ending December 20, 2024. The current source still supplies that household replacement computation, and the taxonomy has no expired-provision exclusion, so it was left pending rather than treated as reserved."
  - "The assigned slice contains 207 unique citation paths in source order, with no duplicate citations or missing bodies except the intentionally empty repealed § 2020(f). Its 57 null source headings are preserved as YAML null."
