rows:
  - citation: "us/statute/7/2016/b"
    heading: "Use"
    status: excluded
    reason: no_household_computation
    basis: 'The rule that benefits may be used “only to purchase food from retail food stores” governs transaction use and retailer participation; it does not determine household eligibility or an allotment amount.'
  
  - citation: "us/statute/7/2016/c"
    heading: "Design"
    status: excluded
    reason: no_household_computation
    basis: 'The subsection requires EBT cards to be “simple in design” and bars public officials’ names from cards, which are card-design requirements with no household computation.'
  
  - citation: "us/statute/7/2016/c/1"
    heading: "In general"
    status: excluded
    reason: no_household_computation
    basis: 'The requirement that EBT cards be “simple in design” and contain only explanatory words or illustrations concerns card appearance, not eligibility or benefit amount.'
  
  - citation: "us/statute/7/2016/c/2"
    heading: "Prohibition"
    status: excluded
    reason: no_household_computation
    basis: 'The prohibition that a public official’s name “shall not appear on any EBT card” regulates card design and has no household-level computational rule.'
  
  - citation: "us/statute/7/2016/d"
    heading: "Delivery and control procedures"
    status: excluded
    reason: no_household_computation
    basis: 'The Secretary must prescribe benefit-delivery controls “to ensure adequate accountability”; this governs issuers and administrative control, not household eligibility or allotment calculation.'
  
  - citation: "us/statute/7/2016/e"
    heading: "State issuance liability"
    status: excluded
    reason: no_household_computation
    basis: 'The State agency is “strictly liable to the Secretary” for issuance-related financial losses, a Federal-State liability rule that does not compute any household’s eligibility or benefits.'
  
  - citation: "us/statute/7/2016/f"
    heading: "Alternative benefit delivery"
    status: excluded
    reason: no_household_computation
    basis: 'The subsection directs States to “issue or deliver benefits using alternative methods” and governs retailer point-of-sale costs, obsolete coupon and voucher media, and terminal identifiers; none of those provisions determines household eligibility or allotment amount.'
  
  - citation: "us/statute/7/2016/f/1"
    heading: "In general"
    status: excluded
    reason: no_household_computation
    basis: 'The Secretary may require a State agency to “issue or deliver benefits using alternative methods” for program integrity, which changes delivery administration rather than a household determination.'
  
  - citation: "us/statute/7/2016/f/2"
    heading: "Imposition of costs"
    status: excluded
    reason: no_household_computation
    basis: 'The paragraph allocates “100 percent of the costs” of EBT point-of-sale equipment to participating retailers, subject to retailer exemptions; it contains no household computation.'
  
  - citation: "us/statute/7/2016/f/3"
    heading: "Devaluation and termination of issuance of paper coupons"
    status: excluded
    reason: no_household_computation
    basis: 'The paragraph provides that “only an EBT card issued under subsection (i) shall be eligible for exchange” and terminates paper coupon issuance and redemption; it regulates benefit media rather than household eligibility or allotment value.'
  
  - citation: "us/statute/7/2016/f/4"
    heading: "Termination of manual vouchers"
    status: excluded
    reason: no_household_computation
    basis: 'The rule states that “no State shall issue manual vouchers” except in circumstances such as system failures or disasters, a payment-media rule with no household-level computation.'
  
  - citation: "us/statute/7/2016/f/5"
    heading: "Unique identification number required"
    status: excluded
    reason: no_household_computation
    basis: 'The paragraph requires EBT service providers to maintain “unique terminal identification number information” and regulates point-of-sale devices; it does not determine household eligibility or benefit amount.'
  
  - citation: "us/statute/7/2016/g"
    heading: "Staggered issuance procedures"
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: 'The subsection permits staggering issuance dates and limits the interval between issuances while expressly requiring the procedure to “not reduce the allotment”; it changes scheduling, not point-in-time eligibility or amount.'
  
  - citation: "us/statute/7/2016/g/1"
    heading: null
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: 'The paragraph authorizes a procedure for “staggering the issuance of benefits” across days of the month, which affects delivery timing but not household eligibility or allotment amount.'
  
  - citation: "us/statute/7/2016/g/2"
    heading: "Requirements.—"
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: 'The requirements say staggered issuance must “not reduce the allotment” and must avoid intervals longer than 40 days; these are scheduling safeguards with no point-in-time determination effect.'
  
  - citation: "us/statute/7/2016/h"
    heading: "Electronic benefit transfers"
    status: pending
    note: 'Most of the subsection regulates EBT systems, retailers, fees, and access, but paragraph (8)(A) authorizes a card-replacement charge “by reducing the monthly allotment” and no module in the pinned file tree encodes that household-level amount rule.'
  
  - citation: "us/statute/7/2016/h/1"
    heading: "In general.—"
    status: excluded
    reason: no_household_computation
    basis: 'The paragraph requires States to implement systems in which independently determined benefits “are issued from and stored in a central databank”; it governs EBT procurement and operation, not the underlying household determination.'
  
  - citation: "us/statute/7/2016/h/2"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: 'The Secretary must establish “standards for the approval of such a system” covering recipient protection, retailer participation, security, reliability, testing, and procurement; those system standards contain no household eligibility or allotment calculation.'
  
  - citation: "us/statute/7/2016/h/3"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: 'The paragraph conditions approval of mandatory EBT systems on “a sufficient number of eligible retail food stores” and operational equipment, protecting retail access without computing a household’s eligibility or allotment.'
  
  - citation: "us/statute/7/2016/h/4"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: 'The provision makes EBT administrative costs “eligible for reimbursement” under Federal-State funding rules; it does not govern a household determination.'
  
  - citation: "us/statute/7/2016/h/5"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: 'The Secretary must “periodically inform State agencies” about advantages of electronic benefit systems over coupons, an interagency communication duty with no household computation.'
  
  - citation: "us/statute/7/2016/h/6"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: 'The provision says the subsection “shall not diminish the authority of the Secretary” to test automated or electronic delivery systems; it neither determines household eligibility nor calculates benefits.'
  
  - citation: "us/statute/7/2016/h/7"
    heading: "Replacement of benefits .—"
    status: excluded
    reason: no_household_computation
    basis: 'The paragraph directs that EBT replacement-and-liability regulations be “similar to” paper-system regulations, but supplies no household eligibility predicate or replacement-amount calculation of its own.'
  
  - citation: "us/statute/7/2016/h/8"
    heading: "Replacement of cards .—"
    status: pending
    note: 'Subparagraph (A) permits a State charge for a replacement card “by reducing the monthly allotment,” a direct household amount rule absent from the pinned module tree; the remainder mixes card-withholding procedure and protections for vulnerable households.'
  
  - citation: "us/statute/7/2016/h/9"
    heading: "Optional photographic identification.—"
    status: excluded
    reason: no_household_computation
    basis: 'The paragraph permits an EBT card to “contain a photograph of 1 or more members” and requires procedures allowing other household members or authorized representatives to use it; these are card-access rules, not eligibility or benefit computations.'
  
  - citation: "us/statute/7/2016/h/10"
    heading: "Federal law not applicable .—"
    status: excluded
    reason: no_household_computation
    basis: 'The provision says 15 U.S.C. § 1693o-2 “shall not apply to electronic benefit transfer or reimbursement systems”, a systems-law rule with no household-level calculation.'
  
  - citation: "us/statute/7/2016/h/11"
    heading: "Application of anti-tying restrictions to electronic benefit transfer systems.—"
    status: excluded
    reason: no_household_computation
    basis: 'The rule that “A company may not sell or provide electronic benefit transfer services” on specified tying conditions regulates vendors and contracts rather than household determinations.'
  
  - citation: "us/statute/7/2016/h/12"
    heading: "Recovering electronic benefits.—"
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: 'The paragraph directs a State agency to “expunge benefits that have not been accessed” after the specified inactivity period and establishes related storage, notice, and restoration procedures; it does not alter point-in-time SNAP eligibility or the allotment originally determined.'
  
  - citation: "us/statute/7/2016/h/13"
    heading: "Fees.—"
    status: excluded
    reason: no_household_computation
    basis: 'The rule that “No interchange fees shall apply” to EBT transactions regulates payment-system charges without computing household eligibility or allotment.'
  
  - citation: "us/statute/7/2016/h/14"
    heading: "Mobile technologies.—"
    status: excluded
    reason: no_household_computation
    basis: 'The paragraph directs the Secretary to “authorize the use of mobile technologies” and prescribes demonstration-project plans, retailer costs, security, evaluation, and reporting; these are access and program-administration requirements, not household computations.'
  
  - citation: "us/statute/7/2016/i"
    heading: "State option to issue benefits to certain individuals made ineligible by welfare reform"
    status: pending
    note: 'Paragraph (1) permits benefits for individuals otherwise ineligible under named welfare-reform provisions, and paragraph (4) delegates “eligibility standards” and “benefit levels” to an approved State plan. The pinned 7 CFR 273.4 module covers ordinary Federal citizenship and alien-status eligibility, not this State-funded option, so coverage is not complete.'
  
  - citation: "us/statute/7/2016/i/1"
    heading: "In general"
    status: pending
    note: 'This State option changes who may receive benefits by reaching an individual “ineligible ... solely as a result of” named welfare-reform provisions. The pinned 7 CFR 273.4 module encodes ordinary Federal citizenship and alien-status eligibility but does not encode this optional State-funded eligibility override.'
  
  - citation: "us/statute/7/2016/i/2"
    heading: "State payments to Secretary"
    status: excluded
    reason: no_household_computation
    basis: 'The paragraph requires the State to reimburse the Secretary for “the value of the benefits” and Federal issuance costs and directs how receipts are credited; that is intergovernmental accounting, not a household computation.'
  
  - citation: "us/statute/7/2016/i/3"
    heading: "Reporting"
    status: excluded
    reason: no_household_computation
    basis: 'The State agency must comply with Secretary-established “reporting requirements” to use the option, an administrative condition that does not itself determine any household’s eligibility or benefit level.'
  
  - citation: "us/statute/7/2016/i/4"
    heading: "Plan"
    status: pending
    note: 'The required State plan expressly contains “eligibility standards” and “benefit levels,” which are household-level computational rules delegated outside this provision. No pinned module covers those State-plan standards.'
  
  - citation: "us/statute/7/2016/i/5"
    heading: "Violations"
    status: pending
    note: 'The paragraph makes any Federal “sanction, disqualification, fine, or other penalty” apply to violations involving these benefits. Because disqualification can change household eligibility and the incorporated penalty rules are not fully realized by a confirmed module for this option, exclusion would overstate closure.'
  
  - citation: "us/statute/7/2016/i/6"
    heading: "Ineligibility for administrative reimbursement"
    status: excluded
    reason: no_household_computation
    basis: 'Administrative and other issuance costs “shall not be eligible for Federal funding”; this allocates government costs without determining household eligibility or benefit amount.'
  
  - citation: "us/statute/7/2016/i/7"
    heading: "Exclusion from enhanced payment accuracy systems"
    status: excluded
    reason: no_household_computation
    basis: 'The provision says § 2025(c) “shall not apply to benefits issued under this subsection”, an exclusion from payment-accuracy administration with no household-level determination rule.'
  
  - citation: "us/statute/7/2016/j"
    heading: "Interoperability and portability of electronic benefit transfer transactions"
    status: excluded
    reason: no_household_computation
    basis: 'The subsection requires that “supplemental nutrition assistance program benefits are portable, among all States”, sets contract standards and waivers, and funds switching and settlement costs; it regulates systems and State administration, not household eligibility or allotment.'
  
  - citation: "us/statute/7/2016/j/1"
    heading: "Definitions"
    status: excluded
    reason: no_household_computation
    basis: 'The paragraph defines interoperability as “a system that enables program benefits” to be redeemed in any State and defines related EBT terms for payment-system administration; none is a household eligibility or benefit formula.'
  
  - citation: "us/statute/7/2016/j/2"
    heading: "Requirement"
    status: excluded
    reason: no_household_computation
    basis: 'The Secretary must ensure EBT systems are interoperable and benefits are portable “among all States”, which governs transaction infrastructure rather than household computation.'
  
  - citation: "us/statute/7/2016/j/3"
    heading: "Cost"
    status: excluded
    reason: no_household_computation
    basis: 'The cost of interoperability and portability “shall not be imposed on any retail store” or approved wholesale concern, a vendor-cost rule with no household determination.'
  
  - citation: "us/statute/7/2016/j/4"
    heading: "Standards"
    status: excluded
    reason: no_household_computation
    basis: 'The paragraph orders the Secretary to “adopt a uniform national standard of interoperability and portability” and require compatible EBT contract terms, which are system and procurement requirements rather than household-level computations.'
  
  - citation: "us/statute/7/2016/j/5"
    heading: "Exemptions"
    status: excluded
    reason: no_household_computation
    basis: 'The paragraph permits the Secretary to “temporarily exempt” a State agency and supplies contract and smart-card exemptions from EBT interoperability requirements; those exemptions concern State systems, not household eligibility or benefit amount.'
  
  - citation: "us/statute/7/2016/j/6"
    heading: "Funding"
    status: excluded
    reason: no_household_computation
    basis: 'The Secretary “shall pay 100 percent of the costs incurred by a State agency” for qualifying switching and settlement, subject to a $500,000 annual cap; this is an administrative reimbursement rule with no household computation.'
  
  - citation: "us/statute/7/2016/k"
    heading: "Acceptance of program benefits through online transactions"
    status: excluded
    reason: no_household_computation
    basis: 'The subsection requires retailers to “ensure benefits are not used to pay delivery, ordering, convenience, or other fees or charges” and governs approval, protections, State access duties, and demonstrations; it does not calculate household eligibility or allotments.'
  
  - citation: "us/statute/7/2016/k/1"
    heading: "In general"
    status: excluded
    reason: no_household_computation
    basis: 'The Secretary must “approve retail food stores to accept benefits” through online transactions, a retailer-participation rule without household computational content.'
  
  - citation: "us/statute/7/2016/k/2"
    heading: "Requirements to accept benefits"
    status: excluded
    reason: no_household_computation
    basis: 'The retailer must “ensure benefits are not used to pay delivery, ordering, convenience, or other fees or charges”, disclose charges, and secure transactions; these regulate benefit use and retail operations, not eligibility or allotment amount.'
  
  - citation: "us/statute/7/2016/k/3"
    heading: "State agency action"
    status: excluded
    reason: no_household_computation
    basis: 'The State agency must ensure recipients can use benefits online “as appropriate”, an access-administration duty that contains no household computation.'
  
  - citation: "us/statute/7/2016/k/4"
    heading: "Demonstration project on acceptance of benefits through on-line transactions"
    status: excluded
    reason: no_household_computation
    basis: 'The paragraph directs projects to “test the feasibility of allowing retail food stores to accept benefits through on-line transactions” and retailer plans covering controls, education, testing, data, reporting, and security; it does not determine household eligibility or allotment.'
  
  - citation: "us/statute/7/2016a"
    heading: "EBT benefit fraud prevention"
    status: pending
    note: 'The section is mostly security guidance, coordination, appropriations, and reporting, but subsection (b)(2) computes household replacement benefits as the lesser of stolen benefits or two months of prior allotments and adds household frequency and date conditions. No pinned module encodes that rule.'
  
  - citation: "us/statute/7/2016a/a"
    heading: "Guidance; rulemaking"
    status: excluded
    reason: no_household_computation
    basis: 'The subsection directs the Secretary to “issue guidance to State agencies” along with rulemaking, interagency coordination, data standards, and a congressional report; even its instruction to issue replacement procedures supplies no household formula or eligibility criterion itself.'
  
  - citation: "us/statute/7/2016a/a/1"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: 'The paragraph orders guidance describing measures for “detecting and preventing theft of benefits,” including skimming and cloning, which is State and payment-system administration with no household computation.'
  
  - citation: "us/statute/7/2016a/a/2"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: 'The Secretary must “promulgate regulations through notice-and-comment rulemaking” requiring State security measures described in guidance; this is an agency rulemaking command, not a household eligibility or amount rule.'
  
  - citation: "us/statute/7/2016a/a/3"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: 'The paragraph sets a deadline for regulations requiring “procedures for the replacement of benefits consistent with subsection (b)”, but it supplies no independent household eligibility predicate or replacement calculation.'
  
  - citation: "us/statute/7/2016a/a/4"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: 'The Secretary must coordinate with agencies, retailers, and contractors to study theft and “establish standard reporting methods for States”; those are program-security duties with no household computation.'
  
  - citation: "us/statute/7/2016a/a/5"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: 'The paragraph requires “a report that includes” information on theft, industry standards, State plans, and prevention recommendations; reporting does not determine household eligibility or benefit amount.'
  
  - citation: "us/statute/7/2016a/b"
    heading: "Replacement of benefits"
    status: pending
    note: 'The subsection mixes State-plan and claims procedures with a household formula: replacement is capped at the lesser of the stolen amount or two months of the household’s prior monthly allotment, with frequency and theft-date conditions. No module in the pinned tree encodes these replacement determinations.'
  
  - citation: "us/statute/7/2016a/b/1"
    heading: null
    status: pending
    note: 'The required State plan mixes reporting and hearing procedure with “criteria to determine if a submitted claim is valid,” which determines household access to replacement benefits. Those delegated validation criteria are not covered by a confirmed pinned module.'
  
  - citation: "us/statute/7/2016a/b/2"
    heading: null
    status: pending
    note: 'This paragraph directly caps a household replacement at the lesser of the stolen amount or two months of its prior allotment, limits replacement frequency, and applies a theft-date window. No pinned module encodes that household-level computation.'
  
  - citation: "us/statute/7/2016a/b/3"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: 'Approved State replacement plans “will remain in effect until the effective date” of the replacement regulation; this plan-transition rule does not itself determine household eligibility or amount.'
  
  - citation: "us/statute/7/2016a/b/4"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: 'The paragraph says compliant replacements “shall not be regarded as losses” for State-liability purposes, an accounting classification with no household computation.'
  
  - citation: "us/statute/7/2016a/c"
    heading: "Definitions"
    status: excluded
    reason: no_household_computation
    basis: 'The subsection merely adopts the meanings of “allotment,” “benefit,” “household,” “retail food store,” and “State agency” from § 2012 and contains no independent computational rule.'
  
  - citation: "us/statute/7/2016a/d"
    heading: "Rescission"
    status: excluded
    reason: no_household_computation
    basis: 'The subsection provides that “$8,000,000 is hereby rescinded” from unobligated program balances, an appropriations action that does not determine any household’s eligibility or benefits.'
  
  - citation: "us/statute/7/2016a/e"
    heading: "Comptroller General"
    status: excluded
    reason: no_household_computation
    basis: 'The subsection requires “a report that examines risks” related to EBT payment-system security, management practices, oversight, and policy options; it has no household-level computation.'
  
  - citation: "us/statute/7/2016a/e/1"
    heading: "In general"
    status: excluded
    reason: no_household_computation
    basis: 'The paragraph requires “a report that examines risks” related to EBT security and stolen benefits; this reporting mandate does not determine household eligibility or allotment.'
  
  - citation: "us/statute/7/2016a/e/2"
    heading: "Contents"
    status: excluded
    reason: no_household_computation
    basis: 'The rule that the report “shall include an assessment” of Department, State, retailer, oversight, and security practices and policy options contains no household computation.'
  
  - citation: "us/statute/7/2017"
    heading: "Value of allotment"
    status: pending
    note: 'The pinned us/statutes/7/2017/a.yaml fully covers subsection (a), and us/regulations/7-cfr/273/10.yaml covers the initial-month under-$10 nonissuance, but the section also contains uncovered household rules including § 2017(c) day proration, public-assistance sanction adjustments, and facility-resident allotments. Coverage of this containing section is therefore partial.'
  
  - citation: "us/statute/7/2017/a"
    heading: "Calculation"
    status: encoded
    encoded_by: ["us/statutes/7/2017/a.yaml"]

  - citation: "us/statute/7/2017/b"
    heading: "Benefits not deemed income or resources for certain purposes"
    status: pending
    note: "This is a household-level cross-program computation rule: SNAP benefits may not be counted as income or resources under other laws, and other assistance may not be decreased because of SNAP receipt. No listed statute or regulation module covers that full cross-program rule."
  
  - citation: "us/statute/7/2017/c"
    heading: "First month benefits prorated"
    status: pending
    note: "The subsection changes household allotment amounts through day proration and a $10 initial-month floor, and defines when those rules apply. us/regulations/7-cfr/273/10.yaml encodes the under-$10 nonissuance rule but explicitly defers month-of-application determinations and does not encode the statutory day-proration formula; paragraph (3) is issuance procedure."
  
  - citation: "us/statute/7/2017/c/1"
    heading: null
    status: pending
    note: "This paragraph computes an initial allotment as the ratio of days remaining to total days and suppresses an allotment below $10. us/regulations/7-cfr/273/10.yaml covers the $10 rule but not the day-proration formula, so coverage is partial."
  
  - citation: "us/statute/7/2017/c/2"
    heading: null
    status: pending
    note: "The definition of “initial month” determines which households receive prorated benefits, including a special rule for migrant or seasonal farmworker households after more than 30 days without participation. No listed module encodes this definition."
  
  - citation: "us/statute/7/2017/c/3"
    heading: "Optional combined allotment for expedited households .—"
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: "The State may issue the initial and following-month allotments together, but the combined issuance must be “equal to the total amount of the initial allotment and the first regular allotment.” It changes delivery timing, not eligibility or total benefit amount."
  
  - citation: "us/statute/7/2017/d"
    heading: "Reduction of public assistance benefits"
    status: pending
    note: "The subsection can prevent an income-related allotment increase and permit a State reduction of up to 25 percent when another means-tested benefit is sanctioned. That household benefit computation is not covered by us/regulations/7-cfr/273/11/c.yaml or another listed module."
  
  - citation: "us/statute/7/2017/d/1"
    heading: "In general"
    status: pending
    note: "The paragraph bars an allotment increase attributable to a public-assistance sanction and permits a household allotment reduction “by not more than 25 percent.” No listed module encodes this sanction computation."
  
  - citation: "us/statute/7/2017/d/2"
    heading: "Rules and procedures"
    status: pending
    note: "Although phrased as authorization to use TANF “rules and procedures,” those imported rules may govern whether and how a household’s SNAP allotment is reduced. With no encoding of that cross-program reduction and no basis to isolate procedure from substantive effect, exclusion would be unsafe."
  
  - citation: "us/statute/7/2017/e"
    heading: "Allotments for households residing in centers"
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: "For an already-covered individual, the subsection governs delivery of the allotment to “the center as an authorized representative” and to the individual after departure. It does not alter eligibility or calculate the allotment amount."
  
  - citation: "us/statute/7/2017/e/1"
    heading: "In general"
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: "The paragraph permits an existing allotment to be provided to “the center as an authorized representative” for part of a month and to the individual on leaving. This is an issuance arrangement, not an eligibility or amount rule."
  
  - citation: "us/statute/7/2017/e/2"
    heading: "Direct payment"
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: "It permits the State to require designation of a treatment center “as the authorized representative” for receiving an allotment. The designation does not determine whether the individual is eligible or how much the individual receives."
  
  - citation: "us/statute/7/2017/f"
    heading: "Alternative procedures for residents of certain group facilities"
    status: pending
    note: "Paragraph (1) contains household-level amount rules for residents of covered facilities, including standardized allotments and proration after departure, while paragraphs (2) and (3) govern pilots and nationwide authorization. No listed module encodes the paragraph (1) computations, so the mixed parent remains pending."
  
  - citation: "us/statute/7/2017/f/1"
    heading: "In general"
    status: pending
    note: "The paragraph requires each resident’s allotment to be calculated under standardized procedures, limits a facility to the resident’s proportion of the month, and requires a post-departure allotment for remaining days. Those household amount rules are not encoded by any listed module."
  
  - citation: "us/statute/7/2017/f/2"
    heading: "Pilot projects"
    status: excluded
    reason: no_household_computation
    basis: "The Secretary must conduct pilot projects and a State project plan must specify facilities, reports, and “procedures for standardizing allotment amounts.” The quoted “procedures for standardizing allotment amounts” establish pilot administration but supply no operative household eligibility or benefit formula."
  
  - citation: "us/statute/7/2017/f/3"
    heading: "Authorization of implementation in all States"
    status: excluded
    reason: no_household_computation
    basis: "The Secretary must “determine whether to authorize implementation of paragraph (1) in all States” and must notify congressional committees and terminate pilots after specified findings. Those program-governance decisions contain no household eligibility or benefit computation."
  
  - citation: "us/statute/7/2018"
    heading: "Approval of retail food stores and wholesale food concerns"
    status: excluded
    reason: no_household_computation
    basis: "The section regulates authorization, oversight, incentives, and redemption by retailers, wholesalers, facilities, and private establishments—for example, applicants seek approval to “accept and redeem benefits”. It contains no rule computing a household’s eligibility or allotment."
  
  - citation: "us/statute/7/2018/a"
