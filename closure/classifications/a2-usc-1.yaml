rows:
  - citation: "us/statute/7"
    heading: "AGRICULTURE"
    status: excluded
    reason: container_heading
    basis: "The title node has no body text; “AGRICULTURE” is only the heading for the child provisions."
  - citation: "us/statute/7/2011"
    heading: "Congressional declaration of policy"
    status: excluded
    reason: no_household_computation
    basis: "The section declares congressional policy “to safeguard the health and well-being of the Nation’s population” and authorizes a program in general terms; it supplies no rule for calculating a household’s eligibility or allotment."
  - citation: "us/statute/7/2012"
    heading: "Definitions"
    status: pending
    note: "This parent section mixes administrative definitions with household-computational definitions for medical expenses, elderly or disabled members, homelessness, household composition, and the Thrifty Food Plan. The direct modules cover § 2012(m)(4) and only the household aggregation step of § 2012(j), not the section as a whole."
  - citation: "us/statute/7/2012/a"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: "The provision defines an “Access device” as a card, code, account number, or other means used to obtain or transfer benefits; it governs benefit-access infrastructure rather than household eligibility or amount."
  - citation: "us/statute/7/2012/b"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: "The provision only defines “Allotment” as “the total value of benefits a household is authorized to receive during each month”; it does not determine that value."
  - citation: "us/statute/7/2012/c"
    heading: null
    status: pending
    note: "The enumerated “allowable medical expenses” determine the medical deduction base and therefore household net income and benefit amount. The encoded § 273.10 module consumes resolved total medical expenses and expressly defers deductible-expense determination, so it does not fully operationalize this definition."
  - citation: "us/statute/7/2012/d"
    heading: "Benefit .—"
    status: excluded
    reason: no_household_computation
    basis: "The provision defines “benefit” by its delivery through “an electronic benefit transfer” or another assistance mechanism; it does not set household eligibility or the value delivered."
  - citation: "us/statute/7/2012/d/1"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: "The paragraph identifies “an electronic benefit transfer under section 2016(h)” as a means of providing a benefit, an issuance mechanism with no household calculation."
  - citation: "us/statute/7/2012/d/2"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: "The paragraph permits “other means of providing assistance, as determined by the Secretary”; it concerns delivery method rather than household eligibility or amount."
  - citation: "us/statute/7/2012/e"
    heading: "Benefit Issuer .—"
    status: excluded
    reason: no_household_computation
    basis: "The provision defines a “benefit issuer” as a State office or contracted or delegated entity responsible for issuance, which is program administration rather than household computation."
  - citation: "us/statute/7/2012/f"
    heading: null
    status: pending
    note: "The provision defines the period for which a household “shall be eligible to receive benefits,” including a 24-month rule for households whose adults are elderly or disabled and an extension for transitional benefits. Because those durations can govern point-in-time benefit receipt and the § 273.10 module expressly defers certification-period determination, procedural exclusion would be unsafe."
  - citation: "us/statute/7/2012/g"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: "The provision defines “Coupon” as a coupon, stamp, certificate, card, cash, or check issued in lieu of one; this is benefit-delivery terminology with no household calculation."
  - citation: "us/statute/7/2012/h"
    heading: null
    status: pending
    note: "The definition of a qualifying drug addiction or alcoholic treatment and rehabilitation program is used by the special household and food-treatment rules for program residents. No encoded module resolves whether a program meets this statutory definition."
  - citation: "us/statute/7/2012/i"
    heading: "EBT Card .—"
    status: excluded
    reason: no_household_computation
    basis: "The provision defines an “EBT card” by reference to the electronic-transfer issuance system in section 2016(h); it contains no household eligibility or amount rule."
  - citation: "us/statute/7/2012/j"
    heading: null
    status: pending
    note: "This subsection’s seven categories determine elderly-or-disabled status, which changes income tests and deductions. us/statutes/7/2012/j.yaml only aggregates an input fact named snap_member_is_elderly_or_disabled across household members; it does not compute any of the seven statutory categories."
  - citation: "us/statute/7/2012/j/1"
    heading: null
    status: pending
    note: "Age 60 or older is a substantive elderly-member criterion. The § 2012(j) module consumes member status as an input instead of encoding this age test."
  - citation: "us/statute/7/2012/j/2"
    heading: null
    status: pending
    note: "Receipt of SSI and specified federal or State disability assistance is a substantive disabled-member criterion. The § 2012(j) module does not encode these benefit-receipt and stringency tests."
  - citation: "us/statute/7/2012/j/3"
    heading: null
    status: pending
    note: "The paragraph treats specified disability or blindness payments and permanent governmental disability retirement as disabled-member criteria. Those tests are not computed by the § 2012(j) module."
  - citation: "us/statute/7/2012/j/4"
    heading: null
    status: pending
    note: "A veteran’s total disability, aid-and-attendance, or permanently-housebound status is a substantive disabled-member criterion. The § 2012(j) module leaves this status as an unresolved input."
  - citation: "us/statute/7/2012/j/5"
    heading: null
    status: pending
    note: "The paragraph defines qualifying surviving-spouse combinations of veterans’ benefits and permanent disability. The § 2012(j) module does not encode these tests."
  - citation: "us/statute/7/2012/j/6"
    heading: null
    status: pending
    note: "The paragraph defines qualifying children of veterans through incapacity or specified benefits plus permanent disability. The § 2012(j) module does not encode these tests."
  - citation: "us/statute/7/2012/j/7"
    heading: null
    status: pending
    note: "The Railroad Retirement annuity and hypothetical Social Security coverage/application conditions are substantive disabled-member criteria. The § 2012(j) module does not encode them."
  - citation: "us/statute/7/2012/k"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: "The provision defines what benefits may purchase, from “food or food product for home consumption” through specified prepared meals and Alaska subsistence equipment; it does not calculate household eligibility or allotment."
  - citation: "us/statute/7/2012/l"
    heading: null
    status: pending
    note: "The definition of “Homeless individual” can change household treatment and the ABAWD exemption. The § 273.24 module accepts member_is_homeless as an input and does not encode this definition."
  - citation: "us/statute/7/2012/l/1"
    heading: null
    status: pending
    note: "Lacking “a fixed and regular nighttime residence” is a substantive route to homeless status. Existing modules consume homeless status as an input rather than computing this criterion."
  - citation: "us/statute/7/2012/l/2"
    heading: null
    status: pending
    note: "The shelter, institution, temporary-accommodation, and public-place alternatives determine homeless status and downstream eligibility treatment. Existing modules do not compute these alternatives."
  - citation: "us/statute/7/2012/m"
    heading: null
    status: pending
    note: "The subsection defines who constitutes a SNAP household and includes multiple substantive composition rules. Only paragraph (4) is directly encoded; paragraphs (1)–(3) and (5) remain uncovered."
  - citation: "us/statute/7/2012/m/1"
    heading: null
    status: pending
    note: "Separate or shared customary food purchase and preparation determines the household unit and therefore eligibility and allotment size. No module encodes this composition test."
  - citation: "us/statute/7/2012/m/2"
    heading: null
    status: pending
    note: "The mandatory grouping of spouses, parents with children 21 or younger, and certain minors with a person exercising parental control changes household composition. No module encodes these grouping rules."
  - citation: "us/statute/7/2012/m/3"
    heading: null
    status: pending
    note: "The elderly-and-disabled separate-household exception combines age, disability, inability to prepare food, spouse treatment, and a 165-percent poverty test. No module encodes this rule."
  - citation: "us/statute/7/2012/m/4"
    heading: null
    status: encoded
    encoded_by: ["us/statutes/7/2012/m/4.yaml"]
  - citation: "us/statute/7/2012/m/5"
    heading: null
    status: pending
    note: "The paragraph creates five institution-residency exceptions that allow specified people to constitute individual households. No module encodes these household-status exceptions."
  - citation: "us/statute/7/2012/n"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: "The provision defines a “Reservation” as the geographic area over which a tribal organization exercises jurisdiction; it is jurisdictional administration, not household computation."
  - citation: "us/statute/7/2012/o"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: "The subsection defines which establishments and services qualify as a “Retail food store,” including stocking, sales, and delivery-service conditions; these are retailer-authorization rules, not household eligibility or benefit calculations."
  - citation: "us/statute/7/2012/o/1"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: "The paragraph qualifies retailers through continuous offerings in four staple-food categories or “over 50 percent” staple-food sales; it computes retailer status, not household eligibility or amount."
  - citation: "us/statute/7/2012/o/2"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: "The paragraph includes specified establishments, organizations, programs, and group living arrangements in the retail-store definition; it is retailer classification with no household calculation."
  - citation: "us/statute/7/2012/o/3"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: "The paragraph includes “a store purveying the hunting and fishing equipment” described elsewhere; it classifies a retailer rather than a household."
  - citation: "us/statute/7/2012/o/4"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: "The paragraph includes nonprofit cooperative purchasing ventures and direct-marketing agricultural producers in the retail-store definition; it contains no household eligibility or amount rule."
  - citation: "us/statute/7/2012/o/5"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: "The paragraph sets purchasing, notice, delivery-fee, and no-markup conditions for a food purchasing and delivery service; these govern service authorization and transactions, not a household’s eligibility or allotment."
  - citation: "us/statute/7/2012/p"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: "The provision states that “Secretary” means the Secretary of Agriculture, an administrative definition with no household rule."
  - citation: "us/statute/7/2012/q"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: "The subsection defines staple-food categories and excludes accessory foods; those categories govern retailer qualification rather than household eligibility or amount."
  - citation: "us/statute/7/2012/q/1"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: "The paragraph lists meat, bread or cereals, vegetables or fruits, and dairy as “staple foods”; it is a retailer-inventory classification, not a household calculation."
  - citation: "us/statute/7/2012/q/2"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: "The paragraph excludes accessory items such as coffee, drinks, candy, condiments, and spices from “staple foods”; it does not determine household eligibility or allotment."
  - citation: "us/statute/7/2012/r"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: "The provision defines “State” to include the fifty States, specified territories, and qualifying tribal reservations; it sets program jurisdiction rather than a household computation."
  - citation: "us/statute/7/2012/s"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: "The provision defines “State agency” as government offices or capable tribal organizations administering the programs; it allocates administrative identity and responsibility, not household eligibility or amount."
  - citation: "us/statute/7/2012/t"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: "The provision defines “Supplemental nutrition assistance program” as “the program operated pursuant to this chapter”; it contains no computational rule."
  - citation: "us/statute/7/2012/u"
    heading: "Thrifty Food Plan"
    status: pending
    note: "This subsection supplies the benefit-base methodology, household-size ratios, geographic and CPI adjustments, and market-basket constraints. Fiscal-year maximum-allotment policy tables realize selected current dollar outcomes, but they do not fully encode this statutory methodology across periods and re-evaluations."
  - citation: "us/statute/7/2012/u/1"
    heading: "In general The term “thrifty food plan” means the diet required to feed a family of 4 persons consisting of a man and a woman ages 20 through 50, a child ages 6 through 8, and a child ages 9 through 11 using the items and quantities of food described in the report of the Department of Agriculture entitled “Thrifty Food Plan, 2021”, and each successor report updated pursuant to this subsection, subject to the conditions that—"
    status: pending
    note: "The paragraph makes the Thrifty Food Plan cost the basis for uniform allotments and restricts changes to the statutory adjustment and re-evaluation routes. Current fiscal-year policy tables provide dollar values but do not encode these governing conditions."
  - citation: "us/statute/7/2012/u/2"
    heading: "Household adjustments .—"
    status: pending
    note: "The paragraph directly computes household-size amounts from 30, 55, 79, 100, 119, 143, 158, and 180 percent ratios plus the capped additional-person rule. Current policy modules store fiscal-year dollar tables and increments rather than encoding the statutory ratio formula in full."
  - citation: "us/statute/7/2012/u/3"
    heading: "Allowable cost adjustments .—"
    status: pending
    note: "The paragraph requires geographic cost adjustments and annual October 1 CPI adjustment, which determine household allotment amounts. Fiscal-year policy tables contain selected published outcomes but do not encode the full adjustment methodology."
  - citation: "us/statute/7/2012/u/4"
    heading: "Re-evaluation of market baskets"
    status: pending
    note: "The paragraph authorizes post-2027 market-basket re-evaluation while prohibiting a resulting cost increase, a constraint on the benefit base. No module encodes this re-evaluation and cost-neutrality rule."
  - citation: "us/statute/7/2012/v"
    heading: null
    status: excluded
    reason: no_household_computation
    basis: "The provision defines “Tribal organization” as a recognized tribal governing body or specified treaty entity; it is an administrative-entity definition with no household calculation."
  - citation: "us/statute/7/2012a"
    heading: "Publicly operated community health centers"
    status: pending
    note: "The section extends provisions concerning private nonprofit drug or alcohol treatment programs to publicly operated community health centers, changing which treatment settings receive the special participant treatment. No module encodes that extension."
  - citation: "us/statute/7/2013"
    heading: "Establishment of supplemental nutrition assistance program"
    status: pending
    note: "The section is mixed: most provisions establish and finance program administration, but subsection (b) bars simultaneous SNAP/FDPIR participation and makes certain FDPIR-disqualified individuals ineligible for SNAP. Those household eligibility rules are not encoded."
  - citation: "us/statute/7/2013/a"
    heading: "Program"
    status: excluded
    reason: no_household_computation
    basis: "The subsection establishes issuance to already “eligible households,” restricts benefit use and redemption, and computes Federal and State program cost shares from State payment-error rates; it does not determine a household’s eligibility or allotment."
  - citation: "us/statute/7/2013/a/1"
    heading: "Establishment"
    status: excluded
    reason: no_household_computation
    basis: "The paragraph authorizes issuance to already “eligible households,” conditions State participation on sales-tax policy, restricts purchases to approved stores, and provides Treasury redemption; it supplies no household eligibility or amount formula."
  - citation: "us/statute/7/2013/a/2"
    heading: "State quality control incentive"
    status: excluded
    reason: no_household_computation
    basis: "The paragraph maps a State’s “payment error rate” to Federal and State shares of allotment costs and implementation years; this is intergovernmental program financing, not a household calculation."
  - citation: "us/statute/7/2013/a/3"
    heading: "Maximum Federal payment"
    status: excluded
    reason: no_household_computation
    basis: "The paragraph caps what the Secretary may pay toward allotment costs at “the applicable Federal share”; it governs Federal reimbursement rather than a household’s allotment."
  - citation: "us/statute/7/2013/b"
    heading: "Food distribution program on Indian reservations"
    status: pending
    note: "The subsection mixes program administration, purchasing, and appropriations with household-level bars on simultaneous SNAP/FDPIR participation and SNAP eligibility after FDPIR disqualification. Because those substantive rules are unencoded, the mixed parent remains pending."
  - citation: "us/statute/7/2013/b/1"
    heading: "In general"
    status: excluded
    reason: no_household_computation
    basis: "The paragraph requires commodity distribution when a tribal organization requests concurrent or separate program operations; it governs program availability and administration rather than household computation."
  - citation: "us/statute/7/2013/b/2"
    heading: "Administration"
    status: pending
    note: "The paragraph mixes assignment of distribution responsibility with a substantive prohibition against a plan permitting a household to participate simultaneously in SNAP and FDPIR. The encoded duplicate-SNAP rule in § 273.3 does not cover this cross-program prohibition."
  - citation: "us/statute/7/2013/b/3"
    heading: "Disqualified participants"
    status: pending
    note: "The paragraph makes an individual disqualified from FDPIR ineligible for SNAP for a Secretary-determined period, directly changing point-in-time eligibility. No module encodes this cross-program disqualification."
  - citation: "us/statute/7/2013/b/4"
    heading: "Administrative costs"
    status: excluded
    reason: no_household_computation
    basis: "The paragraph sets the Federal share of “administrative costs and distribution costs,” waiver criteria, tribal contributions, and protections for tribal benefits or services; it does not compute household eligibility or allotment."
  - citation: "us/statute/7/2013/b/5"
    heading: "Bison meat"
    status: excluded
    reason: no_household_computation
    basis: "The paragraph authorizes the Secretary, subject to appropriations, to purchase bison meat from specified producers for commodity recipients; it is procurement rather than household computation."
  - citation: "us/statute/7/2013/b/6"
    heading: "Traditional and locally- and regionally-grown food fund"
    status: excluded
    reason: no_household_computation
    basis: "The paragraph establishes a food-purchasing fund, a producer sourcing goal, procurement standards, and a $5,000,000 authorization; these are procurement and appropriations rules, not household calculations."
  - citation: "us/statute/7/2013/b/7"
    heading: "Availability of funds"
    status: excluded
    reason: no_household_computation
    basis: "The paragraph specifies that program and administrative-cost funds remain available for obligation for “2 fiscal years”; it is fiscal administration with no household rule."
  - citation: "us/statute/7/2013/c"
    heading: "Regulations; transmittal of copy of regulations to Congressional committees prior to issuance"
    status: excluded
    reason: no_household_computation
    basis: "The subsection directs the Secretary to promulgate regulations under 5 U.S.C. 553 and send Congress a copy with justification before issuance; it is rulemaking administration, not household computation."
  - citation: "us/statute/7/2014"
    heading: "Eligible households"
    status: pending
    note: "The section aggregates many household eligibility, income, deduction, budgeting, resource, and special-population rules. The available 2014 modules fully cover only selected children; several modules expressly defer aggregate outputs, so the section is not fully encoded."
  - citation: "us/statute/7/2014/a"
    heading: "Income and other financial resources as substantial limiting factors in obtaining more nutritious diet; recipients under Social Security Act"
    status: pending
    note: "us/statutes/7/2014/a.yaml derives categorical participation bases but expressly defers final SNAP participation eligibility because cross-referenced exceptions and resource computation are incomplete. us/regulations/7-cfr/273/2/j.yaml also leaves general-assistance and optional expanded categorical eligibility separate."
  - citation: "us/statute/7/2014/b"
    heading: "Eligibility standards"
    status: excluded
    reason: no_household_computation
    basis: "This provision directs the Secretary to establish uniform standards and conditions approval of a State agency's \"plan of operation\"; it supplies no household-level eligibility or benefit calculation of its own."
  - citation: "us/statute/7/2014/c"
    heading: "Gross income standard"
    status: encoded
    encoded_by: ["us/statutes/7/2014/c.yaml"]
  - citation: "us/statute/7/2014/c/1"
    heading: null
    status: encoded
    encoded_by: ["us/statutes/7/2014/c.yaml"]
  - citation: "us/statute/7/2014/c/2"
    heading: null
    status: encoded
    encoded_by: ["us/statutes/7/2014/c.yaml"]
  - citation: "us/statute/7/2014/d"
    heading: "Exclusions from income"
    status: pending
    note: "us/statutes/7/2014/d.yaml encodes only paragraphs (2) and (7) and expressly defers the aggregate exclusion output and several other branches. us/regulations/7-cfr/273/9.yaml likewise defers detailed income-exclusion composition."
  - citation: "us/statute/7/2014/d/1"
    heading: null
    status: pending
    note: "The rule excluding gains or benefits not payable directly to the household is not encoded; us/regulations/7-cfr/273/9.yaml consumes resolved exclusions and expressly defers their composition."
  - citation: "us/statute/7/2014/d/2"
    heading: null
    status: pending
    note: "us/statutes/7/2014/d.yaml treats the exclusion as min(certification-period irregular income, $30), but the statute excludes irregular income only when it is “not in excess of $30 in a quarter.” The module neither represents the quarterly measurement nor the all-or-nothing over-limit condition, so coverage is not full."
  - citation: "us/statute/7/2014/d/3"
    heading: null
    status: pending
    note: "The educational-loan, grant, scholarship, fellowship, and veterans' benefit exclusion and its school-expense limits are absent from the direct statute module; 7 CFR 273.9's encoding defers exclusion composition."
  - citation: "us/statute/7/2014/d/4"
    heading: null
    status: pending
    note: "The exclusion for noneducational loans on which repayment is deferred is not encoded, and the 7 CFR 273.9 module leaves detailed exclusions deferred."
  - citation: "us/statute/7/2014/d/5"
    heading: null
    status: pending
    note: "The reimbursement and annual school-clothing allowance rules, including the TANF and living-expense exceptions, are not represented in the direct statute module or the deferred 7 CFR 273.9 exclusion layer."
  - citation: "us/statute/7/2014/d/6"
    heading: null
    status: pending
    note: "The exclusions for third-party-beneficiary care funds and legally obligated child support paid outside the household are not encoded; downstream modules only consume resolved income or deduction amounts."
  - citation: "us/statute/7/2014/d/7"
    heading: null
    status: encoded
    encoded_by: ["us/statutes/7/2014/d.yaml"]
  - citation: "us/statute/7/2014/d/8"
    heading: null
    status: pending
    note: "The nonrecurring lump-sum exclusion, charitable-donation cap, and requirement to count the payments as resources are not encoded; both income- and resource-composition regulation modules defer these details."
  - citation: "us/statute/7/2014/d/9"
    heading: null
    status: pending
    note: "No module computes the cost-of-producing-self-employment-income exclusion or the special treatment when farming costs exceed farming income."
  - citation: "us/statute/7/2014/d/10"
    heading: null
    status: pending
    note: "us/statutes/7/2014/d.yaml expressly defers the exclusion because the income categories excluded by other Federal laws are not enumerated in the available encoding."
  - citation: "us/statute/7/2014/d/11"
    heading: null
    status: pending
    note: "The Federal energy-assistance and one-time weatherization or emergency-repair payment exclusions are not encoded; the utility-allowance modules address shelter calculations, not this income classification."
  - citation: "us/statute/7/2014/d/12"
    heading: null
    status: pending
    note: "No module implements the through-September-30 exclusion of specified midyear Social Security, railroad-retirement, or veterans' cost-of-living increases."
  - citation: "us/statute/7/2014/d/13"
    heading: null
    status: pending
    note: "us/statutes/7/2014/d.yaml expressly defers advance earned-income-credit payments because the upstream 26 USC 3507 classification is not encoded."
  - citation: "us/statute/7/2014/d/14"
    heading: null
    status: pending
    note: "us/statutes/7/2014/d.yaml expressly defers the work-related and dependent-care payment exclusion because the cited 2015 and 2025 rules are not available as a complete dependency."
  - citation: "us/statute/7/2014/d/15"
    heading: null
    status: pending
    note: "The exclusion for amounts necessary to fulfill a Social Security Act plan for achieving self-support is not encoded in the statute or regulation modules."
  - citation: "us/statute/7/2014/d/16"
    heading: null
    status: pending
    note: "The optional Medicaid-aligned exclusion for educational assistance is part of the State-option treatment expressly deferred by us/statutes/7/2014/d.yaml."
  - citation: "us/statute/7/2014/d/17"
    heading: null
    status: pending
    note: "The optional exclusion of State complementary-assistance payments is part of the State-option treatment expressly deferred by us/statutes/7/2014/d.yaml."
  - citation: "us/statute/7/2014/d/18"
    heading: null
    status: pending
    note: "The TANF- or medical-assistance-aligned State option and its prohibited categories are expressly deferred by us/statutes/7/2014/d.yaml and are not supplied by 7 CFR 273.9's module."
  - citation: "us/statute/7/2014/d/19"
    heading: null
    status: pending
    note: "No module implements the exclusion for additional combat-zone pay or its deployment and prior-receipt conditions."
  - citation: "us/statute/7/2014/e"
    heading: "Deductions from income"
    status: pending
    note: "The available statute and regulation modules implement pieces of the earned-income and shelter calculations, but the standard, dependent-care, child-support, medical, and shelter provisions are not all fully covered."
  - citation: "us/statute/7/2014/e/1"
    heading: "Standard deduction"
    status: pending
    note: "The FY 2026 policy module supplies current deduction tables, but no direct statute module encodes this paragraph's percentage formulas, territorial rules, minimums, annual CPI adjustment, and unrounded-prior-period requirement as a whole."
  - citation: "us/statute/7/2014/e/2"
    heading: "Earned income deduction"
    status: pending
    note: "us/statutes/7/2014/e/2.yaml encodes the 20 percent calculation and work-supplementation subtraction, but it does not implement paragraph (C)'s overissuance exception; the nested B module expressly defers the adjusted deduction output for that reason."
  - citation: "us/statute/7/2014/e/3"
    heading: "Dependent care deduction"
    status: pending
    note: "us/regulations/7-cfr/273/10.yaml subtracts an already resolved dependent-care amount but expressly defers deductible-expense determination, leaving the employment or training condition and the three excluded-expense categories unencoded."
  - citation: "us/statute/7/2014/e/4"
    heading: "Deduction for child support payments"
    status: pending
    note: "The regulation calculation consumes an already resolved child-support amount and defers expense determination; it does not encode the State election or the required ordering before the shelter deduction."
  - citation: "us/statute/7/2014/e/5"
    heading: "Excess medical expense deduction"
    status: pending
