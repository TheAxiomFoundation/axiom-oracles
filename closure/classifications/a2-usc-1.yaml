    heading: "Disqualification for certain convicted felons"
    status: pending
    note: "The subsection combines an unencoded felony/sentence-compliance disqualification, regulation-operationalized treatment of the remaining household, and an application attestation procedure."
  - citation: "us/statute/7/2015/r/1"
    heading: "In general"
    status: pending
    note: "The conviction categories and sentence/restriction compliance test directly determine eligibility; us/regulations/7-cfr/273/11/c.yaml accepts the resulting status as an input rather than determining it."
  - citation: "us/statute/7/2015/r/2"
    heading: "Effects on assistance and benefits for others"
    status: excluded
    reason: "operationalized_by: us/regulations/7-cfr/273/11/c.yaml"
    basis: "The statute requires treating the felon as ‘not to be a member of the household’ while counting that person's income and resources. The regulation module expressly includes § 273.11(s) felons, excludes them from household size, and counts their income and resources in full."
  - citation: "us/statute/7/2015/r/3"
    heading: "Enforcement"
    status: excluded
    reason: "procedural_no_point_in_time_effect"
