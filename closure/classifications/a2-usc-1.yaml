findings:
  - >-
    data/usc-51.jsonl contains 827 source records; the assigned slice, lines
    1-207, contains exactly 207 records and this output contains exactly 207
    rows. Citation paths are unique, complete, and in exact source order, with
    no duplicate or missing citation defect.
  - >-
    us/statutes/7/2012/j.yaml is only a household aggregator: it combines the
    resolved snap_member_is_elderly_or_disabled fact across members but does
    not compute the seven member-level criteria in § 2012(j). The parent and
    those substantive criteria therefore remain pending.
  - >-
    The § 2014 income, deduction, and resource modules are partial:
    us/statutes/7/2014/a.yaml defers final SNAP participation eligibility;
    us/statutes/7/2014/d.yaml has a complete rule only for paragraph (7), while
    its paragraph (2) formula does not realize the statutory quarterly,
    all-or-nothing $30 condition and it defers the aggregate exclusion output;
    us/statutes/7/2014/e/2.yaml does not cover paragraph (C), leaving the
    adjusted earned-income deduction deferred; and
    us/statutes/7/2014/g.yaml defers complete countable resources and the
    paragraph (3) self-sufficiency-resource output. The corresponding § 273.8,
    § 273.9, and § 273.10 modules likewise consume or defer resource-exclusion,
    income-exclusion, and deductible-expense composition.
  - >-
    us/statutes/7/2015/b/1.yaml encodes the violation categories, duration
    constants, and no-increase rule, but it has no determination-date or
    current-period test that makes the one- and two-year sanctions operative
    at a point in time; § 2015(b)(1) therefore remains pending.
  - >-
    Confirmed direct statutory coverage is limited to § 2012(m)(4);
    § 2014(c), (c)(1), and (c)(2); § 2014(d)(7);
    § 2015(d)(2); and § 2015(e) with paragraphs (1)-(8), using the encoded_by
    paths recorded on those rows.
  - >-
    Certification and reporting provisions were kept pending when they have
    direct benefit effects: § 2012(f) defines 12- and 24-month eligibility
    periods and a transitional-benefit extension, while § 2015(c)(1) includes
    reinstatement without a new application, protection against allotment
    delay or reduction, and a 2-year certification period for specified
    reservation households. Treating those mixed provisions as purely
    procedural would overstate closure.
  - >-
    Two exclusions required narrower judgment. Section 2014(b) was treated as
    no household computation because it regulates the Secretary's uniform
    standards and State plan approval without supplying an eligibility test,
    even though it bars States from adding other standards. Section
    2015(i)(2) was treated as procedural because paragraph (1) supplies the
    optional disqualification and paragraph (2) only permits reuse of title
    IV-A rules and procedures; the substantive reapplication rule in
    paragraph (3) remains pending.
  - >-
    Section 2015(r)(2) is fully operationalized by
    us/regulations/7-cfr/273/11/c.yaml: the module excludes the disqualified
    felon from household size while counting that person's income and
    resources in full.
  - >-
    The current § 2015(o)(3) exceptions materially differ from
    us/regulations/7-cfr/273/24.yaml: the statute includes an over-65
    threshold, responsibility for a child under 14, and Indian-status
    exceptions that the module's different criteria do not fully realize.
  - >-
    The source text has confirmed transcription artifacts. Section
    2015(o)(6) embeds doubled footnote numerals and editorial text after
    paragraph (4), and contains "(C), (D),," followed by another doubled
    footnote marker. Section 2015(r) renders the title 42 reference as
    "as defined in 13925(a) 3 3 So in original. Probably should be preceded by
    “section”. of title 42," omitting "section" from the statutory reference
    and flattening the footnote into the body.
