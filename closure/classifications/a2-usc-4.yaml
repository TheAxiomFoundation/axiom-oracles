findings:
  - "No direct us/statutes/7 module in the pinned inventory covers any assigned citation from 7 U.S.C. 2027(h) through 2036d."
  - "The inspected us/regulations/7-cfr/273/7.yaml fully realizes the exact workfare exemptions in §2029(b)(1) and (b)(3)–(5): its exemption OR includes the referenced categories, unfitness, age under 16, and age 60 or older, and an exempt result bypasses workfare compliance. The same module expressly defers optional-workfare election, operation, assignment, and sanction context, so the remaining substantive §2029 rows are pending."
  - "The Minnesota Family Investment Project provisions are not directly encoded. Ordinary SNAP modules may supply underlying calculations, but they do not implement the Project's eligibility unit, benefit overlays, transition rules, or sanctions."
  - "No 7 CFR 273.25 module is present. Existing 7 CFR 273.2(j), 273.9, and 273.10 and 7 U.S.C. 2017(a) modules overlap pieces of §2035 but do not implement the complete simplified Program, so computational §2035 rows remain pending."
  - "The §2036a eligible-individual rows are conservatively pending because they compute access to nutrition-education benefits even though they do not change a SNAP allotment; the rest of that section is grant and service administration."
  - "Puerto Rico's phased cash-benefit restriction was excluded because it regulates benefit-delivery form and plan approval, not who is eligible or the amount of nutrition assistance."
  - "The slice has 82 null headings, represented as empty strings; this is normal child-provision granularity. The only empty bodies are the repealed §§2030 and 2033, and no citation is duplicated."
  - "Section 2031 contains source-note artifacts such as “parts A and F 1 1 See References” and “482(h) 1”; these appear to be footnote-marker transcription artifacts, not duplicate provisions."
