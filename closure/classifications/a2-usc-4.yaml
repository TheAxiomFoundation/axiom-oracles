  - citation: "us/statute/7/2031/d/3"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "The text includes “Payments under paragraph (1)(B) shall include adjustments, as estimated under a methodology satisfactory to the…”. It calculates grants and adjustments payable to the State, not eligibility or assistance payable to an individual household."
  - citation: "us/statute/7/2031/e"
    heading: "Waiver"
    status: pending
    note: "The Secretary must waive any chapter requirement that would prevent the Project, potentially suspending household eligibility or benefit rules. The provision does not identify the waived rules, and no module or waiver instrument establishes its full computational effect."
  - citation: "us/statute/7/2031/f"
    heading: "Project audits"
    status: excluded
    reason: no_household_computation
    basis: "The text includes “The Comptroller General of the United States shall— (1) conduct periodic audits of the operation of the Project to…”. It requires Project audits or reports concerning amounts payable to the State and supplies no household decision rule."
  - citation: "us/statute/7/2031/f/1"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "The text includes “conduct periodic audits of the operation of the Project to verify the amounts payable to the State from time to time…”. It requires Project audits or reports concerning amounts payable to the State and supplies no household decision rule."
  - citation: "us/statute/7/2031/f/2"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "The text includes “submit to the Secretary, the Secretary of Health and Human Services, the Committee on Agriculture of the House of…”. It requires Project audits or reports concerning amounts payable to the State and supplies no household decision rule."
  - citation: "us/statute/7/2031/g"
    heading: "Construction"
    status: pending
    note: "The subsection gives participating families a deemed legal status and protects amounts eligible households would otherwise receive, while also imposing a federal-cost limitation. Its household-level effects are unencoded."
  - citation: "us/statute/7/2031/g/1"
    heading: ""
    status: pending
    note: "Designated Project cash assistance must be treated like SNAP allotments and participating families like SNAP participants under other laws. No confirmed encoding implements this household-level deeming rule."
  - citation: "us/statute/7/2031/g/2"
    heading: ""
    status: pending
    note: "Subparagraph (A) protects the amounts the State and eligible households would otherwise receive, while subparagraph (B) caps federal costs. This mixed household-benefit and fiscal rule is not encoded."
  - citation: "us/statute/7/2031/h"
    heading: "Quality control"
    status: excluded
    reason: no_household_computation
    basis: "The text includes “Participating families shall be excluded from any sample taken for purposes of making any determination under section…”. It governs quality control, evaluation design, or evaluation funding and does not determine a household's benefits."
  - citation: "us/statute/7/2031/i"
    heading: "Evaluation"
    status: excluded
    reason: no_household_computation
    basis: "The text includes “The State shall develop and implement a plan for an independent evaluation designed to provide reliable information…”. It governs quality control, evaluation design, or evaluation funding and does not determine a household's benefits."
  - citation: "us/statute/7/2031/i/1"
    heading: ""
    status: excluded
