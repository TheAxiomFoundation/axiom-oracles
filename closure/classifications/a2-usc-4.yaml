  - citation: "us/statute/7/2030"
    heading: "Repealed. Pub. L. 110–234, title IV, § 4115(b)(14) , May 22, 2008 , 122 Stat. 1108 , and Pub. L. 110–246, § 4(a) , title IV, § 4115(b)(14), June 18, 2008 , 122 Stat. 1664 , 1870"
    status: excluded
    reason: reserved
    basis: "The source body is empty and the heading expressly states “Repealed.”"
  - citation: "us/statute/7/2031"
    heading: "Minnesota Family Investment Project"
    status: pending
    note: "The section creates the Minnesota Family Investment Project and includes project-family eligibility, SNAP ineligibility, household-composition rules, alternative benefit calculations, and sanctions. No direct statute or regulation module implements the Project overlay."
  - citation: "us/statute/7/2031/a"
    heading: "In general"
    status: excluded
    reason: no_household_computation
    basis: "The text includes “Subject to paragraph (2), upon written application of the State of Minnesota that complies with this section and…”. It authorizes and conditions the Minnesota demonstration at the State-program level without specifying a point-in-time household eligibility or benefit-amount calculation."
  - citation: "us/statute/7/2031/a/1"
