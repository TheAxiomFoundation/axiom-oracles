  - citation: "us/statute/7/2031/c"
    heading: "Additional terms and conditions of Project"
    status: pending
    note: "This subsection establishes parent work-requirement exemptions, an hours cap, and a possible 10-percent assistance reduction for noncompliance. No module covers the Minnesota Project rules."
  - citation: "us/statute/7/2031/c/1"
    heading: ""
    status: pending
    note: "The paragraph defines which parents may be required to participate and lists illness, caregiving, age, work, and pregnancy exemptions. These special-population rules are unencoded."
  - citation: "us/statute/7/2031/c/2"
    heading: ""
    status: pending
    note: "A sole parent of a child under six may not be required to work or train more than 20 hours weekly. This special household rule limits sanction-triggering obligations and is not encoded."
  - citation: "us/statute/7/2031/c/3"
    heading: ""
    status: pending
    note: "For failure without good cause, family assistance may be reduced by up to 10 percent of the no-other-income amount. No module encodes this benefit reduction."
  - citation: "us/statute/7/2031/d"
    heading: "Funding"
    status: excluded
    reason: no_household_computation
    basis: "The text includes “If an application submitted under subsection (a) complies with the requirements specified in subsection (b), then the…”. It calculates grants and adjustments payable to the State, not eligibility or assistance payable to an individual household."
  - citation: "us/statute/7/2031/d/1"
    heading: ""
    status: excluded
