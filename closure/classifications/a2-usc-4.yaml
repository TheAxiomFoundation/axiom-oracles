  - citation: "us/statute/7/2029"
    heading: "Workfare"
    status: pending
    note: "This section mixes household workfare duties, exemptions, work-hour limits, reimbursements, and disqualification with program administration. The inspected 7 CFR 273.7 module explicitly defers optional-workfare operation and sanction context, so its partial overlap is not full coverage."
  - citation: "us/statute/7/2029/a"
    heading: "Program plan; guidelines; compliance"
    status: pending
    note: "Paragraph (1) makes nonexempt household members work in return for portions of the household allotment, while paragraph (2) governs local program design. The optional-workfare operation needed to implement paragraph (1) is expressly deferred by us/regulations/7-cfr/273/7.yaml."
  - citation: "us/statute/7/2029/a/1"
    heading: ""
    status: pending
    note: "This paragraph requires a nonexempt member to work and converts each hour into a portion of the household allotment at the applicable minimum wage. us/regulations/7-cfr/273/7.yaml consumes workfare participation as an input but expressly defers program operation and assignment rules."
  - citation: "us/statute/7/2029/a/2"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "The text includes “The Secretary shall promulgate guidelines pursuant to paragraph (1) which, to the maximum extent practicable, enable…”. It concerns federal guidelines and local program compatibility, without itself determining a household's eligibility or allotment."
  - citation: "us/statute/7/2029/b"
    heading: "Exempt household members"
    status: pending
    note: "The subsection contains six workfare exemptions. us/regulations/7-cfr/273/7.yaml fully covers the cross-referenced general exemptions and the unfit, under-16, and age-60 criteria, but does not cover the optional 20-hour title IV-A rule or the special caretaker rule, so the parent is only partially operationalized."
  - citation: "us/statute/7/2029/b/1"
    heading: ""
    status: excluded
    reason: "operationalized_by: us/regulations/7-cfr/273/7.yaml"
    basis: "The text includes “exempt from section 2015(d)(1) of this title as the result of clause (B), (C), (D), (E), or (F) of section 2015(d)(2)…”. The cross-referenced §2015(d)(2)(B)–(F) exemptions are all explicit inputs to the module's exemption OR, and that predicate bypasses workfare compliance in its person-level eligibility output."
  - citation: "us/statute/7/2029/b/2"
    heading: ""
    status: pending
    note: "This optional exemption requires current satisfactory participation for at least 20 hours a week in a title IV-A work activity. The regulation module has a broader resolved title IV work-requirement input but does not encode the operating-agency option or this 20-hour test."
  - citation: "us/statute/7/2029/b/3"
    heading: ""
    status: excluded
    reason: "operationalized_by: us/regulations/7-cfr/273/7.yaml"
    basis: "The text includes “mentally or physically unfit”. The module expressly treats a physically or mentally unfit member as exempt, and its eligibility output bypasses workfare compliance when that predicate holds."
  - citation: "us/statute/7/2029/b/4"
    heading: ""
    status: excluded
    reason: "operationalized_by: us/regulations/7-cfr/273/7.yaml"
    basis: "The text includes “under sixteen years of age”. The module's age threshold is exactly under 16, and its eligibility output bypasses workfare compliance for an exempt member."
  - citation: "us/statute/7/2029/b/5"
    heading: ""
    status: excluded
    reason: "operationalized_by: us/regulations/7-cfr/273/7.yaml"
    basis: "The text includes “sixty years of age or older; or”. The module's older-adult threshold is exactly age 60 or older, and its eligibility output bypasses workfare compliance for an exempt member."
  - citation: "us/statute/7/2029/b/6"
    heading: ""
    status: pending
    note: "This exempts a parent or caretaker when another household member is subject to workfare or employed full time. The general caretaker exemption in us/regulations/7-cfr/273/7.yaml is different and does not implement this household-relative condition."
  - citation: "us/statute/7/2029/c"
    heading: "Valuation or duration of work"
    status: pending
    note: "Required work is capped by both the value of the household allotment and a 30-hour combined weekly limit. The existing work-requirement module does not calculate workfare assignment hours and explicitly defers optional-workfare operation."
  - citation: "us/statute/7/2029/d"
    heading: "Nature, conditions, and costs of work"
    status: pending
    note: "The subsection mixes workplace protections with a participant reimbursement capped at $25 per month. Because the reimbursement is a person-level amount and the optional-workfare program is deferred, the subsection cannot be excluded as wholly noncomputational."
  - citation: "us/statute/7/2029/d/1"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "The text includes “not provide any work that has the effect of replacing or preventing the employment of an individual not participating…”. It prescribes worksite protections for the operating agency and does not calculate household eligibility or a benefit amount."
  - citation: "us/statute/7/2029/d/2"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "The text includes “provide the same benefits and working conditions that are provided at the job site to employees performing comparable…”. It prescribes worksite protections for the operating agency and does not calculate household eligibility or a benefit amount."
  - citation: "us/statute/7/2029/d/3"
    heading: ""
    status: pending
    note: "This computes reimbursement of necessary transportation and other participation costs, capped at $25 per month. No module encodes that person-level workfare payment."
  - citation: "us/statute/7/2029/e"
    heading: "Job search period"
    status: pending
    note: "Allowing up to 30 days of job search before assignment changes when a member becomes subject to workfare compliance and possible disqualification. The existing regulation module expressly defers optional-workfare assignment and sanction timing."
  - citation: "us/statute/7/2029/f"
    heading: "Disqualification"
    status: pending
    note: "Failure to comply can make an individual or household ineligible for SNAP. us/regulations/7-cfr/273/7.yaml consumes resolved compliance but explicitly defers sanction timing and good-cause adjudication, so coverage is partial."
  - citation: "us/statute/7/2029/g"
    heading: "Payment of administrative expenses"
    status: excluded
    reason: no_household_computation
    basis: "The text includes “The Secretary shall pay to each operating agency 50 per centum of all administrative expenses incurred by such agency…”. It determines federal payments to an operating agency or enforcement of agency compliance, not a household's eligibility or allotment."
  - citation: "us/statute/7/2029/g/1"
    heading: ""
    status: excluded
