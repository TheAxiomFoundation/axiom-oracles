  - citation: "us/statute/7/2031/i/2"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "The text includes “The State shall pay 50 percent of the cost of developing and implementing such plan and the Federal Government shall…”. It governs quality control, evaluation design, or evaluation funding and does not determine a household's benefits."
  - citation: "us/statute/7/2031/j"
    heading: "Definitions"
    status: pending
    note: "The definitions of family and caregiver determine the Project eligibility unit, while contract and State are noncomputational definitions. No module covers the substantive definitions."
  - citation: "us/statute/7/2031/j/1"
    heading: ""
    status: pending
    note: "This defines the eligible family unit through co-residence and specified relationships and includes a third-trimester pregnant woman. The household-composition rule is unencoded."
  - citation: "us/statute/7/2031/j/2"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "The text includes “The term “contract” means a plan to help a family pursue self-sufficiency, based on the State’s assessment of the…”. It defines a noncomputational Project term or geographic scope and does not determine household eligibility or assistance."
  - citation: "us/statute/7/2031/j/3"
