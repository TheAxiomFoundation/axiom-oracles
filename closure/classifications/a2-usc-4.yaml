  - citation: "us/statute/7/2031/a/2"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "The text includes “The Project may be implemented only in accordance with this section and only if the Secretary of Health and Human…”. It authorizes and conditions the Minnesota demonstration at the State-program level without specifying a point-in-time household eligibility or benefit-amount calculation."
  - citation: "us/statute/7/2031/b"
    heading: "Required terms and conditions of Project"
    status: pending
    note: "This subsection mixes Project-family eligibility, SNAP exclusions, benefit floors and reductions, household calculation rules, application procedure, and administration. Ordinary SNAP modules supply only underlying calculations and do not implement the Minnesota Project overlay."
  - citation: "us/statute/7/2031/b/1"
    heading: ""
    status: pending
    note: "Only families may be eligible for Project assistance and services. This project-eligibility class is not encoded."
  - citation: "us/statute/7/2031/b/2"
    heading: ""
    status: pending
    note: "Families assigned to and found eligible for the Project become ineligible for SNAP. No module encodes this Project-based SNAP exclusion."
  - citation: "us/statute/7/2031/b/3"
    heading: ""
    status: pending
    note: "This paragraph sets family assistance floors, treatment of child care and child support, tax adjustments, food-assistance designations, and a special allotment formula for nonproject household members. The ordinary SNAP modules do not implement these Minnesota Project adjustments."
  - citation: "us/statute/7/2031/b/4"
    heading: ""
    status: pending
    note: "The Project must provide participating families education, employment, and training services equivalent to specified SNAP E&T services. No module encodes this family-level service entitlement or equivalence rule."
  - citation: "us/statute/7/2031/b/5"
    heading: ""
    status: pending
    note: "The State may select families for the Project by application or assignment from title IV-A or SNAP populations. Because Project selection triggers distinct eligibility and benefit rules, this unencoded household-selection authority is substantive."
  - citation: "us/statute/7/2031/b/6"
    heading: ""
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: "The text includes “Whenever selection for participation in the Project is accomplished through submission and approval of an application…”. It governs application access, issuance timing, language access, or information safeguards and does not change the point-in-time eligibility or benefit formula."
  - citation: "us/statute/7/2031/b/7"
    heading: ""
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: "The text includes “Whenever selection for participation in the Project is accomplished by assigning families that are determined…”. It governs application access, issuance timing, language access, or information safeguards and does not change the point-in-time eligibility or benefit formula."
  - citation: "us/statute/7/2031/b/8"
    heading: ""
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: "The text includes “Paragraphs (1)(B) and (8) of section 2020(e) of this title shall apply with respect to applicants and participating…”. It governs application access, issuance timing, language access, or information safeguards and does not change the point-in-time eligibility or benefit formula."
  - citation: "us/statute/7/2031/b/9"
    heading: ""
    status: pending
    note: "Project assistance must be reduced by the pro rata value of SNAP benefits received for the same period. No module encodes this household-level reduction."
  - citation: "us/statute/7/2031/b/10"
    heading: ""
    status: pending
    note: "This paragraph mixes notices and screening with rules that restore SNAP eligibility and retroactive benefits after Project termination or household changes. The substantive transition rules are unencoded, so the mixed paragraph remains pending."
  - citation: "us/statute/7/2031/b/11"
    heading: ""
    status: pending
    note: "Although principally a hearing and notice incorporation, §2020(e)(10) also continues the household's prior benefit level while a timely fair hearing is pending, subject to exceptions. That point-in-time benefit effect makes the incorporated rule mixed and unencoded."
  - citation: "us/statute/7/2031/b/12"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "The text includes “For each fiscal year, the Secretary shall not be liable for any costs related to carrying out the Project in excess…”. It concerns federal costs, statewide program operation, Project duration, or the aggregate participation cap rather than a household calculation."
  - citation: "us/statute/7/2031/b/13"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "The text includes “The State shall carry out the supplemental nutrition assistance program throughout the State while the State carries…”. It concerns federal costs, statewide program operation, Project duration, or the aggregate participation cap rather than a household calculation."
  - citation: "us/statute/7/2031/b/14"
    heading: ""
    status: excluded
    reason: no_household_computation
    basis: "The text includes “Except as provided in subparagraph (B), the State will carry out the Project during a five-year period beginning on…”. It concerns federal costs, statewide program operation, Project duration, or the aggregate participation cap rather than a household calculation."
  - citation: "us/statute/7/2031/b/15"
    heading: ""
    status: excluded
    reason: no_household_computation
