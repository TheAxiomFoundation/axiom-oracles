    join_found_module: us/regulations/7-cfr/273/7.yaml
  - citation: us/regulation/7/273/8
    heading: Resource eligibility standards
    status: pending
    partial_coverage: us/regulations/7-cfr/273/8.yaml encodes the categorical exception and top-level
      resource limit, but expressly defers jointly owned resources, resource exclusions, vehicle valuation,
      and transfer-of-resources disqualification in paragraphs (d), (e), (f), and (h).
    join_found_module: us/regulations/7-cfr/273/8.yaml
  - citation: us/regulation/7/273/9
    heading: Income and deductions
    status: pending
    partial_coverage: us/regulations/7-cfr/273/9.yaml and us/regulations/7-cfr/273/9/d/6/iii.yaml encode
