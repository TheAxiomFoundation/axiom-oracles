# Main road fuel duty on unleaded petrol and heavy oil (diesel), 1 Jan 2025 to
# 31 Dec 2028, from the legislation itself. Reviewed constants are pinned in
# tests/test_uk_fuel_duty_schedule_reference.py.
#
# The Hydrocarbon Oil Duties Act 1979 s.6(1A) standing rate is £0.5795 a litre
# for both products. Since 23 March 2022 the liability has been reduced by
# orders under the Excise Duties (Surcharges or Rebates) Act 1979 s.1(2):
# "the deduction from the amount payable of the percentages specified in
# column (C)". Column (D) of each table is "only for ease of reference and
# comprehension of effect". The operative per-litre charge is therefore
# 0.5795 x (1 - pct/100), which differs from the column (D) figure by at most
# £0.0000109 a litre. HMRC publishes the column (D) figures as the rates
# (TIIN "Amended Fuel Duty rates: 2026 to 2027", 22 May 2026), and the uk-fuel-duty
# comparison uses them, so this sub-hundredth-of-a-penny gap never decides a
# row.
#
# After 28 February 2027 no reduction order is in force and nothing enacted
# changes s.6(1A), so the standing rate applies. Budget 2025 announced RPI
# uprating "from April 2027"; that is policy, not law, until a Finance Act or
# order implements it.
