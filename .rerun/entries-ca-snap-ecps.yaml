- id: ca-pe-annual-eligibility-aggregation-2026-08-12-57912-benefit
  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-57912
  kind: amount_difference
  disposition: bridge_artifact
  evidence:
    mechanism: Exact-household requested-month replay on PolicyEngine 4.18.9 / PolicyEngine-US
      1.767.3 / PolicyEngine-Core 3.30.3. The direct January 2026 simulation of
      the identical Case is ineligible with zero SNAP under every income-forcing
      counterfactual (medical, TANF, self-employment, and their combinations), so
      no January income surface reproduces the committed PolicyEngine verdict. The
      committed eligibility boolean is the comparison adapter's year-shaped output-dataset
      value — an any-month aggregation across calendar 2026 (the household qualifies
      in some non-January month, e.g. after the October 1 COLA) — while the month-defined
      benefit is January's. Axiom evaluates January only; its 33 benefit against
      PolicyEngine's January 0.0 is the same aggregation artifact.
    arithmetic:
    - expression: 0.0 - 0.0
      equals: 0.0
      tolerance: 1.0e-06
    sources:
    - dashboard/public/data/axiom-policyengine-ca-snap-ecps.json
    - axiom_oracles/adapters/policyengine/runner.py
  expires_on_source_change: true
  pinned:
    left: 33.0
    right: 0.0
    difference: -33.0
