- id: sc-pe-cat-gross-gate-2026-08-12-29732-benefit
  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-29732
  kind: amount_difference
  disposition: upstream_engine_gap
  evidence:
    mechanism: Exact-household requested-month replay on PolicyEngine 4.18.9 / PolicyEngine-US
      1.767.3 / PolicyEngine-Core 3.30.3. January PolicyEngine computes SNAP 0 with
      net income 2154.65; Axiom's persisted net income is 2155.56 under its round-30-percent-up
      election. January PolicyEngine records meets_snap_categorical_eligibility=True
      yet is_snap_eligible=False with meets_snap_gross_income_test=False — on this
      household PolicyEngine still gates eligibility on the 130-percent gross test
      despite the categorical flag — while the composed program's encoded South
      Carolina family-independence screen (its persisted household_income_at_or_below_family_independence_fpl_limit=true)
      waives the gross test, leaving Axiom eligible and paying its recorded allotment.
    arithmetic:
