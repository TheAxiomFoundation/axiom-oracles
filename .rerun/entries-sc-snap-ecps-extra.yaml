  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-28842
  kind: amount_difference
  disposition: axiom_encoding_gap
  evidence:
    mechanism: 'Exact-household requested-month replay on PolicyEngine 4.18.9 /
      PolicyEngine-US 1.767.3 / PolicyEngine-Core 3.30.3. January PolicyEngine computes
      SNAP 23.84 with net income 1317.94; Axiom''s persisted net income is 1317.94
      under its round-30-percent-up election. Broad-based categorical eligibility
      tail: January PolicyEngine confers categorical eligibility (meets_snap_categorical_eligibility=True)
      and pays the one/two-person minimum benefit although the household''s net
      income exceeds the federal limit the composed program applies, so Axiom is
      ineligible with zero benefit. Axiom-side modeling boundary (BBCE not in the
      composed program).'
