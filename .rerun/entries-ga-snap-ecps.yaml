suite: ga-snap-ecps
entries:
- id: pe-lone-minor-child-earnings-29868-benefit
  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-29868
  kind: amount_difference
  disposition: upstream_engine_gap
  linked_issue: https://github.com/PolicyEngine/policyengine-us/issues/9157
  evidence:
    mechanism: 'Reverified on PolicyEngine 4.18.9 / PolicyEngine-US 1.767.3 / PolicyEngine-Core
      3.30.3. Exact-household requested-month replay: PolicyEngine''s January snap_earned_income
      is 0 for this all-minor household (ages [13]) although the projected Case
      carries the member''s wages — PolicyEngine excludes all earnings of an imputed
      K-12 member age 17 or younger without requiring the co-resident-parent or
      parental-control condition in 7 CFR 273.9(c)(7). The sole-minor household
      is valid under 273.1(a)(1), but its wages count under 273.9(b)(1)(i), so Axiom
      correctly fails the income gate and returns zero benefit while PolicyEngine
      pays 298 (January replay 298).'
    upstream_url: https://github.com/PolicyEngine/policyengine-us/issues/9157
    arithmetic:
    - expression: 298 - 298
      equals: 0.0
      tolerance: 0.01
    sources:
    - dashboard/public/data/axiom-policyengine-ga-snap-ecps.json
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.1(a)(1)
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.9(c)(7)
  expires_on_source_change: true
  pinned:
    left: 0.0
    right: 298.0
    difference: 298.0
