- id: ca-tanf-decomp-2026-08-12-57335-benefit
  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-57335
  kind: amount_difference
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
  evidence:
    mechanism: Exact-household requested-month replay on PolicyEngine 4.18.9 / PolicyEngine-US
      1.767.3 / PolicyEngine-Core 3.30.3. January PolicyEngine computes SNAP 708.1
      with net income 1583.81. The comparison bridge zeroes TANF on the Axiom input
      surface while PolicyEngine computes state TANF endogenously and counts it
      as SNAP unearned income (axiom-oracles#397 counterfactual class); the residual
      net-income gap beyond TANF reflects the CalFresh state-vocabulary income surface
      documented for this suite's PUB-275 bridge class.
    upstream_url: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
    arithmetic:
    - expression: 708.1 - 1183
      equals: -474.900024
      tolerance: 1.0e-06
    sources:
    - dashboard/public/data/axiom-policyengine-ca-snap-ecps.json
    - axiom_oracles/data/populace_input_mapping.yaml
    - axiom_oracles/adapters/policyengine/runner.py
  expires_on_source_change: true
  pinned:
    left: 1183.0
    right: 708.0999755859375
    difference: -474.9000244140625
