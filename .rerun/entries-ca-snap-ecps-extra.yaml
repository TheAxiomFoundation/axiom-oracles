    mechanism: 'Exact-household requested-month replay on PolicyEngine 4.18.9 /
      PolicyEngine-US 1.767.3 / PolicyEngine-Core 3.30.3. January PolicyEngine computes
      SNAP 0 with net income 1776.51. Year-shaped eligibility aggregation: the direct
      January 2026 simulation of the identical Case is ineligible with zero SNAP
      under every income-forcing counterfactual, so no January income surface reproduces
      the committed PolicyEngine verdict; the committed eligibility boolean is the
      adapter''s year-shaped output-dataset value (an any-month aggregation across
