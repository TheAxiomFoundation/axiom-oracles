- id: tanf-zero-counterfactual-2354
  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-2354
  kind: amount_difference
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
  evidence:
    mechanism: Exact-household requested-month counterfactual on PolicyEngine 4.18.9
      / PolicyEngine-US 1.767.3 / PolicyEngine-Core 3.30.3. The committed comparison
      adapter replayed over the same Case projection reproduces the report pin (Axiom
      1183 versus January PolicyEngine 1173.1). Forcing the aggregate and state
      TANF inputs to zero in the direct requested-month simulation produces January
      SNAP 1183; its absolute delta from Axiom, 0.0, is within the unchanged suite
      tolerance 7.0. The comparison bridge zeroes TANF on the Axiom input surface
      while PolicyEngine computes state TANF endogenously and counts it as SNAP
      unearned income (axiom-oracles#397 counterfactual class).
    upstream_url: https://github.com/TheAxiomFoundation/axiom-oracles/issues/397
    arithmetic:
    - expression: 1183 - 1183
      equals: 0.0
      tolerance: 1.0e-06
    sources:
    - dashboard/public/data/axiom-policyengine-ma-snap-ecps.json
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.9(b)(2)(i)
    - axiom_oracles/adapters/policyengine/runner.py
  expires_on_source_change: true
  pinned:
    left: 1183.0
    right: 1173.0999755859375
    difference: -9.9000244140625
