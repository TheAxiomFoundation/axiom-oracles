- id: pe-medical-imputation-counterfactual-37422-eligibility
  concept: us:statutes/7/2014/o#snap_eligible
  case_id: ecps-37422
  kind: eligibility_right_only
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/436
  evidence:
    mechanism: Exact-household requested-month counterfactual on PolicyEngine 4.18.9
      / PolicyEngine-US 1.767.3 / PolicyEngine-Core 3.30.3. The committed comparison
      adapter replayed over the same Case projection reproduces the report pin (Axiom
      0 versus January PolicyEngine 0). Forcing the imputed medical-expense inputs
      to zero in the direct requested-month simulation produces January SNAP 0;
      its absolute delta from Axiom, 0.0, is within the unchanged suite tolerance
      7.0. Axiom receives zero medical-expense input while PolicyEngine imputes
      allowable medical expenses for the elderly/disabled member, feeding an excess
      medical deduction the bridge never projects to Axiom. The same intervention
      sets January PolicyEngine eligibility to False, matching Axiom's persisted
      verdict.
    upstream_url: https://github.com/TheAxiomFoundation/axiom-oracles/issues/436
    arithmetic:
    - expression: 0 - 0
      equals: 0.0
      tolerance: 1.0e-06
    sources:
    - dashboard/public/data/axiom-policyengine-al-snap-ecps.json
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.9(b)(2)(i)
    - axiom_oracles/adapters/policyengine/runner.py
  expires_on_source_change: true
  pinned:
    left: false
    right: true
- id: al-bbce-tail-2026-08-12-eligibility
  concept: us:statutes/7/2014/o#snap_eligible
  case_selector:
    case_ids:
    - ecps-36581
  disposition: axiom_encoding_gap
  evidence:
    mechanism: 'Reverified per-row on PolicyEngine 4.18.9 / PolicyEngine-US 1.767.3
      / PolicyEngine-Core 3.30.3 via exact-household requested-month replay: for
      every selected row January PolicyEngine grants broad-based categorical eligibility
      (meets_snap_categorical_eligibility=True) while a standard federal income
      test fails, and pays the resulting benefit (one/two-person minimums where
      net income leaves no normal allotment). The composed program applies only
      the standard federal tests, so Axiom is ineligible with zero benefit. Axiom-side
      modeling boundary. Per-row flags: ecps-36581: categorical=True, net_test=False,
      gross_test=True, January PE 23.84.'
    sources:
    - dashboard/public/data/axiom-policyengine-al-snap-ecps.json
  expires_on_source_change: true
  kind: eligibility_right_only
  linked_issue: https://github.com/TheAxiomFoundation/rulespec-us/issues/1098
