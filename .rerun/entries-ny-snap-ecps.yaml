suite: ny-snap-ecps
entries:
- id: pe-medical-imputation-counterfactual-4756
  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-4756
  kind: amount_difference
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/436
  evidence:
    mechanism: Exact-household requested-month counterfactual on PolicyEngine 4.18.9
      / PolicyEngine-US 1.767.3 / PolicyEngine-Core 3.30.3. The committed comparison
      adapter replayed over the same Case projection reproduces the report pin (Axiom
      24 versus January PolicyEngine 36.1). Forcing the imputed medical-expense
      inputs to zero in the direct requested-month simulation produces January SNAP
      23.84; its absolute delta from Axiom, 0.16, is within the unchanged suite
      tolerance 7.0. Axiom receives zero medical-expense input while PolicyEngine
      imputes allowable medical expenses for the elderly/disabled member, feeding
      an excess medical deduction the bridge never projects to Axiom.
    upstream_url: https://github.com/TheAxiomFoundation/axiom-oracles/issues/436
    arithmetic:
    - expression: 23.84 - 24
      equals: -0.16
      tolerance: 0.160001
    sources:
    - dashboard/public/data/axiom-policyengine-ny-snap-ecps.json
    - https://www.ecfr.gov/current/title-7/chapter-II/subchapter-C/part-273#p-273.9(b)(2)(i)
    - axiom_oracles/adapters/policyengine/runner.py
  expires_on_source_change: true
  pinned:
    left: 24.0
    right: 36.0999755859375
    difference: 12.0999755859375
- id: endogenous-income-stack-counterfactual-4766
  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-4766
  kind: amount_difference
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/436
  evidence:
    mechanism: Exact-household requested-month counterfactual on PolicyEngine 4.18.9
      / PolicyEngine-US 1.767.3 / PolicyEngine-Core 3.30.3. The committed comparison
      adapter replayed over the same Case projection reproduces the report pin (Axiom
      24 versus January PolicyEngine 60.4). Forcing the endogenously derived medical_expense_health_insurance_premiums,
      pension_income inputs to zero in the direct requested-month simulation produces
      January SNAP 23.84; its absolute delta from Axiom, 0.16, is within the unchanged
      suite tolerance 7.0. PolicyEngine derives these sources endogenously on the
      requested-month path while the projected Case carries none of them, so the
      engines price different income surfaces.
    upstream_url: https://github.com/TheAxiomFoundation/axiom-oracles/issues/436
    arithmetic:
    - expression: 23.84 - 24
      equals: -0.16
      tolerance: 0.160001
    sources:
