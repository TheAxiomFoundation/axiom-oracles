    - ecps-31418
    - ecps-32197
    - ecps-32401
    - ecps-32629
    - ecps-32834
    - ecps-32979
    - ecps-33045
    - ecps-33616
    - ecps-33930
  disposition: axiom_encoding_gap
  evidence:
    mechanism: 'Reverified per-row on PolicyEngine 4.18.9 / PolicyEngine-US 1.767.3
      / PolicyEngine-Core 3.30.3 via exact-household requested-month replay: for
      every selected row January PolicyEngine grants broad-based categorical eligibility
      (meets_snap_categorical_eligibility=True) while a standard federal income
      test fails, and pays the resulting benefit (one/two-person minimums where
      net income leaves no normal allotment). The composed program applies only
      the standard federal tests, so Axiom is ineligible with zero benefit. Axiom-side
      modeling boundary. Per-row flags: ecps-31418: categorical=True, net_test=False,
      gross_test=True, January PE 23.84; ecps-32197: categorical=True, net_test=False,
      gross_test=False, January PE 23.84; ecps-32401: categorical=True, net_test=False,
      gross_test=True, January PE 23.84; ecps-32629: categorical=True, net_test=False,
      gross_test=True, January PE 23.84; ecps-32834: categorical=True, net_test=False,
      gross_test=True, January PE 23.84; ecps-32979: categorical=True, net_test=True,
      gross_test=False, January PE 32.4; ecps-33045: categorical=True, net_test=False,
      gross_test=True, January PE 23.84; ecps-33616: categorical=True, net_test=False,
      gross_test=False, January PE 23.84; ecps-33930: categorical=True, net_test=False,
      gross_test=False, January PE 23.84.'
    sources:
