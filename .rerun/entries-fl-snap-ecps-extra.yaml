  kind: amount_difference
  disposition: bridge_artifact
  evidence:
    mechanism: 'Exact-household requested-month replay on PolicyEngine 4.18.9 /
      PolicyEngine-US 1.767.3 / PolicyEngine-Core 3.30.3. January PolicyEngine computes
      SNAP 103 with net income 650.536; Axiom''s persisted net income is 603.7 under
      its round-30-percent-up election. Negative self-employment pass-through: the
      projection''s 0.6-scaled self-employment loss reaches Axiom as negative earned
      income (-58.84), offsetting unearned income, while PolicyEngine floors earned
      income at zero (January earned 0).'
