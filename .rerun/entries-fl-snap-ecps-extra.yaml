- id: fl-se-netting-2026-08-12-33897-benefit
  concept: us:statutes/7/2014/u#snap_benefit
  case_id: ecps-33897
  kind: amount_difference
  disposition: bridge_artifact
  linked_issue: https://github.com/TheAxiomFoundation/axiom-oracles/issues/433
  evidence:
    mechanism: 'Exact-household requested-month replay on PolicyEngine 4.18.9 /
      PolicyEngine-US 1.767.3 / PolicyEngine-Core 3.30.3. January PolicyEngine computes
      SNAP 243.4 with net income 182.227; Axiom''s persisted net income is 75.43
      under its round-30-percent-up election. Flat self-employment netting asymmetry:
      the populace projection feeds Axiom''s earned income with self-employment
      scaled by 0.6 while PolicyEngine counts the gross amount (January PolicyEngine
      earned 334.012 versus Axiom''s input 200.41 = 0.6 x 334.012).'
    upstream_url: https://github.com/TheAxiomFoundation/axiom-oracles/issues/433
    arithmetic:
    - expression: 298 - 23 - 275
      equals: 0.0
      tolerance: 0.51
    - expression: 298 - 0.3 * 182 - 243.4
      equals: 6.0e-06
      tolerance: 0.51
    - expression: 200.41 - 0.6 * 334.012
      equals: 0.002914
      tolerance: 0.02
