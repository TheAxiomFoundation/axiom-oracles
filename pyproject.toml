[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship the canonical grids next to the package so load_grids() resolves them in
# a wheel install too (its default root is <dist-root>/grids, matching the
# source layout). Adopted grids only; the *.suggested.yaml proposals are dev
# artifacts and stay out of the wheel.
packages = ["axiom_oracles"]

[tool.hatch.build.targets.wheel.force-include]
"grids/us.yaml" = "grids/us.yaml"
"grids/be.yaml" = "grids/be.yaml"
"grids/de.yaml" = "grids/de.yaml"
"grids/ca.yaml" = "grids/ca.yaml"
"grids/uk.yaml" = "grids/uk.yaml"
"grids/README.md" = "grids/README.md"

[project]
name = "axiom-oracles"
version = "0.2.1"
description = "Axiom oracle adapters and cross-engine comparison tooling"
readme = "README.md"
# >=3.13 (not ==3.14.*) so axiom-encode — which runs CI on 3.13 — can depend
# on this package for the shared axiom_oracles.bridges oracle-bridge layer.
requires-python = ">=3.13"
dependencies = [
  "click>=8.1",
  # The DE executable certificate verifies the RuleSpec apply signature before
  # replaying the pinned engine; keep that load-bearing verifier in the base env.
  "cryptography>=44.0",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.14",
  # The euromod worker's per-household isolation test drives the real
  # _runner.py under this interpreter with a stub engine; the worker itself
  # needs pandas.
  "pandas>=2.2",
]
policyengine = [
  "policyengine[us]==5.0.0",
]
taxsim = [
  "policyengine-taxsim==2.30.0",
]
taxcalc = [
  "taxcalc==6.7.1",
]
accessnyc-python = [
  "pydantic>=2.11",
]
# GETTSIM (German Taxes and Transfers SIMulator) — the second, independent
# German comparison oracle in the dual-oracle lane (rulespec-de#1). Pure Python,
# date-parameterized, deterministic; imported lazily by the adapter, so the extra
# is only needed to run German comparisons. NB: the PyPI distribution is
# ``gettsim==1.2`` even though ``gettsim.__version__`` reports "1.2.1" (the
# ttsim-backend engine version); pin the distribution. See
# docs/gettsim-oracle-playbook.md.
gettsim = [
  "gettsim==1.2",
]

[project.scripts]
axiom-oracles = "axiom_oracles.cli:cli"

[tool.uv]
# GETTSIM's ttsim-backend transitively conflicts with the PolicyEngine
# dependency tree (the ``policyengine`` and ``policyengine-taxsim`` extras), so
# the two cannot resolve into one environment. Declaring them conflicting lets
# ``uv lock`` resolve each in its own fork; nothing ever installs both at once —
# the adapter imports GETTSIM lazily and CI only syncs ``[dev]``. Run German
# comparisons in a dedicated venv: ``uv sync --extra gettsim`` (Python 3.13).
conflicts = [
  [
    { extra = "gettsim" },
    { extra = "policyengine" },
  ],
  [
    { extra = "gettsim" },
    { extra = "taxsim" },
  ],
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
