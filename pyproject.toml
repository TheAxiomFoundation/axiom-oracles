[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axiom-oracles"
version = "0.1.0"
description = "Axiom oracle adapters and cross-engine comparison tooling"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
  "click>=8.1",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.14",
]
policyengine = [
  "policyengine[us]==4.4.4",
]
taxsim = [
  "policyengine-taxsim>=2.7.1",
]
accessnyc-python = [
  "pydantic>=2.11",
]

[project.scripts]
axiom-oracles = "axiom_oracles.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
