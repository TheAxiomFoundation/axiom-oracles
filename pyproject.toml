[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axiom-oracles"
version = "0.2.1"
description = "Axiom oracle adapters and cross-engine comparison tooling"
readme = "README.md"
# >=3.13 (not ==3.14.*) so axiom-encode — which runs CI on 3.13 — can depend
# on this package for the shared axiom_oracles.bridges oracle-bridge layer.
requires-python = ">=3.13"
dependencies = [
  "click>=8.1",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.14",
]
policyengine = [
  "policyengine[us]==4.4.4",
]
taxsim = [
  "policyengine-taxsim>=2.7.1",
]
accessnyc-python = [
  "pydantic>=2.11",
]

[project.scripts]
axiom-oracles = "axiom_oracles.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
