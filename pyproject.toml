[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axiom-programs"
version = "0.1.0"
description = "Executable Axiom program compositions and oracle comparisons"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "click>=8.1",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.14",
]
policyengine = [
  "policyengine-us>=1.300.0",
]
accessnyc-python = [
  "pydantic>=2.11",
]

[project.scripts]
axiom-programs = "axiom_programs.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
