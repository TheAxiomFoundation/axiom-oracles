# California CalWORKs (TANF) -- FY 2026, recipient-month slice.
#
# Composes the encoded W&I Code 11450 maximum aid payment schedules
# (region 1 and region 2, exempt and non-exempt) and pays
# max(0, MAP - countable income), capped at MAP — the same shape as
# PolicyEngine's ca_tanf. Countable income is fed by the projector using
# the recipient disregard ($600 flat + 50% remainder) PolicyEngine
# carries, which matches the encoded recipient-income-disregard rules'
# two-years-after-operative threshold.
#
# v1 scope decisions (documented divergence classes):
#   - Region chosen by county FIPS against the region-1 county list.
#   - Exempt units approximated as "any member receives SSI" (ECPS lacks
#     IHSS / SDI / workers' compensation facts).
#   - Recipient month only: applicant MBSAC/MAP entry tests, immigration
#     proration, and disability-based unearned income splits are out of
#     scope.

program: us-ca/tanf
period: 2026-01

outputs:
  - ca_tanf_annual_benefit

acknowledged_incomplete:
  - ca_tanf_annual_benefit

scope:
  state:
    - policies/cdss/calworks/maximum-aid-payment-region-1
    - policies/cdss/calworks/maximum-aid-payment-region-2

transformations:
  - pattern: data_relation
    name: member_of_household
    arity: 2
    source: axiom-oracles ECPS projection household membership

  - pattern: derived_formula
    name: ca_tanf_maximum_aid_payment
    effective_from: '2026-01-01'
    entity: TanfUnit
    dtype: Money
    period: Month
    unit: USD
    source: axiom-oracles programs/us-ca/tanf region selection
    formula: |-
      if household_in_ca_map_region_1: calworks_region_1_maximum_aid_payment
      else: calworks_region_2_maximum_aid_payment

  - pattern: derived_formula
    name: ca_tanf_countable_income
    effective_from: '2026-01-01'
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: axiom-oracles programs/us-ca/tanf countable income
    formula: |-
      ca_countable_earned_income_after_disregard + ca_countable_other_unearned_income

  - pattern: derived_formula
    name: ca_tanf_monthly_benefit
    effective_from: '2026-01-01'
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: axiom-oracles programs/us-ca/tanf program output
    formula: |-
      if household_has_minor_or_pregnant_member: min(max(0, ca_tanf_maximum_aid_payment - ca_tanf_countable_income), ca_tanf_maximum_aid_payment)
      else: 0

  - pattern: derived_formula
    name: ca_tanf_annual_benefit
    effective_from: '2026-01-01'
    entity: Household
    dtype: Money
    period: Year
    unit: USD
    source: axiom-oracles programs/us-ca/tanf program output
    formula: |-
      ca_tanf_monthly_benefit * 12
