# Arizona Cash Assistance (TANF) -- FY 2026, recipient-month benefit.
#
# Mirrors the upstream compose spec (rulespec-us programs/us-az/tanf) — the
# DES FAA5 payment-standard, needy-family, and eligible-no-pay financial
# path — and adds the oracle-suite plumbing: the household-membership data
# relation and a monthly output gated on the demographic fact the
# encoded surface acknowledges as incomplete (a minor or pregnant member),
# so the comparison never pays childless units PolicyEngine's az_tanf
# would not.

program: us-az/tanf
period: 2026-01

outputs:
  - az_tanf_monthly_cash_benefit

acknowledged_incomplete:
  - az_tanf_monthly_cash_benefit

scope:
  state:
    - policies/des/faa5/ca-payment-standard-a1-2fa2
    - policies/des/faa5/ca-benefit-determination/needy-family-test
    - policies/des/faa5/ca-benefit-determination/payment-standard-test
    - policies/des/faa5/ca-benefit-determination/payments-under-10-dollars

transformations:
  - pattern: data_relation
    name: member_of_household
    arity: 2
    source: axiom-oracles ECPS projection household membership

  - pattern: derived_formula
    name: az_tanf_prospectively_eligible
    effective_from: '2026-01-01'
    entity: Household
    dtype: Judgment
    period: Month
    source: axiom-oracles programs/us-az/tanf prospective-eligibility bridge
    formula: ca_prospective_eligibility_requirements_met

  - pattern: derived_formula
    name: az_tanf_eligible_no_pay
    effective_from: '2026-01-01'
    entity: Household
    dtype: Judgment
    period: Month
    source: axiom-oracles programs/us-az/tanf eligible-no-pay bridge
    formula: ca_eligible_no_pay_case

  - pattern: derived_formula
    name: az_tanf_payable
    effective_from: '2026-01-01'
    entity: Household
    dtype: Judgment
    period: Month
    source: axiom-oracles programs/us-az/tanf payable-case composition
    formula: |-
      household_has_minor_or_pregnant_member
      and az_tanf_prospectively_eligible
      and not az_tanf_eligible_no_pay

  - pattern: derived_formula
    name: az_tanf_monthly_cash_benefit
    effective_from: '2026-01-01'
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: axiom-oracles programs/us-az/tanf monthly benefit
    formula: |-
      if az_tanf_payable: ca_payment_standard_net_unrounded_payment / 12 else: 0

  - pattern: derived_formula
    name: az_tanf_annual_cash_benefit
    effective_from: '2026-01-01'
    entity: Household
    dtype: Money
    period: Year
    unit: USD
    source: axiom-oracles programs/us-az/tanf program output
    formula: az_tanf_monthly_cash_benefit * 12
