# Minnesota MFIP (TANF) -- FY 2026, recipient-month cash portion.
#
# Composes the encoded Combined Manual 0022.12 total-grant budgeting
# (transitional standard / family wage level branches) and compares the
# cash portion — PolicyEngine's mn_mfip also excludes the food portion
# because SNAP is modeled separately. Standards, the 110% family wage
# level, and the $65-per-earner + 50% disregard are fed to mirror
# PolicyEngine's parameters.
#
# v1 scope: recipient month (no applicant proration or recoupment);
# demographic gate = minor child or pregnant member.

program: us-mn/tanf
period: 2026-01

outputs:
  - mn_mfip_monthly_cash_benefit

acknowledged_incomplete:
  - mn_mfip_monthly_cash_benefit

scope:
  state:
    - policies/dhs/combined-manual/0022-12/mfip-total-grant

transformations:
  - pattern: data_relation
    name: member_of_household
    arity: 2
    source: axiom-oracles ECPS projection household membership

  - pattern: derived_formula
    name: mn_mfip_monthly_cash_benefit
    effective_from: '2026-01-01'
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: axiom-oracles programs/us-mn/tanf program output
    formula: |-
      if household_has_minor_or_pregnant_member: mfip_cash_portion_issued_as_cash else: 0

  - pattern: derived_formula
    name: mn_mfip_annual_cash_benefit
    effective_from: '2026-01-01'
    entity: Household
    dtype: Money
    period: Year
    unit: USD
    source: axiom-oracles programs/us-mn/tanf program output
    formula: |-
      mn_mfip_monthly_cash_benefit * 12
