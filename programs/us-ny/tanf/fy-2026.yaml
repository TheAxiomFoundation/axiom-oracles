# New York TANF (Family Assistance) -- FY 2026, state-plan slice.
#
# Composes the encoded NY TANF state plan 2024-2026: standard of need and
# monthly grant schedules (incl. home energy payments and the with-children
# shelter allowance), and the financial eligibility / earned income
# disregard rules. This wrapper assembles the countable-income wiring and a
# demographic gate mirroring PolicyEngine's ny_tanf_eligible.
#
# v1 scope decisions (documented divergence classes on the dashboard):
#   - Demographic gate approximated as "any member under 18 or pregnant";
#     immigration status assumed eligible (ECPS lacks the columns).
#   - Resource test not applied (ECPS exposes no asset data; PolicyEngine's
#     constructed households default assets to zero, so both sides pass).
#   - The earned income disregard is applied unconditionally, mirroring
#     PolicyEngine's post-October-2022 formula. The encoded state plan rate
#     is 62% + $150; PolicyEngine carries 50% + $150.
#   - Shelter uses the encoded with-children local agency schedule, which
#     differs from the schedule PolicyEngine carries.

program: us-ny/tanf
period: 2026-01

outputs:
  - ny_tanf_benefit

acknowledged_incomplete:
  - ny_tanf_benefit

scope:
  state:
    - policies/otda/tanf-state-plan-2024-2026/standard-of-need-and-monthly-grant
    - policies/otda/tanf-state-plan-2024-2026/financial-eligibility-and-income-disregards

transformations:
  - pattern: data_relation
    name: member_of_household
    arity: 2
    source: axiom-oracles ECPS projection household membership

  # The disregard rules leave "standard of need" to the agency assembly:
  # grant + home energy allowances + the shelter allowance (actual rent up
  # to the with-children schedule; the demographic gate below already
  # requires a child in the unit).
  - pattern: derived_formula
    name: standard_of_need
    effective_from: '2026-01-01'
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: axiom-programs/us-ny/tanf/fy-2026 need-standard assembly
    formula: |-
      monthly_grant_and_allowance_with_home_energy + monthly_rent_allowance_with_children

  - pattern: derived_formula
    name: ny_tanf_benefit
    effective_from: '2026-01-01'
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: axiom-programs/us-ny/tanf/fy-2026 program output
    formula: |-
      if household_has_minor_or_pregnant_member: assistance_amount_after_income_disregards else: 0

  - pattern: derived_formula
    name: ny_tanf_annual_benefit
    effective_from: '2026-01-01'
    entity: Household
    dtype: Money
    period: Year
    unit: USD
    source: axiom-programs/us-ny/tanf/fy-2026 program output
    formula: |-
      ny_tanf_benefit * 12
