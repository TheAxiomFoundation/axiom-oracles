# US Medicaid MAGI + SSI-recipient eligibility groups -- FY 2026, Colorado slice.
#
# Composes the encoded 42 CFR 435 eligibility groups that are computable
# from ECPS facts: children (435.118), pregnant women (435.116), the adult
# expansion group (435.119), and the mandatory SSI-recipient group
# (435.120 ssi-mandatory-group). The compared output is household-level:
# does any member qualify under a composed group.
#
# v1 scope decisions (documented divergence classes on the dashboard):
#   - Colorado only: the state-plan income standards are fed as constants
#     mirroring PolicyEngine's CO limits (1.47 children / 2.00 pregnant),
#     which the co-health-thresholds parameter suite verified against the
#     encoded Colorado CMS levels.
#   - Parents/caretakers (435.110) are not composed; in an expansion state
#     the adult group subsumes them for any-member eligibility.
#   - The adult group uses the statutory 133% of 435.119; PolicyEngine
#     compares at the 138% effective limit (133% + the 435.603(d) 5%
#     disregard, which is not in this composition). Adults in the
#     133-138% band diverge.
#   - Optional groups PolicyEngine also covers (young adults 19-20,
#     optional senior/disabled, medically needy) are out of scope, as are
#     immigration gates.

program: us/medicaid-magi
period: 2026-01

outputs:
  - household_has_medicaid_infant_eligible
  - household_has_medicaid_young_child_eligible
  - household_has_medicaid_older_child_eligible
  - household_has_medicaid_pregnant_eligible
  - household_has_medicaid_adult_eligible
  - household_has_medicaid_ssi_recipient_eligible

acknowledged_incomplete:
  - household_has_medicaid_infant_eligible
  - household_has_medicaid_young_child_eligible
  - household_has_medicaid_older_child_eligible
  - household_has_medicaid_pregnant_eligible
  - household_has_medicaid_adult_eligible
  - household_has_medicaid_ssi_recipient_eligible

scope:
  federal:
    - regulations/42-cfr/435/116
    - regulations/42-cfr/435/118
    - regulations/42-cfr/435/119
    - regulations/42-cfr/435/120/ssi-mandatory-group

transformations:
  - pattern: data_relation
    name: member_of_household
    arity: 2
    source: axiom-oracles ECPS projection household membership

  - pattern: derived_formula
    name: person_medicaid_infant_eligible
    effective_from: '2026-01-01'
    entity: Person
    dtype: Judgment
    period: Month
    source: axiom-programs/us/medicaid-magi/fy-2026 group rollup
    formula: |-
      child_is_infant and infants_and_children_eligible

  - pattern: derived_formula
    name: person_medicaid_infant_indicator
    effective_from: '2026-01-01'
    entity: Person
    dtype: Money
    period: Month
    unit: USD
    source: axiom-programs/us/medicaid-magi/fy-2026 group rollup
    formula: |-
      if person_medicaid_infant_eligible: 1 else: 0

  - pattern: derived_formula
    name: household_has_medicaid_infant_eligible
    effective_from: '2026-01-01'
    entity: Household
    dtype: Judgment
    period: Month
    source: axiom-programs/us/medicaid-magi/fy-2026 program output
    formula: |-
      sum_where(member_of_household, person_medicaid_infant_indicator, person_medicaid_infant_eligible) > 0

  - pattern: derived_formula
    name: person_medicaid_young_child_eligible
    effective_from: '2026-01-01'
    entity: Person
    dtype: Judgment
    period: Month
    source: axiom-programs/us/medicaid-magi/fy-2026 group rollup
    formula: |-
      child_is_in_young_child_age_group and infants_and_children_eligible

  - pattern: derived_formula
    name: person_medicaid_young_child_indicator
    effective_from: '2026-01-01'
    entity: Person
    dtype: Money
    period: Month
    unit: USD
    source: axiom-programs/us/medicaid-magi/fy-2026 group rollup
    formula: |-
      if person_medicaid_young_child_eligible: 1 else: 0

  - pattern: derived_formula
    name: household_has_medicaid_young_child_eligible
    effective_from: '2026-01-01'
    entity: Household
    dtype: Judgment
    period: Month
    source: axiom-programs/us/medicaid-magi/fy-2026 program output
    formula: |-
      sum_where(member_of_household, person_medicaid_young_child_indicator, person_medicaid_young_child_eligible) > 0

  - pattern: derived_formula
