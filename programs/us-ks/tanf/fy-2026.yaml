# Kansas TANF -- FY 2026, maximum-benefit standards comparison.
#
# The encoded KEESM slice covers the budgetary standards (7410: basic
# allowance + energy supplement + county shelter groups) and proration
# (7400); the countable-income path is not yet encoded, so this suite
# compares the composed MAXIMUM benefit against PolicyEngine's
# ks_tanf_maximum_benefit — which resolves the long-deferred question of
# whether the encoded basic+shelter composition matches PolicyEngine's
# single combined table (the Axiom bridge fixes shelter group I at 100%).

program: us-ks/tanf
period: 2026-01

outputs:
  - ks_tanf_monthly_maximum_benefit

acknowledged_incomplete:
  - ks_tanf_monthly_maximum_benefit

scope:
  state:
    - policies/dcf/keesm/keesm7410
    - policies/dcf/keesm/keesm7400/cash-proration-rounding

transformations:
  - pattern: data_relation
    name: member_of_household
    arity: 2
    source: axiom-oracles ECPS projection household membership

  - pattern: derived_formula
    name: ks_tanf_monthly_maximum_benefit
    effective_from: '2026-01-01'
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: axiom-oracles programs/us-ks/tanf program output
    formula: ks_tanf_maximum_benefit

  - pattern: derived_formula
    name: ks_tanf_annual_maximum_benefit
    effective_from: '2026-01-01'
    entity: Household
    dtype: Money
    period: Year
    unit: USD
    source: axiom-oracles programs/us-ks/tanf program output
    formula: ks_tanf_monthly_maximum_benefit * 12
