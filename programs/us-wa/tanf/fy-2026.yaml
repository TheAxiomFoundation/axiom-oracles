# Washington TANF (WorkFirst cash assistance) -- FY 2026 slice.
#
# Composes WAC 388-450-0162 (benefit and countable income), 388-450-0170
# (earned income work deductions), 388-478-0020 (payment standards), and
# 388-478-0035 (maximum gross earned income levels). The encoded rules
# already assemble the monthly benefit; this wrapper adds the demographic
# gate mirroring PolicyEngine's wa_tanf_eligible.
#
# v1 scope decisions (documented on the dashboard):
#   - Demographic gate: any member under 18 or pregnant; immigration
#     assumed eligible; resource test not applied (no ECPS asset data).
#   - Dependent care deductions and deemed/allocated income are zero
#     (not observable in ECPS).

program: us-wa/tanf
period: 2026-01

outputs:
  - wa_tanf_monthly_benefit

acknowledged_incomplete:
  - wa_tanf_monthly_benefit

scope:
  state:
    - regulations/388/388-450/388-450-0162
    - regulations/388/388-450/388-450-0170
    - regulations/388/388-478/388-478-0020
    - regulations/388/388-478/388-478-0035

transformations:
  - pattern: data_relation
    name: member_of_household
    arity: 2
    source: axiom-oracles ECPS projection household membership

  - pattern: derived_formula
    name: wa_tanf_monthly_benefit
    effective_from: '2026-01-01'
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: axiom-programs/us-wa/tanf/fy-2026 program output
    formula: |-
      if household_has_minor_or_pregnant_member
        and cash_assistance_gross_earned_income_requirement_satisfied
        and cash_assistance_income_requirement_satisfied: cash_assistance_monthly_benefit
      else: 0

  - pattern: derived_formula
    name: wa_tanf_annual_benefit
    effective_from: '2026-01-01'
    entity: Household
    dtype: Money
    period: Year
    unit: USD
    source: axiom-programs/us-wa/tanf/fy-2026 program output
    formula: |-
      wa_tanf_monthly_benefit * 12
