name: uk-winter-fuel-ukmod
title: UK Winter Fuel Payment — Axiom vs UKMOD
description: >-
  Compares the composed Winter Fuel Payment award pipeline encoded in rulespec-uk
  (winter_fuel_payment_composed_award_pipeline: the Social Fund Winter Fuel
  Payment Regulations 2025 (SI 2025/969) regulation 3(1) and 3(4)
  England-and-Wales standard amounts — £200 where nobody in the benefit unit is
  aged 80 or over and £300 where any member is 80 or over — gated on a state-
  pension-age member and the 2025/26 income-recovery means test, from
  hypothetical household facts) against CeMPA's UKMOD boaht_s on a shared
  pensioner grid: single and couple, the under-80 and 80+ tiers, and an
  assessable-income sweep crossing the £35,000-a-year recovery threshold. The
  Winter Fuel Payment is a benefit-unit amount that does not scale with the
  number of pension-age members — UKMOD allocates it across the unit's pension-
  age members and the adapter sums boaht_s across the benefit unit and annualizes
  it, so the compared value is the annual household award (verified exact: single
  67 → £200, single 80 → £300, couple both 67 → £200 not £400, couple 67+80 →
  £300). The 2024/25 means-testing reform gates every UKMOD component on il_toty
  below the recovery threshold ($WFCBThresh, £35,000/year); the composed pilot
  takes the below-threshold judgment as an input (verified strict: monthly income
  2,916.66 pays, 2,916.67 is withdrawn). The suite is England-and-Wales only:
  Scotland (drgn1=12) runs a higher devolved instrument (£211 / £317 — Pension
  Age Winter Heating Payment, not SI 2025/969) that Axiom does not encode, so no
  Scottish cases are placed. Winter Fuel does not draw UKMOD's stochastic take-up
  correction (verified — the payment is unchanged with BTA_uk / random_uk off), so
  the surface is a clean deterministic comparable and no take-up disposition is
  required. UKMOD runs the registration-free public model (UKMOD_PUBLIC_B2026.03,
  system UK_2026, dataset training_data). This suite runs where the x64 UKMOD
  runtime and model checkout are available and is regenerated by
  scripts/regenerate_euromod_uk.sh; on runners without them it re-emits the
  committed dashboard report.

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: uk-winter-fuel
    population: synthetic
    sample_size: 0
    # UKMOD reports boaht_s as a monthly per-member amount allocated across the
    # unit's pension-age members; the adapter sums it across the benefit unit and
    # annualizes (× 12), so the compared value is the annual household award and
    # the composed pilot's annual wfp_pilot_award_amount is compared annual-to-
    # annual. Winter Fuel is deterministic (no take-up draw), so BTA_uk /
    # random_uk are requested off only to make the intent explicit.
    # The SI 2025/969 reg 3 amounts are effective 2025-09-15; the 2026-27 fiscal-
    # year evaluation reads the same amounts. Cases start on the 6 April 2026
    # fiscal boundary (the engine selects parameter versions by period.start; the
    # #194 guard requires UK suites to start on/after 6 April 2026). UKMOD
    # resolves the policy year from euromod_system (UK_2026) and ignores the case
    # period.
    period: 2026-04-06
    euromod_model_root: $HOME/Downloads/UKMOD_PUBLIC_B2026.03
    euromod_country: UK
    euromod_system: UK_2026
    euromod_dataset: training_data
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-uk-winter-fuel.json

artifacts:
  report_basename: axiom-euromod-uk-winter-fuel

dashboard:
  filename: axiom-euromod-uk-winter-fuel.json
  suite: uk-winter-fuel
