name: be-replacement-income-pit
title: Belgium replacement-income PIT — Axiom vs EUROMOD
description: >-
  Compares the merged rulespec-be replacement-income PIT pipeline against
  EUROMOD BE_2025 for INPUT bun at 12k, 18k, and 24k, INPUT bhl at 18k, and a
  mixed 15k unemployment plus 15k wage row. Pure replacement rows compare the
  Articles 147--153 tintcri_s reduction and final tin_s; the mixed row compares
  final tax and carries the documented additional-reduction-proration and
  work-bonus mechanisms. EUROMOD's simulated bun_s remains off: the suite
  bridges post-uprating INPUT bun/bhl, plus yem and yemeq_s, into Person records.

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: be-replacement-income-pit
    population: synthetic
    sample_size: 0
    period: 2025
    euromod_model_root: $HOME/Downloads/EUROMOD_J2.0/EUROMOD_RELEASES_J2.0+
    euromod_country: BE
    euromod_system: BE_2025
    euromod_dataset: BE_2024_c1_2015_03_e2
    euromod_template_dataset: BE_training_data
    euromod_extra_columns: [drgn1, bhl]
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-be-replacement-income-pit.json

artifacts:
  report_basename: axiom-euromod-be-replacement-income-pit

dashboard:
  filename: axiom-euromod-be-replacement-income-pit.json
  suite: be-replacement-income-pit
