# Federal credit for the elderly or permanently and totally disabled — Axiom
# vs PolicyEngine-US, tax year 2026.
#
# Axiom boundary: the statutory section 22 credit before section 26. The
# encoded final covers the aged and permanent-total-disability branches,
# nontaxable Social Security/pension reductions, and the independent 50% AGI
# reduction. Fixed values include $5,000 one-qualified, $7,500 two-qualified,
# 15%, and $7,500/$10,000 AGI thresholds. `eld-basic` is lawfully $412.50
# after both its $2,000 Social Security and $250 AGI reductions.
# Source: https://uscode.house.gov/view.xhtml?edition=prelim&num=0&req=granuleid%3AUSC-prelim-title26-section22
# RuleSpec: rulespec-us@dc6602f2
# us/policies/income_tax/elderly_disabled_credit_pipeline.yaml:15-61,64-192.
#
# PolicyEngine binding: `elderly_disabled_credit_potential`, not public
# `elderly_disabled_credit`; the latter additionally applies the
# nonrefundable liability/credit-order cap. PE's `section_22_income` implements
# the tested aged/disability, nontaxable-SS, disability-income-cap, and AGI
# branches. The detailed under-65 fixture predicates are validated before
# being collapsed to PE's declared `retired_on_total_disability` input, with
# $2,000 supplied as `total_disability_payments`.
#
# Selected subset: 9 of 10 companion cases. The omitted
# `eld-no-qualified-individual` case has an empty Axiom taxpayer/spouse
# relation. A PE TaxUnit must contain a Person, and that fixture supplies no
# age/disability facts for an invented member, so it cannot be expressed
# exactly and is not aliased. All six GRID-CONTRACT P7 cases remain included.
# Code: policyengine-us@49d19b239a593dbac8920ac6fd80cfe33372343a
# policyengine_us/variables/gov/irs/credits/elderly_and_disabled/
# section_22_income.py:13-65;
# .../eligibility.py;
# .../elderly_disabled_credit_potential.py:4-15;
# .../elderly_disabled_credit.py:4-16;
# policyengine_us/parameters/gov/irs/credits/elderly_or_disabled/
# {age,amount,phase_out,rate}.yaml.
#
# Run locally:
#   uv run python scripts/run_comparison.py us-elderly-disabled-grid --summary

name: us-elderly-disabled-grid
title: Federal elderly or disabled credit — Axiom vs PolicyEngine
description: >-
  Compares the pre-section-26 section 22 credit on the nine exactly
  expressible ground-truth companion cases, including the under-65 disability
  branch; the one empty-relation diagnostic is explicitly omitted.

runner:
  type: federal-tax-liability-grid
  parameters:
    policy: elderly_disabled_credit
    period: "2026"
    concept: >-
      us:policies/income_tax/elderly_disabled_credit_pipeline#federal_elderly_disabled_credit
    python: "3.13"
    policyengine_version: "4.18.9"
    policyengine_us_version: "1.767.3"
    policyengine_core_version: "3.30.3"
    rulespec_remote: https://github.com/TheAxiomFoundation/rulespec-us.git
    rulespec_roots:
      - $HOME/TheAxiomFoundation/rulespec-us
    rulespec_upstream_sha: 3373e8411f7e141fd50879e3de964386f606f7f6
    rulespec_upstream_tree: 7e00f195ea81ff9aa21c58d53151e937d974a016

artifacts:
  report_basename: axiom-policyengine-us-elderly-disabled-grid

dashboard:
  filename: axiom-policyengine-us-elderly-disabled-grid.json
  suite: us-elderly-disabled-grid
