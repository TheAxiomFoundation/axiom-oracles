# Colorado TANF -- Axiom vs PolicyEngine on Enhanced CPS, NY households.

name: co-tanf-ecps
title: Colorado TANF -- Axiom vs PolicyEngine
description: >-
  Compares the monthly Colorado Works basic cash assistance grant from the
  composed us-co/tanf program (9 CCR 2503-6 grant standard chart, need
  standard, and earned income disregards) against PolicyEngine's co_tanf
  on Enhanced CPS households in Colorado. Refresh the rulespec root after
  pulling ~/rulespec-us with:
  rsync -a --delete --exclude .axiom ~/rulespec-us/us-co/ ~/.axiom-oracles/roots/rulespec-us-co/

# Not CI-runnable while engine-main x rulespec-us-main is broken: composed-root
# staging fails the engine's canonical-path scan (non-canonical filenames in
# us-la/us-nh/us-nj/us -- rulespec-us#1049) before any comparison runs;
# rulespec-us#1050 (removed plural corpus_citation_paths) and -- for the
# composed program lanes -- axiom-compose#29 and axiom-oracles#335 queue
# behind it. Manual lane only; drop this marker when the upstream chain lands
# (axiom-oracles#455 tracks the flip-back).
ci: manual

runner:
  type: axiom-oracles-compare
  axiom_rules_repo: $HOME/axiom-rules-engine
  parameters:
    # Loaded-case count overstates this suite (in-bridge filtering), so
    # the size heuristic under-persists; keep full per-case evidence.
    include_case_inputs: true
    left: axiom
    right: policyengine
    suite: co-tanf-ecps
    concepts:
      - us-co:policies/cdhs/colorado-works#co_tanf_benefit
    sample_size: 0
    period: 2026-01
    population: enhanced-cps
    jurisdiction_fips: "08"
    axiom_compose_binary: $HOME/axiom-compose/.venv/bin/axiom-compose
    axiom_program: $HOME/axiom-oracles/programs/us-co/tanf/fy-2026.yaml
    axiom_composed_program: /tmp/co-tanf-composed.yaml
    axiom_compiled_program: /tmp/co-tanf-compiled.json
    axiom_rulespec_repo_roots: $HOME/.axiom-oracles/roots
    rulespec_roots:
      - $HOME/.axiom-oracles/roots/rulespec-us-co

artifacts:
  report_basename: axiom-policyengine-co-tanf-ecps

dashboard:
  filename: axiom-policyengine-co-tanf-ecps.json
  suite: co-tanf-ecps
