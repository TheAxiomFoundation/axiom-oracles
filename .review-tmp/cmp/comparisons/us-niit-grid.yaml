# Federal net investment income tax — Axiom vs PolicyEngine-US, 2026.
#
# Axiom boundary: the thin RuleSpec composition exposes the imported section
# 1411 final individual NIIT. It consumes completed-return AGI and listed
# investment components; the P3 cases have no section 911 amounts, so MAGI
# equals AGI. Wages appear only in the grid arithmetic that constructs AGI.
# Code: rulespec-us@9173e7bd
# us/policies/income_tax/net_investment_income_tax_pipeline.yaml:15-36,46-86;
# .../net_investment_income_tax_pipeline.test.yaml:1-10.
#
# PolicyEngine binding decision: compare `net_investment_income_tax`. Its
# TaxUnit formula applies 3.8% to the lesser of nonnegative net investment
# income and nonnegative AGI excess over the filing-status threshold. The grid
# supplies wages, taxable interest, ordinary dividends, long-term gains and
# passive rent and lets PolicyEngine derive AGI; no section 911 exclusion is
# present, matching the composition's completed AGI/MAGI boundary.
# Code: policyengine-us@49d19b239a593dbac8920ac6fd80cfe33372343a
# policyengine_us/variables/gov/irs/tax/federal_income/
# net_investment_income_tax.py:4-20;
# .../net_investment_income.py:4-12;
# policyengine_us/parameters/gov/irs/investment/income/sources.yaml:1-15.
#
# The exact suite stack is PolicyEngine 4.18.9, PE-US 1.767.3 and core 3.30.3:
# PE-US matches the conformance universe label and includes the 2026
# OBBBA-era parameters; this is the known-good Python 3.13 import pair.
#
# Run locally:
#   uv run python scripts/run_comparison.py us-niit-grid --summary

name: us-niit-grid
title: Federal net investment income tax — Axiom vs PolicyEngine
description: >-
  Compares section 1411 federal NIIT between Axiom and PolicyEngine-US on the
  six exact GRID-CONTRACT P3 cases.

runner:
  type: federal-tax-liability-grid
  parameters:
    policy: net_investment_income_tax
    period: "2026"
    concept: >-
      us:policies/income_tax/net_investment_income_tax_pipeline#federal_net_investment_income_tax
    python: "3.13"
    policyengine_version: "4.18.9"
    policyengine_us_version: "1.767.3"
    policyengine_core_version: "3.30.3"
    rulespec_remote: https://github.com/TheAxiomFoundation/rulespec-us.git
    rulespec_roots:
      - $HOME/TheAxiomFoundation/rulespec-us
    rulespec_upstream_sha: 3373e8411f7e141fd50879e3de964386f606f7f6
    rulespec_upstream_tree: 7e00f195ea81ff9aa21c58d53151e937d974a016

artifacts:
  report_basename: axiom-policyengine-us-niit-grid

dashboard:
  filename: axiom-policyengine-us-niit-grid.json
  suite: us-niit-grid
