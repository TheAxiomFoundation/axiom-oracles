name: uk-self-employed-nic-ukmod
title: UK self-employed NIC — Axiom vs UKMOD
description: >-
  Compares the composed single-earner UK self-employed National Insurance
  pipeline encoded in Axiom RuleSpec (SSCBA 1992 section 15 Class 4, 6% main on
  profits between the 12,570 lower and 50,270 upper profits limits plus 2%
  additional above the upper limit, with section 11 Class 2 shown to contribute
  nothing after the 6 April 2024 abolition) against CeMPA's UKMOD tscse_s on a
  synthetic single-earner grid at 30k / 45k / 60k / 130k / 360k profits. Class 4
  is an annual charge, so Axiom's annual formula reproduces UKMOD exactly (no
  weekly-rounding residual). UKMOD runs the registration-free public model
  (UKMOD_PUBLIC_B2026.03, system UK_2026, dataset training_data); comparisons
  bridge on the engine's own post-uprating self-employment income (yse). This
  suite runs where the x64 UKMOD runtime and model checkout are available and is
  regenerated by scripts/regenerate_euromod_uk.sh; on runners without them it
  re-emits the committed dashboard report.

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: uk-self-employed-nic
    population: synthetic
    sample_size: 0
    # UK fiscal-year law takes effect 6 April; the engine keys parameter
    # versions off period.start, so the Axiom side evaluates on the 2026-27
    # tax-year boundary (6 Apr 2026 - 5 Apr 2027) rather than the value live on
    # 1 January. UKMOD resolves the policy year from euromod_system (UK_2026)
    # and ignores the case period.
    period: 2026-04-06
    euromod_model_root: $HOME/Downloads/UKMOD_PUBLIC_B2026.03
    euromod_country: UK
    euromod_system: UK_2026
    euromod_dataset: training_data
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-uk-self-employed-nic.json

artifacts:
  report_basename: axiom-euromod-uk-self-employed-nic

dashboard:
  filename: axiom-euromod-uk-self-employed-nic.json
  suite: uk-self-employed-nic
