# SSI -- Axiom vs PolicyEngine on Enhanced CPS, individual slice.

name: ssi-ecps
title: SSI -- Axiom vs PolicyEngine
description: >-
  Compares the SSI monthly benefit from the composed us/ssi program (42 USC
  1382 eligibility and benefit computation, 1382a income exclusions, 1382f
  cost-of-living amounts) against PolicyEngine's person-level ssi on the
  Enhanced CPS. v1 compares every person at the individual rate: eligible
  couples, ineligible-spouse deeming, resources, and blind/disabled
  determination differences are documented divergence classes, not silent
  assumptions. The rulespec root is a synced copy of upstream rulespec-us
  main (refresh with:
  rsync -a --delete --exclude .axiom ~/rulespec-us/us/ ~/.axiom-oracles/roots/rulespec-us/
  after pulling ~/rulespec-us).

# Not CI-runnable while engine-main x rulespec-us-main is broken: composed-root
# staging fails the engine's canonical-path scan (non-canonical filenames in
# us-la/us-nh/us-nj/us -- rulespec-us#1049) before any comparison runs;
# rulespec-us#1050 (removed plural corpus_citation_paths) and -- for the
# composed program lanes -- axiom-compose#29 and axiom-oracles#335 queue
# behind it. Manual lane only; drop this marker when the upstream chain lands
# (axiom-oracles#455 tracks the flip-back).
ci: manual

runner:
  type: axiom-oracles-compare
  axiom_rules_repo: $HOME/axiom-rules-engine
  parameters:
    left: axiom
    right: policyengine
    suite: ssi-ecps
    concepts:
      - us:statutes/42/1382#ssi_benefit
    sample_size: 0
    period: 2026-01
    population: enhanced-cps
    python: "3.13"
    policyengine_version: "4.18.9"
    policyengine_us_version: "1.767.3"
    policyengine_core_version: "3.30.3"
    axiom_compose_binary: $HOME/axiom-compose/.venv/bin/axiom-compose
    axiom_program: programs/us/ssi/fy-2026.yaml
    axiom_composed_program: /tmp/ssi-composed.yaml
    axiom_compiled_program: /tmp/ssi-compiled.json
    axiom_rulespec_repo_roots: $HOME/.axiom-oracles/roots
    rulespec_roots:
      - $HOME/.axiom-oracles/roots/rulespec-us

artifacts:
  report_basename: axiom-policyengine-ssi-ecps

dashboard:
  filename: axiom-policyengine-ssi-ecps.json
  suite: ssi-ecps
