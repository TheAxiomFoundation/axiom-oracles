      aggregate: sum_over_people
      from_facts: [YEARLY_EARNED_INCOME, SELF_EMPLOYMENT_INCOME]
  - match: { kind: suffix, value: unearned_income_in_budget_month }
    scope: household
    source:
      kind: derived
