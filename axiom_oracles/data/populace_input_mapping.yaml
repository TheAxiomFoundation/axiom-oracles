        - SOCIAL_SECURITY_BENEFITS
        - PENSION_INCOME
        - INTEREST_INCOME
        - DIVIDEND_INCOME
        - RENTAL_INCOME
        - UNEMPLOYMENT_INSURANCE_INCOME
  - match: { kind: suffix, value: unit_receives_no_income_other_than_mfip }
    scope: household
    source:
      kind: derived
      transform: sum_is_zero
      aggregate: sum_over_people
      from_facts:
        - YEARLY_EARNED_INCOME
        - SELF_EMPLOYMENT_INCOME
        - SOCIAL_SECURITY_BENEFITS
        - PENSION_INCOME
        - INTEREST_INCOME
        - DIVIDEND_INCOME
        - RENTAL_INCOME
        - UNEMPLOYMENT_INSURANCE_INCOME
  - match: { kind: suffix, value: unit_receives_unearned_income_only }
    scope: household
    source:
      kind: derived
      transform: sum_positive_and_zero
      aggregate: sum_over_people
      from_facts:
        - SOCIAL_SECURITY_BENEFITS
        - PENSION_INCOME
        - INTEREST_INCOME
        - DIVIDEND_INCOME
        - RENTAL_INCOME
        - UNEMPLOYMENT_INSURANCE_INCOME
      zero_facts: [YEARLY_EARNED_INCOME, SELF_EMPLOYMENT_INCOME]
  - match: { kind: suffix, value: unit_has_earned_income_only }
    scope: household
    source:
      kind: derived
      transform: sum_positive_and_zero
      aggregate: sum_over_people
      from_facts: [YEARLY_EARNED_INCOME, SELF_EMPLOYMENT_INCOME]
      zero_facts:
        - SOCIAL_SECURITY_BENEFITS
        - PENSION_INCOME
        - INTEREST_INCOME
        - DIVIDEND_INCOME
        - RENTAL_INCOME
        - UNEMPLOYMENT_INSURANCE_INCOME
  # Contextually correct: this branch is only reached after the
  # earned-only test fails, so "has both" reduces to "has earned income".
  - match: { kind: suffix, value: unit_has_both_earned_and_unearned_income }
    scope: household
    source:
      kind: derived
      transform: positive
      aggregate: sum_over_people
      from_facts: [YEARLY_EARNED_INCOME, SELF_EMPLOYMENT_INCOME]
  - match: { kind: suffix, value: unit_is_applicant_case }
    scope: household
    source: { kind: constant, value: false }
  - match: { kind: suffix, value: prorated_benefit_under_section_0022_12_03 }
    scope: household
    source: { kind: constant, value: 0 }
  - match: { kind: suffix, value: recoupment_amount_if_applicable }
    scope: household
    source: { kind: constant, value: 0 }

  # ---------------------------------------------------------------------
  # AZ Cash Assistance (us-az/tanf program) — DES FAA5 needy-family and
  # payment-standard path. The module budgets in ANNUAL terms (the A1/A2
  # standard is annual; the bridge divides by 12), so income inputs are
