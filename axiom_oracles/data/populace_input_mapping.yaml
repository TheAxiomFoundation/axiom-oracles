  - match: { kind: suffix, value: participant_in_military_receives_basic_allowance_for_housing }
    scope: household
    source: { kind: constant, value: false }
  - match: { kind: suffix, value: participant_is_on_lease_and_resides_in_government_subsidized_housing_unit }
    scope: household
    source: { kind: constant, value: false }
  - match: { kind: suffix, value: participant_with_shelter_cost_obligation_is_in_foreclosure_and_mortgage_company_accepts_back_payments }
    scope: household
    source: { kind: constant, value: false }
  - match: { kind: suffix, value: participant_works_in_exchange_for_rent }
    scope: household
    source: { kind: constant, value: false }
  - match: { kind: suffix, value: shelter_costs_paid_by_third_party_for_fewer_than_three_months }
    scope: household
    source: { kind: constant, value: false }
  - match: { kind: suffix, value: regular_benefit_amount }
    scope: household
    source: { kind: constant, value: 0 }
  - match: { kind: suffix, value: supplemental_benefit_amount }
