  jurisdiction: us-ca
  program: us-ca:policies/income_tax/pilot_liability_pipeline
  output: us-ca:policies/income_tax/pilot_liability_pipeline#ca_pit_pilot_behavioral_health_services_tax
  policyengine:
    target: ca_mental_health_services_tax
    tolerance: 0.01
    relative_tolerance: 0.0000001
  status: ready
  evidence: >-
    The official 2026 Form 540-ES worksheet and California Revenue and
    Taxation Code sections 17041 and 17043 impose a 1 percent Behavioral
    Health Services Tax on completed California taxable income above
    $1,000,000. The reviewed RuleSpec subgraph preserves caller-supplied
    completed taxable income and computes only that additional tax. Independent
    formula and full certified-Populace probes covered all 8,883 positive-weight
    routed California TaxUnits; all values matched PolicyEngine within one cent
    or 1e-7 relative error. This readiness does not promote the pilot's separate
    rate-schedule branch or broad California liability.
