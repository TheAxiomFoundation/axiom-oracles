  - slot: us-ca:policies/income_tax/pilot_liability_pipeline#input.ca_pit_pilot_supplied_completed_taxable_income
    source_kind: pe_upstream_boundary
    status: ready
    evidence: >-
      The Form 540-ES worksheet imposes Behavioral Health Services Tax on
      completed California taxable income. PolicyEngine ca_taxable_income is a
      direct upstream dependency of the distinct
      ca_mental_health_services_tax target, and the reviewed RuleSpec preserves
      that completed amount without reconstructing California AGI, deductions,
      residency, allocation, credits, or broad liability.
    policyengine_variable: ca_taxable_income
    policyengine_relationship: upstream
  relations: []
