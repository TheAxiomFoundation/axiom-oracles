# Bridge manifest for the one-case DK_2025 married-couple household-sum witness.

schema: axiom_oracles.bridge_manifest.v1
suite: dk-child-youth-benefit-couple
program: dk/boerne-og-ungeydelse
period: "2025"
logical_period: "2025"
execution_period: "2025-06-01"
strict: true
bridge:
  module: axiom_oracles/suites/dk_child_youth_benefit.py
  entrypoint: dk_child_youth_benefit_couple_cases
population:
  family: synthetic
  case_source: suite
  pin_required: false
  pinned: null
  note: The married couple and child are constructed and enumerated in the
    named suite; there is no external population dataset identity to pin.
oracle:
  name: euromod
  release: J2.0+
  system: DK_2025
  dataset: DK_training_data

bindings:
  - kind: mapped
    input: dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1#input.child_age_years
    source: case constructor child_age / metadata.child_age
    note: Directly copied from the synthetic child demographic (age 5) into
      both recipient records, not projected from Entity facts. Its single
      observed value does not make its source a harness constant.
    audit: read

  - kind: constant
    input: dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1#input.percentage_change_rounded_to_one_decimal_place
    reason: Both recipient records receive the DK_2025 CPI change 0.285.
    audit: read

  - kind: constant
    input: dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1#input.payment_year_has_additional_statutory_increase
    reason: Both recipient records receive false; the one-off increase is inactive.
    audit: read

  - kind: constant
    input: dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.total_contributions_to_qualifying_pension_accounts
    reason: Both recipient records receive 0 qualifying contributions.
    audit: read

  - kind: constant
    input: dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.pension_contribution_limit_under_pensionsbeskatningsloven_section_16
    reason: Both age-35 recipient records receive the ordinary 2025 cap of 9400.
    audit: read

  - kind: constant
    input: dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.person_only_taxable_part_of_year
    reason: Both recipient records receive false, selecting their full-year bases.
    audit: read

  - kind: constant
    input: dk:statutes/composed/boerne-og-ungeydelse-couple-pipeline#input.current_year_income_reduction_allowance
    reason: Both recipient records receive the 2025 regulated allowance of 917000.
    audit: read

  - kind: bridged
    dimension: personskatteloven_section_7_income_basis
    inputs:
      - dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.personskatteloven_section_7_income_basis
      - dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.personskatteloven_section_7_income_basis_after_section_14_recalculation
    records:
      - earner
    source: euromod:tintbto_s
    mechanism: The runner copies the executed annual household tintbto_s value,
      without scaling, only into the earner's two Person records; the household
      result then sums the separately executed recipient legs.
    covered_by:
      - dashboard/public/data/axiom-euromod-dk-child-youth-benefit-couple.json — executed earner-only bridge receipt and rulespec-dk@9986b6035c4e557b9b40645dfe2f3e4cffb6037c provenance for dk/statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a.yaml
      - dashboard/public/data/axiom-euromod-dk-child-youth-benefit-couple.json — pinned companion fixtures dk/statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a.test.yaml and dk/statutes/composed/boerne-og-ungeydelse-couple-pipeline.test.yaml plus the own-recipient formula in dk/statutes/composed/boerne-og-ungeydelse-couple-pipeline.yaml
      - dashboard/public/data/axiom-euromod-dk-child-youth-benefit-couple.json — the executed bridge receipt (metadata.euromod_to_axiom_input_bridge_applied) records writes ONLY to Person[earner] for both income-basis inputs while metadata.axiom_result_aggregation_applied shows both records executed, so the non-earner ran at its zero baseline; shipped report bytes, so the claim verifies in every hermetic tree (the adapter's unit fixture is a companion, not the evidence)
    audit: read

  - kind: constant
    inputs:
      - dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.personskatteloven_section_7_income_basis
      - dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.personskatteloven_section_7_income_basis_after_section_14_recalculation
    records:
      - non_earner
    value: 0
    reason: The suite initializes both non-earner income-basis records to zero,
      and its record-scoped bridge does not address or overwrite them.
    audit: read

completeness:
  status: verified
  source: suite_cases
  note: The validator reconciles these bindings against the two-recipient Axiom
    input records and bridge targets returned by the suite registry.
