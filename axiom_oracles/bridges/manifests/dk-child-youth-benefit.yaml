# Bridge manifest for the eight-case DK_2025 single-recipient experiment.
# The suite file is the bridge: it builds all Axiom inputs and declares the
# EUROMOD-output overwrite applied by the comparison runner.

schema: axiom_oracles.bridge_manifest.v1
suite: dk-child-youth-benefit
program: dk/boerne-og-ungeydelse
period: "2025"
logical_period: "2025"
execution_period: "2025-06-01"
strict: true
bridge:
  module: axiom_oracles/suites/dk_child_youth_benefit.py
  entrypoint: dk_child_youth_benefit_cases
population:
  family: synthetic
  case_source: suite
  pin_required: false
  pinned: null
  note: The eight cases are constructed and enumerated in the named suite;
    there is no external population dataset identity to pin.
oracle:
  name: euromod
  release: J2.0+
  system: DK_2025
  dataset: DK_training_data

bindings:
  - kind: mapped
    input: dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1#input.child_age_years
    source: case constructor child_age / metadata.child_age
    note: Directly copied from each case demographic; it is not projected from
      Entity facts. The grid supplies ages 1, 5, 10, and 16.
    audit: read

  - kind: constant
    input: dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1#input.percentage_change_rounded_to_one_decimal_place
    reason: Every case supplies the DK_2025 CPI change 0.285.
    audit: read

  - kind: constant
    input: dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1#input.payment_year_has_additional_statutory_increase
    reason: Every 2025 case supplies false; the one-off increase is inactive.
    audit: read

  - kind: mapped
    input: dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.total_contributions_to_qualifying_pension_accounts
    source: _child_youth_benefit_case qualifying_pension_contributions argument
    note: The constructor default supplies 0 to the first seven cases; the
      pension witness supplies 60000. Zero cases do not carry the optional
      qualifying_pension_contributions metadata key.
    audit: read

  - kind: constant
    input: dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.pension_contribution_limit_under_pensionsbeskatningsloven_section_16
    reason: Every age-35 recipient receives the ordinary 2025 cap of 9400.
    audit: read

  - kind: constant
    input: dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.person_only_taxable_part_of_year
    reason: Every case supplies false, so the full-year basis is selected.
    audit: read

  - kind: constant
    input: dk:statutes/composed/boerne-og-ungeydelse-pipeline#input.current_year_income_reduction_allowance
    reason: Every case supplies the 2025 regulated allowance of 917000.
    audit: read

  - kind: bridged
    dimension: personskatteloven_section_7_income_basis
    inputs:
      - dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.personskatteloven_section_7_income_basis
      - dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.personskatteloven_section_7_income_basis_after_section_14_recalculation
    source: euromod:tintbto_s
    mechanism: The runner copies each case's executed annual tintbto_s value,
      without scaling, into both section-7-basis slots before Axiom executes.
      Because person_only_taxable_part_of_year is false, the full-year slot is
      selected; the companion fixture independently exercises the recalculated
      slot.
    covered_by:
      - dashboard/public/data/axiom-euromod-dk-child-youth-benefit.json — executed bridge receipt and rulespec-dk@9986b6035c4e557b9b40645dfe2f3e4cffb6037c provenance for dk/statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a.yaml
      - dashboard/public/data/axiom-euromod-dk-child-youth-benefit.json — pinned companion fixtures dk/statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a.test.yaml and dk/statutes/composed/boerne-og-ungeydelse-pipeline.test.yaml
    audit: read

completeness:
  status: verified
  source: suite_cases
  note: The validator reconciles these bindings against the flat Axiom inputs
    and bridge targets returned by the suite registry.
