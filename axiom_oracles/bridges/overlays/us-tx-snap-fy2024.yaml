notes: >-
  Compile-time overlay replaying the Texas SNAP composition against fiscal
  year 2024 federal parameters: the three USDA cola module ids rewrite to
  fy-2024-cola in the federal state-plan composition module (where the
  imports live) and the three Works Handbook C-121.1 utility standards
  patch to the FY 2024 values in QC technical documentation Table F.7
  (Texas publishes single statewide values: SUA 424, BUA 391, telephone
  60). Same union-not-shadowing materialized root and #759 retirement
  path as the sibling state specs.
module_id_rewrites:
  us:policies/usda/snap/fy-2026-cola/maximum-allotments: us:policies/usda/snap/fy-2024-cola/maximum-allotments
  us:policies/usda/snap/fy-2026-cola/deductions: us:policies/usda/snap/fy-2024-cola/deductions
  us:policies/usda/snap/fy-2026-cola/income-eligibility-standards: us:policies/usda/snap/fy-2024-cola/income-eligibility-standards
