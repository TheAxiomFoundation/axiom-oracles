schema: axiom_oracles.rulespec_overlay.v1
name: us-md-snap-fy2024
program: us-md/policies/dhs/fia/snap/fy-2026-benefit-calculation.yaml
notes: >-
  Compile-time overlay replaying the Maryland SNAP benefit composition
  against fiscal year 2024 federal parameters: the three USDA cola module
  ids rewrite to fy-2024-cola and the three FIA utility allowance amounts
  patch to the January-September 2024 values in QC technical documentation
  Table F.7 (551/337/40; the October-December 2023 vintage 505/309 rows
  match no encoded standard and ride their applied UTIL as an incurred
  shelter cost, which reproduces the file arithmetic). The telephone patch
  is an identity (40 both years) so the mapper's standard table carries the
  tier. Same materialized-root mechanics and #759 retirement path as the
  us-co spec.
module_id_rewrites:
  # Full module ids (not a bare substring): every occurrence across the
  # rewrite files is a canonical id in an import or proof target.
  us:policies/usda/snap/fy-2026-cola/maximum-allotments: us:policies/usda/snap/fy-2024-cola/maximum-allotments
  us:policies/usda/snap/fy-2026-cola/deductions: us:policies/usda/snap/fy-2024-cola/deductions
  us:policies/usda/snap/fy-2026-cola/income-eligibility-standards: us:policies/usda/snap/fy-2024-cola/income-eligibility-standards
rewrite_files:
  - us/statutes/7/2017/a.yaml
  - us/regulations/7-cfr/273/8.yaml
  - us/regulations/7-cfr/273/9.yaml
  - us/regulations/7-cfr/273/10.yaml
  - us-md/policies/dhs/fia/snap/fy-2026-benefit-calculation.yaml
parameter_patches:
  - file: us-md/policies/dhs/fia/snap/standard-utility-allowances.yaml
    rule: md_standard_utility_allowance_amount
    from: "572"
    to: "551"
    source: us/guidance/usda/fns/snap-qc-fy2024-technical-documentation/page-183
  - file: us-md/policies/dhs/fia/snap/standard-utility-allowances.yaml
    rule: md_limited_utility_allowance_amount
    from: "350"
    to: "337"
    source: us/guidance/usda/fns/snap-qc-fy2024-technical-documentation/page-183
  - file: us-md/policies/dhs/fia/snap/standard-utility-allowances.yaml
    rule: md_telephone_allowance_amount
    from: "40"
    to: "40"
    source: us/guidance/usda/fns/snap-qc-fy2024-technical-documentation/page-183
