schema: axiom_oracles.rulespec_overlay.v1
name: us-co-snap-fy2024
program: us-co/policies/cdhs/snap/fy-2026-benefit-calculation.yaml
notes: >-
  Compile-time overlay that replays the Colorado SNAP benefit composition
  against fiscal year 2024 federal parameters. The rulespec-us monorepo ships
  the composition wired to the FY 2026 cost-of-living (COLA) parameter set, so
  this overlay rewrites the three USDA cola module ids (fy-2026-cola ->
  fy-2024-cola) across the composition and every module that imports them, then
  patches the four Colorado standard-utility-allowance amounts down to their
  FY 2024 values. The overlay is materialized as a single self-contained
  rulespec root (a real copy of the us and us-co prefix trees with the rewrites
  and patches applied) and compiled with that root alone: the engine unions
  module ids across repo roots rather than shadowing, so a sparse overlay
  fronting the monorepo would compile both cola vintages and abort with a
  duplicate-rule error. This is a stopgap: once
  TheAxiomFoundation/rulespec-us#759 lands the parameter-set inversion (a
  program selects its cola set by period rather than by hardcoded module id),
  the fiscal year becomes a run-time choice and this overlay retires. The
  copy-then-patch discipline follows the EUROMOD platform patcher precedent in
  axiom_oracles/adapters/euromod/_runner.py, which patches policy switches and
  DefConst values into a copy of the model tree because the source model must
  never be mutated in place.
module_id_rewrites:
  fy-2026-cola: fy-2024-cola
rewrite_files:
  - us/statutes/7/2017/a.yaml
  - us/regulations/7-cfr/273/8.yaml
  - us/regulations/7-cfr/273/9.yaml
  - us/regulations/7-cfr/273/10.yaml
  - us-co/regulations/10-ccr-2506-1/4.206.yaml
  - us-co/regulations/10-ccr-2506-1/4.207.2.yaml
  - us-co/regulations/10-ccr-2506-1/4.207.3.yaml
  - us-co/regulations/10-ccr-2506-1/4.305.2.yaml
  - us-co/regulations/10-ccr-2506-1/4.401.yaml
  - us-co/regulations/10-ccr-2506-1/4.401.1.yaml
  - us-co/regulations/10-ccr-2506-1/4.401.2.yaml
  - us-co/regulations/10-ccr-2506-1/4.407.1.yaml
  - us-co/regulations/10-ccr-2506-1/4.407.3.yaml
  - us-co/regulations/10-ccr-2506-1/4.408.yaml
  - us-co/regulations/10-ccr-2506-1/4.408.2.yaml
  - us-co/policies/cdhs/snap/fy-2026-benefit-calculation.yaml
parameter_patches:
