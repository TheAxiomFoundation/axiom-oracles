prefixes:
  - legal_id_prefix: "ug:"
    country: ug
    mapping_type: not_comparable
    candidate_priority: P4
    rationale: PolicyEngine has no Uganda model and cannot serve as a Uganda tax-benefit oracle. Axiom Uganda outputs are built from official Uganda legislation (the Income Tax Act, Cap. 340, as amended, from Parliament of Uganda assented prints); the household oracle is UGAMOD (UNU-WIDER SOUTHMOD, EUROMOD engine, systems UG_2016-UG_2025 in the licensed SOUTHMOD A4.0 bundle), wired for the PAYE rate schedule by the ug-paye-rate-schedule suite (see the explicit mapping below and concept_mappings.yaml). This prefix classifies any remaining Uganda output that has no explicit entry as not comparable to PolicyEngine; add exact PolicyEngine mappings only if a real one-to-one Uganda PolicyEngine oracle target is ever implemented.
  - legal_id: ug:statutes/act-2012-4/income-tax-amendment-2012/third-schedule-rates-of-tax-substituted#resident_individual_income_tax
    country: ug
    program: tax
    mapping_type: not_comparable
    rationale: >-
      Resident individual income tax (Cap. 340 Third Schedule Part I as
      substituted by Act 4 of 2012: nil to 2,820,000; 10% to 4,020,000;
      20% to 4,920,000; 30% above; an additional 10% on chargeable income
      exceeding 120,000,000). Validated against UGAMOD tin_s by the
      ug-paye-rate-schedule suite (SOUTHMOD A4.0, UG_2025 = FY2025/26):
      probed live exact at every tested income including the
      additional-rate region, which UGAMOD implements. PolicyEngine has
      no Uganda model; the household oracle is UGAMOD.
  - legal_id: ug:statutes/act-2022-11/income-tax-amendment-2022/third-schedule-rental-rate-part-substituted#individual_rental_income_tax
    country: ug
    program: tax
    mapping_type: not_comparable
    rationale: >-
      Individual rental income tax (Third Schedule Part VI as substituted
      by the Income Tax (Amendment) Act, 2022: 12% of gross rental income
      exceeding 2,820,000 per annum, no expense deductions for
      individuals). Validated against UGAMOD tpr_s by the ug-rental suite
      (probed exact: 261,600 at 5m gross; 861,600 at 10m). PolicyEngine
      has no Uganda model; the household oracle is UGAMOD.
  - legal_id: ug:statutes/act-2020-20/income-tax-amendment-2020#presumptive_small_business_income_tax_before_credits
    country: ug
    program: tax
    mapping_type: not_comparable
    rationale: >-
      Presumptive small-business income tax (Act 20 of 2020 Second
      Schedule: turnover bands to the 150m ceiling; fixed amounts without
      records, cumulative-component rates with records). Validated
      against UGAMOD ttn_s by the ug-presumptive suite in both regimes,
      exact at every band. PolicyEngine has no Uganda model; the
      household oracle is UGAMOD.
  - legal_id: ug:statutes/cap-230/national-social-security-fund-act/section-10-payment-of-standard-contribution-by-employers#nssf_employee_share
    country: ug
    program: contributions
    mapping_type: not_comparable
    rationale: >-
      NSSF employee share (five percent of monthly total wages, Cap. 230
      s.11, deductible by the employer from the fifteen percent standard
      contribution). Validated against UGAMOD tscee_s by the
      ug-nssf-contributions suite - probed exact at every income, no
      ceiling, no age window (contrast GHAMOD's age-15-45 cap).
      PolicyEngine has no Uganda model; the household oracle is UGAMOD.
  - legal_id: ug:statutes/cap-230/national-social-security-fund-act/section-10-payment-of-standard-contribution-by-employers#nssf_employer_net_share
    country: ug
    program: contributions
    mapping_type: not_comparable
    rationale: >-
      NSSF employer-net share (the fifteen percent standard contribution
      less the five percent employee share, derived - economically ten
      percent). Validated against UGAMOD tscer_s by the
      ug-nssf-contributions suite, probed exact. PolicyEngine has no
      Uganda model; the household oracle is UGAMOD.
