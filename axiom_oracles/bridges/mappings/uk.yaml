  # Marriage Allowance (Income Tax Act 2007 s.55B). The final per-person
  # transferable amount is the transferor's unused personal allowance capped at
  # 10% of the section 35(1) personal allowance, rounded up to the nearest £10,
  # and gated on the subsection (2) conditions -- the same quantity PolicyEngine
  # UK computes as marriage_allowance. Added for UK coverage wave item 9.
  - legal_id: uk:statutes/ukpga/2007/3/55B#transferable_amount
    country: uk
    program: tax
    mapping_type: direct_variable
    policyengine_variable: marriage_allowance
    entity: person
    period: year
    unit: GBP
    comparison: money
    rationale: Same annual per-person Marriage Allowance transferable amount as PolicyEngine UK's marriage_allowance variable -- 10% of the section 35(1) personal allowance capped at the transferor's unused personal allowance, rounded up to the nearest £10, awarded only when the section 55B(2) conditions are met. The oracle compares the rules-computed transferable amount before the stochastic take-up draw.
  - legal_id: uk:statutes/ukpga/2007/3/55B#statutory_transferable_amount
    country: uk
    program: tax
    mapping_type: not_comparable
    rationale: Intermediate section 55B(4)(b)/(5) figure (10% of the personal allowance rounded up to the nearest £10) before the transferor's unused-personal-allowance cap; PolicyEngine UK exposes only the final capped marriage_allowance, not this pre-cap statutory figure.
  - legal_id: uk:statutes/ukpga/2007/3/55B#individual_entitled_to_marriage_allowance_tax_reduction
    country: uk
    program: tax
    mapping_type: not_comparable
    rationale: Section 55B(1)/(2) entitlement predicate for the Marriage Allowance; PolicyEngine UK folds the equivalent conditions into the marriage_allowance amount rather than exposing a separate boolean entitlement variable.
  - legal_id: uk:statutes/ukpga/2007/3/55B#appropriate_percentage_of_personal_allowance
    country: uk
    program: tax
    mapping_type: not_comparable
    rationale: Section 55B(4)(b) transferable-amount percentage parameter (10%); PolicyEngine UK carries this as the gov.hmrc.income_tax.allowances.marriage_allowance.max parameter and exposes only the composed marriage_allowance amount.
  - legal_id: uk:statutes/ukpga/2007/3/55B#transferable_amount_rounding_multiple
    country: uk
    program: tax
    mapping_type: not_comparable
    rationale: Section 55B(5) rounding-increment parameter (£10); PolicyEngine UK carries this as the gov.hmrc.income_tax.allowances.marriage_allowance.rounding_increment parameter and exposes only the composed marriage_allowance amount.
  - legal_id: uk:statutes/ukpga/2007/3/55B#transferable_amount_2015_16
    country: uk
    program: tax
    mapping_type: not_comparable
    rationale: Section 55B(4)(a) flat transferable amount for tax year 2015-16 (£1,060); PolicyEngine UK simulates from 2023-24 data and does not expose the historic 2015-16 flat figure as a comparable variable.

  # Class 3 voluntary National Insurance (SSCBA 1992 s.13). Class 3 is elective
  # and PolicyEngine UK models ni_class_3 as a frozen microdata input with no
  # rules formula, so there is no PolicyEngine rules oracle for these outputs;
  # UKMOD likewise does not model voluntary Class 3 contributions. Encoded for
  # statutory completeness with an honest no-oracle verdict. Added for UK
  # coverage wave item 9.
  - legal_id: uk:statutes/ukpga/1992/4/13#class_3_weekly_contribution_amount
    country: uk
    program: national_insurance
    mapping_type: not_comparable
    rationale: SSCBA 1992 s.13(1) flat Class 3 weekly contribution rate. PolicyEngine UK's ni_class_3 is an input variable with no formula (voluntary contributions are taken straight from microdata), so there is no PolicyEngine rules value to compare; UKMOD does not model voluntary Class 3 contributions either. No oracle available.
  - legal_id: uk:statutes/ukpga/1992/4/13#entitled_to_pay_class_3_contribution
    country: uk
    program: national_insurance
    mapping_type: not_comparable
    rationale: SSCBA 1992 s.13(1)/(2) predicate for entitlement to pay Class 3 contributions. PolicyEngine UK does not simulate Class 3 eligibility (ni_class_3 is a frozen input); no oracle available.
  - legal_id: uk:statutes/ukpga/1992/4/13#class_3_contribution_if_elected
    country: uk
    program: national_insurance
    mapping_type: not_comparable
    rationale: SSCBA 1992 s.13(1) elective Class 3 weekly contribution amount when the contributor chooses to pay. PolicyEngine UK's ni_class_3 is a frozen microdata input with no rules formula, so there is no PolicyEngine rules value to compare; UKMOD does not model voluntary Class 3. No oracle available.

  # Capital gains tax band split (TCGA 1992 s.1H/1I/1K), matching the
  # PolicyEngine-UK capital_gains_tax surface. The final capital_gains_tax
  # output is the comparable Person-level annual charge; the annual exempt
  # amount, the 18%/24% rates and the band-split intermediates are internal.
  - legal_id: uk:policies/govuk/capital-gains-tax#capital_gains_tax
    country: uk
    program: capital_gains_tax
    mapping_type: direct_variable
    policyengine_variable: capital_gains_tax
    entity: person
    period: year
    unit: GBP
    comparison: money
    rationale: Same annual individual capital gains tax charge as PolicyEngine UK's capital_gains_tax variable — the annual exempt amount (TCGA 1992 s.1K, £3,000) deducted from chargeable gains, then charged at the s.1H basic 18% rate within the unused basic rate band and 24% above (PolicyEngine's higher and additional CGT rates are both 24%). Taxable income and the basic rate limit are supplied inputs on both sides.
  - legal_id: uk:policies/govuk/capital-gains-tax#capital_gains_tax_annual_exempt_amount
    country: uk
    program: capital_gains_tax
    mapping_type: not_comparable
    rationale: Internal parameter (TCGA 1992 s.1K annual exempt amount, £3,000); the compared surface is the final capital_gains_tax charge.
  - legal_id: uk:policies/govuk/capital-gains-tax#capital_gains_tax_basic_rate
    country: uk
    program: capital_gains_tax
    mapping_type: not_comparable
    rationale: Internal parameter (TCGA 1992 s.1H basic CGT rate, 18%); the compared surface is the final capital_gains_tax charge.
  - legal_id: uk:policies/govuk/capital-gains-tax#capital_gains_tax_higher_rate
    country: uk
    program: capital_gains_tax
    mapping_type: not_comparable
    rationale: Internal parameter (TCGA 1992 s.1H higher CGT rate, 24%); the compared surface is the final capital_gains_tax charge.
  - legal_id: uk:policies/govuk/capital-gains-tax#capital_gains_tax_chargeable_gains
    country: uk
    program: capital_gains_tax
    mapping_type: not_comparable
    rationale: Internal derived value (chargeable gains floored at zero, from the supplied capital_gains input); the compared surface is the final capital_gains_tax charge.
  - legal_id: uk:policies/govuk/capital-gains-tax#capital_gains_tax_gains_after_annual_exempt_amount
    country: uk
    program: capital_gains_tax
    mapping_type: not_comparable
    rationale: Internal derived value (chargeable gains less the annual exempt amount); the compared surface is the final capital_gains_tax charge.
  - legal_id: uk:policies/govuk/capital-gains-tax#capital_gains_tax_unused_basic_rate_band
    country: uk
    program: capital_gains_tax
    mapping_type: not_comparable
    rationale: Internal derived value (the individual's unused basic rate band after taxable income, s.1I); the compared surface is the final capital_gains_tax charge.
  - legal_id: uk:policies/govuk/capital-gains-tax#capital_gains_tax_basic_rate_gains
    country: uk
    program: capital_gains_tax
    mapping_type: not_comparable
    rationale: Internal derived value (gains charged at the basic rate, s.1I); the compared surface is the final capital_gains_tax charge.
  - legal_id: uk:policies/govuk/capital-gains-tax#capital_gains_tax_higher_rate_gains
    country: uk
    program: capital_gains_tax
    mapping_type: not_comparable
    rationale: Internal derived value (the higher rate excess above the basic rate band, s.1I); the compared surface is the final capital_gains_tax charge.
  # Business rates household incidence proxy (LGFA 1988 s.43 enabling
  # authority). PolicyEngine-UK models the incidence as shareholding times the
  # total non-domestic rates revenue across the four nations; the rulespec
  # module restates that product. Both quantities are supplied inputs.
  - legal_id: uk:policies/govuk/business-rates#business_rates
    country: uk
    program: business_rates
    mapping_type: direct_variable
    policyengine_variable: business_rates
    entity: household
    period: year
    unit: GBP
    rationale: Same household business rates incidence as PolicyEngine UK's business_rates variable — the household's shareholding times the total non-domestic rates revenue raised across England, Scotland, Wales and Northern Ireland (LGFA 1988 s.43 creates the liability being distributed). Shareholding and the total revenue are supplied inputs on both engines.
