  # Composed single-employee UKMOD oracle pilot pipelines. These wire the
  # supplied s10/s23 and s8 stage boundaries from gross employment income so
  # UKMOD (tin_s, tscee_s) can be compared end to end; their liability and NIC
  # outputs correspond to the canonical Income Tax Act 2007 and SSCBA 1992
  # rules that are separately mapped, so the pilot copies are not additional
