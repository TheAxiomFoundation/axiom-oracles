    description: WA TANF benefit (annualized)
    category: cash
    comparison: amount
    # Both sides: max(0, payment standard - countable income) with the
    # $500 + 50% earned income work deductions; the payment standard and
    # gross earned income limit tables verified identical in the
    # wa-tanf-payment-standard parameter suite.
    tolerance: 25
    priority: high
    targets:
      axiom: wa_tanf_annual_benefit
      policyengine: wa_tanf

