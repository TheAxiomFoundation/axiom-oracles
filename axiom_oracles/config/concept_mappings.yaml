    # housing benefit after the regulation 71 / regulation 51 65 per cent taper,
    # less the regulation 74 / regulation 55 non-dependant deductions. UKMOD
    # returns the same entitlement as bho_s (bho_uk BenCalc:
    # i_bho_maxHousBen - 0.65*(ymn01_s - i_bho_prelimAmt), less non-dependant
