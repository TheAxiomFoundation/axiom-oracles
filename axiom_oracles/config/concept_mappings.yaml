concepts:
  us:statutes/7/2014/u#snap_benefit:
    description: SNAP benefit amount
    category: food
    comparison: amount
    tolerance: 1
    priority: high
    targets:
      axiom: us:statutes/7/2014/u#snap_benefit
      policyengine: snap
      prd: value.snap

  us:tax/federal-income-tax#liability:
    description: Federal income tax liability
    category: tax
    comparison: amount
    tolerance: 15
    priority: high
    components:
      - us:tax/federal-income-tax#standard_deduction
      - us:tax/federal-income-tax#taxable_income
      - us:tax/federal-income-tax#tax_before_credits
      - us:tax/federal-income-tax#eitc
      - us:tax/federal-income-tax#ctc
      - us:tax/federal-income-tax#amt
    targets:
      axiom: us:statutes/26/6401#income_tax
      policyengine: income_tax
      taxsim: fiitax

  us:tax/federal-income-tax#standard_deduction:
    description: Federal standard deduction
    category: tax
    comparison: amount
    tolerance: 5
    parent: us:tax/federal-income-tax#liability
    targets:
      axiom: us:policies/irs/rev-proc-2025-32/standard-deduction#standard_deduction
      policyengine: standard_deduction
      taxsim: v13

  us:tax/federal-income-tax#taxable_income:
