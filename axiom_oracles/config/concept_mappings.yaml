    # draw against $SCPTUu6y / $SCPTU6to15y, which for hypothetical benefit units
    # can zero the reported award away from the entitlement. The grid is
    # single-child so the per-child pipeline amount equals the benefit-unit
    # bchmt_s. UKMOD bchmt_s is monthly; the adapter annualizes it (×12) so the
    # comparison is annual-to-annual against the pipeline's annual amount. The
    # weekly statutory rate is identical (28.20); the residual is only the
    # annualization convention (UKMOD 365/7 vs the pipeline's 52 weeks/year),
    # dispositioned explained_residual. An absolute tolerance to the pound
    # catches structural encoding gaps; take-up-driven zeroing is classified as a
    # UKMOD-side artefact rather than absorbed by tolerance.
    tolerance: 1
