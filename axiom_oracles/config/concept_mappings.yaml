    # correction, which for hypothetical benefit units can zero the reported
    # award away from the entitlement (see euromod_issues.json
    # ukmod-hb-bho-takeup-transition). The suite bridges UKMOD's assessed HB
    # means ymn01_s into the pipeline's applicable income so both engines taper
    # the identical income. UKMOD bho_s is monthly; the adapter annualizes it
    # (×12) so the comparison is annual-to-annual against the pipeline's annual
    # entitlement. An absolute tolerance to the pound catches structural encoding
    # gaps; the take-up-driven zeroing is classified as a UKMOD-side artefact
    # rather than absorbed by tolerance.
