  uk:statutes/social_security/workers/pilot_worker_class_1_nic_pipeline#uk_nic_pilot_primary_class_1_contribution:
    description: UK Class 1 employee National Insurance contribution (single employee)
    category: social_contributions
    comparison: amount
    # UKMOD computes the contribution week by week on weekly-rounded
    # thresholds and sums; Axiom applies the annual statutory formula. The
    # residual is a small weekly-rounding difference (about £4-£6 across the
    # grid), so keep an absolute tolerance that absorbs it while still
    # catching structural encoding gaps.
    tolerance: 8
    priority: high
    locales: [UK]
    scope:
      type: country
      geoid: UK
    targets:
      axiom:
        name: uk_nic_pilot_primary_class_1_contribution
        scope:
          type: country
          geoid: UK
      euromod:
        name: tscee_s
        scope:
          type: country
          geoid: UK

  uk:statutes/social_security/workers/pilot_worker_self_employed_nic_pipeline#uk_nic_pilot_se_self_employed_contribution:
    description: UK self-employed National Insurance contribution (Class 4; single earner)
    category: social_contributions
    comparison: amount
    # Class 4 is an annual charge on profits, so Axiom's annual statutory
    # formula reproduces UKMOD's tscse_s exactly with no weekly-rounding
    # residual (Class 2 is nil after the 6 April 2024 abolition). Keep a small
    # absolute tolerance to absorb float noise while catching encoding gaps.
    tolerance: 2
    priority: high
    locales: [UK]
    scope:
      type: country
      geoid: UK
    targets:
      axiom:
        name: uk_nic_pilot_se_self_employed_contribution
        scope:
          type: country
          geoid: UK
      euromod:
        name: tscse_s
        scope:
          type: country
          geoid: UK

  uk:policies/universal_credit_composed_award_pipeline#uc_pilot_award_amount:
    description: UK Universal Credit household award (hypothetical benefit unit)
    category: benefits
    comparison: amount
    # The composed rulespec-uk pilot (rulespec-uk#72) applies the statutory
    # monthly section 8(1) award; UKMOD returns the same award subject to its
    # benefit take-up correction, which for hypothetical benefit units can zero
    # the reported award away from the entitlement (see euromod_issues.json
    # ukmod-uc-bsauc-takeup-correction). An absolute tolerance to the pound
    # catches structural encoding gaps; the take-up-driven zeroing and the
    # 2026 two-child-limit timing gap are classified as UKMOD-side artefacts
    # rather than absorbed by tolerance.
    tolerance: 1
    priority: high
    locales: [UK]
    scope:
      type: country
      geoid: UK
    targets:
      axiom:
        name: uc_pilot_award_amount
        scope:
          type: country
          geoid: UK
      euromod:
        name: bsauc_s
        scope:
          type: country
          geoid: UK

  uk:statutes/child_benefit/pilot_child_benefit_oracle_pipeline#uk_cb_pilot_annual_entitlement:
    description: UK Child Benefit annual entitlement (gross, pre-charge; family by child count)
    category: benefits
    comparison: amount
    # Axiom encodes the gross SSCBA 1992 s.141 entitlement (SI 2006/965 weekly
    # rates annualised over 52 benefit weeks). UKMOD's bch_s is Child Benefit
    # net of the High Income Child Benefit Charge, which UKMOD applies as the
    # separate bchrd_uk clawback (bchrd_s) and nets back into bch_s; summing the
    # euromod target list bch_s + bchrd_s reconstructs the same gross pre-charge
    # amount. The High Income Child Benefit Charge itself is not corpus-encoded
    # on the Axiom side (rulespec-uk#75), so the comparison is gross-to-gross.
    # UKMOD annualises the weekly rate over 52.14 weeks while Axiom uses 52, a
    # systematic ~0.27% convention residual: dividing UKMOD's gross by 52.14 and
    # Axiom's by 52 both recover the same statutory weekly rates (27.05, 44.95,
    # 62.85), so the difference is a weeks-per-year convention, not an encoding
    # gap. A 0.3% relative tolerance absorbs it while still catching structural
    # gaps, and a £1 absolute floor covers float noise on the smallest amounts.
    tolerance: 1
    relative_tolerance: 0.003
    priority: high
    locales: [UK]
    scope:
      type: country
      geoid: UK
    targets:
      axiom:
        name: uk_cb_pilot_annual_entitlement
        scope:
          type: country
          geoid: UK
      euromod:
        name:
          - bch_s
          - bchrd_s
        scope:
          type: country
          geoid: UK

  uk:policies/pension_credit_composed_award_pipeline#pc_pilot_award_amount:
    description: UK Pension Credit household award (hypothetical pensioner benefit unit)
    category: benefits
    comparison: amount
    # The composed rulespec-uk Pension Credit pilot applies the statutory State
    # Pension Credit Act 2002 section 2 guarantee credit weekly; UKMOD returns
    # the same guarantee credit as boamt_s subject to its take-up / Universal-
    # Credit-transition correction, which for hypothetical benefit units can
    # zero the reported award away from the entitlement (see euromod_issues.json
    # ukmod-pc-boamt-takeup-transition). UKMOD boamt_s is monthly; the adapter
    # divides it by UKMOD's weekly-to-monthly factor (365/7/12) so the
    # comparison is weekly-to-weekly against the pipeline's weekly award. An
    # absolute tolerance to the pound catches structural encoding gaps; the
    # take-up-driven zeroing is classified as a UKMOD-side artefact rather than
    # absorbed by tolerance.
    tolerance: 1
    priority: high
    locales: [UK]
    scope:
      type: country
      geoid: UK
    targets:
      axiom:
        name: pc_pilot_award_amount
        scope:
          type: country
          geoid: UK
      euromod:
        name: boamt_s
        scope:
          type: country
          geoid: UK

  uk:statutes/social_security/workers/pilot_worker_employer_secondary_nic_pipeline#uk_nic_pilot_er_secondary_class_1_contribution:
    description: UK employer secondary Class 1 National Insurance contribution (single employment)
    category: social_contributions
