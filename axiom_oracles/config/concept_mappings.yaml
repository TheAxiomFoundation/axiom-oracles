targets:
  axiom:
    scope:
      type: country
      geoid: US
  policyengine:
    scope:
      type: country
      geoid: US
  taxsim:
    scope:
      type: country
      geoid: US
  prd:
    scope:
      type: country
      geoid: US
  accessnyc:
    scope:
      type: census_place
      geoid: "3651000"

concepts:
  us:statutes/7/2014/u#snap_benefit:
    description: SNAP benefit amount
    category: food
    comparison: amount
    # PolicyEngine reports monthly SNAP amounts from annualized parameters,
    # while RuleSpec applies the whole-dollar allotment and 30%-of-net-income
    # rounding rules directly. Keep a narrow dollar tolerance so the dashboard
    # catches structural gaps without flagging known annualization noise.
    tolerance: 7
    priority: high
    targets:
      # Compare the composed program benefit, not the imported federal
      # monthly allotment. The local snap_benefit rule applies each
      # state's composed eligibility gate before exposing a payable SNAP
      # amount; the imported 7 CFR allotment remains useful as a diagnostic
      # intermediate but can overstate benefits for ineligible households.
      axiom: snap_benefit
      policyengine: snap_normal_allotment
      prd: value.snap

  us:tax/federal-income-tax#liability:
    description: Federal income tax liability
    category: tax
    comparison: amount
    tolerance: 15
    priority: high
    components:
      - us:tax/federal-income-tax#standard_deduction
      - us:tax/federal-income-tax#taxable_income
      - us:tax/federal-income-tax#tax_before_credits
      - us:tax/federal-income-tax#nonrefundable_credits
      - us:tax/federal-income-tax#eitc
      - us:tax/federal-income-tax#ctc
      - us:tax/federal-income-tax#cdcc
      - us:tax/federal-income-tax#amt
      - us:tax/federal-income-tax#capital_gain
      - us:tax/payroll#employee_oasdi
      - us:tax/payroll#employee_medicare
      - us:tax/payroll#employer_oasdi
      - us:tax/payroll#employer_medicare
    targets:
      axiom: us:statutes/26/6401#income_tax
      policyengine: income_tax
      taxsim: fiitax

  us:tax/federal-income-tax#standard_deduction:
