  us:statutes/7/2014/u#snap_benefit:
    description: SNAP benefit amount
    category: food
    comparison: amount
    # PolicyEngine reports monthly SNAP amounts from annualized parameters,
    # while RuleSpec applies the whole-dollar allotment and 30%-of-net-income
    # rounding rules directly. Keep a narrow dollar tolerance so the dashboard
    # catches structural gaps without flagging known annualization noise.
    tolerance: 7
    priority: high
    targets:
      # Compare the composed program benefit, not the imported federal
      # monthly allotment. The local snap_benefit rule applies each
      # state's composed eligibility gate before exposing a payable SNAP
      # amount; the imported 7 CFR allotment remains useful as a diagnostic
      # intermediate but can overstate benefits for ineligible households.
      axiom: snap_benefit
      policyengine: snap_normal_allotment
      prd: value.snap

