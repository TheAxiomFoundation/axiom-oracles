  us:tax/federal-income-tax#tax_before_credits:
    description: Federal tax before credits
    category: tax
    comparison: amount
    tolerance: 5
    parent: us:tax/federal-income-tax#liability
    targets:
      # Same two-component composition the PolicyEngine target below needs, for
      # the same reason: 1(j) main rates are the ORDINARY-bracket tax only, so
      # on any unit with net capital gain they cannot reach `taxbc` scope. The
      # 1(h) worksheet total (main + unrecaptured 1250 + 28%-rate gain) is the
      # missing half. Mapping main rates alone made every capital-gains unit
      # read axiom-low against TAXSIM's `v28` by the full preferential-rate
      # spread — the "tax-before-credits continuum" class in axiom-oracles#304
      # (e.g. ecps-tax-unit-154437: axiom 431,687 vs v28 49,930,649 on
      # $249,062,816 of LTCG, while axiom's own `liability`, which does carry
      # the 1(h) tax, lands within 0.1% of `v28`). The comparator sums a list
      # target, as it already does for us:tax/payroll#employee_fica.
      axiom:
        - us:statutes/26/1/j#income_tax_main_rates
        - us:statutes/26/1/h#capital_gains_tax
      # Tax-Calculator's `taxbc` is regular tax before credits including the
      # Schedule D preferential-rate worksheet, so it must be compared against
      # PolicyEngine's ordinary-bracket tax PLUS its separate capital-gains tax.
      # PE's `income_tax_main_rates` alone excludes capital gains (it subtracts
      # `capital_gains_excluded_from_taxable_income` before applying brackets);
      # `income_tax_before_credits = main_rates + capital_gains_tax + AMT`. The
      # comparator sums a list target, so [main_rates, capital_gains_tax] equals
      # `taxbc`. AMT is excluded because `taxbc` excludes it too (Tax-Calculator
      # adds `c09600` separately); the AMT concept maps `taxcalc: c09600` alone.
      policyengine: [income_tax_main_rates, capital_gains_tax]
      # TAXSIM's v28 is federal tax before credits WITH the capital-gains
      # preferential-rate worksheet and WITHOUT NIIT (verified: fiitax =
      # v28 - credits + niit on the pinned 2.30.0 binary), matching this
      # concept's taxbc scope. v19 is the schedule tax on taxable income
      # with NO preferential rates — mapping it here overstated TAXSIM by
      # the full ordinary-vs-preferential spread on capital-gains units.
      taxsim: v28
      taxcalc: taxbc

