name: uk-income-tax-scottish-ukmod
title: Scottish income tax — Axiom vs UKMOD
description: >-
  Compares the composed Scottish non-savings non-dividend income-tax pipeline
  encoded in Axiom RuleSpec (Income Tax Act 2007 section 11A charging Scottish
  rates on the non-savings income of a Scottish taxpayer, the Scottish Rate
  Resolution 2026-27 starter/basic/intermediate/higher/advanced/top bands set
  under Scotland Act 1998 section 80C, and the UK-wide section 35 personal
  allowance with its £100,000 taper) against CeMPA's UKMOD tin_s on a synthetic
  earned-income grid for a Scottish taxpayer. The household is routed to
  Scotland with the UKMOD region code drgn1=12 (the UK.xml Factor_Condition
  named "Scotland"), so UK_2026 applies its Scottish rate bands; a drgn1=8
  England control returns the different rest-of-UK liability. Earned income
  crosses every Scottish band, including £45,000 which straddles the £43,662
  Scottish higher-rate threshold — a Scotland-only boundary the rest of the UK
  does not have — and £130,000/£160,000 which reach the top rate after the
  personal allowance has fully tapered. Savings and dividends are zero (they
  stay at UK rates). UKMOD runs the registration-free public model
  (UKMOD_PUBLIC_B2026.03, system UK_2026, dataset training_data). This suite
  runs where the x64 UKMOD runtime and model checkout are available and is
  regenerated by scripts/regenerate_euromod_uk.sh; on runners without them it
  re-emits the committed dashboard report. A live sweep reproduces every case's
  tin_s to the penny, so no dispositions are required.

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: uk-income-tax-scottish
    population: synthetic
    sample_size: 0
    # UK fiscal-year law takes effect 6 April; the engine keys parameter
    # versions off period.start, so the Axiom side evaluates on the 2026-27
    # tax-year boundary (6 Apr 2026 - 5 Apr 2027) rather than the value live on
    # 1 January. UKMOD resolves the policy year from euromod_system (UK_2026)
    # and ignores the case period.
    period: 2026-04-06
    euromod_model_root: $HOME/Downloads/UKMOD_PUBLIC_B2026.03
    euromod_country: UK
    euromod_system: UK_2026
    euromod_dataset: training_data
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-uk-income-tax-scottish.json

artifacts:
  report_basename: axiom-euromod-uk-income-tax-scottish

dashboard:
  filename: axiom-euromod-uk-income-tax-scottish.json
  suite: uk-income-tax-scottish
