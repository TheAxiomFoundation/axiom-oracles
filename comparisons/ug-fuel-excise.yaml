name: ug-fuel-excise
title: Uganda fuel excise duty — Axiom vs UGAMOD
description: >-
  Compares the rulespec-ug fuel excise duty (Excise Duty (Amendment) Act 2024,
  Schedule 2 items 8(a) and (b): motor spirit Shs 1550 a litre, gas oil Shs
  1230 a litre, in force 1 July 2024) against UGAMOD tex10_s (SOUTHMOD A4.0,
  country UG, system UG_2025 = FY2025/26, dataset ug_2024_a1) on litre inputs,
  which pass unuprated. Run live exact: 278,000 a year at 100 litres of each
  and 775,000 at 500 litres of petrol. The vintage is open: rulespec-ug
  encodes only the 2024 rows and the FY2025/26 amendment print has not been
  captured (rulespec-ug#1, open item 1). The match shows that UG_2025 and the
  encoding price the same 2024 rows, not that those rows are the FY2025/26
  law. Results are based on the tax-benefit microsimulation model for Uganda
  (UGAMOD) in SOUTHMOD_A4.0, developed, maintained and managed by UNU-WIDER
  with SASPRI, the LSE International Inequalities Institute and local
  partners, run on the EUROMOD software (EM_Executable 1.0.0 via the euromod
  connector 0.2.18) under the ug_2024_a1 dataset configuration (Uganda Bureau
  of Statistics, Uganda National Household Survey 2023/24); only the dataset's
  variable list is read and every household is synthetic. The results and
  their interpretation are Axiom's responsibility. The SOUTHMOD bundle is
  licensed and non-redistributable: it is referenced only by path
  (euromod_model_root), and no model XML, dataset row, or DRD text is
  committed.

# Not runnable on the CI matrix runners. The SOUTHMOD bundle is licensed to
# Axiom by UNU-WIDER under the SOUTHMOD_A4.0 Adhesion Agreement, which bars
# providing the model or its input datasets to any third party (clause 4), so
# no shared runner can hold it; the runner also needs the x64 EUROMOD engine
# (EM_Executable.dll) under EUROMOD_PYTHON and a .NET runtime. Manual lane
# only: scripts/regenerate_euromod_ug.sh, where the licensed bundle and
# runtime exist, refreshes the committed report. This marker stays unless
# UNU-WIDER licenses a runner-held copy.
ci: manual

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: ug-fuel-excise
    population: synthetic
    sample_size: 0
    period: 2026
    euromod_model_root: $HOME/.axiom/oracles/southmod/bundle/SOUTHMOD_A4.0
    euromod_country: UG
    euromod_system: UG_2025
    euromod_dataset: ug_2024_a1
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-ug-fuel-excise.json

artifacts:
  report_basename: axiom-euromod-ug-fuel-excise

dashboard:
  filename: axiom-euromod-ug-fuel-excise.json
  suite: ug-fuel-excise
