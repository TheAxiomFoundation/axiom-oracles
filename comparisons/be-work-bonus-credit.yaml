name: be-work-bonus-credit
title: Belgium Article 289ter/1 low-wage work-bonus credit (tintcly) — Axiom vs EUROMOD
description: >-
  Compares the CIR 1992 Article 289ter/1 refundable low-wage work-bonus tax
  credit encoded in Axiom RuleSpec against EUROMOD Belgium tintcly_s — the
  tinfe_be fiscal-expenditure component EUROMOD BE_2025 labels the earned-income
  (EITC-style) credit — on a single-worker earnings sweep. The encoded
  belgium_pit_pilot_article_289ter1_low_wage_work_bonus_credit computes the credit
  from the ONSS full-year equal-month work-bonus A/B amounts capped by the
  employee contributions actually granted; EUROMOD BE_2025 tintcly_s computes the
  same credit from the UNCAPPED i_tsceerdA_s / i_tsceerdB_s bases. That single
  difference is filed upstream as ec-jrc/JRC-EUROMOD-software-source-code#12 and
  is visible on the low-wage cases, where it is dispositioned as an
  upstream_engine_gap. The sweep spans the credit region: 10k / 14k are low-wage
  (issue #12 visible); 30k / 45k sit where the credit tapers and the bases
  coincide. Comparisons bridge on the engine's post-uprating gross (yem). EUROMOD
  runs the registration-free public model (EUROMOD_RELEASES_J2.0+, system
  BE_2025) under the real dataset-configuration name BE_2024_c1_2015_03_e2 (the
  dataset-name gating workaround; no licensed microdata is read) with input rows
  templated from the bundled BE_training_data schema. This suite runs where the
  x64 EUROMOD runtime and model checkout are available; on runners without them
  the registry re-emits the committed dashboard report.

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: be-work-bonus-credit
    population: synthetic
    sample_size: 0
    period: 2025
    euromod_model_root: $HOME/Downloads/EUROMOD_J2.0/EUROMOD_RELEASES_J2.0+
    euromod_country: BE
    euromod_system: BE_2025
    euromod_dataset: BE_2024_c1_2015_03_e2
    euromod_template_dataset: BE_training_data
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-be-work-bonus-credit.json

artifacts:
  report_basename: axiom-euromod-be-work-bonus-credit

dashboard:
  filename: axiom-euromod-be-work-bonus-credit.json
  suite: be-work-bonus-credit
