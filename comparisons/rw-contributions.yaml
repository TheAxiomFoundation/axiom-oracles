name: rw-contributions
title: Rwanda rw-contributions — Axiom vs RWAMOD
description: >-
  Compares the rulespec-rw RSSB contribution stack against the RWAMOD tsc*
  arms by employment sector: pension 6% + 6% (Presidential Order 086/01 twelve
  percent from 1 January 2025 halved by the Law 05/2015 Article 8
  equal-sharing rule) vs tsceepi_s/tscerpi_s; maternity 0.3% + 0.3% (Law
  003/2016 Article 7) vs tsceeml_s/tscerml_s; RAMA 7.5% + 7.5% (Law 24/2001
  Article 44) vs tsceehl_s/tscerhl_s on the public-servant case; and MMI
  insured 5% + government 17.5% (Law 23/2005 Article 30) vs
  tsceehl01_s/tscerhl01_s on the military case. Probed sector keying: industry
  code lindi=10 (the public-servant row) selects RAMA, loc=0 (the military
  row) selects MMI, and the private row (loc=3, lindi=5) pays neither. The
  CBHI employee levy (PM Order 105/03 of 30/09/2020 Article 5, 0.5% of net
  salary, tsceehl03_s) is not compared here: RWAMOD echoes no net-salary base,
  and the July bridge (levy / 0.005) could not fail. Probed, RWAMOD's levy
  base is gross less employment tax and the employee pension, maternity and
  RAMA/MMI amounts; the levy is compared in rw-dispy on the pipeline's own
  composed net salary. Occupational-hazards disposition (rulespec-rw#1
  finding): the model applies a 2% employer contribution (tscerac_s, probed
  2,000.00 at uprated monthly 100,000) where Law 06/2003 Article 10 makes the
  branch employer-only and Article 9 delegates the rate to a Presidential
  Decree that is not publicly digitized - no encodable primary carrier,
  documented gap, no live case. The Axiom side evaluates period 2026; RWAMOD
  runs RW_2025 (CY2025), and every schedule this suite compares is
  value-identical across 2025 and 2026. Results are based on the tax-benefit
  microsimulation model for Rwanda (RWAMOD) in SOUTHMOD_A4.0, developed,
  maintained and managed by UNU-WIDER with SASPRI, the LSE International
  Inequalities Institute and local partners, run on the EUROMOD software
  (EM_Executable 1.0.0 via the euromod connector 0.2.18) under the registered
  rw_2024_a1 dataset name; the bundle ships no Rwandan microdata, so a
  header-only input file is built locally from the model's own variable list
  and every household is synthetic. The results and their interpretation are
  Axiom's responsibility. The SOUTHMOD bundle is licensed and
  non-redistributable: it is referenced only by path (euromod_model_root), and
  no model XML, dataset row, or DRD text is committed.

# Not runnable on the CI matrix runners. The SOUTHMOD bundle is licensed to
# Axiom by UNU-WIDER under the SOUTHMOD_A4.0 Adhesion Agreement, which bars
# providing the model or its input datasets to any third party (clause 4), so
# no shared runner can hold it; the runner also needs the x64 EUROMOD engine
# (EM_Executable.dll) under EUROMOD_PYTHON and a .NET runtime. Manual lane
# only: scripts/regenerate_euromod_rw.sh, where the licensed bundle and
# runtime exist, refreshes the committed report. This marker stays unless
# UNU-WIDER licenses a runner-held copy.
ci: manual

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: rw-contributions
    population: synthetic
    sample_size: 0
    period: 2026
    euromod_model_root: $HOME/.axiom/oracles/southmod/bundle/SOUTHMOD_A4.0
    euromod_country: RW
    euromod_system: RW_2025
    euromod_dataset: rw_2024_a1
    euromod_annualize_outputs: false
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-rw-contributions.json

artifacts:
  report_basename: axiom-euromod-rw-contributions

dashboard:
  filename: axiom-euromod-rw-contributions.json
  suite: rw-contributions
