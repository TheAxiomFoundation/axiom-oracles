name: md-snap-qc
title: Maryland SNAP — Axiom vs USDA SNAP QC administrative data
description: >-
  Replays Maryland SNAP Quality Control public-use reviews (FY2024, 722
  in-scope active-case reviews) through the Axiom RuleSpec composition and
  compares the benefit against FSBEN and the same five stage intermediates as
  the co/ny/ca suites (gross income, standard deduction, excess-shelter
  deduction, and net income against the file's constructed values; the maximum
  allotment against the oracle's FY2024 table). The overlay patches the
  January-September 2024 amounts; the October-December 2023 vintage rows ride
  their applied UTIL as an incurred shelter cost. Maryland's SSI-CAP (code 2)
  reviews are excluded by the loader. All 722 reviews reproduce exactly at
  zero stage tolerance on the first run. FY2024 law is evaluated through a
  compile-time overlay (fy-2026 cola module ids rewritten to fy-2024-cola plus
  the state's Table F.7 SUA amount patches) at the nominal period 2026-01
  (TheAxiomFoundation/rulespec-us#759 retires the overlay). Runs where the
  engine binary, a rulespec-us checkout with the fy-2024-cola modules and the
  state's SNAP layer (rulespec-us#842), and the QC file all exist; a run
  elsewhere re-emits the committed dashboard report, which never replaces a
  real run's report.
documentation: docs/snap-qc-oracle-playbook.md

# Runs only in the SNAP QC live replay lane
# (.github/workflows/snap-qc-replay.yml), which provisions what the bare
# matrix runners lack: the axiom-rules-engine binary at rulespec-us's artifact
# pin, a rulespec-us checkout, and the pinned QC public-use file. When
# rulespec-us moves, the affected rerun hands this suite to that lane and
# commits its report only if the replay ran live and exact; the weekly matrix
# skips it, since the lane runs weekly itself. On a bare runner
# run_comparison.py could only re-emit the committed report, which is how the
# real NY, CA, AZ, MD, and GA reports were overwritten on 2026-09-23.
ci: snap-qc-replay

runner:
  type: snap-qc-compare
  parameters:
    jurisdiction: us-md
    fiscal_year: 2024
    sample_size: 0
    stage_tolerance: 0
    dashboard_filename: axiom-snapqc-md-snap.json

artifacts:
  report_basename: axiom-snapqc-md-snap

dashboard:
  filename: axiom-snapqc-md-snap.json
  suite: md-snap-qc
