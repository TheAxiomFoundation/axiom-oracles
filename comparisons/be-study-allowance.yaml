name: be-study-allowance
title: Belgium study allowances (bed_s) — Axiom vs EUROMOD
description: >-
  Compares the Belgian study-allowance surface encoded in Axiom RuleSpec against
  EUROMOD Belgium bed_s. Study allowances are a Community competence: the Flemish
  study-financing decree of 8 June 2007 (higher-education study grant) and the
  Groeipakket decree of 27 April 2018 (school allowance), and the French-Community
  decree of 18 November 2021 with its amounts order of 21 September 2016
  (allocation d'etudes). The region-routing module selects the Flemish or
  French-Community amount by drgn1. Six single-household BE_2025 cases match bed_s
  exactly (Flanders higher-education full 3046.30 and intermediate 2092.30,
  Flanders secondary 1139.56, Wallonia higher-education 869.21, and Flanders and
  Wallonia above-threshold zeros). Brussels' random ninety-ten split and the
  non-take-up correction are gated on Run_Cond !IsUsedDatabase and do not run on
  hypothetical data, so Brussels is out of scope.

  This suite runs one household per EUROMOD subprocess call
  (comparison_batch_size 1). EUROMOD's bed_be returns different bed_s for an
  identical household depending on its batch position within a run (filed as
  euromod-be-2025-bed-study-allowance-batch-position-contamination); running one
  household per call makes every case deterministic. EUROMOD runs the
  registration-free public model (EUROMOD_RELEASES_J2.0+, system BE_2025) under
  the real dataset-configuration name BE_2024_c1_2015_03_e2 (the dataset-name
  gating workaround; no licensed microdata is read) with input rows templated
  from the bundled BE_training_data schema. This suite runs where the x64 EUROMOD
  runtime and model checkout are available; on runners without them the registry
  re-emits the committed dashboard report.

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: be-study-allowance
    population: synthetic
    sample_size: 0
    period: 2025
    comparison_batch_size: 1
    euromod_model_root: $HOME/Downloads/EUROMOD_J2.0/EUROMOD_RELEASES_J2.0+
    euromod_country: BE
    euromod_system: BE_2025
    euromod_dataset: BE_2024_c1_2015_03_e2
    euromod_template_dataset: BE_training_data
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-be-study-allowance.json

artifacts:
  report_basename: axiom-euromod-be-study-allowance

dashboard:
  filename: axiom-euromod-be-study-allowance.json
  suite: be-study-allowance
