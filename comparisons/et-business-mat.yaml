name: et-business-mat
title: Ethiopia business income tax and minimum tax — Axiom vs ETMOD
description: >-
  Compares the rulespec-et annual business income tax (Proclamation 1395/2025
  Article 19(2) schedule with the Article 23 minimum-tax floor,
  business_income_tax_payable) against ETMOD tin02_s (SOUTHMOD A4.0, country
  ET, system ET_2025 = EFY2025/26, dataset et_2022_a2). Three Category A cases
  sit in the agreement zone, where the scheduled tax exceeds 2.5% of turnover
  and the minimum tax is dormant in both engines; they run live exact. Two
  further cases carry the two ETMOD findings recorded in
  axiom_oracles/data/etmod_issues.json and are dispositioned as upstream
  engine gaps in dispositions/et-business-mat.yaml: ETMOD adds the full 2.5%
  of turnover to the scheduled tax where Article 23(3) reduces the minimum by
  the tax paid (81,000 vs the statutory 75,000 at 3,000,000 receipts / 60,000
  income), and it levies the minimum tax on Category B taxpayers whom Article
  23(4) excludes (1,250 vs 0 at 50,000 receipts / 20,000 income). The Category
  B case keeps income in the 0-24,000 nil band because the encoded module has
  no Category B gate on the Article 19(2) schedule, an Axiom encoding gap
  reported for an encoder repair round and not compared here. Results are
  based on the tax-benefit microsimulation model for Ethiopia (ETMOD) in
  SOUTHMOD_A4.0, developed, maintained and managed by UNU-WIDER with SASPRI,
  the LSE International Inequalities Institute and local partners, run on the
  EUROMOD software (EM_Executable 1.0.0 via the euromod connector 0.2.18)
  under the et_2022_a2 dataset configuration (Central Statistical Agency of
  Ethiopia, Ethiopia Socioeconomic Panel Survey Wave 5, 2021-2022); only the
  dataset's variable list is read and every household is synthetic. The
  results and their interpretation are Axiom's responsibility. The SOUTHMOD
  bundle is licensed and non-redistributable: it is referenced only by path
  (euromod_model_root), and no model XML, dataset row, or DRD text is
  committed.

# Not runnable on the CI matrix runners. The SOUTHMOD bundle is licensed to
# Axiom by UNU-WIDER under the SOUTHMOD_A4.0 Adhesion Agreement, which bars
# providing the model or its input datasets to any third party (clause 4), so
# no shared runner can hold it; the runner also needs the x64 EUROMOD engine
# (EM_Executable.dll) under EUROMOD_PYTHON and a .NET runtime. Manual lane
# only: scripts/regenerate_euromod_et.sh, where the licensed bundle and
# runtime exist, refreshes the committed report. This marker stays unless
# UNU-WIDER licenses a runner-held copy.
ci: manual

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: et-business-mat
    population: synthetic
    sample_size: 0
    period: 2026
    euromod_model_root: $HOME/.axiom/oracles/southmod/bundle/SOUTHMOD_A4.0
    euromod_country: ET
    euromod_system: ET_2025
    euromod_dataset: et_2022_a2
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-et-business-mat.json

artifacts:
  report_basename: axiom-euromod-et-business-mat

dashboard:
  filename: axiom-euromod-et-business-mat.json
  suite: et-business-mat
