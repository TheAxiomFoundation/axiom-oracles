# North Carolina composed income-tax liability — Axiom pipeline vs PolicyEngine
# and TAXSIM on a modest case grid (single and married filers at incomes that
# cross the state's brackets). The Axiom side is the composed rulespec-us
# pipeline us-nc/policies/income_tax/pilot_liability_pipeline, evaluated
# through the axiom rules engine (its liabilities are the engine-verified
# companion-test fixtures). North Carolina levies a single flat 3.99% rate
# (G.S. 105-153.7, 2026 scheduled step-down) on North Carolina taxable income
# (North Carolina AGI less the section 105-153.5(a) standard deduction,
# $12,750 single / $25,500 joint).
#
# PolicyEngine runs at the 2026 validation year. TAXSIM runs at its latest
# supported law year (2024) because the pinned binary abandons 2026; the
# 2024-to-2026 rate step-down (4.5% to 3.99% on an unchanged deduction) is
# recorded in dispositions/nc-income-tax-liability.yaml rather than absorbed
# by tolerance.
#
# Run locally:
#   uv run python scripts/run_comparison.py nc-income-tax-liability

name: nc-income-tax-liability
title: North Carolina income tax liability — Axiom vs PolicyEngine and TAXSIM
description: >-
  Compares the composed North Carolina income-tax liability pipeline encoded
  in Axiom RuleSpec (us-nc/policies/income_tax/pilot_liability_pipeline)
  against PolicyEngine (nc_income_tax_before_credits) at 2026 and TAXSIM
  (siitax) at 2024 on a modest grid of single and married filers.

runner:
  type: state-income-tax-liability-grid
  parameters:
    state: NC
    period: "2026"
    taxsim_law_year: 2024
    # Links this suite to the rulespec-us monorepo in the affected map
    # so a change to the composed pipeline triggers a re-run.
    rulespec_roots:
      - $HOME/TheAxiomFoundation/rulespec-us

artifacts:
  report_basename: axiom-policyengine-taxsim-nc-income-tax-liability

dashboard:
  filename: axiom-policyengine-taxsim-nc-income-tax-liability.json
  suite: nc-income-tax-liability
