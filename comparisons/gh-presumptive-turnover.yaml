name: gh-presumptive-turnover
title: Ghana presumptive turnover tax and COVID-19 levy — Axiom vs GHAMOD
description: >-
  Compares the rulespec-gh Second Schedule paragraph 5 turnover tax as
  substituted by Act 1071 (paragraph_5_turnover_tax_payable, 3% of turnover in
  the (20,000, 500,000] band) against GHAMOD ttn01_s, and the COVID-19 Health
  Recovery Levy, Act 1068 s.1(4) (covid_health_recovery_levy_amount, 1%)
  against GHAMOD ttn02_s, bridged on GHAMOD's post-uprating ytn. The levy's
  statutory base is the taxable supply value; both engines are given the
  presumptive turnover as that base (the convention GHAMOD uses, adopted for
  parity). Live cases (30,000, 60,000 and 119,999 a year; 6 comparisons, all
  exact in the live run) stay in the turnover range both engines tax. The top
  case sits one cedi below GHAMOD's all-or-nothing 120,000 ceiling, because an
  input that uprates to 120,000 only to within floating-point noise can fall
  on either side of it. The suite runs at period 2025, GHAMOD's policy year
  and the levy's last live year, because Act 1150 repeals the levy from 2026
  (the module prices nil from 2025-12-10); the runner applies one period to
  every case, and the Act 1071 paragraph 5 band and rate are a single version
  from 2021-12-30, so the turnover-tax cases price identically at 2025.
  GHAMOD's 10,000-120,000 eligibility band matches no in-force text and is
  recorded in ghamod_issues.json
  (ghamod-ttn-eligibility-band-10k-120k-superseded). Results are based on the
  tax-benefit microsimulation model for Ghana (GHAMOD) in SOUTHMOD_A4.0,
  developed, maintained and managed by UNU-WIDER with SASPRI, the LSE
  International Inequalities Institute and local partners, run on the EUROMOD
  software (EM_Executable 1.0.0 via the euromod connector 0.2.18) under the
  gh_2017_a8 dataset configuration (Ghana Statistical Service, Ghana Living
  Standards Survey Round 7, 2016-2017); only the dataset's variable list is
  read and every household is synthetic. The results and their interpretation
  are Axiom's responsibility. The SOUTHMOD bundle is licensed and
  non-redistributable: it is referenced only by path (euromod_model_root), and
  no model XML, dataset row, or DRD text is committed.

# Not runnable on the CI matrix runners. The SOUTHMOD bundle is licensed to
# Axiom by UNU-WIDER under the SOUTHMOD_A4.0 Adhesion Agreement, which bars
# providing the model or its input datasets to any third party (clause 4), so
# no shared runner can hold it; the runner also needs the x64 EUROMOD engine
# (EM_Executable.dll) under EUROMOD_PYTHON and a .NET runtime. Manual lane
# only: scripts/regenerate_euromod_gh.sh, where the licensed bundle and
# runtime exist, refreshes the committed report. This marker stays unless
# UNU-WIDER licenses a runner-held copy.
ci: manual

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: gh-presumptive-turnover
    population: synthetic
    sample_size: 0
    # Ghana year of assessment 2025: GHAMOD's policy year (GH_2025) and the
    # COVID-19 Health Recovery Levy's last live year (Act 1150 repeals it from
    # 2026, and the module prices nil from 2025-12-10). The CLI overwrites
    # every synthetic case's period with this value, so it, not the per-case
    # period, decides which levy version the Axiom side reads. The Act 1071
    # paragraph 5 turnover tax is a single version from 2021-12-30, so 2025
    # and 2026 price identically.
    period: 2025
    euromod_model_root: $HOME/.axiom/oracles/southmod/bundle/SOUTHMOD_A4.0
    euromod_country: GH
    euromod_system: GH_2025
    euromod_dataset: gh_2017_a8
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-gh-presumptive-turnover.json

artifacts:
  report_basename: axiom-euromod-gh-presumptive-turnover

dashboard:
  filename: axiom-euromod-gh-presumptive-turnover.json
  suite: gh-presumptive-turnover
