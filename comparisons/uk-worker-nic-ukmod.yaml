name: uk-worker-nic-ukmod
title: UK worker employee NIC — Axiom vs UKMOD
description: >-
  Compares the composed single-employee UK Class 1 primary (employee) National
  Insurance pipeline encoded in Axiom RuleSpec (SSCBA 1992 section 8 8%/2%
  percentages wired from gross employment income with the 2026-27 annual
  primary threshold and upper earnings limit) against CeMPA's UKMOD tscee_s on
  a synthetic single-earner grid at 30k / 45k / 60k / 130k / 360k gross. UKMOD
  computes the contribution week by week on weekly-rounded thresholds, so a
  small (about £4-£6 per case) weekly-rounding residual against the annual
  statutory formula is expected and absorbed by the concept tolerance. UKMOD
  runs the registration-free public model (UKMOD_PUBLIC_B2026.03, system
  UK_2026, dataset training_data); comparisons bridge on the engine's own
  post-uprating gross (yem). This suite runs where the x64 UKMOD runtime and
  model checkout are available and is regenerated by
  scripts/regenerate_euromod_uk.sh; on runners without them it re-emits the
  committed dashboard report.

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: uk-worker-nic
    population: synthetic
    sample_size: 0
    # UK fiscal-year law takes effect 6 April; the engine keys parameter
    # versions off period.start, so the Axiom side evaluates on the 2026-27
    # tax-year boundary (6 Apr 2026 - 5 Apr 2027) rather than the value live on
    # 1 January. UKMOD resolves the policy year from euromod_system (UK_2026)
    # and ignores the case period.
    period: 2026-04-06
    euromod_model_root: $HOME/Downloads/UKMOD_PUBLIC_B2026.03
    euromod_country: UK
    euromod_system: UK_2026
    euromod_dataset: training_data
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-uk-worker-nic.json

artifacts:
  report_basename: axiom-euromod-uk-worker-nic

dashboard:
  filename: axiom-euromod-uk-worker-nic.json
  suite: uk-worker-nic
