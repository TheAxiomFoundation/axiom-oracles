name: nm-income-tax-liability
title: New Mexico income tax liability — Axiom vs PolicyEngine and TAXSIM
description: >-
  Compares the composed New Mexico resident wage-earner income-tax pipeline in
  Axiom RuleSpec against PolicyEngine (nm_income_tax_before_non_refundable_credits) at 2026 and TAXSIM
  (siitax) at 2026 on the standard six-case grid.

runner:
  type: state-income-tax-liability-grid
  parameters:
    state: NM
    period: "2026"
    taxsim_law_year: 2026
    rulespec_roots:
      - $HOME/TheAxiomFoundation/rulespec-us

artifacts:
  report_basename: axiom-policyengine-taxsim-nm-income-tax-liability

dashboard:
  filename: axiom-policyengine-taxsim-nm-income-tax-liability.json
  suite: nm-income-tax-liability
