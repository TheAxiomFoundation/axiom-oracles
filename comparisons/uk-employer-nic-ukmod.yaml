name: uk-employer-nic-ukmod
title: UK employer secondary NIC — Axiom vs UKMOD
description: >-
  Compares the composed single-employment UK employer (secondary) Class 1
  National Insurance pipeline encoded in Axiom RuleSpec (SSCBA 1992 section 9,
  15% secondary percentage on earnings above the supplied 5,000-a-year secondary
  threshold) against CeMPA's UKMOD tscer_s on a synthetic single-earner grid at
  30k / 45k / 60k / 130k / 360k gross. UKMOD computes the contribution week by
  week on the weekly-rounded secondary threshold, so a small (about £0.86 per
  case) weekly-rounding residual against the annual statutory formula is
  expected and absorbed by the concept tolerance. UKMOD runs the
  registration-free public model (UKMOD_PUBLIC_B2026.03, system UK_2026, dataset
  training_data); comparisons bridge on the engine's own post-uprating gross
  (yem). This suite runs where the x64 UKMOD runtime and model checkout are
  available and is regenerated by scripts/regenerate_euromod_uk.sh; on runners
  without them it re-emits the committed dashboard report.

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: uk-employer-nic
    population: synthetic
    sample_size: 0
    # Defensive batch isolation: the EUROMOD engine runs every case in one
    # run_cases invocation per comparison batch, so cases sharing a batch can
    # contaminate each other by position (a household can return a wrong value
    # at some batch positions but the correct value alone — the batch-position
    # adapter bug first isolated on be-study-allowance,
    # euromod-be-2025-bed-study-allowance-batch-position-contamination). This
    # instrument is deterministic — it carries no stochastic take-up draw, so
    # identical households return identical values regardless of batch size
    # (verified on representative suites: EUROMOD-left values are batch-
    # invariant, and N=10 identical households return one value). Batch size 1
    # is therefore neutral where uncontaminated and corrective where
    # contaminated. Remove once the adapter fix lands.
    comparison_batch_size: 1
    period: 2026
    euromod_model_root: $HOME/Downloads/UKMOD_PUBLIC_B2026.03
    euromod_country: UK
    euromod_system: UK_2026
    euromod_dataset: training_data
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-uk-employer-nic.json

artifacts:
  report_basename: axiom-euromod-uk-employer-nic

dashboard:
  filename: axiom-euromod-uk-employer-nic.json
  suite: uk-employer-nic
