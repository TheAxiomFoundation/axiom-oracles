# PolicyEngine and TAXSIM both run at the 2026 validation year
# (policyengine-taxsim 2.30.0 models 2026 law including OBBBA).

name: ga-income-tax-liability
title: Georgia income tax liability — Axiom vs PolicyEngine and TAXSIM
description: >-
  Compares the composed Georgia income-tax liability pipeline encoded in Axiom
  RuleSpec (us-ga/policies/income_tax/pilot_liability_pipeline) against
  PolicyEngine (ga_income_tax_before_non_refundable_credits) at 2026 and
  TAXSIM (siitax) at 2026 on a modest grid of single and married filers.

runner:
  type: state-income-tax-liability-grid
  parameters:
    state: GA
    period: "2026"
    taxsim_law_year: 2026
    # Links this suite to the rulespec-us monorepo in the affected map
    # so a change to the composed pipeline triggers a re-run.
    rulespec_roots:
      - $HOME/TheAxiomFoundation/rulespec-us

artifacts:
  report_basename: axiom-policyengine-taxsim-ga-income-tax-liability

dashboard:
  filename: axiom-policyengine-taxsim-ga-income-tax-liability.json
  suite: ga-income-tax-liability
