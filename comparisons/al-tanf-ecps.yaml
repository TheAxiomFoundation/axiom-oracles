# Alabama TANF -- Axiom vs PolicyEngine on Enhanced CPS, Alabama households.

name: al-tanf-ecps
title: Alabama TANF -- Axiom vs PolicyEngine
description: >-
  Compares the monthly Alabama Family Assistance benefit from the composed
  us-al/tanf program (2024 State Plan Attachment E payment-standard chart and
  Appendix N Section 2 20%-earned-income / nearest-dollar / $10-minimum-grant
  computation) against PolicyEngine's al_tanf on Enhanced CPS households in
  Alabama. Refresh the rulespec root after pulling ~/rulespec-us with:
  rsync -a --delete --exclude .axiom ~/rulespec-us/us-al/ ~/.axiom-oracles/roots/rulespec-us-al/

# Not CI-runnable while engine-main x rulespec-us-main is broken: composed-root
# staging fails the engine's canonical-path scan (non-canonical filenames in
# us-la/us-nh/us-nj/us -- rulespec-us#1049) before any comparison runs;
# rulespec-us#1050 (removed plural corpus_citation_paths) and -- for the
# composed program lanes -- axiom-compose#29 and axiom-oracles#335 queue
# behind it. Manual lane only; drop this marker when the upstream chain lands
# (axiom-oracles#455 tracks the flip-back).
ci: manual

runner:
  type: axiom-oracles-compare
  axiom_rules_repo: $HOME/axiom-rules-engine
  parameters:
    # In-bridge filtering overstates loaded-case counts; keep full evidence.
    include_case_inputs: true
    left: axiom
    right: policyengine
    suite: al-tanf-ecps
    concepts:
      - us-al:policies/dhr/tanf#al_tanf_benefit
    sample_size: 0
    period: 2026-01
    population: enhanced-cps
    python: "3.13"
    policyengine_version: "4.18.9"
    policyengine_us_version: "1.767.3"
    policyengine_core_version: "3.30.3"
    jurisdiction_fips: "01"
    axiom_compose_binary: $HOME/axiom-compose/.venv/bin/axiom-compose
    axiom_program: $HOME/axiom-oracles/programs/us-al/tanf/fy-2026.yaml
    axiom_composed_program: /tmp/al-tanf-composed.yaml
    axiom_compiled_program: /tmp/al-tanf-compiled.json
    axiom_rulespec_repo_roots: $HOME/.axiom-oracles/roots
    rulespec_roots:
      - $HOME/.axiom-oracles/roots/rulespec-us-al

artifacts:
  report_basename: axiom-policyengine-al-tanf-ecps

dashboard:
  filename: axiom-policyengine-al-tanf-ecps.json
  suite: al-tanf-ecps
