# Colorado TANF -- Axiom vs PolicyEngine on Enhanced CPS, NY households.

name: co-tanf-ecps
title: Colorado TANF -- Axiom vs PolicyEngine
description: >-
  Compares the monthly NY TANF (Family Assistance) grant from the composed
  us-co/tanf program (state plan 2024-2026 standard of need, home energy
  allowances, with-children shelter allowance, and earned income
  disregards) against PolicyEngine's ny_tanf on Enhanced CPS households in
  Colorado. Known parameter divergences the suite is expected to surface:
  the encoded state plan's 62% earned income disregard vs PolicyEngine's
  50%, and different local-agency shelter maximum schedules. Refresh the
  rulespec root after pulling ~/rulespec-us with:
  rsync -a --delete --exclude .axiom ~/rulespec-us/us-ny/ ~/.axiom-oracles/roots/rulespec-us-co/

runner:
  type: axiom-oracles-compare
  axiom_rules_repo: $HOME/axiom-rules-engine
  parameters:
    left: axiom
    right: policyengine
    suite: co-tanf-ecps
    concepts:
      - us-co:policies/cdhs/colorado-works#co_tanf_benefit
    sample_size: 0
    period: 2026-01
    population: enhanced-cps
    jurisdiction_fips: "08"
    axiom_compose_binary: $HOME/axiom-compose/.venv/bin/axiom-compose
    axiom_program: $HOME/axiom-oracles/programs/us-co/tanf/fy-2026.yaml
    axiom_composed_program: /tmp/co-tanf-composed.yaml
    axiom_compiled_program: /tmp/co-tanf-compiled.json
    axiom_rulespec_repo_roots: $HOME/.axiom-oracles/roots
    rulespec_roots:
      - $HOME/.axiom-oracles/roots/rulespec-us-co

artifacts:
  report_basename: axiom-policyengine-co-tanf-ecps

dashboard:
  filename: axiom-policyengine-co-tanf-ecps.json
  suite: co-tanf-ecps
