# Colorado TANF -- Axiom vs PolicyEngine on Enhanced CPS, NY households.

name: co-tanf-ecps
title: Colorado TANF -- Axiom vs PolicyEngine
description: >-
  Compares the monthly Colorado Works basic cash assistance grant from the
  composed us-co/tanf program (9 CCR 2503-6 grant standard chart, need
  standard, and earned income disregards) against PolicyEngine's co_tanf
  on Enhanced CPS households in Colorado, using the canonical rulespec-us
  checkout directly.

runner:
  type: axiom-oracles-compare
  axiom_binary: $HOME/TheAxiomFoundation/axiom-rules-engine/target/release/axiom-rules-engine
  parameters:
    left: axiom
    right: policyengine
    suite: co-tanf-ecps
    concepts:
      - us-co:policies/cdhs/colorado-works#co_tanf_benefit
    sample_size: 0
    period: 2026-01
    population: enhanced-cps
    jurisdiction_fips: "08"
    axiom_compose_binary: $HOME/TheAxiomFoundation/axiom-compose/.venv/bin/axiom-compose
    axiom_program: $HOME/TheAxiomFoundation/rulespec-us/us-co/programs/tanf/fy-2026.yaml
    axiom_composed_program: /tmp/axiom-composed/co-tanf-ecps.yaml
    axiom_compiled_program: /tmp/co-tanf-compiled.json
    rulespec_root: $HOME/TheAxiomFoundation/rulespec-us

artifacts:
  report_basename: axiom-policyengine-co-tanf-ecps

dashboard:
  filename: axiom-policyengine-co-tanf-ecps.json
  suite: co-tanf-ecps
