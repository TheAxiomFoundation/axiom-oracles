name: co-snap-ecps
title: Colorado SNAP — Axiom vs PolicyEngine
description: Compares the Colorado SNAP benefit amount produced by Axiom RuleSpec
  (rulespec-us/us-co/policies/cdhs/snap/fy-2026-benefit-calculation) against PolicyEngine
  on the certified Populace US artifact, filtered to Colorado households.
runner:
  type: axiom-encode-snap-populace-compare
  axiom_encode_repo: $HOME/axiom-encode
  axiom_binary: $HOME/TheAxiomFoundation/axiom-rules-engine/target/release/axiom-rules-engine
  rulespec_root: $HOME/TheAxiomFoundation/rulespec-us
  parameters:
    jurisdiction: us-co
    sample_size: 0
    year: 2026
    month: 1
    utility_projection: policyengine-type
    tolerance: 1.5
artifacts:
  report_basename: axiom-policyengine-co-snap-ecps
dashboard:
  filename: axiom-policyengine-co-snap-ecps.json
  suite: co-snap-ecps
