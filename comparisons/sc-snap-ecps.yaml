# South Carolina SNAP -- Axiom vs PolicyEngine on Enhanced CPS.

name: sc-snap-ecps
title: South Carolina SNAP -- Axiom vs PolicyEngine
description: Compares South Carolina SNAP eligibility and benefit amount from
  the composed signed-manifest RuleSpec surface against PolicyEngine on the
  Enhanced CPS, filtered to South Carolina households.

runner:
  type: axiom-oracles-compare
  axiom_binary: $HOME/TheAxiomFoundation/axiom-rules-engine/target/release/axiom-rules-engine
  parameters:
    left: axiom
    right: policyengine
    concepts:
      - us:statutes/7/2014/o#snap_eligible
      - us:statutes/7/2014/u#snap_benefit
    sample_size: 0
    period: 2026-01
    population: enhanced-cps
    axiom_compose_binary: $HOME/TheAxiomFoundation/axiom-compose/.venv/bin/axiom-compose
    axiom_program: $HOME/TheAxiomFoundation/rulespec-us/us-sc/programs/snap/fy-2026.yaml
    axiom_composed_program: /tmp/axiom-composed/sc-snap-ecps.yaml
    axiom_compiled_program: /tmp/sc-snap-compiled.json
    rulespec_root: $HOME/TheAxiomFoundation/rulespec-us
    jurisdiction_fips: "45"

artifacts:
  report_basename: axiom-policyengine-sc-snap-ecps

dashboard:
  filename: axiom-policyengine-sc-snap-ecps.json
  suite: sc-snap-ecps
