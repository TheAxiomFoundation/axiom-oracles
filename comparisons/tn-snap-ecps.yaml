# Tennessee SNAP -- Axiom vs PolicyEngine on Enhanced CPS.

name: tn-snap-ecps
title: Tennessee SNAP -- Axiom vs PolicyEngine
description: Compares Tennessee SNAP eligibility and benefit amount from the
  composed rulespec-us/us-tn/programs/snap/fy-2026 spec against PolicyEngine on the
  Enhanced CPS, filtered to Tennessee households.

runner:
  type: axiom-oracles-compare
  axiom_binary: $HOME/TheAxiomFoundation/axiom-rules-engine/target/release/axiom-rules-engine
  parameters:
    left: axiom
    right: policyengine
    concepts:
      - us:statutes/7/2014/o#snap_eligible
      - us:statutes/7/2014/u#snap_benefit
    sample_size: 0
    period: 2026-01
    population: enhanced-cps
    axiom_compose_binary: $HOME/TheAxiomFoundation/axiom-compose/.venv/bin/axiom-compose
    axiom_program: $HOME/TheAxiomFoundation/rulespec-us/us-tn/programs/snap/fy-2026.yaml
    axiom_composed_program: /tmp/axiom-composed/tn-snap-ecps.yaml
    axiom_compiled_program: /tmp/tn-snap-compiled.json
    rulespec_root: $HOME/TheAxiomFoundation/rulespec-us
    jurisdiction_fips: "47"

artifacts:
  report_basename: axiom-policyengine-tn-snap-ecps

dashboard:
  filename: axiom-policyengine-tn-snap-ecps.json
  suite: tn-snap-ecps
