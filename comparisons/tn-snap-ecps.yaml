# Tennessee SNAP -- Axiom vs PolicyEngine on Enhanced CPS.

name: tn-snap-ecps
title: Tennessee SNAP -- Axiom vs PolicyEngine
description: Compares Tennessee SNAP eligibility and benefit amount from the
  composed axiom-programs/us-tn/snap/fy-2026 spec against PolicyEngine on the
  Enhanced CPS, filtered to Tennessee households.

runner:
  type: axiom-oracles-compare
  axiom_rules_repo: $HOME/axiom-rules-engine
  parameters:
    left: axiom
    right: policyengine
    concepts:
      - us:statutes/7/2014/o#snap_eligible
      - us:statutes/7/2014/u#snap_benefit
    sample_size: 0
    period: 2026-01
    population: enhanced-cps
    axiom_compose_binary: $HOME/axiom-compose/.venv/bin/axiom-compose
    axiom_program: $HOME/rulespec-us/programs/us-tn/snap/fy-2026.yaml
    axiom_composed_program: /tmp/tn-snap-composed.yaml
    axiom_compiled_program: /tmp/tn-snap-compiled.json
    axiom_rulespec_repo_roots: $HOME
    rulespec_roots:
      - $HOME/rulespec-us
    jurisdiction_fips: "47"

artifacts:
  report_basename: axiom-policyengine-tn-snap-ecps

dashboard:
  filename: axiom-policyengine-tn-snap-ecps.json
  suite: tn-snap-ecps
