name: rw-excise
title: Rwanda rw-excise — Axiom vs RWAMOD
description: >-
  Compares the rulespec-rw Law 011/2025 Annex rows against the RWAMOD tex*
  arms: premium fuel FRW 183/litre (tex12_s) and gas oil FRW 150/litre
  (tex13_s) on unuprated litre quantities, and the cigarette compound duty
  (36% of retail value plus FRW 230 per pack, tex01_s). The output frame
  echoes no cigarette spend, so each cigarette row also carries the same raw
  spend on a second tobacco item that no excise arm charges and whose spend
  shows up in il_exp_vat01 (x02309, observed) and the Axiom retail value is
  bridged from the echoed VAT base il_exp_vat01 (probed: the two items share
  one uprating index and the extra item leaves tex01_s unchanged); pack counts
  feed directly. Neither input comes from tex01_s, so the 36% rate and the
  per-pack amount are both under test; the July bridge inverted tex01_s and
  could not fail. Convention adopted for parity: the post-uprating spend is
  fed as the tax-inclusive retail price the Annex names, as RWAMOD's excise
  reads it, while RWAMOD's VAT reads the same spend as pre-tax
  (rwamod_issues.json,
  rwamod-expenditure-read-tax-inclusive-for-excise-pre-tax-for-vat); the suite
  tests the rate and per-pack amount, not the base definition. Dispositions
  (rulespec-rw#1 findings, probed 2026-10-04, no comparison case;
  rwamod_issues.json): (1) the model taxes bottled-water expenditure at 10%
  (tex11_s) where the Law 011/2025 Annex carries NO water row - the row
  existed only in the repealed Law 050/2023, in force through 28 May 2025, so
  the model applies a repealed row alongside the 2025 rates for the same year;
  (2) the model prices its whole juice basket at the 10% local-content rate
  where the Annex prices only at-least-30%-local juices at 10% and other
  juices at 39%; (3) the model prices its local-beer basket at 40% where the
  Annex prices other-fermented beverages at 65% and other local-content
  alcoholic beverages at 30%. The Axiom side evaluates period 2026; RWAMOD
  runs RW_2025 (CY2025), and every schedule this suite compares is
  value-identical across 2025 and 2026. Results are based on the tax-benefit
  microsimulation model for Rwanda (RWAMOD) in SOUTHMOD_A4.0, developed,
  maintained and managed by UNU-WIDER with SASPRI, the LSE International
  Inequalities Institute and local partners, run on the EUROMOD software
  (EM_Executable 1.0.0 via the euromod connector 0.2.18) under the registered
  rw_2024_a1 dataset name; the bundle ships no Rwandan microdata, so a
  header-only input file is built locally from the model's own variable list
  and every household is synthetic. The results and their interpretation are
  Axiom's responsibility. The SOUTHMOD bundle is licensed and
  non-redistributable: it is referenced only by path (euromod_model_root), and
  no model XML, dataset row, or DRD text is committed.

# Not runnable on the CI matrix runners. The SOUTHMOD bundle is licensed to
# Axiom by UNU-WIDER under the SOUTHMOD_A4.0 Adhesion Agreement, which bars
# providing the model or its input datasets to any third party (clause 4), so
# no shared runner can hold it; the runner also needs the x64 EUROMOD engine
# (EM_Executable.dll) under EUROMOD_PYTHON and a .NET runtime. Manual lane
# only: scripts/regenerate_euromod_rw.sh, where the licensed bundle and
# runtime exist, refreshes the committed report. This marker stays unless
# UNU-WIDER licenses a runner-held copy.
ci: manual

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: rw-excise
    population: synthetic
    sample_size: 0
    period: 2026
    euromod_model_root: $HOME/.axiom/oracles/southmod/bundle/SOUTHMOD_A4.0
    euromod_country: RW
    euromod_system: RW_2025
    euromod_dataset: rw_2024_a1
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-rw-excise.json

artifacts:
  report_basename: axiom-euromod-rw-excise

dashboard:
  filename: axiom-euromod-rw-excise.json
  suite: rw-excise
