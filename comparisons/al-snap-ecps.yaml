# Alabama SNAP / Food Assistance -- Axiom vs PolicyEngine on Enhanced CPS.

name: al-snap-ecps
title: Alabama SNAP -- Axiom vs PolicyEngine
description: Compares Alabama SNAP eligibility and benefit amount from the
  composed axiom-programs/us-al/snap/fy-2026 spec against PolicyEngine on the
  Enhanced CPS, filtered to Alabama households.

runner:
  type: axiom-oracles-compare
  axiom_rules_repo: $HOME/axiom-rules-engine
  parameters:
    left: axiom
    right: policyengine
    concepts:
      - us:statutes/7/2014/o#snap_eligible
      - us:statutes/7/2014/u#snap_benefit
    sample_size: 0
    period: 2026-01
    population: enhanced-cps
    axiom_compose_binary: $HOME/axiom-compose/.venv/bin/axiom-compose
    axiom_program: $HOME/axiom-programs/us-al/snap/fy-2026.yaml
    axiom_composed_program: /tmp/al-snap-composed.yaml
    axiom_compiled_program: /tmp/al-snap-compiled.json
    axiom_rulespec_repo_roots: $HOME
    rulespec_roots:
      - $HOME/rulespec-us
      - $HOME/rulespec-us-al
    jurisdiction_fips: "01"

artifacts:
  report_basename: axiom-policyengine-al-snap-ecps

dashboard:
  filename: axiom-policyengine-al-snap-ecps.json
  suite: al-snap-ecps
