# Michigan composed income-tax liability — Axiom pipeline vs PolicyEngine and TAXSIM
# on a modest case grid (single and married filers at incomes that cross the
# state's brackets). The Axiom side is the composed rulespec-us pipeline
# us-mi/policies/income_tax/pilot_liability_pipeline, evaluated through the
# axiom rules engine (its liabilities are the engine-verified companion-test
# fixtures). Michigan levies a single flat 4.25% rate (MCL 206.51(1)) on
# Michigan taxable income (Michigan AGI less the section 206.30 personal
# exemptions, $5,950 per person in 2026).
#
# PolicyEngine and TAXSIM both run at the 2026 validation year
# (policyengine-taxsim 2.30.0 models 2026 law including OBBBA).
#
# Run locally:
#   uv run python scripts/run_comparison.py mi-income-tax-liability

name: mi-income-tax-liability
title: Michigan income tax liability — Axiom vs PolicyEngine and TAXSIM
description: >-
  Compares the composed Michigan income-tax liability pipeline encoded in
  Axiom RuleSpec (us-mi/policies/income_tax/pilot_liability_pipeline) against
  PolicyEngine (mi_income_tax_before_non_refundable_credits) at 2026 and
  TAXSIM (siitax) at 2026 on a modest grid of single and married filers.

runner:
  type: state-income-tax-liability-grid
  parameters:
    state: MI
    period: "2026"
    taxsim_law_year: 2026
    # Links this suite to the rulespec-us monorepo in the affected map
    # so a change to the composed pipeline triggers a re-run.
    rulespec_roots:
      - $HOME/TheAxiomFoundation/rulespec-us

artifacts:
  report_basename: axiom-policyengine-taxsim-mi-income-tax-liability

dashboard:
  filename: axiom-policyengine-taxsim-mi-income-tax-liability.json
  suite: mi-income-tax-liability
