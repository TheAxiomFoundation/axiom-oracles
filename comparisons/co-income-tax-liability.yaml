# Colorado composed income-tax liability — Axiom pipeline vs PolicyEngine and TAXSIM
# on the standard modest case grid (single and married filers). The Axiom side is
# the composed rulespec-us pipeline us-co/policies/income_tax/pilot_liability_pipeline,
# evaluated through the axiom rules engine (its liabilities are the engine-verified
# companion-test fixtures). Colorado applies the section 39-22-104(1.7)(c) flat
# four and forty one-hundredths per cent to Colorado taxable income, with the rate
# imported hash-pinned from the encoded statute module.
#
# PolicyEngine runs at the 2026 validation year and matches the pipeline to
# the cent on all six cases. TAXSIM runs at its latest supported law year
# (2024) and its siitax nets the modeled 2024 TABOR sales-tax refund, so each
# TAXSIM residual decomposes into the 2024 rate/deduction vintage plus that
# netted refund — pinned per case in dispositions/co-income-tax-liability.yaml
# rather than absorbed by tolerance.
#
# Run locally:
#   uv run python scripts/run_comparison.py co-income-tax-liability

name: co-income-tax-liability
title: Colorado income tax liability — Axiom vs PolicyEngine and TAXSIM
description: >-
  Compares the composed Colorado income-tax liability pipeline encoded in Axiom
  RuleSpec (us-co/policies/income_tax/pilot_liability_pipeline) against
  PolicyEngine (co_income_tax_before_non_refundable_credits) at 2026 and TAXSIM
  (siitax) at 2024 on the standard modest grid of single and married filers.

runner:
  type: state-income-tax-liability-grid
  parameters:
    state: CO
    period: "2026"
    taxsim_law_year: 2024
    # Links this suite to the rulespec-us monorepo in the affected map
    # so a change to the composed pipeline triggers a re-run.
    rulespec_roots:
      - $HOME/TheAxiomFoundation/rulespec-us

artifacts:
  report_basename: axiom-policyengine-taxsim-co-income-tax-liability

dashboard:
  filename: axiom-policyengine-taxsim-co-income-tax-liability.json
  suite: co-income-tax-liability
