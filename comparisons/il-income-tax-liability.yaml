# Illinois composed income-tax liability — Axiom pipeline vs PolicyEngine and TAXSIM
# on a modest case grid (single and married filers at incomes that cross the
# state's brackets). The Axiom side is the composed rulespec-us pipeline
# us-il/policies/income_tax/pilot_liability_pipeline, evaluated through the
# axiom rules engine (its liabilities are the engine-verified companion-test
# fixtures). Illinois is flat 4.95 per cent on base income after the standard exemption.
#
# PolicyEngine and TAXSIM both run at the 2026 validation year: the pinned
# policyengine-taxsim 2.30.0 binary models 2026 law (its missing 2026
# qualifying-child credit machinery is not exercised by this childless grid)
# and its 2026 Illinois computation matches the pipeline within tolerance on
# every grid case, so this suite carries no dispositions.
#
# Run locally:
#   uv run python scripts/run_comparison.py il-income-tax-liability

name: il-income-tax-liability
title: Illinois income tax liability — Axiom vs PolicyEngine and TAXSIM
description: >-
  Compares the composed Illinois income-tax liability pipeline encoded in Axiom
  RuleSpec (us-il/policies/income_tax/pilot_liability_pipeline) against
  PolicyEngine (il_income_tax_before_refundable_credits) at 2026 and TAXSIM (siitax) at 2026 on a modest grid of
  single and married filers crossing the state's brackets.

runner:
  type: state-income-tax-liability-grid
  parameters:
    state: IL
    period: "2026"
    taxsim_law_year: 2026
    # Links this suite to the rulespec-us monorepo in the affected map
    # so a change to the composed pipeline triggers a re-run.
    rulespec_roots:
      - $HOME/TheAxiomFoundation/rulespec-us

artifacts:
  report_basename: axiom-policyengine-taxsim-il-income-tax-liability

dashboard:
  filename: axiom-policyengine-taxsim-il-income-tax-liability.json
  suite: il-income-tax-liability
