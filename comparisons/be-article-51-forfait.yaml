name: be-article-51-forfait
title: Belgium Article 51 employee professional-expense forfait (tintace) — Axiom vs EUROMOD
description: >-
  Compares the CIR 1992 Article 51 employee professional-expense forfait encoded
  in Axiom RuleSpec against EUROMOD Belgium tintace_s on a single-worker earnings
  sweep that crosses the indexed forfait cap. EUROMOD BE_2025 computes
  tintace_s = min(0.30 * il_netYem, 5930) where il_netYem is employment income
  after ordinary employee social security; the encoded
  belgium_pit_pilot_worker_forfait_professional_expenses applies the identical
  Article 51 employee rate (30%) and indexed cap (5,930 EUR) to the pipeline's
  own post-employee-SSC remuneration, so both engines apply the same rate and cap
  to the same statutory base. The forfait is otherwise exercised only as a base
  reduction inside the composed tin_s worker-PIT/marital-quotient pipelines; this
  suite gives tintace_s its own comparison surface. The sweep straddles the cap
  (the 30% rate binds below a post-SSC base of ~19,767 EUR, the 5,930 EUR cap
  above it) at 12k / 22k / 27k / 35k / 60k of annual remuneration. Comparisons
  bridge on the engine's post-uprating gross (yem). EUROMOD runs the
  registration-free public model (EUROMOD_RELEASES_J2.0+, system BE_2025) under
  the real dataset-configuration name BE_2024_c1_2015_03_e2 (the dataset-name
  gating workaround; no licensed microdata is read) with input rows templated
  from the bundled BE_training_data schema. This suite runs where the x64 EUROMOD
  runtime and model checkout are available; on runners without them the registry
  re-emits the committed dashboard report.

# Not runnable on the CI matrix runners. The EUROMOD-platform runner needs
# EUROMOD's x64 engine (EM_Executable.dll), the euromod connector under
# EUROMOD_PYTHON, a .NET runtime and the model checkout; the 6-hourly affected
# rerun and the weekly matrix provide none of them, so there run_comparison.py
# can only re-emit the committed report. For this lane the affected rerun
# committed those re-emissions, first over the real runs and then over each
# other on every sweep. Manual lane only: a supervised run_comparison.py run
# where the EUROMOD J2.0+ model and runtime exist
# (docs/euromod-platform-playbook.md) refreshes the committed report. Drop
# this marker only once a workflow provisions the model and runtime.
ci: manual

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: be-article-51-forfait
    population: synthetic
    sample_size: 0
    period: 2025
    euromod_model_root: $HOME/Downloads/EUROMOD_J2.0/EUROMOD_RELEASES_J2.0+
    euromod_country: BE
    euromod_system: BE_2025
    euromod_dataset: BE_2024_c1_2015_03_e2
    euromod_template_dataset: BE_training_data
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-be-article-51-forfait.json

artifacts:
  report_basename: axiom-euromod-be-article-51-forfait

dashboard:
  filename: axiom-euromod-be-article-51-forfait.json
  suite: be-article-51-forfait
