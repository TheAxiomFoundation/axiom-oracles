name: ga-snap-qc
title: Georgia SNAP — Axiom vs USDA SNAP QC administrative data
description: >-
  Replays Georgia SNAP Quality Control public-use reviews (FY2024, 945
  in-scope active-case reviews) through the Axiom RuleSpec composition and
  compares the benefit against FSBEN and the same five stage intermediates as
  the co/ny/ca suites (gross income, standard deduction, excess-shelter
  deduction, and net income against the file's constructed values; the maximum
  allotment against the oracle's FY2024 table). Georgia's three statewide
  section 3617 standards ride the qualification-flag inputs. All 945 reviews
  reproduce exactly at zero stage tolerance on the first run. FY2024 law is
  evaluated through a compile-time overlay (fy-2026 cola module ids rewritten
  to fy-2024-cola plus the state's Table F.7 SUA amount patches) at the
  nominal period 2026-01 (TheAxiomFoundation/rulespec-us#759 retires the
  overlay). Runs where the engine binary, a rulespec-us checkout with the
  fy-2024-cola modules and the state's SNAP layer (rulespec-us#842), and the
  QC file all exist; a run elsewhere re-emits the committed dashboard report,
  which never replaces a real run's report.
documentation: docs/snap-qc-oracle-playbook.md

# Not runnable on the CI matrix runners. The replay needs the
# axiom-rules-engine binary, a rulespec-us checkout carrying the fy-2024-cola
# modules, and the QC public-use file. The 6-hourly affected rerun and the
# weekly matrix clone rulespec-us main (which has fy-2024-cola) but never
# build the engine or download the QC file, so there run_comparison.py can
# only re-emit the committed report. On 2026-09-23 the affected rerun
# committed such re-emissions over the five real reports #548 had landed (NY,
# MD, AZ, CA, GA). Manual lane only: a supervised run_comparison.py run
# refreshes the committed report. Drop this marker only once those two
# workflows build the engine and fetch the QC file themselves.
ci: manual

runner:
  type: snap-qc-compare
  parameters:
    jurisdiction: us-ga
    fiscal_year: 2024
    sample_size: 0
    stage_tolerance: 0
    dashboard_filename: axiom-snapqc-ga-snap.json

artifacts:
  report_basename: axiom-snapqc-ga-snap

dashboard:
  filename: axiom-snapqc-ga-snap.json
  suite: ga-snap-qc
