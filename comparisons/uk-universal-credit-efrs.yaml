name: uk-universal-credit-efrs
title: UK Universal Credit — Axiom vs PolicyEngine
description: >-
  Compares the projection-safe Universal Credit component, housing, deduction,
  capital, childcare, and final-award surfaces encoded in Axiom RuleSpec against
  PolicyEngine UK on the Enhanced FRS population. Known PolicyEngine UK 2026
  forecast-indexed rate divergences are retained as visible difference rows and
  labeled separately from true Axiom mismatches. The take-up-inclusive
  universal-credit-final wrapper was retired upstream (rulespec-uk 829ab1a) and
  its bridge surface removed. The projection-safe pre-take-up final award is
  already compared here via universal-credit-award.

runner:
  type: axiom-encode-uk-populace-compare
  axiom_encode_repo: $HOME/axiom-encode
  axiom_binary: $HOME/TheAxiomFoundation/axiom-rules-engine/target/release/axiom-rules-engine
  rulespec_root: $HOME/TheAxiomFoundation/rulespec-uk
  parameters:
    data_folder: $HOME/axiom-oracles/.axiom/policyengine-data
    sample_size: 0
    year: 2026
    python: "3.13"
    dataset: enhanced_frs_2023_24
    tolerance: 0.01
    relative_tolerance: 2e-7
    surfaces:
      - universal-credit-standard-allowance
      - universal-credit-child-element
      - universal-credit-lcwra-element
      - universal-credit-carer-element
      - universal-credit-childcare-cap
      - universal-credit-housing-costs
      - universal-credit-work-allowance
      - universal-credit-income-deduction
      - universal-credit-assessable-capital
      - universal-credit-tariff-income
      - universal-credit-childcare-work-condition
      - universal-credit-childcare-element
      - universal-credit-award

artifacts:
  report_basename: axiom-policyengine-uk-universal-credit-efrs

dashboard:
  filename: axiom-policyengine-uk-universal-credit-efrs.json
  suite: uk-universal-credit-efrs
  known_policyengine_divergence_detail_limit: 25
