name: ri-income-tax-liability
title: Rhode Island income tax liability — Axiom vs PolicyEngine and TAXSIM
description: >-
  Compares the composed Rhode Island resident wage-earner income-tax pipeline in
  Axiom RuleSpec against PolicyEngine (ri_income_tax_before_non_refundable_credits) at 2026 and TAXSIM
  (siitax) at 2026 on the standard six-case grid.

# Not CI-runnable while engine-main x rulespec-us-main is broken: the engine's
# canonical-path root scan rejects the whole tree (non-canonical filenames in
# us-la/us-nh/us-nj/us -- rulespec-us#1049), and the state pipelines carry the
# removed plural `corpus_citation_paths` schema (rulespec-us#1050; 176 files
# across every jurisdiction as of 2026-08-05). Every dispatched leg fails
# before producing a report. Manual lane only; drop this marker when both land
# upstream (axiom-oracles#455 tracks the flip-back).
ci: manual

runner:
  type: state-income-tax-liability-grid
  parameters:
    state: RI
    period: "2026"
    taxsim_law_year: 2026
    policyengine_version: "4.18.9"
    policyengine_us_version: "1.784.4"
    policyengine_core_version: "3.30.3"
    rulespec_roots:
      - $HOME/TheAxiomFoundation/rulespec-us

artifacts:
  report_basename: axiom-policyengine-taxsim-ri-income-tax-liability

dashboard:
  filename: axiom-policyengine-taxsim-ri-income-tax-liability.json
  suite: ri-income-tax-liability
