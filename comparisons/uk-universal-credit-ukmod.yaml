name: uk-universal-credit-ukmod
title: UK Universal Credit — Axiom vs UKMOD
description: >-
  Compares the composed household Universal Credit award pipeline encoded in
  Axiom RuleSpec (rulespec-uk universal_credit_composed_award_pipeline: Welfare
  Reform Act 2012 section 8 with the UC Regulations 2013 standard-allowance,
  child, disability, carer, childcare, housing, work-allowance, taper, and
  capital/tariff elements, wired from hypothetical household facts) against
  CeMPA's UKMOD bsauc_s on a shared household grid: single/couple crossed with
  0-3 children, owner/renter, an earnings sweep across the taper, and capital
  cases straddling the £6,000 and £16,000 thresholds. Universal Credit is a
  benefit-unit means-tested award, so each case is an explicit multi-person
  UKMOD household (responsible adult carrying dhr, housing costs, and capital;
  partners linked through idpartner; children linked through idmother). UKMOD
  bsauc_s embeds a benefit take-up correction that can zero the reported award
  for a hypothetical benefit unit away from the entitlement (documented in
  axiom_oracles/data/euromod_issues.json as ukmod-uc-bsauc-takeup-correction);
  the composition and capital families land in take-up groups that take up and
  return clean statutory entitlements, while the earnings-sweep points carrying
  the take-up signature are classified as UKMOD-side artefacts rather than
  Axiom encoding mismatches. The 2026-27 two-child-limit revocation (Universal
  Credit (Removal of Two Child Limit) Act 2026 c.13 s.1(3)(a)) is applied by
  both engines — UKMOD B2026.03 and the Axiom pipeline both give every child a
  full element (verified: first child £351.88/month, subsequent £303.94/month).
  UKMOD runs the registration-free public model (UKMOD_PUBLIC_B2026.03, system
  UK_2026, dataset training_data). This suite runs where the x64 UKMOD runtime
  and model checkout are available and is regenerated by
  scripts/regenerate_euromod_uk.sh; on runners without them it re-emits the
  committed dashboard report.

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: uk-universal-credit
    population: synthetic
    sample_size: 0
    # NB on take-up: UKMOD's Universal Credit output bsauc_s carries a
    # STOCHASTIC per-row take-up draw (i_rand_tu) — identical households in
    # one engine run used to receive different awards purely by batch position
    # (ten identical couple-owner households returned
    # [666.97,666.97,0,666.97,666.97,0,0,666.97,666.97,666.97]). The adapter
    # now runs every household as its own engine run, so each case
    # reproducibly gets its solo draw: WHICH cases zero is stable, but a
    # non-taking solo draw still zeroes the award (not the statutory
    # entitlement; euromod_issues.json#ukmod-uc-bsauc-takeup-correction). The
    # committed report predates per-household isolation and records the old
    # single-batch realization; the next regeneration re-records under solo
    # draws. To compare statutory entitlements instead, set
    # euromod_constant_overrides to pin the $ISTU* take-up rates to 1.0 — a
    # deliberate regeneration for the suite owner.
    # The composed UC pipeline parameters are effective from 2026-04-01 for
    # assessment periods commencing on/after 6 April 2026, so the Axiom side
    # evaluates in the April 2026 monthly assessment period. UKMOD resolves the
    # policy year from euromod_system (UK_2026) and ignores the case period.
    period: 2026-04
    euromod_model_root: $HOME/Downloads/UKMOD_PUBLIC_B2026.03
    euromod_country: UK
    euromod_system: UK_2026
    euromod_dataset: training_data
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-uk-universal-credit.json

artifacts:
  report_basename: axiom-euromod-uk-universal-credit

dashboard:
  filename: axiom-euromod-uk-universal-credit.json
  suite: uk-universal-credit
