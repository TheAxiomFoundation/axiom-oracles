name: uk-statutory-paternity-pay-ukmod
title: UK Statutory Paternity Pay — Axiom vs UKMOD
description: >-
  Compares the composed UK Statutory Paternity Pay pipeline encoded in Axiom
  RuleSpec (Social Security Contributions and Benefits Act 1992 Part 12ZA: the
  s.171ZE earnings-related rate across the 2-week statutory paternity pay period,
  above the s.171ZA lower earnings limit) against CeMPA's UKMOD Statutory
  Paternity Pay (bpact_s) on a synthetic lone-father earnings sweep (annual gross
  6k / 8k / 12k / 25k / 40k). UKMOD bpact_uk pays the earnings-related rate over
  the period for a hypothetical paternity case, so the amount is 0.9 x weekly x 2
  on both sides, where the weekly figure is UKMOD's yem/30.5*7 proxy; the input
  bridge feeds the pilot the same weekly earnings UKMOD used (annualised yem /
  (12 x 30.5 / 7)). Below the £130 lower earnings limit (annual gross 6k) both
  sides return zero. Statutory Paternity Pay does not consume UKMOD's stochastic
  take-up draw. UKMOD runs the registration-free public model
  (UKMOD_PUBLIC_B2026.03, system UK_2026, dataset training_data). This suite runs
  where the x64 UKMOD runtime and model checkout are available; on runners without
  them it re-emits the committed dashboard report.

runner:
  type: euromod-synthetic-compare
  axiom_binary: $HOME/TheAxiomFoundation/axiom-rules-engine/target/release/axiom-rules-engine
  parameters:
    suite: uk-statutory-paternity-pay
    population: synthetic
    sample_size: 0
    period: 2026-04-06
    euromod_model_root: $HOME/Downloads/UKMOD_PUBLIC_B2026.03
    euromod_country: UK
    euromod_system: UK_2026
    euromod_dataset: training_data
    rulespec_root: $HOME/TheAxiomFoundation/rulespec-uk
    dashboard_filename: axiom-euromod-uk-statutory-paternity-pay.json

artifacts:
  report_basename: axiom-euromod-uk-statutory-paternity-pay

dashboard:
  filename: axiom-euromod-uk-statutory-paternity-pay.json
  suite: uk-statutory-paternity-pay
