name: be-marital-quotient
title: Belgium single-earner-couple marital-quotient PIT (tintb) — Axiom vs EUROMOD
description: >-
  Compares the CIR 1992 Article 87 marital quotient (huwelijksquotiënt / quotient
  conjugal) encoded in Axiom RuleSpec against EUROMOD Belgium tin_s on a synthetic
  single-earner married-couple grid at 30k, 45k, and 60k gross. When only one
  spouse has professional income, Article 87 imputes 30% of it (capped at the
  indexed 13,460 EUR) to the zero-income spouse, and each spouse is taxed
  separately through the Article 130 scale with their own Article 131/134 tax-free
  amount and the Article 5/2 autonomy factor; the composed couple_pit_oracle_pipeline
  sums both spouses' tax to a household total. The runner sums both members' tin_s
  to the case level. It supplies spouse A (`head`) and spouse B (`spouse`) as
  related Person records: the `yem` and `yemeq_s` bridges target spouse A's gross
  and work-bonus reference inputs, while spouse B receives zero worker amounts.
  This is the input shape required by the repaired rulespec-be#118 couple pipeline,
  which front-chains the worker reductions before Article 87. The committed
  dashboard report and three explained-residual dispositions carry the current
  committed 0/3 observations until #118 lands and a canonical report refresh
  replaces them. EUROMOD runs the registration-free public model
  (EUROMOD_RELEASES_J2.0+, system BE_2025) under the real dataset-configuration
  name BE_2024_c1_2015_03_e2 (the dataset-name gating workaround; no licensed
  microdata is read) with input rows templated from the bundled BE_training_data
  schema. This suite runs where the x64 EUROMOD runtime and model checkout are
  available; on runners without them the registry re-emits the committed
  dashboard report.

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: be-marital-quotient
    population: synthetic
    sample_size: 0
    period: 2025
    euromod_model_root: $HOME/Downloads/EUROMOD_J2.0/EUROMOD_RELEASES_J2.0+
    euromod_country: BE
    euromod_system: BE_2025
    euromod_dataset: BE_2024_c1_2015_03_e2
    euromod_template_dataset: BE_training_data
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-be-marital-quotient.json

artifacts:
  report_basename: axiom-euromod-be-marital-quotient

dashboard:
  filename: axiom-euromod-be-marital-quotient.json
  suite: be-marital-quotient
