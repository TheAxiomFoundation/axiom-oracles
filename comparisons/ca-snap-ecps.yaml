# California SNAP (CalFresh) eligibility and benefit amount — Axiom vs
# PolicyEngine on the certified Populace US artifact. This comparison uses the encode-backed SNAP
# ECPS harness so the dashboard is generated from the same jurisdiction program
# projection used for oracle parity work.

name: ca-snap-ecps
title: California SNAP — Axiom vs PolicyEngine
description: Compares California SNAP eligibility produced by the composed
  rulespec-us/us-ca/programs/snap/fy-2026 spec against PolicyEngine on the Enhanced
  CPS, filtered to California households.

runner:
  type: axiom-encode-snap-populace-compare
  axiom_encode_repo: $HOME/axiom-encode
  axiom_binary: $HOME/TheAxiomFoundation/axiom-rules-engine/target/release/axiom-rules-engine
  rulespec_root: $HOME/TheAxiomFoundation/rulespec-us
  parameters:
    jurisdiction: us-ca
    sample_size: 0
    year: 2026
    month: 1
    utility_projection: policyengine-type
    tolerance: 1.5

artifacts:
  report_basename: axiom-policyengine-ca-snap-ecps

dashboard:
  filename: axiom-policyengine-ca-snap-ecps.json
  suite: ca-snap-ecps
