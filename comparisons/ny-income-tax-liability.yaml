# New York composed income-tax liability — Axiom pipeline vs PolicyEngine and TAXSIM
# on a modest case grid (single and married filers at incomes that cross the
# state's brackets). The Axiom side is the composed rulespec-us pipeline
# us-ny/policies/income_tax/pilot_liability_pipeline, evaluated through the
# axiom rules engine (its liabilities are the engine-verified companion-test
# fixtures). New York is progressive (Tax Law s.601 brackets, 3.9-10.9 per cent) plus the s.601(d) supplemental recapture.
#
# PolicyEngine runs at the 2026 validation year. TAXSIM runs at its latest
# supported law year (2024) because the pinned binary abandons 2026; the
# 2024-to-2026 indexation vintage is recorded in
# dispositions/ny-income-tax-liability.yaml rather than absorbed by tolerance.
#
# Run locally:
#   uv run python scripts/run_comparison.py ny-income-tax-liability

name: ny-income-tax-liability
title: New York income tax liability — Axiom vs PolicyEngine and TAXSIM
description: >-
  Compares the composed New York income-tax liability pipeline encoded in Axiom
  RuleSpec (us-ny/policies/income_tax/pilot_liability_pipeline) against
  PolicyEngine (ny_income_tax) at 2026 and TAXSIM (siitax) at 2024 on a modest grid of
  single and married filers crossing the state's brackets.

runner:
  type: state-income-tax-liability-grid
  axiom_binary: $HOME/TheAxiomFoundation/axiom-rules-engine/target/release/axiom-rules-engine
  parameters:
    state: NY
    period: "2026"
    taxsim_law_year: 2024
    # Links this suite to the rulespec-us monorepo in the affected map
    # so a change to the composed pipeline triggers a re-run.
    rulespec_root: $HOME/TheAxiomFoundation/rulespec-us

artifacts:
  report_basename: axiom-policyengine-taxsim-ny-income-tax-liability

dashboard:
  filename: axiom-policyengine-taxsim-ny-income-tax-liability.json
  suite: ny-income-tax-liability
