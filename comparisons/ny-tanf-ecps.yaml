# New York TANF -- Axiom vs PolicyEngine on Enhanced CPS, NY households.

name: ny-tanf-ecps
title: New York TANF -- Axiom vs PolicyEngine
description: >-
  Compares the monthly NY TANF (Family Assistance) grant from the composed
  us-ny/tanf program (state plan 2024-2026 standard of need, home energy
  allowances, with-children shelter allowance, and earned income
  disregards) against PolicyEngine's ny_tanf on Enhanced CPS households in
  New York. Known parameter divergences the suite is expected to surface:
  the encoded state plan's 62% earned income disregard vs PolicyEngine's
  50%, and different local-agency shelter maximum schedules. Uses the
  canonical rulespec-us monorepo checkout.

# Not CI-runnable while engine-main x rulespec-us-main is broken: composed-root
# staging fails the engine's canonical-path scan (non-canonical filenames in
# us-la/us-nh/us-nj/us -- rulespec-us#1049) before any comparison runs;
# rulespec-us#1050 (removed plural corpus_citation_paths) and -- for the
# composed program lanes -- axiom-compose#29 and axiom-oracles#335 queue
# behind it. Manual lane only; drop this marker when the upstream chain lands
# (axiom-oracles#455 tracks the flip-back).
ci: manual

runner:
  type: axiom-oracles-compare
  axiom_rules_repo: $HOME/axiom-rules-engine
  parameters:
    # Loaded-case count overstates this suite (in-bridge filtering), so
    # the size heuristic under-persists; keep full per-case evidence.
    include_case_inputs: true
    left: axiom
    right: policyengine
    suite: ny-tanf-ecps
    concepts:
      - us-ny:policies/otda/tanf-state-plan-2024-2026#ny_tanf_benefit
    sample_size: 0
    period: 2026-01
    population: enhanced-cps
    python: "3.13"
    policyengine_version: "4.18.9"
    policyengine_us_version: "1.767.3"
    policyengine_core_version: "3.30.3"
    jurisdiction_fips: "36"
    axiom_compose_binary: $HOME/axiom-compose/.venv/bin/axiom-compose
    axiom_program: $HOME/axiom-oracles/programs/us-ny/tanf/fy-2026.yaml
    axiom_composed_program: /tmp/ny-tanf-composed.yaml
    axiom_compiled_program: /tmp/ny-tanf-compiled.json
    axiom_rulespec_repo_roots: $HOME/rulespec-us
    rulespec_roots:
      - $HOME/rulespec-us

artifacts:
  report_basename: axiom-policyengine-ny-tanf-ecps

dashboard:
  filename: axiom-policyengine-ny-tanf-ecps.json
  suite: ny-tanf-ecps
