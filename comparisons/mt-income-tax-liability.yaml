name: mt-income-tax-liability
title: Montana income tax liability — Axiom vs PolicyEngine and TAXSIM
description: >-
  Compares the composed Montana resident wage-earner income-tax pipeline in
  Axiom RuleSpec against PolicyEngine
  (mt_income_tax_before_non_refundable_credits_joint) at 2026 and TAXSIM
  (siitax) at 2026 on the standard six-case grid.

runner:
  type: state-income-tax-liability-grid
  parameters:
    state: MT
    period: "2026"
    taxsim_law_year: 2026
    rulespec_roots:
      - $HOME/TheAxiomFoundation/rulespec-us

artifacts:
  report_basename: axiom-policyengine-taxsim-mt-income-tax-liability

dashboard:
  filename: axiom-policyengine-taxsim-mt-income-tax-liability.json
  suite: mt-income-tax-liability
