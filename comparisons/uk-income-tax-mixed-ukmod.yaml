name: uk-income-tax-mixed-ukmod
title: UK mixed savings and dividend income tax — Axiom vs UKMOD
description: >-
  Compares the composed UK savings-and-dividend income-tax pipeline encoded in
  Axiom RuleSpec (savings via yiytx and dividends via ydvtx together on top of
  earned income per the Income Tax Act 2007 section 16 highest-part ordering)
  against CeMPA's UKMOD tin_s on a synthetic grid where a taxpayer holds both
  savings and dividend income straddling both the personal savings allowance
  and the dividend allowance. These cases surface a UKMOD platform bug: when a
  taxpayer has both savings and dividend income, UKMOD grants the savings a 0%
  band equal to the dividend income amount, zeroing savings tax that the Income
  Tax Act 2007 sections 11D/12/12A charge at the savings basic/higher/additional
  rate. The source-grounded RuleSpec taxes the savings correctly, so these cases
  are dispositioned as an upstream engine gap (see
  dispositions/uk-income-tax-mixed.yaml and
  axiom_oracles/data/euromod_issues.json). UKMOD runs the registration-free
  public model (UKMOD_PUBLIC_B2026.03, system UK_2026, dataset training_data).
  This suite runs where the x64 UKMOD runtime and model checkout are available
  and is regenerated by scripts/regenerate_euromod_uk.sh; on runners without
  them it re-emits the committed dashboard report.

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: uk-income-tax-mixed
    population: synthetic
    sample_size: 0
    period: 2026
    euromod_model_root: $HOME/Downloads/UKMOD_PUBLIC_B2026.03
    euromod_country: UK
    euromod_system: UK_2026
    euromod_dataset: training_data
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-uk-income-tax-mixed.json

artifacts:
  report_basename: axiom-euromod-uk-income-tax-mixed

dashboard:
  filename: axiom-euromod-uk-income-tax-mixed.json
  suite: uk-income-tax-mixed
