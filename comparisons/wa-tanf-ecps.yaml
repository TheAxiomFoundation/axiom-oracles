# Washington TANF -- Axiom vs PolicyEngine on Enhanced CPS, WA households.

name: wa-tanf-ecps
title: Washington TANF -- Axiom vs PolicyEngine
description: >-
  Compares the annualized WA TANF (WorkFirst) grant from the composed
  us-wa/tanf program (WAC 388-450 benefit and work deductions, 388-478
  payment standards and gross earned income limits) against PolicyEngine's
  wa_tanf on Enhanced CPS households in Washington, using the canonical
  rulespec-us checkout directly.

runner:
  type: axiom-oracles-compare
  axiom_binary: $HOME/TheAxiomFoundation/axiom-rules-engine/target/release/axiom-rules-engine
  parameters:
    left: axiom
    right: policyengine
    suite: wa-tanf-ecps
    concepts:
      - us-wa:regulations/388#wa_tanf_benefit
    sample_size: 0
    period: 2026-01
    population: enhanced-cps
    jurisdiction_fips: "53"
    axiom_compose_binary: $HOME/TheAxiomFoundation/axiom-compose/.venv/bin/axiom-compose
    axiom_program: $HOME/TheAxiomFoundation/rulespec-us/us-wa/programs/tanf/fy-2026.yaml
    axiom_composed_program: /tmp/axiom-composed/wa-tanf-ecps.yaml
    axiom_compiled_program: /tmp/wa-tanf-compiled.json
    rulespec_root: $HOME/TheAxiomFoundation/rulespec-us

artifacts:
  report_basename: axiom-policyengine-wa-tanf-ecps

dashboard:
  filename: axiom-policyengine-wa-tanf-ecps.json
  suite: wa-tanf-ecps
