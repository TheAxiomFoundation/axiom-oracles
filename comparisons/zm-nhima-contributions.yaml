name: zm-nhima-contributions
title: Zambia zm-nhima-contributions — Axiom vs MicroZAMOD
description: >-
  Compares the rulespec-zm S.I. No. 63 of 2019 NHIMA rates (Third Schedule:
  employee 1% of basic salary; employer 1%; uncapped) against MicroZAMOD
  tsceehl_s/tscerhl_s (ZM_2025, zm_2022_a2). The module is Month-period, so
  output annualization is off and the engine's monthly yem is bridged onto the
  module's monthly basic_salary input; exact at every case, including
  144,295.10/month. Regenerated by scripts/regenerate_euromod_zm.sh where the
  x64 EUROMOD runtime and the local SOUTHMOD bundle are available. Results are
  based on the tax-benefit microsimulation model for Zambia (MicroZAMOD) in
  SOUTHMOD_A4.0, developed, maintained and managed by UNU-WIDER with SASPRI,
  the LSE International Inequalities Institute and local partners, run on the
  EUROMOD software (EM_Executable 1.0.0 via the euromod connector 0.2.18)
  under the zm_2022_a2 dataset configuration (Zambia Statistics Agency, Living
  Conditions Monitoring Survey 2022); only the dataset's variable list is read
  and every household is synthetic. The results and their interpretation are
  Axiom's responsibility. The SOUTHMOD bundle is licensed and
  non-redistributable: it is referenced only by path (euromod_model_root), and
  no model XML, dataset row, or DRD text is committed.

# Not runnable on the CI matrix runners. The SOUTHMOD bundle is licensed to
# Axiom by UNU-WIDER under the SOUTHMOD_A4.0 Adhesion Agreement, which bars
# providing the model or its input datasets to any third party (clause 4), so
# no shared runner can hold it; the runner also needs the x64 EUROMOD engine
# (EM_Executable.dll) under EUROMOD_PYTHON and a .NET runtime. Manual lane
# only: scripts/regenerate_euromod_zm.sh, where the licensed bundle and
# runtime exist, refreshes the committed report. This marker stays unless
# UNU-WIDER licenses a runner-held copy.
ci: manual

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: zm-nhima-contributions
    population: synthetic
    sample_size: 0
    period: 2025
    euromod_model_root: $HOME/.axiom/oracles/southmod/bundle/SOUTHMOD_A4.0
    euromod_country: ZM
    euromod_system: ZM_2025
    euromod_dataset: zm_2022_a2
    euromod_annualize_outputs: false
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-zm-nhima-contributions.json

artifacts:
  report_basename: axiom-euromod-zm-nhima-contributions

dashboard:
  filename: axiom-euromod-zm-nhima-contributions.json
  suite: zm-nhima-contributions
