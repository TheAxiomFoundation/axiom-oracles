name: et-paye-rate-schedule
title: Ethiopia employment income tax schedule — Axiom vs ETMOD
description: >-
  Compares the rulespec-et Proclamation 1395/2025 Article 11 monthly
  employment schedule (0% to 2,000 birr; 15/20/25/30%; 35% above 14,000)
  against ETMOD tin01_s (SOUTHMOD A4.0, country ET, system ET_2025 =
  EFY2025/26, dataset et_2022_a2) on the FULL grid - the statutory base is
  gross employment income (Proclamation 979/2016 Articles 10(3) and 65(1)(c)
  verified: no employee deduction exists) and ETMOD taxes gross. Run live
  exact at eight incomes from 1,000 to 20,000 birr a month. The module is
  Month-period, so the suite runs with euromod_annualize_outputs off: ETMOD's
  monthly tin01_s is compared as-is and the engine's post-uprating monthly yem
  is bridged unchanged to the module's monthly input (employment uprating
  1.7035555555555557, probed). Results are based on the tax-benefit
  microsimulation model for Ethiopia (ETMOD) in SOUTHMOD_A4.0, developed,
  maintained and managed by UNU-WIDER with SASPRI, the LSE International
  Inequalities Institute and local partners, run on the EUROMOD software
  (EM_Executable 1.0.0 via the euromod connector 0.2.18) under the et_2022_a2
  dataset configuration (Central Statistical Agency of Ethiopia, Ethiopia
  Socioeconomic Panel Survey Wave 5, 2021-2022); only the dataset's variable
  list is read and every household is synthetic. The results and their
  interpretation are Axiom's responsibility. The SOUTHMOD bundle is licensed
  and non-redistributable: it is referenced only by path (euromod_model_root),
  and no model XML, dataset row, or DRD text is committed.

# Not runnable on the CI matrix runners. The SOUTHMOD bundle is licensed to
# Axiom by UNU-WIDER under the SOUTHMOD_A4.0 Adhesion Agreement, which bars
# providing the model or its input datasets to any third party (clause 4), so
# no shared runner can hold it; the runner also needs the x64 EUROMOD engine
# (EM_Executable.dll) under EUROMOD_PYTHON and a .NET runtime. Manual lane
# only: scripts/regenerate_euromod_et.sh, where the licensed bundle and
# runtime exist, refreshes the committed report. This marker stays unless
# UNU-WIDER licenses a runner-held copy.
ci: manual

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: et-paye-rate-schedule
    population: synthetic
    sample_size: 0
    period: 2026
    euromod_model_root: $HOME/.axiom/oracles/southmod/bundle/SOUTHMOD_A4.0
    euromod_country: ET
    euromod_system: ET_2025
    euromod_dataset: et_2022_a2
    euromod_annualize_outputs: false
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-et-paye-rate-schedule.json

artifacts:
  report_basename: axiom-euromod-et-paye-rate-schedule

dashboard:
  filename: axiom-euromod-et-paye-rate-schedule.json
  suite: et-paye-rate-schedule
