name: et-presumptive
title: Ethiopia Category B gross-receipts tax — Axiom vs ETMOD
description: >-
  Compares the rulespec-et Article 50 gross-receipts tax (2/3/5/7/9% by
  receipts band up to 2,000,000 birr, Category B taxpayers under the Article
  49 regime) against ETMOD ttn_s (SOUTHMOD A4.0, country ET, system ET_2025 =
  EFY2025/26, dataset et_2022_a2) at interior and band-edge receipts. Both
  engines read the Article 50 table marginally; the table itself lists only
  receipts bands and percentages. The engine's post-uprating ytn is bridged to
  the module's annual_gross_receipts. Run live exact at all five cases.
  Results are based on the tax-benefit microsimulation model for Ethiopia
  (ETMOD) in SOUTHMOD_A4.0, developed, maintained and managed by UNU-WIDER
  with SASPRI, the LSE International Inequalities Institute and local
  partners, run on the EUROMOD software (EM_Executable 1.0.0 via the euromod
  connector 0.2.18) under the et_2022_a2 dataset configuration (Central
  Statistical Agency of Ethiopia, Ethiopia Socioeconomic Panel Survey Wave 5,
  2021-2022); only the dataset's variable list is read and every household is
  synthetic. The results and their interpretation are Axiom's responsibility.
  The SOUTHMOD bundle is licensed and non-redistributable: it is referenced
  only by path (euromod_model_root), and no model XML, dataset row, or DRD
  text is committed.

# Not runnable on the CI matrix runners. The SOUTHMOD bundle is licensed to
# Axiom by UNU-WIDER under the SOUTHMOD_A4.0 Adhesion Agreement, which bars
# providing the model or its input datasets to any third party (clause 4), so
# no shared runner can hold it; the runner also needs the x64 EUROMOD engine
# (EM_Executable.dll) under EUROMOD_PYTHON and a .NET runtime. Manual lane
# only: scripts/regenerate_euromod_et.sh, where the licensed bundle and
# runtime exist, refreshes the committed report. This marker stays unless
# UNU-WIDER licenses a runner-held copy.
ci: manual

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: et-presumptive
    population: synthetic
    sample_size: 0
    period: 2026
    euromod_model_root: $HOME/.axiom/oracles/southmod/bundle/SOUTHMOD_A4.0
    euromod_country: ET
    euromod_system: ET_2025
    euromod_dataset: et_2022_a2
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-et-presumptive.json

artifacts:
  report_basename: axiom-euromod-et-presumptive

dashboard:
  filename: axiom-euromod-et-presumptive.json
  suite: et-presumptive
