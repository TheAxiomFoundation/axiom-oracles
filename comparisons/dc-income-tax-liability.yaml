name: dc-income-tax-liability
title: District of Columbia income tax liability — Axiom vs PolicyEngine and TAXSIM
description: >-
  Compares the composed District of Columbia resident wage-earner income-tax pipeline in
  Axiom RuleSpec against PolicyEngine (dc_income_tax_before_credits) at 2026 and TAXSIM
  (siitax) at its latest supported law year, 2024, on the standard six-case grid.

runner:
  type: state-income-tax-liability-grid
  parameters:
    state: DC
    period: "2026"
    taxsim_law_year: 2024
    rulespec_roots:
      - $HOME/TheAxiomFoundation/rulespec-us

artifacts:
  report_basename: axiom-policyengine-taxsim-dc-income-tax-liability

dashboard:
  filename: axiom-policyengine-taxsim-dc-income-tax-liability.json
  suite: dc-income-tax-liability
