# Parameter-oracle suites: encoded rulespec parameter values compared against
# PolicyEngine parameters at a fixed instant. The rulespec side is read from
# upstream rulespec-us origin/main (local checkouts drift), evaluated from the
# encoded formulas by scripts/run_parameter_comparisons.py.
#
# NOTE: the parameter runner evaluates PolicyEngine from the repo venv,
# while household suites run the pinned PE 4.11 stack — a PE upgrade can
# make the two families disagree about the same parameter. Keep the venv
# and _PE_ORACLE_PINS aligned when bumping either.
#
# axiom_formula (optional) combines rules from the same file — e.g. Medicaid
# effective limits are raw FPL limit + the 5% MAGI disregard, mirroring how
# PolicyEngine stores the effective limit. (The disregard itself moved to
# the shared us:policies/cms/medicaid-chip-bhp-eligibility-levels module
# upstream, so it appears here as the 0.05 literal.)
#
# This file is NOT a single-runner comparison config: it declares a *list* of
# parameter-oracle suites consumed by scripts/run_parameter_comparisons.py, not
# by run_comparison.py's runner registry. The explicit `kind` marker below is
# what makes that first-class — `run_comparison.py --list`, the affected-map
# generator, and the vacuous-verification gate all key off `kind` instead of
# the old heuristic of "no `name:` key means non-registry" (the #73 --list
# KeyError patch). Recognized in place; no relocation needed.

schema: axiom_oracles.parameter_suite_list.v1
kind: parameter-suite-list

period: "2026-01-01"

suites:
  - suite: ga-health-thresholds
    category: health
    locales: [GA]
    comparisons:
      - file: us-ga/policies/cms/georgia-medicaid-chip-bhp-eligibility-levels.yaml
        rule: georgia_children_medicaid_ages_0_to_1_fpl_limit
        axiom_formula: georgia_children_medicaid_ages_0_to_1_fpl_limit + 0.05
        description: Children Medicaid ages 0-1 FPL limit
        pe: gov.hhs.medicaid.eligibility.categories.infant.income_limit.GA
      - file: us-ga/policies/cms/georgia-medicaid-chip-bhp-eligibility-levels.yaml
        rule: georgia_children_medicaid_ages_1_to_5_fpl_limit
        axiom_formula: georgia_children_medicaid_ages_1_to_5_fpl_limit + 0.05
        description: Children Medicaid ages 1-5 FPL limit
        pe: gov.hhs.medicaid.eligibility.categories.young_child.income_limit.GA
      - file: us-ga/policies/cms/georgia-medicaid-chip-bhp-eligibility-levels.yaml
        rule: georgia_children_medicaid_ages_6_to_18_fpl_limit
        axiom_formula: georgia_children_medicaid_ages_6_to_18_fpl_limit + 0.05
        description: Children Medicaid ages 6-18 FPL limit
        pe: gov.hhs.medicaid.eligibility.categories.older_child.income_limit.GA
      - file: us-ga/policies/cms/georgia-medicaid-chip-bhp-eligibility-levels.yaml
        rule: georgia_pregnant_women_medicaid_fpl_limit
        axiom_formula: georgia_pregnant_women_medicaid_fpl_limit + 0.05
        description: Pregnant women Medicaid FPL limit
        pe: gov.hhs.medicaid.eligibility.categories.pregnant.income_limit.GA
      - file: us-ga/policies/cms/georgia-medicaid-chip-bhp-eligibility-levels.yaml
        rule: georgia_parent_caretaker_adults_medicaid_fpl_limit
        axiom_formula: georgia_parent_caretaker_adults_medicaid_fpl_limit + 0.05
        description: Parent / caretaker adult Medicaid FPL limit
        pe: gov.hhs.medicaid.eligibility.categories.parent.income_limit.GA

  - suite: ssi-parameters
    category: cash
    locales: [US]
    comparisons:
      # The SSI income exclusions were never inflation-adjusted, so the
      # encoded 1972 statutory annual amounts compare directly against
      # PolicyEngine's current monthly parameters. The federal benefit rate
      # itself is NOT compared here: computing it from the encoded statute
      # requires the full 1382f COLA chain (a composition, not a file).
      - file: us/statutes/42/1382a/b/2.yaml
        rule: annual_general_income_exclusion_limit
        axiom_formula: annual_general_income_exclusion_limit / 12
        description: SSI general income exclusion (monthly)
        pe: gov.ssa.ssi.income.exclusions.general
      - file: us/statutes/42/1382a/b/4.yaml
        rule: annual_earned_income_initial_exclusion_limit
        axiom_formula: annual_earned_income_initial_exclusion_limit / 12
        description: SSI earned income initial exclusion (monthly)
        pe: gov.ssa.ssi.income.exclusions.earned
      - file: us/statutes/42/1382a/b/4.yaml
        rule: earned_income_remainder_exclusion_rate
        description: SSI earned income remainder exclusion rate
        pe: gov.ssa.ssi.income.exclusions.earned_share

