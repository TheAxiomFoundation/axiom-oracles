name: gh-income-tax-rate-schedule
title: Ghana resident income-tax rate schedule — Axiom vs GHAMOD
description: >-
  Compares the rulespec-gh resident individual income-tax rate schedule (Income
  Tax (Amendment) (No. 2) Act 2023 (Act 1111) First Schedule bands over
  chargeable income: 5,880 nil / +1,320 5% / +1,560 10% / +38,000 17.5% /
  +192,000 25% / +366,240 30% / >605,000 35%) encoded in Axiom RuleSpec against
  GHAMOD's tin_s on a band-boundary and interior income sweep. GHAMOD is the
  SOUTHMOD tax-benefit model for Ghana (UNU-WIDER), run on the EUROMOD engine
  (SOUTHMOD A4.0, country GH, system GH_2025, dataset gh_2017_a8). The Act 1111
  bands are effective 2024 and unchanged for 2025 and 2026, so GHAMOD GH_2024
  and GH_2025 apply the identical schedule the Axiom module validates for 2026.
  GHAMOD's tin_gh has no SSNIT deduction in the tax base (base = gross minus
  reliefs; here a single formal-sector employee with no reliefs), so both engines
  apply the schedule to the identical base; the case pre-divides the euromod
  input by the GH_2025 employment-income uprating index and bridges Axiom's
  chargeable_income on the engine's own post-uprating yem, so both price the same
  gross. All incomes at or below 605,000 match to the cedi; the 700,000 case is
  the one documented divergence — GHAMOD's tin_gh SchedCalc wires only five bands
  and never applies the Act 1111 35% top band (its 600,000 lower-limit and 35%
  rate constants are defined but unused), so GHAMOD taxes above 238,760 at a flat
  30% while Axiom applies 35% above 605,000 (a 4,750 wedge = 5% of 95,000),
  dispositioned as an oracle gap in dispositions/gh-income-tax-rate-schedule.yaml.
  The SOUTHMOD bundle is licensed and non-redistributable: it is referenced only
  by env var / path (euromod_model_root), and no model XML, dataset row, or DRD
  text is committed. This suite runs where the x64 EUROMOD runtime and the local
  SOUTHMOD bundle are available and is regenerated by
  scripts/regenerate_euromod_gh.sh; on runners without them it re-emits the
  committed dashboard report.

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: gh-income-tax-rate-schedule
    population: synthetic
    sample_size: 0
    # Ghana year of assessment 2026 (the rulespec-gh validation year). GHAMOD
    # resolves its policy year from euromod_system (GH_2025) and ignores the
    # case period; the Act 1111 schedule is frozen across 2024-2026.
    period: 2026
    euromod_model_root: $HOME/.axiom/oracles/southmod/bundle/SOUTHMOD_A4.0
    euromod_country: GH
    euromod_system: GH_2025
    euromod_dataset: gh_2017_a8
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-gh-income-tax-rate-schedule.json

artifacts:
  report_basename: axiom-euromod-gh-income-tax-rate-schedule

dashboard:
  filename: axiom-euromod-gh-income-tax-rate-schedule.json
  suite: gh-income-tax-rate-schedule
