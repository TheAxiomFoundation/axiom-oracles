name: rw-dispy
title: Rwanda rw-dispy — Axiom vs RWAMOD
description: >-
  Compares the rulespec-rw composed monthly disposable-income pipeline (Law
  027/2022 Article 56 Table 2 tax on gross monthly employment income, less the
  Presidential Order 086/01 employee pension half, the Law 003/2016 employee
  maternity contribution and the PM Order 105/03 CBHI employee levy of 0.5% on
  the composed net salary) against RWAMOD ils_dispy on RW_2025 for the formal
  private-sector worker, and the pipeline's levy on that composed net salary
  against RWAMOD tsceehl03_s. Both engines apply the same identity to the
  identical gross base, so the live cases run the FULL grid from the nil zone
  through the top band; RWAMOD starts each tax band at its printed lower
  bound, one franc above the encoded threshold, which moves tax by at most 0.3
  FRW per month, inside the 1-FRW tolerance. The levy comparison checks the
  pipeline's own copy of the 0.5% rate on a net salary composed from Axiom's
  own outputs, never from the engine's levy. Monthly pipeline: euromod output
  annualization is off and the engine's own post-uprating yem is bridged to
  the three imported inputs. The Axiom side evaluates period 2026; RWAMOD runs
  RW_2025 (CY2025), and every schedule this suite compares is value-identical
  across 2025 and 2026. Results are based on the tax-benefit microsimulation
  model for Rwanda (RWAMOD) in SOUTHMOD_A4.0, developed, maintained and
  managed by UNU-WIDER with SASPRI, the LSE International Inequalities
  Institute and local partners, run on the EUROMOD software (EM_Executable
  1.0.0 via the euromod connector 0.2.18) under the registered rw_2024_a1
  dataset name; the bundle ships no Rwandan microdata, so a header-only input
  file is built locally from the model's own variable list and every household
  is synthetic. The results and their interpretation are Axiom's
  responsibility. The SOUTHMOD bundle is licensed and non-redistributable: it
  is referenced only by path (euromod_model_root), and no model XML, dataset
  row, or DRD text is committed.

# Not runnable on the CI matrix runners. The SOUTHMOD bundle is licensed to
# Axiom by UNU-WIDER under the SOUTHMOD_A4.0 Adhesion Agreement, which bars
# providing the model or its input datasets to any third party (clause 4), so
# no shared runner can hold it; the runner also needs the x64 EUROMOD engine
# (EM_Executable.dll) under EUROMOD_PYTHON and a .NET runtime. Manual lane
# only: scripts/regenerate_euromod_rw.sh, where the licensed bundle and
# runtime exist, refreshes the committed report. This marker stays unless
# UNU-WIDER licenses a runner-held copy.
ci: manual

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: rw-dispy
    population: synthetic
    sample_size: 0
    period: 2026
    euromod_model_root: $HOME/.axiom/oracles/southmod/bundle/SOUTHMOD_A4.0
    euromod_country: RW
    euromod_system: RW_2025
    euromod_dataset: rw_2024_a1
    euromod_annualize_outputs: false
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-rw-dispy.json

artifacts:
  report_basename: axiom-euromod-rw-dispy

dashboard:
  filename: axiom-euromod-rw-dispy.json
  suite: rw-dispy
