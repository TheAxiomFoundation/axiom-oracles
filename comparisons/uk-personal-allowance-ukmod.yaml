name: uk-personal-allowance-ukmod
title: UK personal allowance — Axiom vs UKMOD
description: >-
  Compares the Income Tax Act 2007 section 35 personal allowance encoded in
  Axiom RuleSpec (the ``uk_pit_pilot_personal_allowance`` step of the composed
  single-employee income-tax pipeline: the preliminary allowance less the
  section 35(2)-(3) income-limit taper, half of adjusted net income above the
  limit floored at zero) against CeMPA's UKMOD ``tinta_s`` on a synthetic
  single-individual gross-employment-income sweep at 40k / 100k / 110k /
  125.14k / 150k. The 110k and 125.14k cases exercise the mid-taper and the
  point of full withdrawal; 150k confirms the allowance stays at zero. This is
  a pure income sweep — no household structure, receipt history, or take-up
  draw — so it grades the s.35 allowance directly rather than only folded into
  the downstream ``tin_s`` liability the ``uk-worker-pit`` suite already
  compares. UKMOD runs the registration-free public model
  (UKMOD_PUBLIC_B2026.03, system UK_2026, dataset training_data); the input
  bridge feeds the pilot the same gross employment income UKMOD used (its
  post-uprating ``yem``). This suite runs where the x64 UKMOD runtime and model
  checkout are available and is regenerated by
  scripts/regenerate_euromod_uk.sh; on runners without them it re-emits the
  committed dashboard report.

runner:
  type: euromod-synthetic-compare
  axiom_binary: $HOME/TheAxiomFoundation/axiom-rules-engine/target/release/axiom-rules-engine
  parameters:
    suite: uk-personal-allowance
    population: synthetic
    sample_size: 0
    # UK fiscal-year law takes effect 6 April; the engine keys parameter
    # versions off period.start, so the Axiom side evaluates on the 2026-27
    # tax-year boundary (6 Apr 2026 - 5 Apr 2027). UKMOD resolves the policy
    # year from euromod_system (UK_2026) and ignores the case period.
    period: 2026-04-06
    euromod_model_root: $HOME/Downloads/UKMOD_PUBLIC_B2026.03
    euromod_country: UK
    euromod_system: UK_2026
    euromod_dataset: training_data
    rulespec_root: $HOME/TheAxiomFoundation/rulespec-uk
    dashboard_filename: axiom-euromod-uk-personal-allowance.json

artifacts:
  report_basename: axiom-euromod-uk-personal-allowance

dashboard:
  filename: axiom-euromod-uk-personal-allowance.json
  suite: uk-personal-allowance
