# Minnesota TANF -- Axiom vs PolicyEngine on Enhanced CPS, NY households.

name: mn-tanf-ecps
title: Minnesota TANF -- Axiom vs PolicyEngine
description: >-
  Compares the monthly NY TANF (Family Assistance) grant from the composed
  us-mn/tanf program (state plan 2024-2026 standard of need, home energy
  allowances, with-children shelter allowance, and earned income
  disregards) against PolicyEngine's ny_tanf on Enhanced CPS households in
  Minnesota. Known parameter divergences the suite is expected to surface:
  the encoded state plan's 62% earned income disregard vs PolicyEngine's
  50%, and different local-agency shelter maximum schedules. Refresh the
  rulespec root after pulling ~/rulespec-us with:
  rsync -a --delete --exclude .axiom ~/rulespec-us/us-ny/ ~/.axiom-oracles/roots/rulespec-us-mn/

runner:
  type: axiom-oracles-compare
  axiom_rules_repo: $HOME/axiom-rules-engine
  parameters:
    # Loaded-case count overstates this suite (in-bridge filtering), so
    # the size heuristic under-persists; keep full per-case evidence.
    include_case_inputs: true
    left: axiom
    right: policyengine
    suite: mn-tanf-ecps
    concepts:
      - us-mn:policies/dhs/combined-manual#mn_mfip_benefit
    sample_size: 0
    period: 2026-01
    population: enhanced-cps
    jurisdiction_fips: "27"
    axiom_compose_binary: $HOME/axiom-compose/.venv/bin/axiom-compose
    axiom_program: $HOME/axiom-oracles/programs/us-mn/tanf/fy-2026.yaml
    axiom_composed_program: /tmp/mn-tanf-composed.yaml
    axiom_compiled_program: /tmp/mn-tanf-compiled.json
    axiom_rulespec_repo_roots: $HOME/.axiom-oracles/roots
    rulespec_roots:
      - $HOME/.axiom-oracles/roots/rulespec-us-mn

artifacts:
  report_basename: axiom-policyengine-mn-tanf-ecps

dashboard:
  filename: axiom-policyengine-mn-tanf-ecps.json
  suite: mn-tanf-ecps
