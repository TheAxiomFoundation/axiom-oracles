name: az-snap-ecps
title: Arizona SNAP — Axiom vs PolicyEngine
description: >-
  Compares Arizona SNAP eligibility and benefit amount produced by the
  RuleSpec composition against PolicyEngine on the Enhanced CPS, filtered to
  Arizona households.

runner:
  type: axiom-encode-snap-ecps-compare
  axiom_encode_repo: $HOME/axiom-encode
  axiom_rules_repo: $HOME/axiom-rules-engine
  parameters:
    jurisdiction: us-az
    sample_size: 0
    year: 2026
    month: 1
    utility_projection: policyengine-type
    tolerance: 1.5

artifacts:
  report_basename: axiom-policyengine-az-snap-ecps

dashboard:
  filename: axiom-policyengine-az-snap-ecps.json
  suite: az-snap-ecps
