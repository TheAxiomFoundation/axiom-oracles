name: zm-dispy
title: Zambia zm-dispy — Axiom vs MicroZAMOD
description: >-
  Compares the rulespec-zm composed single-employee disposable-income pipeline
  (Act 22 of 2023 Charging Schedule tax on gross income, less the employee
  NAPSA and NHIMA contributions, which the pipeline takes as inputs) against
  MicroZAMOD ils_dispy (ZM_2025, zm_2022_a2). Live cases sit in the shared-nil
  zone (gross at or below the 61,200 exempt bound), where neither engine
  charges tax. The bridges feed the engine's own yem and its
  tsceepi_s/tsceehl_s (returned monthly by the adapter, so multiplied by 12
  onto the annual pipeline inputs); the contribution legs are therefore tested
  by zm-napsa-contributions and zm-nhima-contributions, and this suite tests
  the tax leg and the composition. Taxed zone (rulespec-zm#1 CANDIDATE finding
  1, a ledger entry in microzamod_issues.json): the model taxes a base net of
  the contributions; at 240,000 gross it returns tax 54,984 and dispy 170,616
  (probed 2026-10-04) where the schedule on gross gives 60,312 and 165,288.
  Regenerated by scripts/regenerate_euromod_zm.sh where the x64 EUROMOD
  runtime and the local SOUTHMOD bundle are available. Results are based on
  the tax-benefit microsimulation model for Zambia (MicroZAMOD) in
  SOUTHMOD_A4.0, developed, maintained and managed by UNU-WIDER with SASPRI,
  the LSE International Inequalities Institute and local partners, run on the
  EUROMOD software (EM_Executable 1.0.0 via the euromod connector 0.2.18)
  under the zm_2022_a2 dataset configuration (Zambia Statistics Agency, Living
  Conditions Monitoring Survey 2022); only the dataset's variable list is read
  and every household is synthetic. The results and their interpretation are
  Axiom's responsibility. The SOUTHMOD bundle is licensed and
  non-redistributable: it is referenced only by path (euromod_model_root), and
  no model XML, dataset row, or DRD text is committed.

# Not runnable on the CI matrix runners. The SOUTHMOD bundle is licensed to
# Axiom by UNU-WIDER under the SOUTHMOD_A4.0 Adhesion Agreement, which bars
# providing the model or its input datasets to any third party (clause 4), so
# no shared runner can hold it; the runner also needs the x64 EUROMOD engine
# (EM_Executable.dll) under EUROMOD_PYTHON and a .NET runtime. Manual lane
# only: scripts/regenerate_euromod_zm.sh, where the licensed bundle and
# runtime exist, refreshes the committed report. This marker stays unless
# UNU-WIDER licenses a runner-held copy.
ci: manual

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: zm-dispy
    population: synthetic
    sample_size: 0
    period: 2025
    euromod_model_root: $HOME/.axiom/oracles/southmod/bundle/SOUTHMOD_A4.0
    euromod_country: ZM
    euromod_system: ZM_2025
    euromod_dataset: zm_2022_a2
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-zm-dispy.json

artifacts:
  report_basename: axiom-euromod-zm-dispy

dashboard:
  filename: axiom-euromod-zm-dispy.json
  suite: zm-dispy
