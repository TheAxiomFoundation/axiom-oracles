# Massachusetts SNAP — Axiom vs PolicyEngine on the Enhanced CPS.
# This uses the first compiled MA SNAP program surface from
# axiom-programs/us-ma/snap/fy-2026.yaml. The MA RuleSpec scope includes
# executable 106 CMR 364 slices, while missing posted income/table details
# remain documented as residual comparison gaps rather than Python overrides.

name: ma-snap-ecps
title: Massachusetts SNAP — Axiom vs PolicyEngine
description: Compares Massachusetts SNAP eligibility and benefit amount from
  the composed axiom-programs/us-ma/snap/fy-2026 spec against PolicyEngine on
  the Enhanced CPS, filtered to Massachusetts households.

# Not CI-runnable while engine-main x rulespec-us-main is broken: composed-root
# staging fails the engine's canonical-path scan (non-canonical filenames in
# us-la/us-nh/us-nj/us -- rulespec-us#1049) before any comparison runs;
# rulespec-us#1050 (removed plural corpus_citation_paths) and -- for the
# composed program lanes -- axiom-compose#29 and axiom-oracles#335 queue
# behind it. Manual lane only; drop this marker when the upstream chain lands
# (axiom-oracles#455 tracks the flip-back).
ci: manual

runner:
  type: axiom-oracles-compare
  axiom_rules_repo: $HOME/axiom-rules-engine
  parameters:
    left: axiom
    right: policyengine
    concepts:
      - us:statutes/7/2014/o#snap_eligible
      - us:statutes/7/2014/u#snap_benefit
    # Run the full Massachusetts slice of ECPS. A sampled run understated the
    # MA residuals because only 19 MA households survived the FIPS filter.
    sample_size: 0
    period: 2026-01
    population: enhanced-cps
    python: "3.13"
    policyengine_version: "4.18.9"
    policyengine_us_version: "1.767.3"
    policyengine_core_version: "3.30.3"
    axiom_compose_binary: $HOME/axiom-compose/.venv/bin/axiom-compose
    axiom_program: $HOME/rulespec-us/programs/us-ma/snap/fy-2026.yaml
    axiom_composed_program: /tmp/ma-snap-composed.yaml
    axiom_compiled_program: /tmp/ma-snap-compiled.json
    axiom_rulespec_repo_roots: $HOME
    rulespec_roots:
      - $HOME/rulespec-us
    jurisdiction_fips: "25"

artifacts:
  report_basename: axiom-policyengine-ma-snap-ecps

dashboard:
  filename: axiom-policyengine-ma-snap-ecps.json
  suite: ma-snap-ecps
