name: ug-scg
title: Uganda Senior Citizens Grant — Axiom vs UGAMOD
description: >-
  Compares the rulespec-ug Senior Citizens Grant national rule (MGLSD SAGE
  Handbook: Shs 25,000 a month at age 80 and above, annualized to 300,000)
  against UGAMOD boa_s (SOUTHMOD A4.0, country UG, system UG_2025 = FY2025/26,
  dataset ug_2024_a1) at ages 79, 80 and 85 on a single-person row that sets
  no district input. Run live exact: 300,000 a year at 80 and 85, 0 at 79. The
  module encodes the age-80 national rule only. The handbook's national-ID and
  no-other-government-pension conditions are not encoded (the rows carry no
  pension income), and the earlier pilot and FY2016/17 district rollouts with
  lower ages or oldest-100 selection are outside the module, so none of them
  is compared. Results are based on the tax-benefit microsimulation model for
  Uganda (UGAMOD) in SOUTHMOD_A4.0, developed, maintained and managed by
  UNU-WIDER with SASPRI, the LSE International Inequalities Institute and
  local partners, run on the EUROMOD software (EM_Executable 1.0.0 via the
  euromod connector 0.2.18) under the ug_2024_a1 dataset configuration (Uganda
  Bureau of Statistics, Uganda National Household Survey 2023/24); only the
  dataset's variable list is read and every household is synthetic. The
  results and their interpretation are Axiom's responsibility. The SOUTHMOD
  bundle is licensed and non-redistributable: it is referenced only by path
  (euromod_model_root), and no model XML, dataset row, or DRD text is
  committed.

# Not runnable on the CI matrix runners. The SOUTHMOD bundle is licensed to
# Axiom by UNU-WIDER under the SOUTHMOD_A4.0 Adhesion Agreement, which bars
# providing the model or its input datasets to any third party (clause 4), so
# no shared runner can hold it; the runner also needs the x64 EUROMOD engine
# (EM_Executable.dll) under EUROMOD_PYTHON and a .NET runtime. Manual lane
# only: scripts/regenerate_euromod_ug.sh, where the licensed bundle and
# runtime exist, refreshes the committed report. This marker stays unless
# UNU-WIDER licenses a runner-held copy.
ci: manual

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: ug-scg
    population: synthetic
    sample_size: 0
    period: 2026
    euromod_model_root: $HOME/.axiom/oracles/southmod/bundle/SOUTHMOD_A4.0
    euromod_country: UG
    euromod_system: UG_2025
    euromod_dataset: ug_2024_a1
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-ug-scg.json

artifacts:
  report_basename: axiom-euromod-ug-scg

dashboard:
  filename: axiom-euromod-ug-scg.json
  suite: ug-scg
