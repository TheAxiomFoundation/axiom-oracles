# Georgia SNAP / Food Stamps -- Axiom vs PolicyEngine on Enhanced CPS.

name: ga-snap-ecps
title: Georgia SNAP -- Axiom vs PolicyEngine
description: Compares Georgia SNAP eligibility and benefit amount from the
  composed axiom-programs/us-ga/snap/fy-2026 spec (DFCS manual sections 3210
  and 3612-3618 scoped with the federal SNAP baseline) against PolicyEngine on
  the Enhanced CPS, filtered to Georgia households. Complements ga-snap-qc,
  which measures the same program over the FY2024 QC sample.

runner:
  type: axiom-oracles-compare
  axiom_rules_repo: $HOME/axiom-rules-engine
  parameters:
    left: axiom
    right: policyengine
    concepts:
      - us:programs/snap#eligible
      - us:programs/snap#benefit
    sample_size: 0
    period: 2026-01
    population: enhanced-cps
    axiom_compose_binary: $HOME/axiom-compose/.venv/bin/axiom-compose
    axiom_program: $HOME/rulespec-us/programs/us-ga/snap/fy-2026.yaml
    axiom_composed_program: /tmp/ga-snap-composed.yaml
    axiom_compiled_program: /tmp/ga-snap-compiled.json
    axiom_rulespec_repo_roots: $HOME
    rulespec_roots:
      - $HOME/rulespec-us
    jurisdiction_fips: "13"

artifacts:
  report_basename: axiom-policyengine-ga-snap-ecps

dashboard:
  filename: axiom-policyengine-ga-snap-ecps.json
  suite: ga-snap-ecps
