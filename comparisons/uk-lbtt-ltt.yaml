# Devolved residential property transaction taxes — rulespec-uk band splits vs
# PolicyEngine-UK on a synthetic household grid. The Axiom side is the two
# encoded policy modules: Scotland's Land and Buildings Transaction Tax
# (uk/policies/govuk/lbtt.yaml, SSI 2015/126 + LBTT(S)A 2013 Sch 2A) and Wales's
# Land Transaction Tax (uk/policies/govuk/ltt.yaml, WSI 2018/128 + LTT(W)A 2017
# s.24), evaluated through the axiom rules engine over the supplied main and
# additional residential purchase prices.
#
# The purchase prices are supplied inputs on both engines, so the band splits
# are commensurable. LBTT main-home purchases match PolicyEngine to the penny.
# Two vintage divergences are exposed and dispositioned as upstream PolicyEngine
# staleness (dispositions/uk-lbtt-ltt.yaml): the LBTT Additional Dwelling
# Supplement (PolicyEngine 6%, statute 8% from 5 December 2024 — #1795) and the
# Welsh LTT primary/higher-rate scales (PolicyEngine frozen at the 2021-07-01 /
# 2020-12-22 vintages — #1796).
#
# Run locally (needs a PolicyEngine-UK 2.89.2 env, a built axiom rules engine and
# the rulespec-uk checkout):
#   uv run python scripts/run_comparison.py uk-lbtt-ltt

name: uk-lbtt-ltt
title: UK devolved property transaction taxes — Axiom vs PolicyEngine
description: >-
  Compares the encoded Scottish LBTT (rulespec-uk uk/policies/govuk/lbtt.yaml,
  SSI 2015/126 + LBTT(S)A 2013 Sch 2A) and Welsh LTT (uk/policies/govuk/ltt.yaml,
  WSI 2018/128 + LTT(W)A 2017 s.24) band splits against PolicyEngine-UK
  land_and_buildings_transaction_tax and land_transaction_tax (2.89.2) at the
  2026 validation year on a synthetic household grid crossing every residential
  band. The main and additional residential purchase prices are supplied inputs
  on both engines.
documentation: docs/uk-coverage-matrix.md

runner:
  type: uk-lbtt-ltt-grid
  axiom_binary: $HOME/TheAxiomFoundation/axiom-rules-engine/target/release/axiom-rules-engine
  parameters:
    period: "2026"
    policyengine_uk_version: "2.89.2"
    # Links this suite to the rulespec-uk monorepo in the affected map so a
    # change to either encoded band split triggers a re-run.
    rulespec_root: $HOME/TheAxiomFoundation/rulespec-uk

artifacts:
  report_basename: axiom-policyengine-uk-lbtt-ltt

dashboard:
  filename: axiom-policyengine-uk-lbtt-ltt.json
  suite: uk-lbtt-ltt
