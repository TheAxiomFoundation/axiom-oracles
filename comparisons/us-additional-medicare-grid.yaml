# Federal Additional Medicare Tax — Axiom vs PolicyEngine-US, tax year 2026.
#
# Axiom boundary: the combined final adds the imported section 3101(b)(2) wage
# leg to section 1401(b)(2)'s self-employment leg. The latter taxes completed
# section 1402 income above the filing-status threshold after wages reduce that
# threshold, but not below zero, under 26 CFR 1.1401-1(d)(2)(i). The suite
# selects all 18 committed companion cases in the ordinary section 1401(c)
# domain, spanning zero/positive/loss SE income, joint aggregation, separate
# and "other" thresholds, and partial/full wage consumption.
#
# The combined final remains globally `not_comparable` in mappings/us.yaml:
# Axiom fail-closes when an international social-security agreement makes the
# ordinary-domain attestation false, while PE exposes no equivalent guard. The
# suite therefore excludes that one companion diagnostic rather than treating
# its deliberate $0 result as an engine divergence.
# Code: rulespec-us main@dcbae4344
# us/policies/income_tax/additional_medicare_tax_pipeline.yaml:105-141,
# 143-298,300-411.
#
# PolicyEngine binding decision: compare `additional_medicare_tax` directly.
# It is a TaxUnit Form 8959 total that applies the 0.9% rate to wages plus
# taxable self-employment income over the filing-status threshold. Algebraically
# that combined base equals Axiom's wage leg plus its wage-coordinated SE leg
# on the suite's explicitly attested ordinary domain.
# Code: policyengine-us@49d19b239a593dbac8920ac6fd80cfe33372343a
# policyengine_us/variables/gov/irs/tax/federal_income/
# additional_medicare_tax.py:4-19;
# policyengine_us/variables/gov/irs/tax/self_employment/
# taxable_self_employment_income.py:4-32.
#
# The exact suite stack is PolicyEngine 4.18.9, PE-US 1.767.3 and core 3.30.3:
# PE-US matches the conformance universe label and includes the 2026
# OBBBA-era parameters; this is the known-good Python 3.13 import pair.
#
# Run locally:
#   uv run python scripts/run_comparison.py us-additional-medicare-grid --summary

