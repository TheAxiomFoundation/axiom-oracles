# Federal Additional Medicare Tax — Axiom vs PolicyEngine-US, tax year 2026.
#
# Axiom boundary: this suite scores only the section 1401(b)(2) selected
# filing-status threshold and 0.9 percent rate. Twenty-seven scenarios span
# zero/positive/loss self-employment income, joint aggregation, separate and
# "other" thresholds, plus B-1/exact/B+1 wage-coordinated threshold probes.
#
# The combined money final remains `not_comparable` in mappings/us.yaml:
# Axiom fail-closes when an international social-security agreement makes the
# ordinary-domain attestation false, while PE exposes no equivalent guard. The
# bridge schema cannot express this domain precondition. The isolated wage and
# self-employment legs are also not comparable because PE exposes only its
# combined tax. Accordingly, no money output is scored here; money-level parity
# remains explicitly blocked until the registry can encode that precondition.
# Code: rulespec-us main@dcbae4344
# us/policies/income_tax/additional_medicare_tax_pipeline.yaml:105-141,
# 143-298,300-411.
#
# PolicyEngine binding decision: compare the selected Axiom threshold to
# `gov.irs.payroll.medicare.additional.exclusion` at the matching filing-status
# key for all 27 scenarios, and compare the Axiom rate once to
# `gov.irs.payroll.medicare.additional.rate`. Both are registry-comparable
# parameter mappings; no `additional_medicare_tax` variable is evaluated.
# Code: policyengine-us@49d19b239a593dbac8920ac6fd80cfe33372343a
# policyengine_us/parameters/gov/irs/payroll/medicare/additional/
# exclusion.yaml; rate.yaml.
#
# The exact suite stack is PolicyEngine 4.18.9, PE-US 1.767.3 and core 3.30.3:
# PE-US matches the conformance universe label and includes the 2026
# OBBBA-era parameters; this is the known-good Python 3.13 import pair.
#
# Run locally:
#   uv run python scripts/run_comparison.py us-additional-medicare-grid --summary

name: us-additional-medicare-grid
title: Federal Additional Medicare Tax — Axiom vs PolicyEngine
description: >-
  Compares only the registry-comparable Additional Medicare filing-status
  threshold and rate across 27 reviewed wage and self-employment scenarios.
  Money-level parity is blocked on the registry's section 1401(c)
  domain-precondition gap.

runner:
  type: federal-tax-liability-grid
  parameters:
    policy: additional_medicare_tax
    period: "2026"
    concept: >-
      us:policies/income_tax/additional_medicare_tax_pipeline#pipeline_additional_medicare_self_employment_threshold
    python: "3.13"
    policyengine_version: "4.18.9"
    policyengine_us_version: "1.767.3"
    policyengine_core_version: "3.30.3"
    rulespec_remote: https://github.com/TheAxiomFoundation/rulespec-us.git
    rulespec_roots:
      - /private/tmp/oracle-rerun/rulespec-us
    rulespec_upstream_sha: dcbae4344c522b4ad8004169316266cbc153186f
    rulespec_upstream_tree: 7ee3ca44edd11cdaaf5d074a6a2a6c32d2f25dfb

artifacts:
  report_basename: axiom-policyengine-us-additional-medicare-grid

dashboard:
  filename: axiom-policyengine-us-additional-medicare-grid.json
  suite: us-additional-medicare-grid
