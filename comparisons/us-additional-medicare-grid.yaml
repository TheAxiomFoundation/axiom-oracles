# Federal Additional Medicare Tax — Axiom vs PolicyEngine-US, tax year 2026.
#
# Axiom boundary: the RuleSpec composition combines the section 3101(b)(2)
# wage leg and section 1401(b)(2) self-employment leg after reducing the latter
# threshold by wages. Its runtime boundary relates the TaxUnit to Persons with
# GRID-CONTRACT gross self-employment profit and each Person's wages. The
# imported self-employment pipeline applies the section 1402(a)(12) 0.9235
# adjustment and section 1402(b) floor/exclusions before aggregating the
# completed income to TaxUnit. The generator validates those raw per-Person
# inputs case by case.
# Code: rulespec-us@613990fd
# us/policies/income_tax/additional_medicare_tax_pipeline.yaml:17-65,198-340;
# us/policies/income_tax/self_employment_tax_pipeline.yaml:96-231,347-385.
#
# PolicyEngine binding decision: compare `additional_medicare_tax` directly.
# It is a TaxUnit Form 8959 total that applies the 0.9% rate to combined gross
# wages and `taxable_self_employment_income` over the filing-status threshold,
# so it includes both the wage and SECA legs. PolicyEngine derives taxable SE
# income from Schedule C-style `self_employment_income`, including the 0.9235
# employer-share adjustment and $400 floor.
# Code: policyengine-us@49d19b239a593dbac8920ac6fd80cfe33372343a
# policyengine_us/variables/gov/irs/tax/federal_income/
# additional_medicare_tax.py:4-19;
# policyengine_us/variables/gov/irs/tax/self_employment/
# taxable_self_employment_income.py:4-32.
#
# The exact suite stack is PolicyEngine 4.18.9, PE-US 1.767.3 and core 3.30.3:
# PE-US matches the conformance universe label and includes the 2026
# OBBBA-era parameters; this is the known-good Python 3.13 import pair.
#
# Run locally:
#   uv run python scripts/run_comparison.py us-additional-medicare-grid --summary

name: us-additional-medicare-grid
title: Federal Additional Medicare Tax — Axiom vs PolicyEngine
description: >-
  Compares the combined wage and self-employment Additional Medicare Tax
  between Axiom and PolicyEngine-US on the six exact GRID-CONTRACT P1 cases.

runner:
  type: federal-tax-liability-grid
  parameters:
    policy: additional_medicare_tax
    period: "2026"
    concept: >-
      us:policies/income_tax/additional_medicare_tax_pipeline#federal_additional_medicare_tax
    python: "3.13"
    policyengine_version: "4.18.9"
    policyengine_us_version: "1.767.3"
    policyengine_core_version: "3.30.3"
    rulespec_remote: https://github.com/TheAxiomFoundation/rulespec-us.git
    rulespec_roots:
      - /private/tmp/oracle-rerun/rulespec-us

artifacts:
  report_basename: axiom-policyengine-us-additional-medicare-grid

dashboard:
  filename: axiom-policyengine-us-additional-medicare-grid.json
  suite: us-additional-medicare-grid
