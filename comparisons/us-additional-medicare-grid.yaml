  Compares Additional Medicare Tax only on the five exact wage-only,
  zero-self-employment GRID-CONTRACT P1 cases. SE leg pending the 26 CFR
  1.1401-1 operative-authority chain, axiom-corpus#523.

runner:
  type: federal-tax-liability-grid
  parameters:
    policy: additional_medicare_tax
    period: "2026"
    concept: >-
      us:policies/income_tax/additional_medicare_tax_pipeline#federal_additional_medicare_tax
    python: "3.13"
    policyengine_version: "4.18.9"
    policyengine_us_version: "1.767.3"
