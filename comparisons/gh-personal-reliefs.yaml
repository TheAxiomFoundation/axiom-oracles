name: gh-personal-reliefs
title: Ghana personal income-tax reliefs — Axiom vs GHAMOD
description: >-
  Compares the rulespec-gh Fifth Schedule personal reliefs (Income Tax Act 2015
  (Act 896) section 51 and Fifth Schedule, amounts as substituted by the Income
  Tax (Amendment) Act 2019 (Act 1007): dependent spouse or two-plus children
  1,200; disability 25% of assessable business/employment income; old age at 60+
  1,500; child education 600 per child capped at 3; aged dependant relative
  1,000 per relative capped at 2; training cost capped at 2,000) encoded in Axiom
  RuleSpec against GHAMOD's per-relief tinta0X_s outputs, one relief branch per
  case plus the two caps and a combined multi-relief household. GHAMOD is the
  SOUTHMOD tax-benefit model for Ghana (UNU-WIDER) on the EUROMOD engine
  (SOUTHMOD A4.0, country GH, system GH_2025). GHAMOD's tin_gh assigns each
  relief via household composition; each case builds the triggering household as
  euromod input rows and supplies the equivalent direct Axiom inputs. The
  amounts are frozen 2020-2026 (Act 1007), so GHAMOD GH_2024/GH_2025 apply the
  amounts the Axiom module validates for 2026. Branch mapping: old_age <->
  tinta03_s, disability <-> tinta07_s (25% of the engine's il_tintb3, bridged),
  child_education <-> tinta05_s, aged_dependant_relative <-> tinta06_s,
  dependant_spouse_or_children <-> tinta01_s (the dependent-spouse limb). All
  eight live cases match to the cedi. Two documented oracle gaps have no live
  case (nothing in GHAMOD to compare against): the training relief (Axiom
  min(cost, 2,000)) has no GHAMOD counterpart because tinta04 is switched off
  and emits no tinta04_s column at all, and GHAMOD's tinta02 lone-parent limb of
  Act 896 para 1(a) does not fire for synthetic lone-parent households; both are
  recorded in axiom_oracles/data/ghamod_issues.json, and the dependent-spouse
  limb is the parity case for that Axiom output. The SOUTHMOD
  bundle is licensed and non-redistributable: referenced only by env var / path
  (euromod_model_root); no model XML, dataset row, or DRD text is committed. This
  suite runs where the x64 EUROMOD runtime and the local SOUTHMOD bundle are
  available and is regenerated by scripts/regenerate_euromod_gh.sh; on runners
  without them it re-emits the committed dashboard report.

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: gh-personal-reliefs
    population: synthetic
    sample_size: 0
    period: 2026
    euromod_model_root: $HOME/.axiom/oracles/southmod/bundle/SOUTHMOD_A4.0
    euromod_country: GH
    euromod_system: GH_2025
    euromod_dataset: gh_2017_a8
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-gh-personal-reliefs.json

artifacts:
  report_basename: axiom-euromod-gh-personal-reliefs

dashboard:
  filename: axiom-euromod-gh-personal-reliefs.json
  suite: gh-personal-reliefs
