# Fuel duty: rulespec-uk HODA 1979 s.6 module vs PolicyEngine-UK at every month
# start from January 2025 to December 2028, one litre at a time, so each row is
# the per-litre duty in force that month.
#
# The Axiom side grounds the s.6(1A) standing rate (£0.5795) and subtracts the
# reduction in force on the date under the Excise Duties (Surcharges or Rebates)
# Act 1979 orders, read from the primary-source schedule in
# reference/uk-fuel-duty-schedule/schedule.yaml (SI 2022/365 as continued; SI
# 2026/164 arts. 3 and 8 as amended by SI 2026/555). Until rulespec-uk#349 encodes
# that schedule it is a primary-source input; the previous grid instead fed
# PolicyEngine's own effective rate into both engines, so it could never
# disagree.
#
# The oracle pin below is what the dispositions are bound to. PolicyEngine-UK
# 2.102.0 applies calendar-year averages of the superseded Budget 2025 schedule,
# dated 1 January (PolicyEngine-UK#1882, fixed by PR #1883), and from March
# 2027 forecast RPI uprating that no enacted instrument provides. When the fix
# merges, set policyengine_uk_version to the first release containing it,
# record the PR, merge commit and release under oracle_fixes, rerun, and
# rebuild the dispositions. The forecast RPI months are expected to stay
# divergent (statute governs).
#
# Run locally (needs the pinned PolicyEngine-UK, a built axiom rules engine and
# the rulespec-uk checkout):
#   uv run python scripts/run_comparison.py uk-fuel-duty
#   uv run python scripts/build_uk_fuel_duty_dispositions.py
#   uv run scripts/apply_dispositions.py

name: uk-fuel-duty
title: UK fuel duty dated schedule — Axiom vs PolicyEngine
description: >-
  Compares the encoded fuel duty module (rulespec-uk uk/policies/govuk/fuel-duty.yaml,
  Hydrocarbon Oil Duties Act 1979 s.6) against PolicyEngine-UK's monthly fuel_duty
  for one litre of petrol at each month start from January 2025 to December 2028,
  with the temporary reduction taken from the dated statutory schedule
  (reference/uk-fuel-duty-schedule), plus one rural-relief month a year with the
  relief rate supplied to both engines.
documentation: docs/uk-coverage-matrix.md

runner:
  type: uk-fuel-duty-grid
  parameters:
    period: "2025-01..2028-12"
    policyengine_uk_version: "2.102.0"
    rulespec_roots:
      - $HOME/TheAxiomFoundation/rulespec-uk

# Fixed PolicyEngine-UK releases, cited as the oracle once each fix merges.
oracle_fixes:
  - issue: https://github.com/PolicyEngine/policyengine-uk/issues/1882
    defect: fuel duty rates are calendar-year averages of an outdated schedule
    pr: https://github.com/PolicyEngine/policyengine-uk/pull/1883
    merge_commit: null
    first_release: null

artifacts:
  report_basename: axiom-policyengine-uk-fuel-duty

dashboard:
  filename: axiom-policyengine-uk-fuel-duty.json
  suite: uk-fuel-duty
