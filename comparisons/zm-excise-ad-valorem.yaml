name: zm-excise-ad-valorem
title: Zambia zm-excise-ad-valorem — Axiom vs MicroZAMOD
description: >-
  Compares the rulespec-zm act-2024-24 wine and spirits duties (60 percent:
  wine per Act 19 of 2018 Second Schedule heading 5, spirits per Act 45 of
  2021 heading 6) against MicroZAMOD tex02_s (ZM_2025, zm_2022_a2) on
  single-item expenditure cases, spirits on x02110 and wine on x02121 (COICOP
  02.1.1 and 02.1.2). No output column carries the uprated value of these
  items, so the Axiom input is the raw expenditure times the uprating factor
  ZM_2025 applies to them, 1.30287129078748, probed without the excise rate
  (tva_s / 0.16 - tex02_s on the spirits and wine rows; tva_s / 0.16 on the
  VAT-only opaque-beer expenditure row). A model rate other than 60% would
  mismatch; so would a future re-index, which would need the factor re-probed.
  Convention adopted for parity: MicroZAMOD charges the ad-valorem duty on
  household retail spend (and VAT on the excise-inclusive value), and Axiom is
  given that same uprated spend as the duty base, so the case tests the 60%
  rate on the model's base, not the statutory duty base. Each case supplies
  both module inputs (the other at zero) because the runner queries every
  suite output on every case. Findings outside the grid (rulespec-zm#1
  findings 3-5; the concepts have no concept mapping, so no live case compares
  them; ledger entries in microzamod_issues.json, re-probed 2026-10-04):
  cigarettes at K0.400 per piece, the CY2024 K400 per mille, vs K452 per mille
  under Act 24 of 2024 (480.00 vs 542.40 a year on 1,200 sticks); one fuel
  quantity at K2.07 per litre, the pre-2025 petrol row, vs petrol K2.34 and
  diesel K0.75 from 2025 (2,484.00 vs 2,808.00 or 900.00 a year on 1,200
  litres); clear-beer spend at a flat 20% vs the 60% statutory rate and the
  feedstock- and producer-specific suspended rates. Opaque beer (the July
  entry is retracted): the model charges the statutory K0.25 per litre on the
  opaque-beer quantity and no excise on opaque-beer spend, an agreement zone.
  Regenerated by scripts/regenerate_euromod_zm.sh where the x64 EUROMOD
  runtime and the local SOUTHMOD bundle are available. Results are based on
  the tax-benefit microsimulation model for Zambia (MicroZAMOD) in
  SOUTHMOD_A4.0, developed, maintained and managed by UNU-WIDER with SASPRI,
  the LSE International Inequalities Institute and local partners, run on the
  EUROMOD software (EM_Executable 1.0.0 via the euromod connector 0.2.18)
  under the zm_2022_a2 dataset configuration (Zambia Statistics Agency, Living
  Conditions Monitoring Survey 2022); only the dataset's variable list is read
  and every household is synthetic. The results and their interpretation are
  Axiom's responsibility. The SOUTHMOD bundle is licensed and
  non-redistributable: it is referenced only by path (euromod_model_root), and
  no model XML, dataset row, or DRD text is committed.

# Not runnable on the CI matrix runners. The SOUTHMOD bundle is licensed to
# Axiom by UNU-WIDER under the SOUTHMOD_A4.0 Adhesion Agreement, which bars
# providing the model or its input datasets to any third party (clause 4), so
# no shared runner can hold it; the runner also needs the x64 EUROMOD engine
# (EM_Executable.dll) under EUROMOD_PYTHON and a .NET runtime. Manual lane
# only: scripts/regenerate_euromod_zm.sh, where the licensed bundle and
# runtime exist, refreshes the committed report. This marker stays unless
# UNU-WIDER licenses a runner-held copy.
ci: manual

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: zm-excise-ad-valorem
    population: synthetic
    sample_size: 0
    period: 2025
    euromod_model_root: $HOME/.axiom/oracles/southmod/bundle/SOUTHMOD_A4.0
    euromod_country: ZM
    euromod_system: ZM_2025
    euromod_dataset: zm_2022_a2
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-zm-excise-ad-valorem.json

artifacts:
  report_basename: axiom-euromod-zm-excise-ad-valorem

dashboard:
  filename: axiom-euromod-zm-excise-ad-valorem.json
  suite: zm-excise-ad-valorem
