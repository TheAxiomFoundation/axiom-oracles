name: uk-benefit-cap-ukmod
title: UK benefit cap (Universal Credit reduction) — Axiom vs UKMOD
description: >-
  Compares the regulation-80A/81 benefit-cap reduction of the Universal Credit
  award encoded in the composed rulespec-uk pipeline
  (universal_credit_composed_award_pipeline: the regulation 80A applicable annual
  limits by claimant status, Greater-London residence, and responsibility for a
  child, divided to a monthly relevant amount, and the regulation 81 reduction of
  the section 8(1) award by the excess of total welfare benefits over that
  relevant amount, less any childcare element) against CeMPA's UKMOD brduc_s on a
  shared capped-household grid. UKMOD does not write the cap into its Universal
  Credit output bsauc_s — it reports the uncapped award and carries the cap
  effect in a separate benefit-unit output brduc_s (verified against
  UKMOD_PUBLIC_B2026.03: no bcap_uk function writes bsauc_s) — so the reduction is
  compared on its own, brduc_s against uc_pilot_benefit_cap_reduction, rather than
  through the award. The grid leads with single-no-child cases (the clean parity
  shape, where UKMOD's cap base il_bencap equals bsauc_s because child benefit is
  nil and the reduction matches the UC-only pilot base to a <= £0.17/month
  weekly-rounding residual), crossing the single cap on a social-rent sweep and a
  Greater-London (drgn1=8) case. The grid is deliberately single-no-child: a
  with-children unit would diverge because UKMOD's il_bencap sums bsauc_s + child
  benefit (bch_s) + other welfare while the single-benefit UC pilot base is
  UC-only, a known Axiom cap-base scope boundary documented on the bcap_uk
  conformance row rather than shipped as a failing case (it exposes only that
  scope limit, not a defect in the reg-80A/81 reduction the pilot encodes). Two
  nil-reduction cases pin the boundaries: an earnings-exempt single renter (UKMOD
  applies no cap above the earnings-exemption threshold; the pilot's
  uc_pilot_exempt_from_benefit_cap input carries the exemption) and a couple with
  no children whose UC award exceeds the couple limit but which matches neither
  UKMOD UC-cap branch (i_bcap_AmtCap covers only couple/lone-parent-with-child and
  single-no-child — a documented UKMOD structural exclusion). UKMOD runs the
  registration-free public model (UKMOD_PUBLIC_B2026.03, system UK_2026, dataset
  training_data). This suite runs where the x64 UKMOD runtime and model checkout
  are available and is regenerated by scripts/regenerate_euromod_uk.sh; on runners
  without them it re-emits the committed dashboard report.

runner:
  type: euromod-synthetic-compare
  axiom_binary: $HOME/TheAxiomFoundation/axiom-rules-engine/target/release/axiom-rules-engine
  parameters:
    suite: uk-benefit-cap
    population: synthetic
    sample_size: 0
    # The benefit-cap reduction is a deterministic regulation-80A/81 computation,
    # not a take-up draw: BTA_uk / random_uk are requested off so the compared
    # surface is the statutory reduction. UKMOD carries the UC cap in brduc_s
    # (BenCalc comp_cond=(bsauc_s>0), comp_perTU=i_bcap_AmtCap - i_wtcchild,
    # lowlim=0) and reports the uncapped bsauc_s; the reduction is monthly, as is
    # the Axiom uc_pilot_benefit_cap_reduction, so the comparison is monthly-to-
    # monthly (brduc_s is in the adapter's NON_ANNUALIZED_OUTPUTS).
    # The composed UC pipeline benefit-cap parameters are effective from
    # 2026-04-01 for assessment periods commencing on/after 6 April 2026, so the
    # Axiom side evaluates the 2026-27 fiscal-year vintage on the 6 April
    # boundary (the engine selects parameter versions by period.start; the #194
    # guard requires UK suites to start on/after 6 April 2026). UKMOD resolves the
    # policy year from euromod_system (UK_2026) and ignores the case period.
    period: 2026-04-06
    euromod_model_root: $HOME/Downloads/UKMOD_PUBLIC_B2026.03
    euromod_country: UK
    euromod_system: UK_2026
    euromod_dataset: training_data
    rulespec_root: $HOME/TheAxiomFoundation/rulespec-uk
    dashboard_filename: axiom-euromod-uk-benefit-cap.json

artifacts:
  report_basename: axiom-euromod-uk-benefit-cap

dashboard:
  filename: axiom-euromod-uk-benefit-cap.json
  suite: uk-benefit-cap
