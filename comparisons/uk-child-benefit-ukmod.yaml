name: uk-child-benefit-ukmod
title: UK Child Benefit — Axiom vs UKMOD
description: >-
  Compares the composed UK Child Benefit pipeline encoded in Axiom RuleSpec
  (Social Security Contributions and Benefits Act 1992 section 141 entitlement
  with the SI 2006/965 regulation 2 enhanced £27.05 and other £17.90 weekly
  rates, annualised over 52 benefit weeks) against CeMPA's UKMOD Child Benefit
  on a synthetic single-parent grid — one, two, and three children crossed with
  an earner-income sweep at 20k / 70k / 80k / 90k that straddles the High Income
  Child Benefit Charge taper. Axiom encodes the gross, pre-charge entitlement;
  the High Income Child Benefit Charge (ITEPA 2003 sections 681B-H) is not in
  the Axiom corpus (rulespec-uk#75), so the comparison bridges to UKMOD's
  pre-charge Child Benefit by summing the engine's paid Child Benefit bch_s and
  its separately-reported charge clawback bchrd_s (UKMOD policy bchrd_uk nets the
  clawback into bch_s). UKMOD annualises the weekly rate over 52.14 weeks against
  Axiom's 52, a systematic ~0.27% weeks-per-year convention residual absorbed by
  the concept's 0.3% relative tolerance (all 12 cases match to within the
  convention difference, which recovers the same statutory weekly rates on both
  sides). Child Benefit does not consume UKMOD's stochastic take-up draw, so the
  take-up correction cannot zero a hypothetical family's Child Benefit (verified;
  euromod_issues.json ukmod-cb-bch-no-takeup-gate). UKMOD runs the
  registration-free public model (UKMOD_PUBLIC_B2026.03, system UK_2026, dataset
  training_data). This suite runs where the x64 UKMOD runtime and model checkout
  are available and is regenerated by scripts/regenerate_euromod_uk.sh; on
  runners without them it re-emits the committed dashboard report.

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: uk-child-benefit
    population: synthetic
    sample_size: 0
    # Defensive batch isolation: the EUROMOD engine runs every case in one
    # run_cases invocation per comparison batch, so cases sharing a batch can
    # contaminate each other by position (a household can return a wrong value
    # at some batch positions but the correct value alone — the batch-position
    # adapter bug first isolated on be-study-allowance,
    # euromod-be-2025-bed-study-allowance-batch-position-contamination). This
    # instrument is deterministic — it carries no stochastic take-up draw, so
    # identical households return identical values regardless of batch size
    # (verified on representative suites: EUROMOD-left values are batch-
    # invariant, and N=10 identical households return one value). Batch size 1
    # is therefore neutral where uncontaminated and corrective where
    # contaminated. Remove once the adapter fix lands.
    comparison_batch_size: 1
    period: 2026
    euromod_model_root: $HOME/Downloads/UKMOD_PUBLIC_B2026.03
    euromod_country: UK
    euromod_system: UK_2026
    euromod_dataset: training_data
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-uk-child-benefit.json

artifacts:
  report_basename: axiom-euromod-uk-child-benefit

dashboard:
  filename: axiom-euromod-uk-child-benefit.json
  suite: uk-child-benefit
