name: gh-dispy
title: Ghana composed disposable income — Axiom vs GHAMOD
description: >-
  Compares the rulespec-gh composed single-employee pipeline
  (pilot_worker_disposable_income: Act 766 s.3(1) employee SSNIT, the s.112(2)
  deduction of that contribution from the income-tax base, the Act 1111 First
  Schedule bands, and disposable income = gross + benefits - tax -
  contribution) against GHAMOD ils_dispy. GHAMOD taxes gross employment income
  without the s.112(2) SSNIT deduction (finding #13,
  ghamod-tin-taxes-gross-employment-income-omitting-s112-deduction), so live
  cases sit at or below
  the 5,880 nil band, where both engines charge no tax and disposable income
  is 94.5% of gross. Live run: 2 cases (5,000 and 5,880 a year), 2
  comparisons, both exact (4,725.00 and 5,556.60). These cases exercise only
  the contribution and the nil band, so they add little beyond
  gh-ssnit-contributions; the taxed-zone divergence (60,000 gross: GHAMOD
  46,518 against the statutory 47,343) is recorded in ghamod_issues.json.
  Results are based on the tax-benefit microsimulation model for Ghana
  (GHAMOD) in SOUTHMOD_A4.0, developed, maintained and managed by UNU-WIDER
  with SASPRI, the LSE International Inequalities Institute and local
  partners, run on the EUROMOD software (EM_Executable 1.0.0 via the euromod
  connector 0.2.18) under the gh_2017_a8 dataset configuration (Ghana
  Statistical Service, Ghana Living Standards Survey Round 7, 2016-2017); only
  the dataset's variable list is read and every household is synthetic. The
  results and their interpretation are Axiom's responsibility. The SOUTHMOD
  bundle is licensed and non-redistributable: it is referenced only by path
  (euromod_model_root), and no model XML, dataset row, or DRD text is
  committed.

# Not runnable on the CI matrix runners. The SOUTHMOD bundle is licensed to
# Axiom by UNU-WIDER under the SOUTHMOD_A4.0 Adhesion Agreement, which bars
# providing the model or its input datasets to any third party (clause 4), so
# no shared runner can hold it; the runner also needs the x64 EUROMOD engine
# (EM_Executable.dll) under EUROMOD_PYTHON and a .NET runtime. Manual lane
# only: scripts/regenerate_euromod_gh.sh, where the licensed bundle and
# runtime exist, refreshes the committed report. This marker stays unless
# UNU-WIDER licenses a runner-held copy.
ci: manual

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: gh-dispy
    population: synthetic
    sample_size: 0
    # Ghana year of assessment 2026 (the rulespec-gh validation year). GHAMOD
    # resolves its policy year from euromod_system (GH_2025) and ignores the
    # case period.
    period: 2026
    euromod_model_root: $HOME/.axiom/oracles/southmod/bundle/SOUTHMOD_A4.0
    euromod_country: GH
    euromod_system: GH_2025
    euromod_dataset: gh_2017_a8
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-gh-dispy.json

artifacts:
  report_basename: axiom-euromod-gh-dispy

dashboard:
  filename: axiom-euromod-gh-dispy.json
  suite: gh-dispy
