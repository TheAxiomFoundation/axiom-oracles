# North Carolina SNAP -- Axiom vs PolicyEngine on Enhanced CPS.

name: nc-snap-ecps
title: North Carolina SNAP -- Axiom vs PolicyEngine
description: Compares North Carolina SNAP eligibility and benefit amount from
  the composed signed-manifest RuleSpec surface against PolicyEngine on the
  Enhanced CPS, filtered to North Carolina households.

# Not CI-runnable while engine-main x rulespec-us-main is broken: composed-root
# staging fails the engine's canonical-path scan (non-canonical filenames in
# us-la/us-nh/us-nj/us -- rulespec-us#1049) before any comparison runs;
# rulespec-us#1050 (removed plural corpus_citation_paths) and -- for the
# composed program lanes -- axiom-compose#29 and axiom-oracles#335 queue
# behind it. Manual lane only; drop this marker when the upstream chain lands
# (axiom-oracles#455 tracks the flip-back).
ci: manual

runner:
  type: axiom-oracles-compare
  axiom_rules_repo: $HOME/axiom-rules-engine
  parameters:
    # Loaded-case count overstates this suite (in-bridge filtering), so
    # the size heuristic under-persists; keep full per-case evidence.
    include_case_inputs: true
    left: axiom
    right: policyengine
    concepts:
      - us:statutes/7/2014/o#snap_eligible
      - us:statutes/7/2014/u#snap_benefit
    sample_size: 0
    period: 2026-01
    population: enhanced-cps
    python: "3.13"
    policyengine_version: "4.18.9"
    policyengine_us_version: "1.767.3"
    policyengine_core_version: "3.30.3"
    axiom_compose_binary: $HOME/axiom-compose/.venv/bin/axiom-compose
    axiom_program: $HOME/rulespec-us/programs/us-nc/snap/fy-2026.yaml
    axiom_composed_program: /tmp/nc-snap-composed.yaml
    axiom_compiled_program: /tmp/nc-snap-compiled.json
    axiom_rulespec_repo_roots: $HOME
    rulespec_roots:
      - $HOME/rulespec-us
    jurisdiction_fips: "37"

artifacts:
  report_basename: axiom-policyengine-nc-snap-ecps

dashboard:
  filename: axiom-policyengine-nc-snap-ecps.json
  suite: nc-snap-ecps
