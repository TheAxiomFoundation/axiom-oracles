name: ar-income-tax-liability
title: Arkansas income tax liability — Axiom vs PolicyEngine and TAXSIM
description: >-
  Compares the composed Arkansas ordinary resident wage-earner income-tax
  pipeline in Axiom RuleSpec against PolicyEngine
  (ar_income_tax_before_non_refundable_credits_unit) at 2026 and TAXSIM
  (siitax) at its latest supported law year, 2024, on the standard six-case
  grid.

runner:
  type: state-income-tax-liability-grid
  parameters:
    state: AR
    period: "2026"
    taxsim_law_year: 2024
    rulespec_roots:
      - $HOME/TheAxiomFoundation/rulespec-us

artifacts:
  report_basename: axiom-policyengine-taxsim-ar-income-tax-liability

dashboard:
  filename: axiom-policyengine-taxsim-ar-income-tax-liability.json
  suite: ar-income-tax-liability
