name: uk-child-winter-heating-payment-ukmod
title: UK Child Winter Heating Payment — Axiom vs UKMOD
description: >-
  Compares the Child Winter Heating Payment encoded in Axiom RuleSpec (rulespec-uk
  uk/policies/govuk/child-winter-heating-payment, the Winter Heating Assistance
  for Children and Young People (Scotland) Regulations 2020 (SSI 2020/352): the
  flat GBP 265.50/year statutory payable value) against CeMPA's UKMOD bchht_s on a
  disabled-child Scotland benefit unit. The case is a lone parent in Scotland
  (drgn1=12) with a severely disabled child whose disability input carries the
  high-rate care passport (bdisc), so UKMOD's bchht_uk pays the Child Winter
  Heating Payment. The payment is defined as a flat annual amount on both engines
  (no weekly annualisation), so the values match exactly at 265.50. UKMOD take-up
  is disabled through euromod_policy_switch_overrides (BTA_uk / random_uk = false)
  so the payment fires deterministically. UKMOD runs the registration-free public
  model (UKMOD_PUBLIC_B2026.03, system UK_2026, dataset training_data). This suite
  runs where the x64 UKMOD runtime and model checkout are available and is
  regenerated by scripts/regenerate_euromod_uk.sh; on runners without them it
  re-emits the committed dashboard report.

# Not runnable on the CI matrix runners. The EUROMOD-platform runner needs
# UKMOD's x64 engine (EM_Executable.dll), the euromod connector under
# EUROMOD_PYTHON, a .NET runtime and the model checkout; the 6-hourly affected
# rerun and the weekly matrix provide none of them, so there run_comparison.py
# can only re-emit the committed report. For this lane the affected rerun
# committed those re-emissions, first over the real runs and then over each
# other on every sweep. Manual lane only: scripts/regenerate_euromod_uk.sh (or
# a supervised run_comparison.py run) where the model and runtime exist
# refreshes the committed report. Drop this marker only once a workflow
# provisions the model and runtime.
ci: manual

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: uk-child-winter-heating-payment
    population: synthetic
    sample_size: 0
    period: 2026-04-06
    euromod_model_root: $HOME/Downloads/UKMOD_PUBLIC_B2026.03
    euromod_country: UK
    euromod_system: UK_2026
    euromod_dataset: training_data
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-uk-child-winter-heating-payment.json

artifacts:
  report_basename: axiom-euromod-uk-child-winter-heating-payment

dashboard:
  filename: axiom-euromod-uk-child-winter-heating-payment.json
  suite: uk-child-winter-heating-payment
