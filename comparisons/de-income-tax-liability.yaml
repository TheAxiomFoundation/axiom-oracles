# Delaware section 1102 schedule tax — Axiom pipeline vs PolicyEngine and TAXSIM
# on a modest case grid. The Axiom side is the composed rulespec-us pipeline
# us-de/policies/income_tax/pilot_liability_pipeline, evaluated through the
# axiom rules engine (its liabilities are the engine-verified companion-test
# fixtures).
#
# PolicyEngine runs at the 2026 validation year. TAXSIM runs at its latest
# supported law year (2024) because the pinned binary abandons 2026; the
# 2024-to-2026 vintage is recorded in dispositions/de-income-tax-liability.yaml
# rather than absorbed by tolerance.
#
# Run locally:
#   uv run python scripts/run_comparison.py de-income-tax-liability

name: de-income-tax-liability
title: Delaware income tax liability — Axiom vs PolicyEngine and TAXSIM
description: >-
  Compares the Delaware section 1102(a)(14) schedule and strict separate-versus-
  combined branch selection encoded in Axiom RuleSpec against PolicyEngine
  (de_income_tax_before_non_refundable_credits_unit) at 2026 and TAXSIM (siitax)
  at 2024 on a modest grid. Nonrefundable and refundable credits are outside the
  Axiom/PolicyEngine core compared here.

runner:
  type: state-income-tax-liability-grid
  parameters:
    state: DE
    period: "2026"
    taxsim_law_year: 2024
    # Links this suite to the rulespec-us monorepo in the affected map
    # so a change to the composed pipeline triggers a re-run.
    rulespec_roots:
      - $HOME/TheAxiomFoundation/rulespec-us

artifacts:
  report_basename: axiom-policyengine-taxsim-de-income-tax-liability

dashboard:
  filename: axiom-policyengine-taxsim-de-income-tax-liability.json
  suite: de-income-tax-liability
