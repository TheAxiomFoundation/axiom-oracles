name: be-pensioner-contributions
title: Belgium pensioner health/disability + solidarity contribution — Axiom vs EUROMOD
description: >-
  Compares the combined pensioner social-insurance withholding encoded in Axiom
  RuleSpec (Law of 14 July 1994 article 191 health-insurance 3.55% + Law of 30
  March 1994 article 68 pension solidarity, composed into an annual total) against
  EUROMOD Belgium tscpe_s ("SIC: pensioners contributions to health and disability
  insurance and solidarity contribution", switch on in BE_2025). A single
  old-age pensioner's annual gross legal pension is swept across the EUROMOD
  BE_2025 thresholds: the article 191 health floor (2037.73/2112.71 per month)
  and the isolated article 68 solidarity brackets (3225.74/3325.48/3572.77/3610
  per month). Single-pensioner old-age-only households neutralize the EUROMOD
  individual-vs-rulespec-Family entity difference and the poa+psu-vs-full-pension
  scope difference. The suite matches EUROMOD exactly across every case (6/6)
  since rulespec-be#89 encoded the article 191 low-pension health floor and
  carried the indexed 2025 article 68 solidarity thresholds, both grounded in the
  Service federal des Pensions 2025 withholding tables; the earlier residuals that
  were dispositioned as axiom encoding gaps have cleared. EUROMOD runs the
  registration-free public model
  (EUROMOD_RELEASES_J2.0+, system BE_2025) under the real dataset-configuration
  name BE_2024_c1_2015_03_e2 with rows templated from BE_training_data; pension
  income is carried at face value (poa is not uprated), so no yem bridge applies.
  Runs where the x64 EUROMOD runtime and model checkout are available; otherwise
  the registry re-emits the committed dashboard report.

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: be-pensioner-contributions
    population: synthetic
    sample_size: 0
    period: 2025
    euromod_model_root: $HOME/Downloads/EUROMOD_J2.0/EUROMOD_RELEASES_J2.0+
    euromod_country: BE
    euromod_system: BE_2025
    euromod_dataset: BE_2024_c1_2015_03_e2
    euromod_template_dataset: BE_training_data
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-be-pensioner-contributions.json

artifacts:
  report_basename: axiom-euromod-be-pensioner-contributions

dashboard:
  filename: axiom-euromod-be-pensioner-contributions.json
  suite: be-pensioner-contributions
