# Arizona Cash Assistance (TANF) -- Axiom vs PolicyEngine on Enhanced CPS.

name: az-tanf-ecps
title: Arizona Cash Assistance -- Axiom vs PolicyEngine
description: >-
  Compares the monthly Arizona Cash Assistance benefit from the composed
  us-az/tanf program (DES FAA5 A1/A2 payment standards expressed against
  the 1992 base-year FPL, needy-family test, $90-per-earner plus 30%
  earned income deductions) against PolicyEngine's az_tanf on Enhanced
  CPS households in Arizona.

runner:
  type: axiom-oracles-compare
  axiom_binary: $HOME/TheAxiomFoundation/axiom-rules-engine/target/release/axiom-rules-engine
  parameters:
    left: axiom
    right: policyengine
    suite: az-tanf-ecps
    concepts:
      - us-az:policies/des/faa5#az_tanf_benefit
    sample_size: 0
    period: 2026-01
    population: enhanced-cps
    jurisdiction_fips: "04"
    axiom_compose_binary: $HOME/TheAxiomFoundation/axiom-compose/.venv/bin/axiom-compose
    axiom_program: $HOME/TheAxiomFoundation/rulespec-us/us-az/programs/tanf/fy-2026.yaml
    axiom_composed_program: /tmp/axiom-composed/az-tanf-ecps.yaml
    axiom_compiled_program: /tmp/az-tanf-compiled.json
    rulespec_root: $HOME/TheAxiomFoundation/rulespec-us

artifacts:
  report_basename: axiom-policyengine-az-tanf-ecps

dashboard:
  filename: axiom-policyengine-az-tanf-ecps.json
  suite: az-tanf-ecps
