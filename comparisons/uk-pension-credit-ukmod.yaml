name: uk-pension-credit-ukmod
title: UK Pension Credit — Axiom vs UKMOD
description: >-
  Compares the composed household Pension Credit guarantee-credit award pipeline
  encoded in Axiom RuleSpec (rulespec-uk pension_credit_composed_award_pipeline:
  State Pension Credit Act 2002 section 2 guarantee credit with the State
  Pension Credit Regulations 2002 regulation 6 standard-minimum-guarantee and
  additional-amount stage boundaries, wired from hypothetical pensioner facts)
  against CeMPA's UKMOD boamt_s on a shared pensioner grid: single and couple,
  an assessable-state-pension sweep crossing the guarantee level, and the state-
  pension-age boundary. Pension Credit is a benefit-unit means-tested award, so
  each case is an explicit UKMOD household (responsible adult carrying dhr;
  partners linked through idpartner). UKMOD simulates Pension Credit (boamt_s =
  guarantee credit boamtmm_s + savings credit boamtxp_s, computed inside the
  bsa_uk policy); the state pension is not simulated (the boact_uk policy only
  uprates the boact00 state-pension data input), so the state pension enters as
  a data input and Pension Credit is the parity target. The income test assesses
  the state pension boact_s (uprated from boact00), which the suite bridges into
  the pipeline's weekly assessable-income input so both engines test the
  identical income. UKMOD boamt_s is monthly and the pipeline award is weekly
  (the native period of the regulation 6 amounts, so every value is a grounded
  weekly statutory rate); the adapter divides boamt_s by UKMOD's weekly-to-
  monthly factor (365/7/12) so the comparison is weekly-to-weekly. The standard
  minimum guarantee matches to the penny (single 238.00/week = 1034.17/month,
  couple 363.25/week = 1578.41/month). UKMOD boamt_s embeds a take-up /
  Universal-Credit-transition correction that can zero the reported award for a
  hypothetical benefit unit away from the entitlement (documented in
  axiom_oracles/data/euromod_issues.json as ukmod-pc-boamt-takeup-transition);
  the paid cases return clean guarantee-credit entitlements that match the Axiom
  award, while the transition-zeroed points are classified as UKMOD-side
  artefacts rather than Axiom encoding mismatches. Savings credit (boamtxp_s)
  is simulated but returns nil on the demo data (ukmod-pc-savings-credit-nil-on-
  demo-data), so the compared total boamt_s equals its guarantee-credit
  component here. UKMOD runs the registration-free public model
  (UKMOD_PUBLIC_B2026.03, system UK_2026, dataset training_data). This suite
  runs where the x64 UKMOD runtime and model checkout are available and is
  regenerated by scripts/regenerate_euromod_uk.sh; on runners without them it
  re-emits the committed dashboard report.

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: uk-pension-credit
    population: synthetic
    sample_size: 0
    # NB: comparison_batch_size is intentionally NOT pinned to 1 here. UKMOD's
    # Pension Credit output boamt_s carries a STOCHASTIC per-row take-up /
    # UC-transition draw (i_rand_tu), and at batch size 1 this suite is
    # DEGENERATE: an isolated pensioner always draws non-take, so every case —
    # including a zero-income pensioner entitled to the full 238.00/week —
    # returns 0.0 (verified). The awards only appear in multi-household batches,
    # and identical households then receive different awards by position
    # (income0 x10 in one run -> [0,238,0,0,238,0,0,238,238,238]). The committed
    # report is therefore one realization, with the take-up zeros dispositioned
    # (euromod_issues.json#ukmod-pc-boamt-takeup-transition). A future adapter
    # fix that forces 100% take-up would make this suite deterministic.
    # The composed Pension Credit pipeline parameters are effective from
    # 2026-04-01, so the Axiom side evaluates in the April 2026 period. UKMOD
    # resolves the policy year from euromod_system (UK_2026) and ignores the
    # case period.
    period: 2026-04
    euromod_model_root: $HOME/Downloads/UKMOD_PUBLIC_B2026.03
    euromod_country: UK
    euromod_system: UK_2026
    euromod_dataset: training_data
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-uk-pension-credit.json

artifacts:
  report_basename: axiom-euromod-uk-pension-credit

dashboard:
  filename: axiom-euromod-uk-pension-credit.json
  suite: uk-pension-credit
