# New York SNAP / Food Assistance -- Axiom vs PolicyEngine on Enhanced CPS.

name: ny-snap-ecps
title: New York SNAP -- Axiom vs PolicyEngine
description: Compares New York SNAP eligibility and benefit amount from the
  composed axiom-programs/us-ny/snap/fy-2026 spec against PolicyEngine on the
  Enhanced CPS, filtered to New York households.

runner:
  type: axiom-oracles-compare
  axiom_rules_repo: $HOME/axiom-rules-engine
  parameters:
    left: axiom
    right: policyengine
    concepts:
      - us:statutes/7/2014/o#snap_eligible
      - us:statutes/7/2014/u#snap_benefit
    sample_size: 0
    period: 2026-01
    population: enhanced-cps
    axiom_compose_binary: $HOME/axiom-compose/.venv/bin/axiom-compose
    axiom_program: /private/tmp/claude-501/-Users-pavelmakarchuk-axiom-oracles/015608b8-312a-41d9-8436-5777e8ebcbe4/scratchpad/rulespec-clean/rulespec-us/programs/us-ny/snap/fy-2026.yaml
    axiom_composed_program: /tmp/ny-snap-composed.yaml
    axiom_compiled_program: /tmp/ny-snap-compiled.json
    axiom_rulespec_repo_roots: /private/tmp/claude-501/-Users-pavelmakarchuk-axiom-oracles/015608b8-312a-41d9-8436-5777e8ebcbe4/scratchpad/rulespec-clean
    rulespec_roots:
      - /private/tmp/claude-501/-Users-pavelmakarchuk-axiom-oracles/015608b8-312a-41d9-8436-5777e8ebcbe4/scratchpad/rulespec-clean/rulespec-us
    jurisdiction_fips: "36"

artifacts:
  report_basename: axiom-policyengine-ny-snap-ecps

dashboard:
  filename: axiom-policyengine-ny-snap-ecps.json
  suite: ny-snap-ecps
