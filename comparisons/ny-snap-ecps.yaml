# New York SNAP eligibility and benefit amount — Axiom vs PolicyEngine on the
# the certified Populace US artifact. This comparison uses the encode-backed SNAP Populace harness so the
# dashboard is generated from the same jurisdiction program projection used for
# oracle parity work.

name: ny-snap-ecps
title: New York SNAP — Axiom vs PolicyEngine
description: Compares New York SNAP eligibility produced by the composed
  rulespec-us/us-ny/programs/snap/fy-2026 spec against PolicyEngine on the
  the certified Populace US artifact, filtered to New York households.

runner:
  type: axiom-encode-snap-populace-compare
  axiom_encode_repo: $HOME/axiom-encode
  axiom_binary: $HOME/TheAxiomFoundation/axiom-rules-engine/target/release/axiom-rules-engine
  rulespec_root: $HOME/TheAxiomFoundation/rulespec-us
  parameters:
    jurisdiction: us-ny
    sample_size: 0
    year: 2026
    month: 1
    utility_projection: policyengine-type
    tolerance: 1.5

artifacts:
  report_basename: axiom-policyengine-ny-snap-ecps

dashboard:
  filename: axiom-policyengine-ny-snap-ecps.json
  suite: ny-snap-ecps
