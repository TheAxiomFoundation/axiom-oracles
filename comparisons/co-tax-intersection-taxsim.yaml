# Every Axiom/TAXSIM shared tax concept — Axiom vs NBER TAXSIM on Enhanced CPS.
#
# The full axiom<->taxsim concept intersection in one lane: the nine federal
# concepts (liability, standard deduction, taxable income, tax before credits,
# EITC, CTC, CDCC, AMT, employee-side FICA+SECA) plus Colorado state income
# tax, all served by the composed oracle-bridge program and compared against
# the pinned TAXSIM-35 binary's idtl=2 decomposition at the 2026 law year.
# Population is the certified Colorado Enhanced CPS slice — the oracle
# bridge's SALT itemization leg is Colorado-scoped, so the federal concepts
# run over the same jurisdiction as the state leg.
#
# Known TAXSIM-side gap (docs/policyengine-taxsim.md): the pinned binary's
# 2026 law year does not model the qualifying-child credit machinery — CTC
# collapses to the $500 ODC path and ACTC/CDCC/EITC-with-children return
# zero — so child-credit residuals on units with children read as NBER gaps,
# not Axiom defects.
#
# Known Axiom-side scope carve-out: the composed program excludes
# us:statutes/26/1411 (NIIT) until the upstream duplicate-rule encoding is
# fixed (axiom-encode#1213: 911/a and 911/a/1 both define
# foreign_earned_income_excluded_from_gross_income; see
# _tax_oracle_imports_for_concepts in axiom_oracles/cli.py). TAXSIM's fiitax
# includes NIIT, so units above the 1411 thresholds carry a liability
# residual equal to TAXSIM's own `niit` output column.
#
# Residual bookkeeping: the mechanically verified classes are dispositioned
# in dispositions/co-tax-intersection-taxsim.yaml (TAXSIM 2026 child-credit
# gap, 63(f) aged/blind increments, uncapped-OASDI encoding gap
# axiom-encode#1214, composite liability rows). The four classes still
# fingerprinted but not pinned — AMT axiom-high with capital gains, SECA
# drift, the tax-before-credits continuum, taxable income — are tracked
# with pull-one-case instructions in axiom-oracles#304 and stay raw here
# on purpose.

name: co-tax-intersection-taxsim
title: Shared tax concepts — Axiom vs TAXSIM
description: >-
  Compares every concept mapped for both Axiom and TAXSIM — federal income
  tax liability, standard deduction, taxable income, tax before credits,
  EITC, CTC, CDCC, AMT, employee-side FICA+SECA, and Colorado state income
  tax — over Colorado Enhanced CPS tax units at the 2026 law year.

# Not CI-runnable while engine-main x rulespec-us-main is broken: composed-root
# staging fails the engine's canonical-path scan (non-canonical filenames in
# us-la/us-nh/us-nj/us -- rulespec-us#1049) before any comparison runs;
# rulespec-us#1050 (removed plural corpus_citation_paths) and -- for the
# composed program lanes -- axiom-compose#29 and axiom-oracles#335 queue
# behind it. Manual lane only; drop this marker when the upstream chain lands
# (axiom-oracles#455 tracks the flip-back).
ci: manual

runner:
  type: axiom-oracles-compare
  # Pinned to the exact stack in this suite's last good provenance (engine
  # 0.1.0 @ 0c39023e, rulespec-us @ ca2d424f): engine main rejects the
  # current tree (#1049/#1050) and current rulespec-us main carries a
  # cyclic derived dependency in the federal credits/AMT web (2026-08-23
  # smoke). Re-point at $HOME/axiom-rules + $HOME when the upstream chain
  # lands (axiom-oracles#455).
  axiom_rules_repo: $HOME/axiom-rules-engine-0c39023e
  parameters:
    left: axiom
    right: taxsim
    population: enhanced-cps
    # 0 = full population: sampling happens before the Colorado preparation
    # filter, so a small national sample can leave zero Colorado units.
    sample_size: 0
    period: "2026"
    suite: co-tax-intersection-taxsim
    concepts:
      - us:tax/federal-income-tax#liability
      - us:tax/federal-income-tax#standard_deduction
      - us:tax/federal-income-tax#taxable_income
      - us:tax/federal-income-tax#tax_before_credits
      - us:tax/federal-income-tax#eitc
      - us:tax/federal-income-tax#ctc
      - us:tax/federal-income-tax#cdcc
      - us:tax/federal-income-tax#amt
      - us:tax/payroll#employee_fica
      - us:tax/state-income-tax#liability
    # Pinned rulespec-us snapshot — see the engine pin note above.
    axiom_rulespec_repo_roots: $HOME/oracle-pins

artifacts:
  report_basename: axiom-taxsim-co-tax-intersection-ecps

dashboard:
  filename: axiom-taxsim-co-tax-intersection-ecps.json
  suite: co-tax-intersection-taxsim
  # Persist every mismatch row in the committed dashboard copy. The triage
  # pipeline reads this copy, and the default 1,000-row cap left 438 of the
  # suite's unexplained rows physically untriageable (axiom-oracles#439) —
  # two binary-verified mechanisms (TAXSIM auto-HoH for mstat=1+depx,
  # auto-itemized state income tax) could not even be enrolled because
  # their rows sat past the cap. Headroom above the current 2,300 total
  # keeps the next regeneration's rows visible too.
  max_mismatches: 4000
