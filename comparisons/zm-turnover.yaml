name: zm-turnover
title: Zambia zm-turnover — Axiom vs MicroZAMOD
description: >-
  Compares the rulespec-zm Act 22 of 2024 turnover-tax rows (Ninth
  Schedule Part II: 0% at or below K12,000; 5% above K12,000 up to
  K5,000,000, slab on the whole turnover; s.64A ceiling of five
  million kwacha) against MicroZAMOD ttn_s (ZM_2025, zm_2022_a2) with
  the engine's post-uprating ytn bridged onto the module input. Live
  cases sit in the agreement zone (above 12,000, below 5,000,000).
  Dispositions (rulespec-zm#1 candidate findings 2a/2b, probed live):
  the model taxes from the first kwacha (ytn 10,000 -> 500.00; ytn
  12,000 -> 600.00; statutory row prescribes 0 percent at or below
  K12,000) and uses a strict bound at the ceiling (ytn exactly
  5,000,000 -> 0; s.64A(2) reads "five million kwacha or less" ->
  250,000). The SOUTHMOD bundle is licensed and non-redistributable;
  referenced only by path.

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: zm-turnover
    population: synthetic
    sample_size: 0
    period: 2025
    euromod_model_root: $HOME/.axiom/oracles/southmod/bundle/SOUTHMOD_A4.0
    euromod_country: ZM
    euromod_system: ZM_2025
    euromod_dataset: zm_2022_a2
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-zm-turnover.json

artifacts:
  report_basename: axiom-euromod-zm-turnover

dashboard:
  filename: axiom-euromod-zm-turnover.json
  suite: zm-turnover
