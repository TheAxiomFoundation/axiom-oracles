name: or-income-tax-liability
title: Oregon income tax liability — Axiom vs PolicyEngine and TAXSIM
description: >-
  Compares the composed Oregon resident wage-earner income-tax pipeline in
  Axiom RuleSpec against PolicyEngine (or_income_tax_before_credits) at 2026 and TAXSIM
  (siitax) at 2026 on the standard six-case grid.

runner:
  type: state-income-tax-liability-grid
  parameters:
    state: OR
    period: "2026"
    taxsim_law_year: 2026
    rulespec_roots:
      - $HOME/TheAxiomFoundation/rulespec-us

artifacts:
  report_basename: axiom-policyengine-taxsim-or-income-tax-liability

dashboard:
  filename: axiom-policyengine-taxsim-or-income-tax-liability.json
  suite: or-income-tax-liability
