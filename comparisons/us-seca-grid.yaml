# Federal ordinary self-employment tax — Axiom vs PolicyEngine-US, 2026.
#
# Axiom boundary: each Person supplies completed section 1402(a) net
# trade/business profit before paragraph (12), despite the historical runtime
# key's `gross_` label. The composition applies the 0.9235 adjustment, $400
# floor, 2026 $184,500 OASDI base and wage coordination, then sums per-person
# OASDI plus ordinary 2.9% hospital-insurance tax to TaxUnit. It explicitly
# excludes section 1401(b)(2)'s 0.9% Additional Medicare Tax.
# Code: rulespec-us@a1aa8c35
# us/policies/income_tax/self_employment_tax_pipeline.yaml:17-41,92-179,
# 250-345.
#
# PolicyEngine binding decision: compare the Person-grain
# `self_employment_tax`, summed across the TaxUnit's people. Its formula adds
# only `self_employment_social_security_tax` and
# `self_employment_medicare_tax`, so it has the same ordinary-SECA boundary and
# excludes Additional Medicare. PolicyEngine derives taxable SE income from
# Schedule C-style `self_employment_income`, applies the employer-share
# adjustment and floor, and coordinates the OASDI base with wages.
# Code: policyengine-us@49d19b239a593dbac8920ac6fd80cfe33372343a
# policyengine_us/variables/gov/irs/tax/self_employment/
# self_employment_tax.py:4-20;
# .../taxable_self_employment_income.py:4-32.
#
# The exact suite stack is PolicyEngine 4.18.9, PE-US 1.767.3 and core 3.30.3:
# PE-US matches the conformance universe label and includes the 2026
# OBBBA-era parameters; this is the known-good Python 3.13 import pair.
#
# Run locally:
#   uv run python scripts/run_comparison.py us-seca-grid --summary

name: us-seca-grid
title: Federal self-employment tax — Axiom vs PolicyEngine
description: >-
  Compares ordinary federal SECA, excluding Additional Medicare Tax, between
  Axiom and PolicyEngine-US on the six exact GRID-CONTRACT P2 cases.

runner:
  type: federal-tax-liability-grid
  parameters:
    policy: self_employment_tax
    period: "2026"
    concept: >-
      us:policies/income_tax/self_employment_tax_pipeline#federal_self_employment_tax
    python: "3.13"
    policyengine_version: "4.18.9"
    policyengine_us_version: "1.767.3"
    policyengine_core_version: "3.30.3"
    rulespec_remote: https://github.com/TheAxiomFoundation/rulespec-us.git
    rulespec_roots:
      - $HOME/TheAxiomFoundation/rulespec-us
    rulespec_upstream_sha: 3373e8411f7e141fd50879e3de964386f606f7f6
    rulespec_upstream_tree: 7e00f195ea81ff9aa21c58d53151e937d974a016

artifacts:
