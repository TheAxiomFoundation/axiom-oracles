name: zm-paye-rate-schedule
title: Zambia zm-paye-rate-schedule — Axiom vs MicroZAMOD
description: >-
  Compares the rulespec-zm Act 22 of 2023 Charging Schedule paragraph 2(1)
  individual rates (0 to 61,200; 20% to 85,200; 30% to 110,400; 37% above)
  against MicroZAMOD tin_s (SOUTHMOD A4.0, country ZM, system ZM_2025 =
  CY2025, dataset zm_2022_a2). The engine's own post-deduction taxable base
  (ttb_s) is bridged onto the module's individual_income input, so the live
  cases verify the schedule arithmetic on the model's base, not the base
  itself. Base question (rulespec-zm#1 CANDIDATE finding 1, a ledger entry in
  microzamod_issues.json): the model's base is net of the employee NAPSA and
  NHIMA contributions (probed: ttb_s = yem - tsceepi_s - tsceehl_s). Act 22 of
  2024 s.4 replaces Income Tax Act s.37(1) with an employer-only deduction for
  approved-fund contributions, and the captured NHI instruments carry no
  deductibility provision, but the rest of s.37 and Cap. 323 are not captured,
  so the absence of an employee deduction in CY2025 is an inference. Magnitude
  if it holds (probed 2026-10-04): tin_s 114,098.87 at 409,968 gross vs
  123,200.16 from the schedule on gross, 9,101.29/yr. Regenerated by
  scripts/regenerate_euromod_zm.sh where the x64 EUROMOD runtime and the local
  SOUTHMOD bundle are available. Results are based on the tax-benefit
  microsimulation model for Zambia (MicroZAMOD) in SOUTHMOD_A4.0, developed,
  maintained and managed by UNU-WIDER with SASPRI, the LSE International
  Inequalities Institute and local partners, run on the EUROMOD software
  (EM_Executable 1.0.0 via the euromod connector 0.2.18) under the zm_2022_a2
  dataset configuration (Zambia Statistics Agency, Living Conditions
  Monitoring Survey 2022); only the dataset's variable list is read and every
  household is synthetic. The results and their interpretation are Axiom's
  responsibility. The SOUTHMOD bundle is licensed and non-redistributable: it
  is referenced only by path (euromod_model_root), and no model XML, dataset
  row, or DRD text is committed.

# Not runnable on the CI matrix runners. The SOUTHMOD bundle is licensed to
# Axiom by UNU-WIDER under the SOUTHMOD_A4.0 Adhesion Agreement, which bars
# providing the model or its input datasets to any third party (clause 4), so
# no shared runner can hold it; the runner also needs the x64 EUROMOD engine
# (EM_Executable.dll) under EUROMOD_PYTHON and a .NET runtime. Manual lane
# only: scripts/regenerate_euromod_zm.sh, where the licensed bundle and
# runtime exist, refreshes the committed report. This marker stays unless
# UNU-WIDER licenses a runner-held copy.
ci: manual

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: zm-paye-rate-schedule
    population: synthetic
    sample_size: 0
    period: 2025
    euromod_model_root: $HOME/.axiom/oracles/southmod/bundle/SOUTHMOD_A4.0
    euromod_country: ZM
    euromod_system: ZM_2025
    euromod_dataset: zm_2022_a2
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-zm-paye-rate-schedule.json

artifacts:
  report_basename: axiom-euromod-zm-paye-rate-schedule

dashboard:
  filename: axiom-euromod-zm-paye-rate-schedule.json
  suite: zm-paye-rate-schedule
