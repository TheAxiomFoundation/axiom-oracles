name: or-snap-ecps
title: Oregon SNAP -- Axiom vs PolicyEngine
description: >-
  Compares Oregon SNAP eligibility and benefit amount produced by the
  RuleSpec composition against PolicyEngine on the Enhanced CPS, filtered to
  Oregon households.

# Not CI-runnable (#296): the encoder's snap-populace-compare harness has no
# us-or jurisdiction config (bridges/snap_populace.py JURISDICTION_CONFIGS
# covers az/ca/co/ga/md/ny/tx) — every dispatched leg fails on
# `--jurisdiction: invalid choice`. Manual lane only until the harness grows
# an Oregon config (#336); drop this marker when it does.
ci: manual

runner:
  type: axiom-encode-snap-ecps-compare
  axiom_encode_repo: $HOME/axiom-encode
  axiom_rules_repo: $HOME/axiom-rules-engine
  parameters:
    jurisdiction: us-or
    sample_size: 0
    year: 2026
    month: 1
    utility_projection: policyengine-type
    tolerance: 1.5

artifacts:
  report_basename: axiom-policyengine-or-snap-ecps

dashboard:
  filename: axiom-policyengine-or-snap-ecps.json
  suite: or-snap-ecps
