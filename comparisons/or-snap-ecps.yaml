name: or-snap-ecps
title: Oregon SNAP -- Axiom vs PolicyEngine
description: >-
  Compares Oregon SNAP eligibility and benefit amount produced by the
  RuleSpec composition against PolicyEngine on the certified Populace US artifact, filtered to
  Oregon households.

runner:
  type: axiom-encode-snap-populace-compare
  axiom_encode_repo: $HOME/axiom-encode
  axiom_binary: $HOME/TheAxiomFoundation/axiom-rules-engine/target/release/axiom-rules-engine
  rulespec_root: $HOME/TheAxiomFoundation/rulespec-us
  parameters:
    jurisdiction: us-or
    sample_size: 0
    year: 2026
    month: 1
    utility_projection: policyengine-type
    tolerance: 1.5

artifacts:
  report_basename: axiom-policyengine-or-snap-ecps

dashboard:
  filename: axiom-policyengine-or-snap-ecps.json
  suite: or-snap-ecps
