name: dk-child-youth-benefit-euromod
title: Denmark Child and Youth Benefit — Axiom vs EUROMOD
description: >-
  Compares the composed Denmark child and youth benefit pipeline encoded in
  Axiom RuleSpec (børne- og ungeydelsesloven LBK nr 603 af 12/05/2025 § 1
  age-band base amounts after the § 1, stk. 3 CPI regulation and 12-krone
  rounding, less the § 1 a income taper of 2 pct. above the current-year
  § 20-regulated bundfradrag 917.000 kr.) against the JRC EUROMOD release's
  Danish child and youth benefit bfachnm_s on a synthetic single-parent,
  one-child grid — four child ages (1 / 5 / 10 / 16) at a below-threshold income
  crossing the four age bands, then age 5 across an income sweep (yem
  1.000.000 / 1.300.000 / 2.000.000) that straddles and exhausts the taper.
  Those seven cases retain raw parity. An eighth case at yem 1.300.000 records
  60.000 kr. of qualifying pension contributions and activates ec-jrc #20:
  Axiom applies the § 1 a, stk. 4-5 capped contribution gross-up while EUROMOD's
  bfachnm_dk taper has no input for it.
  The Axiom taper runs on EUROMOD's own § 7-basis income tintbto_s (0.92 x yem)
  bridged into the composed module's personskatteloven_section_7_income_basis
  inputs, with the same
  917.000 kr. bundfradrag EUROMOD DK_2025 uses. The grid is single-parent by
  design: EUROMOD keeps a pre-2022 spousal income test in the DK_2022-DK_2025
  taper (euromod_issues.json euromod-dk-2025-bfachnm-pre2022-spousal-taper) and
  the Axiom pipeline models the single-recipient taper only, so couple semantics
  are excluded from the graded surface. EUROMOD runs the public JRC release
  (EUROMOD_RELEASES_J2.0+, system DK_2025, dataset DK_training_data). This suite
  runs where the x64 EUROMOD runtime and model checkout are available and is
  regenerated by scripts/regenerate_euromod_dk.sh; on runners without them it
  re-emits the committed dashboard report.

runner:
  type: euromod-synthetic-compare
  # Engine parity with rulespec-dk: this checkout must be built at the engine
  # SHA rulespec-dk validates against (05eac9d2, the toolchain-era pin), so the
  # certified numbers come from the same engine that gates the encodings. The
  # unpinned main clone drifted (its binary predates compile-composed, and its
  # legacy loader cannot lower versioned derived formulas, which the §-scoped
  # paragraf-1-a module uses).
  axiom_rules_repo: $HOME/TheAxiomFoundation/_worktrees/axiom-rules-engine-pin
  parameters:
    suite: dk-child-youth-benefit
    population: synthetic
    sample_size: 0
    # Danish law is calendar-year; the engine keys parameter versions off
    # period.start, and the § 1, stk. 3 12-krone rounding divisor takes effect
    # 2025-05-12 (LOV nr 1642 moves it to 24 from 2026-01-01), so the Axiom side
    # evaluates on a 2025 date after that boundary. EUROMOD resolves the policy
    # year from euromod_system (DK_2025) and ignores the case period.
    period: 2025-06-01
    euromod_model_root: $HOME/Downloads/EUROMOD_J2.0/EUROMOD_RELEASES_J2.0+
    euromod_country: DK
    euromod_system: DK_2025
    euromod_dataset: DK_training_data
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-dk-child-youth-benefit.json

artifacts:
  report_basename: axiom-euromod-dk-child-youth-benefit

dashboard:
  filename: axiom-euromod-dk-child-youth-benefit.json
  suite: dk-child-youth-benefit
