name: uk-income-tax-savings-ukmod
title: UK savings income tax — Axiom vs UKMOD
description: >-
  Compares the composed UK savings-and-dividend income-tax pipeline encoded in
  Axiom RuleSpec (Income Tax Act 2007 section 12 starting rate for savings,
  section 12A/12B savings nil rate and personal savings allowance, section 11D
  savings basic/higher/additional rates, wired above earned income per the
  section 16 highest-part ordering) against CeMPA's UKMOD tin_s on a synthetic
  savings-income grid. Earned income straddles the basic/higher/additional
  bands and savings straddles the personal savings allowance and the band
  edges; earned income stays at or above the 5,000 starting-rate limit so the
  starting-rate-for-savings band is zero. UKMOD reads taxable savings interest
  through yiytx (its generic projector sums interest and dividends into yiy,
  which the UK training_data configuration does not load, so the suite carries
  explicit rows). UKMOD runs the registration-free public model
  (UKMOD_PUBLIC_B2026.03, system UK_2026, dataset training_data). This suite
  runs where the x64 UKMOD runtime and model checkout are available and is
  regenerated by scripts/regenerate_euromod_uk.sh; on runners without them it
  re-emits the committed dashboard report.

runner:
  type: euromod-synthetic-compare
  axiom_binary: $HOME/TheAxiomFoundation/axiom-rules-engine/target/release/axiom-rules-engine
  parameters:
    suite: uk-income-tax-savings
    population: synthetic
    sample_size: 0
    # UK fiscal-year law takes effect 6 April; the engine keys parameter
    # versions off period.start, so the Axiom side evaluates on the 2026-27
    # tax-year boundary (6 Apr 2026 - 5 Apr 2027) rather than the value live on
    # 1 January. UKMOD resolves the policy year from euromod_system (UK_2026)
    # and ignores the case period.
    period: 2026-04-06
    euromod_model_root: $HOME/Downloads/UKMOD_PUBLIC_B2026.03
    euromod_country: UK
    euromod_system: UK_2026
    euromod_dataset: training_data
    rulespec_root: $HOME/TheAxiomFoundation/rulespec-uk
    dashboard_filename: axiom-euromod-uk-income-tax-savings.json

artifacts:
  report_basename: axiom-euromod-uk-income-tax-savings

dashboard:
  filename: axiom-euromod-uk-income-tax-savings.json
  suite: uk-income-tax-savings
