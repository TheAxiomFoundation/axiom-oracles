# Married filing separately — Axiom vs PolicyEngine, synthetic.
#
# Runs the 13-case `us-mfs` suite (axiom_oracles/suites/us_mfs.py): one
# spouse's separate return per case, Colorado scope, 2026 law year, never a
# spouse entity; axiom_oracles.core.filing.separate_filing resolves the
# separate-return facts. The Axiom leg is the composed oracle-bridge program
# on the same pinned engine and rulespec-us snapshot as us-mfs-taxsim; the
# PolicyEngine leg uses the in-repo certified oracle pins
# (_PE_ORACLE_PINS in scripts/run_comparison.py: policyengine 4.18.9,
# policyengine-us 1.752.2, policyengine-core 3.28.0).
#
# Unlike the TAXSIM input row, policyengine-us 1.752.2 has spouse-residence
# inputs (TaxUnit `cohabitating_spouses`, read by its taxable Social
# Security variables; Person `is_separated`, citing 26 USC 7703), so this is
# the leg where the lived-apart cases can differ from the cohabiting ones.
# Additional Medicare Tax: both encodings apply the
# $125,000 separate-return threshold (pinned rulespec-us
# us/statutes/26/3101/b/2.yaml; policyengine-us 1.752.2
# parameters/gov/irs/payroll/medicare/additional/exclusion.yaml SEPARATE),
# and the suite is wage-only, so PolicyEngine's self-employment leg is zero.
#
# Run locally:
#   uv run scripts/run_comparison.py us-mfs-policyengine --summary

name: us-mfs-policyengine
title: Married filing separately — Axiom vs PolicyEngine
description: >-
  Compares federal liability, standard deduction, taxable income, tax before
  credits, EITC, CTC, employee-side FICA and Additional Medicare Tax on
  thirteen synthetic Colorado married-filing-separately returns at the 2026
  law year.

# Same pinned engine and rulespec-us snapshot, and so the same manual-lane
# status, as fiit-taxsim-ecps (see its header; axiom-oracles#455 tracks the
# flip-back to engine main x rulespec-us main).
ci: manual

runner:
  type: axiom-oracles-compare
  axiom_rules_repo: $HOME/axiom-rules-engine-0c39023e
  # run_comparison verifies the checkouts hold these revisions before running.
  axiom_rules_repo_revision: 0c39023e
  parameters:
    left: axiom
    right: policyengine
    population: synthetic
    # The registered case suite the CLI loads (`--suite`); `suite` below is
    # the report label.
    case_suite: us-mfs
    sample_size: 0
    period: "2026"
    suite: us-mfs-policyengine
    include_case_inputs: true
    concepts:
      - us:tax/federal-income-tax#liability
      - us:tax/federal-income-tax#standard_deduction
      - us:tax/federal-income-tax#taxable_income
      - us:tax/federal-income-tax#tax_before_credits
      - us:tax/federal-income-tax#eitc
      - us:tax/federal-income-tax#ctc
      - us:tax/payroll#employee_fica
      - us:tax/payroll#additional_medicare_tax
    axiom_rulespec_repo_roots: $HOME/oracle-pins
    axiom_rulespec_repo_roots_revision: ca2d424f

artifacts:
  report_basename: axiom-policyengine-us-mfs

dashboard:
  filename: axiom-policyengine-us-mfs.json
  suite: us-mfs-policyengine
