# Maine composed income-tax liability — Axiom pipeline vs PolicyEngine and TAXSIM
# on a modest case grid (single and married filers at incomes that cross the
# state's brackets). The Axiom side is the composed rulespec-us pipeline
# us-me/policies/income_tax/pilot_liability_pipeline, evaluated through the
# axiom rules engine (its liabilities are the engine-verified companion-test
# fixtures).
#
# PolicyEngine and TAXSIM both run at the 2026 validation year
# (policyengine-taxsim 2.30.0 models 2026 law including OBBBA).
#
# Run locally:
#   uv run python scripts/run_comparison.py me-income-tax-liability

name: me-income-tax-liability
title: Maine income tax liability — Axiom vs PolicyEngine and TAXSIM
description: >-
  Compares the composed Maine income-tax liability pipeline encoded in Axiom
  RuleSpec (us-me/policies/income_tax/pilot_liability_pipeline) against
  PolicyEngine (me_income_tax_before_refundable_credits) at 2026 and TAXSIM (siitax) at 2026 on a modest grid of
  single and married filers crossing the state's brackets.

runner:
  type: state-income-tax-liability-grid
  parameters:
    state: ME
    period: "2026"
    taxsim_law_year: 2026
    # Links this suite to the rulespec-us monorepo in the affected map
    # so a change to the composed pipeline triggers a re-run.
    rulespec_roots:
      - $HOME/TheAxiomFoundation/rulespec-us

artifacts:
  report_basename: axiom-policyengine-taxsim-me-income-tax-liability

dashboard:
  filename: axiom-policyengine-taxsim-me-income-tax-liability.json
  suite: me-income-tax-liability
