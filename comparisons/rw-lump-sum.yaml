name: rw-lump-sum
title: Rwanda rw-lump-sum — Axiom vs RWAMOD
description: >-
  Compares the rulespec-rw Law 027/2022 lump-sum regime (micro flat amounts
  60,000/120,000/210,000/300,000 FRW by annual-turnover band; 3% for 12m-20m;
  nil outside the regime) against RWAMOD ttn_s. RWAMOD reads ytn01 as monthly
  turnover and pays the flat amounts as annual twelfths (probed
  5,000/10,000/17,500/25,000 FRW per month and 3% inside the small band; zero
  above the 20m bound); the bridge annualizes the engine's uprated turnover
  onto the module's annual input. The Axiom side evaluates period 2026; RWAMOD
  runs RW_2025 (CY2025), and every schedule this suite compares is
  value-identical across 2025 and 2026. Results are based on the tax-benefit
  microsimulation model for Rwanda (RWAMOD) in SOUTHMOD_A4.0, developed,
  maintained and managed by UNU-WIDER with SASPRI, the LSE International
  Inequalities Institute and local partners, run on the EUROMOD software
  (EM_Executable 1.0.0 via the euromod connector 0.2.18) under the registered
  rw_2024_a1 dataset name; the bundle ships no Rwandan microdata, so a
  header-only input file is built locally from the model's own variable list
  and every household is synthetic. The results and their interpretation are
  Axiom's responsibility. The SOUTHMOD bundle is licensed and
  non-redistributable: it is referenced only by path (euromod_model_root), and
  no model XML, dataset row, or DRD text is committed.

# Not runnable on the CI matrix runners. The SOUTHMOD bundle is licensed to
# Axiom by UNU-WIDER under the SOUTHMOD_A4.0 Adhesion Agreement, which bars
# providing the model or its input datasets to any third party (clause 4), so
# no shared runner can hold it; the runner also needs the x64 EUROMOD engine
# (EM_Executable.dll) under EUROMOD_PYTHON and a .NET runtime. Manual lane
# only: scripts/regenerate_euromod_rw.sh, where the licensed bundle and
# runtime exist, refreshes the committed report. This marker stays unless
# UNU-WIDER licenses a runner-held copy.
ci: manual

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: rw-lump-sum
    population: synthetic
    sample_size: 0
    period: 2026
    euromod_model_root: $HOME/.axiom/oracles/southmod/bundle/SOUTHMOD_A4.0
    euromod_country: RW
    euromod_system: RW_2025
    euromod_dataset: rw_2024_a1
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-rw-lump-sum.json

artifacts:
  report_basename: axiom-euromod-rw-lump-sum

dashboard:
  filename: axiom-euromod-rw-lump-sum.json
  suite: rw-lump-sum
