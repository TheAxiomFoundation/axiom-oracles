name: rw-lump-sum
title: Rwanda rw-lump-sum — Axiom vs RWAMOD
description: >-
  Compares the rulespec-rw Law 027/2022 lump-sum regime (micro flat
  amounts 60,000/120,000/210,000/300,000 FRW by annual-turnover band;
  3% for 12m-20m; nil outside the regime) against RWAMOD ttn_s.
  RWAMOD reads ytn01 as monthly turnover and pays the flat amounts as
  annual twelfths (probed 5,000/10,000/17,500/25,000 FRW per month
  and 3% inside the small band; zero above the 20m bound); the bridge
  annualizes the engine's uprated turnover onto the module's annual
  input. The SOUTHMOD bundle is licensed and non-redistributable;
  referenced only by path.

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: rw-lump-sum
    population: synthetic
    sample_size: 0
    period: 2026
    euromod_model_root: $HOME/.axiom/oracles/southmod/bundle/SOUTHMOD_A4.0
    euromod_country: RW
    euromod_system: RW_2025
    euromod_dataset: rw_2024_a1
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-rw-lump-sum.json

artifacts:
  report_basename: axiom-euromod-rw-lump-sum

dashboard:
  filename: axiom-euromod-rw-lump-sum.json
  suite: rw-lump-sum
