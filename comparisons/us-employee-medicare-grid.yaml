# Federal employee Medicare wage tax — Axiom vs PolicyEngine-US, tax year 2026.
#
# Axiom boundary: the section 3101(b)(1) node applies its statutory 1.45%
# employee rate directly to one Person's completed Medicare wages. The supplied
# `wages` fact is the W-2 Box 5 / Medicare-wages surface; no OASDI contribution
# and benefit base applies to this node.
# Code: rulespec-us@3b7f2384d2f322d8ade4d093de35d2bd1aeb3927
# us/statutes/26/3101/b/1.yaml; us/statutes/26/3101/b/1.test.yaml.
#
# PolicyEngine binding decision: compare the Person-grain
# `employee_medicare_tax` directly. PE-US multiplies
# `gov.irs.payroll.medicare.rate.employee` by `payroll_tax_gross_wages`.
# This grid supplies `payroll_tax_gross_wages` directly from the same completed
# W-2 Box 5 fact and verifies that the 2026 employee rate is exactly 0.0145.
# The one adult, age 40, Texas household/tax-unit scaffolding is held constant
# and is immaterial to the Person formula. There are no other modeled inputs,
# deductions, thresholds, filing-status effects, or wage caps.
# Code: policyengine-us@49d19b239a593dbac8920ac6fd80cfe33372343a
# policyengine_us/variables/gov/irs/tax/payroll/medicare/
# employee_medicare_tax.py:4-14;
# policyengine_us/parameters/gov/irs/payroll/medicare/rate/employee.yaml.
#
# The five-case grid binds zero and ordinary wages, both sides of the 2026
# $184,500 OASDI wage-base seam, and wages well above that seam. The seam is a
# diagnostic for accidental OASDI-cap wiring: Medicare must keep increasing.
#
# The exact suite stack is PolicyEngine 4.18.9, PE-US 1.767.3 and core 3.30.3.
#
# Run locally:
#   uv run python scripts/run_comparison.py us-employee-medicare-grid --summary

