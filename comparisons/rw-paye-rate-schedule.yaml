name: rw-paye-rate-schedule
title: Rwanda rw-paye-rate-schedule — Axiom vs RWAMOD
description: >-
  Compares the rulespec-rw Law 027/2022 Article 56 Table 2 monthly schedule
  (0% to 60,000 FRW; 10% to 100,000; 20% to 200,000; 30% above) against RWAMOD
  tin_s (SOUTHMOD A4.0, country RW, system RW_2025 = CY2025; synthetic rows
  under the registered rw_2024_a1 dataset name - the bundle ships no Rwandan
  microdata, and scripts/southmod_rw_header.py builds the local input schema).
  The engine's own post-uprating gross yem is bridged onto the module's
  monthly input so the live cases verify the schedule arithmetic; on this
  employment-only grid the model's tax base equals yem (probed). RWAMOD starts
  each band at its printed lower bound (60,001/100,001/200,001), one franc
  above the encoded threshold, so it prices 0.1 FRW per month below the
  encoded schedule in band 2, 0.2 in band 3 and 0.3 in band 4 - inside the
  1-FRW tolerance. The Axiom side evaluates period 2026; RWAMOD runs RW_2025
  (CY2025), and every schedule this suite compares is value-identical across
  2025 and 2026. Results are based on the tax-benefit microsimulation model
  for Rwanda (RWAMOD) in SOUTHMOD_A4.0, developed, maintained and managed by
  UNU-WIDER with SASPRI, the LSE International Inequalities Institute and
  local partners, run on the EUROMOD software (EM_Executable 1.0.0 via the
  euromod connector 0.2.18) under the registered rw_2024_a1 dataset name; the
  bundle ships no Rwandan microdata, so a header-only input file is built
  locally from the model's own variable list and every household is synthetic.
  The results and their interpretation are Axiom's responsibility. The
  SOUTHMOD bundle is licensed and non-redistributable: it is referenced only
  by path (euromod_model_root), and no model XML, dataset row, or DRD text is
  committed.

# Not runnable on the CI matrix runners. The SOUTHMOD bundle is licensed to
# Axiom by UNU-WIDER under the SOUTHMOD_A4.0 Adhesion Agreement, which bars
# providing the model or its input datasets to any third party (clause 4), so
# no shared runner can hold it; the runner also needs the x64 EUROMOD engine
# (EM_Executable.dll) under EUROMOD_PYTHON and a .NET runtime. Manual lane
# only: scripts/regenerate_euromod_rw.sh, where the licensed bundle and
# runtime exist, refreshes the committed report. This marker stays unless
# UNU-WIDER licenses a runner-held copy.
ci: manual

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: rw-paye-rate-schedule
    population: synthetic
    sample_size: 0
    period: 2026
    euromod_model_root: $HOME/.axiom/oracles/southmod/bundle/SOUTHMOD_A4.0
    euromod_country: RW
    euromod_system: RW_2025
    euromod_dataset: rw_2024_a1
    euromod_annualize_outputs: false
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-rw-paye-rate-schedule.json

artifacts:
  report_basename: axiom-euromod-rw-paye-rate-schedule

dashboard:
  filename: axiom-euromod-rw-paye-rate-schedule.json
  suite: rw-paye-rate-schedule
