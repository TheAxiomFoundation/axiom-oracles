name: ms-income-tax-liability
title: Mississippi income tax liability — Axiom vs PolicyEngine and TAXSIM
description: >-
  Compares Mississippi's section 27-7-5 schedule-before-credits pipeline in
  Axiom RuleSpec against PolicyEngine (ms_income_tax_before_credits_unit) at
  2026 and TAXSIM (siitax) at its latest supported law year, 2024, on the
  standard six-case grid. The RuleSpec computes both Person-grain completed-
  taxable-income candidates and performs the strict lower-tax comparison
  without consuming PolicyEngine's filing selector or candidate tax outputs.

runner:
  type: state-income-tax-liability-grid
  parameters:
    state: MS
    period: "2026"
    taxsim_law_year: 2024
    rulespec_roots:
      - $HOME/TheAxiomFoundation/rulespec-us

artifacts:
  report_basename: axiom-policyengine-taxsim-ms-income-tax-liability

dashboard:
  filename: axiom-policyengine-taxsim-ms-income-tax-liability.json
  suite: ms-income-tax-liability
