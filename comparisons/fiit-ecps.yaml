# Federal Individual Income Tax — Axiom RuleSpec vs PolicyEngine, Enhanced CPS.
#
# Wraps `axiom-encode tax-ecps-compare` (the harness Max wrote in axiom-encode).
# See docs/federal-income-tax-comparison.md for the recipe, the gotchas, and
# the known residuals.

name: fiit-ecps
title: Federal income tax — Axiom vs PolicyEngine
description: >-
  Compares every federal-tax surface (CTC, standard deduction, EITC, capital
  gain definitions, OASDI, Medicare) Axiom RuleSpec encodes against
  PolicyEngine, using the Enhanced CPS as the validation population.
documentation: docs/federal-income-tax-comparison.md

runner:
  type: axiom-encode-tax-ecps-compare
  axiom_encode_repo: $HOME/axiom-encode
  axiom_rules_repo: $HOME/axiom-rules
  rulespec_remote: https://github.com/TheAxiomFoundation/rulespec-us.git
  parameters:
    sample_size: 1000
    year: 2026
    surface: all
    # Keep PE and core on axiom-encode's certified stack, but use the current
    # PE-US package so the ECPS oracle reflects latest upstream tax fixes.
    pinned: true
    allow_policyengine_us_version: true
    allow_uncertified_policyengine_data: true

artifacts:
  report_basename: axiom-policyengine-fiit-ecps

# Dashboard adapter: rewrites the run output into axiom.comparison_report.v2
# at dashboard/public/data/<filename> and adds it to manifest.json. The
# dashboard's suite selector groups reports by `suite`.
dashboard:
  filename: axiom-policyengine-fiit-ecps.json
  suite: fiit-ecps
