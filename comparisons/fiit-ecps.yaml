# Federal Individual Income Tax — Axiom RuleSpec vs PolicyEngine, pinned Populace.
#
# Wraps `axiom-encode tax-populace-compare` (renamed from `tax-ecps-compare`
# in the encoder's ECPS→Populace rename; no alias survives on axiom-encode
# main — #296). The harness resolves the PolicyEngine oracle
# population from the *pinned* Populace artifact by default (axiom-encode#952):
# a fixed HF revision, sha256-verified, no `AXIOM_POPULACE_ALLOW_UNPINNED`. Its
# `--json` output carries a `dataset_identity` block that this repo's dashboard
# adapter threads into the report so a checked-in FIIT report records exactly
# which artifact produced it. See docs/federal-income-tax-comparison.md for the
# recipe, the gotchas, and the known residuals.

name: fiit-ecps
title: Federal income tax — Axiom vs PolicyEngine
description: >-
  Compares every federal-tax surface (CTC, standard deduction, EITC, CDCC,
  AOTC, capped nonrefundable credits, capital gain definitions, OASDI, Medicare)
  Axiom RuleSpec encodes against PolicyEngine, over the certified pinned
  Populace US validation population.
documentation: docs/federal-income-tax-comparison.md

# Not CI-runnable: the axiom leg's engine-main compile of rulespec-us main is
# blocked by rulespec-us#1049/#1050 (canonical-path root scan; removed plural
# corpus_citation_paths), and the 2026-08-05 sweeps additionally saw the hosted
# runner receive a shutdown signal minutes into the PolicyEngine outputs pass
# in consecutive runs -- consistent with runner memory limits at sample_size 0.
# Manual lane only; re-verify both before dropping this marker
# (axiom-oracles#455 tracks the flip-back).
ci: manual

runner:
  type: axiom-encode-tax-ecps-compare
  axiom_encode_repo: $HOME/axiom-encode
  axiom_rules_repo: $HOME/axiom-rules
  rulespec_remote: https://github.com/TheAxiomFoundation/rulespec-us.git
  parameters:
    # No `data_folder`: Populace loads from the sha256-pinned Hugging Face cache
    # (axiom-encode#952), so the harness needs no local data directory. The
    # runner's --data-folder is only passed when this key is set, and it hard-
    # fails if the path is missing — so omitting it is both correct and safer
    # than pointing at a directory nothing populates. The pinned revision is
    # owned by axiom_oracles/bridges/population.py::POPULACE_PINS; the runner
    # overlays this checkout's bridges over axiom-encode's git-pinned copy, so
    # the pin (and the source tax-unit role pin) here is the one that runs.
    sample_size: 0
    year: 2026
    python: "3.13"
    surface: all
    # `pinned: true` installs the PE oracle stack below, matched to the certified
    # Populace artifact this harness loads: revision
    # populace-us-2024-spm-20260915, certified by policyengine.py 6.1.1 for
    # policyengine-us 2.2.1 / core 3.32.5. Model and data are pinned together on
    # purpose.
    #
    # History: until 2026-09-25 this lane paired the f0af251 build with
    # policyengine-us 1.729.0, its built_with. That build stored partnership
    # self-employment income under the pre-PE-US-#8614 layout, so no PE version
    # fed it to eitc_earned_income, and the committed report explains the
    # resulting EITC gap as an oracle-vintage divergence
    # (dispositions/fiit-ecps.yaml). The certified build carries
    # partnership_self_employment_net_earnings, which policyengine-us 2.2.1
    # reads for both SECA and EITC earned income, and the bridge reads it for
    # Axiom's 1402(a) input. The committed report predates the re-pin; the next
    # refresh must re-triage those dispositions (the case ids renumber too).
    pinned: true
    policyengine_version: "6.1.1"
    policyengine_us_version: "2.2.1"
    policyengine_core_version: "3.32.5"
    allow_policyengine_us_version: true
    # Deprecated no-op on this harness (Populace validation no longer loads
    # policyengine.py microdata); retained for orchestrator back-compat.
    allow_uncertified_policyengine_data: true

artifacts:
  report_basename: axiom-policyengine-fiit-ecps

# Dashboard adapter: rewrites the run output into axiom.comparison_report.v2
# at dashboard/public/data/<filename> and adds it to manifest.json. The
# dashboard's suite selector groups reports by `suite`.
dashboard:
  filename: axiom-policyengine-fiit-ecps.json
  suite: fiit-ecps
