name: gh-ssnit-contributions
title: Ghana SSNIT contributions — Axiom vs GHAMOD
description: >-
  Compares the rulespec-gh National Pensions Act 2008 (Act 766) section 3
  contributions against GHAMOD on a formal-sector employee income sweep:
  employee_social_security_contribution (5.5% of qualifying employment income,
  s.3(1)) against tscee_s, and employer_social_security_contribution (13%,
  s.3(2)) against tscer_s. Both engines are bridged on GHAMOD's post-uprating
  yem. Cases (10,000, 60,000, 120,000 and 500,000 a year at age 35) stay
  inside GHAMOD's contributor window of ages 15 to 45 (probed: ages 14 and 46
  get nothing), where both apply the identical flat rates. Live run: 4 cases,
  8 comparisons, all exact. Act 766 s.3, the section encoded, sets no age
  limit; the divergence is recorded in axiom_oracles/data/ghamod_issues.json
  (ghamod-tscee-tscer-age-15-45-contributor-cap). Results are based on the
  tax-benefit microsimulation model for Ghana (GHAMOD) in SOUTHMOD_A4.0,
  developed, maintained and managed by UNU-WIDER with SASPRI, the LSE
  International Inequalities Institute and local partners, run on the EUROMOD
  software (EM_Executable 1.0.0 via the euromod connector 0.2.18) under the
  gh_2017_a8 dataset configuration (Ghana Statistical Service, Ghana Living
  Standards Survey Round 7, 2016-2017); only the dataset's variable list is
  read and every household is synthetic. The results and their interpretation
  are Axiom's responsibility. The SOUTHMOD bundle is licensed and
  non-redistributable: it is referenced only by path (euromod_model_root), and
  no model XML, dataset row, or DRD text is committed.

# Not runnable on the CI matrix runners. The SOUTHMOD bundle is licensed to
# Axiom by UNU-WIDER under the SOUTHMOD_A4.0 Adhesion Agreement, which bars
# providing the model or its input datasets to any third party (clause 4), so
# no shared runner can hold it; the runner also needs the x64 EUROMOD engine
# (EM_Executable.dll) under EUROMOD_PYTHON and a .NET runtime. Manual lane
# only: scripts/regenerate_euromod_gh.sh, where the licensed bundle and
# runtime exist, refreshes the committed report. This marker stays unless
# UNU-WIDER licenses a runner-held copy.
ci: manual

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: gh-ssnit-contributions
    population: synthetic
    sample_size: 0
    # Ghana year of assessment 2026 (the rulespec-gh validation year). GHAMOD
    # resolves its policy year from euromod_system (GH_2025) and ignores the
    # case period.
    period: 2026
    euromod_model_root: $HOME/.axiom/oracles/southmod/bundle/SOUTHMOD_A4.0
    euromod_country: GH
    euromod_system: GH_2025
    euromod_dataset: gh_2017_a8
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-gh-ssnit-contributions.json

artifacts:
  report_basename: axiom-euromod-gh-ssnit-contributions

dashboard:
  filename: axiom-euromod-gh-ssnit-contributions.json
  suite: gh-ssnit-contributions
