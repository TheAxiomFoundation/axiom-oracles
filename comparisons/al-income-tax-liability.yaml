# Alabama composed income-tax liability — Axiom pipeline vs PolicyEngine and TAXSIM
# on a modest case grid (single and married filers at incomes that cross the
# state's brackets). The Axiom side is the composed rulespec-us pipeline
# us-al/policies/income_tax/pilot_liability_pipeline, evaluated through the
# axiom rules engine (its liabilities are the engine-verified companion-test
# fixtures). Alabama applies section 40-18-5 graduated (2/4/5 per cent) to Alabama taxable income.
#
# PolicyEngine and TAXSIM both run at the 2026 validation year: the pinned
# policyengine-taxsim 2.30.0 binary models 2026 law (its missing 2026
# qualifying-child credit machinery is not exercised by this childless grid),
# but its 2026 state module projects several parameters instead of applying
# enacted amounts; each residual is decomposed exactly in
# dispositions/al-income-tax-liability.yaml rather than absorbed by tolerance.
#
# Run locally:
#   uv run python scripts/run_comparison.py al-income-tax-liability

name: al-income-tax-liability
title: Alabama income tax liability — Axiom vs PolicyEngine and TAXSIM
description: >-
  Compares the composed Alabama income-tax liability pipeline encoded in Axiom
  RuleSpec (us-al/policies/income_tax/pilot_liability_pipeline) against
  PolicyEngine (al_income_tax_before_refundable_credits) at 2026 and TAXSIM (siitax) at 2026 on a modest grid of
  single and married filers crossing the state's brackets.

runner:
  type: state-income-tax-liability-grid
  parameters:
    state: AL
    period: "2026"
    taxsim_law_year: 2026
    # Links this suite to the rulespec-us monorepo in the affected map
    # so a change to the composed pipeline triggers a re-run.
    rulespec_roots:
      - $HOME/TheAxiomFoundation/rulespec-us

artifacts:
  report_basename: axiom-policyengine-taxsim-al-income-tax-liability

dashboard:
  filename: axiom-policyengine-taxsim-al-income-tax-liability.json
  suite: al-income-tax-liability
