name: ny-snap-qc
title: New York SNAP — Axiom vs USDA SNAP QC administrative data
description: >-
  Replays New York SNAP Quality Control public-use reviews (FY2024, 847
  in-scope NY active-case reviews including the 107 NYSCAP units, which follow
  the regular benefit determination) through the Axiom RuleSpec SNAP
  composition and compares six values per review: the benefit against FSBEN
  and five stage intermediates, namely gross income (FSGRINC), the standard
  deduction (FSSTDDED), the excess-shelter deduction (FSSLTDED), net income
  (FSNETINC), and the maximum allotment, which is checked against the oracle's
  own FY2024 table by certified household size rather than against the file's
  BENMAX field. FSBEN is the file's final calculated benefit, which
  Mathematica computes for USDA from each edited case record; the benefit
  received, as recorded in the review, is a separate field (RAWBEN). The
  replay takes the medical (FSMEDDED, entered as FSMEDDED + 35 of expenses so
  the engine's $35 threshold returns it), dependent-care (FSDEPDED), and
  child-support (FSCSDED) deduction amounts from the file and treats the
  file's utility amount (UTIL) as authoritative, so it tests the arithmetic
  from those amounts onward, not how they were derived. The oracle validates
  the benefit calculation, not the eligibility screening: eligibility gates
  are fed the composition's passing defaults, and every in-scope FY2024 New
  York row is categorically eligible, projected through the 18 NYCRR
  387.14(a)(5) public-assistance path. New York publishes three regional SUA
  schedules (New York City, Nassau/Suffolk, rest of state); the public file
  carries no sub-state geography, so the region is inferred from the
  QC-applied UTIL amount, which is authoritative over SUA1. FY2024 law is
  evaluated through a compile-time overlay (fy-2026 SNAP COLA module ids
  rewritten to fy-2024-cola plus seven New York SUA amount patches) at the
  nominal period 2026-01, because the chain is snapshot-dated 2025-10-01 and
  true-period FY2024 evaluation is impossible today
  (TheAxiomFoundation/rulespec-us#759 inverts the chain and retires the
  overlay). This suite runs where the axiom-rules-engine binary, a rulespec-us
  checkout with the fy-2024-cola modules, and the downloaded QC public-use
  file all exist; a run without them re-emits the committed dashboard report,
  which never replaces a real run's report.
documentation: docs/snap-qc-oracle-playbook.md

# Not runnable on the CI matrix runners. The replay needs the
# axiom-rules-engine binary, a rulespec-us checkout carrying the fy-2024-cola
# modules, and the QC public-use file. The 6-hourly affected rerun and the
# weekly matrix clone rulespec-us main (which has fy-2024-cola) but never
# build the engine or download the QC file, so there run_comparison.py can
# only re-emit the committed report. On 2026-09-23 the affected rerun
# committed such re-emissions over the five real reports #548 had landed (NY,
# MD, AZ, CA, GA). Manual lane only: a supervised run_comparison.py run
# refreshes the committed report. Drop this marker only once those two
# workflows build the engine and fetch the QC file themselves.
ci: manual

runner:
  type: snap-qc-compare
  parameters:
    jurisdiction: us-ny
    fiscal_year: 2024
    sample_size: 0
    stage_tolerance: 0
    dashboard_filename: axiom-snapqc-ny-snap.json

artifacts:
  report_basename: axiom-snapqc-ny-snap

dashboard:
  filename: axiom-snapqc-ny-snap.json
  suite: ny-snap-qc
