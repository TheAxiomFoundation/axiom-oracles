name: ug-dispy
title: Uganda disposable income (composed pipeline) — Axiom vs UGAMOD
description: >-
  Compares the rulespec-ug composed single-employee disposable-income pipeline
  (Act 4 of 2012 Third Schedule resident income tax on chargeable income, Cap.
  230 s.11 employee 5% share, dispy = gross + benefits - tax - share) against
  UGAMOD ils_dispy on the full PAYE grid (SOUTHMOD A4.0, country UG, system
  UG_2025 = FY2025/26, dataset ug_2024_a1). Unlike Ghana (finding #13), the
  Ugandan ITA has no employee NSSF deduction and UGAMOD agrees (probed ttb_s =
  yem), so the live cases run every band boundary and interior point including
  the additional-rate region. Run live exact to within UGAMOD's monthly
  sub-shilling rounding (worst 0.4 UGX/yr at 150m gross). Local Service Tax is
  excluded on both sides: the rows leave UGAMOD's loc01 input at 0, so UGAMOD
  charges no LST, and the composed pipeline has no LST stage. The parity
  therefore covers gross - PAYE - employee NSSF only, although by statute this
  employee would also owe LST (ug-lst covers the LST table on its own). The
  bridge feeds the engine's post-uprating yem to both imported inputs
  (chargeable_income and total_wages). Results are based on the tax-benefit
  microsimulation model for Uganda (UGAMOD) in SOUTHMOD_A4.0, developed,
  maintained and managed by UNU-WIDER with SASPRI, the LSE International
  Inequalities Institute and local partners, run on the EUROMOD software
  (EM_Executable 1.0.0 via the euromod connector 0.2.18) under the ug_2024_a1
  dataset configuration (Uganda Bureau of Statistics, Uganda National
  Household Survey 2023/24); only the dataset's variable list is read and
  every household is synthetic. The results and their interpretation are
  Axiom's responsibility. The SOUTHMOD bundle is licensed and
  non-redistributable: it is referenced only by path (euromod_model_root), and
  no model XML, dataset row, or DRD text is committed.

# Not runnable on the CI matrix runners. The SOUTHMOD bundle is licensed to
# Axiom by UNU-WIDER under the SOUTHMOD_A4.0 Adhesion Agreement, which bars
# providing the model or its input datasets to any third party (clause 4), so
# no shared runner can hold it; the runner also needs the x64 EUROMOD engine
# (EM_Executable.dll) under EUROMOD_PYTHON and a .NET runtime. Manual lane
# only: scripts/regenerate_euromod_ug.sh, where the licensed bundle and
# runtime exist, refreshes the committed report. This marker stays unless
# UNU-WIDER licenses a runner-held copy.
ci: manual

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: ug-dispy
    population: synthetic
    sample_size: 0
    period: 2026
    euromod_model_root: $HOME/.axiom/oracles/southmod/bundle/SOUTHMOD_A4.0
    euromod_country: UG
    euromod_system: UG_2025
    euromod_dataset: ug_2024_a1
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-ug-dispy.json

artifacts:
  report_basename: axiom-euromod-ug-dispy

dashboard:
  filename: axiom-euromod-ug-dispy.json
  suite: ug-dispy
