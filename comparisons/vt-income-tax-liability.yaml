name: vt-income-tax-liability
title: Vermont income tax liability — Axiom vs PolicyEngine and TAXSIM
description: >-
  Compares the composed Vermont ordinary full-year resident wage-earner
  pipeline in Axiom RuleSpec against PolicyEngine
  (vt_income_tax_before_non_refundable_credits) at 2026 and TAXSIM (siitax) at 2026 on the standard six-case grid. The
  pipeline accepts completed current-year normal tax as an upstream boundary
  because the certified corpus lacks the official 2026 indexed tables, then
  independently applies the greater-of three-percent federal-AGI minimum when
  AGI exceeds $150,000.

# Not CI-runnable while engine-main x rulespec-us-main is broken: the engine's
# canonical-path root scan rejects the whole tree (non-canonical filenames in
# us-la/us-nh/us-nj/us -- rulespec-us#1049), and the state pipelines carry the
# removed plural `corpus_citation_paths` schema (rulespec-us#1050; 176 files
# across every jurisdiction as of 2026-08-05). Every dispatched leg fails
# before producing a report. Manual lane only; drop this marker when both land
# upstream (axiom-oracles#455 tracks the flip-back).
ci: manual

runner:
  type: state-income-tax-liability-grid
  parameters:
    state: VT
    period: "2026"
    taxsim_law_year: 2026
    rulespec_roots:
      - $HOME/TheAxiomFoundation/rulespec-us

artifacts:
  report_basename: axiom-policyengine-taxsim-vt-income-tax-liability

dashboard:
  filename: axiom-policyengine-taxsim-vt-income-tax-liability.json
  suite: vt-income-tax-liability
