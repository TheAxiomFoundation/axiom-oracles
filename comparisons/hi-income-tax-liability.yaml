name: hi-income-tax-liability
title: Hawaii income tax liability — Axiom vs PolicyEngine and TAXSIM
description: >-
  Compares Hawaii's complete 2026 HRS 235-51 individual schedules and the
  subsection (f) computation from completed Form N-11 capital-gains worksheet
  line 10 in Axiom RuleSpec against PolicyEngine
  (hi_income_tax_before_non_refundable_credits), plus TAXSIM (siitax) at its
  2026 validation year on the standard grid.

# Not CI-runnable while engine-main x rulespec-us-main is broken: the engine's
# canonical-path root scan rejects the whole tree (non-canonical filenames in
# us-la/us-nh/us-nj/us -- rulespec-us#1049), and the state pipelines carry the
# removed plural `corpus_citation_paths` schema (rulespec-us#1050; 176 files
# across every jurisdiction as of 2026-08-05). Every dispatched leg fails
# before producing a report. Manual lane only; drop this marker when both land
# upstream (axiom-oracles#455 tracks the flip-back).
ci: manual

runner:
  type: state-income-tax-liability-grid
  parameters:
    state: HI
    period: "2026"
    taxsim_law_year: 2026
    rulespec_roots:
      - $HOME/TheAxiomFoundation/rulespec-us

artifacts:
  report_basename: axiom-policyengine-taxsim-hi-income-tax-liability

dashboard:
  filename: axiom-policyengine-taxsim-hi-income-tax-liability.json
  suite: hi-income-tax-liability
