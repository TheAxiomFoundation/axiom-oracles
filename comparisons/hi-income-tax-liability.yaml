name: hi-income-tax-liability
title: Hawaii income tax liability — Axiom vs PolicyEngine and TAXSIM
description: >-
  Compares Hawaii's complete 2026 HRS 235-51 individual schedules and the
  subsection (f) computation from completed Form N-11 capital-gains worksheet
  line 10 in Axiom RuleSpec against PolicyEngine
  (hi_income_tax_before_non_refundable_credits), plus TAXSIM (siitax) at its
  latest supported law year, 2024, on the standard grid.

runner:
  type: state-income-tax-liability-grid
  parameters:
    state: HI
    period: "2026"
    taxsim_law_year: 2024
    rulespec_roots:
      - $HOME/TheAxiomFoundation/rulespec-us

artifacts:
  report_basename: axiom-policyengine-taxsim-hi-income-tax-liability

dashboard:
  filename: axiom-policyengine-taxsim-hi-income-tax-liability.json
  suite: hi-income-tax-liability
