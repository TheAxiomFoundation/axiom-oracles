# Connecticut composed income-tax liability — Axiom pipeline vs PolicyEngine and TAXSIM
# on a modest case grid (single and married filers at incomes that cross the
# state's brackets). The Axiom side is the composed rulespec-us pipeline
# us-ct/policies/income_tax/pilot_liability_pipeline, evaluated through the
# axiom rules engine (its liabilities are the engine-verified companion-test
# fixtures).
#
# PolicyEngine runs at the 2026 validation year. TAXSIM runs at its latest
# supported law year (2024) because the pinned binary abandons 2026; the
# 2024-to-2026 vintage is recorded in dispositions/ct-income-tax-liability.yaml
# rather than absorbed by tolerance.
#
# Run locally:
#   uv run python scripts/run_comparison.py ct-income-tax-liability

name: ct-income-tax-liability
title: Connecticut income tax liability — Axiom vs PolicyEngine and TAXSIM
description: >-
  Compares the composed Connecticut income-tax liability pipeline encoded in Axiom
  RuleSpec (us-ct/policies/income_tax/pilot_liability_pipeline) against
  PolicyEngine (ct_income_tax_before_refundable_credits) at 2026 and TAXSIM (siitax) at 2024 on a modest grid of
  single and married filers crossing the state's brackets.

runner:
  type: state-income-tax-liability-grid
  parameters:
    state: CT
    period: "2026"
    taxsim_law_year: 2024
    # Links this suite to the rulespec-us monorepo in the affected map
    # so a change to the composed pipeline triggers a re-run.
    rulespec_roots:
      - $HOME/TheAxiomFoundation/rulespec-us

artifacts:
  report_basename: axiom-policyengine-taxsim-ct-income-tax-liability

dashboard:
  filename: axiom-policyengine-taxsim-ct-income-tax-liability.json
  suite: ct-income-tax-liability
