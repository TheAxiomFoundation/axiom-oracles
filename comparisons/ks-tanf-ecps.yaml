# Kansas TANF maximum benefit -- Axiom vs PolicyEngine on Enhanced CPS.

name: ks-tanf-ecps
title: Kansas TANF maximum benefit -- Axiom vs PolicyEngine
description: >-
  Compares the composed KEESM 7410 maximum-benefit standard (basic
  allowance plus energy supplement plus county shelter group, fixed at
  group V / table-I percentage to match PolicyEngine's single combined
  table) against PolicyEngine's ks_tanf_maximum_benefit on Enhanced CPS
  households in Kansas. The countable-income path is not yet encoded, so
  this scores the standards composition, not end-to-end eligibility.

runner:
  type: axiom-oracles-compare
  axiom_binary: $HOME/TheAxiomFoundation/axiom-rules-engine/target/release/axiom-rules-engine
  parameters:
    left: axiom
    right: policyengine
    suite: ks-tanf-ecps
    concepts:
      - us-ks:policies/dcf/keesm#ks_tanf_maximum_benefit
    sample_size: 0
    period: 2026-01
    population: enhanced-cps
    jurisdiction_fips: "20"
    axiom_compose_binary: $HOME/TheAxiomFoundation/axiom-compose/.venv/bin/axiom-compose
    axiom_program: $HOME/TheAxiomFoundation/rulespec-us/us-ks/programs/tanf/fy-2026.yaml
    axiom_composed_program: /tmp/axiom-composed/ks-tanf-ecps.yaml
    axiom_compiled_program: /tmp/ks-tanf-compiled.json
    rulespec_root: $HOME/TheAxiomFoundation/rulespec-us

artifacts:
  report_basename: axiom-policyengine-ks-tanf-ecps

dashboard:
  filename: axiom-policyengine-ks-tanf-ecps.json
  suite: ks-tanf-ecps
