# Kansas TANF maximum benefit -- Axiom vs PolicyEngine on Enhanced CPS.

name: ks-tanf-ecps
title: Kansas TANF maximum benefit -- Axiom vs PolicyEngine
description: >-
  Compares the monthly composed KEESM 7410 maximum-benefit standard (basic
  allowance plus energy supplement plus county shelter group, fixed at
  group I / table-I percentage to match PolicyEngine's single combined
  table) against PolicyEngine's ks_tanf_maximum_benefit on Enhanced CPS
  households in Kansas. The countable-income path is not yet encoded, so
  this scores the standards composition, not end-to-end eligibility.

# Not CI-runnable while engine-main x rulespec-us-main is broken: composed-root
# staging fails the engine's canonical-path scan (non-canonical filenames in
# us-la/us-nh/us-nj/us -- rulespec-us#1049) before any comparison runs;
# rulespec-us#1050 (removed plural corpus_citation_paths) and -- for the
# composed program lanes -- axiom-compose#29 and axiom-oracles#335 queue
# behind it. Manual lane only; drop this marker when the upstream chain lands
# (axiom-oracles#455 tracks the flip-back).
ci: manual

runner:
  type: axiom-oracles-compare
  axiom_rules_repo: $HOME/axiom-rules-engine
  parameters:
    # Loaded-case count overstates this suite (in-bridge filtering), so
    # the size heuristic under-persists; keep full per-case evidence.
    include_case_inputs: true
    left: axiom
    right: policyengine
    suite: ks-tanf-ecps
    concepts:
      - us-ks:policies/dcf/keesm#ks_tanf_maximum_benefit
    sample_size: 0
    period: 2026-01
    population: enhanced-cps
    python: "3.13"
    policyengine_version: "4.18.9"
    policyengine_us_version: "1.767.3"
    policyengine_core_version: "3.30.3"
    jurisdiction_fips: "20"
    axiom_compose_binary: $HOME/axiom-compose/.venv/bin/axiom-compose
    axiom_program: $HOME/axiom-oracles/programs/us-ks/tanf/fy-2026.yaml
    axiom_composed_program: /tmp/ks-tanf-composed.yaml
    axiom_compiled_program: /tmp/ks-tanf-compiled.json
    axiom_rulespec_repo_roots: $HOME/rulespec-us
    rulespec_roots:
      - $HOME/rulespec-us

artifacts:
  report_basename: axiom-policyengine-ks-tanf-ecps

dashboard:
  filename: axiom-policyengine-ks-tanf-ecps.json
  suite: ks-tanf-ecps
