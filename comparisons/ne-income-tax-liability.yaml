# Nebraska composed income-tax liability — Axiom pipeline vs PolicyEngine and
# TAXSIM on a modest case grid. The Axiom side is the composed rulespec-us
# pipeline us-ne/policies/income_tax/pilot_liability_pipeline, evaluated through
# the axiom rules engine (its liabilities are the engine-verified companion-test
# fixtures). Nebraska is progressive (Neb. Rev. Stat. 77-2715.03: 2.46/3.51/4.55/
# 4.55% for 2026 — L.B. 754 compresses the top two rates to a common 4.55% — over
# the inflation-indexed bracket floors).
#
# PolicyEngine and TAXSIM both run at the 2026 validation year: the pinned
# policyengine-taxsim 2.30.0 binary models 2026 law (its missing 2026
# qualifying-child credit machinery is not exercised by this childless grid),
# but its 2026 state module projects several parameters instead of applying
# enacted amounts; each residual is decomposed exactly in
# dispositions/ne-income-tax-liability.yaml rather than absorbed by tolerance.
#
# Run locally:
#   uv run python scripts/run_comparison.py ne-income-tax-liability

name: ne-income-tax-liability
title: Nebraska income tax liability — Axiom vs PolicyEngine and TAXSIM
description: >-
  Compares the composed Nebraska income-tax liability pipeline encoded in Axiom
  RuleSpec (us-ne/policies/income_tax/pilot_liability_pipeline) against
  PolicyEngine (ne_income_tax_before_credits) at 2026 and TAXSIM (siitax) at 2026
  on a modest grid of single and married filers crossing the state's brackets.

runner:
  type: state-income-tax-liability-grid
  parameters:
    state: NE
    period: "2026"
    taxsim_law_year: 2026
    rulespec_roots:
      - $HOME/TheAxiomFoundation/rulespec-us

artifacts:
  report_basename: axiom-policyengine-taxsim-ne-income-tax-liability

dashboard:
  filename: axiom-policyengine-taxsim-ne-income-tax-liability.json
  suite: ne-income-tax-liability
