name: ug-lst
title: Uganda Local Service Tax (salaried employees) — Axiom vs UGAMOD
description: >-
  Compares the rulespec-ug salaried-employee Local Service Tax (Act 8 of 2008,
  regulation 3 table: nil up to 100,000 a month, then ten bands from 5,000 to
  100,000 shillings a year) against UGAMOD tgv_s (SOUTHMOD A4.0, country UG,
  system UG_2025 = FY2025/26, dataset ug_2024_a1) for a formal employee
  (loc01=1): one mid-band case in each of the ten bands, one case 10,000 above
  the band-6 edge and one nil-band case. The suite feeds the SAME gross
  monthly employment income to both engines: to UGAMOD as gross yem
  (pre-divided by the UG_2025 employment uprating index) and to Axiom as the
  module's monthly_take_home_income input, with no bridge. UGAMOD bands on
  gross pay: probed live, 610,000 a month gross returns 60,000 (band 6),
  whereas a base net of the 5% NSSF share (579,500) would give band 5 and net
  pay after PAYE and NSSF (494,500) band 4. The statute and the module levy on
  "monthly take-home salary"; whether that means gross or net pay is an open
  methodology question that this suite does not decide. Under a net-pay
  reading 7 of the 12 cases (450,000 to 950,000 a month) would fall one or
  more bands lower, so the suite tests the band table on a gross base only.
  Run live exact on all 12 cases. Results are based on the tax-benefit
  microsimulation model for Uganda (UGAMOD) in SOUTHMOD_A4.0, developed,
  maintained and managed by UNU-WIDER with SASPRI, the LSE International
  Inequalities Institute and local partners, run on the EUROMOD software
  (EM_Executable 1.0.0 via the euromod connector 0.2.18) under the ug_2024_a1
  dataset configuration (Uganda Bureau of Statistics, Uganda National
  Household Survey 2023/24); only the dataset's variable list is read and
  every household is synthetic. The results and their interpretation are
  Axiom's responsibility. The SOUTHMOD bundle is licensed and
  non-redistributable: it is referenced only by path (euromod_model_root), and
  no model XML, dataset row, or DRD text is committed.

# Not runnable on the CI matrix runners. The SOUTHMOD bundle is licensed to
# Axiom by UNU-WIDER under the SOUTHMOD_A4.0 Adhesion Agreement, which bars
# providing the model or its input datasets to any third party (clause 4), so
# no shared runner can hold it; the runner also needs the x64 EUROMOD engine
# (EM_Executable.dll) under EUROMOD_PYTHON and a .NET runtime. Manual lane
# only: scripts/regenerate_euromod_ug.sh, where the licensed bundle and
# runtime exist, refreshes the committed report. This marker stays unless
# UNU-WIDER licenses a runner-held copy.
ci: manual

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: ug-lst
    population: synthetic
    sample_size: 0
    period: 2026
    euromod_model_root: $HOME/.axiom/oracles/southmod/bundle/SOUTHMOD_A4.0
    euromod_country: UG
    euromod_system: UG_2025
    euromod_dataset: ug_2024_a1
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-ug-lst.json

artifacts:
  report_basename: axiom-euromod-ug-lst

dashboard:
  filename: axiom-euromod-ug-lst.json
  suite: ug-lst
