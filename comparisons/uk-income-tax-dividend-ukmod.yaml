name: uk-income-tax-dividend-ukmod
title: UK dividend income tax — Axiom vs UKMOD
description: >-
  Compares the composed UK savings-and-dividend income-tax pipeline encoded in
  Axiom RuleSpec (Income Tax Act 2007 section 8 dividend rates, section 13
  dividend ordinary/upper/additional charging, section 13A dividend allowance,
  wired above earned income per the section 16 highest-part ordering) against
  CeMPA's UKMOD tin_s on a synthetic dividend-income grid. Earned income
  straddles the basic/higher/additional bands and dividends straddle the
  dividend allowance and the ordinary/upper/additional band edges. UKMOD reads
  taxable dividends through ydvtx (its generic projector sums interest and
  dividends into yiy, which the UK training_data configuration does not load,
  so the suite carries explicit rows). UKMOD runs the registration-free public model
  (UKMOD_PUBLIC_B2026.03, system UK_2026, dataset training_data). This suite
  runs where the x64 UKMOD runtime and model checkout are available and is
  regenerated by scripts/regenerate_euromod_uk.sh; on runners without them it
  re-emits the committed dashboard report.

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: uk-income-tax-dividend
    population: synthetic
    sample_size: 0
    period: 2026
    euromod_model_root: $HOME/Downloads/UKMOD_PUBLIC_B2026.03
    euromod_country: UK
    euromod_system: UK_2026
    euromod_dataset: training_data
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-uk-income-tax-dividend.json

artifacts:
  report_basename: axiom-euromod-uk-income-tax-dividend

dashboard:
  filename: axiom-euromod-uk-income-tax-dividend.json
  suite: uk-income-tax-dividend
