# California TANF -- Axiom vs PolicyEngine on Enhanced CPS, California households.

name: ca-tanf-ecps
title: California TANF -- Axiom vs PolicyEngine
description: >-
  Compares the California CalWORKs (TANF) grant from the composed us-ca/tanf
  program (W&I Code 11450 maximum aid payment schedules for regions 1 and 2,
  exempt and non-exempt, paying the MAP less countable income, floored at
  zero) against PolicyEngine's ca_tanf on Enhanced CPS households in
  California, using the canonical rulespec-us monorepo checkout. The
  program's v1 scope decisions (region by county FIPS, SSI as the exemption
  proxy, recipient month only) are documented in
  programs/us-ca/tanf/fy-2026.yaml.

# Not CI-runnable while engine-main x rulespec-us-main is broken: composed-root
# staging fails the engine's canonical-path scan (non-canonical filenames in
# us-la/us-nh/us-nj/us -- rulespec-us#1049) before any comparison runs;
# rulespec-us#1050 (removed plural corpus_citation_paths) and -- for the
# composed program lanes -- axiom-compose#29 and axiom-oracles#335 queue
# behind it. Manual lane only; drop this marker when the upstream chain lands
# (axiom-oracles#455 tracks the flip-back).
ci: manual

runner:
  type: axiom-oracles-compare
  axiom_rules_repo: $HOME/axiom-rules-engine
  parameters:
    # Loaded-case count overstates this suite (in-bridge filtering), so
    # the size heuristic under-persists; keep full per-case evidence.
    include_case_inputs: true
    left: axiom
    right: policyengine
    suite: ca-tanf-ecps
    concepts:
      - us-ca:policies/cdss/calworks#ca_tanf_benefit
    sample_size: 0
    period: 2026-01
    population: enhanced-cps
    jurisdiction_fips: "06"
    axiom_compose_binary: $HOME/axiom-compose/.venv/bin/axiom-compose
    axiom_program: $HOME/axiom-oracles/programs/us-ca/tanf/fy-2026.yaml
    axiom_composed_program: /tmp/ca-tanf-composed.yaml
    axiom_compiled_program: /tmp/ca-tanf-compiled.json
    axiom_rulespec_repo_roots: $HOME/rulespec-us
    rulespec_roots:
      - $HOME/rulespec-us

artifacts:
  report_basename: axiom-policyengine-ca-tanf-ecps

dashboard:
  filename: axiom-policyengine-ca-tanf-ecps.json
  suite: ca-tanf-ecps
