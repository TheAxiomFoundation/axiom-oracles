# Federal individual income tax — Axiom vs NBER TAXSIM, national.
#
# TAXSIM's national federal lane, scoped to the concepts that carry real
# national signal today:
#
# - The itemization-dependent federal concepts (liability, taxable income,
#   tax before credits, AMT) are EXCLUDED: the oracle-bridge's generated
#   state-income-tax leg implements Colorado only, and
#   _prepare_cases_for_engines filters those concepts to CO households
#   (smoke-verified 2026-08-23: a national sample prepared 0 cases). They
#   stay covered by co-tax-intersection-taxsim until the state bridge grows
#   beyond Colorado — that upstream extension is the unlock for a truly
#   national liability lane.
# - CTC and CDCC are EXCLUDED on signal grounds, not capability: the pinned
#   2.30.0 binary's 2026 law year lacks the child-credit machinery (CTC
#   collapses to the $500 ODC path, CDCC returns zero), so every row with
#   children would be the documented NBER gap and childless rows are
#   trivially zero — no information about Axiom either way. They remain
#   graded in the CO intersection lane where the gap classes are enrolled,
#   and become nationally gradable when a pinned binary models them.
# - EITC is INCLUDED: childless EITC is fully modeled at 2026 and carries
#   real signal; EITC-with-children rows surface as the standing
#   NBER-gap fingerprint class and must be enrolled before publication
#   (the unexplained ratchet holds new suites at ceiling 0).
#
# Run locally:
#   .venv/bin/python scripts/run_comparison.py fiit-taxsim-ecps --summary

name: fiit-taxsim-ecps
title: Federal income tax — Axiom vs TAXSIM (national)
description: >-
  Compares the composed oracle-bridge program's itemization-independent
  federal concepts — standard deduction, EITC, and employee-side FICA+SECA
  — against NBER TAXSIM-35 over the national certified Populace US
  population at the 2026 law year. The itemization-dependent concepts stay
  Colorado-scoped in co-tax-intersection-taxsim until the state-income-tax
  bridge grows beyond Colorado.

# Not CI-runnable while engine-main x rulespec-us-main is broken: composed-root
# staging fails the engine's canonical-path scan (rulespec-us#1049) before any
# comparison runs; rulespec-us#1050 queues behind it. Manual lane only; drop
# this marker when the upstream chain lands (axiom-oracles#455 tracks the
# flip-back).
ci: manual

runner:
  type: axiom-oracles-compare
  # Pinned to engine 0.1.0 @ 0c39023e — the exact identity in the last good
  # CO intersection run's provenance. Engine main (0.2.1, #103/#109 hard
  # cut) rejects the current rulespec-us tree (#1049/#1050) and flags a
  # cyclic derived dependency in the full federal bridge; v0.1.1 (release
  # cut) additionally hard-errors on inputs the July tree's EITC rules
  # expect the ECPS projection to omit. Revisit when axiom-oracles#455
  # flips the lanes back.
  axiom_rules_repo: $HOME/axiom-rules-engine-0c39023e
  parameters:
    left: axiom
    right: taxsim
    population: enhanced-cps
    sample_size: 0
    period: "2026"
    suite: fiit-taxsim-ecps
    concepts:
      - us:tax/federal-income-tax#standard_deduction
      - us:tax/federal-income-tax#eitc
      - us:tax/payroll#employee_fica
    # Pinned rulespec-us snapshot (ca2d424f, 2026-07-27 — the revision the
    # last good CO intersection compile ran on). Current main introduces a
    # cyclic derived dependency in the federal credits/AMT web (education
    # credits x income_tax; smoke 2026-08-23, reproduced on BOTH engine
    # contracts) — file upstream and re-point at $HOME when fixed.
    axiom_rulespec_repo_roots: $HOME/oracle-pins

artifacts:
  report_basename: axiom-taxsim-fiit-ecps

dashboard:
  filename: axiom-taxsim-fiit-ecps.json
  suite: fiit-taxsim-ecps
