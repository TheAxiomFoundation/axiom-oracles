# Federal individual income tax — Axiom vs NBER TAXSIM, national.
#
# TAXSIM's national federal rollout: serves the composed oracle-bridge
# program's federal concepts against the pinned TAXSIM-35 binary over the
# national Populace population — the same concept set the Colorado
# intersection lane grades, minus the state leg.
#
# CAVEAT to verify on first run: co-tax-intersection-taxsim scoped itself to
# Colorado because the composed oracle-bridge's SALT itemization leg was
# Colorado-scoped. If the composed program still requires a state-scoped
# SALT leg, the itemization-sensitive concepts (liability, taxable income,
# tax before credits) will need either a state-neutral SALT leg upstream or
# per-state sharding of this lane. The smoke run gates this suite's first
# full regeneration.
#
# Known TAXSIM-side gap at the 2026 law year (docs/policyengine-taxsim.md):
# child-credit machinery absent — CTC collapses to the $500 ODC path; ACTC,
# CDCC, EITC-with-children return zero. Those residuals are NBER gaps and
# enroll in dispositions as the intersection lane's existing classes.
#
# Known Axiom-side scope carve-out: the composed program excludes
# us:statutes/26/1411 (NIIT) until axiom-encode#1213 resolves the duplicate
# 911/a rule; TAXSIM fiitax includes NIIT, so units above the 1411
# thresholds carry a liability residual equal to TAXSIM's own niit column.

name: fiit-taxsim-ecps
title: Federal income tax — Axiom vs TAXSIM (national)
description: >-
  Compares the composed oracle-bridge program's federal tax concepts —
  liability, standard deduction, taxable income, tax before credits, EITC,
  CTC, CDCC, AMT, and employee-side FICA+SECA — against NBER TAXSIM-35 over
  the national certified Populace US population at the 2026 law year.

# Not CI-runnable while engine-main x rulespec-us-main is broken: composed-root
# staging fails the engine's canonical-path scan (rulespec-us#1049) before any
# comparison runs; rulespec-us#1050 queues behind it. Manual lane only; drop
# this marker when the upstream chain lands (axiom-oracles#455 tracks the
# flip-back).
ci: manual

runner:
  type: axiom-oracles-compare
  axiom_rules_repo: $HOME/axiom-rules
  parameters:
    left: axiom
    right: taxsim
    population: enhanced-cps
    sample_size: 0
    period: "2026"
    suite: fiit-taxsim-ecps
    concepts:
      - us:tax/federal-income-tax#liability
      - us:tax/federal-income-tax#standard_deduction
      - us:tax/federal-income-tax#taxable_income
      - us:tax/federal-income-tax#tax_before_credits
      - us:tax/federal-income-tax#eitc
      - us:tax/federal-income-tax#ctc
      - us:tax/federal-income-tax#cdcc
      - us:tax/federal-income-tax#amt
      - us:tax/payroll#employee_fica
    axiom_rulespec_repo_roots: $HOME

artifacts:
  report_basename: axiom-taxsim-fiit-ecps

dashboard:
  filename: axiom-taxsim-fiit-ecps.json
  suite: fiit-taxsim-ecps
