# Federal Lifetime Learning Credit — Axiom vs PolicyEngine-US, tax year 2026.
#
# Axiom exposes both the section 25A(c)-(d) potential and the final amount
# after the section 26 liability/credit-order cap. The fixed post-2020
# parameters are 20% of up to $10,000 aggregate expenses, phased over
# $80,000-$90,000 nonjoint and $160,000-$180,000 joint MAGI. This suite binds
# the final output; `llc-liability-cap-diagnostic` proves the potential $2,000
# is capped to $500.
# Sources:
# https://www.law.cornell.edu/uscode/text/26/25A
# https://www.irs.gov/instructions/i8863
# RuleSpec: rulespec-us@dc6602f2
# us/policies/income_tax/lifetime_learning_credit_pipeline.yaml:15-92,95-221.
#
# PolicyEngine binding: public `lifetime_learning_credit`, which is likewise
# `min(lifetime_learning_credit_credit_limit,
# lifetime_learning_credit_potential)`. The potential aggregates eligible
# Person expenses, applies the $10,000 cap and 20% rate, then uses the fixed
# MAGI phaseout. Filing status is supplied explicitly so education members
# cannot be misclassified as a spouse. All 12 companion cases, including the
# two-student aggregate cap and $500 liability cap, are exactly expressible.
# Code: policyengine-us@49d19b239a593dbac8920ac6fd80cfe33372343a
# policyengine_us/variables/gov/irs/credits/education/
# lifetime_learning_credit_potential.py:13-29;
# .../lifetime_learning_credit.py:4-16;
# .../lifetime_learning_credit_credit_limit.py;
# policyengine_us/parameters/gov/irs/credits/education/
# lifetime_learning_credit/{rate,expense_limit,phase_out}.yaml.
#
# Run locally:
#   uv run python scripts/run_comparison.py us-llc-grid --summary

name: us-llc-grid
title: Federal Lifetime Learning Credit — Axiom vs PolicyEngine
description: >-
  Compares the final Lifetime Learning Credit on all 12 ground-truth companion
  cases, including aggregate-expense, exact-phaseout, and liability-cap
  diagnostics.

runner:
  type: federal-tax-liability-grid
  parameters:
    policy: lifetime_learning_credit
    period: "2026"
    concept: >-
      us:policies/income_tax/lifetime_learning_credit_pipeline#federal_lifetime_learning_credit
    python: "3.13"
    policyengine_version: "4.18.9"
    policyengine_us_version: "1.767.3"
    policyengine_core_version: "3.30.3"
    rulespec_remote: https://github.com/TheAxiomFoundation/rulespec-us.git
    rulespec_roots:
      - $HOME/TheAxiomFoundation/rulespec-us
    rulespec_upstream_sha: 3373e8411f7e141fd50879e3de964386f606f7f6
    rulespec_upstream_tree: 7e00f195ea81ff9aa21c58d53151e937d974a016

artifacts:
  report_basename: axiom-policyengine-us-llc-grid

dashboard:
  filename: axiom-policyengine-us-llc-grid.json
  suite: us-llc-grid
