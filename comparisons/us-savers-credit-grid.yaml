# Federal Saver's Credit — Axiom vs PolicyEngine-US, tax year 2026.
#
# Axiom boundary: the statutory section 25B credit before section 26, using
# completed per-Person contributions after testing-period distributions.
# Notice 2025-67 publishes the 2026 50%/20%/10% maxima as
# $48,500/$52,500/$80,500 joint and $24,250/$26,250/$40,250 single. Axiom
# caps each eligible spouse's contributions separately at $2,000.
# Sources:
# https://www.irs.gov/irb/2025-49_IRB
# https://www.irs.gov/retirement-plans/plan-participant-employee/
# retirement-savings-contributions-credit-savers-credit
# RuleSpec: rulespec-us@dc6602f2
# us/policies/income_tax/savers_credit_pipeline.yaml:15-49,58-292,296-385.
#
# PolicyEngine binding: `savers_credit_potential`, not public
# `savers_credit`. The potential adds `savers_credit_person`, so each spouse
# receives an independent $2,000 cap; `savers-joint-both` is the $2,000 truth
# test. The public variable separately applies a liability/credit-order cap
# and does not match this pre-section-26 boundary.
#
# PE-US 1.767.3 stores the correct numeric thresholds in
# `gov.irs.credits.retirement_saving.rate.joint` and the correct filing-status
# adjustments. Its single-amount scale treats each stored maximum as the next
# bracket's lower bound, though, so equality at $24,250 single receives 20%
# instead of the Notice's inclusive 50%. `savers-at-first-threshold` carries
# that real upstream gap (Axiom 1,000, PE 400) without tolerance changes.
# Code: policyengine-us@49d19b239a593dbac8920ac6fd80cfe33372343a
# policyengine_us/parameters/gov/irs/credits/retirement_saving/rate/
# {joint,threshold_adjustment}.yaml;
# policyengine_us/variables/gov/irs/credits/retirement_savings/
# savers_credit_person.py:17-36;
# .../savers_credit_potential.py:4-15;
# .../savers_credit.py:4-18;
# policyengine-core@3.30.3
# policyengine_core/taxscales/single_amount_tax_scale.py.
#
# Run locally:
#   uv run python scripts/run_comparison.py us-savers-credit-grid --summary

name: us-savers-credit-grid
title: Federal Saver's Credit — Axiom vs PolicyEngine
description: >-
  Compares the pre-section-26 Saver's Credit on all 12 ground-truth companion
  cases, including two separately capped spouses and an evidence-dispositioned
  inclusive-threshold divergence.

runner:
  type: federal-tax-liability-grid
  parameters:
    policy: savers_credit
    period: "2026"
    concept: >-
      us:policies/income_tax/savers_credit_pipeline#federal_savers_credit
    python: "3.13"
    policyengine_version: "4.18.9"
    policyengine_us_version: "1.767.3"
    policyengine_core_version: "3.30.3"
    rulespec_remote: https://github.com/TheAxiomFoundation/rulespec-us.git
    rulespec_roots:
      - $HOME/TheAxiomFoundation/wt-fed-credits

artifacts:
  report_basename: axiom-policyengine-us-savers-credit-grid

dashboard:
  filename: axiom-policyengine-us-savers-credit-grid.json
  suite: us-savers-credit-grid
