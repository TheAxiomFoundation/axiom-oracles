name: ug-vat
title: Uganda VAT standard rate — Axiom vs UGAMOD
description: >-
  Compares the rulespec-ug 18% standard VAT rate (Value Added Tax (Rate of
  Tax) Order 2006) against UGAMOD tva_s (SOUTHMOD A4.0, country UG, system
  UG_2025 = FY2025/26, dataset ug_2024_a1) on one household buying a single
  standard-rated item (restaurant meals, x1111101; a nominal 1,200,000 a year,
  which UG_2025 uprates to 1,207,776.66). Consumption x-vars carry their own
  uprating index, and detailed COICOP inputs are not echoed in the UG_2025
  output frame, so the Axiom taxable_value is bridged from il_exp_vat01,
  UGAMOD's post-uprating standard-rated VAT base, which the engine does
  output. The base is read from that output, not inverted from tva_s, so the
  case tests the 18% rate rather than restating it. Run live exact (probed:
  tva_s = 0.18 x il_exp_vat01). The case adopts UGAMOD's convention that the
  expenditure figure is the VAT-exclusive taxable value, so it says nothing
  about whether survey spending is VAT-inclusive. Results are based on the
  tax-benefit microsimulation model for Uganda (UGAMOD) in SOUTHMOD_A4.0,
  developed, maintained and managed by UNU-WIDER with SASPRI, the LSE
  International Inequalities Institute and local partners, run on the EUROMOD
  software (EM_Executable 1.0.0 via the euromod connector 0.2.18) under the
  ug_2024_a1 dataset configuration (Uganda Bureau of Statistics, Uganda
  National Household Survey 2023/24); only the dataset's variable list is read
  and every household is synthetic. The results and their interpretation are
  Axiom's responsibility. The SOUTHMOD bundle is licensed and
  non-redistributable: it is referenced only by path (euromod_model_root), and
  no model XML, dataset row, or DRD text is committed.

# Not runnable on the CI matrix runners. The SOUTHMOD bundle is licensed to
# Axiom by UNU-WIDER under the SOUTHMOD_A4.0 Adhesion Agreement, which bars
# providing the model or its input datasets to any third party (clause 4), so
# no shared runner can hold it; the runner also needs the x64 EUROMOD engine
# (EM_Executable.dll) under EUROMOD_PYTHON and a .NET runtime. Manual lane
# only: scripts/regenerate_euromod_ug.sh, where the licensed bundle and
# runtime exist, refreshes the committed report. This marker stays unless
# UNU-WIDER licenses a runner-held copy.
ci: manual

runner:
  type: euromod-synthetic-compare
  axiom_rules_repo: $HOME/TheAxiomFoundation/axiom-rules-engine
  parameters:
    suite: ug-vat
    population: synthetic
    sample_size: 0
    period: 2026
    euromod_model_root: $HOME/.axiom/oracles/southmod/bundle/SOUTHMOD_A4.0
    euromod_country: UG
    euromod_system: UG_2025
    euromod_dataset: ug_2024_a1
    axiom_rulespec_repo_roots: $HOME/TheAxiomFoundation
    dashboard_filename: axiom-euromod-ug-vat.json

artifacts:
  report_basename: axiom-euromod-ug-vat

dashboard:
  filename: axiom-euromod-ug-vat.json
  suite: ug-vat
