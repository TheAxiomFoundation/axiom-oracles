  - id: uk-pe:state_pension
    oracle_policy_name: state_pension
    oracle_policy_type: rules
    output_vars:
      - state_pension
    in_scope: false
    exclusion_reason: input_carrying
    note: 'PE-UK carries the State Pension as an uprated reported amount, not an accrual computation,
      so there is no commensurable statutory surface. The top-level state_pension formula sums basic_state_pension
      + additional_state_pension + new_state_pension and applies an uprating factor (so the generator''s
      shallow kind heuristic, reading only the summing top-level formula, labels it rules); but each component
      is a state_pension_reported passthrough. basic_state_pension and new_state_pension read the FRS-reported
      gross State Pension (state_pension_reported), take its share of the data-year flat maximum (share
      = min(reported, max_data) / max_data) and re-base that share onto the period maximum; additional_state_pension
      is the reported amount above the flat ceiling, uprated. None reads a National Insurance qualifying-years
      record — the award is the reported amount, uprated and bucketed by magnitude and state_pension_type.
      The rulespec encoding (uk/policies/govuk/state-pension.yaml) instead computes entitlement from qualifying
      years (new: full_new_state_pension_weekly_rate × min(1, qualifying_years/35), Pensions Act 2014
      s.3; basic: category-A basic rate × min(1, qualifying_years/30), SSCBA 1992 s.44; weekly rates from
      SI 2026/148). The two surfaces are not commensurable: PE consumes a reported money amount, rulespec
      a qualifying-years count, with no mapping between them, so the only achievable agreement is by construction
      (feeding both the "full" case), which is vacuous. Same reported-carry class as sda (SSCBA 1992 s.68
      — reads sda_reported × max rate) and esa_income; corrects the prior note''s "from accrual rules"
      — PE does not model accrual (matrix row 4 → Pensions Act 2014; SSCBA 1992 s.44).'
