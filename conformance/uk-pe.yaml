    in_scope: true
    suite: uk-business-rates
    note: Covered by the uk-business-rates case-grid suite. PE-UK does not compute an individual ratepayer's
      bill (the LGFA 1988 Pt III multiplier and reliefs); its business_rates is a distributional incidence
      model — shareholding times the total non-domestic rates revenue across England, Scotland, Wales
      and Northern Ireland. The rulespec module (uk/policies/govuk/business-rates.yaml, LGFA 1988 s.43
      enabling authority) restates that product with both quantities as supplied inputs, so the surfaces
      are commensurable; all 6 cases match to the penny in relative terms, residuals being PE float32
      artifacts on the large revenue magnitude (matrix row 7 → LGFA 1988 Pt III).
