      (BE_2025 bases the credit on the UNCAPPED i_tsceerdA_s/i_tsceerdB_s schedule rather than the reductions
      actually granted) and are dispositioned upstream_engine_gap, so explained_rate is 100 with unexplained_total
      0. Scope note on the other tinfe_be outputs, kept honest: EUROMOD BE_2025 computes tintcch_s as
      a flat 350 EUR per dependent child low-tax reduction (the $tinfe_ChildRed_Amt mechanism), NOT the
      Article 145/35 childcare-EXPENSE reduction; and BE_2025''s tinfe_be simulates neither the encoded
      Article 145/8 pension-savings reduction nor the Article 145/35 childcare-expense, Article 145/33
      donation, or service-voucher reductions (no input columns or constants for them in the model). Those
      encoded instruments therefore have no BE_2025 oracle counterpart and remain the documented residual
      gap — coverage here is the work-bonus-EITC (tintcly_s) component only.'
