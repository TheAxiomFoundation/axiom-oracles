  - id: uk:tinta_uk
    oracle_policy_name: tinta_uk
    oracle_policy_type: tax
    output_vars:
      - tinta_s
    in_scope: true
    oracle_switch: 'on'
    internal_only_vars:
      - i_tinta_IncExcess2
      - i_tinta_PersAllow
    suite: uk-personal-allowance
    note: 'TAX: Personal tax allowance. The UK_2026 policy is switch=on and computes the final personal
      allowance tinta_s = preliminary allowance $ITPerAll less the income-limit taper (half of taxable
      income il_tinty in excess of $ITAllLim, floored at zero) — i.e. the Income Tax Act 2007 s.35(1)-(3)
      allowance with its adjusted-net-income withdrawal. This is a genuine, cleanly comparable surface:
      it needs only an income sweep on a single individual (no household structure, receipt history, or
      take-up draw), so it is the most directly gradable of the uncovered UK surfaces. rulespec-uk encodes
      exactly this computation — uk_pit_pilot_personal_allowance in pilot_worker_oracle_pipeline is ceil(max(0,
      personal_allowance_base_amount - max(0, adjusted_net_income - adjusted_net_income_reduction_threshold)/2))
      against ITA 2007 s.35. The uk-personal-allowance suite now surfaces uk_pit_pilot_personal_allowance
      against tinta_s directly on a single-individual sweep (40k/100k/110k/125.14k/150k straddling the
      taper and full withdrawal); the concept mapping binds it to euromod tinta_s, and the comparison
      (comparisons/uk-personal-allowance-ukmod.yaml) regenerates on the x64 UKMOD runner via scripts/regenerate_euromod_uk.sh.
      Covered once that runner commits axiom-euromod-uk-personal-allowance.json (the euromod runtime has
      no macOS wheel, so the live match rate is generated on the provisioned runner, per axiom-oracles#190).
      Evidence: UK.xml UK_2026 tinta_uk function body; rulespec-uk s.35 encoding.'
