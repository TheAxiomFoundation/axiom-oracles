    suite: uk-scottish-carer-supplement
    note: 'BEN: Scottish Carer''s Allowance Supplement (from Sept 2018). The UK_2026 policy is switch=on
      and computes a distinct payable instrument bcrdicm_s = the flat weekly supplement $CASupW, gated
      on being a Carer''s Allowance recipient in Scotland (Elig_Cond (bcrdi>0) & (drgn1=12)); it then
      sums bcrdi + bcrdicm_s into i_bcrdi for downstream means tests. It is a genuine comparable surface
      (a flat supplement on a Scottish-carer case), NOT input-carrying — distinct from the boact_uk/PAA_uk
      uprating- passthrough exclusions. Two properties bound its comparability: (i) eligibility keys off
      bcrdi, the reported Carer''s Allowance data input — which IS an admissible column of the registration-free
      training_data schema (verified: bcrdi present in Input/training_data.txt), so a supplied-receipt
      synthetic case (bcrdi>0, drgn1=12) can fire the supplement (this is NOT an oracle_dataset_lacks_input
      case — the activating input exists); (ii) it is a devolved Scotland-only payment. The encoding blocker
      is Axiom-side: rulespec-uk does not encode the supplement (no Social Security (Scotland) Act 2018,
      asp 9, s.70-74 CAS surface), and the supplement passports off Carer''s Allowance, which is itself
      unencoded (rulespec-uk#55, SSCBA 1992 s.70) — so CAS needs CA encoded first, then the flat weekly
      supplement layered on a Scottish-carer case. Uncovered next-wave surface pending that encoding;
      the supplied-receipt grid + x64 UKMOD regen make it gradable once encoded (evidence: UK.xml UK_2026
      bcrdicm_uk function body; training_data.txt bcrdi column; rulespec-uk#55).'
