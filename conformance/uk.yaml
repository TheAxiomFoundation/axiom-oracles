    note: 'BEN: Free School Meals (Scotland). EXCLUDED oracle_models_nonstatutory_amount. Not a Child
      Benefit education-age extension despite the bch* prefix. bched01_s is a passported, means-tested
      devolved benefit: eligibility passports off receipt of other means-tested awards (bsa_s, bunmt_s,
      bsadi_s, bfamt_s/bwkmt_s with il_TC_means thresholds, bsauc_s with i_UC_means_earned_adj, boamtmm_s)
      crossed with primary/secondary age bands and region (drgn1=12 Scotland, drgn1=13 NI), valued at
      $BFSMprim / $BFSMsec and scaled by the take-up factors $BFSMPrUnTakeUp/$BFSMPrMtTakeUp/$BFSMScMtTakeUp.
      Not encoded in Axiom (no FSM pipeline in rulespec-uk), and the synthetic UK grids run drgn1=2, so
      no current case activates it. Groundability assessment (this-wave): FSM is not a standalone statutory
      rate-and-threshold rule that grounds cleanly like the Scottish Child Payment — it is a passported
      service (Education (Scotland) Act 1980 s.53-55 powers; devolved Scottish/NI administration) whose
      eligibility is derived from receipt of the upstream means-tested benefits and whose rate is set
      administratively and take-up-scaled. Encoding it therefore requires the upstream benefits (UC/IS/JSA/ESA/HB/PC)
      encoded first plus a non-standard derived-entitlement layer, not a self-contained corpus ingest.
      Exclusion basis (verified 2026-07-07 against primary sources): s.53 of the Education (Scotland)
      Act 1980 imposes an IN-KIND duty to "provide ... a school lunch, free of charge" (s.53(2)) with
      NO monetary amount — FSM pays no cash, so UKMOD''s bched01_s is a modelled per-meal cost-equivalent,
      not a legislated cash award. The qualifying-income thresholds ARE statutory (e.g. the UC net-earnings
      limit raised to GBP 995/month from 1 April 2026 by SSI 2025/44 amending the 1980 Act), but no benefit
      AMOUNT exists in statute for Axiom (which encodes statutory monetary rules) to compare — so it is
      not comparable from statute.'
