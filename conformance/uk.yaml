    in_scope: true
    oracle_switch: 'on'
    suite: uk-child-benefit
    note: 'BEN: Child Benefit. The uk-child-benefit suite live-compares the composed UK Child Benefit
      pipeline (SSCBA 1992 s.141 with the SI 2006/965 reg.2 enhanced GBP 27.05 / other GBP 17.90 weekly
      rates, annualised over 52 weeks) against UKMOD''s pre-charge Child Benefit on a single-parent grid
      (one/two/three children x 20k/70k/80k/90k straddling the HICBC taper), matching 12/12. The gross
      surface bridges to UKMOD by summing paid bch_s and the separately-reported charge clawback bchrd_s
      (UKMOD policy bchrd_uk nets the clawback into bch_s), so the summed [bch_s, bchrd_s] reconstructs
      the gross pre-charge entitlement — the parity target. The HICBC (ITEPA 2003 ss.681B-681H) is now
      corpus-grounded (axiom-corpus#221) and encoded on the Axiom side (rulespec-uk#84 closed #75), so
      the suite also wires a net-of-charge surface (bch_s alone vs Axiom''s post-charge amount); the committed
      report exercises the gross bridge surface. The ~0.27% 52-vs-52.14-weeks convention residual is inside
      tolerance; all cases recover the same statutory weekly rates. bch_s is the compared surface, so
      bch_uk is covered.'
