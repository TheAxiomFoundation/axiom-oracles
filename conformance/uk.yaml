      The CWHA payment itself is not encoded in Axiom, and the synthetic UK grids run drgn1=2 with no
      disability inputs, so no current case activates it. Groundability assessment (this-wave): CWHA is
      the readiest of the three devolved bch* rows to encode — it is a clean flat-rate top-up (not a take-up-scaled
      passported service like FSM/School Clothing), its disability passport is ALREADY encoded (rulespec-uk
      uk/policies/govuk/disability-living-allowance.yaml and personal-independence-payment.yaml, WRA 2012
      ss.77-79), and its gating care indicators (bdisc, bdiscwa) are admissible columns of the training_data
      schema. Uncovered until the flat CWHA amount (Scotland, child under 18, highest-rate care) is encoded
      on top of that passport and a Scotland/disability surface is built with the care inputs supplied;
      requires the x64 UKMOD runtime to regenerate. Out of scope for the child-benefit + benefit-cap lane.'
