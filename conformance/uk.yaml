  - id: uk:bunct_uk
    oracle_policy_name: bunct_uk
    oracle_policy_type: ben
    output_vars:
      - bunct_s
      - liwmy_s
      - yempv_s
    in_scope: true
    oracle_switch: 'on'
    internal_only_vars:
      - i_bunct_IncDisregard
    suite: uk-contribution-based-jsa
    note: 'BEN: Contributory unemployment benefit (contribution-based Jobseeker''s Allowance). The UK_2026
      policy is switch=on and, once eligible, computes a distinct payable bunct_s from statute (age-banded
      rate $JSARate1824/$JSARate withdrawn pound-for-pound against the pension/earnings disregard base
      i_bunct_IncDisregard) — so it is NOT input-carrying. But eligibility is data-gated on the reported
      benefit-receipt input: the "eligibility fully simulated" Elig function is switch=OFF (its own comment
      warns it "will SEVERELY overestimate eligibility"), and the active path derives the qualifying-months
      variable liwmy_s from (bunct>0) receipt or an (les=5) unemployment status plus a liwwh work-history
      threshold, then gates the final Elig on liwmy_s>=$UB_QperMin. The activating inputs ARE admissible
      columns of the registration-free training_data schema (verified: bunct and liwwh both present in
      Input/training_data.txt; liwmy_s is derived, not a raw column), so this is NOT an oracle_dataset_lacks_input
      case — the current synthetic grids simply set them to non-activating values (no receipt, drgn1=2).
      A supplied-receipt/history case (bunct>0 or les=5 with liwwh above the work-history threshold) fires
      bunct_s from statute, so the surface is comparable for those cases (testing UKMOD''s rate and withdrawal
      arithmetic, not its eligibility). The encoding blocker is Axiom-side: rulespec-uk does not encode
      contributory JSA (only the income-based JSA capital tariff, uksi/1996/207/116; the contributory
      scheme itself — Jobseekers Act 1995, age-banded flat rates $JSARate1824/$JSARate with pound-for-pound
      earnings withdrawal — is unencoded, adjacent to rulespec-uk#53). Uncovered next-wave surface, comparable
      under supplied-receipt cases once the contributory rates are encoded (evidence: UK.xml UK_2026 bunct_uk
      function body + verbatim "SEVERELY overestimate eligibility" switch-off comment; training_data.txt
      bunct/liwwh columns; rulespec-uk#53).'
