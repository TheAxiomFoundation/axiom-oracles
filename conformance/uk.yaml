      duty with NO monetary amount; the "national minimum" school clothing grant (GBP 120 primary / GBP
      150 secondary) is a Scottish Government-COSLA administrative agreement, NOT fixed in any SSI, and
      each of the 32 local authorities sets its own amount above that floor. So bched02_s pays an administratively-set,
      LA-varying figure with no statutory basis for Axiom to encode — not comparable from statute.'
