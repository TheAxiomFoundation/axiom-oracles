    suite: uk-benefit-cap
    note: 'BEN: benefit cap on Housing Benefit and Universal Credit (UC Regs 2013 reg 80A/81). bcap_uk
      computes the cap reduction, not a benefit: brd_s reduces the legacy-benefit stack (i_bcap_finalAmt
      = (bsa_s+bsadi_s+bho_s+bwkmt_s+bfamt_s) - brd_s) and brduc_s reduces UC (i_bcap_finalAmt += bsauc_s
      - brduc_s), each capped at the relevant award and gated by the reg-80A annual limits (single GBP
      14,753 / couple-or-lone-parent GBP 22,020, London GBP 16,967 / 25,323) via amount#2/#4. bcap_uk
      writes brd_s/brduc_s/bsadi02_s but does NOT write back into bsauc_s or bho_s: UKMOD reports the
      UNCAPPED award and carries the cap effect only in the separate reduction outputs (verified: no bcap_uk
      function outputs bsauc_s in UK_2026). The uk-benefit-cap suite covers the UC reduction output brduc_s
      against the composed UC pilot''s uc_pilot_benefit_cap_reduction (the direct analog of the reg-80A/81
      reduction: rulespec-uk uk/regulations/uksi/2013/376/80A and /81, applied inside universal_credit_composed_award_pipeline).
      It matches 7/7 on the single-no-child cases (UKMOD''s cap base il_bencap equals bsauc_s when child
      benefit is nil, to a <= GBP 0.17/month weekly-rounding residual absorbed by the GBP 1 tolerance)
      and the nil-reduction cases (earnings-exempt, and the couple-no-child unit that matches no UKMOD
      UC-cap branch — i_bcap_AmtCap covers only couple/lone-parent-with-child and single-no-child). The
      grid is deliberately single-no-child: a with-children unit would diverge because UKMOD''s il_bencap
      sums bsauc_s + child benefit (bch_s) + other welfare while the single-benefit UC pilot base is UC-only,
      so the pilot reduction would be smaller by exactly the monthly child benefit. That is a known Axiom
      cap-base scope boundary (the UC-only pilot does not add non-UC welfare to the reg-81 excess), not
      a defect in the reg-80A/81 reduction the pilot encodes, so it is documented here rather than compared.
      brd_s (the legacy-benefit reduction) likewise stays uncovered — the Axiom UC pilot is UC-only. Runs
      on the x64 UKMOD runtime.'
  - id: uk:bch_uk
