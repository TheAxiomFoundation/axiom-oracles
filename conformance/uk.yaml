    note: 'BEN: Scottish Child Payment (UKMOD comment "BEN: Child Payment (Scotland)"), not a Child Benefit
      means-test variant despite the bch* prefix (distinct from the excluded bchmt01_uk SCP bridging scheme).
      bchmt_s is a devolved Scotland-only (drgn1=12) means-tested payment: eligibility passports off il_bchmt
      (the summed qualifying awards boamt_s+bsadi_s+bunmt_s+bsa_s+bwkmt_s+bfamt_s+bsauc_s) with dependent
      children in the benefit unit, and the final BenCalc consumes UKMOD''s stochastic take-up draw (i_rand_tu<=$SCPTUu6y
      for children under 6 / <=$SCPTU6to15y for 6-15, switch=switch) so the reported bchmt_s is take-up-adjusted
      away from the statutory entitlement — the same take-up-draw exposure documented for bsauc_s. Axiom
      DOES encode the Scottish Child Payment (rulespec-uk uk/policies/govuk/scottish-child-payment.yaml,
      SSI 2020/351 regs 18/20, output scottish_child_payment_annual_amount = weekly amount * weeks_in_year,
      gated on person_lives_in_scotland and child_age<max_age and applicant_or_partner_receives_qualifying_benefit),
      so the prior "not encoded" note was stale. It is uncovered only because the synthetic UK grids run
      drgn1=2, so no current case activates it. Build path (child-benefit-style Scotland surface): a benefit-unit
      grid routed to Scotland (drgn1=12) that produces a qualifying means-tested award so UKMOD''s il_bchmt
      fires, comparing scottish_child_payment_annual_amount against bchmt_s with the take-up constants
      pinned to 1.0 via euromod_constant_overrides ($SCPTUu6y/$SCPTU6to15y, per the #168 study-allowance/UC-PC
      take-up-pinning pattern) so bchmt_s reports the statutory entitlement; requires the x64 UKMOD runtime
      to regenerate. Out of scope for the child-benefit + benefit-cap lane.'
  - id: uk:bchrd_uk
    oracle_policy_name: bchrd_uk
    oracle_policy_type: ben
    output_vars:
      - bch_s
      - bchrd_s
    in_scope: true
    oracle_switch: 'on'
    suite: uk-child-benefit
    note: 'BEN: Reduce child benefit (from 2013) — the High Income Child Benefit Charge clawback (ITEPA
      2003 ss.681B-681H). bchrd_uk computes bchrd_s = ((adjusted_net_income - $ITCBthresh)/200)*1% * bch_s,
      capped at bch_s, then nets bchrd_s back into bch_s (UK_2026: threshold GBP 60,000, full clawback
      at GBP 80,000). The uk-child-benefit suite live-compares the composed Axiom Child Benefit pipeline
      against UKMOD''s gross pre-charge entitlement whose euromod target is the summed list [bch_s, bchrd_s]
      — so bchrd_uk''s distinct output bchrd_s is exercised as a summand of the compared surface (matching
      12/12 on the single-parent grid whose income sweep 20k/70k/80k/90k straddles the taper). The HICBC
      is now corpus-grounded (axiom-corpus#221) and encoded on the Axiom side (rulespec-uk#84 closed #75),
      so a direct net-of-charge surface (bch_s alone vs Axiom''s post-charge entitlement) is wired into
      the suite too; the committed report exercises the gross bridge surface, which already consumes bchrd_s.
      bchrd_s is a compared surface, so bchrd_uk is covered — mirroring bch_uk.'
  - id: uk:bcrdicm_uk
