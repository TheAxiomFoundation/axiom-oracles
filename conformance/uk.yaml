    exclusion_reason: oracle_models_repealed_law
    note: 'BEN: Tax credits (Working Tax Credit and Child Tax Credit). EXCLUDED oracle_models_repealed_law.
      Tax credits ended 5 April 2025 (GOV.UK www.gov.uk/tax-credits-have-ended) — abolished from the 2025-26
      tax year, no new claims and no payments after 5 April 2025; the caseload migrated to Universal Credit
      / Pension Credit. UKMOD UK_2026 retains bwkmt_bfamt_uk (switch=on, outputs bwkmt_s/bfamt_s/bwkmtcm_s/bfamttm_s/ydg04_s)
      but gates entitlement through the same Universal-Credit transition as Housing Benefit (''taker of
      ben bef 1st obs trans'' — new claims routed to UC), so on the registration-free training_data no
      synthetic case is a pre-transition legacy tax-credit claimant. PROBE (scripts/probe_uk_repealed_and_missing_input.py,
      live UKMOD_PUBLIC_B2026.03/UK_2026): single childless 30h (les=2 and les=3) and a lone parent with
      one child at 35h all return bwkmt_s=0 and bfamt_s=0 with the WTC/CTC take-up rates pinned to 1.0
      and $UCtransition=0 (the wave-2 note''s nonzero figures are not reproducible on UK_2026). Because
      WTC/CTC are repealed, rulespec-uk encodes no current-law tax-credit surface by design, so no dataset
      input would make this comparable — the exclusion is oracle_models_repealed_law, distinct from oracle_dataset_lacks_input.'
