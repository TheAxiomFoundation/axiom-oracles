  reason: compared_surface_differs
  note: All 13 compared surfaces resolve; the income-tax ones are income_tax, income_tax_main_rates and
    income_tax_capped_non_refundable_credits — not income_tax_before_refundable_credits.
- jurisdiction: us-pe
