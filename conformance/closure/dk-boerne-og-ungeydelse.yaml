    summary: For børn under 15 år udbetales en skattefri børneydelse. For børn mellem 15 og 17 år udbetales
      en skattefri ungeydelse. Beløbene reguleres årligt efter forbrugerprisindekset, afrundes til nærmeste
      kronebeløb, der kan deles med 12, og forhøjes i 2023 derudover samlet med 660 kr.
    source_sha256: 2e135cac3ca5eb201b948ca915bf9554e864a09ebc8576c2603b6115730329ec
  - path: dk/statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-2.yaml
    module_id: dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-2
    sha256: ad5f521bb7ce30b39c555768f6adf76738a545d450896c70941158a31ba50036
    source_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-2
    rule_count: 13
    summary: 'Retten til børne- og ungeydelse afhænger af § 2, stk. 1''s betingelser. Når ingen

      person med forsørgelsespligt opfylder seksårskravet, følger den forholdsmæssige

      andel den højeste bopæls- eller beskæftigelsesoptjening blandt disse personer

      inden for de seneste 10 år. Kortvarige og bestemte uddannelsesophold i udlandet

      kan opfylde opholdsbetingelsen, undtagen ved ulovligt skolefravær for

      undervisningspligtige børn.'
    source_sha256: 5932ffa55798c79a1f656ab11032a06533fd32d6f0852e86305bff68d1c3a0d5
  - path: dk/statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-3.yaml
