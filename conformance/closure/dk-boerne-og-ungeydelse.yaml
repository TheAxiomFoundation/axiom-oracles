    heading: § 10.
    body_sha256: 297c681b3662e43d91b6458ac54e413b1df91755fd0b233e663eb882fd0ae01c
    status: excluded-with-reason
    classification: cross_program_treatment
    reason: § 10 directs OTHER schemes — social legislation and uddannelsesstøtte — to disregard the børne-
      og ungeydelse in their own calculations; it changes no computation under this Act, and its cross-program
      effect belongs to those schemes' encodings (noted for the boundary frontier).
  - ordinal: 20
    citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-11
    heading: § 11.
    body_sha256: 80ce0e32afb078343db79a08a6be9948cbe750fbc49eb1ec408e5ab0070e4089
    status: excluded-with-reason
    classification: collections_enforcement
    reason: § 11 shields the benefit from assignment and creditor execution and authorizes setoff (modregning)
      of enumerated daycare, club-scheme, and school-care arrears against the amount paid out; it is collections
      machinery operating on disbursement of an entitlement the §§ 1–5 rules already fix, and alters no
      entitlement computation.
  - ordinal: 21
    citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-12
    heading: § 12.
