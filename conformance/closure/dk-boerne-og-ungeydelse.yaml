    rule_count: 6
    summary: Den samlede børne- og ungeydelse nedsættes med 2 pct. af indtægtsgrundlaget over et bundfradrag
      på 700.000 kr. (2010-niveau). § 1 a, stk. 1 og 2, har virkning for grundlaget for mellemskat fra
      indkomståret 2026; den hidtidige affattelse anvendte grundlaget for topskat. Ydelsesmodtagerens
      kvalificerende pensionsindbetalinger fradrages efter begrænsning til grundbeløbet og omregning til
      bruttobeløb ved division med 0,6. Bundfradraget reguleres efter personskattelovens § 20 (stk. 3);
      da personskatteloven ikke er en indfanget kilde, leveres det regulerede beløb som input (current_year_income_reduction_allowance),
      mens 2010-niveau-grundbeløbet står som den dokumenterede statutoriske base.
    source_sha256: 6ecaf404a44f4f898915c545fe41b2a09fd6f3028063a22a68f99029df119c2b
