    sha256: 341c370127f3d8a6b74b93093e39fa086c1e5fa57a833ccf1a5699bf8160994a
    source_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven
    rule_count: 4
    summary: 'Composed per-recipient annual børne- og ungeydelse for a couple with

      fælles forældremyndighed: the § 4, stk. 1 ligedeling (half of the § 1

      age-band amount to each forældremyndighedsindehaver, the half rounded

      upward to the nearest whole krone), less the § 1 a reduction computed on

      the recipient''s OWN income basis — the per-recipient taper in force

      since 2022 (»grundlaget … hos modtageren af ydelsen«). Each Person row

      is one recipient; a household total is the sum over the two recipients.


      The half is the half of each PAYMENT: § 5, stk. 3-4 pay børneydelsen

      kvartalsvis and ungeydelsen månedsvis, and § 4, stk. 1, 2. pkt. rounds

      »Den halve ydelse« upward per payment — so the per-recipient annual

      share is 4 x the rounded-up half quarter for the child bands and 12 x

      the rounded-up half month for the youth band (the annual amounts are

      always even, so annual-level rounding would be dead code; the quarterly

      and monthly amounts can be odd).


      Scope: the § 4, stk. 1, 1. pkt. DEFAULT for two holders with fælles

      forældremyndighed (»som udgangspunkt« per the ministry''s ligedeling

      guidance). The stk. 1, 3. pkt. full-payment route (only one holder

      fully tax-liable), the stk. 2/10 single-recipient routes, and the

      stk. 4-8 institutional/foster/EU routings are outside this identity —

      § 4 itself is recorded as entity_not_supported.


      This is the graded surface for the EUROMOD spousal-taper divergence

      (ec-jrc#18): EUROMOD DK_2022–DK_2025 still applies the pre-2022 spousal

      income test, so couple cases diverge from this identity by construction.

      The bundfradrag is a module input (current_year_income_reduction_allowance)

      for the same reason as the single-recipient capstone: § 1 a, stk. 3

      regulates it by personskattelovens § 20, which is not a captured scope.'
