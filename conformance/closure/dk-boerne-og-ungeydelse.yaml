    summary: '»Betingelserne i §§ 1 og 2 skal være opfyldt den første dag i den periode,

      som den enkelte udbetaling vedrører.« De to § 1- og § 2-betingelser er

      case-supplied composite condition facts assessed for that first day.'
    source_sha256: df5122c4610e6b456542213b9fd5adb2854a906c7b0c64638b0826832bd0bbcb
  - path: dk/statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-a.yaml
    module_id: dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-a
    sha256: 8d366af5b90a92340bce1f2e96c18d2b9e1f656f90a075acc02af24609fc6f38
    source_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-a
    rule_count: 8
    summary: Udbetaling ophører ved politiets pasinddragelse efter paslovens § 2, stk. 1, nr. 4. Børneydelse
      ophører fra næste kvartal og ungeydelse fra næste måned. Ydelsen omdirigeres til den person, barnet
      bor hos, eller efter Udbetaling Danmarks skøn til barnet. Omgørelse eller ophævelse giver ikke efterbetaling.
      Fornyet udbetaling kræver dokumenteret fremmøde hos politiet.
    source_sha256: 07c8c623bc87641d3df36a0eb1b53f3c88138f04fe4d423f0090ff5af03d9850
  - path: dk/statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-b.yaml
    module_id: dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-b
    sha256: 2a8a8858a1fc82972b22cc46d9cb96c7342dbe0a64be15f14a6a8daecc09d755
    source_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-b
    rule_count: 5
    summary: »Udbetaling af børne- og ungeydelse ophører, hvis politiet træffer afgørelse om pasinddragelse
      mod barnet« efter paslovens § 2, stk. 1, nr. 4. Børneydelse ophører fra det følgende kvartal og
      ungeydelse fra den følgende måned. Ved omgjort eller domstolsophævet afgørelse efterbetales den
      ikke-udbetalte ydelse, hvis de øvrige betingelser var opfyldt. Fornyet udbetaling kræver dokumenteret
      tilstedeværelse i Danmark ved fremmøde hos politiet.
    source_sha256: 8d5cb1008f3004081a7666335b9e726c1a6898e337058c51aa9907b32ddcb563
  - path: dk/statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-c.yaml
    module_id: dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-c
    sha256: 6f038f049d7aad7abae28fe21465db6b95683c09a5000b9e720ad973f5673db9
    source_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-c
    rule_count: 6
    summary: 'Der skal ske tilbagebetaling af børne- og ungeydelse udbetalt for en periode,

      hvor ydelsesmodtageren eller barnet ved endelig dom findes at have overtrådt

      de nævnte bestemmelser. Efter faktisk tilbagebetaling efter stk. 1, 1. pkt.,

      udbetales ydelsen for perioden til den person, barnet bor hos, med mulighed

      for udbetaling til barnet selv, hvis det skønnes bedst for barnet.'
    source_sha256: aa92cab270b97deb9ef7df92dc2f1eb7bdb4a3702d3b152424f17b237bb7f5ae
  - path: dk/statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-e.yaml
    module_id: dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-e
    sha256: 3a4caee129110342b4a57dde0349ff050af3927b84a1f82ef10b271a403ae2f7
    source_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-e
    rule_count: 10
    summary: § 4 e finder ikke anvendelse for domme om forhold begået inden 1. juli 2024. Ved endelig
      dom for en overtrædelse omfattet af straffelovens § 81 a ophører børne- og ungeydelsen i tre år
      efter udstået frihedsberøvende straf. Børneydelse ophører fra følgende kvartal og ungeydelse fra
      følgende måned. Stk. 2-4 regulerer omdirigering, tilbagebetaling og genoptagelse.
    source_sha256: f66738bfa034420caf74713a762e4fafa78ba44d1274ebe6c7efb363926f50dd
  - path: dk/statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4.yaml
    module_id: dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4
    sha256: cd56d5aafe7567345548d96b38220309d92c008b2499a69ac725329c0a1c0941
    source_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4
    rule_count: 0
    summary: »For forældremyndighedsindehavere med fælles forældremyndighed over barnet udbetales børne-
      og ungeydelsen med halvdelen til hver af forældremyndighedsindehaverne, jf. dog stk. 10.« Bestemmelsen
      regulerer modtagerfordeling (ligedeling, dokumentationsveje, eneforældremyndighed), udbetaling ved
      indsættelse i institution under Kriminalforsorgen, privat familiepleje, EU-koordinering (forordning
      883/2004) og virkningstidspunkter for udbetaling. Recipient-routing mellem personer — ikke personberegnelig
      ret; stk. 1's ligedelingsaritmetik er kodet i composed/boerne-og-ungeydelse-couple-pipeline med
      atomer mod denne bestemmelse.
    source_sha256: 44deab260674b39512464482bb62975c2c3d130bc3e8c4710dd8631b5a2f5ca1
    status: entity_not_supported
  - path: dk/statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-5.yaml
    module_id: dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-5
    sha256: f8aee8919a6cb9ea560ed3f3996995447ce561be11824715cd680eee80051cbb
    source_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-5
    rule_count: 15
    summary: »Børneydelsen udbetales kvartalsvis den seneste hverdag, dog undtaget lørdag, forud for den
      21. i kvartalets første måned.« Ungeydelsen udbetales månedsvis. Bestemmelsen fastsætter første
      og sidste udbetaling, forholdsmæssige ydelser ved det fyldte 15. og 18. år med afrunding til hele
      kroner samt tilbagebetaling ved mod bedre vidende uberettiget modtagelse.
    source_sha256: 6bfe19e2ed661875e80a85edf7bb20e9d0bad6d5275e4ea1b4b11f7868bd0e6d
  - path: dk/statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-8-a.yaml
    module_id: dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-8-a
    sha256: 83154da475bea98d429a8218006cd9ec5c712db02442a309b8fa1c39fa8f7b6a
    source_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-8-a
    rule_count: 15
    summary: 'Ved hver kvartals- eller månedsudbetaling lægges alene den seneste

      forskudsopgørelse til grund for foreløbig nedsættelse. Endelig nedsættelse

      og efterfølgende regulering fastsættes efter årsopgørelsen; regulering sker

      så vidt muligt ved modregning eller tillæg til efterfølgende udbetalinger.

      Nedsættelse og regulering kan ske uden partshøring.'
    source_sha256: 9b411b66e51e65e70e779aa2e2cbb5105cc0a3095b3e4c2f603e6e9d3e20af6e
