committed_decisions:
  provisions:
  - citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-d
    status: excluded-with-reason
    classification: administration_only
    reason: § 4 d imposes notification duties on the police and prosecution service; it does not determine
      entitlement, recipient choice, or the amount paid under this program.
  - citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-6
    status: excluded-with-reason
    classification: appeals_procedure
    reason: § 6 identifies Ankestyrelsen as the appeal body and supplies no entitlement or amount rule.
  - citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-6-a
    status: excluded-with-reason
    classification: repealed
    reason: The complete operative text of § 6 a is “(Ophævet)”; it contains no current rule to execute.
  - citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-7
    status: excluded-with-reason
    classification: criminal_penalty
    reason: § 7 creates criminal penalties for false or withheld information, not a household benefit
      entitlement or amount rule.
  - citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-8
    status: excluded-with-reason
    classification: administration_only
    reason: § 8 empowers the minister to require institutions to report a child's unexplained absence
      and directs Udbetaling Danmark to obtain a parental declaration about the child's whereabouts (with
      a 14-day default to decide on the available record); it is information-gathering procedure feeding
      the § 2, stk. 1, nr. 2 residence determination and states no entitlement or amount rule itself.
  - citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-8-b
    status: excluded-with-reason
    classification: evidence_designation
    reason: '§ 8 b designates which register''s custody records evidence the § 4 payment split: CPR exclusively
      for children born on or after 1 July 2004, except where the child lacks a CPR personnummer; Udbetaling
      Danmark''s own records for earlier cohorts. It selects the proof source for facts the § 4 rules
      consume and states no entitlement or amount rule (same family as the excluded § 4 d notification
      duties).'
  - citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-9
    status: excluded-with-reason
    classification: public_finance
    reason: § 9 assigns program expenditure to the state treasury and does not vary any household's entitlement
      or payment.
  - citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-10
    status: excluded-with-reason
    classification: cross_program_treatment
    reason: § 10 directs OTHER schemes — social legislation and uddannelsesstøtte — to disregard the børne-
      og ungeydelse in their own calculations; it changes no computation under this Act, and its cross-program
      effect belongs to those schemes' encodings (noted for the boundary frontier).
  - citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-11
    status: excluded-with-reason
    classification: collections_enforcement
    reason: § 11 shields the benefit from assignment and creditor execution and authorizes setoff (modregning)
      of enumerated daycare, club-scheme, and school-care arrears against the amount paid out; it is collections
      machinery operating on disbursement of an entitlement the §§ 1–5 rules already fix, and alters no
      entitlement computation.
  - citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-12
    status: excluded-with-reason
    classification: delegated_administration
    reason: § 12 delegates power to make administrative and collection regulations; the section itself
      supplies no executable entitlement or amount rule, and any implementing instrument is a separate
      corpus scope.
  - citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-13
    status: excluded-with-reason
    classification: delegated_coordination
    reason: § 13 delegates power to make rules for international obligations and residence/employment
      documentation; it does not itself state the resulting exception or calculation, and recipient/EU
      coordination is outside the supported person-calculation entity surface recorded for § 4.
  - citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-14
    status: excluded-with-reason
    classification: commencement
    reason: § 14 only records the Act's historical commencement on 1 July 1987 and adds no current award
      variation.
  - citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-15
    status: excluded-with-reason
    classification: territorial_scope
    reason: § 15 is the territorial application clause — the Act does not extend to the Faroe Islands
      and Greenland; a scope provision parallel to the excluded commencement clause (§ 14), stating where
      the Act applies rather than any rule within it.
