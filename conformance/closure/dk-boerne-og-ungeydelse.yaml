      status: classified-with-reason
      classification: input_derivation_rule
      reason: 'Bekendtgørelse om børne- og ungeydelsen, issued under §§ 8(1), 12 and 13; all four pages
        read (2026-08-19/20), chapter-scoped: Kapitel 1 and §§ 14-15 (optjening construction — 30 CPR-days
        per accrual month, 39/80 employment hours, income-register computation, missing-persons and death-of-holder
        counting, omberegning) and Kapitel 3 §§ 19-22 and 24 (SKAT-to-Udbetaling Danmark income feeds
        and the provisional/final reduction calculation and regulation cadence, applied before other setoff)
        govern the derivation of the case-supplied § 2 and § 8 a inputs under their documented contracts.
        Kapitel 2 §§ 16-18 (condition waivers for convention-covered persons and the § 18 entitlement
        bar) and § 23 (no collection of final-regulation debt after the child''s death) BEAR ON ENCODED
        SURFACES beyond input derivation: the § 2 formula has no coordination waiver/bar input and the
        § 8 a collectible-residue outputs carry no death guard — both are therefore expressly non-claimed
        in the certificate scope (convention-covered entitlement; post-death collectibility), with encoding
        them as the named path to closing the non-claims. Kapitel 4-5 (institution/school reporting, recipient
        notification duties) are administrative reporting with no bearing on computed outputs.'
      bearing: § 2 and § 8 a case-supplied input contracts; §§ 16-18 and § 23 drive certificate non-claims
        (convention entitlement; post-death collection)
