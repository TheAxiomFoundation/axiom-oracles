    source_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-2
    rule_count: 13
    summary: 'Retten til børne- og ungeydelse er betinget af stk. 1''s ti betingelser.

      Når seksårsperioden ikke er opfyldt, udbetales den højeste relevante

      forholdsmæssige andel i stk. 2. Kortvarigt udlandsophold eller et

      uddannelsesophold kan opfylde opholdsbetingelsen, dog ikke ved ulovligt

      skolefravær for undervisningspligtige børn.'
    source_sha256: 5932ffa55798c79a1f656ab11032a06533fd32d6f0852e86305bff68d1c3a0d5
  - path: dk/statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-3.yaml
