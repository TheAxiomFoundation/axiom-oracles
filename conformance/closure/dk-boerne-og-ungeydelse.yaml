    status: excluded-with-reason
    classification: delegated_administration
    reason: § 12 delegates power to make administrative and collection regulations; the section itself
      supplies no executable entitlement or amount rule, and any implementing instrument is a separate
      corpus scope.
  - ordinal: 22
    citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-13
    heading: § 13.
