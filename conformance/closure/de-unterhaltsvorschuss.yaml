      reason: Official BT-Drs.20/12778 title and page64 excerpt is receipted in corpus release de-rulespec-2026-09-09-kindergeld-allowance-context at 4dece7ae257ccdda46d9e5f4589834d8a397c1d3. The operative explanatory child de/guidance/bt-drs-20-12778/kindergeld-explanation/document-1 has body SHA-256 9b2464369b118c536e8a09a0ab66a4b3f6be27b2e0b2d8fd52b113f6cf71964a. It explains that both child allowances under EStG32(6)S1 form the proportional Kindergeld adjustment and that EStG66(1) continues to state the fixed amount. This bears on the unencoded EStG66(3) calculation and, indirectly, Kindergeld amounts used by UhVorschG2. It is a draft legislative memorandum, not enacted law; draft article numbering does not set final commencement or amounts. Final amounts and dates must bind BGBl2024I449. The container is enrolled through this exact child; capture alone does not encode the explanation. Await EStG32 allowance history and EStG66 proportional adjustment rules.
