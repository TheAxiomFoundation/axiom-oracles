# axiom_oracles.conformance.v1 — GENERATED universe facts + committed scope decisions.
# Rows (policy id, oracle_policy_name, output_vars) are regenerated from the oracle
# model spine by scripts/generate_conformance_universe.py — do NOT hand-edit those.
# in_scope / exclusion_reason / suite / note ARE hand-authored decisions the generator
# preserves; edit those here. CI fails if the generated facts drift from the model.
schema: axiom_oracles.conformance.v1
jurisdiction: us-pe
