      2021 sec. 60502) stopped new enrollments 2024-02-07 and paid its last partial benefit for May 2024
      as appropriated funds were exhausted. PolicyEngine-US 1.767.3 zeroes gov.fcc.acp.amount for 2026,
      so acp pays 0 for every synthetic case even with is_acp_eligible forced on and broadband_cost 2400
      (probe evidence: scripts/probe_us_repealed_federal.py). Axiom encodes current law and has no current-law
