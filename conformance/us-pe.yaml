    note: >-
      The us-savers-grid suite compares Axiom's pre-section-26 section 25B
      amount with its reviewed direct PE-US target, savers_credit_potential, on
      34 fixture-bound tax-year-2026 cases. It does not compare PE's
      liability-limited public credit. The grid covers all five filing
      statuses, every exact Notice 2025-67 tier ceiling plus B-1 and B+1,
      per-person contribution caps, the section 25B(e) section 911 add-back,
