  - id: us-pe:aca_ptc
    oracle_policy_name: aca_ptc
    oracle_policy_type: rules
    output_vars:
      - aca_ptc
    in_scope: true
    suite: us-aca-ptc-grid
    note: 'The us-aca-ptc-grid suite compares six full-year 2026 IRC 36B cases.
      It binds PE-US used_aca_ptc rather than raw aca_ptc so the compared
      boundary includes the enrolled-plan premium cap present in Axiom. The
      committed report is 6/6 within one cent and includes nonzero cases.'
  - id: us-pe:acp
    oracle_policy_name: acp
    oracle_policy_type: rules
    output_vars:
      - acp
    in_scope: false
    exclusion_reason: oracle_models_repealed_law
    note: 'Lapsed before the 2026 validation year: the Affordable Connectivity Program
      (47 USC 1752; IIJA 2021 sec. 60502) stopped new enrollments 2024-02-07 and paid
      its last partial benefit for May 2024 as appropriated funds were exhausted. PolicyEngine-US
      1.767.3 zeroes gov.fcc.acp.amount for 2026, so acp pays 0 for every synthetic case
      even with is_acp_eligible forced on and broadband_cost 2400 (probe evidence: scripts/probe_us_repealed_federal.py).
      Axiom encodes current law and has no current-law ACP surface to compare.'
